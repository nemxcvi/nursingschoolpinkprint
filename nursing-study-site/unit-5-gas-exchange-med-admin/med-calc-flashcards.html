<script>
var CATS = {
  round: {label:"Rounding & Labels", hue:"orange"},
  conv: {label:"Conversions", hue:"green"},
  dose: {label:"Solid & Liquid Doses", hue:"blue"},
  wt: {label:"Weight & Divided Doses", hue:"violet"},
  safe: {label:"Safe Doses", hue:"red"},
  iv: {label:"IV Rates", hue:"aqua"}
};
var CARDS = [
[1, "round", "Dose less than 1: round to?", "The nearest hundredth (0.746 → 0.75)"],
[2, "round", "Dose greater than 1: round to?", "The nearest tenth (1.38 → 1.4)"],
[3, "round", "Digit to the right is 5 or more", "Round up (1.25 → 1.3)"],
[4, "round", "Digit to the right is less than 5", "Leave the number alone (0.023 → 0.02)"],
[5, "round", "Leading zero", "Always: 0.5, never .5"],
[6, "round", "Trailing zero", "Never: 5, never 5.0"],
[7, "round", "When to round", "Only at the end, unless the question says to round a step (such as the weight)"],
[8, "round", "Who decides where to round on a test?", "The question: it always tells you what to round to"],
[9, "round", "First question when reading a label", "What is my available? The dosage strength (such as 350 mg/5 mL)"],
[10, "round", "Parts of a label", "Brand and generic name, dosage strength, form, route, expiration date, lot number, bar code, manufacturer, directions, storage"],
[11, "round", "Ratio and proportion", "Have ÷ Quantity = Desired ÷ X"],
[12, "round", "Desired over have", "X = Desired ÷ Have × Quantity"],
[13, "round", "An answer like 8 tablets", "Recheck the math and units, and have another nurse check, before giving it"],
[14, "conv", "1 lb = ? oz", "16 oz"],
[15, "conv", "1 kg = ? lb", "2.2 lb"],
[16, "conv", "lb to kg", "Divide by 2.2 (the kg number is always smaller)"],
[17, "conv", "kg to lb", "Multiply by 2.2"],
[18, "conv", "Pounds and ounces to kg", "Ounces ÷ 16 first, add to the pounds, then ÷ 2.2"],
[19, "conv", "10 lb 3 oz in pounds (nearest tenth)", "3 ÷ 16 = 0.1875 → 10.1875 → 10.2 lb"],
[20, "conv", "50 lb 7 oz in kg (nearest tenth)", "50.4375 ÷ 2.2 = 22.926 → 22.9 kg"],
[21, "conv", "75.4 kg in lb (nearest tenth)", "75.4 × 2.2 = 165.88 → 165.9 lb"],
[22, "conv", "1 g = ? mg", "1,000 mg"],
[23, "conv", "1 mg = ? mcg", "1,000 mcg"],
[24, "conv", "1 L = ? mL", "1,000 mL"],
[25, "conv", "Bigger unit to smaller", "Multiply (g → mg: × 1,000)"],
[26, "conv", "Smaller unit to bigger", "Divide (mcg → mg: ÷ 1,000)"],
[27, "conv", "500 mg = ? mcg", "500,000 mcg"],
[28, "conv", "1 tsp = ? mL", "5 mL"],
[29, "conv", "1 Tbsp = ? mL", "15 mL (3 tsp)"],
[30, "conv", "1 oz = ? mL", "30 mL"],
[31, "conv", "3 Tbsp = ? mL", "45 mL"],
[32, "dose", "Ketorolac 30 mg ordered; 15 mg tablets", "2 tablets"],
[33, "dose", "Amoxicillin 400 mg ordered; 200 mg/5 mL", "400 ÷ 200 × 5 = 10 mL"],
[34, "dose", "Phenytoin 0.2 g ordered; 100 mg capsules", "0.2 g = 200 mg → 2 capsules"],
[35, "dose", "Heparin 8,000 units ordered; 10,000 units/mL", "0.8 mL"],
[36, "dose", "Units don't match (g vs mg)", "Convert first so the desired and the have are in the same unit"],
[37, "dose", "Measuring a liquid in a medicine cup", "Cup on a flat surface at eye level; read the bottom of the meniscus"],
[38, "dose", "Doses under 5 mL", "Use an oral syringe (or calibrated dropper or spoon), not a medicine cup"],
[39, "wt", "Dosage by weight", "Weight in kg × the dose per kg"],
[40, "wt", "Drugs often dosed by weight", "Enoxaparin, vancomycin, amoxicillin (and many children's doses)"],
[41, "wt", "Why dose by weight?", "So the client gets the right dose for their size and doesn't become toxic"],
[42, "wt", "Enoxaparin 1.5 mg/kg; 155 lb", "155 ÷ 2.2 = 70.45 kg × 1.5 = 105.68 → 106 mg"],
[43, "wt", "Divided dose steps", "Find the total for 24 hours, then divide by the number of doses a day"],
[44, "wt", "Doses a day: every 6 hr / 8 hr / 12 hr", "4 / 3 / 2 (24 ÷ the hours)"],
[45, "wt", "Vancomycin 40 mg/kg/day in 3 doses; 86 kg", "3,440 mg/day → 1,147 mg per dose"],
[46, "wt", "Enoxaparin 1.5 mg/kg/day BID; 200 lb", "136 mg/day → 68 mg per dose"],
[47, "wt", "Admission weight", "Some doses use the weight on admission; if unsure which weight the provider used, ask"],
[48, "safe", "Checking a safe dose", "Look up the range, convert weight to kg, multiply by the low and high ends, compare in the same terms (per dose or per day)"],
[49, "safe", "Ordered dose above the safe range", "Unsafe: hold it and contact the provider"],
[50, "safe", "Ordered dose below the range", "May not work (nontherapeutic): check with the provider"],
[51, "safe", "Cefaclor 250–500 mg every 8 hr: daily range", "750–1,500 mg/day"],
[52, "safe", "Ketorolac 30 mg q4h (max 120 mg/day)", "Up to 6 doses = 180 mg/day: not safe"],
[53, "safe", "7.5–15 mg/kg/dose for 23 kg; 350 mg ordered", "Range 172.5–345 mg: 350 mg is not safe"],
[54, "iv", "Pump rate formula", "mL/hr = volume (mL) ÷ time (hr)"],
[55, "iv", "Pump time in minutes", "mL ÷ minutes × 60 (100 mL over 45 min = 133 mL/hr)"],
[56, "iv", "Manual rate formula", "gtt/min = volume (mL) × drop factor (gtt/mL) ÷ time (min)"],
[57, "iv", "Drop factor", "Drops per mL; printed on the IV tubing package"],
[58, "iv", "LR 1,500 mL over 10 hr; 15 gtt/mL", "1,500 × 15 ÷ 600 = 37.5 → 38 gtt/min"],
[59, "iv", "gtt/min answers", "Always a whole number (you can't count part of a drop)"],
[60, "iv", "Continuous infusion by units/kg/hr", "kg × units/kg/hr = units/hr; then units/hr ÷ units per mL = mL/hr"],
[61, "iv", "Heparin 10 units/kg/hr; 150 lb; 2,500 units/100 mL", "68.18 kg → 681.8 units/hr ÷ 25 units/mL = 27 mL/hr"],
[62, "iv", "Concentration of a bag", "Total drug ÷ total mL (25,000 units ÷ 500 mL = 50 units/mL)"]
];
initFlashcards(CATS, CARDS);
</script>
