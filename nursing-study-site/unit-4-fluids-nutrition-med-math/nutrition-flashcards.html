[69, "diets", "High-fiber diet", "Whole grains, fruits"],
[70, "diets", "Low-residue diet", "Easy to digest, low in fiber"],

[78, "eating", "Positioning to prevent aspiration", "Upright in a chair, or head of bed 90° to eat; at least 45° for 1 hour after"],
[79, "eating", "Straws and aspiration risk", "Avoid straws"],
[80, "eating", "After a meal, check for", "Pocketed food in the mouth"],
[81, "eating", "Chin-tuck", "Chin to chest while swallowing; narrows the airway entrance"],
[82, "eating", "Who evaluates swallowing?", "Speech therapy; may order diet changes or thickened liquids"],

[85, "eating", "Sedatives and meals", "Avoid sedatives and hypnotics before meals; monitor LOC (level of consciousness)"],
