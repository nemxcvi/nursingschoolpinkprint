<script>
var CATS = {
  solutions: {label:"IV Solutions", hue:"aqua"},
  access: {label:"Access Devices", hue:"blue"},
  complications: {label:"IV Complications", hue:"red"},
  blood: {label:"Blood Transfusions", hue:"magenta"}
};
var CARDS = [
[1, "solutions", "Colloid solutions", "IV (intravenous) solutions with large molecules that can't pass through capillary membranes, so they stay in the vessels. Also called plasma or volume expanders"],
[2, "solutions", "Crystalloid solutions", "Contain small particles that pass easily from the bloodstream into cells and tissues; grouped by tonicity"],
[3, "solutions", "Tonicity", "A solution's ability to make water move in or out of cells by osmosis"],
[4, "solutions", "Isotonic solution", "Same osmolality as body fluid; no fluid shift, no change inside cells. Expands ECF (extracellular fluid) volume"],
[5, "solutions", "Isotonic: when used", "Increase or maintain ECF volume; treat hypovolemia from dehydration or bleeding"],
[6, "solutions", "Isotonic examples", "0.9% normal saline, lactated Ringer's"],
[7, "solutions", "Hypotonic solution", "Lower osmolality than blood; water moves into the cells, which can swell"],
[8, "solutions", "Hypotonic: when used", "To correct high serum electrolyte levels (such as hypernatremia)"],
[9, "solutions", "Hypotonic examples", "0.33% normal saline, 0.45% normal saline"],
[10, "solutions", "Hypertonic solution", "Higher osmolality than blood; pulls water out of the cells into the vessels, so cells can shrink"],
[11, "solutions", "Hypertonic: when used", "To treat low serum electrolyte levels and hypoglycemia"],
[12, "solutions", "Hypertonic examples", "D5NS (dextrose 5% in normal saline), 3% and 5% sodium chloride, D10W (dextrose 10%), D5LR (dextrose 5% in lactated Ringer's)"],
[13, "solutions", "Which IV fluid makes cells swell?", "Hypotonic"],
[14, "solutions", "Which IV fluid makes cells shrink?", "Hypertonic"],
[15, "solutions", "Only IV fluid that runs with blood", "0.9% normal saline"],
[16, "access", "Types of vascular access devices", "Peripheral venous catheter, midline catheter, and CVADs (central venous access devices): PICC (peripherally inserted central catheter), central venous catheter, implanted port"],
[17, "access", "Peripheral IV catheter", "Single-lumen plastic catheter in a peripheral vein: hands, wrist, forearm, antecubital fossa"],
[18, "access", "Peripheral IV sizes", "14 to 24 gauge. The bigger the number, the narrower the catheter"],
[19, "access", "Gauge for trauma, surgery, rapid fluids or blood", "Large bore: 16–18 gauge (18–20 for blood transfusions)"],
[20, "access", "How often is a peripheral IV site changed?", "Every 96 hours (facility policy)"],
[21, "access", "IV tubing: continuous infusion", "Change every 96 hours"],
[22, "access", "IV tubing: intermittent infusion", "Change every 24 hours"],
[23, "access", "CVAD", "Indwelling device in a large central vein for blood, medications, fluids and other therapy; for frequent or long-term IV therapy. Types: tunneled, nontunneled, peripherally inserted, implanted port"],
[24, "access", "CVAD dressing change", "Every 7 days"],
[25, "access", "Curos caps", "Disinfecting caps that cover CVAD ports when not in use"],
[26, "access", "Insertion angle for a peripheral IV", "10–30°, bevel up"],
[27, "access", "Hair at the IV site", "Clip it; never shave (abrasions raise infection risk)"],
[28, "access", "Fragile veins or anticoagulants", "Use a BP (blood pressure) cuff instead of a tourniquet, a smaller catheter, and gentle cleaning"],
[29, "complications", "Four common IV complications", "Phlebitis or thrombophlebitis, circulatory overload, infiltration or extravasation, VAD (vascular access device)-related infection"],
[30, "complications", "PIE", "Phlebitis (inflamed vein), Infiltration (leak of IV fluid or meds into tissue), Extravasation (leak of a vesicant into tissue)"],
[31, "complications", "Phlebitis", "Inflammation of the vein: warm, red, painful; red streak or palpable cord"],
[32, "complications", "Thrombophlebitis", "Phlebitis caused by or with a thrombus (clot)"],
[33, "complications", "Phlebitis: nursing actions", "Stop the infusion and remove the catheter, elevate, warm compress, restart in the other arm"],
[34, "complications", "Infiltration", "Non-vesicant IV fluid leaks into tissue: cool, pale, swollen; slowed infusion"],
[35, "complications", "Extravasation", "A vesicant (tissue-damaging drug) leaks into tissue"],
[36, "complications", "Infiltration vs phlebitis: skin temperature", "Infiltration is cool; phlebitis is warm"],
[37, "complications", "Extravasation: first actions", "Stop the infusion, aspirate from the catheter (don't flush), notify the provider"],
[38, "complications", "Circulatory overload signs", "High BP, tachycardia, crackles, shortness of breath, distended neck veins"],
[39, "complications", "Circulatory overload: nursing actions", "Slow the IV, raise the head of the bed, check vital signs and oxygen, notify the provider"],
[40, "complications", "IV site infection signs", "Redness, swelling, pus, fever"],
[41, "blood", "Whole blood", "White blood cells, red blood cells and platelets in plasma; used for trauma and surgery with major blood loss"],
[42, "blood", "PRBCs (packed red blood cells)", "Red cells with the plasma removed; restore blood levels without adding much volume"],
[43, "blood", "Plasma", "The liquid part of blood that carries the cells"],
[44, "blood", "Platelets", "Thrombocytes; stop or prevent bleeding. Used in organ transplants, cancer treatment and surgery"],
[45, "blood", "Universal donor", "O negative"],
[46, "blood", "Universal recipient", "AB positive"],
[47, "blood", "When do most transfusion reactions happen?", "In the first 15 minutes; stay with the client"],
[48, "blood", "Transfusion time limit", "Finish within 4 hours"],
[49, "blood", "Transfusion reaction: first action", "Stop the transfusion; keep the vein open with normal saline through new tubing; notify the provider"],
[50, "blood", "Signs of a transfusion reaction", "Fever, chills, back or chest pain, hives, wheezing or dyspnea, low BP, red urine"]
];
initFlashcards(CATS, CARDS);
