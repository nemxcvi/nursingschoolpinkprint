  parenteral: {label:"Parenteral Nutrition", hue:"red"}
};
var CARDS = [
[1, "tubes", "Enteral nutrition", "Nutrients given directly into the GI (gastrointestinal) tract through a tube; total or supplemental, short or long term"],
[2, "tubes", "Short-term feeding tubes", "Nasogastric, nasoduodenal, nasojejunal"],
[3, "tubes", "Long-term feeding tube", "Gastrostomy tube (G-tube)"],
[4, "tubes", "NG (nasogastric) tube", "A thin plastic tube from the nostril down the esophagus, with the end in the stomach"],
[5, "tubes", "Nasoduodenal tube", "From the nostril past the stomach, tip in the duodenum"],
[6, "tubes", "Nasojejunal tube", "Thin, soft tube from the nostril through the stomach, ending in the jejunum"],
[7, "tubes", "G-tube", "Delivers nutrition directly into the stomach through the abdominal wall"],
[8, "tubes", "PEG tube", "Percutaneous endoscopic gastrostomy: the most common way to place a G-tube"],
[9, "tubes", "How long can a nasal feeding tube stay?", "Short-term, under about 4 weeks"],
[10, "tubes", "Large-bore vs small-bore tubes", "Large-bore (12–18 French): suction, lavage, decompression. Small-bore (8–12 French): feeding"],
[11, "placement", "When to verify tube placement", "After insertion, before every feeding or medication, and regularly during continuous feeds"],
[12, "placement", "Gold standard for placement", "X-ray, before the first feeding or medication"],
[13, "placement", "Other placement checks", "Tube length and marking at the nares, aspirate pH, appearance of aspirate"],
[14, "placement", "Air to clear the tube before aspirating", "30 mL"],
[15, "placement", "Gastric residual less than 100 mL", "Return it to the stomach"],
[16, "placement", "Gastric aspirate pH", "About 1–4 (Week 8 slides); the ATI NG chapter accepts 5.5 or less"],
[17, "placement", "Aspirate pH 7 or higher", "Likely intestinal (or respiratory) placement, not the stomach"],
[18, "placement", "Flush after checking placement", "30 mL of water"],
[19, "placement", "Flush with medications", "30 mL of water before and after"],
[20, "placement", "Why not listen over the stomach while pushing air?", "Unreliable: you can hear air even if the tube is in the lung"],
[21, "placement", "CO2 detected at the tube", "The tube is in the airway; remove it"],
[22, "placement", "Feeding tube when not in use", "Cap or clamp it"],

[25, "feedings", "Head of bed during tube feeding", "30–45°"],
[26, "feedings", "Head of bed after a tube feeding", "At least 30° for 1 hour"],
[27, "feedings", "Signs of feeding intolerance", "Gastric distention, abdominal discomfort, nausea, vomiting, diarrhea, reflux"],
[28, "feedings", "Feeding system and tubing change", "Every 24 hours"],
[29, "feedings", "Complications of enteral feedings", "Aspiration, clogged tube, nasal erosion or pressure injury, diarrhea, nausea and vomiting, dislodgement, G-tube site infection"],
[30, "feedings", "Preventing a clogged tube", "Crush medications thoroughly and flush with water"],
[31, "feedings", "How much formula to hang at once", "Only enough for 4 hours (prevents bacterial growth)"],
[32, "feedings", "Formula temperature", "Room temperature"],
[33, "feedings", "Checking residuals", "Every 4–6 hours for tubes in the stomach; 50–60 mL syringe on small-bore tubes"],
[34, "feedings", "Diarrhea with tube feeding", "Confirm it's true diarrhea; ask the provider about slowing or diluting the formula or adding fiber"],
[35, "ng", "Position for NG insertion", "High-Fowler's"],
[36, "ng", "Measuring an NG tube", "Tip of the nose → earlobe → xiphoid process"],
[37, "ng", "Lubricant for NG tubes and nares", "Water-soluble (never petroleum jelly; it can cause lipid pneumonia if aspirated)"],
[38, "ng", "Helping the tube pass", "Head tilted forward (chin down) and sips of water as you advance"],
[39, "ng", "Stop advancing the NG tube if", "Respiratory distress, unable to speak, heavy nosebleed, or resistance"],

[42, "ng", "Suction for a single-lumen (Levin) tube", "Low intermittent suction, to protect the stomach lining"],
[43, "ng", "Blue air vent on a double-lumen sump tube", "Never clamp it, connect it to suction, or irrigate through it; keep it above the stomach"],
[44, "ng", "Irrigating an NG tube", "20–30 mL of normal saline or water; record it as intake"],
[45, "ng", "Risk of heavy NG drainage", "Fluid volume deficit and electrolyte loss (metabolic alkalosis)"],
[46, "ng", "Removing an NG tube", "Flush with air or saline, have the client take a deep breath and hold it, pinch and withdraw steadily, then mouth care"],

[50, "parenteral", "PPN (partial parenteral nutrition)", "Provides part of the daily nutritional needs"],

[52, "parenteral", "Parenteral nutrition duration", "Short-term; the GI tract is preferred because using it keeps the gut working"],
[53, "parenteral", "Order of preference for feeding", "By mouth → enteral (tube) → parenteral (IV)"],
[54, "tubes", "Gastrostomy or jejunostomy tube (surgical)", "Therapy longer than about 6 weeks"],
[55, "tubes", "PEG or PEJ (percutaneous endoscopic gastrostomy or jejunostomy)", "Placed endoscopically for therapy longer than 30 days"],
[56, "tubes", "When intestinal (jejunal) placement is preferred", "Gastroparesis, esophageal reflux, or a history of aspiration pneumonia"],
[57, "tubes", "Standard (polymeric) formula", "1–2 kcal/mL; whole nutrients; needs a GI tract that absorbs normally"],
[58, "tubes", "Modular formula", "3.8–4 kcal/mL; one macronutrient; not complete, a supplement"],
[59, "tubes", "Elemental formula", "1–3 kcal/mL; predigested, for a partly working GI tract; not complete"],
[60, "tubes", "Specialty formula", "1–2 kcal/mL; for liver failure, lung disease or HIV; not complete"],
[61, "ng", "Four uses for an NG tube", "Decompression, feeding, lavage (washing out the stomach), compression (balloon to stop bleeding)"],
[62, "placement", "Aspirate pH that supports gastric placement", "About 1–4 per the Week 8 slides; 5.5 or less per the ATI NG chapter"],
[63, "placement", "Residual over 250 mL", "Follow facility protocol; smaller residuals are returned to the stomach"],
[64, "placement", "Highest priority before a tube feeding", "Verify tube placement (aspiration risk)"],
[65, "feedings", "Blood glucose with continuous feedings", "Every 4–6 hr until the full rate is tolerated for 24 hr"],
[66, "feedings", "Formula hang time", "Follow the manufacturer; refrigerate unused formula and discard after 24 hr"],
[67, "feedings", "Delegating tube feedings", "Don't delegate tube feedings to assistive personnel"],
[68, "feedings", "Suspected aspiration of formula", "Stop the feeding first; then turn to the side, suction, oxygen, notify the provider, chest X-ray"],
[69, "feedings", "3+ loose stools in 24 hr with tube feeding", "Slow the rate, notify the provider, call the dietitian, skin care; ask about antibiotics"],
[70, "feedings", "Nausea or vomiting with tube feeding", "Slow the rate, head of bed 30°, room-temperature formula, turn to the side, check patency and residual, notify"],
[71, "ng", "NG tube discomfort", "Rinse the mouth, lozenges, moist swabs, frequent oral care, replace loose tape"],
[72, "ng", "Red, sore nares with an NG tube", "Water-soluble lubricant; consider the other nostril"],
[73, "ng", "NG tube not draining, abdomen distended", "Irrigate per protocol, reposition the client, check the suction"]
];
