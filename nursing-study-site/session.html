<script>(function(){var s=localStorage.getItem("theme");if(s==="dark")document.documentElement.setAttribute("data-theme","dark");var p=localStorage.getItem("palette");if(p==="blue"){document.documentElement.setAttribute("data-palette","blue");var fi=document.querySelector("link[rel=icon]");if(fi)fi.href=fi.href.replace("favicon.svg","favicon-blue.svg");}if(localStorage.getItem("paletteHintSeen")==="1")document.documentElement.setAttribute("data-hint-seen","1");})();</script>

<body>
<div id="site-header" data-mode="compact" data-sheet="nur114" data-type="quizzes"></div>
<script src="assets/site-data.js?v=10"></script>
<script src="js/tracking.js?v=7"></script>
<script src="assets/header.js?v=9"></script>
<script src="js/progress.js?v=6"></script>
<div class="wrap">
  <h2 style="margin-bottom:18px;" id="ss-title">Practice session</h2>
  <div id="pq-empty" class="hidden ms-empty-box"><p class="tp-hint" id="ss-empty">Nothing to practice here right now.</p><a class="btn btn-secondary" href="dashboard.html">Back to My dashboard</a></div>

  <div id="pq-setup-screen" class="hidden">
    <p class="pq-step">1 &middot; Choose a mode</p>
    <div class="pq-modes">
      <button type="button" class="pq-mode-btn" data-mode="single" aria-pressed="true"><span class="pq-mode-title"><span class="pq-check" aria-hidden="true"></span>One session</span><span class="pq-mode-sub">Answer a set of questions once, then see your results.</span></button>
      <button type="button" class="pq-mode-btn" data-mode="rounds" aria-pressed="false"><span class="pq-mode-title"><span class="pq-check" aria-hidden="true"></span>Mastery rounds</span><span class="pq-mode-sub">Practice in rounds until you clear the whole pool, then see your stats.</span></button>
    </div>
    <p class="pq-step">2 &middot; How many questions?</p>
    <div class="pq-count-row" id="pq-counts" data-single="10,20,30,40" data-rounds="10,20,30,40">
      <button type="button" class="pq-count-btn" data-count="10" aria-pressed="false">10</button>
      <button type="button" class="pq-count-btn" data-count="20" aria-pressed="false">20</button>
      <button type="button" class="pq-count-btn" data-count="30" aria-pressed="false">30</button>
      <button type="button" class="pq-count-btn" data-count="40" aria-pressed="false">40</button>
    </div>
    <button type="button" class="btn btn-primary pq-start" id="pq-start">Start quiz &rarr;</button>
  </div>

  <div id="pq-quiz-screen" class="hidden">
    <div class="pq-top-row"><span id="pq-progress"></span><span class="pq-top-right"><span id="pq-score"></span><button type="button" class="pq-endlink" id="pq-end-test">End &amp; see results</button></span></div>
    <div class="pq-progress-track"><div id="pq-progress-bar" class="pq-progress-fill"></div></div>
    <div id="pq-prompt" class="pq-prompt"></div>
    <div id="pq-type-label" class="pq-type-label"></div>
    <div id="pq-options" class="pq-options"></div>
    <p id="pq-error" class="pq-error">select at least one answer</p>
    <div id="pq-feedback" class="pq-feedback" aria-live="polite"></div>
    <div class="pq-btn-row">
      <button type="button" class="btn btn-primary" id="pq-submit" disabled>Check answer</button>
      <button type="button" class="btn btn-primary hidden" id="pq-next">Next question &rarr;</button>
    </div>
    <p class="kbd-hint" id="pq-hint" aria-hidden="true"></p>
  </div>

  <div id="pq-round-complete-screen" class="hidden pq-center">
    <div id="rc-title" style="font-size:16px;font-weight:600;margin-bottom:10px;"></div>
    <div id="rc-score" class="pq-stat-big"></div>
    <div class="pq-stat-sub">this round</div>
    <div id="rc-detail" class="pq-stat-detail"></div>
    <button class="btn btn-primary" id="rc-continue" style="margin-top:16px;max-width:200px;margin-left:auto;margin-right:auto;">continue</button>
  </div>

  <div id="pq-end-screen" class="hidden">
    <div class="pq-center" style="margin-bottom:16px;">
      <div id="end-title" style="font-size:16px;font-weight:600;margin-bottom:10px;"></div>
      <div id="end-rounds-subtitle" class="hidden muted" style="margin-bottom:16px;"></div>
      <div id="end-stats-single" class="hidden">
        <div id="end-score" class="pq-stat-big"></div>
        <div id="end-percent" class="muted"></div>
      </div>
      <div id="end-stats-rounds" class="hidden" style="display:flex;justify-content:center;gap:40px;">
        <div><div id="end-pool-pct" class="pq-stat-big"></div><div class="muted">of pool completed</div></div>
        <div><div id="end-accuracy-pct" class="pq-stat-big"></div><div class="muted">overall accuracy</div></div>
      </div>
    </div>
    <p id="category-heading" class="eyebrow"></p>
    <div id="category-grid" class="pq-cat-grid"></div>
    <p class="eyebrow">review</p>
    <div id="review-list" style="margin-bottom:20px;"></div>
    <div class="pq-btn-row">
      <button class="btn btn-secondary" id="end-restart">practice again</button>
      <button class="btn btn-primary" id="end-missed">redo missed questions</button>
    </div>
  </div>
</div>

<script src="assets/theme.js?v=6"></script>
<script src="js/study.js?v=2"></script>
<script src="assets/practice-quiz.js?v=18"></script>
<script src="js/my-study.js?v=8"></script>
<script src="js/challenges.js?v=10"></script>
<script>
(function(){
  if (!Tracking.isOn()){ location.replace("start-tracking.html"); return; }
  /* Which questions this session uses (see js/study.js for the rules) */
  var p = new URLSearchParams(location.search), mode = p.get("mode") || "today";
  var unit = +p.get("unit") || 0, topic = p.get("topic") || "";
  var TITLES = {today: "Today's plan", examready: "Exam ready session", weak: "Weak spots quiz", journal: "Mistake journal",
                bookmarks: "Bookmarks", blind: "Blind spots", review: "Review" + (unit ? ": Unit " + unit : ""), challenge: "Challenge"};
  var title = TITLES[mode] || "Practice session";
  document.getElementById("ss-title").textContent = title;
  document.title = title + " \u2014 Nursing School Pinkprint";
  function pick(questions, store){
    var today = Progress.today(), exams = Progress.exams;
    var status = function(q){ return Progress.statusOf(store[q.id], q.unit, today, exams); };
    var scoped = questions.filter(function(q){ return (!unit || q.unit === unit) && (!topic || q.topic === topic); });
    var rank = function(list, n){ return Study.rank(list, store, today, exams, n); };
    if (mode === "today"){
      var plan = Study.planToday(questions, store, today, exams);
      return Progress.pickSmart(questions, plan.n, store, today, exams);
    }
    if (mode === "examready"){
      var exam = Progress.nextExam(exams, today);
      var qs = Study.examUnitsQuestions(questions, exam).filter(function(q){ return !Progress.isExamReady(store[q.id], exam.id); });
      return rank(qs, 20);
    }
    if (mode === "weak") return Study.weakSpots(questions, store, 20);
    if (mode === "journal") return rank(scoped.filter(function(q){ var r = store[q.id]; return r && r.journal; }), 40);
    if (mode === "bookmarks") return rank(scoped.filter(function(q){ var r = store[q.id]; return r && r.bookmarked; }), 40);
    if (mode === "blind") return rank(scoped.filter(function(q){ return status(q) === "blindspot"; }), 40);
    if (mode === "review") return rank(scoped.filter(function(q){ return Progress.isReviewDue(store[q.id], q.unit, today, exams); }), 40);
    return [];
  }
  if (mode === "challenge") return challenge(p.get("id") || "");
  if (mode === "group") return groupFocus(p.get("id") || "");
  loadSessionQuiz({data: Tracking.ROOT + "data/nur114/", title: title, pick: pick});

  /* Quiz us on these: every question someone in the group missed (most missed first). Counts
     toward this person's progress like any session; nothing goes back to the challenge. */
  function groupFocus(id){
    var setTitle = function(t){ document.getElementById("ss-title").textContent = t; document.title = t + " \u2014 Nursing School Pinkprint"; };
    setTitle("Group focus");
    var fail = function(text){
      document.getElementById("ss-empty").textContent = text;
      document.querySelector("#pq-empty a").setAttribute("href", "challenges.html");
      document.querySelector("#pq-empty a").textContent = "Back to Challenges";
      document.getElementById("pq-empty").classList.remove("hidden");
    };
    Challenges.load(id).then(function(c){
      var ids = c && Challenges.groupMissed(c);
      if (!ids || !ids.length) return fail(c && c.focus ? "Nobody in the group missed a question. Nice work!" : "Group focus shows once 3 or more people finish this challenge.");
      var t = "Group focus: " + c.title;
      setTitle(t);
      loadSessionQuiz({data: Tracking.ROOT + "data/nur114/", title: t, pick: function(){ return ids; }});
    }, function(err){ fail(Challenges.friendly(err)); });
  }
  /* A challenge: join it, take its questions once, save the first score */
  function challenge(id){
    var setTitle = function(t){ document.getElementById("ss-title").textContent = t; document.title = t + " \u2014 Nursing School Pinkprint"; };
    setTitle("Challenge");
    /* Ending early saves the score, so check first */
    document.addEventListener("click", function(e){
      if (!e.target.closest || !e.target.closest("#pq-end-test")) return;
      var m = /question (\d+) of (\d+)/.exec(document.getElementById("pq-progress").textContent);
      var answered = !document.getElementById("pq-next").classList.contains("hidden");
      if (m && (+m[1] < +m[2] || !answered) && !confirm("End the challenge now? Questions you haven't answered count as wrong.")){
        e.stopImmediatePropagation(); e.preventDefault();
      }
    }, true);
    /* Before starting (first time only): share answers for Group focus? Chosen up front and locked
       once finished, so nobody decides after seeing their score. */
    function askShare(r, start){
      if (r.entry.done) return start();
      var box = document.createElement("section");
      box.className = "ms-card ss-share";
      box.innerHTML = '<span class="ch-eyebrow">Before you start</span><h3 class="ms-h2 ch-h2">Study this one together?</h3>' +
        '<p class="ss-share-text">Share your answers with the group to unlock Group focus: the topics you all found hardest, the questions you missed most, and a quiz built from them.</p>' +
        '<p class="ch-note">Only combined numbers are shown, never who missed what, and only to people who share. With just two people sharing, each of you could tell which questions the other missed. You can\'t change this once you start, so nobody decides after seeing their score.</p>' +
        '<div class="ms-btns"><button type="button" class="ms-btn is-primary" data-share="1">Share my answers</button><button type="button" class="ms-btn" data-share="0">Just my score</button></div>' +
        '<p class="tp-note hidden" role="alert"></p>';
      var wrap = document.querySelector(".wrap");
      wrap.insertBefore(box, document.getElementById("pq-setup-screen"));
      [].forEach.call(box.querySelectorAll("[data-share]"), function(b){
        b.addEventListener("click", function(){
          [].forEach.call(box.querySelectorAll("button"), function(x){ x.disabled = true; });
          var yes = b.getAttribute("data-share") === "1";
          Challenges.share(r.entry.id, yes).then(function(){ box.remove(); start(); }, function(err){
            if (!yes){ box.remove(); start(); return; }
            var msg = box.querySelector(".tp-note");
            msg.textContent = "Couldn't save your choice: " + Challenges.friendly(err);
            msg.classList.remove("hidden");
            [].forEach.call(box.querySelectorAll("button"), function(x){ x.disabled = false; });
          });
        });
      });
    }
    Challenges.join(id).then(function(r){
      var t = "Challenge: " + r.title;
      setTitle(t);
      askShare(r, function(){ loadSessionQuiz({data: Tracking.ROOT + "data/nur114/", title: t, pick: function(){ return r.questions; }, onFinish: function(res){
        var box = document.getElementById("ss-challenge") || document.createElement("div");
        box.id = "ss-challenge";
        box.className = "ss-challenge";
        var center = document.querySelector("#pq-end-screen .pq-center");
        center.parentNode.insertBefore(box, center.nextSibling);
        var first = !r.entry.done;
        box.innerHTML = '<p class="tp-hint">' + (first ? "Saving your challenge score\u2026" : "Practice round: your first score is the one that counts.") + "</p>" +
          '<a class="ms-btn is-primary" href="challenges.html#c-' + r.entry.id + '">See how you compare &rarr;</a>';
        if (!first) return;
        /* Every challenge question once, in the challenge's order; unanswered ones count as wrong */
        var got = {};
        (res.answers || []).forEach(function(x){ got[x.q] = x.ok; });
        var answers = r.questions.map(function(q){ return {q: q, ok: got[q] === true}; });
        Challenges.submit(r.entry.id, res.correct, answers).then(function(e){
          r.entry = e || r.entry;
          box.querySelector("p").textContent = e && e.done ? "Challenge score saved: " + res.correct + "/" + res.total + "." : "Couldn't save your score (the challenge may have expired).";
        }, function(err){
          box.querySelector("p").textContent = "Couldn't save your score: " + Challenges.friendly(err);
        });
      }}); });
    }, function(err){
      document.getElementById("ss-empty").textContent = Challenges.friendly(err);
      document.querySelector("#pq-empty a").setAttribute("href", "challenges.html");
      document.querySelector("#pq-empty a").textContent = "Back to Challenges";
      document.getElementById("pq-empty").classList.remove("hidden");
    });
  }
})();
</script>
</body>
</html>
