<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 4 &middot; Fluids &amp; Nutrition &mdash; Nursing School Pinkprint</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<link rel="stylesheet" href="../assets/style.css?v=23">
<script>(function(){var s=localStorage.getItem("theme");if(s==="dark")document.documentElement.setAttribute("data-theme","dark");var p=localStorage.getItem("palette");if(p==="blue")document.documentElement.setAttribute("data-palette","blue");if(localStorage.getItem("paletteHintSeen")==="1")document.documentElement.setAttribute("data-hint-seen","1");})();</script>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <a class="backlink" href="../"><i class="ti ti-arrow-left" aria-hidden="true"></i> All units</a>
    <div style="display:flex;gap:8px;">
      <a class="iconbtn" href="../" aria-label="Home"><i class="ti ti-home" aria-hidden="true"></i></a>
      <button class="iconbtn" onclick="toggleTheme()" aria-label="Toggle dark mode">
        <i id="themeicon" class="ti ti-moon" aria-hidden="true"></i>
      </button>
    </div>
  </div>

  <div style="display:flex;align-items:center;gap:12px;margin-bottom:22px;">
    <div class="unit-icon" style="width:44px;height:44px;font-size:20px;background:var(--u4-bg);color:var(--u4-text);"><i class="ti ti-droplet" aria-hidden="true"></i></div>
    <div>
      <h2>Unit 4 &middot; Fluids &amp; Nutrition</h2>
      <p class="muted">Weeks 8&ndash;9</p>
    </div>
  </div>

  <div class="tags">
    <button class="tag active">All</button>
    <button class="tag">Flashcards</button>
    <button class="tag">Quizzes</button>
  </div>

  <div class="empty">
    <i class="ti ti-folder-plus" aria-hidden="true"></i>
    <p>No widgets here yet.</p>
  </div>

</div>

<script src="../assets/theme.js?v=3"></script>
</body>
</html>
