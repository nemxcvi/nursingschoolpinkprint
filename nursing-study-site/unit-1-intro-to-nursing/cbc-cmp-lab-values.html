<div class="wrap fc-wrap">

  <div class="fc-counter">
    <div class="fc-nav">
      <button type="button" class="fc-textbtn fc-arrow" onclick="prevCard(event)" aria-label="Previous card">&larr;</button>

      <div id="cardback" class="fc-face back"></div>
    </div>
  </div>
