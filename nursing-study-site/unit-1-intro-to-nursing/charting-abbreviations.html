<div class="wrap">

  <div class="fc-topbar"><span id="cardcounter"></span><span id="counts"></span></div>
  <div class="fc-progresswrap" id="progressbar" aria-hidden="true"><span class="seg dk"></span><span class="seg al"></span><span class="seg kn"></span></div>

  <div id="cardscene" class="fc-scene" onclick="flipCard()">
    <div id="cardinner" class="fc-inner">
      <div id="cardfront" class="fc-face"></div>
      <div id="cardback" class="fc-face back"></div>
    </div>
  </div>

  <div id="gradebtns" class="row">
    <button class="btn dk" onclick="grade('dontknow', event)" disabled><i class="ti ti-x" aria-hidden="true"></i> don't know <span class="kbd" aria-hidden="true">1</span></button>
    <button class="btn al" onclick="grade('almost', event)" disabled>~ almost <span class="kbd" aria-hidden="true">2</span></button>
    <button class="btn kn" onclick="grade('know', event)" disabled><i class="ti ti-check" aria-hidden="true"></i> know it <span class="kbd" aria-hidden="true">3</span></button>
  </div>

  <div id="completion" style="display:none;"></div>

  <div class="row">
    <button class="btn small" onclick="prevCard(event)"><i class="ti ti-arrow-left" aria-hidden="true"></i> prev</button>
    <button class="btn small" onclick="nextCard(event)">next <i class="ti ti-arrow-right" aria-hidden="true"></i></button>
  </div>
  <div class="row" style="margin-bottom:0;">
    <button class="btn small" onclick="shuffleDeck(event)"><i class="ti ti-arrows-shuffle" aria-hidden="true"></i> shuffle</button>
    <button class="btn small" onclick="restartDeck(event)"><i class="ti ti-refresh" aria-hidden="true"></i> restart</button>
  </div>
  <p id="reviewnote" class="fc-note"></p>
  <p class="kbd-hint" aria-hidden="true"><span>Space &middot; flip</span><span>1 2 3 &middot; rate</span><span>&larr; &rarr; &middot; prev / next</span></p>
