<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Charting Abbreviations &mdash; Nursing School Pinkprint</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<link rel="stylesheet" href="../assets/style.css?v=5">
<script>(function(){var s=localStorage.getItem("theme");if(s==="dark")document.documentElement.setAttribute("data-theme","dark");})();</script>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="backlink" href="./"><i class="ti ti-arrow-left" aria-hidden="true"></i> Unit 1</a>
    <div style="display:flex;gap:8px;">
      <a class="iconbtn" href="../" aria-label="Home"><i class="ti ti-home" aria-hidden="true"></i></a>
      <button class="iconbtn" onclick="toggleTheme()" aria-label="Toggle dark mode">
        <i id="themeicon" class="ti ti-moon" aria-hidden="true"></i>
      </button>
    </div>
  </div>
  <h2 style="margin-bottom:18px;">Charting Abbreviations</h2>

  <div class="fc-topbar"><span id="cardcounter"></span><span id="counts"></span></div>
  <div class="fc-progresswrap"><div id="progressbar" class="fc-progressbar"></div></div>

  <div id="cardscene" class="fc-scene" onclick="flipCard()">
    <div id="cardinner" class="fc-inner">
      <div id="cardfront" class="fc-face"></div>
      <div id="cardback" class="fc-face back"></div>
    </div>
  </div>

  <div id="gradebtns" class="row" style="display:none;">
    <button class="btn dk" onclick="grade('dontknow', event)"><i class="ti ti-x" aria-hidden="true"></i> don't know</button>
    <button class="btn al" onclick="grade('almost', event)">~ almost</button>
    <button class="btn kn" onclick="grade('know', event)"><i class="ti ti-check" aria-hidden="true"></i> know it</button>
  </div>

  <div id="completion" style="display:none;"></div>

  <div class="row">
    <button class="btn small" onclick="prevCard(event)"><i class="ti ti-arrow-left" aria-hidden="true"></i> prev</button>
    <button class="btn small" onclick="nextCard(event)">next <i class="ti ti-arrow-right" aria-hidden="true"></i></button>
  </div>
  <div class="row" style="margin-bottom:0;">
    <button class="btn small" onclick="shuffleDeck(event)"><i class="ti ti-arrows-shuffle" aria-hidden="true"></i> shuffle</button>
    <button class="btn small" onclick="restartDeck(event)"><i class="ti ti-refresh" aria-hidden="true"></i> restart</button>
  </div>
  <p id="reviewnote" class="fc-note"></p>
</div>

<script src="../assets/theme.js"></script>
<script src="../assets/flashcards.js"></script>
<script>

</body>
</html>
