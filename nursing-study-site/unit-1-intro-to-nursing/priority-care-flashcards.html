<script>
var CATS = {

  culture: {label:"Culture &amp; Spirituality", hue:"yellow"}
};
var CARDS = [
[1, "priority", "Maslow's hierarchy (first to last)", "Physiological → safety → love and belonging → esteem → self-actualization"],
[2, "priority", "Physiological needs", "Air, water, food, housing, sleep, sexual activity. Airway comes first"],
[3, "priority", "ABCDE", "Airway, Breathing, Circulation, Disability (neuro), Exposure"],
[4, "priority", "Why assess ABCs before a neuro exam?", "Airway, breathing and circulation problems can change neurological findings"],
[5, "priority", "Breathing assessment", "Rate, depth, ease; accessory muscles; lung sounds; oxygen saturation"],
[6, "priority", "Circulation assessment", "Pulse rate and strength, BP (blood pressure), capillary refill, skin tone, urine output; control bleeding"],
[7, "priority", "Disability assessment", "Alert and oriented? Arousable? Responds to painful stimuli? Pupils, blood sugar"],
[8, "priority", "Signs of severe airway obstruction", "Can't speak or cry, clutching the throat, high-pitched wheezing, cyanosis, weak cough, loss of consciousness"],

[10, "priority", "Least restrictive, least invasive", "Try the gentlest option that works first: reorientation and a sitter before restraints"],

[16, "priority", "Rationing", "Deciding how to use resources too scarce to meet every need"],

[19, "managing", "Who is accountable after delegating?", "The nurse who delegated"],
[20, "managing", "Right circumstance", "Delegate only when the situation is appropriate and the client is stable"],
[21, "managing", "What can't be delegated", "Assessment, analysis, planning and evaluation"],
[22, "managing", "I-SBAR-R", "Identify, Situation, Background, Assessment, Recommendation, Read back"],

[29, "managing", "STAMP", "Early signs of agitation: Staring, Tone and volume of voice, Anxiety, Mumbling, Pacing"],

[36, "pcc", "Enabling", "Guiding the client and family through events with information and support"],
