n adult client?", "type": "mc", "options": [{"id": "a", "text": "8 mg/dL"}, {"id": "b", "text": "15 mg/dL"}, {"id": "c", "text": "25 mg/dL"}, {"id": "d", "text": "30 mg/dL"}], "correct": ["b"], "explanation": "Normal adult BUN is 10\u201320 mg/dL. 15 mg/dL falls within range.", "cat": "cbccmp", "id": 14}, {"prompt": "Which creatinine value is expected for a 30-year-old female client?", "type": "mc", "options": [{"id": "a", "text": "0.4 mg/dL"}, {"id": "b", "text": "0.9 mg/dL"}, {"id": "c", "text": "1.1 mg/dL"}, {"id": "d", "text": "1.2 mg/dL"}], "correct": ["b"], "explanation": "For females age 18 to under 41, normal creatinine is 0.5\u20131 mg/dL. 0.9 mg/dL fits within that; 0.4 is below, and 1.1 and 1.2 are above.", "cat": "cbccmp", "id": 15}, {"prompt": "A client's hematocrit value is 36%. How should the nurse interpret this finding?", "type": "mc", "options": [{"id": "a", "text": "Within normal limits for both an adult male and an adult female"}, {"id": "b", "text": "Above normal for an adult female, within normal limits for an adult male"}, {"id": "c", "text": "Below normal for both an adult male and an adult female"}, {"id": "d", "text": "Below normal for an adult male, within normal limits for an adult female"}], "correct": ["c"], "explanation": "Normal female Hct is 37\u201347% and normal male Hct is 42\u201352%. 36% falls below both ranges.", "cat": "cbccmp", "id": 16}, {"prompt": "Which glucose value is WITHIN normal limits for an adult?", "type": "mc", "options": [{"id": "a", "text": "70 mg/dL"}, {"id": "b", "text": "75 mg/dL"}, {"id": "c", "text": "120 mg/dL"}, {"id": "d", "text": "110 mg/dL"}], "correct": ["b"], "explanation": "Normal adult glucose is 74\u2013106 mg/dL. 75 mg/dL falls within range; 70 is just below, and 120 and 110 are above.", "cat": "cbccmp", "id": 17}, {"prompt": "A nurse reviews morning labs for a client with a history of poorly controlled diabetes: BUN 22 mg/dL, Creatinine (female client, age 64) 1.1 mg/dL, Glucose 210 mg/dL. Which "}, {"id": "d", "text": "2.0 mg/dL"}], "correct": ["b"], "explanation": "Normal adult total bilirubin is 0.3\u20131 mg/dL. 0.6 mg/dL falls within range; 0.1 is below, and 1.2 and 2.0 are above.", "cat": "cbccmp", "id": 22}, {"prompt": "Which albumin value is expected for an adult client?", "type": "mc", "options": [{"id": "a", "text": "2.8 g/dL"}, {"id": "b", "text": "4.2 g/dL"}, {"id": "c", "text": "5.8 g/dL"}, {"id": "d", "text": "6.5 g/dL"}], "correct": ["b"], "explanation": "Normal adult albumin is 3.5\u20135 g/dL. 4.2 g/dL falls within range; 2.8 is below, and 5.8 and 6.5 are above.", "cat": "cbccmp", "id": 23}, {"prompt": "Select all liver/protein panel values that are BELOW normal: ALT 2 units/L, AST 5 units/L, ALP 25 units/L, Albumin 3.0 g/dL, Bilirubin 0.1 mg/dL.", "type": "sata", "options": [{"id": "a", "text": "ALT 2 units/L"}, {"id": "b", "text": "AST 5 units/L"}, {"id": "c", "text": "ALP 25 units/L"}, {"id": "d", "text": "Albumin 3.0 g/dL"}, {"id": "e", "text": "Bilirubin 0.1 mg/dL"}], "correct": ["a", "c", "d", "e"], "explanation": "ALT 2 (normal 4\u201336), ALP 25 (normal 30\u2013120), albumin 3.0 (normal 3.5\u20135), and bilirubin 0.1 (normal 0.3\u20131) are all below range. AST 5 is still within its normal range of 0\u201335.", "cat": "cbccmp", "id": 24}, {"prompt": "Which sodium level is WITHIN normal limits for an adult?", "type": "mc", "options": [{"id": "a", "text": "128 mEq/L"}, {"id": "b", "text": "140 mEq/L"}, {"id": "c", "text": "150 mEq/L"}, {"id": "d", "text": "160 mEq/L"}], "correct": ["b"], "explanation": "Normal adult sodium is 136\u2013145 mEq/L. 140 mEq/L falls within range.", "cat": "cbccmp", "id": 25}, {"prompt": "Which chloride value falls WITHIN the expected adult range?", "type": "mc", "options": [{"id": "a", "text": "90 mEq/L"}, {"id": "b", "text": "100 mEq/L"}, {"id": "c", "text": "110 mEq/L"}, {"id": "d", "text": "115 mEq/L"}], "correct": ["b"], "explanation": "Normal adult chloride is 98\u2013106 mEq/L. 100 mEq/L falls within range.", "cat": "cbccmp", "id": 26}, {"prompt": "Which magnesium value is WITHIN the normal adult range?", "type": "mc", "options": [{"id": "a", "text": "0.9 mEq/L"}, {"id": "b", "text": "1.6 mEq/L"}, {"id": "c", "text": "2.5 mEq/L"}, {"id": "d", "text": "3.0 mEq/L"}], "correct": ["b"], "explanation": "Normal adult magnesium is 1.3\u20132.1 mEq/L. 1.6 mEq/L falls within range.", "cat": "cbccmp", "id": 27}, {"prompt": "Select all electrolyte values that are WITHIN normal limits for an adult client: Sodium 138 mEq/L, Potassium 5.8 mEq/L, Chloride 102 mEq/L, Magnesium 2.6 mEq/L, Calcium 9.8 mg/dL.", "type": "sata", "options": [{"id": "a", "text": "Sodium 138 mEq/L"}, {"id": "b", "text": "Potassium 5.8 mEq/L"}, {"id": "c", "text": "Chloride 102 mEq/L"}, {"id": "d", "text": "Magnesium 2.6 mEq/L"}, {"id": "e", "text": "Calcium 9.8 mg/dL"}], "correct": ["a", "c", "e"], "explanation": "Sodium, chloride, and calcium fall within their normal adult ranges. Potassium 5.8 (normal 3.5\u20135) and magnesium 2.6 (normal 1.3\u20132.1) are both elevated.", "cat": "cbccmp", "id": 28}, {"prompt": "Which MCH value is WITHIN the normal adult range?", "type": "mc", "options": [{"id": "a", "text": "20 pg"}, {"id": "b", "text": "29 pg"}, {"id": "c", "text": "35 pg"}, {"id": "d", "text": "40 pg"}], "correct": ["b"], "explanation": "Normal adult MCH is 27\u201331 pg. 29 pg falls within range.", "cat": "cbccmp", "id": 29}, {"prompt": "The nurse is reviewing red blood cell indices for a client: MCH 34 pg, MCHC 30 g/dL. How should the nurse interpret these findings?", "type": "mc", "options": [{"id": "a", "text": "Within normal limits for both"}, {"id": "b", "text": "Below normal range for MCH, above normal for MCHC"}, {"id": "c", "text": "Above normal range for MCH, below normal for MCHC"}, {"id": "d", "text": "Below normal range for both"}], "correct": ["c"], "explanation": "MCH 34 pg exceeds the normal range of 27\u201331 pg. MCHC 30 g/dL falls below the normal range of 32\u201336 g/dL.", "cat": "cbccmp", "id": 30}, {"prompt": "Select all CBC values that are WITHIN normal limits for an adult male client: Hct 46%, Hgb 17 g/dL, RBC 4.5 \u00d710\u2076/\u00b5L, Platelets 380,000/mm3, WBC 8,500/mm3.", "type": "sata", "options": [{"id": "a", "text": "Hct 46%"}, {"id": "b", "text": "Hgb 17 g/dL"}, {"id": "c", "text": "RBC 4.5 \u00d710\u2076/\u00b5L"}, {"id": "d", "text": "Platelets 380,000/mm3"}, {"id": "e", "text": "WBC 8,500/mm3"}], "correct": ["a", "b", "d", "e"], "explanation": "Hct, Hgb, platelets, and WBC are all within normal adult male ranges. RBC 4.5 \u00d710\u2076/\u00b5L is below the normal male range of 4.7\u20136.1.", "cat": "cbccmp", "id": 31}, {"prompt": "A client's serum creatinine is 1.2 mg/dL. How should the nurse interpret this finding?", "type": "mc", "options": [{"id": "a", "text": "Within normal limits for a 65-year-old male"}, {"id": "b", "text": "Above normal range for a 45-year-old male"}, {"id": "c", "text": "Within normal limits for a 20-year-old female"}, {"id": "d", "text": "Above normal range for a 65-year-old female"}], "correct": ["a"], "explanation": "For males age 60 and older, normal creatinine is 0.7\u20131.3 mg/dL, so 1.2 is normal. For a 45-year-old male (normal 0.6\u20131.3), 1.2 is also normal, not above. For a 20-year-old female (normal 0.5\u20131), 1.2 is above normal, not within. For a 65-year-old female (normal 0.5\u20131.2), 1.2 is at the upper limit, so it's normal, not above.", "cat": "cbccmp", "id": 32}, {"prompt": "Which bicarbonate value is WITHIN normal adult limits?", "type": "mc", "options": [{"id": "a", "text": "18 mEq/L"}, {"id": "b", "text": "25 mEq/L"}, {"id": "c", "text": "32 mEq/L"}, {"id": "d", "text": "15 mEq/L"}], "correct": ["b"], "explanation": "Normal adult bicarbonate is 23\u201330 mEq/L. 25 mEq/L falls within range.", "cat": "cbccmp", "id": 33}, {"prompt": "Select all values that are ABOVE normal for an adult client: Potassium 5.6 mEq/L, Sodium 148 mEq/L, Magnesium 2.5 mEq/L, Calcium 11.5 mg/dL.", "type": "sata", "options": [{"id": "a", "text": "Potassium 5.6 mEq/L"}, {"id": "b", "text": "Sodium 148 mEq/L"}, {"id": "c", "text": "Magnesium 2.5 mEq/L"}, {"id": "d", "text": "Calcium 11.5 mg/dL"}], "correct": ["a", "b", "c", "d"], "explanation": "Potassium (normal 3.5\u20135), sodium (normal 136\u2013145), magnesium (normal 1.3\u20132.1), and calcium (normal 9.0\u201310.5) are all elevated here.", "cat": "cbccmp", "id": 34}, {"prompt": "Which creatinine value best reflects an expected finding for an 18-year-old female client?", "type": "mc", "options": [{"id": "a", "text": "0.4 mg/dL"}, {"id": "b", "text": "0.8 mg/dL"}, {"id": "c", "text": "1.1 mg/dL"}, {"id": "d", "text": "0.3 mg/dL"}], "correct": ["b"], "explanation": "For females age 18 to under 41, normal creatinine is 0.5\u20131 mg/dL. 0.8 mg/dL falls within that; 0.4 and 0.3 are below, and 1.1 is above.", "cat": "cbccmp", "id": 35}, {"prompt": "Which ALT and AST pairing would the nurse expect to see both WITHIN normal limits?", "type": "mc", "options": [{"id": "a", "text": "ALT 50 units/L, AST 45 units/L"}, {"id": "b", "text": "ALT 20 units/L, AST 15 units/L"}, {"id": "c", "text": "ALT 40 units/L, AST 40 units/L"}, {"id": "d", "text": "ALT 60 units/L, AST 10 units/L"}], "correct": ["b"], "explanation": "Normal ALT is 4\u201336 units/L and AST is 0\u201335 units/L. Only option b has both values within range.", "cat": "cbccmp", "id": 36}, {"prompt": "You are assigned 5 clients at the start of your shift. Which of the following morning lab results should be reported to the provider? Select all that apply.", "type": "sata", "options": [{"id": "a", "text": "A client's total protein of 9.6 g/dL"}, {"id": "b", "text": "A client's potassium level of 2.8 mEq/L"}, {"id": "c", "text": "A client's platelet count of 410,000/mm3"}, {"id": "d", "text": "A client's glucose level of 92 mg/dL"}, {"id": "e", "text": "A client's sodium level of 140 mEq/L"}], "correct": ["a", "b", "c"], "explanation": "Total protein 9.6 (normal 6.4\u20138.3) is elevated. Potassium 2.8 (normal 3.5\u20135) is low. Platelets 410,000 (normal 150,000\u2013400,000) is elevated. Glucose 92 and sodium 140 are both within normal limits.", "cat": "cbccmp", "id": 37}, {"prompt": "Which of the following morning lab results should be reported to the provider? Select all that apply.", "type": "sata", "options": [{"id": "a", "text": "A client's bicarbonate level of 19 mEq/L"}, {"id": "b", "text": "A client's chloride level of 92 mEq/L"}, {"id": "c", "text": "A client's magnesium level of 1.7 mEq/L"}, {"id": "d", "text": "A client's calcium level of 9.9 mg/dL"}, {"id": "e", "text": "A client's WBC of 7,200/mm3"}], "correct": ["a", "b"], "explanation": "Bicarbonate 19 (normal 23\u201330) is low. Chloride 92 (normal 98\u2013106) is low. Magnesium 1.7, calcium 9.9, and WBC 7,200 are all within normal limits.", "cat": "cbccmp", "id": 38}, {"prompt": "Which of the following morning lab results should be reported to the provider? Select all that apply.", "type": "sata", "options": [{"id": "a", "text": "A client's total protein of 5.9 g/dL"}, {"id": "b", "text": "A client's hematocrit of 55% (male client)"}, {"id": "c", "text": "A client's ALT of 30 units/L"}, {"id": "d", "text": "A client's total bilirubin of 1.8 mg/dL"}, {"id": "e", "text": "A client's BUN of 16 mg/dL"}], "correct": ["a", "b", "d"], "explanation": "Total protein 5.9 (normal 6.4\u20138.3) is low. Male hematocrit 55% (normal 42\u201352) is elevated. Total bilirubin 1.8 (normal 0.3\u20131) is elevated. ALT 30 and BUN 16 are both within normal limits.", "cat": "cbccmp", "id": 39}, {"prompt": "Which of the following morning lab results should be reported to the provider? Select all that apply.", "type": "sata", "options": [{"id": "a", "text": "A client's glucose level of 58 mg/dL"}, {"id": "b", "text": "A client's RBC count of 3.6 \u00d710\u2076/\u00b5L (female client)"}, {"id": "c", "text": "A client's ALP of 95 units/L"}, {"id": "d", "text": "A client's magnesium level of 2.3 mEq/L"}, {"id": "e", "text": "A client's creatinine of 0.9 mg/dL (35-year-old male client)"}], "correct": ["a", "b", "d"], "explanation": "Glucose 58 (normal 74\u2013106) is low. Female RBC 3.6 (normal 4.2\u20135.4) is low. Magnesium 2.3 (normal 1.3\u20132.1) is elevated. ALP 95 and creatinine 0.9 (normal 0.6\u20131.2 for this age) are both within normal limits.", "cat": "cbccmp", "id": 40}, {"id": 41, "cat": "fundamentals", "type": "mc", "prompt": "A nurse is giving an opioid analgesic for a pain score of 6/10. The vital sign most directly affected by this medication will be:", "options": [{"id": "a", "text": "Temperature"}, {"id": "b", "text": "Respiratory rate"}, {"id": "c", "text": "Pulse oximetry"}, {"id": "d", "text": "Blood pressure"}], "correct": ["b"], "explanation": "Opioids depress the central respiratory drive, making respiratory rate the vital sign most directly affected."}, {"id": 42, "cat": "fundamentals", "type": "mc", "prompt": "A client asks the nurse what the normal range is for blood pressure. The nurse knows the expected range for an adult is:", "options": [{"id": "a", "text": "Greater than 140/90 mmHg"}, {"id": "b", "text": "Less than 120/80 mmHg"}, {"id": "c", "text": "Between 110/60 and 150/100 mmHg"}, {"id": "d", "text": "Less than 90/60 mmHg"}], "correct": ["b"], "explanation": "Less than 120/80 mmHg is the expected normal adult blood pressure."}, {"id": 43, "cat": "fundamentals", "type": "mc", "prompt": "The nurse delegates obtaining an oxygen saturation reading to the UAP. Which equipment will the UAP take into the room?", "options": [{"id": "a", "text": "Pulse oximeter"}, {"id": "b", "text": "Sphygmomanometer"}, {"id": "c", "text": "Thermometer"}, {"id": "d", "text": "Stethoscope"}], "correct": ["a"], "explanation": "A pulse oximeter measures SpO2, the oxygen saturation reading."}, {"id": 44, "cat": "fundamentals", "type": "mc", "prompt": "Which step of the nursing process involves identifying expected outcomes and defining the interventions needed to reach them?", "options": [{"id": "a", "text": "Assessment"}, {"id": "b", "text": "Planning"}, {"id": "c", "text": "Implementation"}, {"id": "d", "text": "Evaluation"}], "correct": ["b"], "explanation": "Planning generates potential solutions and goals, and identifies interventions to reach the desired outcome."}, {"id": 45, "cat": "fundamentals", "type": "mc", "prompt": "Which nursing diagnosis is written correctly as a 'risk for' diagnosis?", "options": [{"id": "a", "text": "Impaired physical mobility r/t pain AEB reluctance to walk"}, {"id": "b", "text": "Risk for infection r/t surgical incision and compromised immune system"}, {"id": "c", "text": "Acute pain r/t surgical incision AEB pain rating of 8/10"}, {"id": "d", "text": "Risk for infection AEB elevated WBC count"}], "correct": ["b"], "explanation": "A 'risk for' diagnosis has no AEB, since the problem hasn't happened yet \u2014 only risk factors are listed."}, {"id": 46, "cat": "fundamentals", "type": "mc", "prompt": "According to ATI, accountability is best defined as:", "options": [{"id": "a", "text": "Delegating tasks appropriately to the care team"}, {"id": "b", "text": "A legal obligation with a moral and ethical commitment to do the right thing every time"}, {"id": "c", "text": "Completing all assigned tasks on time"}, {"id": "d", "text": "Following the chain of command"}], "correct": ["b"], "explanation": "ATI defines accountability as a legal obligation with a moral and ethical commitment to do the right thing every time and in every situation."}, {"id": 47, "cat": "fundamentals", "type": "mc", "prompt": "A client's heart rate is 110 bpm with a regular rhythm. The nurse documents this as:", "options": [{"id": "a", "text": "Bradycardia"}, {"id": "b", "text": "Tachycardia"}, {"id": "c", "text": "Dysrhythmia"}, {"id": "d", "text": "Normal sinus rhythm"}], "correct": ["b"], "explanation": "A heart rate over 100 bpm is tachycardia."}, {"id": 48, "cat": "fundamentals", "type": "mc", "prompt": "A client's respiratory rate is 8 breaths/min. This is best described as:", "options": [{"id": "a", "text": "Tachypnea"}, {"id": "b", "text": "Apnea"}, {"id": "c", "text": "Bradypnea"}, {"id": "d", "text": "Dyspnea"}], "correct": ["c"], "explanation": "Bradypnea is a regular breathing pattern under 12 breaths per minute."}, {"id": 49, "cat": "fundamentals", "type": "mc", "prompt": "Which of the following is an example of primary prevention?", "options": [{"id": "a", "text": "Colonoscopy screening"}, {"id": "b", "text": "Cardiac rehabilitation"}, {"id": "c", "text": "Vaccination"}, {"id": "d", "text": "Mammogram"}], "correct": ["c"], "explanation": "Primary prevention decreases the risk of developing a disease before it occurs, as with vaccines. Colonoscopy and mammogram are secondary prevention; cardiac rehab is tertiary."}, {"id": 50, "cat": "fundamentals", "type": "mc", "prompt": "A client's blood pressure drops from 128/78 to 100/70 with a compensatory increase in heart rate within two minutes of standing, and they report dizziness. The nurse suspects:", "options": [{"id": "a", "text": "Hypertensive crisis"}, {"id": "b", "text": "Orthostatic hypotension"}, {"id": "c", "text": "Shock"}, {"id": "d", "text": "Bradycardia"}], "correct": ["b"], "explanation": "A systolic drop of 20+ mmHg with reflex tachycardia within 1-3 minutes of a position change is orthostatic hypotension."}, {"id": 51, "cat": "fundamentals", "type": "mc", "prompt": "Why does the nurse assess the ABCs before completing a neurological exam on an acutely ill client?", "options": [{"id": "a", "text": "Neuro exams take longer to complete"}, {"id": "b", "text": "Airway, breathing, and circulation problems can affect neurological findings"}, {"id": "c", "text": "It is hospital policy to always start with vital signs"}, {"id": "d", "text": "The client is more cooperative early in the assessment"}], "correct": ["b"], "explanation": "ABCs are assessed first because compromise in any of them can directly impact neurological status."}, {"id": 52, "cat": "fundamentals", "type": "mc", "prompt": "Which communication model includes the concepts of sender, encoder, channel, decoder, receiver, and noise?", "options": [{"id": "a", "text": "Shannon-Weaver model"}, {"id": "b", "text": "TeamSTEPPS model"}, {"id": "c", "text": "SBAR model"}, {"id": "d", "text": "Health Belief Model"}], "correct": ["a"], "explanation": "The Shannon-Weaver model's six concepts are sender, encoder, channel, decoder, receiver, and noise."}, {"id": 53, "cat": "fundamentals", "type": "mc", "prompt": "A nurse reports a colleague's unsafe medication practices to hospital administration. This is an example of:", "options": [{"id": "a", "text": "Mandatory reporting"}, {"id": "b", "text": "Whistleblowing"}, {"id": "c", "text": "Good Samaritan action"}, {"id": "d", "text": "Informed consent"}], "correct": ["b"], "explanation": "Whistleblowing is reporting unethical, illegal, or unsafe practices."}, {"id": 54, "cat": "fundamentals", "type": "mc", "prompt": "During a client interview, the nurse says, 'So what I'm hearing is that the pain gets worse at night and eases with rest.' This is an example of:", "options": [{"id": "a", "text": "Giving advice"}, {"id": "b", "text": "Restating/paraphrasing"}, {"id": "c", "text": "False reassurance"}, {"id": "d", "text": "A closed-ended question"}], "correct": ["b"], "explanation": "Restating/paraphrasing reflects back what the client said to confirm understanding \u2014 a therapeutic technique."}, {"id": 55, "cat": "fundamentals", "type": "mc", "prompt": "HIPAA primarily protects which of the following?", "options": [{"id": "a", "text": "A client's right to refuse treatment"}, {"id": "b", "text": "A client's protected health information (PHI)"}, {"id": "c", "text": "A nurse's scope of practice"}, {"id": "d", "text": "A client's right to informed consent"}], "correct": ["b"], "explanation": "HIPAA (the Health Insurance Portability and Accountability Act) protects a client's protected health information."}, {"id": 56, "cat": "fundamentals", "type": "mc", "prompt": "In the ISBARR communication tool, what does the second 'R' stand for?", "options": [{"id": "a", "text": "Response"}, {"id": "b", "text": "Read-back"}, {"id": "c", "text": "Referral"}, {"id": "d", "text": "Reassessment"}], "correct": ["b"], "explanation": "ISBARR stands for Introduction, Situation, Background, Assessment, Recommendation, Read-back \u2014 confirming the receiver understood correctly."}, {"id": 57, "cat": "fundamentals", "type": "mc", "prompt": "In a PICOT question, the 'T' stands for:", "options": [{"id": "a", "text": "Type of study"}, {"id": "b", "text": "Treatment"}, {"id": "c", "text": "Time"}, {"id": "d", "text": "Team"}], "correct": ["c"], "explanation": "PICOT = Population, Intervention, Comparison, Outcome, Time."}, {"id": 58, "cat": "fundamentals", "type": "mc", "prompt": "Which documentation method charts only significant findings or deviations from the norm?", "options": [{"id": "a", "text": "SOAP charting"}, {"id": "b", "text": "Problem-oriented medical record"}, {"id": "c", "text": "Charting by exception (CBE)"}, {"id": "d", "text": "Focus charting"}], "correct": ["c"], "explanation": "Charting by exception (CBE) only documents findings that deviate from the expected norm."}, {"id": 59, "cat": "fundamentals", "type": "mc", "prompt": "Which of the following best demonstrates the 'least restrictive, least invasive' principle in priority setting?", "options": [{"id": "a", "text": "Restraining a confused client immediately"}, {"id": "b", "text": "Trying reorientation and a sitter before considering restraints"}, {"id": "c", "text": "Sedating an agitated client right away"}, {"id": "d", "text": "Notifying security before attempting redirection"}], "correct": ["b"], "explanation": "The least restrictive/least invasive approach means trying gentler interventions before more restrictive ones like restraints."}, {"id": 60, "cat": "fundamentals", "type": "mc", "prompt": "A nursing student asks about the difference between nociceptive and neuropathic pain. Which statement is correct?", "options": [{"id": "a", "text": "Nociceptive pain is related to nerve damage; neuropathic pain is related to tissue damage"}, {"id": "b", "text": "Nociceptive pain is related to tissue damage; neuropathic pain is related to nerve damage"}, {"id": "c", "text": "Both types are related to psychological distress only"}, {"id": "d", "text": "Neuropathic pain always resolves within 6 months"}], "correct": ["b"], "explanation": "Nociceptive pain relates to tissue damage; neuropathic pain relates to nerve damage."}];
