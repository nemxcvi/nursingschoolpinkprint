<script>
var catLabels = {
  process: "Nursing process & priority",
  vitals: "Vital signs & pain",
  ethics: "Ethics & legal",
  comm: "Communication",
  ebp_doc: "EBP & documentation"
};
var bank = [
{id:1, cat:"vitals", type:"mc", prompt:"A nurse is giving an opioid analgesic for a pain score of 6/10. The vital sign most directly affected by this medication will be:",
 options:[{id:"a",text:"Temperature"},{id:"b",text:"Respiratory rate"},{id:"c",text:"Pulse oximetry"},{id:"d",text:"Blood pressure"}],
 correct:["b"], explanation:"Opioids depress the central respiratory drive, making respiratory rate the vital sign most directly affected."},
{id:2, cat:"vitals", type:"mc", prompt:"A client asks the nurse what the normal range is for blood pressure. The nurse knows the expected range for an adult is:",
 options:[{id:"a",text:"Greater than 140/90 mmHg"},{id:"b",text:"Less than 120/80 mmHg"},{id:"c",text:"Between 110/60 and 150/100 mmHg"},{id:"d",text:"Less than 90/60 mmHg"}],
 correct:["b"], explanation:"Less than 120/80 mmHg is the expected normal adult blood pressure."},
{id:3, cat:"vitals", type:"mc", prompt:"The nurse delegates obtaining an oxygen saturation reading to the UAP. Which equipment will the UAP take into the room?",
 options:[{id:"a",text:"Pulse oximeter"},{id:"b",text:"Sphygmomanometer"},{id:"c",text:"Thermometer"},{id:"d",text:"Stethoscope"}],
 correct:["a"], explanation:"A pulse oximeter measures SpO2, the oxygen saturation reading."},
{id:4, cat:"process", type:"mc", prompt:"Which step of the nursing process involves identifying expected outcomes and defining the interventions needed to reach them?",
 options:[{id:"a",text:"Assessment"},{id:"b",text:"Planning"},{id:"c",text:"Implementation"},{id:"d",text:"Evaluation"}],
 correct:["b"], explanation:"Planning generates potential solutions and goals, and identifies interventions to reach the desired outcome."},
{id:5, cat:"process", type:"mc", prompt:"Which nursing diagnosis is written correctly as a 'risk for' diagnosis?",
 options:[{id:"a",text:"Impaired physical mobility r/t pain AEB reluctance to walk"},{id:"b",text:"Risk for infection r/t surgical incision and compromised immune system"},{id:"c",text:"Acute pain r/t surgical incision AEB pain rating of 8/10"},{id:"d",text:"Risk for infection AEB elevated WBC count"}],
 correct:["b"], explanation:"A 'risk for' diagnosis has no AEB, since the problem hasn't happened yet — only risk factors are listed."},
{id:6, cat:"ethics", type:"mc", prompt:"According to ATI, accountability is best defined as:",
 options:[{id:"a",text:"Delegating tasks appropriately to the care team"},{id:"b",text:"A legal obligation with a moral and ethical commitment to do the right thing every time"},{id:"c",text:"Completing all assigned tasks on time"},{id:"d",text:"Following the chain of command"}],
 correct:["b"], explanation:"ATI defines accountability as a legal obligation with a moral and ethical commitment to do the right thing every time and in every situation."},
{id:7, cat:"vitals", type:"mc", prompt:"A client's heart rate is 110 bpm with a regular rhythm. The nurse documents this as:",
 options:[{id:"a",text:"Bradycardia"},{id:"b",text:"Tachycardia"},{id:"c",text:"Dysrhythmia"},{id:"d",text:"Normal sinus rhythm"}],
 correct:["b"], explanation:"A heart rate over 100 bpm is tachycardia."},
{id:8, cat:"vitals", type:"mc", prompt:"A client's respiratory rate is 8 breaths/min. This is best described as:",
 options:[{id:"a",text:"Tachypnea"},{id:"b",text:"Apnea"},{id:"c",text:"Bradypnea"},{id:"d",text:"Dyspnea"}],
 correct:["c"], explanation:"Bradypnea is a regular breathing pattern under 12 breaths per minute."},
{id:9, cat:"vitals", type:"mc", prompt:"Which of the following is an example of primary prevention?",
 options:[{id:"a",text:"Colonoscopy screening"},{id:"b",text:"Cardiac rehabilitation"},{id:"c",text:"Vaccination"},{id:"d",text:"Mammogram"}],
 correct:["c"], explanation:"Primary prevention decreases the risk of developing a disease before it occurs, as with vaccines. Colonoscopy and mammogram are secondary prevention; cardiac rehab is tertiary."},
{id:10, cat:"vitals", type:"mc", prompt:"A client's blood pressure drops from 128/78 to 100/70 with a compensatory increase in heart rate within two minutes of standing, and they report dizziness. The nurse suspects:",
 options:[{id:"a",text:"Hypertensive crisis"},{id:"b",text:"Orthostatic hypotension"},{id:"c",text:"Shock"},{id:"d",text:"Bradycardia"}],
 correct:["b"], explanation:"A systolic drop of 20+ mmHg with reflex tachycardia within 1-3 minutes of a position change is orthostatic hypotension."},
{id:11, cat:"process", type:"mc", prompt:"Why does the nurse assess the ABCs before completing a neurological exam on an acutely ill client?",
 options:[{id:"a",text:"Neuro exams take longer to complete"},{id:"b",text:"Airway, breathing, and circulation problems can affect neurological findings"},{id:"c",text:"It is hospital policy to always start with vital signs"},{id:"d",text:"The client is more cooperative early in the assessment"}],
 correct:["b"], explanation:"ABCs are assessed first because compromise in any of them can directly impact neurological status."},
{id:12, cat:"comm", type:"mc", prompt:"Which communication model includes the concepts of sender, encoder, channel, decoder, receiver, and noise?",
 options:[{id:"a",text:"Shannon-Weaver model"},{id:"b",text:"TeamSTEPPS model"},{id:"c",text:"SBAR model"},{id:"d",text:"Health Belief Model"}],
 correct:["a"], explanation:"The Shannon-Weaver model's six concepts are sender, encoder, channel, decoder, receiver, and noise."},
{id:13, cat:"ethics", type:"mc", prompt:"A nurse reports a colleague's unsafe medication practices to hospital administration. This is an example of:",
 options:[{id:"a",text:"Mandatory reporting"},{id:"b",text:"Whistleblowing"},{id:"c",text:"Good Samaritan action"},{id:"d",text:"Informed consent"}],
 correct:["b"], explanation:"Whistleblowing is reporting unethical, illegal, or unsafe practices."},
{id:14, cat:"comm", type:"mc", prompt:"During a client interview, the nurse says, 'So what I'm hearing is that the pain gets worse at night and eases with rest.' This is an example of:",
 options:[{id:"a",text:"Giving advice"},{id:"b",text:"Restating/paraphrasing"},{id:"c",text:"False reassurance"},{id:"d",text:"A closed-ended question"}],
 correct:["b"], explanation:"Restating/paraphrasing reflects back what the client said to confirm understanding — a therapeutic technique."},
{id:15, cat:"ethics", type:"mc", prompt:"HIPAA primarily protects which of the following?",
 options:[{id:"a",text:"A client's right to refuse treatment"},{id:"b",text:"A client's protected health information (PHI)"},{id:"c",text:"A nurse's scope of practice"},{id:"d",text:"A client's right to informed consent"}],
 correct:["b"], explanation:"HIPAA (the Health Insurance Portability and Accountability Act) protects a client's protected health information."},
{id:16, cat:"comm", type:"mc", prompt:"In the ISBARR communication tool, what does the second 'R' stand for?",
 options:[{id:"a",text:"Response"},{id:"b",text:"Read-back"},{id:"c",text:"Referral"},{id:"d",text:"Reassessment"}],
 correct:["b"], explanation:"ISBARR stands for Introduction, Situation, Background, Assessment, Recommendation, Read-back — confirming the receiver understood correctly."},
{id:17, cat:"ebp_doc", type:"mc", prompt:"In a PICOT question, the 'T' stands for:",
 options:[{id:"a",text:"Type of study"},{id:"b",text:"Treatment"},{id:"c",text:"Time"},{id:"d",text:"Team"}],
 correct:["c"], explanation:"PICOT = Population, Intervention, Comparison, Outcome, Time."},
{id:18, cat:"ebp_doc", type:"mc", prompt:"Which documentation method charts only significant findings or deviations from the norm?",
 options:[{id:"a",text:"SOAP charting"},{id:"b",text:"Problem-oriented medical record"},{id:"c",text:"Charting by exception (CBE)"},{id:"d",text:"Focus charting"}],
 correct:["c"], explanation:"Charting by exception (CBE) only documents findings that deviate from the expected norm."},
{id:19, cat:"process", type:"mc", prompt:"Which of the following best demonstrates the 'least restrictive, least invasive' principle in priority setting?",
 options:[{id:"a",text:"Restraining a confused client immediately"},{id:"b",text:"Trying reorientation and a sitter before considering restraints"},{id:"c",text:"Sedating an agitated client right away"},{id:"d",text:"Notifying security before attempting redirection"}],
 correct:["b"], explanation:"The least restrictive/least invasive approach means trying gentler interventions before more restrictive ones like restraints."},
{id:20, cat:"vitals", type:"mc", prompt:"A nursing student asks about the difference between nociceptive and neuropathic pain. Which statement is correct?",
 options:[{id:"a",text:"Nociceptive pain is related to nerve damage; neuropathic pain is related to tissue damage"},{id:"b",text:"Nociceptive pain is related to tissue damage; neuropathic pain is related to nerve damage"},{id:"c",text:"Both types are related to psychological distress only"},{id:"d",text:"Neuropathic pain always resolves within 6 months"}],
 correct:["b"], explanation:"Nociceptive pain relates to tissue damage; neuropathic pain relates to nerve damage."},
{id:21, cat:"vitals", type:"mc", prompt:"A client just finished a cup of ice water. How long should the nurse wait before taking an oral temperature?",
 options:[{id:"a",text:"No wait is needed"},{id:"b",text:"2 to 5 minutes"},{id:"c",text:"15 to 30 minutes"},{id:"d",text:"2 hours"}],
 correct:["c"], explanation:"Hot or cold drinks, food, gum, and smoking change mouth temperature. Wait 15 to 30 minutes before taking an oral temperature."},
{id:22, cat:"vitals", type:"mc", prompt:"A nurse uses a blood pressure cuff that is too small for the client's arm. How will this affect the reading?",
 options:[{id:"a",text:"It will be falsely high"},{id:"b",text:"It will be falsely low"},{id:"c",text:"It will not change the reading"},{id:"d",text:"It will only change the diastolic reading"}],
 correct:["a"], explanation:"A cuff that is too small or too narrow gives a falsely high reading. A cuff that is too large gives a falsely low reading."},
{id:23, cat:"vitals", type:"mc", prompt:"A client's blood pressure is 140/90 mmHg. What is the client's pulse pressure?",
 options:[{id:"a",text:"230 mmHg"},{id:"b",text:"90 mmHg"},{id:"c",text:"70 mmHg"},{id:"d",text:"50 mmHg"}],
 correct:["d"], explanation:"Pulse pressure is the systolic pressure minus the diastolic pressure: 140 − 90 = 50 mmHg."},
{id:24, cat:"vitals", type:"sata", prompt:"A nurse is reviewing an adult client's vital signs. Which findings are outside the expected range? Select all that apply.",
 options:[{id:"a",text:"Heart rate 52/min"},{id:"b",text:"Respiratory rate 24/min"},{id:"c",text:"SpO2 97%"},{id:"d",text:"Temperature 38.4 °C (101.1 °F)"},{id:"e",text:"Blood pressure 116/74 mmHg"}],
 correct:["a","b","d"], explanation:"Expected adult ranges: heart rate 60–100/min, respiratory rate 12–20/min, SpO2 95–100%, and blood pressure under 120/80. A temperature of 38.4 °C is a fever."},
{id:25, cat:"process", type:"mc", prompt:"A nurse is collecting data during an admission assessment. Which finding is subjective data?",
 options:[{id:"a",text:"The client says, \"I feel sick to my stomach.\""},{id:"b",text:"Blood pressure is 132/84 mmHg"},{id:"c",text:"A 3 cm wound on the left heel"},{id:"d",text:"The client vomited 200 mL"}],
 correct:["a"], explanation:"Subjective data is what the client reports and only the client can describe, such as nausea or pain. Objective data is what the nurse can observe or measure."},
{id:26, cat:"process", type:"mc", prompt:"A nurse is planning care for a client after surgery. Using Maslow's hierarchy of needs, which client need should the nurse address first?",
 options:[{id:"a",text:"Anxiety about the surgery results"},{id:"b",text:"Airway clearance"},{id:"c",text:"Learning about the new diet"},{id:"d",text:"Feeling isolated from family"}],
 correct:["b"], explanation:"Physiological needs come first in Maslow's hierarchy, and airway comes first among them. Safety, love and belonging, and esteem needs follow."},
{id:27, cat:"process", type:"mc", prompt:"A client's goal was to walk 50 feet with a walker by day 3. On day 3, the nurse watches the client walk 50 feet with the walker. Which step of the nursing process is the nurse performing?",
 options:[{id:"a",text:"Assessment"},{id:"b",text:"Planning"},{id:"c",text:"Implementation"},{id:"d",text:"Evaluation"}],
 correct:["d"], explanation:"Evaluation compares the client's response to the expected outcome to decide whether the goal was met."},
{id:28, cat:"process", type:"mc", prompt:"Which client outcome is written so the nurse can measure it?",
 options:[{id:"a",text:"The client will understand the new diet"},{id:"b",text:"The client will feel less anxious"},{id:"c",text:"The client will walk 100 feet in the hallway with a walker by the end of the shift"},{id:"d",text:"The client will tolerate activity better"}],
 correct:["c"], explanation:"A measurable outcome names a specific, observable behavior and a time frame. \"Understand,\" \"feel,\" and \"tolerate better\" can't be measured as written."},
{id:29, cat:"process", type:"sata", prompt:"A nurse is caring for a client. Which nursing actions belong to the implementation step of the nursing process? Select all that apply.",
 options:[{id:"a",text:"Giving a prescribed medication"},{id:"b",text:"Reinforcing teaching about the medication"},{id:"c",text:"Repositioning the client every 2 hours"},{id:"d",text:"Writing a goal for the plan of care"},{id:"e",text:"Deciding whether the client met the goal"}],
 correct:["a","b","c"], explanation:"Implementation is carrying out the planned interventions. Writing goals is planning, and deciding whether a goal was met is evaluation."},
{id:30, cat:"ethics", type:"mc", prompt:"After the provider explains the risks and benefits, a client decides not to have a recommended surgery. The nurse supports the client's decision. Which ethical principle is the nurse upholding?",
 options:[{id:"a",text:"Autonomy"},{id:"b",text:"Beneficence"},{id:"c",text:"Justice"},{id:"d",text:"Fidelity"}],
 correct:["a"], explanation:"Autonomy is the client's right to make their own decisions about their care, including refusing treatment."},
{id:31, cat:"ethics", type:"mc", prompt:"A nurse checks a client's allergies before giving a new medication. Which ethical principle does this action reflect?",
 options:[{id:"a",text:"Veracity"},{id:"b",text:"Nonmaleficence"},{id:"c",text:"Justice"},{id:"d",text:"Autonomy"}],
 correct:["b"], explanation:"Nonmaleficence is the duty to do no harm. Checking allergies prevents harm from the medication."},
{id:32, cat:"ethics", type:"mc", prompt:"A client is about to sign a consent form for surgery. What is the nurse's role in informed consent?",
 options:[{id:"a",text:"Explain the risks and benefits of the surgery"},{id:"b",text:"Witness the client's signature and confirm the client understands"},{id:"c",text:"Decide whether the client needs the surgery"},{id:"d",text:"Sign the form for the client if the client is anxious"}],
 correct:["b"], explanation:"The provider explains the procedure, risks, benefits, and alternatives. The nurse witnesses the signature and confirms understanding. If the client has questions, the nurse notifies the provider before the form is signed."},
{id:33, cat:"ethics", type:"sata", prompt:"Which actions by a nurse violate a client's privacy under HIPAA? Select all that apply.",
 options:[{id:"a",text:"Discussing a client's diagnosis in the elevator"},{id:"b",text:"Posting a photo of a client's wound on social media"},{id:"c",text:"Opening the chart of a client the nurse isn't caring for"},{id:"d",text:"Giving report to the oncoming nurse at shift change"},{id:"e",text:"Reviewing the chart of an assigned client"}],
 correct:["a","b","c"], explanation:"Protected health information is shared only with people involved in the client's care, in private. Handoff report and reviewing an assigned client's chart are part of care."},
{id:34, cat:"comm", type:"mc", prompt:"A client says, \"I'm scared about my surgery tomorrow.\" Which response by the nurse is therapeutic?",
 options:[{id:"a",text:"\"Don't worry, everything will be fine.\""},{id:"b",text:"\"Tell me more about what's worrying you.\""},{id:"c",text:"\"Your surgeon is the best in the hospital.\""},{id:"d",text:"\"Why are you scared?\""}],
 correct:["b"], explanation:"An open-ended invitation lets the client share their feelings. \"Don't worry\" and praising the surgeon are false reassurance, and \"why\" questions can make clients feel defensive."},
{id:35, cat:"comm", type:"mc", prompt:"A nurse wants to learn more about a client's pain. Which question is open-ended?",
 options:[{id:"a",text:"\"Is your pain worse today?\""},{id:"b",text:"\"Did the medication help?\""},{id:"c",text:"\"How would you describe your pain?\""},{id:"d",text:"\"Is the pain sharp?\""}],
 correct:["c"], explanation:"Open-ended questions can't be answered with yes or no, so the client gives more detail. The other choices are closed-ended."},
{id:36, cat:"comm", type:"mc", prompt:"Which statement by a nurse is nontherapeutic?",
 options:[{id:"a",text:"\"Why didn't you take your medication?\""},{id:"b",text:"\"You seem upset. I'm here to listen.\""},{id:"c",text:"\"Go on, I'm listening.\""},{id:"d",text:"\"What happened when you stopped the medication?\""}],
 correct:["a"], explanation:"\"Why\" questions sound like a demand for justification and can make the client defensive. The other statements are therapeutic: offering self, a general lead, and an open-ended question."},
{id:37, cat:"comm", type:"mc", prompt:"A nurse is calling the provider using ISBARR. Which statement belongs in the Background section?",
 options:[{id:"a",text:"\"This is Sam, the nurse caring for Ms. Lee in room 12.\""},{id:"b",text:"\"She was admitted 2 days ago for pneumonia and has a history of heart failure.\""},{id:"c",text:"\"I think she may be developing fluid overload.\""},{id:"d",text:"\"I'd like you to come see her and consider a diuretic.\""}],
 correct:["b"], explanation:"Background gives the admitting diagnosis and relevant history. The other choices are Introduction, Assessment, and Recommendation."},
{id:38, cat:"ebp_doc", type:"mc", prompt:"A nurse makes an error while documenting in a paper chart. Which action should the nurse take?",
 options:[{id:"a",text:"Use correction fluid and rewrite the entry"},{id:"b",text:"Erase the entry completely"},{id:"c",text:"Draw a single line through the error, label it as an error, and add initials and the date"},{id:"d",text:"Tear out the page and start over"}],
 correct:["c"], explanation:"The original entry must stay readable. A single line, a note that it was an error, and the nurse's initials and date keep the record legal and accurate."},
{id:39, cat:"ebp_doc", type:"mc", prompt:"A nurse is looking for the strongest evidence to support a change in practice. Which source gives the highest level of evidence?",
 options:[{id:"a",text:"An expert's opinion"},{id:"b",text:"A single case study"},{id:"c",text:"A systematic review of randomized controlled trials"},{id:"d",text:"A descriptive study"}],
 correct:["c"], explanation:"A systematic review or meta-analysis of randomized controlled trials is the highest level of evidence. Expert opinion is the lowest."},
{id:40, cat:"ebp_doc", type:"mc", prompt:"Which documentation entry is written correctly?",
 options:[{id:"a",text:"\"Client ate 50% of breakfast.\""},{id:"b",text:"\"Client has a good appetite.\""},{id:"c",text:"\"Client seems to be in a bad mood.\""},{id:"d",text:"\"Client slept well.\""}],
 correct:["a"], explanation:"Documentation should be objective and specific. \"Good,\" \"bad mood,\" and \"slept well\" are vague judgments."}
];
initPracticeQuiz(bank, catLabels);
</script>
