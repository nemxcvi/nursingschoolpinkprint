<script>
var catLabels = {
  stressbasics: "Stress Basics",
  stressphysiology: "Stress Physiology",
  generaladaptationsyndromegas: "General Adaptation Syndrome (GAS)",
  typesofstressdisorders: "Types of Stress & Disorders",
  crisis: "Crisis",
  copingdefensemechanisms: "Coping & Defense Mechanisms",
  nursingcarestressmanagement: "Nursing Care & Stress Management",
  stressinnursing: "Stress in Nursing"
};
var bank = [
{id:1, cat:"stresscoping", type:"mc", prompt:"A nurse is teaching a class about physical manifestations associated with the fight-or-flight response. Which manifestation should the nurse include?",
 options:[{id:"a",text:"Dilated pupils"},{id:"b",text:"Decreased blood pressure"},{id:"c",text:"Bronchial airway constriction"},{id:"d",text:"Hypoglycemia"}],
 correct:["a"], explanation:"Fight-or-flight causes pupil dilation, increased HR, BP, cardiac output, and blood glucose, and bronchial dilation."},
{id:2, cat:"stresscoping", type:"mc", prompt:"A nurse educator is explaining the HPA axis to a group of nursing students. Which sequence should the educator describe?",
 options:[{id:"a",text:"Adrenal glands release ACTH \u2192 pituitary releases CRH \u2192 hypothalamus releases cortisol"},{id:"b",text:"Hypothalamus releases CRH \u2192 pituitary releases ACTH \u2192 adrenal glands release cortisol"},{id:"c",text:"Pituitary releases cortisol \u2192 hypothalamus releases ACTH \u2192 adrenal glands release CRH"},{id:"d",text:"Hypothalamus releases cortisol \u2192 adrenal glands release CRH \u2192 pituitary releases ACTH"}],
 correct:["b"], explanation:"The hypothalamus releases CRH, which stimulates the pituitary to release ACTH, which stimulates the adrenal glands to release cortisol."},
{id:3, cat:"stresscoping", type:"mc", prompt:"A client is brought to the emergency department minutes after a motor vehicle crash. The client's HR is 118/min, BP is elevated, pupils are dilated, and blood glucose is elevated. Which stage of the general adaptation syndrome is the client experiencing?",
 options:[{id:"a",text:"Alarm"},{id:"b",text:"Resistance"},{id:"c",text:"Exhaustion"},{id:"d",text:"Reappraisal"}],
 correct:["a"], explanation:"In the alarm stage, the adrenal medulla releases catecholamines such as epinephrine, triggering fight-or-flight with increased HR, BP, blood glucose, and alertness and dilated pupils."},
{id:4, cat:"stresscoping", type:"mc", prompt:"A client who has been hospitalized for 2 weeks is irritable, fatigued, and having difficulty concentrating, but vital signs are near their baseline. Which stage of the general adaptation syndrome is the client most likely experiencing?",
 options:[{id:"a",text:"Alarm"},{id:"b",text:"Resistance"},{id:"c",text:"Exhaustion"},{id:"d",text:"Countershock"}],
 correct:["b"], explanation:"In the resistance stage, the body resists the stressor and the parasympathetic system moderates fight-or-flight. Fatigue, irritability, and decreased concentration may occur."},
{id:5, cat:"stresscoping", type:"mc", prompt:"A client who has experienced years of ongoing caregiver stress now has chronic hypertension, depression, and frequent infections. The nurse should recognize these findings as consistent with which of the following?",
 options:[{id:"a",text:"The alarm stage"},{id:"b",text:"The resistance stage"},{id:"c",text:"The exhaustion stage and allostatic load"},{id:"d",text:"Allostasis"}],
 correct:["c"], explanation:"In the exhaustion stage, the body's ability to adapt is depleted and prolonged stress leads to illness and allostatic load, the wear and tear that causes conditions like chronic hypertension and depression. Allostasis is the body adjusting to minor stressors."},
{id:6, cat:"stresscoping", type:"sata", prompt:"A nurse is teaching a group of students about the general adaptation syndrome. Which statements should the nurse include? Select all that apply.",
 options:[{id:"a",text:"The three stages are alarm, resistance, and exhaustion."},{id:"b",text:"It can be triggered by physical or psychological stressors."},{id:"c",text:"It occurs whether a stressor is perceived as positive or negative."},{id:"d",text:"It is triggered only by negative events."},{id:"e",text:"The exhaustion stage occurs first."}],
 correct:["a","b","c"], explanation:"GAS is a three-stage response (alarm, resistance, exhaustion) triggered by physical or psychological stressors, whether positive or negative. Alarm is the first stage."},
{id:7, cat:"stresscoping", type:"mc", prompt:"A nurse is teaching a class about sources of stress. The nurse should include that which of the following is an example of a psychological stressor?",
 options:[{id:"a",text:"Hypothermia"},{id:"b",text:"Financial difficulties"},{id:"c",text:"Burn injury"},{id:"d",text:"Wrist fracture"}],
 correct:["b"], explanation:"Psychological stressors are events or situations a person interprets as negative or threatening, such as financial difficulties. Hypothermia, burns, and fractures are physiological stressors."},
{id:8, cat:"stresscoping", type:"mc", prompt:"A nurse is caring for several clients. Which client is experiencing a physiological stressor?",
 options:[{id:"a",text:"A client going through a divorce"},{id:"b",text:"A client with severe pain from a hip fracture"},{id:"c",text:"A client worried about final exams"},{id:"d",text:"A client living in a noisy, crowded apartment"}],
 correct:["b"], explanation:"Physiological stress comes from injury or illness, such as trauma and pain. Divorce and exam pressure are psychological, and a noisy, crowded home is environmental."},
{id:9, cat:"stresscoping", type:"sata", prompt:"A nurse is reviewing clients' histories for sources of chronic stress. Which findings should the nurse identify? Select all that apply.",
 options:[{id:"a",text:"Living in poverty"},{id:"b",text:"Exposure to racism"},{id:"c",text:"Living with a prolonged illness"},{id:"d",text:"Growing up in a dysfunctional family"},{id:"e",text:"Being in a minor car accident yesterday"}],
 correct:["a","b","c","d"], explanation:"Chronic stress is constant and prolonged, such as poverty, racism, prolonged illness, and a dysfunctional family. A car accident is a source of acute stress."},
{id:10, cat:"stresscoping", type:"mc", prompt:"A student tells the school nurse, \"I wait until the last minute on every assignment, and I'm always panicking to finish on time.\" Which type of stress is the student experiencing?",
 options:[{id:"a",text:"Traumatic stress"},{id:"b",text:"Episodic acute stress"},{id:"c",text:"Environmental stress"},{id:"d",text:"Physiological stress"}],
 correct:["b"], explanation:"Episodic acute stress is frequent bouts of acute stress, often from taking on too much and feeling rushed and disorganized."},
{id:11, cat:"stresscoping", type:"mc", prompt:"A family of six lives in a one-bedroom apartment in a neighborhood with frequent violence and no reliable access to food. Which type of stress should the nurse identify?",
 options:[{id:"a",text:"Environmental stress"},{id:"b",text:"Episodic acute stress"},{id:"c",text:"Physiological stress"},{id:"d",text:"Traumatic stress"}],
 correct:["a"], explanation:"Environmental stress comes from difficult surroundings such as crowding, housing instability, food insecurity, and neighborhood violence."},
{id:12, cat:"stresscoping", type:"sata", prompt:"A nurse is teaching a client about the benefits of exercise for managing stress. Which information should the nurse include? Select all that apply.",
 options:[{id:"a",text:"Decreases energy"},{id:"b",text:"Increases mood"},{id:"c",text:"Inhibits the release of endorphins"},{id:"d",text:"Decreases stress"},{id:"e",text:"Improves sleep"}],
 correct:["b","d","e"], explanation:"Exercise increases mood and energy, decreases stress, improves sleep, and releases endorphins."},
{id:13, cat:"stresscoping", type:"mc", prompt:"Two weeks after being assaulted, a client reports feeling numb and disconnected, is easily startled, and avoids the street where it happened. Which condition should the nurse suspect?",
 options:[{id:"a",text:"Acute stress disorder"},{id:"b",text:"Posttraumatic stress disorder"},{id:"c",text:"Episodic acute stress"},{id:"d",text:"Existential crisis"}],
 correct:["a"], explanation:"ASD starts right after a traumatic event and lasts up to 1 month, with numbness, dissociation, startle, reexperiencing, and avoidance. PTSD is diagnosed if symptoms last beyond 1 month."},
{id:14, cat:"stresscoping", type:"mc", prompt:"A client who survived a house fire 4 months ago continues to have flashbacks and nightmares about the event. Which condition should the nurse suspect?",
 options:[{id:"a",text:"Acute stress disorder"},{id:"b",text:"Posttraumatic stress disorder"},{id:"c",text:"Episodic acute stress"},{id:"d",text:"Developmental crisis"}],
 correct:["b"], explanation:"When symptoms last beyond 1 month after a trauma, PTSD is diagnosed. Flashbacks and nightmares are hallmark manifestations."},
{id:15, cat:"stresscoping", type:"sata", prompt:"A nurse is assessing a client who has posttraumatic stress disorder. Which manifestations should the nurse expect? Select all that apply.",
 options:[{id:"a",text:"Flashbacks of the trauma"},{id:"b",text:"Nightmares"},{id:"c",text:"Exaggerated startle response"},{id:"d",text:"Increased heart rate"},{id:"e",text:"Bradycardia"}],
 correct:["a","b","c","d"], explanation:"PTSD manifestations include flashbacks, nightmares, sweating, increased heart rate, and an exaggerated startle response."},
{id:16, cat:"stresscoping", type:"mc", prompt:"A client completing a health history reports an adverse childhood experiences (ACE) score of 5. Which of the following should the nurse recognize?",
 options:[{id:"a",text:"The client has a significantly higher risk of chronic illness in adulthood."},{id:"b",text:"ACEs only affect mental health during childhood."},{id:"c",text:"An ACE score does not affect adult health."},{id:"d",text:"The client is protected from future stress."}],
 correct:["a"], explanation:"Individuals who score four or more on an ACE questionnaire are at significantly higher risk of developing a chronic illness in adulthood."},
{id:17, cat:"stresscoping", type:"mc", prompt:"A nurse is caring for a client who has been under severe stress for months. Which finding should the nurse recognize as an effect of chronically elevated cortisol?",
 options:[{id:"a",text:"Faster wound healing"},{id:"b",text:"Frequent infections and slow wound healing"},{id:"c",text:"Improved immune function"},{id:"d",text:"Decreased inflammation"}],
 correct:["b"], explanation:"Short-term cortisol enhances some immune functions, but chronic elevation suppresses immunity, causes inflammation, slows healing, and increases infection risk."},
{id:18, cat:"stresscoping", type:"sata", prompt:"A nurse is teaching a community group about health conditions linked to chronic stress. Which conditions should the nurse include? Select all that apply.",
 options:[{id:"a",text:"Hypertension"},{id:"b",text:"Gastric ulcers"},{id:"c",text:"Delayed wound healing"},{id:"d",text:"Sleep disorders"},{id:"e",text:"Hypotension"}],
 correct:["a","b","c","d"], explanation:"Chronic stress is linked to hypertension, CAD, stroke, diabetes, anxiety, depression, immunosuppression, delayed wound healing, gastric ulcers, tension headaches, and sleep disorders."},
{id:19, cat:"stresscoping", type:"mc", prompt:"A client in crisis is pacing, yelling, and threatening to hurt themself. Which action should the nurse take first?",
 options:[{id:"a",text:"Ask the client what triggered the crisis."},{id:"b",text:"Ensure the safety of the client and others."},{id:"c",text:"Explore the client's past coping strategies."},{id:"d",text:"Develop a follow-up plan with the client."}],
 correct:["b"], explanation:"Safety comes first in crisis intervention. After safety is ensured, the nurse can identify the precipitating event, explore coping, and plan for current and future crises."},
{id:20, cat:"stresscoping", type:"sata", prompt:"A nurse is assessing a client in crisis. Which findings indicate the client is experiencing a mental health emergency? Select all that apply.",
 options:[{id:"a",text:"Acting on a suicide threat"},{id:"b",text:"Throwing and breaking items"},{id:"c",text:"Threatening to harm others"},{id:"d",text:"Hostile and belligerent behavior"},{id:"e",text:"Asking to speak with a chaplain"}],
 correct:["a","b","c","d"], explanation:"Signs of a mental health emergency include acting on a suicide threat, hostile or belligerent behavior, throwing or breaking items, and threatening harm."},
{id:21, cat:"stresscoping", type:"mc", prompt:"A client who recently retired after 35 years tells the nurse, \"I don't know what to do with myself now.\" Which type of crisis is the client experiencing?",
 options:[{id:"a",text:"Situational"},{id:"b",text:"Developmental"},{id:"c",text:"Psychiatric emergency"},{id:"d",text:"Adventitious"}],
 correct:["b"], explanation:"Developmental crises are life transitions such as puberty, retirement, menopause, and starting a family."},
{id:22, cat:"stresscoping", type:"mc", prompt:"A nurse plans to use the Perceived Stress Scale with a client. The nurse should explain that this tool measures which of the following?",
 options:[{id:"a",text:"The number of stressful events in the client's environment"},{id:"b",text:"How unpredictable, uncontrollable, and overwhelming the client feels life is over the past month"},{id:"c",text:"The client's cortisol levels"},{id:"d",text:"The client's risk for PTSD"}],
 correct:["b"], explanation:"The PSS is a self-report tool that measures how unpredictable, uncontrollable, and overwhelming a person perceives their life to be over the past month."},
{id:23, cat:"stresscoping", type:"mc", prompt:"A client who survived a serious illness tells the nurse, \"I keep asking myself what the point of my life is and who I'm supposed to be now.\" Which type of crisis should the nurse identify?",
 options:[{id:"a",text:"Developmental"},{id:"b",text:"Situational"},{id:"c",text:"Existential"},{id:"d",text:"Psychiatric emergency"}],
 correct:["c"], explanation:"An existential crisis involves internal conflicts about personal meaning, identity, or purpose."},
{id:24, cat:"stresscoping", type:"mc", prompt:"A client becomes tense and tearful when the nurse approaches to start an IV. The client has a history of trauma. Which action reflects trauma-informed care?",
 options:[{id:"a",text:"Proceed quickly to minimize the client's anxiety."},{id:"b",text:"Explain each step, ask permission, and give the client a sense of control."},{id:"c",text:"Tell the client the reaction is an overreaction."},{id:"d",text:"Postpone the IV without explaining why."}],
 correct:["b"], explanation:"Trauma-informed care recognizes that past trauma shapes a client's responses and focuses on building safety and trust to avoid retraumatizing the client."},
{id:25, cat:"stresscoping", type:"mc", prompt:"A nurse is using Roberts' Seven-Stage Model with a client in crisis. Which action should the nurse take in the first stage?",
 options:[{id:"a",text:"Establish rapport with the client."},{id:"b",text:"Assess the client, including suicide and homicide risk."},{id:"c",text:"Explore the client's past coping strategies."},{id:"d",text:"Implement an action plan."}],
 correct:["b"], explanation:"The first stage is a thorough assessment, including suicide and homicide risk. Rapport is stage 2, exploring coping is stage 5, and the action plan is stage 6."},
{id:26, cat:"stresscoping", type:"mc", prompt:"A nurse is teaching a client about nutrition for managing stress. Which statement by the client indicates a need for further teaching?",
 options:[{id:"a",text:"\"I'll eat more whole grains and beans to help stabilize my blood sugar.\""},{id:"b",text:"\"Oranges can help lower my stress hormones.\""},{id:"c",text:"\"A glass of wine each night will lower my stress levels.\""},{id:"d",text:"\"Eating fish can help improve my mood.\""}],
 correct:["c"], explanation:"Alcohol worsens stress by raising cortisol. Complex carbs stabilize blood sugar, vitamin C lowers stress hormones, and omega-3s improve mood."},
{id:27, cat:"stresscoping", type:"mc", prompt:"A nurse is assigned to a new unit and thinks, \"Is this assignment something I need to worry about?\" According to the Transactional Theory of Stress and Coping, the nurse is in which stage?",
 options:[{id:"a",text:"Primary appraisal"},{id:"b",text:"Secondary appraisal"},{id:"c",text:"Reappraisal"},{id:"d",text:"Exhaustion"}],
 correct:["a"], explanation:"Primary appraisal asks \"Is this a threat?\"\u2014deciding whether the situation is a threat, a challenge, or irrelevant."},
{id:28, cat:"stresscoping", type:"mc", prompt:"A client facing surgery says, \"My sister can help me at home, and I've recovered from surgery before.\" The client is demonstrating which of the following?",
 options:[{id:"a",text:"Primary appraisal"},{id:"b",text:"Secondary appraisal"},{id:"c",text:"Denial"},{id:"d",text:"Projection"}],
 correct:["b"], explanation:"Secondary appraisal asks \"Can I handle it?\" by evaluating available resources such as social support, skills, and past successes."},
{id:29, cat:"stresscoping", type:"sata", prompt:"A nurse is teaching a group of nursing students about the Transactional Theory of Stress and Coping. Which statements should the nurse include? Select all that apply.",
 options:[{id:"a",text:"Stress is a dynamic transaction between a person and their environment."},{id:"b",text:"How a person appraises a stressor determines their response."},{id:"c",text:"Reappraisal is an ongoing reassessment of the stressor and resources."},{id:"d",text:"Secondary appraisal evaluates available resources."},{id:"e",text:"Stress is a static event that doesn't change once it occurs."}],
 correct:["a","b","c","d"], explanation:"TTSC views stress as a dynamic transaction between person and environment, shaped by appraisal. Reappraisal continually reassesses the stressor and resources."},
{id:30, cat:"stresscoping", type:"mc", prompt:"After losing their job, a client creates a monthly budget and applies to three new jobs. The client is using which type of coping?",
 options:[{id:"a",text:"Problem-focused coping"},{id:"b",text:"Emotion-focused coping"},{id:"c",text:"Denial"},{id:"d",text:"Regression"}],
 correct:["a"], explanation:"Problem-focused coping involves changing the situation itself."},
{id:31, cat:"stresscoping", type:"mc", prompt:"A nursing student who failed a quiz says, \"One quiz doesn't define whether I'll be a good nurse.\" The student is using which type of coping?",
 options:[{id:"a",text:"Problem-focused coping"},{id:"b",text:"Emotion-focused coping"},{id:"c",text:"Rationalization"},{id:"d",text:"Suppression"}],
 correct:["b"], explanation:"Emotion-focused coping changes how a person feels about the situation by reframing or avoiding it, without changing the situation itself."},
{id:32, cat:"stresscoping", type:"mc", prompt:"A nurse is assessing a client's coping strategies. Which strategy should the nurse identify as adaptive?",
 options:[{id:"a",text:"Smoking a cigarette after a stressful day"},{id:"b",text:"Going for a walk after a stressful day"},{id:"c",text:"Drinking alcohol to relax"},{id:"d",text:"Withdrawing from friends and family"}],
 correct:["b"], explanation:"Adaptive coping, such as exercise, helps in the short and long term. Smoking, drinking, and withdrawal give short-term relief but cause long-term harm."},
{id:33, cat:"stresscoping", type:"sata", prompt:"A nurse is reviewing a client's coping behaviors. Which behaviors should the nurse identify as maladaptive? Select all that apply.",
 options:[{id:"a",text:"Smoking"},{id:"b",text:"Drinking alcohol"},{id:"c",text:"Withdrawing from friends"},{id:"d",text:"Exercising regularly"},{id:"e",text:"Planning ahead for stressful events"}],
 correct:["a","b","c"], explanation:"Maladaptive coping provides short-term relief but long-term harm, such as smoking, drinking, and withdrawal. Exercise and planning ahead are adaptive."},
{id:34, cat:"stresscoping", type:"mc", prompt:"A client newly diagnosed with type 2 diabetes continues eating as usual and tells the nurse, \"The doctor is overreacting. I don't really have diabetes.\" Which defense mechanism is the client using?",
 options:[{id:"a",text:"Denial"},{id:"b",text:"Projection"},{id:"c",text:"Rationalization"},{id:"d",text:"Regression"}],
 correct:["a"], explanation:"Denial is refusing to acknowledge a distressing reality."},
{id:35, cat:"stresscoping", type:"mc", prompt:"A client who is angry about a new cancer diagnosis tells the nurse, \"Why are you being so hostile toward me?\" even though the nurse has been calm. Which defense mechanism is the client using?",
 options:[{id:"a",text:"Denial"},{id:"b",text:"Projection"},{id:"c",text:"Repression"},{id:"d",text:"Compartmentalization"}],
 correct:["b"], explanation:"Projection is blaming one's own undesirable feelings or tendencies on others. The client is attributing their own anger to the nurse."},
{id:36, cat:"stresscoping", type:"mc", prompt:"A nurse is required to follow a care plan that conflicts with what the nurse believes is ethically right for the client. The nurse feels frustrated and guilty and has trouble sleeping. Which action should the nurse take?",
 options:[{id:"a",text:"Ignore the feelings until they pass."},{id:"b",text:"Seek support through a formal debriefing, peers, or the ethics committee."},{id:"c",text:"Stop caring for clients with similar care plans."},{id:"d",text:"Keep the concerns private to avoid conflict."}],
 correct:["b"], explanation:"The nurse is experiencing moral distress. Ways to reduce it include ethics committees, formal debriefings, support from peers and leadership, and the ANA Code of Ethics."},
{id:37, cat:"stresscoping", type:"mc", prompt:"A 4-year-old who was toilet trained begins wetting the bed after a new sibling is born. Which defense mechanism is the child demonstrating?",
