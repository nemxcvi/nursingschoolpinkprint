};
var CARDS = [
[1,"integument","Skin's first line of defense — 2 roles","Physical barrier against pathogens; contains Langerhans cells that help activate the immune response"],
[2,"integument","3 layers of skin","Epidermis (outermost, avascular), dermis (connective tissue, nerves, blood vessels), hypodermis (subcutaneous fat, insulation)"],
[3,"integument","Mucous membranes","Line the respiratory, digestive, and urinary tracts; secrete mucus that traps pathogens"],
[4,"integument","Tooth enamel","The hardest material in the human body; the tooth's first line of defense against plaque and pathogens"],
[5,"integument","HAI (health care–associated infection)","An infection that develops while a client is in a health care facility and wasn't present on admission"],
[6,"integument","When to use alcohol-based hand sanitizer","Before touching a client, before sterile technique, after touching the client/environment, after body fluid contact, after glove removal"],
[7,"integument","When to use soap and water instead of sanitizer","When hands are visibly soiled, after caring for a client with infectious diarrhea, after exposure to C. diff spores"],
[8,"integument","How long to wash hands with soap and water","15–20 seconds, covering all surfaces, using cool or warm (not hot) water to avoid drying the skin"],
[9,"bathing","Complete bed bath — who needs it","Clients who are unable to ambulate to the bathroom and bathe themselves"],
[10,"bathing","Why bath basins are a risk","They've been shown to harbor pathogens and can aid in transferring them between clients"],
[11,"bathing","CHG bathing","Chlorhexidine gluconate bathing — cloths premoistened with CHG are massaged over all skin except the face, used to reduce infection risk (common in the ICU)"],
[12,"bathing","Direction to wash extremities","Distal to proximal (e.g., hand toward shoulder) to promote venous blood flow"],
[13,"bathing","Why prepackaged no-rinse washcloths are used","They decrease the risk of skin deterioration compared to traditional soap-and-water bathing"],
[14,"bathing","Bed bath water temperature","43°C (110°F)"],

[16,"bathing","Order of a complete bed bath","Face first, then trunk/upper extremities, then lower extremities, keeping washed areas covered as you go"],
[17,"oral","How often to brush teeth","Twice a day, about 2 minutes each time, with fluoride toothpaste"],
[18,"oral","Gingivitis","Inflammation of the gums caused by plaque from poor oral hygiene; can progress to periodontitis"],
[19,"oral","Ventilator-associated pneumonia (VAP)","Pneumonia from bacteria entering the lungs through an artificial airway in a ventilated client — oral hygiene helps prevent it"],
[20,"oral","Unconscious client — oral care positioning","Position on one side with the head turned toward the mattress so secretions drain out; never place fingers in the mouth"],
[21,"oral","Removing upper vs lower dentures","Upper: pull down and out at the front. Lower: push up and out at the front"],

[24,"oral","Flossing frequency and purpose","Once daily — removes bacteria and plaque from between teeth and below the gumline"],
[25,"foot","Diabetic foot care — key rule","Should be performed by a qualified professional; never soak the feet (softens skin, raises infection risk)"],
[26,"foot","Toenail trimming technique","Cut straight across, then file any sharp edges — reduces ingrown toenail risk"],
[27,"foot","Diabetic client foot care — lotion rule","Apply lotion to the feet but never between the toes (moisture there raises fungal infection risk)"],

[29,"foot","Foot care water temperature caution","Use warm, not hot, water — clients with neuropathy may have an impaired ability to sense burns"],
[30,"foot","Signs to report during a foot inspection","Cuts, blisters, cracked skin, discoloration, or any sign of infection"],
[31,"foot","Diabetic client — nail cutting policy","File the nails instead of cutting for clients who have diabetes or peripheral vascular disease, per many facility policies"],

[36,"perineal","Perineal care — why front to back matters","Prevents transferring rectal bacteria to the urethra, reducing UTI risk"],

[39,"special","Bathing method preferred after stroke","Showering — lower fall risk than a tub bath"],
