<script>
var catLabels = {
  musculo: "Musculoskeletal & neuro",
  mechanics: "Body mechanics & ergonomics",
  effects: "Effects of immobility",
  assess: "Assessment & devices",
  position: "Positioning & ROM",
  heatcold: "Heat/cold & venous return"
};
var bank = [
{id:1, cat:"musculo", type:"mc", prompt:"A nurse is assessing a client's ability to reach across midline and shake hands as part of a mobility assessment. The client is unable to perform this task. Which action should the nurse take first?",
 options:[{id:"a",text:"Assign Level 1 (maximum assist) mobility"},{id:"b",text:"Instruct the client to march in place"},{id:"c",text:"Apply a gait belt and ambulate the client"},{id:"d",text:"Document the client as Level 4, no assist"}],
 correct:["a"], explanation:"A client who cannot perform the Level 1 handshake/sitting tasks is assigned maximum assist per the BMAT, requiring a mechanical lift and 2 or more staff before any further mobility attempts."},
{id:2, cat:"musculo", type:"mc", prompt:"A charge nurse is teaching a nursing student about the role of proprioception in maintaining balance. Which statement should the charge nurse include?",
 options:[{id:"a",text:"It's the sensory feedback from muscles and joints that creates the brain's awareness of body position."},{id:"b",text:"It's the process bones use to produce red blood cells."},{id:"c",text:"It's the hardening of bone tissue that occurs with age."},{id:"d",text:"It's the chemical signal muscles send to relax after contracting."}],
 correct:["a"], explanation:"Proprioception (kinesthesia) is sensory feedback from muscles and joints that creates self-awareness of body position, enabling balance and coordination."},
{id:3, cat:"musculo", type:"mc", prompt:"A charge nurse is teaching a nursing student about the difference between tendons and ligaments. Which statement by the student indicates understanding?",
 options:[{id:"a",text:"Tendons connect muscles to bones, and ligaments connect bone to bone."},{id:"b",text:"Tendons and ligaments both connect muscle to muscle."},{id:"c",text:"Ligaments produce the force that moves bones."},{id:"d",text:"Tendons cushion joints so the bones don't rub together."}],
 correct:["a"], explanation:"Tendons connect muscle to bone; ligaments connect bone to bone. Cartilage, not tendons, cushions joints."},
{id:4, cat:"musculo", type:"mc", prompt:"A nurse is teaching a nursing student about the role of the skeletal system beyond movement. Which statement by the student indicates understanding?",
 options:[{id:"a",text:"Bones store calcium and produce blood cells in addition to supporting the body."},{id:"b",text:"Bones only provide a framework for movement."},{id:"c",text:"Bones do not play a role in protecting organs."},{id:"d",text:"Bone marrow has no function related to blood cells."}],
 correct:["a"], explanation:"In addition to support and movement, bones protect organs, produce blood cells in the marrow, and store minerals like calcium."},
{id:5, cat:"mechanics", type:"mc", prompt:"A nurse is preparing to reposition a client who is unable to assist. Which action should the nurse take first?",
 options:[{id:"a",text:"Obtain assistance from another staff member"},{id:"b",text:"Bend at the waist to grasp the draw sheet"},{id:"c",text:"Reposition the client without raising the bed"},{id:"d",text:"Twist at the torso to pull the client up in bed"}],
 correct:["a"], explanation:"Getting lift assistance before moving a client who cannot assist decreases injury risk to both nurse and client, and should happen before repositioning begins."},
{id:6, cat:"mechanics", type:"sata", prompt:"A nurse is teaching a group of nursing assistants about proper body mechanics when lifting. Which statements should the nurse include?",
 options:[{id:"a",text:"Bend your knees, not your back."},{id:"b",text:"Keep the object as far from your body as possible."},{id:"c",text:"Pivot your feet instead of twisting your torso."},{id:"d",text:"Tighten your abdominal muscles before lifting."},{id:"e",text:"Lift using the muscles in your lower back."}],
 correct:["a","c","d"], explanation:"Bending the knees, pivoting instead of twisting, and contracting the abdominal muscles are correct body mechanics. Objects should stay close to the body, and lifting should use the leg (quadriceps) muscles, not the back."},
{id:7, cat:"mechanics", type:"mc", prompt:"A nurse is teaching a client's caregiver about ergonomics in the home. Which statement by the caregiver indicates a need for further teaching?",
 options:[{id:"a",text:"I'll keep frequently used items on a shelf that's easy to reach without bending."},{id:"b",text:"I'll try to lift my spouse alone to save time between tasks."},{id:"c",text:"I'll use a shower chair to make bathing safer."},{id:"d",text:"I'll make sure the walking path is clear of clutter."}],
 correct:["b"], explanation:"Solo lifting increases injury risk; 'minimal lift' or 'never lift alone' practices are core ergonomic safety principles, so this statement shows a need for further teaching."},
{id:8, cat:"effects", type:"mc", prompt:"A nurse is caring for a client on prolonged bed rest who reports sudden shortness of breath, chest pain, and a rapid pulse. Which action should the nurse take first?",
 options:[{id:"a",text:"Notify the provider immediately"},{id:"b",text:"Encourage the client to use an incentive spirometer"},{id:"c",text:"Apply antiembolic stockings"},{id:"d",text:"Document the findings and reassess in 1 hour"}],
 correct:["a"], explanation:"These are manifestations of a pulmonary embolism, a life-threatening complication of immobility, requiring immediate provider notification."},
{id:9, cat:"effects", type:"mc", prompt:"A nurse is teaching a client about disuse osteoporosis. Which statement should the nurse include?",
 options:[{id:"a",text:"Bed rest reduces the mechanical stress your bones need to stay strong."},{id:"b",text:"Bed rest increases the rate new bone is made."},{id:"c",text:"Disuse osteoporosis only affects the spine."},{id:"d",text:"Osteoporosis from bed rest rebuilds faster than muscle loss."}],
 correct:["a"], explanation:"Prolonged immobility reduces mechanical load on bones, disrupting the normal balance between bone growth and breakdown, leading to demineralization. Rebuilding bone mass takes longer than rebuilding muscle."},
{id:10, cat:"effects", type:"sata", prompt:"A nurse is teaching a client about signs of a possible deep vein thrombosis. Which statements by the client indicate correct understanding?",
 options:[{id:"a",text:"I should watch for swelling, warmth, or redness in one leg."},{id:"b",text:"I should massage the area if it feels tender."},{id:"c",text:"I should tell the nurse if one calf looks bigger than the other."},{id:"d",text:"I can cross my legs to relieve pressure."},{id:"e",text:"I should tell the nurse about any new leg pain."}],
 correct:["a","c","e"], explanation:"Swelling, warmth, redness, a unilateral calf size difference, and new leg pain are all DVT manifestations. Massaging a suspected clot or crossing the legs, which compresses veins, are unsafe."},
{id:11, cat:"assess", type:"mc", prompt:"A nurse is preparing to ambulate a client for the first time since surgery. Which action should the nurse take first?",
 options:[{id:"a",text:"Have the client sit on the edge of the bed for a few minutes before standing"},{id:"b",text:"Assist the client to stand and start walking immediately"},{id:"c",text:"Remove the client's nonskid footwear for comfort"},{id:"d",text:"Instruct the client to hold their breath while standing"}],
 correct:["a"], explanation:"Sitting briefly before standing allows the nurse to assess for orthostatic hypotension before full ambulation, reducing fall risk."},
{id:12, cat:"assess", type:"mc", prompt:"A nurse is teaching a client how to safely use a standard walker. Which instruction should the nurse include?",
 options:[{id:"a",text:"Advance the walker about 6 to 8 inches, then set it down on all four feet before stepping."},{id:"b",text:"Push the walker several feet ahead before taking a step."},{id:"c",text:"Lean your full body weight onto the walker with your elbows locked straight."},{id:"d",text:"Use the walker to go up and down a flight of stairs."}],
 correct:["a"], explanation:"The walker should be advanced 15 to 20 cm (6 to 8 in) and set down fully before stepping, with elbows flexed 15 to 30 degrees. Walkers should never be used on stairs."},
{id:13, cat:"assess", type:"mc", prompt:"A nurse is teaching a client who has a left leg injury how to use a cane. Which statement by the client indicates understanding?",
 options:[{id:"a",text:"I'll hold the cane in my right hand."},{id:"b",text:"I'll hold the cane in my left hand."},{id:"c",text:"I'll move my right leg forward first, then the cane."},{id:"d",text:"I'll keep only one point of contact with the floor at a time."}],
 correct:["a"], explanation:"The cane is held on the stronger, unaffected side — here, the right hand, since the injury is on the left. Two points of support should stay on the floor at all times."},
{id:14, cat:"assess", type:"mc", prompt:"A nurse assesses a client using a Timed Up and Go (TUG) test. The client takes 15 seconds to complete the test. Which action should the nurse take first?",
 options:[{id:"a",text:"Identify the client as being at increased risk for falls"},{id:"b",text:"Document the finding as a normal result"},{id:"c",text:"Discontinue further mobility assessment"},{id:"d",text:"Encourage the client to ambulate independently without supervision"}],
 correct:["a"], explanation:"A TUG time greater than 12 seconds in an older adult indicates an increased fall risk, prompting the nurse to implement fall precautions."},
{id:15, cat:"position", type:"mc", prompt:"A nurse is caring for a client who was just diagnosed with a pulmonary embolism. Which action should the nurse take first?",
 options:[{id:"a",text:"Position the client in high-Fowler's"},{id:"b",text:"Position the client supine and flat"},{id:"c",text:"Encourage the client to ambulate in the hallway"},{id:"d",text:"Apply a heating pad to the chest"}],
 correct:["a"], explanation:"High-Fowler's positioning is prioritized for a client with a PE to promote optimal lung expansion and gas exchange while awaiting further treatment."},
{id:16, cat:"position", type:"sata", prompt:"A nurse is teaching a client about positions that help prevent complications of immobility. Which statements should the nurse include?",
 options:[{id:"a",text:"Lying prone helps prevent contractures in the hips and knees."},{id:"b",text:"The Trendelenburg position helps drain the lower lobes of your lungs."},{id:"c",text:"Lying flat on your back is best for preventing pressure injuries."},{id:"d",text:"Side-lying with a pillow between your knees reduces pressure on your sacrum."},{id:"e",text:"Fowler's position helps your lungs expand more fully."}],
 correct:["a","b","d","e"], explanation:"Prone prevents contractures, Trendelenburg promotes lung drainage and venous return, lateral with a pillow reduces sacral and heel pressure, and Fowler's promotes lung expansion. Lying flat does not specifically prevent pressure injury — repositioning does."},
{id:17, cat:"position", type:"mc", prompt:"A nurse is reviewing range-of-motion exercises with an assistive personnel (AP). Which statement by the AP indicates an understanding of passive ROM?",
 options:[{id:"a",text:"I move the client's joints through their range of motion for them."},{id:"b",text:"I encourage the client to move their own joints without my help."},{id:"c",text:"Passive ROM will build the client's muscle strength the same as active ROM."},{id:"d",text:"I only perform ROM exercises if the client requests them."}],
 correct:["a"], explanation:"Passive ROM is performed by the caregiver for the client, who does not participate; active ROM is performed by the client independently. Passive ROM helps maintain joint mobility but does not build muscle strength or prevent bone loss the way active, participatory movement does."},
{id:18, cat:"heatcold", type:"mc", prompt:"A nurse applies an ice pack to a client's swollen ankle. Fifteen minutes later, the client reports numbness and the skin appears mottled. Which action should the nurse take first?",
 options:[{id:"a",text:"Remove the ice pack immediately"},{id:"b",text:"Reapply the ice pack for another 15 minutes"},{id:"c",text:"Document the finding and check again in 1 hour"},{id:"d",text:"Apply a warm compress on top of the ice pack"}],
 correct:["a"], explanation:"Numbness and mottling are signs of tissue damage from cold therapy — the application should be discontinued immediately."},
{id:19, cat:"heatcold", type:"mc", prompt:"A nurse is teaching a client about the use of sequential compression devices (SCDs). Which statement should the nurse include?",
 options:[{id:"a",text:"The device will keep the blood pumping through your legs to help prevent clots."},{id:"b",text:"The device will prevent pressure injuries on your skin."},{id:"c",text:"The device will keep your leg muscles from becoming weak."},{id:"d",text:"The device will keep your joints flexible."}],
 correct:["a"], explanation:"SCDs promote venous return and help prevent clot formation by mimicking the muscle-pump action that moves blood back to the heart."},
{id:20, cat:"heatcold", type:"sata", prompt:"A nurse is teaching a client about factors that reduce the risk of thrombus formation. Which statements by the client indicate understanding?",
 options:[{id:"a",text:"I'll avoid crossing my legs while sitting."},{id:"b",text:"I'll wear my elastic stockings all day and remove them only per the nurse's instructions."},{id:"c",text:"I'll try to avoid holding my breath while straining."},{id:"d",text:"I'll ask for a pillow to place under my knees."},{id:"e",text:"I'll try to change positions frequently."}],
 correct:["a","b","c","e"], explanation:"Avoiding leg crossing, wearing compression stockings as directed, avoiding the Valsalva maneuver, and frequent position changes all reduce thrombus risk. Pillows under the knees increase venous compression and should be avoided."},
{id:21, cat:"musculo", type:"mc", prompt:"A nurse is assessing a client's synovial joints as part of a musculoskeletal exam. Which finding should the nurse identify as expected?",
 options:[{id:"a",text:"Smooth, pain-free movement of the joint through its range"},{id:"b",text:"Grinding sensation with movement"},{id:"c",text:"Joint swelling and warmth"},{id:"d",text:"Inability to bear weight"}],
 correct:["a"], explanation:"Synovial joints normally allow smooth, flexible movement. Grinding, swelling/warmth, or inability to bear weight are abnormal findings requiring further assessment."},
{id:22, cat:"musculo", type:"mc", prompt:"A charge nurse is teaching a nursing student about how nerve cells contribute to movement. Which statement should the charge nurse include?",
 options:[{id:"a",text:"Nerve cells in the spinal cord signal muscles to contract, which pulls on the bones to create movement."},{id:"b",text:"Nerve cells store calcium that strengthens bones."},{id:"c",text:"Nerve cells produce the collagen found in tendons."},{id:"d",text:"Nerve cells generate the heat muscles produce."}],
 correct:["a"], explanation:"Nerve cells in the spinal cord fire signals that cause muscles to contract; as muscles shorten, they pull against the bones they're attached to, generating movement."},
{id:23, cat:"musculo", type:"mc", prompt:"A nursing student is describing the role of cartilage. Which statement indicates understanding?",
 options:[{id:"a",text:"Cartilage lets the ends of my bones glide over each other without grinding."},{id:"b",text:"Cartilage connects my muscles directly to my bones."},{id:"c",text:"Cartilage produces red blood cells."},{id:"d",text:"Cartilage sends nerve signals to my muscles."}],
 correct:["a"], explanation:"Cartilage reduces friction between bones, allowing them to glide smoothly and absorb shock."},
{id:24, cat:"mechanics", type:"mc", prompt:"A nurse observes a colleague lifting a heavy box by bending at the waist with straight knees. Which action should the nurse take first?",
 options:[{id:"a",text:"Remind the colleague to bend the knees and use the leg muscles"},{id:"b",text:"Allow the colleague to continue since the box is already lifted"},{id:"c",text:"Wait until after the task to mention proper technique"},{id:"d",text:"Report the colleague to the manager immediately"}],
 correct:["a"], explanation:"Correcting unsafe body mechanics in the moment helps prevent an acute back injury; the nurse should intervene promptly rather than waiting or escalating unnecessarily."},
{id:25, cat:"mechanics", type:"sata", prompt:"A nurse is teaching new staff about ergonomic risk factors in the workplace. Which examples should the nurse include?",
 options:[{id:"a",text:"Poor lighting in a supply room"},{id:"b",text:"A height-adjustable bed"},{id:"c",text:"Repetitive lifting without breaks"},{id:"d",text:"A wide, stable base when standing"},{id:"e",text:"Whole-body vibration from equipment"}],
 correct:["a","c","e"], explanation:"Poor lighting, repetitive lifting without breaks, and whole-body vibration are ergonomic risk factors. A height-adjustable bed and a wide stable base are examples of good ergonomic practice, not risk factors."},
{id:26, cat:"mechanics", type:"mc", prompt:"A nurse is teaching a client's family member about using a gait belt safely. Which statement indicates understanding?",
 options:[{id:"a",text:"I should be able to slip my fingers under the belt once it's fastened."},{id:"b",text:"I should fasten the belt as tightly as possible with no space underneath."},{id:"c",text:"The belt should be placed over bare skin only."},{id:"d",text:"The belt is only used for clients who can walk independently."}],
 correct:["a"], explanation:"A gait belt should be snug but allow the caregiver to slip fingers underneath for safety and adjustment; it should not be applied so tight that there's no space."},
{id:27, cat:"effects", type:"mc", prompt:"A nurse is caring for a client on bed rest who has not had a bowel movement in 4 days and reports abdominal discomfort. Which action should the nurse take first?",
 options:[{id:"a",text:"Auscultate bowel sounds and palpate the abdomen"},{id:"b",text:"Administer a laxative without further assessment"},{id:"c",text:"Encourage the client to increase activity immediately"},{id:"d",text:"Document the finding and reassess in 24 hours"}],
 correct:["a"], explanation:"The nurse should assess bowel sounds and the abdomen for distention or discomfort before intervening, to help determine whether this is simple constipation or a more serious complication like impaction."},
{id:28, cat:"effects", type:"mc", prompt:"A nurse is teaching a client about why bed rest increases the risk of pneumonia. Which statement should the nurse include?",
 options:[{id:"a",text:"Shallow breathing and thickened secretions make it harder to clear your lungs."},{id:"b",text:"Bed rest increases the depth of your breaths."},{id:"c",text:"Lying flat improves the effectiveness of your cough."},{id:"d",text:"Bed rest has no effect on your risk for lung infections."}],
 correct:["a"], explanation:"Supine positioning decreases breathing depth and coughing effectiveness, and dehydration thickens secretions — together these raise the risk of pneumonia."},
{id:29, cat:"effects", type:"mc", prompt:"A client asks the nurse why they need to reposition every 2 hours. Which statement by the client indicates understanding of the teaching?",
 options:[{id:"a",text:"Changing position keeps the pressure off any one area of my skin for too long."},{id:"b",text:"Repositioning helps me digest my food faster."},{id:"c",text:"Repositioning prevents my blood pressure from dropping when I stand."},{id:"d",text:"Changing position helps my bones absorb more calcium."}],
 correct:["a"], explanation:"Frequent repositioning relieves prolonged pressure on bony prominences, reducing the risk of pressure injury."},
{id:30, cat:"effects", type:"sata", prompt:"A nurse is caring for a client on bed rest for 1 week. Which findings should the nurse identify as expected complications of immobility?",
 options:[{id:"a",text:"Reports of new leg weakness"},{id:"b",text:"Increased appetite"},{id:"c",text:"Reddened area over the sacrum"},{id:"d",text:"Reports of feeling short of breath with minimal exertion"},{id:"e",text:"Improved bowel regularity"}],
 correct:["a","c","d"], explanation:"Muscle weakness, skin breakdown over bony prominences, and decreased activity tolerance/dyspnea are all expected complications of immobility. Increased appetite and improved bowel regularity are not — immobility typically decreases appetite and causes constipation."},
{id:31, cat:"assess", type:"mc", prompt:"A nurse is assessing a client who can sit on the edge of the bed with feet on the floor and extend one leg but cannot maintain a standing position. According to the BMAT, which level should the nurse assign?",
 options:[{id:"a",text:"Level 2, moderate assist"},{id:"b",text:"Level 1, maximum assist"},{id:"c",text:"Level 3, minimal assist"},{id:"d",text:"Level 4, no assist"}],
 correct:["a"], explanation:"A client who can perform the Level 2 tasks (sitting with feet on floor, extending the leg) but cannot progress to standing independently is assigned Level 2, moderate assist."},
{id:32, cat:"assess", type:"mc", prompt:"A nurse is teaching a client who is starting a cardiac rehabilitation program how to use the Borg Rating of Perceived Exertion (RPE) scale. Which statement by the nurse is accurate?",
 options:[{id:"a",text:"I will use this scale to rate how hard you appear to be working based on your breathing and color."},{id:"b",text:"You will use this scale to rate how hard the activity feels to you, from very light to maximal effort."},{id:"c",text:"This scale uses your heart rate and blood pressure to calculate your exercise intensity."},{id:"d",text:"This scale measures how far you can walk before needing to rest."}],
 correct:["b"], explanation:"The Borg RPE scale is a subjective tool the client uses to rate how hard an activity feels to them, from very light to maximal effort, rather than a measurement based on the nurse's observation, vital signs, or distance walked."},
{id:33, cat:"assess", type:"mc", prompt:"A nurse is teaching a client how to safely use axillary crutches. Which statement indicates understanding?",
 options:[{id:"a",text:"I'll support my weight through my hands on the grips, not under my arms."},{id:"b",text:"I'll rest my body weight on the crutch pads under my arms."},{id:"c",text:"I'll keep my elbows locked straight when using the grips."},{id:"d",text:"I'll place the crutches directly under my arms for the most support."}],
 correct:["a"], explanation:"Weight should be supported at the hand grips, never in the axilla — bearing weight on the crutch pads can cause nerve damage (crutch palsy)."},
{id:34, cat:"position", type:"mc", prompt:"A nurse is caring for a client with a stage 2 pressure injury on the sacrum. Which position should the nurse avoid for extended periods?",
 options:[{id:"a",text:"Supine with prolonged pressure on the sacrum"},{id:"b",text:"Left lateral with a pillow between the knees"},{id:"c",text:"Prone with pillows supporting the hips"},{id:"d",text:"Right lateral with heels elevated off the bed"}],
 correct:["a"], explanation:"Prolonged supine positioning places direct, sustained pressure on the sacrum, worsening an existing pressure injury there; lateral or prone positioning off-loads that area."},
{id:35, cat:"position", type:"mc", prompt:"A nurse is teaching an assistive personnel about the purpose of a slide board for client transfers. Which statement should the nurse include?",
 options:[{id:"a",text:"A slide board creates a bridge so the client can slide sideways between two level surfaces without being lifted."},{id:"b",text:"A slide board is used to help the client come to a full standing position before pivoting."},{id:"c",text:"A slide board replaces the need for a gait belt when transferring a client."},{id:"d",text:"A slide board is used to reposition a client up in bed when they have slid toward the foot of the bed."}],
 correct:["a"], explanation:"A slide board bridges two level surfaces (such as a bed and stretcher) so an immobile client can be slid across laterally without staff lifting their full weight. It is not used for standing pivot transfers, as a gait belt replacement, or for repositioning a client up in bed."},
{id:36, cat:"position", type:"mc", prompt:"A nurse is teaching a client the purpose of the Trendelenburg position. Which statement indicates understanding?",
