<script>
var CATS = {
  musculo: {label:"Musculoskeletal & neuro foundations", hue:"blue"},
  mechanics: {label:"Body mechanics & ergonomics", hue:"green"},
  effects: {label:"Effects of immobility", hue:"red"},
  assess: {label:"Mobility assessment & assistive devices", hue:"violet"},
  position: {label:"Positioning, transfers & ROM", hue:"yellow"},
  heatcold: {label:"Heat/cold therapy & venous return", hue:"orange"}
};
var CARDS = [
[1,"musculo","Main function of skeletal muscle","Movement — working with the skeleton to create body movement"],
[2,"musculo","3 functions of skeletal muscle","Movement, posture/positioning, and generating body heat (e.g., shivering)"],
[3,"musculo","5 functions of the skeletal system","Support (framework), protect (organs), produce (blood cells in marrow), storage (calcium/phosphorus/minerals), movement (with muscles)"],
[4,"musculo","Proprioception (kinesthesia)","Sensory feedback from muscles/joints to the brain that creates self-awareness of body position and coordinates balance/movement"],
[5,"musculo","Central vs peripheral nervous system","Central = brain + spinal cord; peripheral = nerves that interface with the spinal cord and communicate with muscles/sensory receptors via neurotransmitters"],
[6,"musculo","Cartilage's role in a joint","Reduces friction between bones, letting them glide over each other and absorb shock"],
[7,"musculo","Tendons vs ligaments","Tendons connect muscle to bone; ligaments connect bone to bone"],
[8,"musculo","Synovial joints","Fluid-filled joints that allow flexibility and movement of bones (bending of limbs)"],
[9,"mechanics","Body mechanics","The combined effort of the musculoskeletal and nervous systems to maintain posture, alignment, and balance during activity"],
[10,"mechanics","Body alignment (posture)","Positioning body parts so an imaginary vertical line runs through the ear, shoulder, hip, knee, and ankle"],
[11,"mechanics","Center of gravity","The central point of weight; lowering it (bending knees, wide stance) improves balance and stability"],
[12,"mechanics","Correct body mechanics when lifting","Stand close to the object, bend the knees (not the back), keep abdominal muscles contracted, avoid twisting — pivot or side-step instead"],
[13,"mechanics","Which leg muscles to use for lifting","The quadriceps — the strongest muscles in the body"],
[14,"mechanics","Ergonomics","The study of body mechanics in relation to the design of the work environment and equipment, to allow safe, efficient work"],
[15,"mechanics","3 risk factor categories in workplace ergonomics","Practice controls (lighting, transfer lifts), physical characteristics (posture, repetition), environmental hazards (stress, falls)"],
[16,"mechanics","ANA Safe Patient Handling Campaign","Advocates eliminating manual lifting of clients to reduce nurse back injuries"],
[17,"effects","Disuse osteoporosis","Thinning/weakening of bone from prolonged bed rest due to demineralization — increases fragility fracture risk"],
[18,"effects","Sarcopenia","Loss of lean muscle mass from deterioration of twitch fibers; lower extremities are affected first"],
[19,"effects","Joint contracture","Abnormal fixed joint position from muscle/connective tissue imbalance — stronger flexor muscles pull the joint into a bent, nonfunctional position"],
[20,"effects","Foot drop","Inability to dorsiflex the foot from nerve entrapment and shortened calf muscles/Achilles tendon — causes toe dragging while walking"],
[21,"effects","Orthostatic hypotension","SBP drop of 20+ mmHg or DBP drop of 10+ mmHg within 3 minutes of sitting or standing. Related to immobility because bed rest lowers circulating blood volume and causes cardiac deconditioning, so the body can't compensate fast enough when position changes"],
[22,"effects","Deep vein thrombosis (DVT)","A blood clot (thrombus) that forms in a deep vein, usually in the leg. Related to immobility because muscle atrophy weakens the calf-muscle pump that normally returns blood to the heart, and increased blood viscosity promotes venous stasis — both let clots form"],
[23,"effects","Atelectasis","Partial/complete lung collapse from shallow breathing — reduces the alveoli available for gas exchange"],
[24,"effects","Why immobile clients are prone to constipation","Slowed peristalsis and prolonged transit time increase water absorption from feces, and supine positioning decreases the urge to defecate"],
[25,"effects","Why immobility causes urinary retention","Supine positioning impairs gravity-assisted bladder drainage and reduces the urge to void"],
[26,"effects","Areas at highest risk for pressure injury","Bony prominences: back of the head, shoulder blades, elbows, sacrum, ischium, heels"],
[27,"effects","Cardiac deconditioning","Atrophy of the heart muscle from lower circulating blood volume and reduced demand during immobility"],
[28,"effects","Psychological effects of immobility","Increased dependence, loss of privacy, frustration, anxiety, depression, social isolation"],
[29,"assess","BMAT Level 1","Maximum assist — client can't shake hands across midline or sit on the edge of bed for 2 min; needs mechanical lift/slide board, 2+ staff"],
[30,"assess","BMAT Level 2","Moderate assist — client can sit with feet on floor and move legs but can't safely bear weight; needs a sit-to-stand lift, 2+ staff"],
[31,"assess","BMAT Level 3","Minimal assist — client can rise from sitting and stand 5+ seconds with an assistive device; needs a gait belt, 1–2 staff"],
[32,"assess","BMAT Level 4","No assist — client can march in place and step forward/backward independently"],
[33,"assess","Timed Up & Go (TUG) test","Client stands, walks 10 ft, turns, returns, and sits; over 12 seconds = increased fall risk in older adults"],
[34,"assess","Borg RPE scale","Subjective exertion scale, 6 (resting) to 20 (max effort); target activity zone is 12–14"],
[35,"assess","Cane height/fit","Top of the cane level with the wrist crease; elbow bent 20–30° when gripping; held on the stronger side"],
[36,"assess","Walker height/fit","Top of the walker at wrist level; elbows bent 15–30° when standing inside it"],
[37,"assess","Axillary crutch fit","Crutch pads 1–2 inches below the axilla; hand grips at hip level; elbows bent 20–30°"],
[38,"assess","Crutch weight-bearing rule","Body weight is supported at the hand grips, never in the axilla — axillary pressure can cause crutch palsy (nerve damage)"],
[39,"position","Fowler's position","Semi-seated, head of bed elevated 45° — promotes lung expansion"],
[40,"position","High-Fowler's vs semi-Fowler's","High-Fowler's = 60–90°; semi-Fowler's = 15–30°"],
[41,"position","Trendelenburg position","Foot of bed higher than head — promotes venous return and drainage of the lower lung lobes"],
[42,"position","Prone position benefit","Full extension of hip/knee joints (prevents contractures); promotes drainage of secretions"],
[43,"position","Lateral position benefit","Promotes spinal alignment; reduces pressure on the sacrum and heels"],
[44,"position","Slide/transfer board","Used for lateral transfer of an immobile client (e.g., gurney to bed); needs 3–4 staff"],
[45,"position","Pivot disc","Used for clients who can stand but have difficulty moving their feet during a transfer"],
[46,"position","Active vs passive ROM","Active = client moves the joint themselves; passive = someone else moves it for them (preserves flexibility but doesn't prevent muscle/bone loss)"],
[47,"position","Flexion vs extension","Flexion bends and decreases the angle between bones; extension straightens the limb"],
[48,"heatcold","Therapeutic effects of heat","Increases blood flow and tissue metabolism, relaxes muscles, eases joint stiffness/pain"],
[49,"heatcold","Therapeutic effects of cold","Decreases inflammation/swelling/bleeding/fever, diminishes muscle spasms, decreases pain by slowing nerve conduction"],
[50,"heatcold","When to avoid heat application","First 24 hr after traumatic injury, active bleeding, over metal implants, on a pregnant client's abdomen, or under an immobile client"],
[51,"heatcold","How antiembolic (elastic) stockings work","External pressure on lower extremity muscles promotes venous blood return to the heart"],
[52,"heatcold","SCD inflation/deflation cycle","Typically 10–15 seconds inflation, 45–60 seconds deflation"],
[53,"heatcold","ROM exercises that prevent thrombophlebitis","Ankle pumps, foot circles, knee flexion"],
[54,"heatcold","Suspected DVT — nursing action","Notify the provider and elevate the leg — never massage or apply pressure to the area"],
[55,"heatcold","Pulmonary embolism manifestations","Sudden shortness of breath, chest pain, hemoptysis, decreased BP, rapid pulse"],
[56,"heatcold","Pulmonary embolism positioning","High-Fowler's position"]
];
