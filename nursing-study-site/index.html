<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nursing School Pinkprint</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<link rel="stylesheet" href="assets/style.css">
<script>(function(){var s=localStorage.getItem("theme");if(s==="dark")document.documentElement.setAttribute("data-theme","dark");})();</script>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <h1 id="sitetitle">Nursing School Pinkprint<span class="pulse-wrap"><svg id="pulsesvg" height="32"><path id="pulsepath" class="pulse-line"></path></svg></span></h1>
    </div>
    <button class="iconbtn" onclick="toggleTheme()" aria-label="Toggle dark mode">
      <i id="themeicon" class="ti ti-moon" aria-hidden="true"></i>
    </button>
  </div>

  <div class="searchwrap">
    <i class="ti ti-search" aria-hidden="true"></i>
    <input type="text" id="unitsearch" placeholder="Search" oninput="renderHome()">
  </div>

  <div class="tags">
    <button class="tag active" id="tag-all" onclick="setTag('all')">All</button>
    <button class="tag" id="tag-flashcards" onclick="setTag('flashcards')">Flashcards</button>
    <button class="tag" id="tag-quizzes" onclick="setTag('quizzes')">Quizzes</button>
  </div>

  <p class="eyebrow" id="resultseyebrow">NUR 114 units</p>

  <div class="grid" id="unitgrid">
    <a class="card" href="unit-1-intro-to-nursing/">
      <div class="unit-icon" style="background:var(--u1-bg);color:var(--u1-text);"><i class="ti ti-heartbeat" aria-hidden="true"></i></div>
      <p class="title">Unit 1 &middot; Intro to Nursing</p>
      <p class="count">5 widgets</p>
    </a>
    <a class="card" href="unit-2-basic-human-needs/">
      <div class="unit-icon" style="background:var(--u2-bg);color:var(--u2-text);"><i class="ti ti-bed" aria-hidden="true"></i></div>
      <p class="title">Unit 2 &middot; Basic Human Needs</p>
      <p class="count">7 widgets</p>
    </a>
    <a class="card" href="unit-3-skin-wounds-diagnostics/">
      <div class="unit-icon" style="background:var(--u3-bg);color:var(--u3-text);"><i class="ti ti-test-pipe" aria-hidden="true"></i></div>
      <p class="title">Unit 3 &middot; Skin, Wounds &amp; Diagnostics</p>
      <p class="count">0 widgets</p>
    </a>
    <a class="card" href="unit-4-fluids-nutrition/">
      <div class="unit-icon" style="background:var(--u4-bg);color:var(--u4-text);"><i class="ti ti-droplet" aria-hidden="true"></i></div>
      <p class="title">Unit 4 &middot; Fluids &amp; Nutrition</p>
      <p class="count">0 widgets</p>
    </a>
    <a class="card" href="unit-5-gas-exchange-med-math/">
      <div class="unit-icon" style="background:var(--u5-bg);color:var(--u5-text);"><i class="ti ti-calculator" aria-hidden="true"></i></div>
      <p class="title">Unit 5 &middot; Gas Exchange &amp; Med Math</p>
      <p class="count">0 widgets</p>
    </a>
    <a class="card" href="unit-6-pharmacology-med-admin/">
      <div class="unit-icon" style="background:var(--u6-bg);color:var(--u6-text);"><i class="ti ti-prescription" aria-hidden="true"></i></div>
      <p class="title">Unit 6 &middot; Pharmacology &amp; Med Admin</p>
      <p class="count">0 widgets</p>
    </a>
  </div>

  <div id="widgetresults" style="display:none;"></div>

</div>

<script src="assets/theme.js"></script>
<script>
var WIDGETS = [
  {title:"General Abbreviations", type:"flashcards", unit:"Unit 1", href:"unit-1-intro-to-nursing/general-abbreviations.html"},
  {title:"Charting Abbreviations", type:"flashcards", unit:"Unit 1", href:"unit-1-intro-to-nursing/charting-abbreviations.html"},
  {title:"CBC/CMP lab values", type:"flashcards", unit:"Unit 1", href:"unit-1-intro-to-nursing/cbc-cmp-lab-values.html"},
  {title:"Nursing Fundamentals practice quiz", type:"quiz", unit:"Unit 1", href:"unit-1-intro-to-nursing/nursing-fundamentals-quiz.html"},
  {title:"CBC/CMP practice quiz", type:"quiz", unit:"Unit 1", href:"unit-1-intro-to-nursing/cbc-cmp-quiz.html"},
  {title:"Unit 1 mixed quiz", type:"quiz", unit:"Unit 1", href:"unit-1-intro-to-nursing/mix-quiz.html"},
  {title:"Mobility", type:"flashcards", unit:"Unit 2", href:"unit-2-basic-human-needs/mobility-flashcards.html"},
  {title:"Mobility practice quiz", type:"quiz", unit:"Unit 2", href:"unit-2-basic-human-needs/mobility-quiz.html"},
  {title:"Hygiene", type:"flashcards", unit:"Unit 2", href:"unit-2-basic-human-needs/hygiene-flashcards.html"},
  {title:"Hygiene practice quiz", type:"quiz", unit:"Unit 2", href:"unit-2-basic-human-needs/hygiene-quiz.html"},
  {title:"Client Education", type:"flashcards", unit:"Unit 2", href:"unit-2-basic-human-needs/client-education-flashcards.html"},
  {title:"Client Education practice quiz", type:"quiz", unit:"Unit 2", href:"unit-2-basic-human-needs/client-education-quiz.html"},
  {title:"Unit 2 mixed quiz", type:"quiz", unit:"Unit 2", href:"unit-2-basic-human-needs/mix-quiz.html"}
];
var MIX_ALL = {title:"Mix all", type:"quiz", unit:"All units", href:"mix-all-quiz.html", special:true};

var state = {tag:"all"};

function setTag(tag){
  state.tag = tag;
  ["all","flashcards","quizzes"].forEach(function(t){
    document.getElementById("tag-" + t).classList.toggle("active", t === tag);
  });
  renderHome();
}

function renderHome(){
  var q = document.getElementById("unitsearch").value.trim().toLowerCase();
  var unitsGrid = document.getElementById("unitgrid");
  var widgetList = document.getElementById("widgetresults");
  var eyebrow = document.getElementById("resultseyebrow");

  if (q === "" && state.tag === "all"){
    unitsGrid.style.display = "grid";
    widgetList.style.display = "none";
    eyebrow.textContent = "NUR 114 units";
    return;
  }

  unitsGrid.style.display = "none";
  widgetList.style.display = "block";

  var items = WIDGETS.slice();
  if (state.tag === "quizzes") items = items.filter(function(w){ return w.type === "quiz"; });
  if (state.tag === "flashcards") items = items.filter(function(w){ return w.type === "flashcards"; });
  if (q) items = items.filter(function(w){ return w.title.toLowerCase().indexOf(q) !== -1 || w.unit.toLowerCase().indexOf(q) !== -1; });

  eyebrow.textContent = q ? ('results for "' + q + '"') : (state.tag === "quizzes" ? "all quizzes" : "all flashcards");

  var html = "";
  if (items.length === 0){
    html = "<p class='muted' style='text-align:center;padding:2rem 0;'>No matches.</p>";
  } else {
    html = items.map(function(w){
      var icon = w.type === "quiz" ? "ti-help-circle" : "ti-cards";
      return "<a class='widgetrow' href='" + w.href + "'><div><p class='title'>" + w.title + "</p><p class='sub'>" + w.unit + " &middot; " + (w.type === "quiz" ? "Quiz" : "Flashcards") + "</p></div><i class='ti " + icon + " chev' aria-hidden='true'></i></a>";
    }).join("");
  }

  var showMixAll = state.tag === "quizzes" && (q === "" || MIX_ALL.title.toLowerCase().indexOf(q) !== -1);
  if (showMixAll){
    html += "<div style='border-top:0.5px solid var(--border);margin:24px 0 16px;'></div>";
    html += "<p class='eyebrow'>Mix it up</p>";
    html += "<a class='widgetrow' style='border-color:var(--border-accent);' href='" + MIX_ALL.href + "'><div style='display:flex;align-items:center;gap:12px;'><i class='ti ti-arrows-shuffle' style='font-size:20px;color:var(--text-accent);' aria-hidden='true'></i><div><p class='title'>" + MIX_ALL.title + "</p><p class='sub'>Random from every quiz on the site</p></div></div></a>";
  }

  widgetList.innerHTML = html;
}

renderHome();

function buildPulsePath(){
  var titleEl = document.getElementById("sitetitle");
  var svg = document.getElementById("pulsesvg");
  var path = document.getElementById("pulsepath");
  if (!titleEl || !svg || !path) return;

  var flatEnd = titleEl.offsetWidth;
  var tailWidth = 90;
  var y = 8;

  var d = "M0," + y + " L" + flatEnd + "," + y;
  var bx = flatEnd;
  d += " L" + (bx + 8) + "," + y;
  d += " L" + (bx + 16) + "," + (y - 14);
  d += " L" + (bx + 26) + "," + (y + 16);
  d += " L" + (bx + 36) + "," + (y - 8);
  d += " L" + (bx + 46) + "," + y;
  d += " L" + (bx + tailWidth) + "," + y;

  svg.setAttribute("width", flatEnd + tailWidth);
  path.setAttribute("d", d);
  path.setAttribute("pathLength", "1");
}

buildPulsePath();
window.addEventListener("resize", buildPulsePath);
</script>
</body>
</html>
