<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz engine test &mdash; Nursing School Pinkprint</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<link rel="stylesheet" href="../assets/style.css?v=48">
<script>(function(){var s=localStorage.getItem("theme");if(s==="dark")document.documentElement.setAttribute("data-theme","dark");var p=localStorage.getItem("palette");if(p==="blue"){document.documentElement.setAttribute("data-palette","blue");var fi=document.querySelector("link[rel=icon]");if(fi)fi.href=fi.href.replace("favicon.svg","favicon-blue.svg");}if(localStorage.getItem("paletteHintSeen")==="1")document.documentElement.setAttribute("data-hint-seen","1");})();</script>
</head>
<body>
<div id="site-header" data-mode="compact" data-sheet="nur114" data-unit="U-02" data-type="quizzes"></div>
<script src="../assets/site-data.js?v=4"></script>
<script src="../assets/header.js?v=7"></script>
<div class="wrap">
  <h2 style="margin-bottom:6px;">Quiz engine test</h2>
  <p class="muted" style="margin:0 0 18px;">Test page, not linked from the site. One drag-and-drop and one select-all-that-apply sample.</p>

  <div id="pq-setup-screen">
    <p class="pq-step">1 &middot; Choose a mode</p>
    <div class="pq-modes">
      <button type="button" class="pq-mode-btn" data-mode="single" aria-pressed="true"><span class="pq-mode-title"><span class="pq-check" aria-hidden="true"></span>One session</span><span class="pq-mode-sub">Answer a set of questions once, then see your results.</span></button>
      <button type="button" class="pq-mode-btn" data-mode="rounds" aria-pressed="false"><span class="pq-mode-title"><span class="pq-check" aria-hidden="true"></span>Mastery rounds</span><span class="pq-mode-sub">Practice in rounds until you clear the whole pool, then see your stats.</span></button>
    </div>
    <p class="pq-step">2 &middot; How many questions?</p>
    <div class="pq-count-row" id="pq-counts" data-single="2" data-rounds="2">
      <button type="button" class="pq-count-btn" data-count="2" aria-pressed="false">2</button>
    </div>
    <button type="button" class="btn btn-primary pq-start" id="pq-start">Start quiz &rarr;</button>
  </div>

  <div id="pq-quiz-screen" class="hidden">
    <div class="pq-top-row"><span id="pq-progress"></span><span class="pq-top-right"><span id="pq-score"></span><button type="button" class="pq-endlink" id="pq-end-test">End &amp; see results</button></span></div>
    <div class="pq-progress-track"><div id="pq-progress-bar" class="pq-progress-fill"></div></div>
    <div id="pq-prompt" class="pq-prompt"></div>
    <div id="pq-type-label" class="pq-type-label"></div>
    <div id="pq-options" class="pq-options"></div>
    <p id="pq-error" class="pq-error">select at least one answer</p>
    <div id="pq-feedback" class="pq-feedback" aria-live="polite"></div>
    <div class="pq-btn-row">
      <button type="button" class="btn btn-primary" id="pq-submit" disabled>Check answer</button>
      <button type="button" class="btn btn-primary hidden" id="pq-next">Next question &rarr;</button>
    </div>
    <p class="kbd-hint" id="pq-hint" aria-hidden="true"></p>
  </div>

  <div id="pq-round-complete-screen" class="hidden pq-center">
    <div id="rc-title" style="font-size:16px;font-weight:600;margin-bottom:10px;"></div>
    <div id="rc-score" class="pq-stat-big"></div>
    <div class="pq-stat-sub">this round</div>
    <div id="rc-detail" class="pq-stat-detail"></div>
    <button class="btn btn-primary" id="rc-continue" style="margin-top:16px;max-width:200px;margin-left:auto;margin-right:auto;">continue</button>
  </div>

  <div id="pq-end-screen" class="hidden">
    <div class="pq-center" style="margin-bottom:16px;">
      <div id="end-title" style="font-size:16px;font-weight:600;margin-bottom:10px;"></div>
      <div id="end-rounds-subtitle" class="hidden muted" style="margin-bottom:16px;"></div>
      <div id="end-stats-single" class="hidden">
        <div id="end-score" class="pq-stat-big"></div>
        <div id="end-percent" class="muted"></div>
      </div>
      <div id="end-stats-rounds" class="hidden" style="display:flex;justify-content:center;gap:40px;">
        <div><div id="end-pool-pct" class="pq-stat-big"></div><div class="muted">of pool completed</div></div>
        <div><div id="end-accuracy-pct" class="pq-stat-big"></div><div class="muted">overall accuracy</div></div>
      </div>
    </div>
    <p id="category-heading" class="eyebrow"></p>
    <div id="category-grid" class="pq-cat-grid"></div>
    <p class="eyebrow">review</p>
    <div id="review-list" style="margin-bottom:20px;"></div>
    <div class="pq-btn-row">
      <button class="btn btn-secondary" id="end-restart">practice again</button>
      <button class="btn btn-primary" id="end-missed">redo missed questions</button>
    </div>
  </div>
</div>

<script src="../assets/theme.js?v=6"></script>
<script src="../assets/practice-quiz.js?v=7"></script>
<script>
var catLabels = {samples: "Samples"};
var bank = [
{"id": 1, "cat": "samples", "type": "dragdrop", "stem": "A nurse is teaching a client who has a new diagnosis of type 2 diabetes mellitus. Which actions address the cognitive domain of learning? Move the correct actions to the answer box.", "leftLabel": "Nursing actions", "rightLabel": "Cognitive domain actions", "options": [{"text": "Give the client a pamphlet on carbohydrate counting", "correct": true, "rationale": "Reading materials help the client gain and store knowledge, which is cognitive learning."}, {"text": "Ask the client to explain which foods raise blood glucose", "correct": true, "rationale": "Question-and-answer checks what the client knows and understands, which is cognitive learning."}, {"text": "Have the client return-demonstrate a fingerstick glucose check", "correct": false, "rationale": "Return demonstration shows the client can perform a skill, which is the psychomotor domain."}, {"text": "Role-play how the client will tell coworkers about the diagnosis", "correct": false, "rationale": "Role play works on feelings, values, and beliefs, which is the affective domain."}, {"text": "Watch the client draw up insulin and give feedback", "correct": false, "rationale": "Coaching a hands-on skill is the psychomotor domain."}], "summary": "Head, heart, hands: cognitive is thinking, affective is feelings, psychomotor is doing."},
{"id": 2, "cat": "samples", "type": "sata", "prompt": "A nurse is reviewing morning lab results for an adult female client. Which findings should the nurse report to the provider? Select all that apply.", "options": [{"text": "Potassium 5.8 mEq/L", "correct": true, "rationale": "Normal potassium is 3.5–5 mEq/L, so 5.8 is high."}, {"text": "Sodium 128 mEq/L", "correct": true, "rationale": "Normal sodium is 136–145 mEq/L, so 128 is low."}, {"text": "Platelets 95,000/mm³", "correct": true, "rationale": "Normal platelets are 150,000–400,000/mm³, so 95,000 is low."}, {"text": "Hemoglobin 13 g/dL", "correct": false, "rationale": "Normal hemoglobin for an adult female is 12–16 g/dL, so 13 is within range."}, {"text": "WBC 7,500/mm³", "correct": false, "rationale": "Normal WBC is 5,000–10,000/mm³, so 7,500 is within range."}, {"text": "Glucose 90 mg/dL", "correct": false, "rationale": "Normal glucose is 74–106 mg/dL, so 90 is within range."}], "summary": "Report values outside the normal adult range."}
];
initPracticeQuiz(bank, catLabels);
</script>
</body>
</html>
