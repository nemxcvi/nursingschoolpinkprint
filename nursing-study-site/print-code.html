<script>(function(){var s=localStorage.getItem("theme");if(s==="dark")document.documentElement.setAttribute("data-theme","dark");var p=localStorage.getItem("palette");if(p==="blue"){document.documentElement.setAttribute("data-palette","blue");var fi=document.querySelector("link[rel=icon]");if(fi)fi.href=fi.href.replace("favicon.svg","favicon-blue.svg");}if(localStorage.getItem("paletteHintSeen")==="1")document.documentElement.setAttribute("data-hint-seen","1");})();</script>
</head>
<body>
<div class="tp-print">
  <div class="tp-brand tp-brand-print">Nursing School <span>Pinkprint</span></div>
  <h1 class="tp-h1">Your tracking code</h1>
  <div class="tp-print-qr" id="pc-qr" role="img" aria-label="QR code for your progress code"></div>
  <div class="tp-code tp-print-code" id="pc-code"></div>
  <p class="tp-hint">Keep this private. To see your progress on another device, open nursingschoolpinkprint.com and type this code, or scan the QR code.</p>
  <p class="tp-hint">Nobody can recover a lost code, not even the site owner.</p>
  <button type="button" class="tp-btn tp-noprint" onclick="window.print()">Print</button>
</div>
<script src="assets/vendor/qrcode.js?v=1"></script>
<script src="js/tracking.js?v=6"></script>
<script>
(function(){
  /* The code arrives in the #part (never sent to the server) and is cleared from the address bar */
  var m = location.hash.match(/^#code=([a-z0-9-]+)$/i);
  history.replaceState(null, "", location.pathname);
  if (!m){ document.getElementById("pc-code").textContent = "No code to show."; return; }
  var code = m[1].split("-").join(" ");
  document.getElementById("pc-code").textContent = code;
  document.getElementById("pc-qr").innerHTML = Tracking.qrSvg(Tracking.linkUrl(code), 6);
  setTimeout(function(){ window.print(); }, 400);
})();
</script>
</body>
