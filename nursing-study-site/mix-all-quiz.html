ting a client's progress after an amputation. Which findings indicate the plan of care for altered self-concept has been effective? Select all that apply.", "options": [{"id": "a", "text": "The client verbalizes statements of self-worth."}, {"id": "b", "text": "The client uses healthy coping strategies during physical therapy."}, {"id": "c", "text": "The client looks at the residual limb during dressing changes."}, {"id": "d", "text": "The client refuses to discuss being fitted for a prosthesis."}, {"id": "e", "text": "The client states, \"I'm useless now.\""}], "correct": ["a", "b", "c"], "explanation": "Statements of self-worth, healthy coping, and acceptance of body appearance and function indicate an effective plan. Avoidance and negative self-talk indicate unresolved self-concept concerns."}, {"id": 258, "cat": "selfconcept", "type": "mc", "prompt": "A nurse is assessing how a client's culture influences their self-concept. Which client statement reflects a healthy integration of culture?", "options": [{"id": "a", "text": "\"My family's traditions help me feel confident in who I am.\""}, {"id": "b", "text": "\"I try to hide my cultural background so I fit in.\""}, {"id": "c", "text": "\"I compare myself to people on social media to decide how I should look.\""}, {"id": "d", "text": "\"My culture doesn't really matter to how I see myself.\""}], "correct": ["a"], "explanation": "Individuals who have effectively integrated their culture tend to have a healthier self-concept, and it protects them against biases and stereotypes projected by media."}, {"id": 259, "cat": "selfconcept", "type": "mc", "prompt": "A nurse is teaching a group of nursing students about self-concept. Which statement by a student indicates an understanding of the teaching?", "options": [{"id": "a", "text": "\"Self-concept is fixed once it forms in early childhood.\""}, {"id": "b", "text": "\"Self-concept can change based on new experiences and feedback.\""}, {"id": "c", "text": "\"Self-concept affects a person's thoughts but not their behavior.\""}, {"id": "d", "text": "\"Self-concept is determined mostly by genetics.\""}], "correct": ["b"], "explanation": "Self-concept is learned and dynamic, and people refine it based on new information and feedback. It influences behavior, choices, and interactions with others, not just internal thoughts."}, {"id": 260, "cat": "selfconcept", "type": "mc", "prompt": "A nurse is caring for a 14-year-old male client who has not yet gone through a growth spurt and is shorter than his peers. Which of the following should the nurse recognize?", "options": [{"id": "a", "text": "Boys who mature later report greater body dissatisfaction than early-maturing peers."}, {"id": "b", "text": "Adolescent males rarely have body image concerns."}, {"id": "c", "text": "Body image concerns in adolescence are limited to females."}, {"id": "d", "text": "Late maturation improves body image because it delays societal pressure."}], "correct": ["a"], "explanation": "Boys who mature later and have not achieved socially accepted body ideals report greater body dissatisfaction than peers who mature earlier. Adolescent males are not immune to body image concerns."}, {"id": 261, "cat": "comfortrestsleep", "type": "mc", "prompt": "A nurse is teaching a client who asks about using melatonin for sleep. Which statement by the client indicates an understanding of the teaching?", "options": [{"id": "a", "text": "\"Melatonin is non-habit forming and has few adverse effects.\""}, {"id": "b", "text": "\"Melatonin is the most commonly prescribed sleep medication.\""}, {"id": "c", "text": "\"Melatonin works better than any other sleep medication.\""}, {"id": "d", "text": "\"Melatonin should only be used by older adults.\""}], "correct": ["a"], "explanation": "Melatonin is cost-effective, non-habit forming, and has few adverse effects, and it may be first-line for all ages. However, its effectiveness may be limited, and nonbenzodiazepine hypnotics are the most commonly prescribed sleep meds."}, {"id": 262, "cat": "comfortrestsleep", "type": "mc", "prompt": "A nurse is caring for an older adult client who reports difficulty sleeping. The provider wants to start with the option that has the fewest adverse effects and no risk of dependence. Which medication should the nurse anticipate?", "options": [{"id": "a", "text": "Lorazepam"}, {"id": "b", "text": "Zolpidem"}, {"id": "c", "text": "Melatonin"}, {"id": "d", "text": "Diphenhydramine"}], "correct": ["c"], "explanation": "Melatonin may be the first-line option for all ages because it is non-habit forming with few adverse effects. Benzodiazepines carry dependence risk and require caution in older adults, zolpidem has abuse potential, and diphenhydramine causes anticholinergic effects."}, {"id": 263, "cat": "comfortrestsleep", "type": "mc", "prompt": "A nurse is reviewing sleep medications with a group of nursing students. Which class of medications should the nurse identify as the most commonly prescribed for sleep?", "options": [{"id": "a", "text": "Benzodiazepines"}, {"id": "b", "text": "Nonbenzodiazepine hypnotics"}, {"id": "c", "text": "Antihistamines"}, {"id": "d", "text": "Antidepressants"}], "correct": ["b"], "explanation": "Nonbenzodiazepine hypnotics (the z-drugs, such as zolpidem) are the most commonly prescribed sleep medications."}, {"id": 264, "cat": "comfortrestsleep", "type": "mc", "prompt": "A nurse is teaching a client who has a new prescription for zolpidem. The nurse should instruct the client that which of the following is an adverse effect of this medication?", "options": [{"id": "a", "text": "Urinary retention"}, {"id": "b", "text": "Memory loss"}, {"id": "c", "text": "Hypertension"}, {"id": "d", "text": "Bradycardia"}], "correct": ["b"], "explanation": "Adverse effects of nonbenzodiazepine hypnotics include GI discomfort, hallucinations, and memory loss. Urinary retention is associated with OTC antihistamine sleep aids."}, {"id": 265, "cat": "comfortrestsleep", "type": "sata", "prompt": "A nurse is teaching a client who plans to use diphenhydramine for sleep. Which adverse effects should the nurse include? Select all that apply.", "options": [{"id": "a", "text": "Dry mouth"}, {"id": "b", "text": "Difficulty urinating"}, {"id": "c", "text": "Constipation"}, {"id": "d", "text": "Visual disturbances"}, {"id": "e", "text": "Diarrhea"}], "correct": ["a", "b", "c", "d"], "explanation": "OTC sleep aids such as diphenhydramine can cause daytime drowsiness, dry mouth, visual disturbances, difficulty urinating, and constipation. The nurse should encourage the client to discuss options with their provider first."}, {"id": 266, "cat": "comfortrestsleep", "type": "mc", "prompt": "A nurse is reviewing a prescription for lorazepam for an 82-year-old client who has insomnia. Which finding is most important for the nurse to report to the provider?", "options": [{"id": "a", "text": "The client drinks one cup of decaf coffee each morning."}, {"id": "b", "text": "The client has decreased kidney and liver function."}, {"id": "c", "text": "The client naps for 20 minutes each afternoon."}, {"id": "d", "text": "The client reports mild anxiety about sleeping."}], "correct": ["b"], "explanation": "Benzodiazepines should be used cautiously in older adults with decreased liver and kidney function because the medication may not be cleared effectively."}, {"id": 267, "cat": "comfortrestsleep", "type": "mc", "prompt": "A client who has been taking clonazepam for sleep asks why the provider wants to stop it after a few weeks. Which response by the nurse is appropriate?", "options": [{"id": "a", "text": "\"It stops working after a few weeks.\""}, {"id": "b", "text": "\"Long-term use can lead to physical dependence.\""}, {"id": "c", "text": "\"It causes high blood pressure over time.\""}, {"id": "d", "text": "\"It is only approved for use in children.\""}], "correct": ["b"], "explanation": "Clients can develop physical dependence on benzodiazepines, so they are not recommended for long-term use."}, {"id": 268, "cat": "comfortrestsleep", "type": "mc", "prompt": "A hospitalized client asks the nurse for a snack before bed. Which snack should the nurse offer to promote sleep?", "options": [{"id": "a", "text": "A piece of candy"}, {"id": "b", "text": "Toast with peanut butter"}, {"id": "c", "text": "Slices of lunchmeat"}, {"id": "d", "text": "A cup of cheese cubes"}], "correct": ["b"], "explanation": "A bedtime snack that promotes sleep pairs a carbohydrate with a protein. Protein alone (lunchmeat, cheese) is not recommended, and candy is a simple sugar with no protein."}, {"id": 269, "cat": "comfortrestsleep", "type": "mc", "prompt": "A nurse wakes a client at 0200 to obtain vital signs. The client is confused and groggy for the next 45 minutes. The nurse should recognize that the client was most likely awakened from which stage of sleep?", "options": [{"id": "a", "text": "Wake stage"}, {"id": "b", "text": "Stage 1"}, {"id": "c", "text": "Stage 2"}, {"id": "d", "text": "Stage 3"}], "correct": ["d"], "explanation": "Stage 3 is the deepest sleep. A person awakened during stage 3 may have mental cloudiness that lasts 30 to 60 minutes."}, {"id": 270, "cat": "comfortrestsleep", "type": "mc", "prompt": "A nurse observes a sleeping client whose eyes are moving rapidly under the eyelids, whose breathing is irregular, and whose heart rate is slightly elevated. The client's limbs are completely relaxed. Which stage of sleep is the client in?", "options": [{"id": "a", "text": "Stage 1"}, {"id": "b", "text": "Stage 2"}, {"id": "c", "text": "Stage 3"}, {"id": "d", "text": "REM"}], "correct": ["d"], "explanation": "During REM (stage 4), breathing is irregular, heart rate may be elevated, and skeletal muscles are atonic. It is the dreaming stage."}, {"id": 271, "cat": "comfortrestsleep", "type": "mc", "prompt": "A nursing student asks why the body loses skeletal muscle tone during REM sleep. Which response by the nurse is appropriate?", "options": [{"id": "a", "text": "\"It lowers the heart rate to its slowest point.\""}, {"id": "b", "text": "\"It prevents the person from physically acting out their dreams.\""}, {"id": "c", "text": "\"It allows muscles to repair and regenerate.\""}, {"id": "d", "text": "\"It helps the person fall into deeper sleep.\""}], "correct": ["b"], "explanation": "Skeletal muscles are atonic during REM, which protects the person from acting out their dreams. Muscle and tissue repair occurs in stage 3."}, {"id": 272, "cat": "comfortrestsleep", "type": "mc", "prompt": "A nurse is caring for a client recovering from major surgery. The nurse explains the importance of deep sleep. Which process should the nurse identify as occurring during stage 3 sleep?", "options": [{"id": "a", "text": "Dreaming"}, {"id": "b", "text": "Repair and regeneration of muscles, tissues, and bones"}, {"id": "c", "text": "Increased heart rate and irregular breathing"}, {"id": "d", "text": "Alpha wave activity"}], "correct": ["b"], "explanation": "During stage 3, the immune system strengthens and muscles, tissues, and bones repair and regenerate. Pulse and respirations are at their lowest. Dreaming and irregular breathing occur during REM."}, {"id": 273, "cat": "comfortrestsleep", "type": "sata", "prompt": "A nurse educator is teaching newly hired nurses about expected age-related changes in sleep before they care for older adult clients. Which changes should the educator include? Select all that apply.", "options": [{"id": "a", "text": "Decreased stage 3 sleep"}, {"id": "b", "text": "Waking more frequently during the night"}, {"id": "c", "text": "Taking longer to fall asleep"}, {"id": "d", "text": "Increased stage 2 sleep"}, {"id": "e", "text": "More REM cycles than younger adults"}], "correct": ["a", "b", "c", "d"], "explanation": "Older adults have less stage 3 sleep and more stage 2 sleep, wake up more frequently, and take longer to fall asleep. They have fewer REM cycles, not more."}, {"id": 274, "cat": "comfortrestsleep", "type": "mc", "prompt": "A nurse is teaching a class about the physiology of sleep. The nurse should include that which of the following occurs as a result of sleep?", "options": [{"id": "a", "text": "Decreased ability to concentrate"}, {"id": "b", "text": "Weakened immune system"}, {"id": "c", "text": "Transfer of memory from short-term to long-term"}, {"id": "d", "text": "Increased cortisol release"}], "correct": ["c"], "explanation": "During sleep, the thalamus and cerebral cortex process information and transfer it from short-term to long-term memory. Sleep also strengthens the immune system and lowers cortisol release."}, {"id": 275, "cat": "comfortrestsleep", "type": "mc", "prompt": "A nurse is explaining the circadian rhythm to a client. Which statement by the nurse is accurate?", "options": [{"id": "a", "text": "\"It only works when there are environmental cues like light.\""}, {"id": "b", "text": "\"It recurs about every 24 hours and syncs with cues such as light and temperature.\""}, {"id": "c", "text": "\"It is controlled entirely by the amount of caffeine you drink.\""}, {"id": "d", "text": "\"It resets every 8 hours.\""}], "correct": ["b"], "explanation": "The circadian rhythm controls the sleep\u2013wake cycle about every 24 hours and synchronizes with environmental cues like light and temperature, although the body can maintain it without prompts."}, {"id": 276, "cat": "comfortrestsleep", "type": "mc", "prompt": "A client tells the nurse, \"I stayed up all night studying, and the next night I slept deeper than usual.\" The nurse should recognize this is due to which of the following?", "options": [{"id": "a", "text": "Circadian rhythm"}, {"id": "b", "text": "Sleep\u2013wake homeostasis"}, {"id": "c", "text": "Sensory overload"}, {"id": "d", "text": "Selective sleep deprivation"}], "correct": ["b"], "explanation": "Sleep\u2013wake homeostasis helps the body remember to sleep after a given time, and sleep deepens according to the amount of sleep deprivation the person has experienced."}, {"id": 277, "cat": "comfortrestsleep", "type": "sata", "prompt": "A nurse is teaching a client about the effects of sleep deprivation. Which effects should the nurse include? Select all that apply.", "options": [{"id": "a", "text": "Impaired judgment and decreased response time"}, {"id": "b", "text": "Increased risk for depression"}, {"id": "c", "text": "Worsening blood glucose control in clients who have type 2 diabetes"}, {"id": "d", "text": "Reduced risk of migraines"}, {"id": "e", "text": "Decreased likelihood of obesity"}], "correct": ["a", "b", "c"], "explanation": "Sleep deprivation impairs judgment and response time, increases the risk of depression, and contributes to poor glucose control and obesity. It can trigger migraines rather than reduce them."}, {"id": 278, "cat": "comfortrestsleep", "type": "sata", "prompt": "A nurse is caring for a client in the intensive care unit. Which actions should the nurse take to reduce the risk of sensory overload? Select all that apply.", "options": [{"id": "a", "text": "Dim the lights at night."}, {"id": "b", "text": "Offer earplugs and an eye mask."}, {"id": "c", "text": "Cluster care to minimize interruptions."}, {"id": "d", "text": "Obtain vital signs every hour throughout the night regardless of the client's condition."}, {"id": "e", "text": "Leave the television on overnight for background noise."}], "correct": ["a", "b", "c"], "explanation": "Lowering light and noise, offering earplugs and eye masks, and coordinating care to minimize interruptions reduce sensory overload. Unnecessary interruptions and added stimulation increase it."}, {"id": 279, "cat": "comfortrestsleep", "type": "mc", "prompt": "A nurse is teaching a client about sleep hygiene. Which statement by the client indicates an understanding of the teaching?", "options": [{"id": "a", "text": "\"I'll sleep in on the weekends to catch up on rest.\""}, {"id": "b", "text": "\"I'll stop drinking coffee at least 6 hours before bedtime.\""}, {"id": "c", "text": "\"I'll watch TV in bed until I fall asleep.\""}, {"id": "d", "text": "\"I'll work out right before bed to tire myself out.\""}], "correct": ["b"], "explanation": "Stimulants like caffeine should be avoided 4 to 6 hours before bedtime. A consistent sleep schedule, keeping electronics out of the bedroom, and avoiding exercise close to bedtime also promote sleep."}, {"id": 280, "cat": "comfortrestsleep", "type": "mc", "prompt": "A client reports lying awake in bed for over an hour most nights. Which instruction should the nurse provide?", "options": [{"id": "a", "text": "\"Stay in bed with your eyes closed until you fall asleep.\""}, {"id": "b", "text": "\"Get up, go to another room, and do a quiet activity until you feel tired.\""}, {"id": "c", "text": "\"Take a longer nap during the day to make up for lost sleep.\""}, {"id": "d", "text": "\"Watch TV in bed to help you relax.\""}], "correct": ["b"], "explanation": "If a client can't fall asleep, they should get up, go to another room, and do a quiet activity like reading or listening to music, then return when tired. Staying in bed while restless contributes to sleep deprivation."}, {"id": 281, "cat": "comfortrestsleep", "type": "sata", "prompt": "A nurse is reviewing a client's sleep diary. Which behaviors should the nurse identify as contributing to sleep deprivation? Select all that apply.", "options": [{"id": "a", "text": "Stays in bed when unable to sleep"}, {"id": "b", "text": "Sleeps 3 hours later on weekends"}, {"id": "c", "text": "Keeps a television in the bedroom"}, {"id": "d", "text": "Takes a warm shower before bed"}, {"id": "e", "text": "Keeps the bedroom dark and cool"}], "correct": ["a", "b", "c"], "explanation": "Staying in bed while restless, changing sleep patterns on weekends, and keeping electronics in the bedroom contribute to sleep deprivation. A bedtime routine and a dark, cool room promote sleep."}, {"id": 282, "cat": "comfortrestsleep", "type": "mc", "prompt": "A nurse who works rotating night shifts asks about health risks. Which response by the occupational health nurse is accurate?", "options": [{"id": "a", "text": "\"Night-shift work has no long-term health effects.\""}, {"id": "b", "text": "\"Night-shift workers have a higher risk of cardiovascular disease, obesity, and diabetes.\""}, {"id": "c", "text": "\"Night-shift work improves circadian rhythm over time.\""}, {"id": "d", "text": "\"Night-shift workers are less likely to experience daytime sleepiness.\""}], "correct": ["b"], "explanation": "Shift workers have a disrupted circadian rhythm, excessive daytime sleepiness, and a higher incidence of cardiovascular disease, obesity, and diabetes."}, {"id": 283, "cat": "comfortrestsleep", "type": "mc", "prompt": "An adolescent client tells the nurse they use their phone in bed until they fall asleep. Which effect should the nurse include when teaching the client?", "options": [{"id": "a", "text": "Longer total sleep time"}, {"id": "b", "text": "Improved sleep quality"}, {"id": "c", "text": "Increased daytime sleepiness"}, {"id": "d", "text": "Decreased risk of depression"}], "correct": ["c"], "explanation": "Using a cell phone after going to bed is associated with shorter sleep duration, poor sleep quality, and daytime sleepiness, and it is a risk factor for depression."}, {"id": 284, "cat": "comfortrestsleep", "type": "mc", "prompt": "A client reports difficulty falling asleep and waking at 0400 every morning unable to return to sleep, even though they go to bed with plenty of time to rest. Which sleep disorder should the nurse suspect?", "options": [{"id": "a", "text": "Narcolepsy"}, {"id": "b", "text": "Insomnia"}, {"id": "c", "text": "Hypersomnia"}, {"id": "d", "text": "Central sleep apnea"}], "correct": ["b"], "explanation": "Insomnia is an ongoing inability to sleep despite the opportunity, including trouble falling asleep, staying asleep, or waking early."}, {"id": 285, "cat": "comfortrestsleep", "type": "mc", "prompt": "A nurse is caring for a client who is suspected of having obstructive sleep apnea. Which diagnostic test should the nurse anticipate?", "options": [{"id": "a", "text": "Polysomnography"}, {"id": "b", "text": "Electrocardiogram"}, {"id": "c", "text": "Electroencephalogram alone"}, {"id": "d", "text": "Pulmonary function test"}], "correct": ["a"], "explanation": "OSA is diagnosed with polysomnography, usually in a sleep lab. It records heart rate, blood pressure, breathing, oxygen saturation, brain waves, body movements, and snoring."}, {"id": 286, "cat": "comfortrestsleep", "type": "mc", "prompt": "A 52-year-old client reports working overtime at a high-stress job, recently gaining 10 lb, and starting to smoke again. The client's partner says the snoring is \"out of control,\" and the client feels exhausted all day. Which sleep disorder should the nurse suspect?", "options": [{"id": "a", "text": "Narcolepsy"}, {"id": "b", "text": "Restless legs syndrome"}, {"id": "c", "text": "Obstructive sleep apnea"}, {"id": "d", "text": "Night terrors"}], "correct": ["c"], "explanation": "Snoring, obesity, smoking, and daytime exhaustion are consistent with OSA, which involves recurrent upper airway collapse during sleep."}, {"id": 287, "cat": "comfortrestsleep", "type": "sata", "prompt": "A nurse is teaching a client who has obstructive sleep apnea. Which instructions should the nurse include? Select all that apply.", "options": [{"id": "a", "text": "Wear the CPAP device while sleeping."}, {"id": "b", "text": "Follow a healthy weight-loss program."}, {"id": "c", "text": "Avoid alcohol."}, {"id": "d", "text": "Stop smoking."}, {"id": "e", "text": "Sleep on your back."}], "correct": ["a", "b", "c", "d"], "explanation": "CPAP is the most widely recommended treatment for OSA, along with weight loss and avoiding smoking and alcohol. Sleeping on the back can worsen OSA."}, {"id": 288, "cat": "comfortrestsleep", "type": "mc", "prompt": "A nurse is reviewing the health histories of several clients. Which client is at highest risk for central sleep apnea?", "options": [{"id": "a", "text": "A client who has enlarged tonsils"}, {"id": "b", "text": "A client who has heart failure"}, {"id": "c", "text": "A client who has obesity"}, {"id": "d", "text": "A client who has iron deficiency"}], "correct": ["b"], "explanation": "Central sleep apnea is a reduction in the brain's signals to the respiratory muscles. Common causes are heart failure and opioid overdose. Enlarged tonsils and obesity are associated with obstructive sleep apnea."}, {"id": 289, "cat": "comfortrestsleep", "type": "mc", "prompt": "In which of the following sleep disorders does the client experience sudden, uncontrollable episodes of sleep?", "options": [{"id": "a", "text": "Insomnia"}, {"id": "b", "text": "Obstructive sleep apnea"}, {"id": "c", "text": "Narcolepsy"}, {"id": "d", "text": "Restless legs syndrome"}], "correct": ["c"], "explanation": "Narcolepsy is characterized by sudden sleepiness and sudden periods of sleep. Clients have difficulty staying awake."}, {"id": 290, "cat": "comfortrestsleep", "type": "mc", "prompt": "A client who has narcolepsy suddenly loses muscle tone and slumps over while laughing at a joke. The nurse should document this as which of the following?", "options": [{"id": "a", "text": "Cataplexy"}, {"id": "b", "text": "Seizure"}, {"id": "c", "text": "Sleep paralysis"}, {"id": "d", "text": "Hypopnea"}], "correct": ["a"], "explanation": "Cataplexy is a brief loss of voluntary muscle tone triggered by an emotional stimulus, such as laughter. It occurs in narcolepsy type 1."}, {"id": 291, "cat": "comfortrestsleep", "type": "mc", "prompt": "A client reports sleeping 10 hours every night but still feeling exhausted throughout the day. The client's circadian rhythm is normal. Which sleep disorder should the nurse suspect?", "options": [{"id": "a", "text": "Insomnia"}, {"id": "b", "text": "Hypersomnia"}, {"id": "c", "text": "Central sleep apnea"}, {"id": "d", "text": "Night terrors"}], "correct": ["b"], "explanation": "Hypersomnia is excessive daytime fatigue that does not improve with more sleep and is not caused by poor nighttime sleep or a disturbed circadian rhythm."}, {"id": 292, "cat": "comfortrestsleep", "type": "mc", "prompt": "A nurse is teaching a client who has restless legs syndrome. Which instruction should the nurse include?", "options": [{"id": "a", "text": "\"Drink a cup of coffee in the evening to reduce symptoms.\""}, {"id": "b", "text": "\"Avoid caffeine, nicotine, and alcohol.\""}, {"id": "c", "text": "\"Your symptoms will be worse in the morning.\""}, {"id": "d", "text": "\"Lying still in bed will relieve the sensations.\""}], "correct": ["b"], "explanation": "Avoiding caffeine, nicotine, and alcohol may help control RLS. Symptoms worsen in the evening and with inactivity, such as lying down to sleep."}, {"id": 293, "cat": "comfortrestsleep", "type": "mc", "prompt": "A nurse is assessing a client who reports trouble sleeping. Which finding is consistent with restless legs syndrome?", "options": [{"id": "a", "text": "Loud snoring with pauses in breathing"}, {"id": "b", "text": "An uncomfortable urge to move the legs that worsens when lying down at night"}, {"id": "c", "text": "Sudden loss of muscle tone when laughing"}, {"id": "d", "text": "Waking in panic with no memory of the event"}], "correct": ["b"], "explanation": "RLS is an uncontrollable urge to move the legs with an uncomfortable sensation, worsening in the evening and with inactivity. It can be associated with iron or vitamin deficiencies."}, {"id": 294, "cat": "comfortrestsleep", "type": "mc", "prompt": "A parent tells the nurse their 5-year-old child screams and seems terrified shortly after falling asleep but doesn't remember it the next morning. Which information about night terrors should the nurse include when teaching the parent?", "options": [{"id": "a", "text": "\"They usually happen within the first few hours after your child falls asleep.\""}, {"id": "b", "text": "\"They usually happen in the early morning hours, right before your child wakes up.\""}, {"id": "c", "text": "\"Your child will usually remember the frightening dream in detail.\""}, {"id": "d", "text": "\"Night terrors are more common in adults than in children.\""}], "correct": ["a"], "explanation": "Night terrors occur during NREM sleep in the first third of the night, the person has no memory of them, and they are most common in young children. Early-morning episodes that the person remembers describe nightmares, which occur during REM sleep in the second half of the night."}, {"id": 295, "cat": "comfortrestsleep", "type": "mc", "prompt": "A child wakes early in the morning crying and describes a scary dream about being chased. The nurse should recognize this as which of the following?", "options": [{"id": "a", "text": "A night terror occurring during NREM sleep"}, {"id": "b", "text": "A nightmare occurring during REM sleep"}, {"id": "c", "text": "Cataplexy"}, {"id": "d", "text": "Sensory overload"}], "correct": ["b"], "explanation": "Nightmares occur during REM sleep, most commonly in the second half of the night, and the person remembers the dream. Night terrors occur during NREM sleep in the first third of the night with no recall."}, {"id": 296, "cat": "comfortrestsleep", "type": "sata", "prompt": "A nurse is planning nonpharmacological interventions to promote sleep for a hospitalized client. Which interventions should the nurse include? Select all that apply.", "options": [{"id": "a", "text": "Guided imagery"}, {"id": "b", "text": "Music therapy"}, {"id": "c", "text": "Massage"}, {"id": "d", "text": "Mindfulness and restful breathing"}, {"id": "e", "text": "A caffeinated beverage at bedtime"}], "correct": ["a", "b", "c", "d"], "explanation": "Guided imagery, music therapy, massage, mindfulness, meditation, and restful breathing are nonpharmacological interventions that promote sleep. Caffeine is a stimulant that disrupts sleep."}, {"id": 297, "cat": "comfortrestsleep", "type": "mc", "prompt": "A nurse asks a client who reports poor sleep to keep a sleep diary for 2 weeks. The client asks why. Which response by the nurse is appropriate?", "options": [{"id": "a", "text": "\"It will help us identify your sleep problems and create a plan that fits your lifestyle.\""}, {"id": "b", "text": "\"It's required before you can get a prescription for sleep medication.\""}, {"id": "c", "text": "\"It will show whether you're exaggerating your sleep problems.\""}, {"id": "d", "text": "\"It replaces the need for a sleep study.\""}], "correct": ["a"], "explanation": "A sleep diary helps the nurse assess the client's sleep habits, identify problems, and collaboratively develop a plan of care tailored to the client's lifestyle, which increases the likelihood the client will follow it."}, {"id": 298, "cat": "comfortrestsleep", "type": "mc", "prompt": "A nurse is caring for a hospitalized client who reports being woken up several times each night. Which action should the nurse take to promote sleep?", "options": [{"id": "a", "text": "Cluster nursing care to avoid interrupting the client's sleep."}, {"id": "b", "text": "Obtain vital signs every 2 hours overnight."}, {"id": "c", "text": "Keep the door open and hallway lights on for safety."}, {"id": "d", "text": "Schedule the client's bath for 0200."}], "correct": ["a"], "explanation": "Clustering and scheduling care avoids unnecessary interruptions of sleep cycles. The nurse should also control lights, noise, and the timing of vital signs and procedures."}, {"id": 299, "cat": "comfortrestsleep", "type": "mc", "prompt": "A nurse is caring for a client who is anxious about an upcoming procedure. Which nursing action best promotes the client's comfort?", "options": [{"id": "a", "text": "Answer the client's questions honestly and allow them to make informed choices about their care."}, {"id": "b", "text": "Tell the client not to worry because everything will be fine."}, {"id": "c", "text": "Limit the information given to avoid increasing the client's anxiety."}, {"id": "d", "text": "Make decisions for the client to reduce their stress."}], "correct": ["a"], "explanation": "Informing clients decreases fear of the unknown. Answering questions honestly and permitting informed choices make clients feel valued, respected, and safe. False reassurance and withholding information are not therapeutic."}, {"id": 300, "cat": "comfortrestsleep", "type": "mc", "prompt": "A client in a busy hospital unit tells the nurse they can't fall asleep during the day. The nurse suggests quiet rest instead. Which benefit of rest should the nurse explain?", "options": [{"id": "a", "text": "Rest reduces stress and improves mood and mental clarity."}, {"id": "b", "text": "Rest provides the same tissue repair as stage 3 sleep."}, {"id": "c", "text": "Rest transfers memories from short-term to long-term."}, {"id": "d", "text": "Rest has no benefit unless the client falls asleep."}], "correct": ["a"], "explanation": "Resting lets muscles and organs relax even while awake, reducing stress and improving mood, mental alertness, and clarity. Tissue repair and memory transfer occur during sleep."}, {"id": 301, "cat": "stresscoping", "type": "mc", "prompt": "A nurse is teaching a class about physical manifestations associated with the fight-or-flight response. Which manifestation should the nurse include?", "options": [{"id": "a", "text": "Dilated pupils"}, {"id": "b", "text": "Decreased blood pressure"}, {"id": "c", "text": "Bronchial airway constriction"}, {"id": "d", "text": "Hypoglycemia"}], "correct": ["a"], "explanation": "Fight-or-flight causes pupil dilation, increased HR, BP, cardiac output, and blood glucose, and bronchial dilation."}, {"id": 302, "cat": "stresscoping", "type": "mc", "prompt": "A nurse educator is explaining the HPA axis to a group of nursing students. Which sequence should the educator describe?", "options": [{"id": "a", "text": "Adrenal glands release ACTH \u2192 pituitary releases CRH \u2192 hypothalamus releases cortisol"}, {"id": "b", "text": "Hypothalamus releases CRH \u2192 pituitary releases ACTH \u2192 adrenal glands release cortisol"}, {"id": "c", "text": "Pituitary releases cortisol \u2192 hypothalamus releases ACTH \u2192 adrenal glands release CRH"}, {"id": "d", "text": "Hypothalamus releases cortisol \u2192 adrenal glands release CRH \u2192 pituitary releases ACTH"}], "correct": ["b"], "explanation": "The hypothalamus releases CRH, which stimulates the pituitary to release ACTH, which stimulates the adrenal glands to release cortisol."}, {"id": 303, "cat": "stresscoping", "type": "mc", "prompt": "A client is brought to the emergency department minutes after a motor vehicle crash. The client's HR is 118/min, BP is elevated, pupils are dilated, and blood glucose is elevated. Which stage of the general adaptation syndrome is the client experiencing?", "options": [{"id": "a", "text": "Alarm"}, {"id": "b", "text": "Resistance"}, {"id": "c", "text": "Exhaustion"}, {"id": "d", "text": "Reappraisal"}], "correct": ["a"], "explanation": "In the alarm stage, the adrenal medulla releases catecholamines such as epinephrine, triggering fight-or-flight with increased HR, BP, blood glucose, and alertness and dilated pupils."}, {"id": 304, "cat": "stresscoping", "type": "mc", "prompt": "A client who has been hospitalized for 2 weeks is irritable, fatigued, and having difficulty concentrating, but vital signs are near their baseline. Which stage of the general adaptation syndrome is the client most likely experiencing?", "options": [{"id": "a", "text": "Alarm"}, {"id": "b", "text": "Resistance"}, {"id": "c", "text": "Exhaustion"}, {"id": "d", "text": "Countershock"}], "correct": ["b"], "explanation": "In the resistance stage, the body resists the stressor and the parasympathetic system moderates fight-or-flight. Fatigue, irritability, and decreased concentration may occur."}, {"id": 305, "cat": "stresscoping", "type": "mc", "prompt": "A client who has experienced years of ongoing caregiver stress now has chronic hypertension, depression, and frequent infections. The nurse should recognize these findings as consistent with which of the following?", "options": [{"id": "a", "text": "The alarm stage"}, {"id": "b", "text": "The resistance stage"}, {"id": "c", "text": "The exhaustion stage and allostatic load"}, {"id": "d", "text": "Allostasis"}], "correct": ["c"], "explanation": "In the exhaustion stage, the body's ability to adapt is depleted and prolonged stress leads to illness and allostatic load, the wear and tear that causes conditions like chronic hypertension and depression. Allostasis is the body adjusting to minor stressors."}, {"id": 306, "cat": "stresscoping", "type": "sata", "prompt": "A nurse is teaching a group of students about the general adaptation syndrome. Which statements should the nurse include? Select all that apply.", "options": [{"id": "a", "text": "The three stages are alarm, resistance, and exhaustion."}, {"id": "b", "text": "It can be triggered by physical or psychological stressors."}, {"id": "c", "text": "It occurs whether a stressor is perceived as positive or negative."}, {"id": "d", "text": "It is triggered only by negative events."}, {"id": "e", "text": "The exhaustion stage occurs first."}], "correct": ["a", "b", "c"], "explanation": "GAS is a three-stage response (alarm, resistance, exhaustion) triggered by physical or psychological stressors, whether positive or negative. Alarm is the first stage."}, {"id": 307, "cat": "stresscoping", "type": "mc", "prompt": "A nurse is teaching a class about sources of stress. The nurse should include that which of the following is an example of a psychological stressor?", "options": [{"id": "a", "text": "Hypothermia"}, {"id": "b", "text": "Financial difficulties"}, {"id": "c", "text": "Burn injury"}, {"id": "d", "text": "Wrist fracture"}], "correct": ["b"], "explanation": "Psychological stressors are events or situations a person interprets as negative or threatening, such as financial difficulties. Hypothermia, burns, and fractures are physiological stressors."}, {"id": 308, "cat": "stresscoping", "type": "mc", "prompt": "A nurse is caring for several clients. Which client is experiencing a physiological stressor?", "options": [{"id": "a", "text": "A client going through a divorce"}, {"id": "b", "text": "A client with severe pain from a hip fracture"}, {"id": "c", "text": "A client worried about final exams"}, {"id": "d", "text": "A client living in a noisy, crowded apartment"}], "correct": ["b"], "explanation": "Physiological stress comes from injury or illness, such as trauma and pain. Divorce and exam pressure are psychological, and a noisy, crowded home is environmental."}, {"id": 309, "cat": "stresscoping", "type": "sata", "prompt": "A nurse is reviewing clients' histories for sources of chronic stress. Which findings should the nurse identify? Select all that apply.", "options": [{"id": "a", "text": "Living in poverty"}, {"id": "b", "text": "Exposure to racism"}, {"id": "c", "text": "Living with a prolonged illness"}, {"id": "d", "text": "Growing up in a dysfunctional family"}, {"id": "e", "text": "Being in a minor car accident yesterday"}], "correct": ["a", "b", "c", "d"], "explanation": "Chronic stress is constant and prolonged, such as poverty, racism, prolonged illness, and a dysfunctional family. A car accident is a source of acute stress."}, {"id": 310, "cat": "stresscoping", "type": "mc", "prompt": "A student tells the school nurse, \"I wait until the last minute on every assignment, and I'm always panicking to finish on time.\" Which type of stress is the student experiencing?", "options": [{"id": "a", "text": "Traumatic stress"}, {"id": "b", "text": "Episodic acute stress"}, {"id": "c", "text": "Environmental stress"}, {"id": "d", "text": "Physiological stress"}], "correct": ["b"], "explanation": "Episodic acute stress is frequent bouts of acute stress, often from taking on too much and feeling rushed and disorganized."}, {"id": 311, "cat": "stresscoping", "type": "mc", "prompt": "A family of six lives in a one-bedroom apartment in a neighborhood with frequent violence and no reliable access to food. Which type of stress should the nurse identify?", "options": [{"id": "a", "text": "Environmental stress"}, {"id": "b", "text": "Episodic acute stress"}, {"id": "c", "text": "Physiological stress"}, {"id": "d", "text": "Traumatic stress"}], "correct": ["a"], "explanation": "Environmental stress comes from difficult surroundings such as crowding, housing instability, food insecurity, and neighborhood violence."}, {"id": 312, "cat": "stresscoping", "type": "sata", "prompt": "A nurse is teaching a client about the benefits of exercise for managing stress. Which information should the nurse include? Select all that apply.", "options": [{"id": "a", "text": "Decreases energy"}, {"id": "b", "text": "Increases mood"}, {"id": "c", "text": "Inhibits the release of endorphins"}, {"id": "d", "text": "Decreases stress"}, {"id": "e", "text": "Improves sleep"}], "correct": ["b", "d", "e"], "explanation": "Exercise increases mood and energy, decreases stress, improves sleep, and releases endorphins."}, {"id": 313, "cat": "stresscoping", "type": "mc", "prompt": "Two weeks after being assaulted, a client reports feeling numb and disconnected, is easily startled, and avoids the street where it happened. Which condition should the nurse suspect?", "options": [{"id": "a", "text": "Acute stress disorder"}, {"id": "b", "text": "Posttraumatic stress disorder"}, {"id": "c", "text": "Episodic acute stress"}, {"id": "d", "text": "Existential crisis"}], "correct": ["a"], "explanation": "ASD starts right after a traumatic event and lasts up to 1 month, with numbness, dissociation, startle, reexperiencing, and avoidance. PTSD is diagnosed if symptoms last beyond 1 month."}, {"id": 314, "cat": "stresscoping", "type": "mc", "prompt": "A client who survived a house fire 4 months ago continues to have flashbacks and nightmares about the event. Which condition should the nurse suspect?", "options": [{"id": "a", "text": "Acute stress disorder"}, {"id": "b", "text": "Posttraumatic stress disorder"}, {"id": "c", "text": "Episodic acute stress"}, {"id": "d", "text": "Developmental crisis"}], "correct": ["b"], "explanation": "When symptoms last beyond 1 month after a trauma, PTSD is diagnosed. Flashbacks and nightmares are hallmark manifestations."}, {"id": 315, "cat": "stresscoping", "type": "sata", "prompt": "A nurse is assessing a client who has posttraumatic stress disorder. Which manifestations should the nurse expect? Select all that apply.", "options": [{"id": "a", "text": "Flashbacks of the trauma"}, {"id": "b", "text": "Nightmares"}, {"id": "c", "text": "Exaggerated startle response"}, {"id": "d", "text": "Increased heart rate"}, {"id": "e", "text": "Bradycardia"}], "correct": ["a", "b", "c", "d"], "explanation": "PTSD manifestations include flashbacks, nightmares, sweating, increased heart rate, and an exaggerated startle response."}, {"id": 316, "cat": "stresscoping", "type": "mc", "prompt": "A client completing a health history reports an adverse childhood experiences (ACE) score of 5. Which of the following should the nurse recognize?", "options": [{"id": "a", "text": "The client has a significantly higher risk of chronic illness in adulthood."}, {"id": "b", "text": "ACEs only affect mental health during childhood."}, {"id": "c", "text": "An ACE score does not affect adult health."}, {"id": "d", "text": "The client is protected from future stress."}], "correct": ["a"], "explanation": "Individuals who score four or more on an ACE questionnaire are at significantly higher risk of developing a chronic illness in adulthood."}, {"id": 317, "cat": "stresscoping", "type": "mc", "prompt": "A nurse is caring for a client who has been under severe stress for months. Which finding should the nurse recognize as an effect of chronically elevated cortisol?", "options": [{"id": "a", "text": "Faster wound healing"}, {"id": "b", "text": "Frequent infections and slow wound healing"}, {"id": "c", "text": "Improved immune function"}, {"id": "d", "text": "Decreased inflammation"}], "correct": ["b"], "explanation": "Short-term cortisol enhances some immune functions, but chronic elevation suppresses immunity, causes inflammation, slows healing, and increases infection risk."}, {"id": 318, "cat": "stresscoping", "type": "sata", "prompt": "A nurse is teaching a community group about health conditions linked to chronic stress. Which conditions should the nurse include? Select all that apply.", "options": [{"id": "a", "text": "Hypertension"}, {"id": "b", "text": "Gastric ulcers"}, {"id": "c", "text": "Delayed wound healing"}, {"id": "d", "text": "Sleep disorders"}, {"id": "e", "text": "Hypotension"}], "correct": ["a", "b", "c", "d"], "explanation": "Chronic stress is linked to hypertension, CAD, stroke, diabetes, anxiety, depression, immunosuppression, delayed wound healing, gastric ulcers, tension headaches, and sleep disorders."}, {"id": 319, "cat": "stresscoping", "type": "mc", "prompt": "A client in crisis is pacing, yelling, and threatening to hurt themself. Which action should the nurse take first?", "options": [{"id": "a", "text": "Ask the client what triggered the crisis."}, {"id": "b", "text": "Ensure the safety of the client and others."}, {"id": "c", "text": "Explore the client's past coping strategies."}, {"id": "d", "text": "Develop a follow-up plan with the client."}], "correct": ["b"], "explanation": "Safety comes first in crisis intervention. After safety is ensured, the nurse can identify the precipitating event, explore coping, and plan for current and future crises."}, {"id": 320, "cat": "stresscoping", "type": "sata", "prompt": "A nurse is assessing a client in crisis. Which findings indicate the client is experiencing a mental health emergency? Select all that apply.", "options": [{"id": "a", "text": "Acting on a suicide threat"}, {"id": "b", "text": "Throwing and breaking items"}, {"id": "c", "text": "Threatening to harm others"}, {"id": "d", "text": "Hostile and belligerent behavior"}, {"id": "e", "text": "Asking to speak with a chaplain"}], "correct": ["a", "b", "c", "d"], "explanation": "Signs of a mental health emergency include acting on a suicide threat, hostile or belligerent behavior, throwing or breaking items, and threatening harm."}, {"id": 321, "cat": "stresscoping", "type": "mc", "prompt": "A client who recently retired after 35 years tells the nurse, \"I don't know what to do with myself now.\" Which type of crisis is the client experiencing?", "options": [{"id": "a", "text": "Situational"}, {"id": "b", "text": "Developmental"}, {"id": "c", "text": "Psychiatric emergency"}, {"id": "d", "text": "Adventitious"}], "correct": ["b"], "explanation": "Developmental crises are life transitions such as puberty, retirement, menopause, and starting a family."}, {"id": 322, "cat": "stresscoping", "type": "mc", "prompt": "A nurse plans to use the Perceived Stress Scale with a client. The nurse should explain that this tool measures which of the following?", "options": [{"id": "a", "text": "The number of stressful events in the client's environment"}, {"id": "b", "text": "How unpredictable, uncontrollable, and overwhelming the client feels life is over the past month"}, {"id": "c", "text": "The client's cortisol levels"}, {"id": "d", "text": "The client's risk for PTSD"}], "correct": ["b"], "explanation": "The PSS is a self-report tool that measures how unpredictable, uncontrollable, and overwhelming a person perceives their life to be over the past month."}, {"id": 323, "cat": "stresscoping", "type": "mc", "prompt": "A client who survived a serious illness tells the nurse, \"I keep asking myself what the point of my life is and who I'm supposed to be now.\" Which type of crisis should the nurse identify?", "options": [{"id": "a", "text": "Developmental"}, {"id": "b", "text": "Situational"}, {"id": "c", "text": "Existential"}, {"id": "d", "text": "Psychiatric emergency"}], "correct": ["c"], "explanation": "An existential crisis involves internal conflicts about personal meaning, identity, or purpose."}, {"id": 324, "cat": "stresscoping", "type": "mc", "prompt": "A client becomes tense and tearful when the nurse approaches to start an IV. The client has a history of trauma. Which action reflects trauma-informed care?", "options": [{"id": "a", "text": "Proceed quickly to minimize the client's anxiety."}, {"id": "b", "text": "Explain each step, ask permission, and give the client a sense of control."}, {"id": "c", "text": "Tell the client the reaction is an overreaction."}, {"id": "d", "text": "Postpone the IV without explaining why."}], "correct": ["b"], "explanation": "Trauma-informed care recognizes that past trauma shapes a client's responses and focuses on building safety and trust to avoid retraumatizing the client."}, {"id": 325, "cat": "stresscoping", "type": "mc", "prompt": "A nurse is using Roberts' Seven-Stage Model with a client in crisis. Which action should the nurse take in the first stage?", "options": [{"id": "a", "text": "Establish rapport with the client."}, {"id": "b", "text": "Assess the client, including suicide and homicide risk."}, {"id": "c", "text": "Explore the client's past coping strategies."}, {"id": "d", "text": "Implement an action plan."}], "correct": ["b"], "explanation": "The first stage is a thorough assessment, including suicide and homicide risk. Rapport is stage 2, exploring coping is stage 5, and the action plan is stage 6."}, {"id": 326, "cat": "stresscoping", "type": "mc", "prompt": "A nurse is teaching a client about nutrition for managing stress. Which statement by the client indicates a need for further teaching?", "options": [{"id": "a", "text": "\"I'll eat more whole grains and beans to help stabilize my blood sugar.\""}, {"id": "b", "text": "\"Oranges can help lower my stress hormones.\""}, {"id": "c", "text": "\"A glass of wine each night will lower my stress levels.\""}, {"id": "d", "text": "\"Eating fish can help improve my mood.\""}], "correct": ["c"], "explanation": "Alcohol worsens stress by raising cortisol. Complex carbs stabilize blood sugar, vitamin C lowers stress hormones, and omega-3s improve mood."}, {"id": 327, "cat": "stresscoping", "type": "mc", "prompt": "A nurse is assigned to a new unit and thinks, \"Is this assignment something I need to worry about?\" According to the Transactional Theory of Stress and Coping, the nurse is in which stage?", "options": [{"id": "a", "text": "Primary appraisal"}, {"id": "b", "text": "Secondary appraisal"}, {"id": "c", "text": "Reappraisal"}, {"id": "d", "text": "Exhaustion"}], "correct": ["a"], "explanation": "Primary appraisal asks \"Is this a threat?\"\u2014deciding whether the situation is a threat, a challenge, or irrelevant."}, {"id": 328, "cat": "stresscoping", "type": "mc", "prompt": "A client facing surgery says, \"My sister can help me at home, and I've recovered from surgery before.\" The client is demonstrating which of the following?", "options": [{"id": "a", "text": "Primary appraisal"}, {"id": "b", "text": "Secondary appraisal"}, {"id": "c", "text": "Denial"}, {"id": "d", "text": "Projection"}], "correct": ["b"], "explanation": "Secondary appraisal asks \"Can I handle it?\" by evaluating available resources such as social support, skills, and past successes."}, {"id": 329, "cat": "stresscoping", "type": "sata", "prompt": "A nurse is teaching a group of nursing students about the Transactional Theory of Stress and Coping. Which statements should the nurse include? Select all that apply.", "options": [{"id": "a", "text": "Stress is a dynamic transaction between a person and their environment."}, {"id": "b", "text": "How a person appraises a stressor determines their response."}, {"id": "c", "text": "Reappraisal is an ongoing reassessment of the stressor and resources."}, {"id": "d", "text": "Secondary appraisal evaluates available resources."}, {"id": "e", "text": "Stress is a static event that doesn't change once it occurs."}], "correct": ["a", "b", "c", "d"], "explanation": "TTSC views stress as a dynamic transaction between person and environment, shaped by appraisal. Reappraisal continually reassesses the stressor and resources."}, {"id": 330, "cat": "stresscoping", "type": "mc", "prompt": "After losing their job, a client creates a monthly budget and applies to three new jobs. The client is using which type of coping?", "options": [{"id": "a", "text": "Problem-focused coping"}, {"id": "b", "text": "Emotion-focused coping"}, {"id": "c", "text": "Denial"}, {"id": "d", "text": "Regression"}], "correct": ["a"], "explanation": "Problem-focused coping involves changing the situation itself."}, {"id": 331, "cat": "stresscoping", "type": "mc", "prompt": "A nursing student who failed a quiz says, \"One quiz doesn't define whether I'll be a good nurse.\" The student is using which type of coping?", "options": [{"id": "a", "text": "Problem-focused coping"}, {"id": "b", "text": "Emotion-focused coping"}, {"id": "c", "text": "Rationalization"}, {"id": "d", "text": "Suppression"}], "correct": ["b"], "explanation": "Emotion-focused coping changes how a person feels about the situation by reframing or avoiding it, without changing the situation itself."}, {"id": 332, "cat": "stresscoping", "type": "mc", "prompt": "A nurse is assessing a client's coping strategies. Which strategy should the nurse identify as adaptive?", "options": [{"id": "a", "text": "Smoking a cigarette after a stressful day"}, {"id": "b", "text": "Going for a walk after a stressful day"}, {"id": "c", "text": "Drinking alcohol to relax"}, {"id": "d", "text": "Withdrawing from friends and family"}], "correct": ["b"], "explanation": "Adaptive coping, such as exercise, helps in the short and long term. Smoking, drinking, and withdrawal give short-term relief but cause long-term harm."}, {"id": 333, "cat": "stresscoping", "type": "sata", "prompt": "A nurse is reviewing a client's coping behaviors. Which behaviors should the nurse identify as maladaptive? Select all that apply.", "options": [{"id": "a", "text": "Smoking"}, {"id": "b", "text": "Drinking alcohol"}, {"id": "c", "text": "Withdrawing from friends"}, {"id": "d", "text": "Exercising regularly"}, {"id": "e", "text": "Planning ahead for stressful events"}], "correct": ["a", "b", "c"], "explanation": "Maladaptive coping provides short-term relief but long-term harm, such as smoking, drinking, and withdrawal. Exercise and planning ahead are adaptive."}, {"id": 334, "cat": "stresscoping", "type": "mc", "prompt": "A client newly diagnosed with type 2 diabetes continues eating as usual and tells the nurse, \"The doctor is overreacting. I don't really have diabetes.\" Which defense mechanism is the client using?", "options": [{"id": "a", "text": "Denial"}, {"id": "b", "text": "Projection"}, {"id": "c", "text": "Rationalization"}, {"id": "d", "text": "Regression"}], "correct": ["a"], "explanation": "Denial is refusing to acknowledge a distressing reality."}, {"id": 335, "cat": "stresscoping", "type": "mc", "prompt": "A client who is angry about a new cancer diagnosis tells the nurse, \"Why are you being so hostile toward me?\" even though the nurse has been calm. Which defense mechanism is the client using?", "options": [{"id": "a", "text": "Denial"}, {"id": "b", "text": "Projection"}, {"id": "c", "text": "Repression"}, {"id": "d", "text": "Compartmentalization"}], "correct": ["b"], "explanation": "Projection is blaming one's own undesirable feelings or tendencies on others. The client is attributing their own anger to the nurse."}, {"id": 336, "cat": "stresscoping", "type": "mc", "prompt": "A nurse is required to follow a care plan that conflicts with what the nurse believes is ethically right for the client. The nurse feels frustrated and guilty and has trouble sleeping. Which action should the nurse take?", "options": [{"id": "a", "text": "Ignore the feelings until they pass."}, {"id": "b", "text": "Seek support through a formal debriefing, peers, or the ethics committee."}, {"id": "c", "text": "Stop caring for clients with similar care plans."}, {"id": "d", "text": "Keep the concerns private to avoid conflict."}], "correct": ["b"], "explanation": "The nurse is experiencing moral distress. Ways to reduce it include ethics committees, formal debriefings, support from peers and leadership, and the ANA Code of Ethics."}, {"id": 337, "cat": "stresscoping", "type": "mc", "prompt": "A 4-year-old who was toilet trained begins wetting the bed after a new sibling is born. Which defense mechanism is the child demonstrating?", "options": [{"id": "a", "text": "Denial"}, {"id": "b", "text": "Projection"}, {"id": "c", "text": "Regression"}, {"id": "d", "text": "Rationalization"}], "correct": ["c"], "explanation": "Regression is returning to behaviors from an earlier developmental stage under stress."}, {"id": 338, "cat": "stresscoping", "type": "mc", "prompt": "A nursing student is comparing coping and defense mechanisms. Which statement by the student indicates an understanding?", "options": [{"id": "a", "text": "\"Coping is conscious and deliberate, while defense mechanisms are unconscious and automatic.\""}, {"id": "b", "text": "\"Both coping and defense mechanisms are always conscious choices.\""}, {"id": "c", "text": "\"Defense mechanisms are only used in severe anxiety.\""}, {"id": "d", "text": "\"Coping mechanisms protect self-esteem without the person being aware of them.\""}], "correct": ["a"], "explanation": "Coping is conscious and intentional. Defense mechanisms are unconscious and automatic, protect self-esteem, and are useful in mild to moderate anxiety."}, {"id": 339, "cat": "stresscoping", "type": "mc", "prompt": "A single parent facing eviction reports feeling exhausted, having headaches, and being unable to sleep. Which intervention is the nurse's priority?", "options": [{"id": "a", "text": "Suggest the client keep a journal of stressors."}, {"id": "b", "text": "Determine whether the client has thoughts of self-harm."}, {"id": "c", "text": "Teach the client progressive relaxation."}, {"id": "d", "text": "Connect the client with community housing resources."}], "correct": ["b"], "explanation": "Determining whether the client has thoughts of self-harm is the priority to ensure safety. The other interventions are appropriate after safety is established."}, {"id": 340, "cat": "stresscoping", "type": "mc", "prompt": "A nurse is caring for a client who is experiencing stress. Which action should the nurse take first?", "options": [{"id": "a", "text": "Develop a statement about the client's health alteration."}, {"id": "b", "text": "Conduct a mental status exam."}, {"id": "c", "text": "Review whether the plan of care was effective."}, {"id": "d", "text": "Establish short- and long-term goals."}], "correct": ["b"], "explanation": "Assessment is the first step of the nursing process. A mental status exam is part of the initial assessment, followed by analysis, planning, implementation, and evaluation."}];
