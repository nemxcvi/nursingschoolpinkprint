cture and question-and-answer belong to the cognitive domain."}, {"id": 144, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is evaluating whether a client has achieved cognitive learning about hypoglycemia. Which finding best demonstrates this?", "options": [{"id": "a", "text": "The client verbalizes the signs of hypoglycemia and when to call the provider"}, {"id": "b", "text": "The client demonstrates checking their own blood sugar"}, {"id": "c", "text": "The client expresses feelings about their diagnosis"}, {"id": "d", "text": "The client asks no questions during teaching"}], "correct": ["a"], "explanation": "Verbalizing knowledge (recall and comprehension) demonstrates cognitive learning; performing a skill demonstrates psychomotor learning, and expressing feelings demonstrates affective learning."}, {"id": 145, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is teaching a client with a new colostomy and wants to address the affective domain. Which action should the nurse take?", "options": [{"id": "a", "text": "Encourage the client to discuss their feelings about the change in body image"}, {"id": "b", "text": "Have the client recite the steps to change the pouch"}, {"id": "c", "text": "Ask the client to demonstrate emptying the pouch"}, {"id": "d", "text": "Provide a written pamphlet on colostomy care"}], "correct": ["a"], "explanation": "Addressing feelings, values, and beliefs \u2014 such as body image concerns \u2014 engages the affective domain of learning."}, {"id": 146, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is teaching a nursing student about the cognitive domain. Which statement by the student indicates understanding?", "options": [{"id": "a", "text": "The cognitive domain includes stages like knowledge, comprehension, and application."}, {"id": "b", "text": "The cognitive domain is only about physical skills."}, {"id": "c", "text": "The cognitive domain focuses on a client's emotions."}, {"id": "d", "text": "The cognitive domain has no measurable stages."}], "correct": ["a"], "explanation": "The cognitive domain (the 'thinking domain') has 6 stages: knowledge, comprehension, application, analysis, synthesis, and evaluation."}, {"id": 147, "cat": "clienteducation", "type": "mc", "prompt": "A client who has a new ostomy now changes the pouch consistently without error, and it has become part of their daily routine. Which psychomotor stage does this represent?", "options": [{"id": "a", "text": "Origination"}, {"id": "b", "text": "Perception"}, {"id": "c", "text": "Guided response"}, {"id": "d", "text": "Set"}], "correct": ["a"], "explanation": "Origination (naturalization) is the final psychomotor stage, where the skill becomes part of the client's normal routine."}, {"id": 148, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is teaching a client who states, 'I don't see why I need to learn this.' Which Knowles principle should the nurse address first?", "options": [{"id": "a", "text": "Relevance/need to know"}, {"id": "b", "text": "Self-directed"}, {"id": "c", "text": "Life experience"}, {"id": "d", "text": "Task-centered"}], "correct": ["a"], "explanation": "The client's statement reflects a lack of understanding of why the information matters to them \u2014 the nurse should first address the relevance/need-to-know principle before proceeding with teaching."}, {"id": 149, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is applying Knowles's principle of readiness when planning teaching for a client. Which statement should guide the nurse's approach?", "options": [{"id": "a", "text": "I should assess whether the client is willing and able to actively engage before teaching."}, {"id": "b", "text": "I should teach regardless of the client's current emotional state."}, {"id": "c", "text": "Readiness only applies to pediatric clients."}, {"id": "d", "text": "Readiness means the client has already mastered the material."}], "correct": ["a"], "explanation": "Readiness means the client is willing, able, and can actively engage in learning \u2014 the nurse should assess this before beginning teaching."}, {"id": 150, "cat": "clienteducation", "type": "mc", "prompt": "A client says, 'I've managed my father's diabetes for years, so I think I can handle learning to manage my own.' Which Knowles principle does this statement reflect?", "options": [{"id": "a", "text": "Life experience"}, {"id": "b", "text": "Readiness"}, {"id": "c", "text": "Relevance"}, {"id": "d", "text": "Motivation"}], "correct": ["a"], "explanation": "The client is using past personal experience as a foundation for new learning, reflecting the life experience principle."}, {"id": 151, "cat": "clienteducation", "type": "mc", "prompt": "A client with newly diagnosed hypertension states they understand the risks of not taking their medication but still refuses to commit to the regimen. Which Knowles principle is most clearly unmet?", "options": [{"id": "a", "text": "Motivation"}, {"id": "b", "text": "Life experience"}, {"id": "c", "text": "Task-centered"}, {"id": "d", "text": "Relevance"}], "correct": ["a"], "explanation": "The client has the knowledge (relevance is understood) but lacks internal motivation, which must be present for real behavior change and learning to take place."}, {"id": 152, "cat": "clienteducation", "type": "sata", "prompt": "A nurse is applying Knowles's adult learning principles when developing a teaching plan. Which actions reflect these principles?", "options": [{"id": "a", "text": "Explaining why the information is relevant to the client's specific situation"}, {"id": "b", "text": "Ignoring the client's past experiences with similar health conditions"}, {"id": "c", "text": "Allowing the client to make informed decisions about their own care"}, {"id": "d", "text": "Presenting information only as material to memorize"}, {"id": "e", "text": "Linking teaching to the client's real-life tasks and problems"}], "correct": ["a", "c", "e"], "explanation": "Explaining relevance, supporting self-directed decision-making, and using task-centered teaching all reflect Knowles's principles. Ignoring past experience and rote memorization go against adult learning theory."}, {"id": 153, "cat": "clienteducation", "type": "mc", "prompt": "A nursing student explains self-directed learning to a classmate. Which statement indicates understanding?", "options": [{"id": "a", "text": "Self-directed clients take responsibility for their choices and have control over their learning."}, {"id": "b", "text": "Self-directed learning means the nurse makes all the decisions."}, {"id": "c", "text": "Self-directed learning applies only to children."}, {"id": "d", "text": "Self-directed clients require no assessment before teaching."}], "correct": ["a"], "explanation": "Self-directed clients participate in their own learning and accept responsibility for their choices and consequences."}, {"id": 154, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is beginning to develop a teaching plan for a client newly diagnosed with diabetes. Which action should the nurse take first?", "options": [{"id": "a", "text": "Assess the client's learning needs, readiness, and health literacy"}, {"id": "b", "text": "Develop a written pamphlet on insulin administration"}, {"id": "c", "text": "Ask the client to return-demonstrate a glucose check"}, {"id": "d", "text": "Document that teaching was completed"}], "correct": ["a"], "explanation": "Assessment \u2014 gathering data on learning needs, readiness, and health literacy \u2014 is the first step of the teaching process before planning or implementing teaching."}, {"id": 155, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is writing a SMART outcome goal for a client learning to self-administer insulin. Which goal best meets SMART criteria?", "options": [{"id": "a", "text": "Client will independently draw up and administer insulin correctly by the time of discharge."}, {"id": "b", "text": "Client will feel more comfortable with insulin."}, {"id": "c", "text": "Client will learn about insulin eventually."}, {"id": "d", "text": "Client will understand diabetes management."}], "correct": ["a"], "explanation": "This goal is specific, measurable, achievable, relevant, and timed (by discharge), meeting all SMART criteria. The other options are vague and not measurable or time-bound."}, {"id": 156, "cat": "clienteducation", "type": "mc", "prompt": "A nurse asks a client to explain, in their own words, the signs of low blood sugar. Which element of the teaching process is the nurse performing?", "options": [{"id": "a", "text": "Evaluation"}, {"id": "b", "text": "Assessment"}, {"id": "c", "text": "Planning"}, {"id": "d", "text": "Implementation"}], "correct": ["a"], "explanation": "Asking the client to explain material in their own words (teach-back) is a method of evaluation, determining whether the learning goal was met."}, {"id": 157, "cat": "clienteducation", "type": "mc", "prompt": "A client has not met the learning goal of independently checking their blood glucose after two teaching sessions. Which action should the nurse take next?", "options": [{"id": "a", "text": "Determine if the goal is realistic and consider new teaching strategies"}, {"id": "b", "text": "Document that the client is noncompliant and stop teaching"}, {"id": "c", "text": "Assume the client will never learn the skill"}, {"id": "d", "text": "Repeat the exact same teaching method a third time without changes"}], "correct": ["a"], "explanation": "If a learning goal is unmet, the nurse should evaluate whether the goal is realistic and whether new teaching methods, based on the client's learning style, are needed."}, {"id": 158, "cat": "clienteducation", "type": "sata", "prompt": "A nurse is implementing a teaching plan for a client learning to manage a new colostomy. Which strategies reflect a multimodal, multisensory approach?", "options": [{"id": "a", "text": "Providing verbal discussion of the steps"}, {"id": "b", "text": "Using only one static approach for every client"}, {"id": "c", "text": "Demonstrating the skill for the client"}, {"id": "d", "text": "Giving the client printed materials to review"}, {"id": "e", "text": "Offering a video resource"}], "correct": ["a", "c", "d", "e"], "explanation": "A multimodal approach combines verbal discussion, demonstration, printed materials, and videos, reinforced with teach-back, not a single static method repeated for every client."}, {"id": 159, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is teaching a nursing student about the difference between the teaching process and the nursing process. Which statement indicates understanding?", "options": [{"id": "a", "text": "The teaching process focuses on the client's learning needs, while the nursing process focuses on overall health care needs."}, {"id": "b", "text": "The teaching process and nursing process are identical in focus."}, {"id": "c", "text": "The nursing process only applies to physical care, never education."}, {"id": "d", "text": "The teaching process has no relationship to the nursing process."}], "correct": ["a"], "explanation": "Both processes share similar steps (assessment, planning, implementation, evaluation), but the teaching process specifically targets the client's learning needs, motivation, and ability to learn."}, {"id": 160, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is planning diabetes education for six newly diagnosed clients on the unit. Which teaching strategy is most appropriate for this group size?", "options": [{"id": "a", "text": "Group instruction, since six or fewer people is considered ideal for group teaching"}, {"id": "b", "text": "Individual instruction only, since groups are never appropriate"}, {"id": "c", "text": "Role play only"}, {"id": "d", "text": "Digital technology only, with no other methods"}], "correct": ["a"], "explanation": "Group instruction is often most effective with six people or fewer, which fits this group size for shared teaching such as a diabetes education session."}, {"id": 161, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is using teach-back with a client after providing wound care instructions. Which statement should the nurse use?", "options": [{"id": "a", "text": "Can you tell me, in your own words, how you'll care for this wound at home?"}, {"id": "b", "text": "Do you understand everything I just said?"}, {"id": "c", "text": "I'll just repeat the instructions one more time."}, {"id": "d", "text": "You don't need to explain it back to me."}], "correct": ["a"], "explanation": "Teach-back involves asking the client to explain the information in their own words, which allows the nurse to evaluate true understanding rather than a simple yes/no response."}, {"id": 162, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is teaching a client about the benefits of digital resources for learning about their new medication. Which statement by the client indicates understanding?", "options": [{"id": "a", "text": "Using an app alongside your teaching can help reinforce what I've learned."}, {"id": "b", "text": "Digital tools should completely replace talking with my nurse."}, {"id": "c", "text": "Digital resources are never reliable for health information."}, {"id": "d", "text": "I don't need any other teaching method if I use an app."}], "correct": ["a"], "explanation": "Digital technology is most effective when combined with traditional teaching strategies, not used as a complete replacement."}, {"id": 163, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is choosing a teaching strategy for a client who has significant social anxiety and is uncomfortable in groups. Which approach should the nurse prioritize?", "options": [{"id": "a", "text": "Individual instruction"}, {"id": "b", "text": "A large group class"}, {"id": "c", "text": "A support group setting"}, {"id": "d", "text": "A public health seminar"}], "correct": ["a"], "explanation": "Group settings do not work well for all clients, especially when emotional barriers like social anxiety are present; individual instruction is more appropriate here."}, {"id": 164, "cat": "clienteducation", "type": "sata", "prompt": "A nurse is identifying examples of group instruction. Which examples should the nurse include?", "options": [{"id": "a", "text": "A childbirth education class"}, {"id": "b", "text": "One-on-one teaching at the bedside"}, {"id": "c", "text": "A diabetes education clinic with multiple attendees"}, {"id": "d", "text": "A support group session"}, {"id": "e", "text": "Education during an individual outpatient clinic visit"}], "correct": ["a", "c", "d"], "explanation": "Childbirth classes, diabetes education clinics, and support groups are all group instruction examples. Bedside and individual clinic visit teaching are individual instruction."}, {"id": 165, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is preparing to teach a client and notices the client appears to be in pain. Which action should the nurse take first?", "options": [{"id": "a", "text": "Address the client's pain before beginning the teaching session"}, {"id": "b", "text": "Proceed with teaching as scheduled regardless of pain"}, {"id": "c", "text": "Postpone teaching indefinitely without further assessment"}, {"id": "d", "text": "Ask a family member to receive the teaching instead"}], "correct": ["a"], "explanation": "Physical discomfort is a barrier to learning; addressing pain first helps create conditions where the client can actually engage with and retain the teaching."}, {"id": 166, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is applying the AHRQ Health Literacy Universal Precautions when teaching all clients. Which approach should the nurse use?", "options": [{"id": "a", "text": "Treat every client as if they may have difficulty understanding health information, using plain language"}, {"id": "b", "text": "Assume only clients with a low education level need simplified language"}, {"id": "c", "text": "Use medical terminology to ensure accuracy"}, {"id": "d", "text": "Avoid checking for understanding unless the client asks questions"}], "correct": ["a"], "explanation": "The Universal Precautions approach means treating all clients as potentially having limited health literacy, using plain language and confirming understanding regardless of assumptions about education level."}, {"id": 167, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is teaching a client about factors that support learning. Which statement by the client reflects understanding of a low-stimulus environment?", "options": [{"id": "a", "text": "A quiet room with good lighting and a comfortable temperature will help me focus during teaching."}, {"id": "b", "text": "Learning works best with background noise and distractions."}, {"id": "c", "text": "The room temperature doesn't affect my ability to learn."}, {"id": "d", "text": "I learn better in a crowded, busy area."}], "correct": ["a"], "explanation": "A low-stimulus environment \u2014 quiet, well-lit, comfortable temperature, minimal distractions \u2014 supports better learning outcomes."}, {"id": 168, "cat": "clienteducation", "type": "sata", "prompt": "A nurse is assessing a client for barriers to learning before a teaching session. Which findings should the nurse identify as potential barriers?", "options": [{"id": "a", "text": "The client reports high anxiety about their diagnosis"}, {"id": "b", "text": "The client has a strong support system"}, {"id": "c", "text": "The client has a hearing impairment"}, {"id": "d", "text": "The client reports significant pain"}, {"id": "e", "text": "The client is fluent in the nurse's primary language"}], "correct": ["a", "c", "d"], "explanation": "Anxiety, hearing impairment, and pain are all recognized barriers to learning. A strong support system and shared language are facilitators, not barriers."}, {"id": 169, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is distinguishing fine motor skills from gross motor skills while planning teaching for a client with reduced hand dexterity. Which task would be most affected?", "options": [{"id": "a", "text": "Buttoning a shirt"}, {"id": "b", "text": "Walking across the room"}, {"id": "c", "text": "Performing range-of-motion exercises"}, {"id": "d", "text": "Self-propelling a wheelchair"}], "correct": ["a"], "explanation": "Buttoning a shirt is a fine motor skill requiring dexterity of small muscles, which would be most affected by reduced hand dexterity. The others are gross motor skills."}, {"id": 170, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is teaching about self-bias. Which statement by a new nurse indicates understanding?", "options": [{"id": "a", "text": "I should reflect on my own thoughts and feelings before caring for clients from backgrounds different from mine."}, {"id": "b", "text": "Self-bias doesn't affect the quality of care I provide."}, {"id": "c", "text": "I don't need to consider my own perceptions when teaching clients."}, {"id": "d", "text": "Self-bias only applies to clients, not nurses."}], "correct": ["a"], "explanation": "Reflecting on personal thoughts and feelings helps nurses identify and reduce self-bias before interacting with clients from diverse backgrounds."}, {"id": 171, "cat": "clienteducation", "type": "mc", "prompt": "A nurse provides feedback to a client during a return demonstration of blood pressure self-monitoring. Which purpose does this feedback serve?", "options": [{"id": "a", "text": "It helps the nurse evaluate the client's understanding and identify if more guidance is needed"}, {"id": "b", "text": "It replaces the need for further teaching sessions"}, {"id": "c", "text": "It is only useful after teaching is fully completed"}, {"id": "d", "text": "It has no impact on the client's learning"}], "correct": ["a"], "explanation": "Feedback given during and after teaching helps the nurse assess the client's understanding and determine whether additional guidance is needed."}, {"id": 172, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is planning to teach a 2-year-old client about an upcoming procedure. Which approach should the nurse prioritize?", "options": [{"id": "a", "text": "Direct the teaching primarily toward the caregivers, using brief sessions near the time of the event"}, {"id": "b", "text": "Provide a detailed lecture directly to the toddler"}, {"id": "c", "text": "Give the toddler written material to read independently"}, {"id": "d", "text": "Wait until the day after the procedure to provide any teaching"}], "correct": ["a"], "explanation": "For infants and toddlers, teaching is directed primarily toward caregivers, with brief sessions timed close to the event due to the child's limited attention span."}, {"id": 173, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is teaching a school-age child about an upcoming procedure. Which strategy should the nurse use?", "options": [{"id": "a", "text": "Use games, role-play, and storytelling appropriate for logical reasoning at this age"}, {"id": "b", "text": "Rely solely on complex medical terminology"}, {"id": "c", "text": "Direct all teaching exclusively to the parents and exclude the child"}, {"id": "d", "text": "Use only written pamphlets with no interactive elements"}], "correct": ["a"], "explanation": "School-age children are capable of logical reasoning, so games, role-play, artwork, and storytelling are appropriate, engaging teaching strategies for this age group."}, {"id": 174, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is teaching an adolescent client about managing a new diagnosis. Which statement by the nurse reflects best practice for this age group?", "options": [{"id": "a", "text": "Let's talk about how you can manage this \u2014 I'll answer any questions you have."}, {"id": "b", "text": "I'll only speak with your parents about your care."}, {"id": "c", "text": "I'll lecture you about all the things you're doing wrong."}, {"id": "d", "text": "Your privacy isn't a priority during this teaching."}], "correct": ["a"], "explanation": "Teaching for adolescents should focus on the adolescent as the primary learner, use guidance rather than lecturing, and protect their modesty and privacy."}, {"id": 175, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is teaching an 80-year-old client with mild hearing and vision decline. Which approach should the nurse prioritize?", "options": [{"id": "a", "text": "Reduce distractions, speak in a low tone, and present information in smaller segments"}, {"id": "b", "text": "Speak quickly to cover all material in one session"}, {"id": "c", "text": "Present all information at once in a single large block"}, {"id": "d", "text": "Avoid repeating any information during teaching"}], "correct": ["a"], "explanation": "Older adults may process new information more slowly; reducing distractions, speaking clearly, allowing more time, and breaking information into smaller segments supports learning."}, {"id": 176, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is preparing to teach a client whose primary language differs from the nurse's. Which action should the nurse take?", "options": [{"id": "a", "text": "Arrange for a certified medical interpreter"}, {"id": "b", "text": "Ask the client's adult child to interpret"}, {"id": "c", "text": "Use only written English materials"}, {"id": "d", "text": "Proceed with teaching in English without any interpretation"}], "correct": ["a"], "explanation": "A certified medical interpreter should always be used rather than a family member, to ensure accuracy and protect client confidentiality."}, {"id": 177, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is teaching about cultural considerations in client education. Which statement by a nursing student indicates understanding?", "options": [{"id": "a", "text": "I should ask about the client's beliefs and preferences rather than assume based on their culture."}, {"id": "b", "text": "All clients from the same culture have identical health beliefs."}, {"id": "c", "text": "Cultural beliefs have no impact on how clients respond to teaching."}, {"id": "d", "text": "I should apply the same generalized approach to every client regardless of background."}], "correct": ["a"], "explanation": "Nurses should assess each client's individual beliefs, customs, and values rather than generalizing based on culture, to avoid stereotyping and provide individualized, culturally sensitive education."}, {"id": 178, "cat": "clienteducation", "type": "sata", "prompt": "A nurse is preparing to teach a preschool-age client about an upcoming procedure. Which strategies should the nurse include?", "options": [{"id": "a", "text": "Use of play and sensory experiences"}, {"id": "b", "text": "Detailed written material for the child to read independently"}, {"id": "c", "text": "Allowing the child to express fears openly"}, {"id": "d", "text": "Involving the caregiver in the teaching process"}, {"id": "e", "text": "Using complex medical terminology"}], "correct": ["a", "c", "d"], "explanation": "Preschoolers benefit from play and sensory experiences, being allowed to express fears, and caregiver involvement. They cannot read independently and should not be taught with complex medical terminology."}, {"id": 179, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is evaluating a client's readiness to learn about a new medication regimen. Which client statement indicates readiness to learn?", "options": [{"id": "a", "text": "Can you show me how to take this new medication safely?"}, {"id": "b", "text": "I really don't want to think about this right now."}, {"id": "c", "text": "I can't remember anything the doctor told me."}, {"id": "d", "text": "I'll worry about that after I feel better."}], "correct": ["a"], "explanation": "A client actively requesting information and engaging with the material demonstrates readiness to learn, in contrast to statements reflecting avoidance or disengagement."}, {"id": 180, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is deciding between group and individual instruction for a client recovering from a highly stigmatized diagnosis who expresses discomfort discussing it in front of others. Which strategy should the nurse choose?", "options": [{"id": "a", "text": "Individual instruction"}, {"id": "b", "text": "A large support group"}, {"id": "c", "text": "A public health class"}, {"id": "d", "text": "A group session with unfamiliar peers"}], "correct": ["a"], "explanation": "When a client expresses discomfort or an emotional barrier to group settings, individual instruction is the more appropriate strategy."}, {"id": 181, "cat": "dei", "type": "mc", "prompt": "During a chart audit, a nurse realizes they consistently spend less time with clients who have limited English proficiency, although the nurse never intended to. The nurse should recognize this as which of the following?", "options": [{"id": "a", "text": "Explicit bias"}, {"id": "b", "text": "Implicit bias"}, {"id": "c", "text": "Cultural competence"}, {"id": "d", "text": "Etic knowledge"}], "correct": ["b"], "explanation": "Implicit bias is unconscious and involuntary and affects perceptions, decisions, and interactions without the person realizing it."}, {"id": 182, "cat": "dei", "type": "mc", "prompt": "A nurse tells a coworker, \"I'd rather not be assigned to clients of that religion.\" The charge nurse should recognize this statement as which of the following?", "options": [{"id": "a", "text": "Explicit bias"}, {"id": "b", "text": "Implicit bias"}, {"id": "c", "text": "Cultural awareness"}, {"id": "d", "text": "Emic knowledge"}], "correct": ["a"], "explanation": "Explicit bias is conscious bias from thoughts and beliefs a person is aware of and can report."}, {"id": 183, "cat": "dei", "type": "mc", "prompt": "A nurse wants to improve their cultural awareness. Which action should the nurse take first?", "options": [{"id": "a", "text": "Memorize the health practices of several cultures."}, {"id": "b", "text": "Complete a self-assessment of their own biases."}, {"id": "c", "text": "Ask a family member to interpret for clients."}, {"id": "d", "text": "Review the hospital's policies on visitation."}], "correct": ["b"], "explanation": "Cultural awareness begins with a self-assessment of one's own biases, then investigating and understanding differences between one's own culture and others'."}, {"id": 184, "cat": "dei", "type": "mc", "prompt": "A nurse asks a client to explain what a family healing ceremony means to them and how it relates to their recovery. The nurse is gaining which type of knowledge?", "options": [{"id": "a", "text": "Emic knowledge"}, {"id": "b", "text": "Etic knowledge"}, {"id": "c", "text": "Explicit knowledge"}, {"id": "d", "text": "Organizational knowledge"}], "correct": ["a"], "explanation": "Emic knowledge is the insider's perspective, defined by members of the culture."}, {"id": 185, "cat": "dei", "type": "mc", "prompt": "A nurse reads a research study about health practices common in a particular cultural group. The nurse is gaining which type of knowledge?", "options": [{"id": "a", "text": "Emic knowledge"}, {"id": "b", "text": "Etic knowledge"}, {"id": "c", "text": "Implicit knowledge"}, {"id": "d", "text": "Personal health literacy"}], "correct": ["b"], "explanation": "Etic knowledge is the outsider's perspective, based on external observation, objective data, or scientific theories about a culture."}, {"id": 186, "cat": "dei", "type": "mc", "prompt": "A nurse is teaching a group of nursing students about cultural competence. Which statement by a student indicates an understanding of the teaching?", "options": [{"id": "a", "text": "\"Cultural competence means knowing the definitions of different cultures.\""}, {"id": "b", "text": "\"Cultural competence means integrating nursing care with both emic and etic knowledge.\""}, {"id": "c", "text": "\"Cultural competence means treating every client exactly the same way.\""}, {"id": "d", "text": "\"Cultural competence only matters when a client speaks another language.\""}], "correct": ["b"], "explanation": "Cultural competence includes appreciating, accepting, and respecting clients' cultural beliefs, open communication and feedback, and integrating nursing care with emic and etic knowledge."}, {"id": 187, "cat": "dei", "type": "mc", "prompt": "A nurse cares for two clients from the same cultural background and notices they have very different health practices and beliefs. The nurse should recognize which of the following?", "options": [{"id": "a", "text": "One of the clients is not following their culture correctly."}, {"id": "b", "text": "Cultural diversity occurs within, as well as among, cultural groups."}, {"id": "c", "text": "Cultural differences only exist between different ethnic groups."}, {"id": "d", "text": "The nurse should base care on the more common practice."}], "correct": ["b"], "explanation": "Cultural diversity occurs within and among cultural groups, so the nurse should never assume all members of a group share the same beliefs."}, {"id": 188, "cat": "dei", "type": "mc", "prompt": "A client's name on their insurance card doesn't match the name they give the nurse. Which part of the cultural health assessment is the nurse completing when respectfully clarifying this?", "options": [{"id": "a", "text": "Demographic assessment"}, {"id": "b", "text": "Biological factors"}, {"id": "c", "text": "Technological factors"}, {"id": "d", "text": "Culture care repatterning"}], "correct": ["a"], "explanation": "The demographic assessment lays the foundation for who the client is, and the nurse should be aware that a client's name or gender may differ from their records."}, {"id": 189, "cat": "dei", "type": "sata", "prompt": "A nurse educator is teaching staff how bias can affect client care. Which effects should the educator include? Select all that apply.", "options": [{"id": "a", "text": "Less compassion shown to certain clients"}, {"id": "b", "text": "Less time spent building relationships"}, {"id": "c", "text": "Poorer client assessment"}, {"id": "d", "text": "Contribution to health care disparities"}, {"id": "e", "text": "Improved client outcomes"}], "correct": ["a", "b", "c", "d"], "explanation": "Bias can lead to less compassion, less time building relationships, and poorer assessment, which contribute to health care disparities."}, {"id": 190, "cat": "dei", "type": "mc", "prompt": "A new urgent care center opens in a rural town. The nurse arranges transportation vouchers for residents who don't have a car. This action is an example of which of the following?", "options": [{"id": "a", "text": "Health equality"}, {"id": "b", "text": "Health equity"}, {"id": "c", "text": "Explicit bias"}, {"id": "d", "text": "Organizational health literacy"}], "correct": ["b"], "explanation": "Equity adjusts for individual needs so everyone can reach the same outcome. Equality gives everyone the same thing, such as simply opening the center to all residents."}, {"id": 191, "cat": "dei", "type": "mc", "prompt": "A nurse is beginning care for a newly admitted client from a different cultural background. When should the nurse begin collecting cultural health assessment data?", "options": [{"id": "a", "text": "At the first encounter with the client"}, {"id": "b", "text": "Only if the client requests it"}, {"id": "c", "text": "After the client is stabilized for discharge"}, {"id": "d", "text": "Only if the client does not speak English"}], "correct": ["a"], "explanation": "The cultural health assessment should begin at the first client encounter. The nurse should always ask and never assume."}, {"id": 192, "cat": "dei", "type": "mc", "prompt": "A client repeatedly misses follow-up appointments because they have no car and no health insurance. The nurse should recognize these barriers as which of the following?", "options": [{"id": "a", "text": "Social determinants of health"}, {"id": "b", "text": "Implicit bias"}, {"id": "c", "text": "Emic knowledge"}, {"id": "d", "text": "Culture care preservation"}], "correct": ["a"], "explanation": "Social determinants of health are conditions that affect health, quality of life, and well-being and contribute to disparities, such as lack of insurance or transportation."}, {"id": 193, "cat": "dei", "type": "mc", "prompt": "A nurse is teaching a group of nursing students about health disparities. Which definition should the nurse include?", "options": [{"id": "a", "text": "Differences in health outcomes between populations, particularly vulnerable groups compared with the majority"}, {"id": "b", "text": "The distribution of the same resources to everyone"}, {"id": "c", "text": "An individual's ability to understand health information"}, {"id": "d", "text": "A blueprint for organizations to improve quality"}], "correct": ["a"], "explanation": "Health disparities are differences in health outcomes between populations, particularly vulnerable groups compared with the majority, and can limit access to care."}, {"id": 194, "cat": "dei", "type": "mc", "prompt": "A nurse manager is explaining the purpose of the National CLAS standards to staff. Which statement by the manager is accurate?", "options": [{"id": "a", "text": "\"They are a blueprint for organizations to advance health equity, improve quality, and eliminate disparities.\""}, {"id": "b", "text": "\"They are a cultural assessment tool used at the bedside.\""}, {"id": "c", "text": "\"They determine the reading level for all patient materials.\""}, {"id": "d", "text": "\"They describe the three modes of culture care.\""}], "correct": ["a"], "explanation": "The CLAS standards are a blueprint for health care organizations to advance health equity, improve quality, and eliminate health care disparities."}, {"id": 195, "cat": "dei", "type": "mc", "prompt": "After receiving discharge teaching, a client is unable to explain how to take their new medication or why they need it. The nurse should recognize a concern with which of the following?", "options": [{"id": "a", "text": "Organizational health literacy"}, {"id": "b", "text": "Personal health literacy"}, {"id": "c", "text": "Health equality"}, {"id": "d", "text": "Etic knowledge"}], "correct": ["b"], "explanation": "Personal health literacy is the extent to which a person can obtain, process, and understand basic health information."}, {"id": 196, "cat": "dei", "type": "mc", "prompt": "A hospital provides simplified health materials in several languages and trains staff to help clients find and use health services. This is an example of which of the following?", "options": [{"id": "a", "text": "Personal health literacy"}, {"id": "b", "text": "Organizational health literacy"}, {"id": "c", "text": "Implicit bias"}, {"id": "d", "text": "Folk care"}], "correct": ["b"], "explanation": "Organizational health literacy is the extent to which organizations equitably help people find, understand, and use health information and services."}, {"id": 197, "cat": "dei", "type": "mc", "prompt": "A nurse is creating written education materials for clients. At which reading level should the nurse write the materials?", "options": [{"id": "a", "text": "College level"}, {"id": "b", "text": "12th grade"}, {"id": "c", "text": "10th grade"}, {"id": "d", "text": "8th grade or lower"}], "correct": ["d"], "explanation": "The NIH recommends presenting all health information at an 8th-grade reading level or lower."}, {"id": 198, "cat": "dei", "type": "sata", "prompt": "A nurse is reviewing clients on a community health caseload. Which clients should the nurse identify as members of a vulnerable population? Select all that apply.", "options": [{"id": "a", "text": "An 8-year-old child experiencing poverty"}, {"id": "b", "text": "A 91-year-old client who has heart failure"}, {"id": "c", "text": "A 1-year-old child who has cerebral palsy"}, {"id": "d", "text": "A 17-year-old client who is pregnant"}, {"id": "e", "text": "A high-income adult who has no chronic illness"}], "correct": ["a", "b", "c", "d"], "explanation": "Vulnerable populations include children, older adults, people living in poverty, clients with chronic illness or disabilities, and pregnant adolescents. A high-income adult without chronic illness does not face these barriers."}, {"id": 199, "cat": "dei", "type": "sata", "prompt": "A nurse is caring for an adolescent client who recently shared that they are bisexual. The nurse should recognize the client is at increased risk for which of the following? Select all that apply.", "options": [{"id": "a", "text": "Bullying"}, {"id": "b", "text": "Depression"}, {"id": "c", "text": "Sexually transmitted infections"}, {"id": "d", "text": "Illicit substance use"}, {"id": "e", "text": "Suicide"}, {"id": "f", "text": "Increased need for prescription opioids"}], "correct": ["a", "b", "c", "d", "e"], "explanation": "LGBTQ+ youth are at increased risk for bullying, physical and sexual violence, depression, illicit substance use, STIs, and suicide, with effects that can last into adulthood."}, {"id": 200, "cat": "dei", "type": "mc", "prompt": "During an outbreak of influenza, which client should the nurse identify as being at highest risk for infection because of population density?", "options": [{"id": "a", "text": "A client who lives alone in a rural home"}, {"id": "b", "text": "A client who lives in a nursing home"}, {"id": "c", "text": "A client who works from home"}, {"id": "d", "text": "A client who lives with one roommate in a house"}], "correct": ["b"], "explanation": "Living close together, as in nursing homes, shelters, dorms, and apartments, increases the spread of infection."}, {"id": 201, "cat": "dei", "type": "mc", "prompt": "A client living in poverty who also experiences racial discrimination and has multiple chronic illnesses reports high stress and recent substance use. The nurse should recognize this as an example of which of the following?", "options": [{"id": "a", "text": "Intersectionality"}, {"id": "b", "text": "Cultural competence"}, {"id": "c", "text": "Health equality"}, {"id": "d", "text": "Emic knowledge"}], "correct": ["a"], "explanation": "Intersectionality is experiencing multiple disparities at the same time, which leads to greater stress, lower self-esteem, and riskier behaviors such as substance use."}, {"id": 202, "cat": "dei", "type": "mc", "prompt": "A nurse is preparing a community emergency plan. Which population should the nurse recognize as disproportionately affected by disasters?", "options": [{"id": "a", "text": "Young adults"}, {"id": "b", "text": "Older adults"}, {"id": "c", "text": "Middle-income adults without chronic illness"}, {"id": "d", "text": "College students"}], "correct": ["b"], "explanation": "Older adults are more vulnerable because of greater physical disabilities and dependence on others, and they are disproportionately affected by disasters."}, {"id": 203, "cat": "dei", "type": "sata", "prompt": "A nurse is assessing barriers that may affect a client's access to health care. Which factors should the nurse assess? Select all that apply.", "options": [{"id": "a", "text": "Access to transportation"}, {"id": "b", "text": "Health insurance"}, {"id": "c", "text": "Geographic location"}, {"id": "d", "text": "Sensory deficits"}, {"id": "e", "text": "Blood type"}], "correct": ["a", "b", "c", "d"], "explanation": "Factors affecting access to care include transportation, accessibility, insurance, religion, geographic location, sensory deficits, disabilities, mental health, socioeconomic status, race, ethnicity, gender, sexual orientation, and limited education."}, {"id": 204, "cat": "dei", "type": "mc", "prompt": "A nurse is reviewing factors that affect vulnerable populations. Which of the following is a socioeconomic factor?", "options": [{"id": "a", "text": "Age"}, {"id": "b", "text": "English proficiency"}, {"id": "c", "text": "Household income"}, {"id": "d", "text": "Chronic health conditions"}], "correct": ["c"], "explanation": "Socioeconomic factors include education level, employment status, household income, and poverty status. Age and English proficiency are demographic factors, and chronic conditions are health status factors."}, {"id": 205, "cat": "dei", "type": "mc", "prompt": "A nurse is reviewing factors that affect vulnerable populations. Which of the following is a health status factor?", "options": [{"id": "a", "text": "Population density"}, {"id": "b", "text": "Health insurance status"}, {"id": "c", "text": "Employment status"}, {"id": "d", "text": "Household type"}], "correct": ["b"], "explanation": "Health status factors include chronic health conditions, disabilities, and health insurance status. Population density and household type are demographic factors, and employment is a socioeconomic factor."}, {"id": 206, "cat": "dei", "type": "mc", "prompt": "A transgender client tells the nurse their chosen name and pronouns. Which action should the nurse take?", "options": [{"id": "a", "text": "Use the name listed on the client's insurance card."}, {"id": "b", "text": "Use the client's chosen name and pronouns consistently."}, {"id": "c", "text": "Ask the client to provide legal documentation of the name change."}, {"id": "d", "text": "Avoid using the client's name altogether."}], "correct": ["b"], "explanation": "Using a client's chosen name and pronouns shows respect and openness. Inconsistent use is a barrier to gender-affirming care."}, {"id": 207, "cat": "dei", "type": "mc", "prompt": "A nurse is explaining Leininger's Theory of Culture Care Diversity and Universality to a group of nursing students. Which statement by the nurse is accurate?", "options": [{"id": "a", "text": "\"It guides nurses to give care that fits the client's cultural values, beliefs, and practices.\""}, {"id": "b", "text": "\"It measures how stressful a client perceives their life to be.\""}, {"id": "c", "text": "\"It describes the stages of sleep.\""}, {"id": "d", "text": "\"It is used to determine a client's reading level.\""}], "correct": ["a"], "explanation": "Leininger's theory, also called Transcultural Nursing Theory, guides nurses to give care that fits the client's cultural values, beliefs, and practices."}, {"id": 208, "cat": "dei", "type": "mc", "prompt": "A nurse is using Leininger's Sunrise Enabler. Which of the following is one of its five categories?", "options": [{"id": "a", "text": "Three modes of care decisions and actions"}, {"id": "b", "text": "Twelve cultural domains"}, {"id": "c", "text": "Primary and secondary appraisal"}, {"id": "d", "text": "Alarm, resistance, and exhaustion"}], "correct": ["a"], "explanation": "The five categories are the upper level (worldview), the rays of the sun (basic elements), the central core, the focus on individuals, families, groups, communities, or institutions, and the three modes of care decisions and actions."}, {"id": 209, "cat": "dei", "type": "sata", "prompt": "A nurse is completing a cultural assessment based on the basic elements (rays of the sun) of the Sunrise Enabler. Which elements should the nurse assess? Select all that apply.", "options": [{"id": "a", "text": "Technological factors"}, {"id": "b", "text": "Kinship and social factors"}, {"id": "c", "text": "Economic factors"}, {"id": "d", "text": "Educational factors"}, {"id": "e", "text": "Hospital staffing ratios"}], "correct": ["a", "b", "c", "d"], "explanation": "The basic elements are technological; religious, spiritual, and philosophical; kinship and social; cultural values, beliefs, and lifeways; biological; political and legal; economic; and educational factors."}, {"id": 210, "cat": "dei", "type": "mc", "prompt": "A nurse asks a client whether they have access to a phone, internet, or computer. The nurse is assessing which element of the Sunrise Enabler?", "options": [{"id": "a", "text": "Technological factors"}, {"id": "b", "text": "Biological factors"}, {"id": "c", "text": "Political and legal factors"}, {"id": "d", "text": "Kinship and social factors"}], "correct": ["a"], "explanation": "Technological factors include access to a phone, internet, or computer, which affects access to care and communication with providers."}, {"id": 211, "cat": "dei", "type": "mc", "prompt": "A nurse asks a client about any personal or family history of mental illness or genetic conditions. The nurse is assessing which element of the Sunrise Enabler?", "options": [{"id": "a", "text": "Biological factors"}, {"id": "b", "text": "Economic factors"}, {"id": "c", "text": "Educational factors"}, {"id": "d", "text": "Technological factors"}], "correct": ["a"], "explanation": "Biological factors include personal or family history of physical or mental illness and genetic conditions."}, {"id": 212, "cat": "dei", "type": "mc", "prompt": "A nurse asks a client, \"Who is your support system?\" and \"What is your marital status?\" The nurse is assessing which element of the Sunrise Enabler?", "options": [{"id": "a", "text": "Kinship and social factors"}, {"id": "b", "text": "Technological factors"}, {"id": "c", "text": "Political and legal factors"}, {"id": "d", "text": "Biological factors"}], "correct": ["a"], "explanation": "Kinship and social factors include marital status and support systems such as family and friends."}, {"id": 213, "cat": "dei", "type": "mc", "prompt": "A client's grandmother prepares a traditional remedy passed down through generations to help the client recover. The nurse should recognize this as which of the following?", "options": [{"id": "a", "text": "Folk (generic) care"}, {"id": "b", "text": "Integrative care"}, {"id": "c", "text": "Culture care repatterning"}, {"id": "d", "text": "Etic knowledge"}], "correct": ["a"], "explanation": "Folk (generic) care is nonprofessional care based on tradition, given by family or a folk practitioner."}, {"id": 214, "cat": "dei", "type": "mc", "prompt": "A client wants to continue using a traditional herbal remedy along with prescribed treatment. The nurse collaborates with the provider so the client can safely use both. The nurse is practicing which of the following?", "options": [{"id": "a", "text": "Folk care"}, {"id": "b", "text": "Integrative care"}, {"id": "c", "text": "Explicit bias"}, {"id": "d", "text": "Health equality"}], "correct": ["b"], "explanation": "In integrative care, the nurse acts as a bridge between folk or naturopathic medicine and Western medicine."}, {"id": 215, "cat": "dei", "type": "mc", "prompt": "A client requests a female caregiver because of religious beliefs, and the nurse arranges the assignment. This is an example of which mode of culture care?", "options": [{"id": "a", "text": "Culture care preservation and maintenance"}, {"id": "b", "text": "Culture care accommodation and negotiation"}, {"id": "c", "text": "Culture care repatterning and restructuring"}, {"id": "d", "text": "Integrative care"}], "correct": ["a"], "explanation": "Culture care preservation and maintenance supports the client in maintaining their cultural beliefs and values."}, {"id": 216, "cat": "dei", "type": "mc", "prompt": "A client who has diabetes wants to eat traditional holiday foods high in carbohydrates. The nurse helps the client adjust portion sizes so they can still take part safely. This is an example of which mode of culture care?", "options": [{"id": "a", "text": "Culture care preservation and maintenance"}, {"id": "b", "text": "Culture care accommodation and negotiation"}, {"id": "c", "text": "Culture care repatterning and restructuring"}, {"id": "d", "text": "Folk care"}], "correct": ["b"], "explanation": "Culture care accommodation and negotiation helps the client adapt their cultural beliefs and practices for safety, health, and wellness."}, {"id": 217, "cat": "dei", "type": "mc", "prompt": "A client's cultural practice is causing harm to their health. The nurse works with the client to change the practice to improve outcomes. This is an example of which mode of culture care?", "options": [{"id": "a", "text": "Culture care preservation and maintenance"}, {"id": "b", "text": "Culture care accommodation and negotiation"}, {"id": "c", "text": "Culture care repatterning and restructuring"}, {"id": "d", "text": "Emic knowledge"}], "correct": ["c"], "explanation": "Culture care repatterning and restructuring helps the client restructure their cultural beliefs to improve health outcomes."}, {"id": 218, "cat": "dei", "type": "mc", "prompt": "A client with limited English proficiency is being admitted. The client's adult daughter offers to interpret. Which action should the nurse take?", "options": [{"id": "a", "text": "Accept the daughter's offer because she knows the client best."}, {"id": "b", "text": "Request a certified medical interpreter."}, {"id": "c", "text": "Ask a staff member who speaks some of the client's language to interpret."}, {"id": "d", "text": "Speak slowly and loudly in English."}], "correct": ["b"], "explanation": "A certified medical interpreter ensures accurate, complete, and confidential communication. Family members or other staff may omit, alter, or misinterpret information and don't know medical terminology."}, {"id": 219, "cat": "dei", "type": "sata", "prompt": "A nurse is preparing to give discharge instructions to a client who speaks a different language than the nurse. Which actions are appropriate? Select all that apply.", "options": [{"id": "a", "text": "Consult a certified medical interpreter."}, {"id": "b", "text": "Provide written instructions in the client's preferred language."}, {"id": "c", "text": "Have a family member translate the instructions."}, {"id": "d", "text": "Ask a staff member who speaks some of the client's language to explain the instructions."}, {"id": "e", "text": "Speak more loudly in English."}], "correct": ["a", "b"], "explanation": "Discharge teaching with a language barrier requires a certified medical interpreter and written instructions in the client's preferred language. Family members and other staff may misinterpret information and compromise confidentiality."}, {"id": 220, "cat": "dei", "type": "sata", "prompt": "A nurse is caring for a client who has hearing loss. Which actions should the nurse take? Select all that apply.", "options": [{"id": "a", "text": "Face the client when speaking."}, {"id": "b", "text": "Reduce background noise."}, {"id": "c", "text": "Use a loud tone of voice."}, {"id": "d", "text": "Speak at a faster pace."}, {"id": "e", "text": "Write everything down on paper."}], "correct": ["a", "b"], "explanation": "The nurse should face the client and reduce background noise. A loud voice, faster speech, or writing everything down are not effective strategies."}, {"id": 221, "cat": "selfconcept", "type": "mc", "prompt": "A nurse is caring for a client 2 days after a mastectomy. Which statement by the client shows positive self-esteem related to body image?", "options": [{"id": "a", "text": "\"I don't want my partner to see me like this.\""}, {"id": "b", "text": "\"Can you tell me where I can get fitted for a breast prosthesis?\""}, {"id": "c", "text": "\"I'll just wear baggy clothes so nobody notices.\""}, {"id": "d", "text": "\"Please tell my friends not to visit this week.\""}], "correct": ["b"], "explanation": "Seeking ways to cope with or improve body image shows positive self-esteem. Hiding the change and withdrawing from visitors suggest negative self-esteem."}, {"id": 222, "cat": "selfconcept", "type": "mc", "prompt": "A nurse is talking with a 17-year-old client who says, \"My parents are both pharmacists, so I'm going to pharmacy school. I've never really thought about doing anything else.\" Which identity status should the nurse recognize?", "options": [{"id": "a", "text": "Identity achievement"}, {"id": "b", "text": "Moratorium"}, {"id": "c", "text": "Foreclosure"}, {"id": "d", "text": "Identity diffusion"}], "correct": ["c"], "explanation": "Foreclosure is commitment without exploration, adopting the expectations of authority figures without questioning them. Achievement requires exploring first; moratorium is exploring without committing; diffusion is neither."}, {"id": 223, "cat": "selfconcept", "type": "mc", "prompt": "A nurse is assessing a client's self-concept. Which question should the nurse ask to assess role performance?", "options": [{"id": "a", "text": "\"How would you describe yourself?\""}, {"id": "b", "text": "\"How successful do you feel in fulfilling your responsibilities as a parent?\""}, {"id": "c", "text": "\"How do you respond when you experience failure?\""}, {"id": "d", "text": "\"Which aspects of your appearance would you like to change?\""}], "correct": ["b"], "explanation": "Asking how successful the client feels in their roles assesses role performance. Self-description assesses identity, response to failure assesses self-esteem, and appearance assesses body image."}, {"id": 224, "cat": "selfconcept", "type": "mc", "prompt": "A client works full time, cares for her father who has dementia, and is raising three children. She tells the nurse, \"There aren't enough hours in the day to do everything that's expected of me.\" Which role stressor is the client experiencing?", "options": [{"id": "a", "text": "Role ambiguity"}, {"id": "b", "text": "Role overload"}, {"id": "c", "text": "Role clarity"}, {"id": "d", "text": "Role enhancement"}], "correct": ["b"], "explanation": "Role overload occurs when the demands of multiple roles exceed a person's ability to manage them. Role ambiguity is unclear expectations; role clarity and role enhancement reduce stress."}, {"id": 225, "cat": "selfconcept", "type": "sata", "prompt": "A nurse is assessing a client for behaviors that may indicate an altered self-concept. Which findings should the nurse identify? Select all that apply.", "options": [{"id": "a", "text": "Tearfulness during the interview"}, {"id": "b", "text": "Frequently apologizing to the nurse"}, {"id": "c", "text": "Difficulty making simple decisions"}, {"id": "d", "text": "Asking questions about the treatment plan"}, {"id": "e", "text": "Referring to themself as \"useless\""}], "correct": ["a", "b", "c", "e"], "explanation": "Tearfulness, being overly apologetic, indecisiveness, and negative self-talk can indicate an altered self-concept. Asking questions about treatment shows engagement in care."}, {"id": 226, "cat": "selfconcept", "type": "sata", "prompt": "A nurse is planning care for a client who had a below-the-knee amputation and is unable to return to work. Which actions should the nurse include to promote a healthy self-concept? Select all that apply.", "options": [{"id": "a", "text": "Encourage the client to express feelings about the change in body function."}, {"id": "b", "text": "Discuss available rehabilitation and support resources."}, {"id": "c", "text": "Perform all ADLs for the client to conserve their energy."}, {"id": "d", "text": "Establish goals collaboratively with the client and family."}, {"id": "e", "text": "Postpone addressing emotional needs until physical rehabilitation is complete."}], "correct": ["a", "b", "d"], "explanation": "Expressing feelings, using resources, and collaborative goal-setting support adaptation and a client-centered plan. Doing all ADLs promotes dependence, and delaying emotional care ignores the holistic approach."}, {"id": 227, "cat": "selfconcept", "type": "mc", "prompt": "A nurse is evaluating the plan of care for a client who has a disturbed body image after surgery. Which client statement shows the plan has been effective?", "options": [{"id": "a", "text": "\"I'm learning to accept how my body looks now.\""}, {"id": "b", "text": "\"I don't want to talk about my scar.\""}, {"id": "c", "text": "\"I feel overwhelmed every time I look in the mirror.\""}, {"id": "d", "text": "\"I'll deal with this after I get home.\""}], "correct": ["a"], "explanation": "Verbalizing acceptance of body image is an expected outcome. Avoiding the topic and feeling overwhelmed mean further interventions are needed."}, {"id": 228, "cat": "selfconcept", "type": "mc", "prompt": "A nurse manager is discussing emotional intelligence with staff. Which statement by a staff nurse shows an understanding of self-regulation?", "options": [{"id": "a", "text": "\"I take a few deep breaths before I respond when a family member yells at me.\""}, {"id": "b", "text": "\"I can usually tell when a coworker is upset.\""}, {"id": "c", "text": "\"I stay persistent when working toward my goals.\""}, {"id": "d", "text": "\"I find it easy to build rapport with new clients.\""}], "correct": ["a"], "explanation": "Self-regulation is managing one's emotional state, or thinking before acting. Sensing a coworker's feelings is empathy, persistence toward goals is motivation, and building rapport is social skill."}, {"id": 229, "cat": "selfconcept", "type": "mc", "prompt": "A school nurse is planning a health education program on body image. Which age group should the nurse recognize as most vulnerable to body dissatisfaction?", "options": [{"id": "a", "text": "School-age children"}, {"id": "b", "text": "Adolescents"}, {"id": "c", "text": "Middle adults"}, {"id": "d", "text": "Older adults"}], "correct": ["b"], "explanation": "Adolescents are the most vulnerable because rapid physical and hormonal changes during puberty coincide with greater exposure to cultural ideals of attractiveness."}, {"id": 230, "cat": "selfconcept", "type": "mc", "prompt": "A nurse is teaching a client who has a new diagnosis of type 2 diabetes. Which client statement shows low self-efficacy?", "options": [{"id": "a", "text": "\"I'm nervous, but I know I can learn to check my blood sugar.\""}, {"id": "b", "text": "\"I'll never be able to manage all of this, so why even try?\""}, {"id": "c", "text": "\"Can you show me the insulin injection one more time?\""}, {"id": "d", "text": "\"My daughter and I are going to take the diabetes class together.\""}], "correct": ["b"], "explanation": "Low self-efficacy shows up as self-doubt and giving up before trying. The other statements show confidence, engagement in learning, and use of support."}, {"id": 231, "cat": "selfconcept", "type": "mc", "prompt": "A 19-year-old client tells the nurse, \"I keep switching my major between nursing, art, and business. I get so anxious because I can't decide what I want to do with my life.\" Which identity status should the nurse recognize?", "options": [{"id": "a", "text": "Identity achievement"}, {"id": "b", "text": "Moratorium"}, {"id": "c", "text": "Foreclosure"}, {"id": "d", "text": "Identity diffusion"}], "correct": ["b"], "explanation": "Moratorium is active exploration without commitment, often with anxiety and feeling overwhelmed. Achievement requires both exploring and committing; foreclosure is commitment without exploring; diffusion lacks both."}, {"id": 232, "cat": "selfconcept", "type": "sata", "prompt": "A nurse is reviewing the health histories of several clients. Which clients should the nurse identify as experiencing self-esteem stressors? Select all that apply.", "options": [{"id": "a", "text": "A client who recently retired and says, \"I feel like I have no purpose now.\""}, {"id": "b", "text": "A client whose spouse died 6 months ago"}, {"id": "c", "text": "A client who was laid off from their job last month"}, {"id": "d", "text": "A client who was recently promoted at work"}, {"id": "e", "text": "A client who just completed their first marathon"}], "correct": ["a", "b", "c"], "explanation": "Self-esteem stressors include feeling irrelevant after retirement, loss of social support after a spouse's death, and loss of career. A promotion and completing a marathon are more likely to boost self-esteem."}, {"id": 233, "cat": "selfconcept", "type": "mc", "prompt": "A client tells the nurse, \"My manager wants me to work this Saturday, but that's my son's championship game and I promised him I'd be there.\" The nurse should recognize the client is experiencing which of the following?", "options": [{"id": "a", "text": "Role ambiguity"}, {"id": "b", "text": "Role conflict"}, {"id": "c", "text": "Role clarity"}, {"id": "d", "text": "Identity confusion"}], "correct": ["b"], "explanation": "Role conflict happens when two or more role expectations (employee and parent) can't be met at the same time. Role ambiguity is unclear expectations; role clarity reduces stress; identity confusion is an unclear sense of self."}, {"id": 234, "cat": "selfconcept", "type": "mc", "prompt": "A client says, \"I've always wanted to be a strong leader, but I never speak up in meetings at work. I feel like such a failure.\" Which concept should the nurse recognize?", "options": [{"id": "a", "text": "Self-concept congruence"}, {"id": "b", "text": "Self-concept incongruence"}, {"id": "c", "text": "Self-actualization"}, {"id": "d", "text": "High self-efficacy"}], "correct": ["b"], "explanation": "Incongruence occurs when the ideal self doesn't match actual life experiences, leading to negative feelings and uncertainty. Congruence and self-actualization require alignment."}, {"id": 235, "cat": "selfconcept", "type": "sata", "prompt": "A nurse is teaching a group of nursing students about ways to enhance self-awareness. Which strategies should the nurse include? Select all that apply.", "options": [{"id": "a", "text": "Keep a reflection journal."}, {"id": "b", "text": "Ask peers and instructors for feedback."}, {"id": "c", "text": "Complete self-assessments."}, {"id": "d", "text": "Avoid considering other people's points of view."}, {"id": "e", "text": "Practice listening carefully to understand others."}], "correct": ["a", "b", "c", "e"], "explanation": "Journaling, asking for feedback, self-assessments, and careful listening all build self-awareness. Seeking to understand other points of view is also recommended because it helps a person see situations the way others do."}, {"id": 236, "cat": "selfconcept", "type": "mc", "prompt": "A client who recently lost their job tells the nurse, \"I feel worthless.\" Which question should the nurse ask to assess the client's self-esteem?", "options": [{"id": "a", "text": "\"What words might others use to describe you?\""}, {"id": "b", "text": "\"What are some accomplishments or qualities that make you feel good about yourself?\""}, {"id": "c", "text": "\"How would you describe your physical appearance?\""}, {"id": "d", "text": "\"What kind of support do you have to fulfill your roles?\""}], "correct": ["b"], "explanation": "Asking about accomplishments and qualities assesses self-esteem. How others would describe the client assesses identity, physical appearance assesses body image, and support for roles assesses role performance."}, {"id": 237, "cat": "selfconcept", "type": "mc", "prompt": "A nurse is caring for a client from a cultural background different from the nurse's own. Which action shows the nurse understands culture's influence on self-concept?", "options": [{"id": "a", "text": "Assume the client shares the same beliefs as others from their ethnic group."}, {"id": "b", "text": "Ask the client about their personal cultural beliefs and practices."}, {"id": "c", "text": "Base the plan of care on common traits of the client's culture."}, {"id": "d", "text": "Encourage the client to adopt the values of the dominant culture."}], "correct": ["b"], "explanation": "Differences exist within cultures and even within families, so the nurse should ask about the client's own beliefs. Assuming shared beliefs or relying on general traits leads to stereotyping."}, {"id": 238, "cat": "selfconcept", "type": "mc", "prompt": "A client who recently divorced tells the nurse, \"I was married for 20 years. I don't even know who I am anymore.\" The nurse should recognize the client is experiencing which of the following?", "options": [{"id": "a", "text": "Identity confusion"}, {"id": "b", "text": "Role overload"}, {"id": "c", "text": "Body image disturbance"}, {"id": "d", "text": "Identity foreclosure"}], "correct": ["a"], "explanation": "Divorce is an identity stressor, and trouble adapting to it can cause identity confusion, an unclear sense of self. Role overload means too many demands; foreclosure is an identity status."}, {"id": 239, "cat": "selfconcept", "type": "sata", "prompt": "A nurse is preparing a class about factors that influence body image across the lifespan. Which statements should the nurse include? Select all that apply.", "options": [{"id": "a", "text": "Hormonal changes during puberty can affect body image."}, {"id": "b", "text": "Weight stigma can negatively affect a person's self-concept."}, {"id": "c", "text": "Age-related loss of muscle and bone mass can cause older adults to reevaluate their body image."}, {"id": "d", "text": "Body image becomes fixed once a person reaches adulthood."}, {"id": "e", "text": "Adults rarely experience body image changes unless they develop a chronic illness."}], "correct": ["a", "b", "c"], "explanation": "Body image changes throughout life with puberty, societal attitudes like weight stigma, and aging. It is never fixed, and adults can experience changes from normal aging, not only from illness."}, {"id": 240, "cat": "selfconcept", "type": "mc", "prompt": "A nurse is caring for a client who has low self-esteem after a stroke left them with right-sided weakness. Which intervention should the nurse implement?", "options": [{"id": "a", "text": "Help the client identify past accomplishments and strengths."}, {"id": "b", "text": "Discourage the client from talking about the losses they've experienced."}, {"id": "c", "text": "Tell the client, \"Don't worry, you'll be back to normal in no time.\""}, {"id": "d", "text": "Make daily care decisions for the client to reduce their stress."}], "correct": ["a"], "explanation": "Identifying past and current accomplishments promotes a positive self-concept. Discouraging expression of feelings blocks coping, false reassurance is nontherapeutic, and making decisions for the client promotes dependence."}, {"id": 241, "cat": "selfconcept", "type": "mc", "prompt": "A 22-year-old client tells the nurse, \"I shadowed a nurse, a respiratory therapist, and a physical therapist before choosing nursing. I just enrolled in my first nursing course.\" Which identity status should the nurse recognize?", "options": [{"id": "a", "text": "Identity achievement"}, {"id": "b", "text": "Moratorium"}, {"id": "c", "text": "Foreclosure"}, {"id": "d", "text": "Identity diffusion"}], "correct": ["a"], "explanation": "Identity achievement is exploring alternatives and then committing. Moratorium lacks commitment, foreclosure lacks exploration, and diffusion lacks both."}, {"id": 242, "cat": "selfconcept", "type": "mc", "prompt": "A 20-year-old client spends most days playing online games and says, \"I don't really care what I do with my life. I'll figure it out eventually.\" Which identity status should the nurse recognize?", "options": [{"id": "a", "text": "Identity achievement"}, {"id": "b", "text": "Moratorium"}, {"id": "c", "text": "Foreclosure"}, {"id": "d", "text": "Identity diffusion"}], "correct": ["d"], "explanation": "Identity diffusion is a lack of both exploration and commitment; the person drifts without purpose or direction. Moratorium involves active exploration, often with anxiety."}, {"id": 243, "cat": "selfconcept", "type": "mc", "prompt": "A nurse is teaching a group of parents about identity formation. Which statement by a parent indicates an understanding of the teaching?", "options": [{"id": "a", "text": "\"My teen's identity will be set by the time they turn 18.\""}, {"id": "b", "text": "\"Identity keeps developing throughout adulthood, but it's most intense during adolescence.\""}, {"id": "c", "text": "\"If my teen tries out different identities, it means something is wrong.\""}, {"id": "d", "text": "\"Identity formation is mostly finished by early childhood.\""}], "correct": ["b"], "explanation": "Identity formation is lifelong, but it is most intense during adolescence. Trying out different roles and identities is an expected part of adolescent development."}, {"id": 244, "cat": "selfconcept", "type": "mc", "prompt": "A newly hired nurse tells a coworker, \"Nobody has explained what I'm responsible for on this unit, and I'm not sure what's expected of me.\" Which role stressor is the nurse experiencing?", "options": [{"id": "a", "text": "Role conflict"}, {"id": "b", "text": "Role ambiguity"}, {"id": "c", "text": "Role overload"}, {"id": "d", "text": "Role satisfaction"}], "correct": ["b"], "explanation": "Role ambiguity is a lack of clarity about what is expected, which leads to doubt and lower commitment. Role conflict is competing expectations, and role overload is too many demands."}, {"id": 245, "cat": "selfconcept", "type": "mc", "prompt": "A client caring for a spouse who has advanced Parkinson's disease tells the nurse, \"I can't keep up with all of his care needs. I feel like I'm failing as his caregiver.\" The nurse should recognize the client is experiencing which of the following?", "options": [{"id": "a", "text": "Role strain"}, {"id": "b", "text": "Role clarity"}, {"id": "c", "text": "Role enhancement"}, {"id": "d", "text": "Identity foreclosure"}], "correct": ["a"], "explanation": "Role strain is difficulty meeting the responsibilities of a particular life role. Role clarity and role enhancement reduce stress, and foreclosure is an identity status."}, {"id": 246, "cat": "selfconcept", "type": "sata", "prompt": "A nurse is assessing a client who reports stress related to their various life roles. Which role performance stressors should the nurse consider? Select all that apply.", "options": [{"id": "a", "text": "Role conflict"}, {"id": "b", "text": "Role overload"}, {"id": "c", "text": "Role ambiguity"}, {"id": "d", "text": "Role satisfaction"}, {"id": "e", "text": "Role enhancement"}], "correct": ["a", "b", "c"], "explanation": "Role conflict, role overload, and role ambiguity are role performance stressors. Role satisfaction and role enhancement are positive effects of fulfilling roles and do not cause stress."}, {"id": 247, "cat": "selfconcept", "type": "mc", "prompt": "An adolescent client tells the nurse they feel distressed because their gender identity does not match the sex they were assigned at birth. The nurse should recognize this as which of the following?", "options": [{"id": "a", "text": "Gender dysphoria"}, {"id": "b", "text": "Identity diffusion"}, {"id": "c", "text": "Role ambiguity"}, {"id": "d", "text": "Self-concept congruence"}], "correct": ["a"], "explanation": "Gender dysphoria is a feeling of incongruity between one's gender identity and assigned sex at birth, and it is an identity stressor that can threaten self-concept."}, {"id": 248, "cat": "selfconcept", "type": "mc", "prompt": "A nurse is assessing a client who has psoriasis on the face and arms. Which question should the nurse ask to assess the client's body image?", "options": [{"id": "a", "text": "\"How comfortable are you expressing your opinions?\""}, {"id": "b", "text": "\"Which aspects of your physical appearance do you like and appreciate?\""}, {"id": "c", "text": "\"How would others describe you?\""}, {"id": "d", "text": "\"How do you cope when your roles conflict?\""}], "correct": ["b"], "explanation": "Questions about physical appearance assess body image. Expressing opinions assesses self-esteem, how others describe the client assesses identity, and coping with conflicting roles assesses role performance."}, {"id": 249, "cat": "selfconcept", "type": "mc", "prompt": "A nurse is completing a self-concept assessment. Which question should the nurse ask to assess the client's identity?", "options": [{"id": "a", "text": "\"How is your identity influenced by others or by society?\""}, {"id": "b", "text": "\"How important is it to always look your best?\""}, {"id": "c", "text": "\"How much do you worry about what others think of you?\""}, {"id": "d", "text": "\"Describe two or three of your primary roles.\""}], "correct": ["a"], "explanation": "Asking how identity is influenced by others or society assesses identity. Looking your best assesses body image, worrying about others' opinions assesses self-esteem, and primary roles assess role performance."}, {"id": 250, "cat": "selfconcept", "type": "mc", "prompt": "A nurse is caring for several clients who recently had a colostomy placed. Which client requires further assessment for negative self-esteem related to body image?", "options": [{"id": "a", "text": "A client who asks about local ostomy support groups"}, {"id": "b", "text": "A client who refuses to look at the stoma and asks family not to visit"}, {"id": "c", "text": "A client who asks for help choosing clothing that fits over the pouch"}, {"id": "d", "text": "A client who practices changing the pouch with the nurse"}], "correct": ["b"], "explanation": "Refusing to look at the stoma and withdrawing from family suggest negative self-esteem related to body image. The other clients are coping by seeking support and learning self-care."}, {"id": 251, "cat": "selfconcept", "type": "sata", "prompt": "A nurse is planning interventions to improve self-efficacy for a client after a percutaneous coronary intervention. Which interventions should the nurse include? Select all that apply.", "options": [{"id": "a", "text": "Provide ongoing education."}, {"id": "b", "text": "Offer emotional support."}, {"id": "c", "text": "Involve the client's family in care."}, {"id": "d", "text": "Encourage participation in group activities."}, {"id": "e", "text": "Discourage the client from asking questions about their recovery."}], "correct": ["a", "b", "c", "d"], "explanation": "Self-efficacy interventions include ongoing education, emotional support, family involvement, and group activities to build competence and social support. Discouraging questions would undermine the client's confidence and learning."}, {"id": 252, "cat": "selfconcept", "type": "mc", "prompt": "A client tells the nurse, \"I'm a very patient person.\" The client's family later describes the client as short-tempered. The nurse should recognize this reflects which component of self-concept?", "options": [{"id": "a", "text": "Self-image"}, {"id": "b", "text": "Ideal self"}, {"id": "c", "text": "Self-efficacy"}, {"id": "d", "text": "Role performance"}], "correct": ["a"], "explanation": "Self-image is how a person views their own qualities, and it may not be consistent with reality or with how others see them."}, {"id": 253, "cat": "selfconcept", "type": "mc", "prompt": "A nursing student says, \"Someday I want to be a respected, dependable nurse that clients trust.\" This statement reflects which component of self-concept?", "options": [{"id": "a", "text": "Self-image"}, {"id": "b", "text": "Self-esteem"}, {"id": "c", "text": "Ideal self"}, {"id": "d", "text": "Identity confusion"}], "correct": ["c"], "explanation": "The ideal self is what a person desires to be, such as strong, intelligent, respected, and appreciated."}, {"id": 254, "cat": "selfconcept", "type": "mc", "prompt": "A nurse is caring for a client the night before surgery. Which action by the nurse best demonstrates the emotional intelligence domain of empathy?", "options": [{"id": "a", "text": "The nurse recognizes the client's fear and adjusts their approach to address the client's concerns."}, {"id": "b", "text": "The nurse stays calm when the surgical schedule changes unexpectedly."}, {"id": "c", "text": "The nurse sets a goal to become certified in perioperative nursing."}, {"id": "d", "text": "The nurse reflects on their own strengths and weaknesses after the shift."}], "correct": ["a"], "explanation": "Empathy is understanding others' emotions, needs, and concerns and using that knowledge to guide behavior. Staying calm is self-regulation, setting career goals is motivation, and reflecting on strengths is self-awareness."}, {"id": 255, "cat": "selfconcept", "type": "mc", "prompt": "A nurse observes that a client appears disheveled, is tearful, and repeatedly says, \"I'm sorry for being such a burden.\" Which action should the nurse take first?", "options": [{"id": "a", "text": "Refer the client to a support group."}, {"id": "b", "text": "Use open-ended questions to explore the client's feelings."}, {"id": "c", "text": "Tell the client there is no need to apologize."}, {"id": "d", "text": "Assist the client with hygiene and grooming."}], "correct": ["b"], "explanation": "Assessment comes first. These behaviors may indicate an altered self-concept, so the nurse should use therapeutic communication to explore the client's feelings before planning interventions. Telling the client not to apologize dismisses their feelings."}, {"id": 256, "cat": "selfconcept", "type": "mc", "prompt": "A nurse is assessing an adolescent client who has a distorted body image related to pressure to be thin. Which action should the nurse take?", "options": [{"id": "a", "text": "Tell the client their weight is normal and there's nothing to worry about."}, {"id": "b", "text": "Focus the assessment only on the client's height and weight."}, {"id": "c", "text": "Involve significant others to gain insight into how the client is perceived by others."}, {"id": "d", "text": "Avoid discussing messages the client receives from friends and social media."}], "correct": ["c"], "explanation": "Involving significant others during assessment helps the nurse understand how the client is perceived by others. The nurse should also explore the impact of messages from family, friends, and media. False reassurance and a purely physical focus are not therapeutic."}, {"id": 257, "cat": "selfconcept", "type": "sata", "prompt": "A nurse is evalua
