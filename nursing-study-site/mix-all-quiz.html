text": "Physically guide the client to the shower against their wishes"}], "correct": ["a"], "explanation": "For clients with dementia, adapting the timing and method of bathing \u2014 such as bathing on the commode after a bowel movement, when the client is calmer \u2014 supports dignity and cooperation rather than forcing care during agitation."}, {"id": 139, "cat": "hygiene", "type": "mc", "prompt": "A nurse is teaching a client who has a visual impairment how to shave safely. Which instruction should the nurse include first?", "options": [{"id": "a", "text": "Explore the facial contours with the fingers before beginning"}, {"id": "b", "text": "Begin shaving immediately using long strokes"}, {"id": "c", "text": "Use a razor with the blade exposed while practicing"}, {"id": "d", "text": "Ask a family member to perform the shaving instead"}], "correct": ["a"], "explanation": "The client should first explore their facial contours to identify areas needing shaving, then practice with the razor turned off before shaving, to build safety and confidence."}, {"id": 140, "cat": "hygiene", "type": "mc", "prompt": "A nurse is teaching a caregiver about hygiene care for a client who has had an arm amputation. Which statement by the caregiver indicates understanding?", "options": [{"id": "a", "text": "I'll place a bath seat in the shower and add a grab bar for support."}, {"id": "b", "text": "I'll avoid using any adaptive devices to encourage full independence right away."}, {"id": "c", "text": "I'll discourage the use of a battery-powered toothbrush."}, {"id": "d", "text": "I'll remove all anti-slip mats from the bathroom floor."}], "correct": ["a"], "explanation": "A bath seat and grab bars support safe transfers and bathing for a client adjusting to limb loss; adaptive devices like battery-powered toothbrushes and anti-slip mats also help maintain safety and independence."}, {"id": 141, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is educating a client with a new stoma. The client watches the nurse change the pouch for the first time. Which stage of the psychomotor domain is the client demonstrating?", "options": [{"id": "a", "text": "Perception"}, {"id": "b", "text": "Mechanism"}, {"id": "c", "text": "Adaptation"}, {"id": "d", "text": "Origination"}], "correct": ["a"], "explanation": "Perception is the first psychomotor stage \u2014 the client observes the nurse performing the skill before attempting it themselves."}, {"id": 142, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is teaching a client about their new diagnosis. The client says, 'I understand I have diabetes, but I'm still upset about needing daily injections.' Which domain of learning is this statement primarily reflecting?", "options": [{"id": "a", "text": "Affective"}, {"id": "b", "text": "Cognitive"}, {"id": "c", "text": "Psychomotor"}, {"id": "d", "text": "Sensory"}], "correct": ["a"], "explanation": "The affective domain involves feelings, values, and beliefs \u2014 the client's emotional reaction to the diagnosis reflects this domain, separate from factual knowledge (cognitive) or hands-on skill (psychomotor)."}, {"id": 143, "cat": "clienteducation", "type": "sata", "prompt": "A nurse is planning teaching strategies based on the psychomotor domain. Which strategies should the nurse include?", "options": [{"id": "a", "text": "Demonstration"}, {"id": "b", "text": "Lecture"}, {"id": "c", "text": "Return demonstration"}, {"id": "d", "text": "Question-and-answer"}, {"id": "e", "text": "Games"}], "correct": ["a", "c", "e"], "explanation": "Demonstration, return demonstration, and games are psychomotor domain strategies. Lecture and question-and-answer belong to the cognitive domain."}, {"id": 144, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is evaluating whether a client has achieved cognitive learning about hypoglycemia. Which finding best demonstrates this?", "options": [{"id": "a", "text": "The client verbalizes the signs of hypoglycemia and when to call the provider"}, {"id": "b", "text": "The client demonstrates checking their own blood sugar"}, {"id": "c", "text": "The client expresses feelings about their diagnosis"}, {"id": "d", "text": "The client asks no questions during teaching"}], "correct": ["a"], "explanation": "Verbalizing knowledge (recall and comprehension) demonstrates cognitive learning; performing a skill demonstrates psychomotor learning, and expressing feelings demonstrates affective learning."}, {"id": 145, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is teaching a client with a new colostomy and wants to address the affective domain. Which action should the nurse take?", "options": [{"id": "a", "text": "Encourage the client to discuss their feelings about the change in body image"}, {"id": "b", "text": "Have the client recite the steps to change the pouch"}, {"id": "c", "text": "Ask the client to demonstrate emptying the pouch"}, {"id": "d", "text": "Provide a written pamphlet on colostomy care"}], "correct": ["a"], "explanation": "Addressing feelings, values, and beliefs \u2014 such as body image concerns \u2014 engages the affective domain of learning."}, {"id": 146, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is teaching a nursing student about the cognitive domain. Which statement by the student indicates understanding?", "options": [{"id": "a", "text": "The cognitive domain includes stages like knowledge, comprehension, and application."}, {"id": "b", "text": "The cognitive domain is only about physical skills."}, {"id": "c", "text": "The cognitive domain focuses on a client's emotions."}, {"id": "d", "text": "The cognitive domain has no measurable stages."}], "correct": ["a"], "explanation": "The cognitive domain (the 'thinking domain') has 6 stages: knowledge, comprehension, application, analysis, synthesis, and evaluation."}, {"id": 147, "cat": "clienteducation", "type": "mc", "prompt": "A client who has a new ostomy now changes the pouch consistently without error, and it has become part of their daily routine. Which psychomotor stage does this represent?", "options": [{"id": "a", "text": "Origination"}, {"id": "b", "text": "Perception"}, {"id": "c", "text": "Guided response"}, {"id": "d", "text": "Set"}], "correct": ["a"], "explanation": "Origination (naturalization) is the final psychomotor stage, where the skill becomes part of the client's normal routine."}, {"id": 148, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is teaching a client who states, 'I don't see why I need to learn this.' Which Knowles principle should the nurse address first?", "options": [{"id": "a", "text": "Relevance/need to know"}, {"id": "b", "text": "Self-directed"}, {"id": "c", "text": "Life experience"}, {"id": "d", "text": "Task-centered"}], "correct": ["a"], "explanation": "The client's statement reflects a lack of understanding of why the information matters to them \u2014 the nurse should first address the relevance/need-to-know principle before proceeding with teaching."}, {"id": 149, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is applying Knowles's principle of readiness when planning teaching for a client. Which statement should guide the nurse's approach?", "options": [{"id": "a", "text": "I should assess whether the client is willing and able to actively engage before teaching."}, {"id": "b", "text": "I should teach regardless of the client's current emotional state."}, {"id": "c", "text": "Readiness only applies to pediatric clients."}, {"id": "d", "text": "Readiness means the client has already mastered the material."}], "correct": ["a"], "explanation": "Readiness means the client is willing, able, and can actively engage in learning \u2014 the nurse should assess this before beginning teaching."}, {"id": 150, "cat": "clienteducation", "type": "mc", "prompt": "A client says, 'I've managed my father's diabetes for years, so I think I can handle learning to manage my own.' Which Knowles principle does this statement reflect?", "options": [{"id": "a", "text": "Life experience"}, {"id": "b", "text": "Readiness"}, {"id": "c", "text": "Relevance"}, {"id": "d", "text": "Motivation"}], "correct": ["a"], "explanation": "The client is using past personal experience as a foundation for new learning, reflecting the life experience principle."}, {"id": 151, "cat": "clienteducation", "type": "mc", "prompt": "A client with newly diagnosed hypertension states they understand the risks of not taking their medication but still refuses to commit to the regimen. Which Knowles principle is most clearly unmet?", "options": [{"id": "a", "text": "Motivation"}, {"id": "b", "text": "Life experience"}, {"id": "c", "text": "Task-centered"}, {"id": "d", "text": "Relevance"}], "correct": ["a"], "explanation": "The client has the knowledge (relevance is understood) but lacks internal motivation, which must be present for real behavior change and learning to take place."}, {"id": 152, "cat": "clienteducation", "type": "sata", "prompt": "A nurse is applying Knowles's adult learning principles when developing a teaching plan. Which actions reflect these principles?", "options": [{"id": "a", "text": "Explaining why the information is relevant to the client's specific situation"}, {"id": "b", "text": "Ignoring the client's past experiences with similar health conditions"}, {"id": "c", "text": "Allowing the client to make informed decisions about their own care"}, {"id": "d", "text": "Presenting information only as material to memorize"}, {"id": "e", "text": "Linking teaching to the client's real-life tasks and problems"}], "correct": ["a", "c", "e"], "explanation": "Explaining relevance, supporting self-directed decision-making, and using task-centered teaching all reflect Knowles's principles. Ignoring past experience and rote memorization go against adult learning theory."}, {"id": 153, "cat": "clienteducation", "type": "mc", "prompt": "A nursing student explains self-directed learning to a classmate. Which statement indicates understanding?", "options": [{"id": "a", "text": "Self-directed clients take responsibility for their choices and have control over their learning."}, {"id": "b", "text": "Self-directed learning means the nurse makes all the decisions."}, {"id": "c", "text": "Self-directed learning applies only to children."}, {"id": "d", "text": "Self-directed clients require no assessment before teaching."}], "correct": ["a"], "explanation": "Self-directed clients participate in their own learning and accept responsibility for their choices and consequences."}, {"id": 154, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is beginning to develop a teaching plan for a client newly diagnosed with diabetes. Which action should the nurse take first?", "options": [{"id": "a", "text": "Assess the client's learning needs, readiness, and health literacy"}, {"id": "b", "text": "Develop a written pamphlet on insulin administration"}, {"id": "c", "text": "Ask the client to return-demonstrate a glucose check"}, {"id": "d", "text": "Document that teaching was completed"}], "correct": ["a"], "explanation": "Assessment \u2014 gathering data on learning needs, readiness, and health literacy \u2014 is the first step of the teaching process before planning or implementing teaching."}, {"id": 155, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is writing a SMART outcome goal for a client learning to self-administer insulin. Which goal best meets SMART criteria?", "options": [{"id": "a", "text": "Client will independently draw up and administer insulin correctly by the time of discharge."}, {"id": "b", "text": "Client will feel more comfortable with insulin."}, {"id": "c", "text": "Client will learn about insulin eventually."}, {"id": "d", "text": "Client will understand diabetes management."}], "correct": ["a"], "explanation": "This goal is specific, measurable, achievable, relevant, and timed (by discharge), meeting all SMART criteria. The other options are vague and not measurable or time-bound."}, {"id": 156, "cat": "clienteducation", "type": "mc", "prompt": "A nurse asks a client to explain, in their own words, the signs of low blood sugar. Which element of the teaching process is the nurse performing?", "options": [{"id": "a", "text": "Evaluation"}, {"id": "b", "text": "Assessment"}, {"id": "c", "text": "Planning"}, {"id": "d", "text": "Implementation"}], "correct": ["a"], "explanation": "Asking the client to explain material in their own words (teach-back) is a method of evaluation, determining whether the learning goal was met."}, {"id": 157, "cat": "clienteducation", "type": "mc", "prompt": "A client has not met the learning goal of independently checking their blood glucose after two teaching sessions. Which action should the nurse take next?", "options": [{"id": "a", "text": "Determine if the goal is realistic and consider new teaching strategies"}, {"id": "b", "text": "Document that the client is noncompliant and stop teaching"}, {"id": "c", "text": "Assume the client will never learn the skill"}, {"id": "d", "text": "Repeat the exact same teaching method a third time without changes"}], "correct": ["a"], "explanation": "If a learning goal is unmet, the nurse should evaluate whether the goal is realistic and whether new teaching methods, based on the client's learning style, are needed."}, {"id": 158, "cat": "clienteducation", "type": "sata", "prompt": "A nurse is implementing a teaching plan for a client learning to manage a new colostomy. Which strategies reflect a multimodal, multisensory approach?", "options": [{"id": "a", "text": "Providing verbal discussion of the steps"}, {"id": "b", "text": "Using only one static approach for every client"}, {"id": "c", "text": "Demonstrating the skill for the client"}, {"id": "d", "text": "Giving the client printed materials to review"}, {"id": "e", "text": "Offering a video resource"}], "correct": ["a", "c", "d", "e"], "explanation": "A multimodal approach combines verbal discussion, demonstration, printed materials, and videos, reinforced with teach-back, not a single static method repeated for every client."}, {"id": 159, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is teaching a nursing student about the difference between the teaching process and the nursing process. Which statement indicates understanding?", "options": [{"id": "a", "text": "The teaching process focuses on the client's learning needs, while the nursing process focuses on overall health care needs."}, {"id": "b", "text": "The teaching process and nursing process are identical in focus."}, {"id": "c", "text": "The nursing process only applies to physical care, never education."}, {"id": "d", "text": "The teaching process has no relationship to the nursing process."}], "correct": ["a"], "explanation": "Both processes share similar steps (assessment, planning, implementation, evaluation), but the teaching process specifically targets the client's learning needs, motivation, and ability to learn."}, {"id": 160, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is planning diabetes education for six newly diagnosed clients on the unit. Which teaching strategy is most appropriate for this group size?", "options": [{"id": "a", "text": "Group instruction, since six or fewer people is considered ideal for group teaching"}, {"id": "b", "text": "Individual instruction only, since groups are never appropriate"}, {"id": "c", "text": "Role play only"}, {"id": "d", "text": "Digital technology only, with no other methods"}], "correct": ["a"], "explanation": "Group instruction is often most effective with six people or fewer, which fits this group size for shared teaching such as a diabetes education session."}, {"id": 161, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is using teach-back with a client after providing wound care instructions. Which statement should the nurse use?", "options": [{"id": "a", "text": "Can you tell me, in your own words, how you'll care for this wound at home?"}, {"id": "b", "text": "Do you understand everything I just said?"}, {"id": "c", "text": "I'll just repeat the instructions one more time."}, {"id": "d", "text": "You don't need to explain it back to me."}], "correct": ["a"], "explanation": "Teach-back involves asking the client to explain the information in their own words, which allows the nurse to evaluate true understanding rather than a simple yes/no response."}, {"id": 162, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is teaching a client about the benefits of digital resources for learning about their new medication. Which statement by the client indicates understanding?", "options": [{"id": "a", "text": "Using an app alongside your teaching can help reinforce what I've learned."}, {"id": "b", "text": "Digital tools should completely replace talking with my nurse."}, {"id": "c", "text": "Digital resources are never reliable for health information."}, {"id": "d", "text": "I don't need any other teaching method if I use an app."}], "correct": ["a"], "explanation": "Digital technology is most effective when combined with traditional teaching strategies, not used as a complete replacement."}, {"id": 163, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is choosing a teaching strategy for a client who has significant social anxiety and is uncomfortable in groups. Which approach should the nurse prioritize?", "options": [{"id": "a", "text": "Individual instruction"}, {"id": "b", "text": "A large group class"}, {"id": "c", "text": "A support group setting"}, {"id": "d", "text": "A public health seminar"}], "correct": ["a"], "explanation": "Group settings do not work well for all clients, especially when emotional barriers like social anxiety are present; individual instruction is more appropriate here."}, {"id": 164, "cat": "clienteducation", "type": "sata", "prompt": "A nurse is identifying examples of group instruction. Which examples should the nurse include?", "options": [{"id": "a", "text": "A childbirth education class"}, {"id": "b", "text": "One-on-one teaching at the bedside"}, {"id": "c", "text": "A diabetes education clinic with multiple attendees"}, {"id": "d", "text": "A support group session"}, {"id": "e", "text": "Education during an individual outpatient clinic visit"}], "correct": ["a", "c", "d"], "explanation": "Childbirth classes, diabetes education clinics, and support groups are all group instruction examples. Bedside and individual clinic visit teaching are individual instruction."}, {"id": 165, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is preparing to teach a client and notices the client appears to be in pain. Which action should the nurse take first?", "options": [{"id": "a", "text": "Address the client's pain before beginning the teaching session"}, {"id": "b", "text": "Proceed with teaching as scheduled regardless of pain"}, {"id": "c", "text": "Postpone teaching indefinitely without further assessment"}, {"id": "d", "text": "Ask a family member to receive the teaching instead"}], "correct": ["a"], "explanation": "Physical discomfort is a barrier to learning; addressing pain first helps create conditions where the client can actually engage with and retain the teaching."}, {"id": 166, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is applying the AHRQ Health Literacy Universal Precautions when teaching all clients. Which approach should the nurse use?", "options": [{"id": "a", "text": "Treat every client as if they may have difficulty understanding health information, using plain language"}, {"id": "b", "text": "Assume only clients with a low education level need simplified language"}, {"id": "c", "text": "Use medical terminology to ensure accuracy"}, {"id": "d", "text": "Avoid checking for understanding unless the client asks questions"}], "correct": ["a"], "explanation": "The Universal Precautions approach means treating all clients as potentially having limited health literacy, using plain language and confirming understanding regardless of assumptions about education level."}, {"id": 167, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is teaching a client about factors that support learning. Which statement by the client reflects understanding of a low-stimulus environment?", "options": [{"id": "a", "text": "A quiet room with good lighting and a comfortable temperature will help me focus during teaching."}, {"id": "b", "text": "Learning works best with background noise and distractions."}, {"id": "c", "text": "The room temperature doesn't affect my ability to learn."}, {"id": "d", "text": "I learn better in a crowded, busy area."}], "correct": ["a"], "explanation": "A low-stimulus environment \u2014 quiet, well-lit, comfortable temperature, minimal distractions \u2014 supports better learning outcomes."}, {"id": 168, "cat": "clienteducation", "type": "sata", "prompt": "A nurse is assessing a client for barriers to learning before a teaching session. Which findings should the nurse identify as potential barriers?", "options": [{"id": "a", "text": "The client reports high anxiety about their diagnosis"}, {"id": "b", "text": "The client has a strong support system"}, {"id": "c", "text": "The client has a hearing impairment"}, {"id": "d", "text": "The client reports significant pain"}, {"id": "e", "text": "The client is fluent in the nurse's primary language"}], "correct": ["a", "c", "d"], "explanation": "Anxiety, hearing impairment, and pain are all recognized barriers to learning. A strong support system and shared language are facilitators, not barriers."}, {"id": 169, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is distinguishing fine motor skills from gross motor skills while planning teaching for a client with reduced hand dexterity. Which task would be most affected?", "options": [{"id": "a", "text": "Buttoning a shirt"}, {"id": "b", "text": "Walking across the room"}, {"id": "c", "text": "Performing range-of-motion exercises"}, {"id": "d", "text": "Self-propelling a wheelchair"}], "correct": ["a"], "explanation": "Buttoning a shirt is a fine motor skill requiring dexterity of small muscles, which would be most affected by reduced hand dexterity. The others are gross motor skills."}, {"id": 170, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is teaching about self-bias. Which statement by a new nurse indicates understanding?", "options": [{"id": "a", "text": "I should reflect on my own thoughts and feelings before caring for clients from backgrounds different from mine."}, {"id": "b", "text": "Self-bias doesn't affect the quality of care I provide."}, {"id": "c", "text": "I don't need to consider my own perceptions when teaching clients."}, {"id": "d", "text": "Self-bias only applies to clients, not nurses."}], "correct": ["a"], "explanation": "Reflecting on personal thoughts and feelings helps nurses identify and reduce self-bias before interacting with clients from diverse backgrounds."}, {"id": 171, "cat": "clienteducation", "type": "mc", "prompt": "A nurse provides feedback to a client during a return demonstration of blood pressure self-monitoring. Which purpose does this feedback serve?", "options": [{"id": "a", "text": "It helps the nurse evaluate the client's understanding and identify if more guidance is needed"}, {"id": "b", "text": "It replaces the need for further teaching sessions"}, {"id": "c", "text": "It is only useful after teaching is fully completed"}, {"id": "d", "text": "It has no impact on the client's learning"}], "correct": ["a"], "explanation": "Feedback given during and after teaching helps the nurse assess the client's understanding and determine whether additional guidance is needed."}, {"id": 172, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is planning to teach a 2-year-old client about an upcoming procedure. Which approach should the nurse prioritize?", "options": [{"id": "a", "text": "Direct the teaching primarily toward the caregivers, using brief sessions near the time of the event"}, {"id": "b", "text": "Provide a detailed lecture directly to the toddler"}, {"id": "c", "text": "Give the toddler written material to read independently"}, {"id": "d", "text": "Wait until the day after the procedure to provide any teaching"}], "correct": ["a"], "explanation": "For infants and toddlers, teaching is directed primarily toward caregivers, with brief sessions timed close to the event due to the child's limited attention span."}, {"id": 173, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is teaching a school-age child about an upcoming procedure. Which strategy should the nurse use?", "options": [{"id": "a", "text": "Use games, role-play, and storytelling appropriate for logical reasoning at this age"}, {"id": "b", "text": "Rely solely on complex medical terminology"}, {"id": "c", "text": "Direct all teaching exclusively to the parents and exclude the child"}, {"id": "d", "text": "Use only written pamphlets with no interactive elements"}], "correct": ["a"], "explanation": "School-age children are capable of logical reasoning, so games, role-play, artwork, and storytelling are appropriate, engaging teaching strategies for this age group."}, {"id": 174, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is teaching an adolescent client about managing a new diagnosis. Which statement by the nurse reflects best practice for this age group?", "options": [{"id": "a", "text": "Let's talk about how you can manage this \u2014 I'll answer any questions you have."}, {"id": "b", "text": "I'll only speak with your parents about your care."}, {"id": "c", "text": "I'll lecture you about all the things you're doing wrong."}, {"id": "d", "text": "Your privacy isn't a priority during this teaching."}], "correct": ["a"], "explanation": "Teaching for adolescents should focus on the adolescent as the primary learner, use guidance rather than lecturing, and protect their modesty and privacy."}, {"id": 175, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is teaching an 80-year-old client with mild hearing and vision decline. Which approach should the nurse prioritize?", "options": [{"id": "a", "text": "Reduce distractions, speak in a low tone, and present information in smaller segments"}, {"id": "b", "text": "Speak quickly to cover all material in one session"}, {"id": "c", "text": "Present all information at once in a single large block"}, {"id": "d", "text": "Avoid repeating any information during teaching"}], "correct": ["a"], "explanation": "Older adults may process new information more slowly; reducing distractions, speaking clearly, allowing more time, and breaking information into smaller segments supports learning."}, {"id": 176, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is preparing to teach a client whose primary language differs from the nurse's. Which action should the nurse take?", "options": [{"id": "a", "text": "Arrange for a certified medical interpreter"}, {"id": "b", "text": "Ask the client's adult child to interpret"}, {"id": "c", "text": "Use only written English materials"}, {"id": "d", "text": "Proceed with teaching in English without any interpretation"}], "correct": ["a"], "explanation": "A certified medical interpreter should always be used rather than a family member, to ensure accuracy and protect client confidentiality."}, {"id": 177, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is teaching about cultural considerations in client education. Which statement by a nursing student indicates understanding?", "options": [{"id": "a", "text": "I should ask about the client's beliefs and preferences rather than assume based on their culture."}, {"id": "b", "text": "All clients from the same culture have identical health beliefs."}, {"id": "c", "text": "Cultural beliefs have no impact on how clients respond to teaching."}, {"id": "d", "text": "I should apply the same generalized approach to every client regardless of background."}], "correct": ["a"], "explanation": "Nurses should assess each client's individual beliefs, customs, and values rather than generalizing based on culture, to avoid stereotyping and provide individualized, culturally sensitive education."}, {"id": 178, "cat": "clienteducation", "type": "sata", "prompt": "A nurse is preparing to teach a preschool-age client about an upcoming procedure. Which strategies should the nurse include?", "options": [{"id": "a", "text": "Use of play and sensory experiences"}, {"id": "b", "text": "Detailed written material for the child to read independently"}, {"id": "c", "text": "Allowing the child to express fears openly"}, {"id": "d", "text": "Involving the caregiver in the teaching process"}, {"id": "e", "text": "Using complex medical terminology"}], "correct": ["a", "c", "d"], "explanation": "Preschoolers benefit from play and sensory experiences, being allowed to express fears, and caregiver involvement. They cannot read independently and should not be taught with complex medical terminology."}, {"id": 179, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is evaluating a client's readiness to learn about a new medication regimen. Which client statement indicates readiness to learn?", "options": [{"id": "a", "text": "Can you show me how to take this new medication safely?"}, {"id": "b", "text": "I really don't want to think about this right now."}, {"id": "c", "text": "I can't remember anything the doctor told me."}, {"id": "d", "text": "I'll worry about that after I feel better."}], "correct": ["a"], "explanation": "A client actively requesting information and engaging with the material demonstrates readiness to learn, in contrast to statements reflecting avoidance or disengagement."}, {"id": 180, "cat": "clienteducation", "type": "mc", "prompt": "A nurse is deciding between group and individual instruction for a client recovering from a highly stigmatized diagnosis who expresses discomfort discussing it in front of others. Which strategy should the nurse choose?", "options": [{"id": "a", "text": "Individual instruction"}, {"id": "b", "text": "A large support group"}, {"id": "c", "text": "A public health class"}, {"id": "d", "text": "A group session with unfamiliar peers"}], "correct": ["a"], "explanation": "When a client expresses discomfort or an emotional barrier to group settings, individual instruction is the more appropriate strategy."}];
