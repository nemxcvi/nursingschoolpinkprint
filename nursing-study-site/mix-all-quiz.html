<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mix all &mdash; Nursing School Pinkprint</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<link rel="stylesheet" href="assets/style.css?v=5">
<script>(function(){var s=localStorage.getItem("theme");if(s==="dark")document.documentElement.setAttribute("data-theme","dark");})();</script>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="backlink" href="./"><i class="ti ti-arrow-left" aria-hidden="true"></i> Home</a>
    <button class="iconbtn" onclick="toggleTheme()" aria-label="Toggle dark mode">
        <i id="themeicon" class="ti ti-moon" aria-hidden="true"></i>
      </button>
  </div>
  <h2 style="margin-bottom:2px;">Mix all</h2>
  <p class="muted" style="margin-bottom:18px;">Random from every quiz on the site</p>

  <div id="pq-mode-screen">
    <p class="muted" style="margin-bottom:14px;">Choose how you want to practice.</p>
    <div>
      <button class="pq-mode-btn" data-mode="single">
        <div class="pq-mode-title">One session</div>
        <div class="pq-mode-sub">Answer a set of questions once, then see your results.</div>
      </button>
      <button class="pq-mode-btn" data-mode="rounds">
        <div class="pq-mode-title">Mastery rounds</div>
        <div class="pq-mode-sub">Practice in rounds until you clear the whole pool, then see your stats.</div>
      </button>
    </div>
  </div>

  <div id="pq-count-screen" class="hidden">
    <p class="muted" style="margin-bottom:14px;">How many questions?</p>
    <div id="pq-count-single" class="pq-count-grid hidden">
      
      <button class="pq-count-btn" data-count="5">5</button>
      <button class="pq-count-btn" data-count="10">10</button>
      <button class="pq-count-btn" data-count="15">15</button>
      <button class="pq-count-btn" data-count="20">20</button>
      <button class="pq-count-btn" data-count="25">25</button>
      <button class="pq-count-btn" data-count="30">30</button>
      <button class="pq-count-btn" data-count="35">35</button>
      <button class="pq-count-btn" data-count="40">40</button>
    
    </div>
    <div id="pq-count-rounds" class="pq-count-grid hidden">
      
      <button class="pq-count-btn" data-count="10">10</button>
      <button class="pq-count-btn" data-count="20">20</button>
      <button class="pq-count-btn" data-count="30">30</button>
      <button class="pq-count-btn" data-count="40">40</button>
    
    </div>
    <button class="btn small" id="pq-back"><i class="ti ti-arrow-left" aria-hidden="true"></i> back</button>
  </div>

  <div id="pq-quiz-screen" class="hidden">
    <div class="pq-top-row"><span id="pq-progress"></span><span id="pq-score"></span></div>
    <div class="pq-progress-track"><div id="pq-progress-bar" class="pq-progress-fill"></div></div>
    <div id="pq-type-label" class="pq-type-label"></div>
    <div id="pq-prompt" class="pq-prompt"></div>
    <div id="pq-options"></div>
    <p id="pq-error" class="pq-error">select at least one answer</p>
    <div id="pq-feedback" class="pq-feedback"></div>
    <div class="pq-btn-row">
      <button class="btn" id="pq-submit">check answer</button>
      <button class="btn hidden" id="pq-next">next question &#8594;</button>
    </div>
    <button class="btn small" id="pq-end-test" style="margin-top:8px;max-width:220px;margin-left:auto;margin-right:auto;">end and see results</button>
  </div>

  <div id="pq-round-complete-screen" class="hidden pq-center">
    <div id="rc-title" style="font-size:16px;font-weight:600;margin-bottom:10px;"></div>
    <div id="rc-score" class="pq-stat-big"></div>
    <div class="pq-stat-sub">this round</div>
    <div id="rc-detail" class="pq-stat-detail"></div>
    <button class="btn" id="rc-continue" style="margin-top:16px;max-width:200px;margin-left:auto;margin-right:auto;">continue</button>
  </div>

  <div id="pq-end-screen" class="hidden">
    <div class="pq-center" style="margin-bottom:16px;">
      <div id="end-title" style="font-size:16px;font-weight:600;margin-bottom:10px;"></div>
      <div id="end-rounds-subtitle" class="hidden muted" style="margin-bottom:16px;"></div>
      <div id="end-stats-single" class="hidden">
        <div id="end-score" class="pq-stat-big"></div>
        <div id="end-percent" class="muted"></div>
      </div>
      <div id="end-stats-rounds" class="hidden" style="display:flex;justify-content:center;gap:40px;">
        <div><div id="end-pool-pct" class="pq-stat-big"></div><div class="muted">of pool completed</div></div>
        <div><div id="end-accuracy-pct" class="pq-stat-big"></div><div class="muted">overall accuracy</div></div>
      </div>
    </div>
    <p id="category-heading" class="eyebrow"></p>
    <div id="category-grid" class="pq-cat-grid"></div>
    <p class="eyebrow">review</p>
    <div id="review-list" style="margin-bottom:20px;"></div>
    <div class="pq-btn-row">
      <button class="btn small" id="end-restart">practice again</button>
      <button class="btn small" id="end-missed">redo missed questions</button>
    </div>
  </div>
</div>

 range.", "cat": "cbccmp", "id": 26}, {"prompt": "Which magnesium value is WITHIN the normal adult range?", "type": "mc", "options": [{"id": "a", "text": "0.9 mEq/L"}, {"id": "b", "text": "1.6 mEq/L"}, {"id": "c", "text": "2.5 mEq/L"}, {"id": "d", "text": "3.0 mEq/L"}], "correct": ["b"], "explanation": "Normal adult magnesium is 1.3\u20132.1 mEq/L. 1.6 mEq/L falls within range.", "cat": "cbccmp", "id": 27}, {"prompt": "Select all electrolyte values that are WITHIN normal limits for an adult client: Sodium 138 mEq/L, Potassium 5.8 mEq/L, Chloride 102 mEq/L, Magnesium 2.6 mEq/L, Calcium 9.8 mg/dL.", "type": "sata", "options": [{"id": "a", "text": "Sodium 138 mEq/L"}, {"id": "b", "text": "Potassium 5.8 mEq/L"}, {"id": "c", "text": "Chloride 102 mEq/L"}, {"id": "d", "text": "Magnesium 2.6 mEq/L"}, {"id": "e", "text": "Calcium 9.8 mg/dL"}], "correct": ["a", "c", "e"], "explanation": "Sodium, chloride, and calcium fall within their normal adult ranges. Potassium 5.8 (normal 3.5\u20135) and magnesium 2.6 (normal 1.3\u20132.1) are both elevated.", "cat": "cbccmp", "id": 28}, {"prompt": "Which MCH value is WITHIN the normal adult range?", "type": "mc", "options": [{"id": "a", "text": "20 pg"}, {"id": "b", "text": "29 pg"}, {"id": "c", "text": "35 pg"}, {"id": "d", "text": "40 pg"}], "correct": ["b"], "explanation": "Normal adult MCH is 27\u201331 pg. 29 pg falls within range.", "cat": "cbccmp", "id": 29}, {"prompt": "The nurse is reviewing red blood cell indices for a client: MCH 34 pg, MCHC 30 g/dL. How should the nurse interpret these findings?", "type": "mc", "options": [{"id": "a", "text": "Within normal limits for both"}, {"id": "b", "text": "Below normal range for MCH, above normal for MCHC"}, {"id": "c", "text": "Above normal range for MCH, below normal for MCHC"}, {"id": "d", "text": "Below normal range for both"}], "correct": ["c"], "explanation": "MCH 34 pg exceeds the normal range of 27\u201331 pg. MCHC 30 g/dL falls below the normal range of 32\u201336 g/dL.", "cat": "cbccmp", "id": 30}, {"prompt": "Select all CBC values that are WITHIN normal limits for an adult male client: Hct 46%, Hgb 17 g/dL, RBC 4.5 \u00d710\u2076/\u00b5L, Platelets 380,000/mm3, WBC 8,500/mm3.", "type": "sata", "options": [{"id": "a", "text": "Hct 46%"}, {"id": "b", "text": "Hgb 17 g/dL"}, {"id": "c", "text": "RBC 4.5 \u00d710\u2076/\u00b5L"}, {"id": "d", "text": "Platelets 380,000/mm3"}, {"id": "e", "text": "WBC 8,500/mm3"}], "correct": ["a", "b", "d", "e"], "explanation": "Hct, Hgb, platelets, and WBC are all within normal adult male ranges. RBC 4.5 \u00d710\u2076/\u00b5L is below the normal male range of 4.7\u20136.1.", "cat": "cbccmp", "id": 31}, {"prompt": "A client's serum creatinine is 1.2 mg/dL. How should the nurse interpret this finding?", "type": "mc", "options": [{"id": "a", "text": "Within normal limits for a 65-year-old male"}, {"id": "b", "text": "Above normal range for a 45-year-old male"}, {"id": "c", "text": "Within normal limits for a 20-year-old female"}, {"id": "d", "text": "Above normal range for a 65-year-old female"}], "correct": ["a"], "explanation": "For males age 60 and older, normal creatinine is 0.7\u20131.3 mg/dL, so 1.2 is normal. For a 45-year-old male (normal 0.6\u20131.3), 1.2 is also normal, not above. For a 20-year-old female (normal 0.5\u20131), 1.2 is above normal, not within. For a 65-year-old female (normal 0.5\u20131.2), 1.2 is at the upper limit, so it's normal, not above.", "cat": "cbccmp", "id": 32}, {"prompt": "Which bicarbonate value is WITHIN normal adult limits?", "type": "mc", "options": [{"id": "a", "text": "18 mEq/L"}, {"id": "b", "text": "25 mEq/L"}, {"id": "c", "text": "32 mEq/L"}, {"id": "d", "text": "15 mEq/L"}], "correct": ["b"], "explanation": "Normal adult bicarbonate is 23\u201330 mEq/L. 25 mEq/L falls within range.", "cat": "cbccmp", "id": 33}, {"prompt": "Select all values that are ABOVE normal for an adult client: Potassium 5.6 mEq/L, Sodium 148 mEq/L, Magnesium 2.5 mEq/L, Calcium 11.5 mg/dL.", "type": "sata", "options": [{"id": "a", "text": "Potassium 5.6 mEq/L"}, {"id": "b", "text": "Sodium 148 mEq/L"}, {"id": "c", "text": "Magnesium 2.5 mEq/L"}, {"id": "d", "text": "Calcium 11.5 mg/dL"}], "correct": ["a", "b", "c", "d"], "explanation": "Potassium (normal 3.5\u20135), sodium (normal 136\u2013145), magnesium (normal 1.3\u20132.1), and calcium (normal 9.0\u201310.5) are all elevated here.", "cat": "cbccmp", "id": 34}, {"prompt": "Which creatinine value best reflects an expected finding for an 18-year-old female client?", "type": "mc", "options": [{"id": "a", "text": "0.4 mg/dL"}, {"id": "b", "text": "0.8 mg/dL"}, {"id": "c", "text": "1.1 mg/dL"}, {"id": "d", "text": "0.3 mg/dL"}], "correct": ["b"], "explanation": "For females age 18 to under 41, normal creatinine is 0.5\u20131 mg/dL. 0.8 mg/dL falls within that; 0.4 and 0.3 are below, and 1.1 is above.", "cat": "cbccmp", "id": 35}, {"prompt": "Which ALT and AST pairing would the nurse expect to see both WITHIN normal limits?", "type": "mc", "options": [{"id": "a", "text": "ALT 50 units/L, AST 45 units/L"}, {"id": "b", "text": "ALT 20 units/L, AST 15 units/L"}, {"id": "c", "text": "ALT 40 units/L, AST 40 units/L"}, {"id": "d", "text": "ALT 60 units/L, AST 10 units/L"}], "correct": ["b"], "explanation": "Normal ALT is 4\u201336 units/L and AST is 0\u201335 units/L. Only option b has both values within range.", "cat": "cbccmp", "id": 36}, {"prompt": "You are assigned 5 clients at the start of your shift. Which of the following morning lab results should be reported to the provider? Select all that apply.", "type": "sata", "options": [{"id": "a", "text": "A client's total protein of 9.6 g/dL"}, {"id": "b", "text": "A client's potassium level of 2.8 mEq/L"}, {"id": "c", "text": "A client's platelet count of 410,000/mm3"}, {"id": "d", "text": "A client's glucose level of 92 mg/dL"}, {"id": "e", "text": "A client's sodium level of 140 mEq/L"}], "correct": ["a", "b", "c"], "explanation": "Total protein 9.6 (normal 6.4\u20138.3) is elevated. Potassium 2.8 (normal 3.5\u20135) is low. Platelets 410,000 (normal 150,000\u2013400,000) is elevated. Glucose 92 and sodium 140 are both within normal limits.", "cat": "cbccmp", "id": 37}, {"prompt": "Which of the following morning lab results should be reported to the provider? Select all that apply.", "type": "sata", "options": [{"id": "a", "text": "A client's bicarbonate level of 19 mEq/L"}, {"id": "b", "text": "A client's chloride level of 92 mEq/L"}, {"id": "c", "text": "A client's magnesium level of 1.7 mEq/L"}, {"id": "d", "text": "A client's calcium level of 9.9 mg/dL"}, {"id": "e", "text": "A client's WBC of 7,200/mm3"}], "correct": ["a", "b"], "explanation": "Bicarbonate 19 (normal 23\u201330) is low. Chloride 92 (normal 98\u2013106) is low. Magnesium 1.7, calcium 9.9, and WBC 7,200 are all within normal limits.", "cat": "cbccmp", "id": 38}, {"prompt": "Which of the following morning lab results should be reported to the provider? Select all that apply.", "type": "sata", "options": [{"id": "a", "text": "A client's total protein of 5.9 g/dL"}, {"id": "b", "text": "A client's hematocrit of 55% (male client)"}, {"id": "c", "text": "A client's ALT of 30 units/L"}, {"id": "d", "text": "A client's total bilirubin of 1.8 mg/dL"}, {"id": "e", "text": "A client's BUN of 16 mg/dL"}], "correct": ["a", "b", "d"], "explanation": "Total protein 5.9 (normal 6.4\u20138.3) is low. Male hematocrit 55% (normal 42\u201352) is elevated. Total bilirubin 1.8 (normal 0.3\u20131) is elevated. ALT 30 and BUN 16 are both within normal limits.", "cat": "cbccmp", "id": 39}, {"prompt": "Which of the following morning lab results should be reported to the provider? Select all that apply.", "type": "sata", "options": [{"id": "a", "text": "A client's glucose level of 58 mg/dL"}, {"id": "b", "text": "A client's RBC count of 3.6 \u00d710\u2076/\u00b5L (female client)"}, {"id": "c", "text": "A client's ALP of 95 units/L"}, {"id": "d", "text": "A client's magnesium level of 2.3 mEq/L"}, {"id": "e", "text": "A client's creatinine of 0.9 mg/dL (35-year-old male client)"}], "correct": ["a", "b", "d"], "explanation": "Glucose 58 (normal 74\u2013106) is low. Female RBC 3.6 (normal 4.2\u20135.4) is low. Magnesium 2.3 (normal 1.3\u20132.1) is elevated. ALP 95 and creatinine 0.9 (normal 0.6\u20131.2 for this age) are both within normal limits.", "cat": "cbccmp", "id": 40}, {"id": 41, "cat": "fundamentals", "type": "mc", "prompt": "A nurse is giving an opioid analgesic for a pain score of 6/10. The vital sign most directly affected by this medication will be:", "options": [{"id": "a", "text": "Temperature"}, {"id": "b", "text": "Respiratory rate"}, {"id": "c", "text": "Pulse oximetry"}, {"id": "d", "text": "Blood pressure"}], "correct": ["b"], "explanation": "Opioids depress the central respiratory drive, making respiratory rate the vital sign most directly affected."}, {"id": 42, "cat": "fundamentals", "type": "mc", "prompt": "A client asks the nurse what the normal range is for blood pressure. The nurse knows the expected range for an adult is:", "options": [{"id": "a", "text": "Greater than 140/90 mmHg"}, {"id": "b", "text": "Less than 120/80 mmHg"}, {"id": "c", "text": "Between 110/60 and 150/100 mmHg"}, {"id": "d", "text": "Less than 90/60 mmHg"}], "correct": ["b"], "explanation": "Less than 120/80 mmHg is the expected normal adult blood pressure."}, {"id": 43, "cat": "fundamentals", "type": "mc", "prompt": "The nurse delegates obtaining an oxygen saturation reading to the UAP. Which equipment will the UAP take into the room?", "options": [{"id": "a", "text": "Pulse oximeter"}, {"id": "b", "text": "Sphygmomanometer"}, {"id": "c", "text": "Thermometer"}, {"id": "d", "text": "Stethoscope"}], "correct": ["a"], "explanation": "A pulse oximeter measures SpO2, the oxygen saturation reading."}, {"id": 44, "cat": "fundamentals", "type": "mc", "prompt": "Which step of the nursing process involves identifying expected outcomes and defining the interventions needed to reach them?", "options": [{"id": "a", "text": "Assessment"}, {"id": "b", "text": "Planning"}, {"id": "c", "text": "Implementation"}, {"id": "d", "text": "Evaluation"}], "correct": ["b"], "explanation": "Planning generates potential solutions and goals, and identifies interventions to reach the desired outcome."}, {"id": 45, "cat": "fundamentals", "type": "mc", "prompt": "Which nursing diagnosis is written correctly as a 'risk for' diagnosis?", "options": [{"id": "a", "text": "Impaired physical mobility r/t pain AEB reluctance to walk"}, {"id": "b", "text": "Risk for infection r/t surgical incision and compromised immune system"}, {"id": "c", "text": "Acute pain r/t surgical incision AEB pain rating of 8/10"}, {"id": "d", "text": "Risk for infection AEB elevated WBC count"}], "correct": ["b"], "explanation": "A 'risk for' diagnosis has no AEB, since the problem hasn't happened yet \u2014 only risk factors are listed."}, {"id": 46, "cat": "fundamentals", "type": "mc", "prompt": "According to ATI, accountability is best defined as:", "options": [{"id": "a", "text": "Delegating tasks appropriately to the care team"}, {"id": "b", "text": "A legal obligation with a moral and ethical commitment to do the right thing every time"}, {"id": "c", "text": "Completing all assigned tasks on time"}, {"id": "d", "text": "Following the chain of command"}], "correct": ["b"], "explanation": "ATI defines accountability as a legal obligation with a moral and ethical commitment to do the right thing every time and in every situation."}, {"id": 47, "cat": "fundamentals", "type": "mc", "prompt": "A client's heart rate is 110 bpm with a regular rhythm. The nurse documents this as:", "options": [{"id": "a", "text": "Bradycardia"}, {"id": "b", "text": "Tachycardia"}, {"id": "c", "text": "Dysrhythmia"}, {"id": "d", "text": "Normal sinus rhythm"}], "correct": ["b"], "explanation": "A heart rate over 100 bpm is tachycardia."}, {"id": 48, "cat": "fundamentals", "type": "mc", "prompt": "A client's respiratory rate is 8 breaths/min. This is best described as:", "options": [{"id": "a", "text": "Tachypnea"}, {"id": "b", "text": "Apnea"}, {"id": "c", "text": "Bradypnea"}, {"id": "d", "text": "Dyspnea"}], "correct": ["c"], "explanation": "Bradypnea is a regular breathing pattern under 12 breaths per minute."}, {"id": 49, "cat": "fundamentals", "type": "mc", "prompt": "Which of the following is an example of primary prevention?", "options": [{"id": "a", "text": "Colonoscopy screening"}, {"id": "b", "text": "Cardiac rehabilitation"}, {"id": "c", "text": "Vaccination"}, {"id": "d", "text": "Mammogram"}], "correct": ["c"], "explanation": "Primary prevention decreases the risk of developing a disease before it occurs, as with vaccines. Colonoscopy and mammogram are secondary prevention; cardiac rehab is tertiary."}, {"id": 50, "cat": "fundamentals", "type": "mc", "prompt": "A client's blood pressure drops from 128/78 to 100/70 with a compensatory increase in heart rate within two minutes of standing, and they report dizziness. The nurse suspects:", "options": [{"id": "a", "text": "Hypertensive crisis"}, {"id": "b", "text": "Orthostatic hypotension"}, {"id": "c", "text": "Shock"}, {"id": "d", "text": "Bradycardia"}], "correct": ["b"], "explanation": "A systolic drop of 20+ mmHg with reflex tachycardia within 1-3 minutes of a position change is orthostatic hypotension."}, {"id": 51, "cat": "fundamentals", "type": "mc", "prompt": "Why does the nurse assess the ABCs before completing a neurological exam on an acutely ill client?", "options": [{"id": "a", "text": "Neuro exams take longer to complete"}, {"id": "b", "text": "Airway, breathing, and circulation problems can affect neurological findings"}, {"id": "c", "text": "It is hospital policy to always start with vital signs"}, {"id": "d", "text": "The client is more cooperative early in the assessment"}], "correct": ["b"], "explanation": "ABCs are assessed first because compromise in any of them can directly impact neurological status."}, {"id": 52, "cat": "fundamentals", "type": "mc", "prompt": "Which communication model includes the concepts of sender, encoder, channel, decoder, receiver, and noise?", "options": [{"id": "a", "text": "Shannon-Weaver model"}, {"id": "b", "text": "TeamSTEPPS model"}, {"id": "c", "text": "SBAR model"}, {"id": "d", "text": "Health Belief Model"}], "correct": ["a"], "explanation": "The Shannon-Weaver model's six concepts are sender, encoder, channel, decoder, receiver, and noise."}, {"id": 53, "cat": "fundamentals", "type": "mc", "prompt": "A nurse reports a colleague's unsafe medication practices to hospital administration. This is an example of:", "options": [{"id": "a", "text": "Mandatory reporting"}, {"id": "b", "text": "Whistleblowing"}, {"id": "c", "text": "Good Samaritan action"}, {"id": "d", "text": "Informed consent"}], "correct": ["b"], "explanation": "Whistleblowing is reporting unethical, illegal, or unsafe practices."}, {"id": 54, "cat": "fundamentals", "type": "mc", "prompt": "During a client interview, the nurse says, 'So what I'm hearing is that the pain gets worse at night and eases with rest.' This is an example of:", "options": [{"id": "a", "text": "Giving advice"}, {"id": "b", "text": "Restating/paraphrasing"}, {"id": "c", "text": "False reassurance"}, {"id": "d", "text": "A closed-ended question"}], "correct": ["b"], "explanation": "Restating/paraphrasing reflects back what the client said to confirm understanding \u2014 a therapeutic technique."}, {"id": 55, "cat": "fundamentals", "type": "mc", "prompt": "HIPAA primarily protects which of the following?", "options": [{"id": "a", "text": "A client's right to refuse treatment"}, {"id": "b", "text": "A client's protected health information (PHI)"}, {"id": "c", "text": "A nurse's scope of practice"}, {"id": "d", "text": "A client's right to informed consent"}], "correct": ["b"], "explanation": "HIPAA (the Health Insurance Portability and Accountability Act) protects a client's protected health information."}, {"id": 56, "cat": "fundamentals", "type": "mc", "prompt": "In the ISBARR communication tool, what does the second 'R' stand for?", "options": [{"id": "a", "text": "Response"}, {"id": "b", "text": "Read-back"}, {"id": "c", "text": "Referral"}, {"id": "d", "text": "Reassessment"}], "correct": ["b"], "explanation": "ISBARR stands for Introduction, Situation, Background, Assessment, Recommendation, Read-back \u2014 confirming the receiver understood correctly."}, {"id": 57, "cat": "fundamentals", "type": "mc", "prompt": "In a PICOT question, the 'T' stands for:", "options": [{"id": "a", "text": "Type of study"}, {"id": "b", "text": "Treatment"}, {"id": "c", "text": "Time"}, {"id": "d", "text": "Team"}], "correct": ["c"], "explanation": "PICOT = Population, Intervention, Comparison, Outcome, Time."}, {"id": 58, "cat": "fundamentals", "type": "mc", "prompt": "Which documentation method charts only significant findings or deviations from the norm?", "options": [{"id": "a", "text": "SOAP charting"}, {"id": "b", "text": "Problem-oriented medical record"}, {"id": "c", "text": "Charting by exception (CBE)"}, {"id": "d", "text": "Focus charting"}], "correct": ["c"], "explanation": "Charting by exception (CBE) only documents findings that deviate from the expected norm."}, {"id": 59, "cat": "fundamentals", "type": "mc", "prompt": "Which of the following best demonstrates the 'least restrictive, least invasive' principle in priority setting?", "options": [{"id": "a", "text": "Restraining a confused client immediately"}, {"id": "b", "text": "Trying reorientation and a sitter before considering restraints"}, {"id": "c", "text": "Sedating an agitated client right away"}, {"id": "d", "text": "Notifying security before attempting redirection"}], "correct": ["b"], "explanation": "The least restrictive/least invasive approach means trying gentler interventions before more restrictive ones like restraints."}, {"id": 60, "cat": "fundamentals", "type": "mc", "prompt": "A nursing student asks about the difference between nociceptive and neuropathic pain. Which statement is correct?", "options": [{"id": "a", "text": "Nociceptive pain is related to nerve damage; neuropathic pain is related to tissue damage"}, {"id": "b", "text": "Nociceptive pain is related to tissue damage; neuropathic pain is related to nerve damage"}, {"id": "c", "text": "Both types are related to psychological distress only"}, {"id": "d", "text": "Neuropathic pain always resolves within 6 months"}], "correct": ["b"], "explanation": "Nociceptive pain relates to tissue damage; neuropathic pain relates to nerve damage."}, {"id": 61, "cat": "mobility", "type": "mc", "prompt": "A nurse is assessing a client's ability to reach across midline and shake hands as part of a mobility assessment. The client is unable to perform this task. Which action should the nurse take first?", "options": [{"id": "a", "text": "Assign Level 1 (maximum assist) mobility"}, {"id": "b", "text": "Instruct the client to march in place"}, {"id": "c", "text": "Apply a gait belt and ambulate the client"}, {"id": "d", "text": "Document the client as Level 4, no assist"}], "correct": ["a"], "explanation": "A client who cannot perform the Level 1 handshake/sitting tasks is assigned maximum assist per the BMAT, requiring a mechanical lift and 2 or more staff before any further mobility attempts."}, {"id": 62, "cat": "mobility", "type": "mc", "prompt": "A charge nurse is teaching a nursing student about the role of proprioception in maintaining balance. Which statement should the charge nurse include?", "options": [{"id": "a", "text": "It's the sensory feedback from muscles and joints that creates the brain's awareness of body position."}, {"id": "b", "text": "It's the process bones use to produce red blood cells."}, {"id": "c", "text": "It's the hardening of bone tissue that occurs with age."}, {"id": "d", "text": "It's the chemical signal muscles send to relax after contracting."}], "correct": ["a"], "explanation": "Proprioception (kinesthesia) is sensory feedback from muscles and joints that creates self-awareness of body position, enabling balance and coordination."}, {"id": 63, "cat": "mobility", "type": "mc", "prompt": "A charge nurse is teaching a nursing student about the difference between tendons and ligaments. Which statement by the student indicates understanding?", "options": [{"id": "a", "text": "Tendons connect muscles to bones, and ligaments connect bone to bone."}, {"id": "b", "text": "Tendons and ligaments both connect muscle to muscle."}, {"id": "c", "text": "Ligaments produce the force that moves bones."}, {"id": "d", "text": "Tendons cushion joints so the bones don't rub together."}], "correct": ["a"], "explanation": "Tendons connect muscle to bone; ligaments connect bone to bone. Cartilage, not tendons, cushions joints."}, {"id": 64, "cat": "mobility", "type": "mc", "prompt": "A nurse is teaching a nursing student about the role of the skeletal system beyond movement. Which statement by the student indicates understanding?", "options": [{"id": "a", "text": "Bones store calcium and produce blood cells in addition to supporting the body."}, {"id": "b", "text": "Bones only provide a framework for movement."}, {"id": "c", "text": "Bones do not play a role in protecting organs."}, {"id": "d", "text": "Bone marrow has no function related to blood cells."}], "correct": ["a"], "explanation": "In addition to support and movement, bones protect organs, produce blood cells in the marrow, and store minerals like calcium."}, {"id": 65, "cat": "mobility", "type": "mc", "prompt": "A nurse is preparing to reposition a client who is unable to assist. Which action should the nurse take first?", "options": [{"id": "a", "text": "Obtain assistance from another staff member"}, {"id": "b", "text": "Bend at the waist to grasp the draw sheet"}, {"id": "c", "text": "Reposition the client without raising the bed"}, {"id": "d", "text": "Twist at the torso to pull the client up in bed"}], "correct": ["a"], "explanation": "Getting lift assistance before moving a client who cannot assist decreases injury risk to both nurse and client, and should happen before repositioning begins."}, {"id": 66, "cat": "mobility", "type": "sata", "prompt": "A nurse is teaching a group of nursing assistants about proper body mechanics when lifting. Which statements should the nurse include?", "options": [{"id": "a", "text": "Bend your knees, not your back."}, {"id": "b", "text": "Keep the object as far from your body as possible."}, {"id": "c", "text": "Pivot your feet instead of twisting your torso."}, {"id": "d", "text": "Tighten your abdominal muscles before lifting."}, {"id": "e", "text": "Lift using the muscles in your lower back."}], "correct": ["a", "c", "d"], "explanation": "Bending the knees, pivoting instead of twisting, and contracting the abdominal muscles are correct body mechanics. Objects should stay close to the body, and lifting should use the leg (quadriceps) muscles, not the back."}, {"id": 67, "cat": "mobility", "type": "mc", "prompt": "A nurse is teaching a client's caregiver about ergonomics in the home. Which statement by the caregiver indicates a need for further teaching?", "options": [{"id": "a", "text": "I'll keep frequently used items on a shelf that's easy to reach without bending."}, {"id": "b", "text": "I'll try to lift my spouse alone to save time between tasks."}, {"id": "c", "text": "I'll use a shower chair to make bathing safer."}, {"id": "d", "text": "I'll make sure the walking path is clear of clutter."}], "correct": ["b"], "explanation": "Solo lifting increases injury risk; 'minimal lift' or 'never lift alone' practices are core ergonomic safety principles, so this statement shows a need for further teaching."}, {"id": 68, "cat": "mobility", "type": "mc", "prompt": "A nurse is caring for a client on prolonged bed rest who reports sudden shortness of breath, chest pain, and a rapid pulse. Which action should the nurse take first?", "options": [{"id": "a", "text": "Notify the provider immediately"}, {"id": "b", "text": "Encourage the client to use an incentive spirometer"}, {"id": "c", "text": "Apply antiembolic stockings"}, {"id": "d", "text": "Document the findings and reassess in 1 hour"}], "correct": ["a"], "explanation": "These are manifestations of a pulmonary embolism, a life-threatening complication of immobility, requiring immediate provider notification."}, {"id": 69, "cat": "mobility", "type": "mc", "prompt": "A nurse is teaching a client about disuse osteoporosis. Which statement should the nurse include?", "options": [{"id": "a", "text": "Bed rest reduces the mechanical stress your bones need to stay strong."}, {"id": "b", "text": "Bed rest increases the rate new bone is made."}, {"id": "c", "text": "Disuse osteoporosis only affects the spine."}, {"id": "d", "text": "Osteoporosis from bed rest rebuilds faster than muscle loss."}], "correct": ["a"], "explanation": "Prolonged immobility reduces mechanical load on bones, disrupting the normal balance between bone growth and breakdown, leading to demineralization. Rebuilding bone mass takes longer than rebuilding muscle."}, {"id": 70, "cat": "mobility", "type": "sata", "prompt": "A nurse is teaching a client about signs of a possible deep vein thrombosis. Which statements by the client indicate correct understanding?", "options": [{"id": "a", "text": "I should watch for swelling, warmth, or redness in one leg."}, {"id": "b", "text": "I should massage the area if it feels tender."}, {"id": "c", "text": "I should tell the nurse if one calf looks bigger than the other."}, {"id": "d", "text": "I can cross my legs to relieve pressure."}, {"id": "e", "text": "I should tell the nurse about any new leg pain."}], "correct": ["a", "c", "e"], "explanation": "Swelling, warmth, redness, a unilateral calf size difference, and new leg pain are all DVT manifestations. Massaging a suspected clot or crossing the legs, which compresses veins, are unsafe."}, {"id": 71, "cat": "mobility", "type": "mc", "prompt": "A nurse is preparing to ambulate a client for the first time since surgery. Which action should the nurse take first?", "options": [{"id": "a", "text": "Have the client sit on the edge of the bed for a few minutes before standing"}, {"id": "b", "text": "Assist the client to stand and start walking immediately"}, {"id": "c", "text": "Remove the client's nonskid footwear for comfort"}, {"id": "d", "text": "Instruct the client to hold their breath while standing"}], "correct": ["a"], "explanation": "Sitting briefly before standing allows the nurse to assess for orthostatic hypotension before full ambulation, reducing fall risk."}, {"id": 72, "cat": "mobility", "type": "mc", "prompt": "A nurse is teaching a client how to safely use a standard walker. Which instruction should the nurse include?", "options": [{"id": "a", "text": "Advance the walker about 6 to 8 inches, then set it down on all four feet before stepping."}, {"id": "b", "text": "Push the walker several feet ahead before taking a step."}, {"id": "c", "text": "Lean your full body weight onto the walker with your elbows locked straight."}, {"id": "d", "text": "Use the walker to go up and down a flight of stairs."}], "correct": ["a"], "explanation": "The walker should be advanced 15 to 20 cm (6 to 8 in) and set down fully before stepping, with elbows flexed 15 to 30 degrees. Walkers should never be used on stairs."}, {"id": 73, "cat": "mobility", "type": "mc", "prompt": "A nurse is teaching a client who has a left leg injury how to use a cane. Which statement by the client indicates understanding?", "options": [{"id": "a", "text": "I'll hold the cane in my right hand."}, {"id": "b", "text": "I'll hold the cane in my left hand."}, {"id": "c", "text": "I'll move my right leg forward first, then the cane."}, {"id": "d", "text": "I'll keep only one point of contact with the floor at a time."}], "correct": ["a"], "explanation": "The cane is held on the stronger, unaffected side \u2014 here, the right hand, since the injury is on the left. Two points of support should stay on the floor at all times."}, {"id": 74, "cat": "mobility", "type": "mc", "prompt": "A nurse assesses a client using a Timed Up and Go (TUG) test. The client takes 15 seconds to complete the test. Which action should the nurse take first?", "options": [{"id": "a", "text": "Identify the client as being at increased risk for falls"}, {"id": "b", "text": "Document the finding as a normal result"}, {"id": "c", "text": "Discontinue further mobility assessment"}, {"id": "d", "text": "Encourage the client to ambulate independently without supervision"}], "correct": ["a"], "explanation": "A TUG time greater than 12 seconds in an older adult indicates an increased fall risk, prompting the nurse to implement fall precautions."}, {"id": 75, "cat": "mobility", "type": "mc", "prompt": "A nurse is caring for a client who was just diagnosed with a pulmonary embolism. Which action should the nurse take first?", "options": [{"id": "a", "text": "Position the client in high-Fowler's"}, {"id": "b", "text": "Position the client supine and flat"}, {"id": "c", "text": "Encourage the client to ambulate in the hallway"}, {"id": "d", "text": "Apply a heating pad to the chest"}], "correct": ["a"], "explanation": "High-Fowler's positioning is prioritized for a client with a PE to promote optimal lung expansion and gas exchange while awaiting further treatment."}, {"id": 76, "cat": "mobility", "type": "sata", "prompt": "A nurse is teaching a client about positions that help prevent complications of immobility. Which statements should the nurse include?", "options": [{"id": "a", "text": "Lying prone helps prevent contractures in the hips and knees."}, {"id": "b", "text": "The Trendelenburg position helps drain the lower lobes of your lungs."}, {"id": "c", "text": "Lying flat on your back is best for preventing pressure injuries."}, {"id": "d", "text": "Side-lying with a pillow between your knees reduces pressure on your sacrum."}, {"id": "e", "text": "Fowler's position helps your lungs expand more fully."}], "correct": ["a", "b", "d", "e"], "explanation": "Prone prevents contractures, Trendelenburg promotes lung drainage and venous return, lateral with a pillow reduces sacral and heel pressure, and Fowler's promotes lung expansion. Lying flat does not specifically prevent pressure injury \u2014 repositioning does."}, {"id": 77, "cat": "mobility", "type": "mc", "prompt": "A nurse is teaching a client the difference between active and passive range of motion. Which statement by the client indicates understanding?", "options": [{"id": "a", "text": "Active ROM is when I move my own joints; passive is when someone else moves them for me."}, {"id": "b", "text": "Passive ROM prevents muscle and bone loss the same as active ROM."}, {"id": "c", "text": "Active ROM means the nurse moves my joints while I relax."}, {"id": "d", "text": "Passive ROM requires more muscle strength than active ROM."}], "correct": ["a"], "explanation": "Active ROM is voluntary movement by the client; passive is movement performed by another person, and does not prevent muscle atrophy or bone loss the way active, weight-bearing movement does."}, {"id": 78, "cat": "mobility", "type": "mc", "prompt": "A nurse applies an ice pack to a client's swollen ankle. Fifteen minutes later, the client reports numbness and the skin appears mottled. Which action should the nurse take first?", "options": [{"id": "a", "text": "Remove the ice pack immediately"}, {"id": "b", "text": "Reapply the ice pack for another 15 minutes"}, {"id": "c", "text": "Document the finding and check again in 1 hour"}, {"id": "d", "text": "Apply a warm compress on top of the ice pack"}], "correct": ["a"], "explanation": "Numbness and mottling are signs of tissue damage from cold therapy \u2014 the application should be discontinued immediately."}, {"id": 79, "cat": "mobility", "type": "mc", "prompt": "A nurse is teaching a client about the use of sequential compression devices (SCDs). Which statement should the nurse include?", "options": [{"id": "a", "text": "The device will keep the blood pumping through your legs to help prevent clots."}, {"id": "b", "text": "The device will prevent pressure injuries on your skin."}, {"id": "c", "text": "The device will keep your leg muscles from becoming weak."}, {"id": "d", "text": "The device will keep your joints flexible."}], "correct": ["a"], "explanation": "SCDs promote venous return and help prevent clot formation by mimicking the muscle-pump action that moves blood back to the heart."}, {"id": 80, "cat": "mobility", "type": "sata", "prompt": "A nurse is teaching a client about factors that reduce the risk of thrombus formation. Which statements by the client indicate understanding?", "options": [{"id": "a", "text": "I'll avoid crossing my legs while sitting."}, {"id": "b", "text": "I'll wear my elastic stockings all day and remove them only per the nurse's instructions."}, {"id": "c", "text": "I'll try to avoid holding my breath while straining."}, {"id": "d", "text": "I'll ask for a pillow to place under my knees."}, {"id": "e", "text": "I'll try to change positions frequently."}], "correct": ["a", "b", "c", "e"], "explanation": "Avoiding leg crossing, wearing compression stockings as directed, avoiding the Valsalva maneuver, and frequent position changes all reduce thrombus risk. Pillows under the knees increase venous compression and should be avoided."}, {"id": 81, "cat": "mobility", "type": "mc", "prompt": "A nurse is assessing a client's synovial joints as part of a musculoskeletal exam. Which finding should the nurse identify as expected?", "options": [{"id": "a", "text": "Smooth, pain-free movement of the joint through its range"}, {"id": "b", "text": "Grinding sensation with movement"}, {"id": "c", "text": "Joint swelling and warmth"}, {"id": "d", "text": "Inability to bear weight"}], "correct": ["a"], "explanation": "Synovial joints normally allow smooth, flexible movement. Grinding, swelling/warmth, or inability to bear weight are abnormal findings requiring further assessment."}, {"id": 82, "cat": "mobility", "type": "mc", "prompt": "A charge nurse is teaching a nursing student about how nerve cells contribute to movement. Which statement should the charge nurse include?", "options": [{"id": "a", "text": "Nerve cells in the spinal cord signal muscles to contract, which pulls on the bones to create movement."}, {"id": "b", "text": "Nerve cells store calcium that strengthens bones."}, {"id": "c", "text": "Nerve cells produce the collagen found in tendons."}, {"id": "d", "text": "Nerve cells generate the heat muscles produce."}], "correct": ["a"], "explanation": "Nerve cells in the spinal cord fire signals that cause muscles to contract; as muscles shorten, they pull against the bones they're attached to, generating movement."}, {"id": 83, "cat": "mobility", "type": "mc", "prompt": "A nursing student is describing the role of cartilage. Which statement indicates understanding?", "options": [{"id": "a", "text": "Cartilage lets the ends of my bones glide over each other without grinding."}, {"id": "b", "text": "Cartilage connects my muscles directly to my bones."}, {"id": "c", "text": "Cartilage produces red blood cells."}, {"id": "d", "text": "Cartilage sends nerve signals to my muscles."}], "correct": ["a"], "explanation": "Cartilage reduces friction between bones, allowing them to glide smoothly and absorb shock."}, {"id": 84, "cat": "mobility", "type": "mc", "prompt": "A nurse observes a colleague lifting a heavy box by bending at the waist with straight knees. Which action should the nurse take first?", "options": [{"id": "a", "text": "Remind the colleague to bend the knees and use the leg muscles"}, {"id": "b", "text": "Allow the colleague to continue since the box is already lifted"}, {"id": "c", "text": "Wait until after the task to mention proper technique"}, {"id": "d", "text": "Report the colleague to the manager immediately"}], "correct": ["a"], "explanation": "Correcting unsafe body mechanics in the moment helps prevent an acute back injury; the nurse should intervene promptly rather than waiting or escalating unnecessarily."}, {"id": 85, "cat": "mobility", "type": "sata", "prompt": "A nurse is teaching new staff about ergonomic risk factors in the workplace. Which examples should the nurse include?", "options": [{"id": "a", "text": "Poor lighting in a supply room"}, {"id": "b", "text": "A height-adjustable bed"}, {"id": "c", "text": "Repetitive lifting without breaks"}, {"id": "d", "text": "A wide, stable base when standing"}, {"id": "e", "text": "Whole-body vibration from equipment"}], "correct": ["a", "c", "e"], "explanation": "Poor lighting, repetitive lifting without breaks, and whole-body vibration are ergonomic risk factors. A height-adjustable bed and a wide stable base are examples of good ergonomic practice, not risk factors."}, {"id": 86, "cat": "mobility", "type": "mc", "prompt": "A nurse is teaching a client's family member about using a gait belt safely. Which statement indicates understanding?", "options": [{"id": "a", "text": "I should be able to slip my fingers under the belt once it's fastened."}, {"id": "b", "text": "I should fasten the belt as tightly as possible with no space underneath."}, {"id": "c", "text": "The belt should be placed over bare skin only."}, {"id": "d", "text": "The belt is only used for clients who can walk independently."}], "correct": ["a"], "explanation": "A gait belt should be snug but allow the caregiver to slip fingers underneath for safety and adjustment; it should not be applied so tight that there's no space."}, {"id": 87, "cat": "mobility", "type": "mc", "prompt": "A nurse is caring for a client on bed rest who has not had a bowel movement in 4 days and reports abdominal discomfort. Which action should the nurse take first?", "options": [{"id": "a", "text": "Auscultate bowel sounds and palpate the abdomen"}, {"id": "b", "text": "Administer a laxative without further assessment"}, {"id": "c", "text": "Encourage the client to increase activity immediately"}, {"id": "d", "text": "Document the finding and reassess in 24 hours"}], "correct": ["a"], "explanation": "The nurse should assess bowel sounds and the abdomen for distention or discomfort before intervening, to help determine whether this is simple constipation or a more serious complication like impaction."}, {"id": 88, "cat": "mobility", "type": "mc", "prompt": "A nurse is teaching a client about why bed rest increases the risk of pneumonia. Which statement should the nurse include?", "options": [{"id": "a", "text": "Shallow breathing and thickened secretions make it harder to clear your lungs."}, {"id": "b", "text": "Bed rest increases the depth of your breaths."}, {"id": "c", "text": "Lying flat improves the effectiveness of your cough."}, {"id": "d", "text": "Bed rest has no effect on your risk for lung infections."}], "correct": ["a"], "explanation": "Supine positioning decreases breathing depth and coughing effectiveness, and dehydration thickens secretions \u2014 together these raise the risk of pneumonia."}, {"id": 89, "cat": "mobility", "type": "mc", "prompt": "A client asks the nurse why they need to reposition every 2 hours. Which statement by the client indicates understanding of the teaching?", "options": [{"id": "a", "text": "Changing position keeps the pressure off any one area of my skin for too long."}, {"id": "b", "text": "Repositioning helps me digest my food faster."}, {"id": "c", "text": "Repositioning prevents my blood pressure from dropping when I stand."}, {"id": "d", "text": "Changing position helps my bones absorb more calcium."}], "correct": ["a"], "explanation": "Frequent repositioning relieves prolonged pressure on bony prominences, reducing the risk of pressure injury."}, {"id": 90, "cat": "mobility", "type": "sata", "prompt": "A nurse is caring for a client on bed rest for 1 week. Which findings should the nurse identify as expected complications of immobility?", "options": [{"id": "a", "text": "Reports of new leg weakness"}, {"id": "b", "text": "Increased appetite"}, {"id": "c", "text": "Reddened area over the sacrum"}, {"id": "d", "text": "Reports of feeling short of breath with minimal exertion"}, {"id": "e", "text": "Improved bowel regularity"}], "correct": ["a", "c", "d"], "explanation": "Muscle weakness, skin breakdown over bony prominences, and decreased activity tolerance/dyspnea are all expected complications of immobility. Increased appetite and improved bowel regularity are not \u2014 immobility typically decreases appetite and causes constipation."}, {"id": 91, "cat": "mobility", "type": "mc", "prompt": "A nurse is assessing a client who can sit on the edge of the bed with feet on the floor and extend one leg but cannot maintain a standing position. According to the BMAT, which level should the nurse assign?", "options": [{"id": "a", "text": "Level 2, moderate assist"}, {"id": "b", "text": "Level 1, maximum assist"}, {"id": "c", "text": "Level 3, minimal assist"}, {"id": "d", "text": "Level 4, no assist"}], "correct": ["a"], "explanation": "A client who can perform the Level 2 tasks (sitting with feet on floor, extending the leg) but cannot progress to standing independently is assigned Level 2, moderate assist."}, {"id": 92, "cat": "mobility", "type": "mc", "prompt": "A nurse is teaching a client about the purpose of the Borg RPE scale. Which statement should the nurse include?", "options": [{"id": "a", "text": "It helps you rate how hard an activity feels to you, from very light to maximal effort."}, {"id": "b", "text": "It measures your blood pressure during activity."}, {"id": "c", "text": "It calculates how many calories you burn during exercise."}, {"id": "d", "text": "It determines the exact assistive device you'll need."}], "correct": ["a"], "explanation": "The Borg RPE scale is a subjective tool that lets clients rate their own perceived exertion level during activity, from 6 (resting) to 20 (maximal effort)."}, {"id": 93, "cat": "mobility", "type": "mc", "prompt": "A nurse is teaching a client how to safely use axillary crutches. Which statement indicates understanding?", "options": [{"id": "a", "text": "I'll support my weight through my hands on the grips, not under my arms."}, {"id": "b", "text": "I'll rest my body weight on the crutch pads under my arms."}, {"id": "c", "text": "I'll keep my elbows locked straight when using the grips."}, {"id": "d", "text": "I'll place the crutches directly under my arms for the most support."}], "correct": ["a"], "explanation": "Weight should be supported at the hand grips, never in the axilla \u2014 bearing weight on the crutch pads can cause nerve damage (crutch palsy)."}, {"id": 94, "cat": "mobility", "type": "mc", "prompt": "A nurse is caring for a client with a stage 2 pressure injury on the sacrum. Which position should the nurse avoid for extended periods?", "options": [{"id": "a", "text": "Supine with prolonged pressure on the sacrum"}, {"id": "b", "text": "Left lateral with a pillow between the knees"}, {"id": "c", "text": "Prone with pillows supporting the hips"}, {"id": "d", "text": "Right lateral with heels elevated off the bed"}], "correct": ["a"], "explanation": "Prolonged supine positioning places direct, sustained pressure on the sacrum, worsening an existing pressure injury there; lateral or prone positioning off-loads that area."}, {"id": 95, "cat": "mobility", "type": "mc", "prompt": "A nurse is teaching a client about why the nurse uses a slide board for transfers. Which statement should the nurse include?", "options": [{"id": "a", "text": "It lets us move you sideways between surfaces without lifting you."}, {"id": "b", "text": "It's used to help you stand up from a seated position."}, {"id": "c", "text": "It's placed under your feet to improve your balance while walking."}, {"id": "d", "text": "It replaces the need for a gait belt during ambulation."}], "correct": ["a"], "explanation": "A slide board allows a lateral transfer (e.g., gurney to bed) of an immobile client without staff having to lift the client's full weight."}, {"id": 96, "cat": "mobility", "type": "mc", "prompt": "A nurse is teaching a client the purpose of the Trendelenburg position. Which statement indicates understanding?", "options": [{"id": "a", "text": "Having the foot of my bed higher than my head helps blood return to my heart."}, {"id": "b", "text": "This position helps my lungs expand more fully."}, {"id": "c", "text": "This position takes pressure off my hips and sacrum."}, {"id": "d", "text": "This position helps prevent contractures in my knees."}], "correct": ["a"], "explanation": "The Trendelenburg position (foot of bed higher than head) promotes venous return and drainage of the lower lung lobes."}, {"id": 97, "cat": "mobility", "type": "sata", "prompt": "A nurse is selecting a position for a client recovering from abdominal surgery who reports difficulty taking deep breaths. Which position characteristics should the nurse prioritize?", "options": [{"id": "a", "text": "Head of bed elevated 45 degrees"}, {"id": "b", "text": "Foot of bed elevated above the head"}, {"id": "c", "text": "Lying flat with head turned to one side"}, {"id": "d", "text": "Semi-seated positioning"}, {"id": "e", "text": "Full extension of the hips and knees"}], "correct": ["a", "d"], "explanation": "Fowler's-type positioning (head of bed elevated, semi-seated) promotes lung expansion, which helps a client having difficulty breathing deeply. Trendelenburg and prone positioning do not address this need."}, {"id": 98, "cat": "mobility", "type": "mc", "prompt": "A nurse is applying a warm compress to a client's abdomen who has a heating pad prescription. The nurse notes the client has an implanted pacemaker. Which action should the nurse take first?", "options": [{"id": "a", "text": "Avoid placing the heat application directly over the device"}, {"id": "b", "text": "Apply the heat application as prescribed without changes"}, {"id": "c", "text": "Increase the temperature of the heat application"}, {"id": "d", "text": "Apply the heat application for a longer duration than prescribed"}], "correct": ["a"], "explanation": "Heat should not be applied directly over metal medical devices such as pacemakers or prosthetic joints, as this can cause deep tissue burns."}, {"id": 99, "cat": "mobility", "type": "mc", "prompt": "A nurse is teaching a client about ankle pump exercises. Which statement should the nurse include?", "options": [{"id": "a", "text": "Point your toes toward your head, then away from your head, to help pump blood back to your heart."}, {"id": "b", "text": "These exercises are meant to strengthen your grip."}, {"id": "c", "text": "Perform these exercises only once a day."}, {"id": "d", "text": "These exercises replace the need for compression stockings."}], "correct": ["a"], "explanation": "Ankle pumps (pointing toes toward and away from the head) contract the calf muscles, which helps promote venous return \u2014 they're recommended hourly while awake, not just once daily, and don't replace prescribed compression devices."}, {"id": 100, "cat": "mobility", "type": "mc", "prompt": "A nurse is teaching a client who had a suspected DVT identified in one leg. Which statement by the client indicates understanding of the teaching?", "options": [{"id": "a", "text": "I should avoid massaging or rubbing the affected area."}, {"id": "b", "text": "I should massage the area to help break up the clot."}, {"id": "c", "text": "I should keep the leg lower than my heart."}, {"id": "d", "text": "I should apply firm pressure to the area throughout the day."}], "correct": ["a"], "explanation": "Massaging or applying pressure to a suspected clot can dislodge it, risking a pulmonary embolism; the leg should instead be elevated and the provider notified."}, {"id": 101, "cat": "hygiene", "type": "mc", "prompt": "A nurse enters a client's room to start an IV catheter. Which action should the nurse take first?", "options": [{"id": "a", "text": "Apply alcohol-based hand sanitizer"}, {"id": "b", "text": "Wash hands with soap and water for 5 seconds"}, {"id": "c", "text": "Put on gloves without performing hand hygiene"}, {"id": "d", "text": "Ask the client to leave the room"}], "correct": ["a"], "explanation": "Alcohol-based hand sanitizer should be used just before touching a client or performing a sterile technique like IV insertion, unless hands are visibly soiled."}, {"id": 102, "cat": "hygiene", "type": "mc", "prompt": "A charge nurse is teaching a nursing student about the layers of the skin. Which statement by the student requires further teaching?", "options": [{"id": "a", "text": "The epidermis has its own blood supply."}, {"id": "b", "text": "The dermis contains nerves that sense pressure."}, {"id": "c", "text": "The hypodermis stores fat that insulates the body."}, {"id": "d", "text": "The epidermis is the outermost layer."}], "correct": ["a"], "explanation": "The epidermis is avascular (has no blood vessels) and receives nutrition from the dermis below it \u2014 this statement is incorrect and indicates a need for further teaching."}, {"id": 103, "cat": "hygiene", "type": "mc", "prompt": "A nursing student is explaining Langerhans cells to a classmate. Which statement indicates understanding?", "options": [{"id": "a", "text": "They travel through the body and help activate the immune response to pathogens on the skin."}, {"id": "b", "text": "They produce collagen in the dermis."}, {"id": "c", "text": "They form the hard enamel coating on teeth."}, {"id": "d", "text": "They store fat in the hypodermis."}], "correct": ["a"], "explanation": "Langerhans cells are found in the skin and participate in the early immune response by detecting invaders."}, {"id": 104, "cat": "hygiene", "type": "sata", "prompt": "A nurse is teaching new graduate nurses about when to use soap and water instead of alcohol-based hand sanitizer. Select the 3 situations that require soap and water.", "options": [{"id": "a", "text": "Hands are visibly soiled"}, {"id": "b", "text": "Before inserting an IV catheter"}, {"id": "c", "text": "After caring for a client with infectious diarrhea"}, {"id": "d", "text": "Before touching a client"}, {"id": "e", "text": "After exposure to Clostridioides difficile spores"}], "correct": ["a", "c", "e"], "explanation": "Soap and water is required when hands are visibly soiled, after caring for a client with infectious diarrhea, and after exposure to C. diff spores, because alcohol-based sanitizer doesn't kill spores effectively."}, {"id": 105, "cat": "hygiene", "type": "mc", "prompt": "A nurse removes gloves after providing wound care. Which action should the nurse take next?", "options": [{"id": "a", "text": "Perform hand hygiene"}, {"id": "b", "text": "Document the wound care"}, {"id": "c", "text": "Move directly to the next client's room"}, {"id": "d", "text": "Reapply a new pair of gloves"}], "correct": ["a"], "explanation": "Hand hygiene should be performed immediately after glove removal, before any other task, to prevent pathogen transmission."}, {"id": 106, "cat": "hygiene", "type": "mc", "prompt": "A nurse is teaching a client about HAIs (health care\u2013associated infections). Which statement should the nurse include?", "options": [{"id": "a", "text": "An HAI is an infection that develops after you're admitted to the hospital and wasn't present when you arrived."}, {"id": "b", "text": "An HAI is any infection you have before being admitted."}, {"id": "c", "text": "HAIs only occur in the intensive care unit."}, {"id": "d", "text": "HAIs cannot be prevented through hand hygiene."}], "correct": ["a"], "explanation": "HAIs develop during a client's stay in a health care facility and were not present on admission; hand hygiene is a key prevention strategy."}, {"id": 107, "cat": "hygiene", "type": "mc", "prompt": "A charge nurse asks a nursing student why mucous membranes are important. Which statement by the student shows understanding?", "options": [{"id": "a", "text": "They line passages like the respiratory and digestive tract and trap pathogens with mucus."}, {"id": "b", "text": "They only protect the skin from sunburn."}, {"id": "c", "text": "They produce the hard enamel on teeth."}, {"id": "d", "text": "They store calcium for the bones."}], "correct": ["a"], "explanation": "Mucous membranes line body passages open to the outside environment and secrete mucus that traps pathogens and particles."}, {"id": 108, "cat": "hygiene", "type": "mc", "prompt": "A nurse is preparing to bathe a client who cannot ambulate to the bathroom. Which type of bath should the nurse anticipate providing?", "options": [{"id": "a", "text": "Complete bed bath"}, {"id": "b", "text": "Therapeutic bath"}, {"id": "c", "text": "Partial bath only"}, {"id": "d", "text": "No bath is needed"}], "correct": ["a"], "explanation": "A complete bed bath is given to clients unable to ambulate to the bathroom and bathe themselves."}, {"id": 109, "cat": "hygiene", "type": "mc", "prompt": "A nurse is teaching a new assistive personnel about bathing a client at risk for DVT. Which statement requires further teaching?", "options": [{"id": "a", "text": "I'll use firm, deep strokes over the lower extremities."}, {"id": "b", "text": "I'll wash the arms distal to proximal."}, {"id": "c", "text": "I'll use light strokes over the lower extremities."}, {"id": "d", "text": "I'll change the water if it becomes cool or soapy."}], "correct": ["a"], "explanation": "Firm, deep strokes should be avoided over the lower extremities of a client with a history of DVT; light strokes are used instead to avoid dislodging a clot."}, {"id": 110, "cat": "hygiene", "type": "mc", "prompt": "A nurse educator is teaching about CHG bathing. Which statement by a new nurse indicates understanding?", "options": [{"id": "a", "text": "I'll massage the CHG cloths over all of the client's skin except the face."}, {"id": "b", "text": "I'll apply CHG cloths only to the client's face."}, {"id": "c", "text": "CHG bathing replaces the need for hand hygiene."}, {"id": "d", "text": "CHG bathing is only used for ambulatory clients."}], "correct": ["a"], "explanation": "CHG (chlorhexidine gluconate) bathing involves massaging premoistened cloths over all skin except the face, and is commonly used to reduce infection risk in high-risk units like the ICU."}, {"id": 111, "cat": "hygiene", "type": "mc", "prompt": "A nurse is washing a client's arm during a bed bath. Which technique should the nurse use?", "options": [{"id": "a", "text": "Wash from the hand toward the shoulder"}, {"id": "b", "text": "Wash from the shoulder toward the hand"}, {"id": "c", "text": "Wash in random, circular motions"}, {"id": "d", "text": "Wash only the palm of the hand"}], "correct": ["a"], "explanation": "Washing distal to proximal (hand toward shoulder) facilitates venous blood return."}, {"id": 112, "cat": "hygiene", "type": "sata", "prompt": "A nurse is caring for a client who has deep skin folds related to a higher body weight. Which nursing actions should the nurse plan to include?", "options": [{"id": "a", "text": "Wash the skin folds with a pH-balanced liquid soap"}, {"id": "b", "text": "Leave the skin folds moist to prevent irritation"}, {"id": "c", "text": "Lightly dab the skin dry after washing"}, {"id": "d", "text": "Assess the folds for rash or breakdown regularly"}, {"id": "e", "text": "Avoid washing between skin folds"}], "correct": ["a", "c", "d"], "explanation": "Skin folds should be washed with pH-balanced soap, dried gently (dabbed, not rubbed), and assessed regularly for rash or breakdown. Leaving them moist or avoiding washing increases infection risk."}, {"id": 113, "cat": "hygiene", "type": "mc", "prompt": "A charge nurse is teaching a nursing student about the risk of using a bath basin during hospitalization. Which statement should the charge nurse include?", "options": [{"id": "a", "text": "Bath basins have been shown to harbor pathogens that can spread between clients."}, {"id": "b", "text": "Bath basins eliminate the risk of skin breakdown."}, {"id": "c", "text": "Bath basins are always safer than no-rinse cleansing products."}, {"id": "d", "text": "Bath basins prevent the need for hand hygiene during bathing."}], "correct": ["a"], "explanation": "Bath basins have been shown to be contaminated with pathogens and can aid in transferring them within a health care setting."}, {"id": 114, "cat": "hygiene", "type": "mc", "prompt": "A nurse is teaching about the order of a complete bed bath. Which statement by the student indicates understanding?", "options": [{"id": "a", "text": "I'll wash the face first, then work from the trunk down to the lower extremities."}, {"id": "b", "text": "I'll wash the perineal area first to save time."}, {"id": "c", "text": "I'll wash the feet first, then work upward."}, {"id": "d", "text": "The order doesn't matter as long as everything gets washed."}], "correct": ["a"], "explanation": "A bed bath follows a clean-to-dirty, head-to-toe order: face first, then trunk/upper extremities, then lower extremities, with perineal care typically performed last."}, {"id": 115, "cat": "hygiene", "type": "mc", "prompt": "A nurse is caring for an unconscious client who requires oral hygiene. Which action should the nurse take first?", "options": [{"id": "a", "text": "Position the client on their side with the head turned toward the mattress"}, {"id": "b", "text": "Place two fingers in the client's mouth to hold it open"}, {"id": "c", "text": "Provide oral care with the client positioned flat on their back"}, {"id": "d", "text": "Skip oral care since the client is unconscious"}], "correct": ["a"], "explanation": "Positioning an unconscious client on their side with the head turned toward the mattress allows secretions to drain out and reduces aspiration risk before beginning oral care."}, {"id": 116, "cat": "hygiene", "type": "mc", "prompt": "A nurse is teaching a client about denture care. Which statement by the client requires further teaching?", "options": [{"id": "a", "text": "I'll brush my dentures with my regular toothpaste."}, {"id": "b", "text": "I'll store my dentures in a labeled cup with water."}, {"id": "c", "text": "I'll handle my dentures carefully since they can break."}, {"id": "d", "text": "I'll rinse my dentures with cool water after brushing."}], "correct": ["a"], "explanation": "Regular toothpaste is abrasive and can damage denture surfaces; denture-specific toothpaste should be used instead."}, {"id": 117, "cat": "hygiene", "type": "mc", "prompt": "A nurse is teaching a nursing student how to remove a client's upper denture. Which statement indicates understanding?", "options": [{"id": "a", "text": "I'll pull the upper denture down and out at the front to break the seal."}, {"id": "b", "text": "I'll push the upper denture up and out at the front."}, {"id": "c", "text": "I'll pull the upper denture straight back toward the throat."}, {"id": "d", "text": "I'll twist the upper denture side to side."}], "correct": ["a"], "explanation": "The upper denture is removed by pulling down and out at the front, which breaks the seal between the denture and the roof of the mouth."}, {"id": 118, "cat": "hygiene", "type": "sata", "prompt": "A nurse is caring for a client on a ventilator. Select the 2 actions the nurse should take to help prevent ventilator-associated pneumonia.", "options": [{"id": "a", "text": "Perform regular oral hygiene, including brushing the teeth"}, {"id": "b", "text": "Withhold all mouth care while the client is intubated"}, {"id": "c", "text": "Suction oral secretions as needed"}, {"id": "d", "text": "Leave the head of the bed flat at all times"}, {"id": "e", "text": "Apply lotion to the lips only"}], "correct": ["a", "c"], "explanation": "Regular oral hygiene and suctioning secretions both help reduce the bacterial load that can travel into the lungs through the artificial airway, lowering VAP risk."}, {"id": 119, "cat": "hygiene", "type": "mc", "prompt": "A nurse is assisting a client with fragile oral mucosa to brush their teeth. Which action should the nurse take?", "options": [{"id": "a", "text": "Use gentle brushing and flossing technique"}, {"id": "b", "text": "Use a firm-bristle toothbrush for a more thorough clean"}, {"id": "c", "text": "Brush vigorously to remove all plaque quickly"}, {"id": "d", "text": "Avoid oral care altogether to prevent bleeding"}], "correct": ["a"], "explanation": "Clients with fragile oral mucosa require gentle brushing and flossing to clean effectively without causing trauma or bleeding."}, {"id": 120, "cat": "hygiene", "type": "mc", "prompt": "A nurse is teaching a client about gingivitis. Which statement should the nurse include?", "options": [{"id": "a", "text": "It's inflammation of the gums caused by plaque buildup, and it can progress to a more serious infection if untreated."}, {"id": "b", "text": "It's a hardening of the tooth enamel."}, {"id": "c", "text": "It only affects clients who wear dentures."}, {"id": "d", "text": "It's unrelated to oral hygiene habits."}], "correct": ["a"], "explanation": "Gingivitis is gum inflammation from plaque caused by poor oral hygiene, and can progress to periodontitis if not addressed."}, {"id": 121, "cat": "hygiene", "type": "sata", "prompt": "A nurse is providing oral care for a client who can participate independently. Which actions should the nurse encourage the client to perform?", "options": [{"id": "a", "text": "Brush all surfaces of the teeth, front and back"}, {"id": "b", "text": "Brush the surface of the tongue"}, {"id": "c", "text": "Skip flossing since brushing is sufficient"}, {"id": "d", "text": "Rinse with mouthwash after brushing and flossing"}, {"id": "e", "text": "Avoid rinsing with water after brushing"}], "correct": ["a", "b", "d"], "explanation": "Brushing all tooth surfaces and the tongue, followed by flossing and a mouthwash rinse, are all recommended oral hygiene steps for an independent client."}, {"id": 122, "cat": "hygiene", "type": "mc", "prompt": "A nurse is providing foot care for a client who has diabetes mellitus and a history of peripheral neuropathy. Which action should the nurse avoid?", "options": [{"id": "a", "text": "Soaking the client's feet in a basin of water"}, {"id": "b", "text": "Washing the feet with warm water and mild soap"}, {"id": "c", "text": "Drying thoroughly between the toes"}, {"id": "d", "text": "Inspecting the feet for redness or cuts"}], "correct": ["a"], "explanation": "Soaking the feet of a client with neuropathy or diabetes should be avoided \u2014 it can cause maceration and softening of the skin, increasing infection risk."}, {"id": 123, "cat": "hygiene", "type": "mc", "prompt": "A nurse is teaching a client with diabetes about foot care. Which statement by the client requires further teaching?", "options": [{"id": "a", "text": "I'll apply lotion between my toes to keep the skin soft."}, {"id": "b", "text": "I'll wear clean cotton socks every day."}, {"id": "c", "text": "I'll check my shoes for objects or rough seams before putting them on."}, {"id": "d", "text": "I'll cut my toenails straight across."}], "correct": ["a"], "explanation": "Lotion should never be applied between the toes \u2014 the added moisture increases the risk of fungal infection."}, {"id": 124, "cat": "hygiene", "type": "mc", "prompt": "A nurse is teaching a client about nail hygiene. Which statement by the client indicates understanding?", "options": [{"id": "a", "text": "Keeping my nails trimmed short helps reduce the germs that build up underneath them."}, {"id": "b", "text": "Longer nails are cleaner because there's more surface to wash."}, {"id": "c", "text": "Nail length doesn't affect how many germs are on my hands."}, {"id": "d", "text": "I should round the edges of my nails as much as possible when trimming."}], "correct": ["a"], "explanation": "Longer nails have been shown to harbor more germs than shorter nails; trimming nails short and cleaning underneath is recommended."}, {"id": 125, "cat": "hygiene", "type": "sata", "prompt": "A nurse is inspecting a client's feet during a routine assessment. Which findings should the nurse report to the provider?", "options": [{"id": "a", "text": "A small cut between the toes"}, {"id": "b", "text": "Even coloring on both feet"}, {"id": "c", "text": "A blister on the heel"}, {"id": "d", "text": "Cracked, dry skin on both heels"}, {"id": "e", "text": "Warm, dry skin with no lesions"}], "correct": ["a", "c", "d"], "explanation": "Cuts, blisters, and cracked skin are abnormal findings that increase infection risk and should be reported. Even coloring and warm, intact, dry skin are normal findings."}, {"id": 126, "cat": "hygiene", "type": "mc", "prompt": "A nurse is preparing to trim a client's toenails. Facility policy requires a podiatrist to trim nails for clients with diabetes. Which action should the nurse take?", "options": [{"id": "a", "text": "Refer the client to a podiatrist for nail trimming"}, {"id": "b", "text": "Trim the nails as requested by the client"}, {"id": "c", "text": "Soak the feet and trim the nails regardless of policy"}, {"id": "d", "text": "Delegate the task to unlicensed assistive personnel"}], "correct": ["a"], "explanation": "When facility policy restricts nail trimming for at-risk clients, such as those with diabetes, to a qualified professional, the nurse should follow that policy and refer accordingly."}, {"id": 127, "cat": "hygiene", "type": "mc", "prompt": "A nurse is teaching a client about proper toenail trimming technique. Which statement indicates understanding?", "options": [{"id": "a", "text": "I'll cut my toenails straight across and file any sharp edges."}, {"id": "b", "text": "I'll round the corners of my toenails when trimming."}, {"id": "c", "text": "I'll cut my toenails as short as possible, close to the skin."}, {"id": "d", "text": "I'll avoid filing any rough edges after trimming."}], "correct": ["a"], "explanation": "Cutting toenails straight across and filing sharp edges reduces the risk of ingrown toenails."}, {"id": 128, "cat": "hygiene", "type": "mc", "prompt": "A nurse is caring for a client who has a known open wound on the foot and a prescription for foot care. Which action should the nurse take first?", "options": [{"id": "a", "text": "Consult with the health care team before immersing the foot in a water basin"}, {"id": "b", "text": "Immerse the foot in warm water as routinely done"}, {"id": "c", "text": "Apply lotion directly into the open wound"}, {"id": "d", "text": "Skip the consultation and proceed with standard foot care"}], "correct": ["a"], "explanation": "For a client with a known wound, the nurse should confirm orders for wound care with the health care team before immersing the foot in water, since soaking may not be advisable."}, {"id": 129, "cat": "hygiene", "type": "mc", "prompt": "A nurse is performing perineal care for a female client. Which technique should the nurse use?", "options": [{"id": "a", "text": "Clean from front to back"}, {"id": "b", "text": "Clean from back to front"}, {"id": "c", "text": "Clean in a random pattern"}, {"id": "d", "text": "Clean using the same area of the washcloth for the entire procedure"}], "correct": ["a"], "explanation": "Perineal care for a female client should move front to back (anterior to posterior) to avoid moving bacteria from the rectal area toward the urethra."}, {"id": 130, "cat": "hygiene", "type": "mc", "prompt": "A nurse is teaching a new nurse about perineal care for an uncircumcised male client. Which statement requires further teaching?", "options": [{"id": "a", "text": "I'll leave the foreskin retracted after cleaning to allow it to air dry."}, {"id": "b", "text": "I'll retract the foreskin before cleaning underneath it."}, {"id": "c", "text": "I'll return the foreskin to its natural position after cleaning."}, {"id": "d", "text": "I'll clean the tip of the penis in a circular motion, working outward."}], "correct": ["a"], "explanation": "The foreskin should always be returned to its natural position after cleaning \u2014 leaving it retracted can cause constriction, swelling, and pain."}, {"id": 131, "cat": "hygiene", "type": "mc", "prompt": "A nurse is teaching a nursing student about indwelling catheter care. Which statement indicates understanding of the correct order?", "options": [{"id": "a", "text": "I'll clean the genital area first, then the meatus, then the catheter moving away from the body."}, {"id": "b", "text": "I'll clean the catheter first, then the meatus, then the genital area."}, {"id": "c", "text": "I'll clean all areas simultaneously with one pass of the washcloth."}, {"id": "d", "text": "I'll clean the catheter moving toward the body."}], "correct": ["a"], "explanation": "Catheter care proceeds clean to dirty: genital area first, then the meatus where the catheter enters, then the catheter itself, cleaning away from the client's body."}, {"id": 132, "cat": "hygiene", "type": "sata", "prompt": "A nurse is gathering supplies to perform perineal care. Which items should the nurse obtain?", "options": [{"id": "a", "text": "Waterproof pad"}, {"id": "b", "text": "Facility-approved perineal wipes or cleanser"}, {"id": "c", "text": "Sterile gloves"}, {"id": "d", "text": "Washcloths and towels"}, {"id": "e", "text": "Cotton swabs"}], "correct": ["a", "b", "d"], "explanation": "A waterproof pad, cleanser/wipes, and washcloths/towels are standard perineal care supplies. Sterile gloves and cotton swabs are not required for routine perineal care."}, {"id": 133, "cat": "hygiene", "type": "mc", "prompt": "A nurse is preparing to perform perineal care for a client and needs to determine positioning. Which position is ideal for a female client who is able to tolerate it?", "options": [{"id": "a", "text": "Dorsal recumbent"}, {"id": "b", "text": "Prone"}, {"id": "c", "text": "High-Fowler's with legs extended straight"}, {"id": "d", "text": "Left lateral only"}], "correct": ["a"], "explanation": "The dorsal recumbent position (lying on the back with knees bent) provides ideal access to the perineum for care, if the client is able to tolerate it."}, {"id": 134, "cat": "hygiene", "type": "mc", "prompt": "A nurse is teaching a new nurse about perineal care technique for a female client. Which statement requires further teaching?", "options": [{"id": "a", "text": "I'll use the same section of the washcloth for each downward pass over the labia."}, {"id": "b", "text": "I'll separate the labia with my nondominant hand to clean the labia minora."}, {"id": "c", "text": "I'll rinse the perineum and gently pat it dry when finished."}, {"id": "d", "text": "I'll wash the labia majora from front to back first."}], "correct": ["a"], "explanation": "A new, unused section of the washcloth should be used for each downward pass to prevent spreading microorganisms \u2014 reusing the same section requires further teaching."}, {"id": 135, "cat": "hygiene", "type": "mc", "prompt": "A nurse is assisting a client who had a left-sided stroke with dressing. Which action should the nurse take first?", "options": [{"id": "a", "text": "Place clothing on the affected (right) side using the unaffected arm"}, {"id": "b", "text": "Place clothing on the unaffected side first"}, {"id": "c", "text": "Ask the client to dress independently without assistance"}, {"id": "d", "text": "Undress the affected side first"}], "correct": ["a"], "explanation": "When dressing a client after a stroke, the unaffected arm is used to place clothing on the affected side first; when undressing, the unaffected side is removed first."}, {"id": 136, "cat": "hygiene", "type": "mc", "prompt": "A nurse is teaching a client with a spinal cord injury about safe bathing. Which statement should the nurse include?", "options": [{"id": "a", "text": "Always check the water temperature carefully since you may have reduced ability to sense heat."}, {"id": "b", "text": "Water temperature doesn't need special attention."}, {"id": "c", "text": "You should bathe in water as hot as you can tolerate."}, {"id": "d", "text": "Reduced sensation only affects your ability to feel cold water."}], "correct": ["a"], "explanation": "Spinal cord injuries can impair the ability to sense temperature, increasing the risk of burns \u2014 water temperature should always be checked carefully before bathing."}, {"id": 137, "cat": "hygiene", "type": "mc", "prompt": "A nurse is teaching a caregiver about diaper dermatitis. Which statement by the caregiver indicates understanding?", "options": [{"id": "a", "text": "I'll change the diaper frequently and use a soap-free cleanser on the skin."}, {"id": "b", "text": "I'll leave the diaper on longer between changes to avoid irritation."}, {"id": "c", "text": "I'll use a scented baby wipe with alcohol to clean the area."}, {"id": "d", "text": "I'll avoid using any barrier product on the skin."}], "correct": ["a"], "explanation": "Frequent diaper changes and a soap-free cleanser decrease skin exposure to urine and feces, which is the core treatment for diaper dermatitis, along with a topical emollient barrier."}, {"id": 138, "cat": "hygiene", "type": "mc", "prompt": "A nurse reviews a client's notes. 0700: Client has dementia, refuses morning shower, becomes agitated when approached about bathing. 0730: Client is calm and cooperative after breakfast. Based on this information, which approach should the nurse try next?", "options": [{"id": "a", "text": "Offer to bathe the client on the commode after their next bowel movement, when calmer"}, {"id": "b", "text": "Insist the client shower immediately at 0700 as originally scheduled"}, {"id": "c", "text": "Document the refusal and skip bathing for the entire week"}, {"id": "d", "
