<script>
var catLabels = {
  basicsintegumentary: "Basics & Integumentary",

  neuromentalstatus: "Neuro & Mental Status"

var bank = [
{"id": "w7ih-q01", "cat": "basicsintegumentary", "type": "mc", "stem": "A nurse is performing an integumentary assessment on a group of clients. Which finding is the nurse's priority?", "options": [{"text": "Pallor of the conjunctivae", "correct": false, "rationale": "Pallor can reflect anemia or decreased blood flow and needs follow-up, but it does not point to an immediate airway or breathing problem."}, {"text": "Yellow sclera", "correct": false, "rationale": "Jaundice suggests liver dysfunction or RBC destruction. It matters, but it is not an immediate threat to oxygenation."}, {"text": "Bluish discoloration of the lips and nail beds", "correct": true, "rationale": "Cyanosis indicates hypoxia. Using the ABCs, impaired oxygenation is the priority finding."}, {"text": "Redness over the sacrum", "correct": false, "rationale": "Erythema signals inflammation or pressure and needs assessment, but it is lower priority than a sign of hypoxia."}]},
{"id": "w7ih-q02", "cat": "basicsintegumentary", "type": "mc", "stem": "A nurse is assessing a client's skin temperature. Which technique should the nurse use?", "options": [{"text": "Palpate with the fingertips", "correct": false, "rationale": "Fingertips are used to assess texture and moisture, not temperature."}, {"text": "Palpate with the palm of the hand", "correct": false, "rationale": "The palm is less sensitive to temperature changes than the back of the hand."}, {"text": "Palpate with the dorsal surface of the hand", "correct": true, "rationale": "The dorsal (back) surface of the hand is the most sensitive to temperature, so it is the only part used to assess skin temperature."}, {"text": "Use a tympanic thermometer on the area", "correct": false, "rationale": "A thermometer measures core body temperature, not localized skin temperature."}]},
{"id": "w7ih-q03", "cat": "basicsintegumentary", "type": "sata", "stem": "A nurse notes edema in a client's left lower leg only. Which conditions should the nurse recognize as possible causes of unilateral edema? Select all that apply.", "options": [{"text": "Deep vein thrombosis", "correct": true, "rationale": "Unilateral edema can indicate a DVT; measure the limb and look for erythema and tenderness."}, {"text": "Inflammation", "correct": true, "rationale": "Localized inflammation can cause swelling on one side."}, {"text": "Lymphedema", "correct": true, "rationale": "Impaired lymph drainage on one side causes unilateral edema."}, {"text": "Fluid volume excess", "correct": false, "rationale": "Fluid volume excess causes bilateral edema, not edema on one side."}, {"text": "Venous insufficiency", "correct": false, "rationale": "Venous insufficiency generally causes bilateral edema."}]},
{"id": "w7ih-q04", "cat": "basicsintegumentary", "type": "mc", "stem": "A nurse presses over a client's medial malleolus for 5 seconds and finds a 4 mm indentation that rebounds in about 12 seconds. How should the nurse document this finding?", "options": [{"text": "1+ edema", "correct": false, "rationale": "1+ edema is trace, about 2 mm, with a rapid skin response."}, {"text": "2+ edema", "correct": true, "rationale": "2+ edema is mild, about 4 mm, with a 10–15 second response."}, {"text": "3+ edema", "correct": false, "rationale": "3+ edema is moderate, about 6 mm, with a prolonged response."}, {"text": "4+ edema", "correct": false, "rationale": "4+ edema is severe, about 8 mm, with a prolonged response."}]},
{"id": "w7ih-q05", "cat": "basicsintegumentary", "type": "mc", "stem": "A nurse pinches a skin fold over a client's sternum and it stays raised for several seconds. Which condition does this finding indicate?", "options": [{"text": "Fluid volume excess", "correct": false, "rationale": "Fluid volume excess causes edema, not delayed skin recoil."}, {"text": "Dehydration", "correct": true, "rationale": "Tenting, a skin fold that stays raised, indicates poor turgor from dehydration and increases the risk of skin breakdown."}, {"text": "Expected finding", "correct": false, "rationale": "Well-hydrated skin returns to its original position within a few seconds."}, {"text": "Arterial insufficiency", "correct": false, "rationale": "Arterial insufficiency causes shiny, hairless skin, not tenting."}]},
{"id": "w7ih-q06", "cat": "basicsintegumentary", "type": "mc", "stem": "A nurse observes that a client's nail angle is greater than 160°. Which condition should the nurse suspect?", "options": [{"text": "Fungal infection", "correct": false, "rationale": "Fungal infection causes thick, yellow nails with ragged edges, not an increased nail angle."}, {"text": "Anemia", "correct": false, "rationale": "Anemia can cause pale nail beds but does not change the nail angle."}, {"text": "Chronic low oxygen saturation", "correct": true, "rationale": "A nail angle over 160° is clubbing, which results from chronic low oxygen saturation related to heart or lung disease."}, {"text": "Dehydration", "correct": false, "rationale": "Dehydration affects skin turgor and mucous membranes, not the nail angle."}]},
{"id": "w7ih-q07", "cat": "basicsintegumentary", "type": "sata", "stem": "A nurse is preparing to assess skin turgor in an adult client. Which sites can the nurse use? Select all that apply.", "options": [{"text": "Clavicle", "correct": true, "rationale": "Pinching a skin fold over the clavicle is an accepted turgor site."}, {"text": "Sternum", "correct": true, "rationale": "The sternum is an accepted turgor site."}, {"text": "Back of the hand", "correct": true, "rationale": "The back of the hand is an accepted turgor site."}, {"text": "Earlobe", "correct": false, "rationale": "The earlobe is not used to assess turgor."}, {"text": "Palm of the hand", "correct": false, "rationale": "The palm has thick skin and is not used to assess turgor."}]},
{"id": "w7ih-q08", "cat": "heent", "type": "dragdrop", "stem": "A nurse is performing an eye examination on an adult client. Drag the findings that are expected into the answer box.", "leftLabel": "Eye findings", "rightLabel": "Expected findings", "options": [{"text": "Pupils equal, round, and reactive to light and accommodation", "correct": true, "rationale": "PERRLA is the expected pupil finding."}, {"text": "Parallel eye movements", "correct": true, "rationale": "The eyes should move together in parallel."}, {"text": "Eyelids open and close completely and symmetrically", "correct": true, "rationale": "Complete, symmetric lid movement is expected."}, {"text": "Clear lens", "correct": true, "rationale": "The lens is expected to be clear; a cloudy lens suggests cataracts."}, {"text": "Light yellow sclera in a client with dark skin", "correct": true, "rationale": "The sclera is white, or light yellow in clients with darker skin."}, {"text": "Loss of visual fields", "correct": false, "rationale": "Loss of visual fields is an abnormal finding."}, {"text": "Asymmetric light reflex", "correct": false, "rationale": "The light reflex should be symmetric."}, {"text": "Periorbital edema", "correct": false, "rationale": "Swelling around the eyes is abnormal."}, {"text": "Drainage from the eye", "correct": false, "rationale": "Drainage from the ocular region is abnormal."}]},
{"id": "w7ih-q09", "cat": "heent", "type": "mc", "stem": "A client asks what a visual acuity of 20/30 means. Which response by the nurse is correct?", "options": [{"text": "\"Your eyes see at 20 feet what visually unimpaired eyes see at 30 feet.\"", "correct": true, "rationale": "The first number is the distance from the chart; the second is the distance at which an unimpaired eye sees the same line."}, {"text": "\"Your eyes see at 30 feet what visually unimpaired eyes see at 20 feet.\"", "correct": false, "rationale": "This reverses the numbers. The first number is always the client's distance from the chart."}, {"text": "\"Your right eye sees clearly at 20 feet and your left eye at 30 feet.\"", "correct": false, "rationale": "Each eye has its own two-number result; the numbers are not one per eye."}, {"text": "\"You can read 20 of the 30 letters on the chart.\"", "correct": false, "rationale": "The numbers are distances in feet, not a count of letters."}]},
{"id": "w7ih-q10", "cat": "heent", "type": "mc", "stem": "Which tympanic membrane finding should the nurse document as expected?", "options": [{"text": "Red and bulging", "correct": false, "rationale": "A red, bulging membrane with an obliterated cone of light suggests a middle ear infection."}, {"text": "Pearly gray with a cone of light", "correct": true, "rationale": "An intact, pearly gray membrane with a cone-shaped light reflex is expected."}, {"text": "Yellow with a visible perforation", "correct": false, "rationale": "A perforation (tear) is unexpected."}, {"text": "Dull with no visible landmarks", "correct": false, "rationale": "The umbo and manubrium are expected to be visible."}]},
{"id": "w7ih-q11", "cat": "heent", "type": "mc", "stem": "A nurse performs a Rinne test. Which result is expected?", "options": [{"text": "Bone conduction lasts twice as long as air conduction", "correct": false, "rationale": "This reverses the expected finding."}, {"text": "Air conduction lasts twice as long as bone conduction", "correct": true, "rationale": "The expected Rinne result is AC > BC in a 2:1 ratio."}, {"text": "Sound is heard equally in both ears", "correct": false, "rationale": "Equal sound in both ears is the expected Weber result, not the Rinne result."}, {"text": "Sound lateralizes to the better ear", "correct": false, "rationale": "Lateralization is assessed with the Weber test."}]},
{"id": "w7ih-q12", "cat": "cranialnerves", "type": "dragdrop", "stem": "A nurse is reviewing cranial nerve function. Drag the cranial nerves that have only sensory function into the answer box.", "leftLabel": "Cranial nerves", "rightLabel": "Sensory only", "options": [{"text": "CN I (Olfactory)", "correct": true, "rationale": "The olfactory nerve is sensory only (smell)."}, {"text": "CN II (Optic)", "correct": true, "rationale": "The optic nerve is sensory only (visual acuity and fields)."}, {"text": "CN VIII (Auditory)", "correct": true, "rationale": "The auditory nerve is sensory only (hearing and balance)."}, {"text": "CN III (Oculomotor)", "correct": false, "rationale": "The oculomotor nerve is motor only."}, {"text": "CN V (Trigeminal)", "correct": false, "rationale": "The trigeminal nerve is both sensory and motor."}, {"text": "CN VII (Facial)", "correct": false, "rationale": "The facial nerve is both sensory and motor."}, {"text": "CN XI (Spinal accessory)", "correct": false, "rationale": "The spinal accessory nerve is motor only."}, {"text": "CN XII (Hypoglossal)", "correct": false, "rationale": "The hypoglossal nerve is motor only."}]},
{"id": "w7ih-q13", "cat": "cranialnerves", "type": "dragdrop", "stem": "Drag the cranial nerves that have only motor function into the answer box.", "leftLabel": "Cranial nerves", "rightLabel": "Motor only", "options": [{"text": "CN III (Oculomotor)", "correct": true, "rationale": "The oculomotor nerve is motor (eye movement, pupil constriction, eyelid elevation)."}, {"text": "CN IV (Trochlear)", "correct": true, "rationale": "The trochlear nerve is motor (eye movement)."}, {"text": "CN VI (Abducens)", "correct": true, "rationale": "The abducens nerve is motor (eye movement)."}, {"text": "CN XI (Spinal accessory)", "correct": true, "rationale": "The spinal accessory nerve is motor (shrugging shoulders, turning the head)."}, {"text": "CN XII (Hypoglossal)", "correct": true, "rationale": "The hypoglossal nerve is motor (tongue movement)."}, {"text": "CN II (Optic)", "correct": false, "rationale": "The optic nerve is sensory only."}, {"text": "CN V (Trigeminal)", "correct": false, "rationale": "The trigeminal nerve is both sensory and motor."}, {"text": "CN IX (Glossopharyngeal)", "correct": false, "rationale": "The glossopharyngeal nerve is both sensory and motor."}, {"text": "CN X (Vagus)", "correct": false, "rationale": "The vagus nerve is both sensory and motor."}]},
{"id": "w7ih-q14", "cat": "cranialnerves", "type": "mc", "stem": "A nurse is testing the sensory function of cranial nerve V during a competency check-off. Which action should the nurse take?", "options": [{"text": "Ask the client to puff out their cheeks", "correct": false, "rationale": "Puffing out the cheeks tests CN VII (facial)."}, {"text": "With the client's eyes closed, touch both sides of the forehead, cheeks, and chin with a cotton swab", "correct": true, "rationale": "CN V (trigeminal) carries sensation from the face. Test the forehead, cheeks, and chin on both sides with the eyes closed."}, {"text": "Have the client identify a scent with each nostril", "correct": false, "rationale": "Identifying a scent tests CN I (olfactory)."}, {"text": "Have the client stick out their tongue", "correct": false, "rationale": "Sticking out the tongue tests CN XII (hypoglossal)."}]},
{"id": "w7ih-q15", "cat": "cranialnerves", "type": "mc", "stem": "A nurse asks a client to smile, frown, raise their eyebrows, and close their eyes tightly. Which cranial nerve is the nurse testing?", "options": [{"text": "Trigeminal (CN V)", "correct": false, "rationale": "The trigeminal nerve controls facial sensation and jaw movement, not facial expression."}, {"text": "Facial (CN VII)", "correct": true, "rationale": "Symmetric facial expressions test the motor function of CN VII."}, {"text": "Oculomotor (CN III)", "correct": false, "rationale": "The oculomotor nerve controls eye movement, pupils, and eyelid elevation."}, {"text": "Hypoglossal (CN XII)", "correct": false, "rationale": "The hypoglossal nerve controls the tongue."}]},
{"id": "w7ih-q16", "cat": "cranialnerves", "type": "mc", "stem": "A client has difficulty swallowing. Which cranial nerve should the nurse identify as controlling swallowing?", "options": [{"text": "Glossopharyngeal (CN IX)", "correct": true, "rationale": "The glossopharyngeal nerve (with the vagus) controls swallowing and is tested with the gag reflex."}, {"text": "Trigeminal (CN V)", "correct": false, "rationale": "The trigeminal nerve controls facial sensation and chewing."}, {"text": "Trochlear (CN IV)", "correct": false, "rationale": "The trochlear nerve controls eye movement."}, {"text": "Hypoglossal (CN XII)", "correct": false, "rationale": "The hypoglossal nerve controls tongue movement, not the swallowing reflex."}]},
{"id": "w7ih-q17", "cat": "cranialnerves", "type": "mc", "stem": "A nurse places their hands on a client's shoulders and asks the client to shrug against resistance. Which cranial nerve is the nurse testing?", "options": [{"text": "Vagus (CN X)", "correct": false, "rationale": "The vagus nerve is tested with the gag reflex and soft palate movement."}, {"text": "Hypoglossal (CN XII)", "correct": false, "rationale": "The hypoglossal nerve is tested with tongue movement."}, {"text": "Spinal accessory (CN XI)", "correct": true, "rationale": "Shrugging the shoulders and turning the head against resistance test CN XI (trapezius and sternocleidomastoid)."}, {"text": "Facial (CN VII)", "correct": false, "rationale": "The facial nerve is tested with facial expressions."}]},
{"id": "w7ih-q18", "cat": "cranialnerves", "type": "mc", "stem": "A nurse is testing cranial nerve I. Why should the nurse avoid using an alcohol wipe?", "options": [{"text": "Alcohol dries the nasal mucosa", "correct": false, "rationale": "The concern is a misleading response, not drying of the mucosa."}, {"text": "Noxious odors stimulate the trigeminal nerve", "correct": true, "rationale": "Irritating odors stimulate CN V and can cause a misleading response; use a familiar, non-noxious scent such as mint or coffee."}, {"text": "Alcohol is too difficult to identify", "correct": false, "rationale": "Alcohol is easy to identify; the problem is that it stimulates CN V."}, {"text": "Alcohol can trigger the gag reflex", "correct": false, "rationale": "The gag reflex is stimulated at the back of the throat, not by smell."}]},
{"id": "w7ih-q19", "cat": "neuromentalstatus", "type": "mc", "stem": "A client responds to light shaking but is confused and slow to respond. Which level of consciousness should the nurse document?", "options": [{"text": "Lethargic", "correct": false, "rationale": "A lethargic client opens their eyes and responds but falls back asleep quickly."}, {"text": "Obtunded", "correct": true, "rationale": "An obtunded client responds to light shaking and may be confused and slow to respond."}, {"text": "Stuporous", "correct": false, "rationale": "A stuporous client needs painful stimuli for a brief response."}, {"text": "Comatose", "correct": false, "rationale": "A comatose client has no response to repeated painful stimuli."}]},
{"id": "w7ih-q20", "cat": "neuromentalstatus", "type": "mc", "stem": "A client's Glasgow Coma Scale score drops from 14 to 9 over 2 hours. How should the nurse interpret this change?", "options": [{"text": "Improving level of consciousness", "correct": false, "rationale": "On the GCS, higher scores are better; a drop means decline."}, {"text": "Declining level of consciousness", "correct": true, "rationale": "GCS ranges from 3 to 15, and a lower score indicates worsening consciousness."}, {"text": "No significant change", "correct": false, "rationale": "A 5-point drop is a significant change in consciousness."}, {"text": "Full consciousness", "correct": false, "rationale": "Only a score of 15 indicates full consciousness."}]},
{"id": "w7ih-q21", "cat": "basicsintegumentary", "type": "mc", "stem": "A nurse is preparing to listen for a low-pitched murmur. How should the nurse use the stethoscope?", "options": [{"text": "Diaphragm with firm pressure", "correct": false, "rationale": "The diaphragm with firm pressure is used for high-pitched sounds such as S1, S2, and lung and bowel sounds."}, {"text": "Bell with light pressure, with the entire rim touching the skin", "correct": true, "rationale": "The bell picks up low-pitched sounds such as murmurs, bruits, S3, and S4; heavy pressure stretches the skin and blocks them."}, {"text": "Bell pressed firmly into the skin", "correct": false, "rationale": "Firm pressure with the bell turns it into a diaphragm and filters out low-pitched sounds."}, {"text": "Diaphragm placed over the client's gown", "correct": false, "rationale": "The stethoscope should always be placed directly on the skin."}]},
{"id": "w7ih-q22", "cat": "basicsintegumentary", "type": "mc", "stem": "A nurse is obtaining a client's pulse during a head-to-toe assessment. The rhythm is regular. How should the nurse count the pulse?", "options": [{"text": "Count for 30 seconds two times", "correct": true, "rationale": "For the competency, count a regular pulse for 30 seconds twice."}, {"text": "Count for 15 seconds and multiply by 4", "correct": false, "rationale": "A 15-second count isn't the method used for the competency."}, {"text": "Count for 10 seconds and multiply by 6", "correct": false, "rationale": "A 10-second count is not accurate enough."}, {"text": "Count for a full minute only if the client is anxious", "correct": false, "rationale": "A full-minute count is used when the rhythm is irregular, not because of anxiety."}]},
{"id": "w7ih-q23", "cat": "basicsintegumentary", "type": "mc", "stem": "A nurse counts a client's pulse and notices the rhythm is irregular. Which action should the nurse take?", "options": [{"text": "Count for 30 seconds and multiply by 2", "correct": false, "rationale": "An irregular rhythm needs a longer count to be accurate."}, {"text": "Count for a full minute", "correct": true, "rationale": "An irregular pulse or respiratory rate is counted for a full 60 seconds."}, {"text": "Count for 15 seconds and multiply by 4", "correct": false, "rationale": "Short counts miss irregular beats."}, {"text": "Skip the pulse and document \"irregular\"", "correct": false, "rationale": "The rate still needs to be measured."}]},
{"id": "w7ih-q24", "cat": "basicsintegumentary", "type": "mc", "stem": "A nurse is beginning a head-to-toe assessment. Which method should the nurse use to verify the client's identity?", "options": [{"text": "Check the room number and bed number", "correct": false, "rationale": "Room numbers can change and are never used as an identifier."}, {"text": "Check the wristband and ask the client to state their name and date of birth", "correct": true, "rationale": "Verify identity with the wristband plus the client's name and DOB."}, {"text": "Ask, \"Are you Ms. Smith?\"", "correct": false, "rationale": "A yes/no question can get an incorrect \"yes.\""}, {"text": "Confirm the client's name with a family member at the bedside", "correct": false, "rationale": "The client's wristband and two identifiers are used."}]},
{"id": "w7ih-q25", "cat": "basicsintegumentary", "type": "sata", "stem": "A nurse is performing the general survey. Which components should the nurse include? Select all that apply.", "options": [{"text": "Level of consciousness and response to greeting", "correct": true, "rationale": "LOC and how the client responds to your greeting are part of the general survey."}, {"text": "Hygiene, grooming, and dress, including seasonal appropriateness", "correct": true, "rationale": "Appearance is assessed in the general survey."}, {"text": "Odors", "correct": true, "rationale": "Note any odors during the general survey."}, {"text": "Mobility aids", "correct": true, "rationale": "Mobility aids are part of the general survey."}, {"text": "Food and drug allergies", "correct": true, "rationale": "Allergies are determined during the initial assessment."}, {"text": "Bowel sounds", "correct": false, "rationale": "Bowel sounds are part of the abdominal assessment."}, {"text": "Pupil response", "correct": false, "rationale": "PERRLA is part of the head and neurological assessment."}]},
{"id": "w7ih-q26", "cat": "basicsintegumentary", "type": "mc", "stem": "A nurse finds no abnormal skin findings. Which documentation is correct?", "options": [{"text": "\"Skin is clean, dry, and intact without wounds or lesions.\"", "correct": true, "rationale": "This is the normal skin documentation from class."}, {"text": "\"Skin is normal.\"", "correct": false, "rationale": "\"Normal\" isn't descriptive enough to document."}, {"text": "\"Skin is moist throughout, including the arms and legs.\"", "correct": false, "rationale": "Moisture is expected only in the axillae and skin folds."}, {"text": "\"Skin WNL, slight tenting.\"", "correct": false, "rationale": "Tenting is an abnormal finding (dehydration)."}]},
{"id": "w7ih-q27", "cat": "heent", "type": "mc", "stem": "A nurse is checking a client's pupils for the competency. Which action should the nurse take?", "options": [{"text": "Shine the light into both eyes at the same time", "correct": false, "rationale": "Shine the light into each pupil separately and note the response."}, {"text": "Shine the light into each pupil and note the response", "correct": true, "rationale": "PERRLA is tested by shining the light into each pupil and noting the reaction."}, {"text": "Have the client read the Snellen chart", "correct": false, "rationale": "The Snellen chart tests visual acuity (CN II)."}, {"text": "Have the client follow your finger in an \"H\"", "correct": false, "rationale": "That is the six cardinal positions of gaze."}]},
{"id": "w7ih-q28", "cat": "heent", "type": "mc", "stem": "A nurse is testing the six cardinal positions of gaze. Which instruction should the nurse give?", "options": [{"text": "\"Follow my finger with your eyes and keep your head still.\"", "correct": true, "rationale": "The client follows the finger or pen with the eyes only, without moving the head."}, {"text": "\"Turn your head to follow my finger.\"", "correct": false, "rationale": "Moving the head prevents testing the eye muscles."}, {"text": "\"Cover one eye and read the smallest line.\"", "correct": false, "rationale": "That is the Snellen test."}, {"text": "\"Tell me when you see my finger come into view.\"", "correct": false, "rationale": "That describes visual fields."}]},
{"id": "w7ih-q29", "cat": "heent", "type": "mc", "stem": "A client who wears glasses is having their visual acuity tested with a Snellen chart. Which action should the nurse take?", "options": [{"text": "Test the client's uncorrected vision first", "correct": true, "rationale": "The slides say to test uncorrected vision first."}, {"text": "Test only with the glasses on", "correct": false, "rationale": "Uncorrected vision is tested first."}, {"text": "Have the client stand 10 feet away", "correct": false, "rationale": "The client stands 20 feet from the Snellen chart."}, {"text": "Test both eyes together only", "correct": false, "rationale": "Each eye is tested, then both."}]},
{"id": "w7ih-q30", "cat": "heent", "type": "dragdrop", "stem": "A nurse is assessing a client's mouth and throat. Drag the findings that are abnormal into the answer box.", "leftLabel": "Mouth findings", "rightLabel": "Abnormal findings", "options": [{"text": "Dental caries", "correct": true, "rationale": "Cavities are an abnormal finding."}, {"text": "Dry, cracked lips", "correct": true, "rationale": "Dry, cracked lips are abnormal."}, {"text": "Missing teeth", "correct": true, "rationale": "Missing teeth are an abnormal finding."}, {"text": "Pallor of the oral mucosa", "correct": true, "rationale": "Pallor, jaundice, or cyanosis of the mouth is abnormal."}, {"text": "Pink, moist mucous membranes", "correct": false, "rationale": "Pink and moist (plum in darker skin) is normal."}, {"text": "Shiny, intact teeth", "correct": false, "rationale": "Intact, shiny teeth are normal."}, {"text": "Clear speech", "correct": false, "rationale": "Clear speech is normal."}, {"text": "Gag reflex present", "correct": false, "rationale": "A normal gag reflex is expected."}]},
{"id": "w7ih-q31", "cat": "cranialnerves", "type": "mc", "stem": "A nurse is testing cranial nerve XII during the competency. Which instruction should the nurse give?", "options": [{"text": "\"Shrug your shoulders against my hands.\"", "correct": false, "rationale": "That tests CN XI."}, {"text": "\"Smile and raise your eyebrows.\"", "correct": false, "rationale": "That tests CN VII."}, {"text": "\"Stick out your tongue, then push it against the inside of each cheek.\"", "correct": true, "rationale": "CN XII (hypoglossal) controls tongue movement."}, {"text": "\"Say 'Ah.'\"", "correct": false, "rationale": "That tests CN IX and X."}]},
{"id": "w7ih-q32", "cat": "heent", "type": "mc", "stem": "A nurse is assessing a client's neck during a head-to-toe assessment. Which competency step should the nurse perform?", "options": [{"text": "Full range of motion of the neck", "correct": true, "rationale": "The checklist grades neck ROM: chin to chest, ear to shoulder, chin up, side to side."}, {"text": "Palpation of the thyroid while the client swallows", "correct": false, "rationale": "Thyroid palpation is ATI content, not a competency step."}, {"text": "Palpation of every cervical lymph node chain", "correct": false, "rationale": "Lymph nodes aren't on the competency checklist."}, {"text": "Auscultation of the thyroid with the bell", "correct": false, "rationale": "This is done only for an enlarged thyroid and isn't on the checklist."}]},
{"id": "w7ih-q33", "cat": "basicsintegumentary", "type": "dragdrop", "stem": "A nurse is teaching a class about skin lesions. Drag the lesions that are primary lesions (arising from healthy skin) into the answer box.", "leftLabel": "Skin lesions", "rightLabel": "Primary lesions", "options": [{"text": "Macule", "correct": true, "rationale": "A macule is a flat color change that arises from healthy skin, making it a primary lesion."}, {"text": "Vesicle", "correct": true, "rationale": "A vesicle is a serous fluid-filled elevation arising from healthy skin; it is a primary lesion."}, {"text": "Pustule", "correct": true, "rationale": "A pustule is a pus-filled lesion arising from healthy skin; it is a primary lesion."}, {"text": "Wheal", "correct": true, "rationale": "A wheal (such as an insect bite) is an edematous primary lesion."}, {"text": "Nodule", "correct": true, "rationale": "A nodule (such as a wart) is a firm, deep primary lesion."}, {"text": "Crust", "correct": false, "rationale": "A crust (scab) is dried blood, serum, or pus from a previous lesion; it is a secondary lesion."}, {"text": "Scale", "correct": false, "rationale": "Scale is flaking skin that develops from a change in a primary lesion; it is secondary."}, {"text": "Erosion", "correct": false, "rationale": "An erosion (such as a ruptured vesicle) results from a change in a primary lesion; it is secondary."}, {"text": "Ulcer", "correct": false, "rationale": "An ulcer is loss of epidermis and dermis; it is a secondary lesion."}]},
{"id": "w7ih-q34", "cat": "basicsintegumentary", "type": "mc", "stem": "A nurse is assessing a mole using the ABCDE system. Which finding should the nurse report?", "options": [{"text": "Symmetric round shape", "correct": false, "rationale": "Asymmetry, not symmetry, is the warning sign."}, {"text": "Smooth, even border", "correct": false, "rationale": "Border irregularity, not a smooth border, is the warning sign."}, {"text": "Diameter of 8 mm", "correct": true, "rationale": "A diameter greater than 6 mm is a warning sign for skin cancer."}, {"text": "Uniform brown color", "correct": false, "rationale": "Color variation within one lesion is the warning sign; uniform color is expected."}]},
{"id": "w7ih-q35", "cat": "basicsintegumentary", "type": "mc", "stem": "A nurse presses on a reddened area over a client's coccyx and the redness does not fade. How should the nurse interpret this finding?", "options": [{"text": "Expected finding after bed rest", "correct": false, "rationale": "Redness that does not blanch is never expected; normal skin blanches with pressure."}, {"text": "The skin has been damaged by pressure", "correct": true, "rationale": "Nonblanchable erythema indicates the skin has been damaged by pressure."}, {"text": "The client is dehydrated", "correct": false, "rationale": "Dehydration is assessed with skin turgor, not blanching."}, {"text": "The client has jaundice", "correct": false, "rationale": "Jaundice is a yellow-orange color change, not redness."}]},
{"id": "w7ih-q36", "cat": "heent", "type": "mc", "stem": "During a Weber test, a client hears the sound best in the left ear. The client reports hearing loss in the left ear. Which type of hearing loss does this finding suggest?", "options": [{"text": "Conductive hearing loss", "correct": true, "rationale": "With conductive loss, sound is heard best in the impaired ear."}, {"text": "Sensorineural hearing loss", "correct": false, "rationale": "With sensorineural loss, sound is heard best in the unaffected ear."}, {"text": "Presbycusis", "correct": false, "rationale": "Presbycusis is age-related high-frequency loss; the Weber result alone doesn't identify it."}, {"text": "No hearing loss", "correct": false, "rationale": "Without hearing loss, sound is heard equally in both ears."}]},
{"id": "w7ih-q37", "cat": "heent", "type": "mc", "stem": "An older adult client cannot repeat words during the whisper test. Which action should the nurse take before documenting impaired hearing?", "options": [{"text": "Repeat the test with the client facing the nurse", "correct": false, "rationale": "The client should not see the nurse's mouth during the whisper test."}, {"text": "Perform the Weber test only", "correct": false, "rationale": "Further testing may help, but cerumen should be ruled out first."}, {"text": "Check the ear canal for cerumen buildup", "correct": true, "rationale": "Cerumen buildup is a common cause of impaired hearing in older adults; check the canal before documenting hearing loss."}, {"text": "Refer the client for hearing aids", "correct": false, "rationale": "Referral comes after the cause is identified."}]},
{"id": "w7ih-q38", "cat": "heent", "type": "mc", "stem": "A nurse observes that a client's tonsils are touching the uvula. How should the nurse grade the tonsils?", "options": [{"text": "+1", "correct": false, "rationale": "+1 tonsils are barely visible."}, {"text": "+2", "correct": false, "rationale": "+2 tonsils extend halfway to the uvula."}, {"text": "+3", "correct": true, "rationale": "+3 tonsils are touching the uvula."}, {"text": "+4", "correct": false, "rationale": "+4 tonsils are touching each other."}]},
{"id": "w7ih-q39", "cat": "heent", "type": "sata", "stem": "A nurse is performing a head and neck examination on an older adult client. Which age-related findings should the nurse expect? Select all that apply.", "options": [{"text": "Arcus senilis", "correct": true, "rationale": "A thin gray-white ring around the cornea is an expected age-related change."}, {"text": "Intolerance to glare", "correct": true, "rationale": "Older adults often become intolerant of glare and have trouble distinguishing colors."}, {"text": "Thickened tympanic membranes", "correct": true, "rationale": "The tympanic membranes thicken with age, and cerumen tends to accumulate."}, {"text": "Reddened gums", "correct": false, "rationale": "Gums become pale, not red, with aging."}, {"text": "Lowered vocal pitch", "correct": false, "rationale": "Vocal pitch rises with aging."}, {"text": "Increased sense of smell", "correct": false, "rationale": "The sense of smell decreases with aging."}]},
{"id": "w7ih-q40", "cat": "neuromentalstatus", "type": "mc", "stem": "A nurse observes a client with neck and elbow extension and flexed wrists and fingers. How should the nurse document this posture?", "options": [{"text": "Decorticate posturing", "correct": false, "rationale": "Decorticate posturing is flexion and internal rotation of the arms and legs."}, {"text": "Decerebrate posturing", "correct": true, "rationale": "Decerebrate posturing is neck and elbow extension with flexed wrists and fingers."}, {"text": "Lethargy", "correct": false, "rationale": "Lethargy is a level of consciousness, not a posture."}, {"text": "Expected sleep position", "correct": false, "rationale": "These abnormal postures occur in clients who are comatose."}]}
];
