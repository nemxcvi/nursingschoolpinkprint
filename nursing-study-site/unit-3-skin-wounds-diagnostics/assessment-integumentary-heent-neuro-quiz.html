var catLabels = {
  basicsintegumentary: "Basics & Integumentary",

var bank = [
{"id": "w7ih-q01", "cat": "basicsintegumentary", "type": "mc", "stem": "A nurse is performing an integumentary assessment on a group of clients. Which finding is the nurse's priority?", "options": [{"text": "Pallor of the conjunctivae", "correct": false, "rationale": "Pallor can reflect anemia or decreased blood flow and needs follow-up, but it does not point to an immediate airway or breathing problem."}, {"text": "Yellow sclera", "correct": false, "rationale": "Jaundice suggests liver dysfunction or RBC destruction. It matters, but it is not an immediate threat to oxygenation."}, {"text": "Bluish discoloration of the lips and nail beds", "correct": true, "rationale": "Cyanosis indicates hypoxia. Using the ABCs, impaired oxygenation is the priority finding."}, {"text": "Redness over the sacrum", "correct": false, "rationale": "Erythema signals inflammation or pressure and needs assessment, but it is lower priority than a sign of hypoxia."}]},
{"id": "w7ih-q02", "cat": "basicsintegumentary", "type": "mc", "stem": "A nurse is assessing a client's skin temperature. Which technique should the nurse use?", "options": [{"text": "Palpate with the fingertips", "correct": false, "rationale": "Fingertips are used to assess texture and moisture, not temperature."}, {"text": "Palpate with the palm of the hand", "correct": false, "rationale": "The palm is less sensitive to temperature changes than the back of the hand."}, {"text": "Palpate with the dorsal surface of the hand", "correct": true, "rationale": "The dorsal (back) surface of the hand is the most sensitive to temperature, so it is the only part used to assess skin temperature."}, {"text": "Use a tympanic thermometer on the area", "correct": false, "rationale": "A thermometer measures core body temperature, not localized skin temperature."}]},
{"id": "w7ih-q03", "cat": "basicsintegumentary", "type": "sata", "stem": "A nurse notes edema in a client's left lower leg only. Which conditions should the nurse recognize as possible causes of unilateral edema? Select all that apply.", "options": [{"text": "Deep vein thrombosis", "correct": true, "rationale": "Unilateral edema can indicate a DVT; measure the limb and look for erythema and tenderness."}, {"text": "Inflammation", "correct": true, "rationale": "Localized inflammation can cause swelling on one side."}, {"text": "Lymphedema", "correct": true, "rationale": "Impaired lymph drainage on one side causes unilateral edema."}, {"text": "Fluid volume excess", "correct": false, "rationale": "Fluid volume excess causes bilateral edema, not edema on one side."}, {"text": "Venous insufficiency", "correct": false, "rationale": "Venous insufficiency generally causes bilateral edema."}]},
{"id": "w7ih-q04", "cat": "basicsintegumentary", "type": "mc", "stem": "A nurse presses over a client's medial malleolus for 5 seconds and finds a 4 mm indentation that rebounds in about 12 seconds. How should the nurse document this finding?", "options": [{"text": "1+ edema", "correct": false, "rationale": "1+ edema is trace, about 2 mm, with a rapid skin response."}, {"text": "2+ edema", "correct": true, "rationale": "2+ edema is mild, about 4 mm, with a 10–15 second response."}, {"text": "3+ edema", "correct": false, "rationale": "3+ edema is moderate, about 6 mm, with a prolonged response."}, {"text": "4+ edema", "correct": false, "rationale": "4+ edema is severe, about 8 mm, with a prolonged response."}]},
{"id": "w7ih-q05", "cat": "basicsintegumentary", "type": "dragdrop", "stem": "A nurse is teaching a class about skin lesions. Drag the lesions that are primary lesions (arising from healthy skin) into the answer box.", "leftLabel": "Skin lesions", "rightLabel": "Primary lesions", "options": [{"text": "Macule", "correct": true, "rationale": "A macule is a flat color change that arises from healthy skin, making it a primary lesion."}, {"text": "Vesicle", "correct": true, "rationale": "A vesicle is a serous fluid-filled elevation arising from healthy skin; it is a primary lesion."}, {"text": "Pustule", "correct": true, "rationale": "A pustule is a pus-filled lesion arising from healthy skin; it is a primary lesion."}, {"text": "Wheal", "correct": true, "rationale": "A wheal (such as an insect bite) is an edematous primary lesion."}, {"text": "Nodule", "correct": true, "rationale": "A nodule (such as a wart) is a firm, deep primary lesion."}, {"text": "Crust", "correct": false, "rationale": "A crust (scab) is dried blood, serum, or pus from a previous lesion; it is a secondary lesion."}, {"text": "Scale", "correct": false, "rationale": "Scale is flaking skin that develops from a change in a primary lesion; it is secondary."}, {"text": "Erosion", "correct": false, "rationale": "An erosion (such as a ruptured vesicle) results from a change in a primary lesion; it is secondary."}, {"text": "Ulcer", "correct": false, "rationale": "An ulcer is loss of epidermis and dermis; it is a secondary lesion."}]},
{"id": "w7ih-q06", "cat": "basicsintegumentary", "type": "mc", "stem": "A nurse pinches a skin fold over a client's sternum and it stays raised for several seconds. Which condition does this finding indicate?", "options": [{"text": "Fluid volume excess", "correct": false, "rationale": "Fluid volume excess causes edema, not delayed skin recoil."}, {"text": "Dehydration", "correct": true, "rationale": "Tenting, a skin fold that stays raised, indicates poor turgor from dehydration and increases the risk of skin breakdown."}, {"text": "Expected finding", "correct": false, "rationale": "Well-hydrated skin returns to its original position within a few seconds."}, {"text": "Arterial insufficiency", "correct": false, "rationale": "Arterial insufficiency causes shiny, hairless skin, not tenting."}]},
{"id": "w7ih-q07", "cat": "basicsintegumentary", "type": "mc", "stem": "A nurse observes that a client's nail angle is greater than 160°. Which condition should the nurse suspect?", "options": [{"text": "Fungal infection", "correct": false, "rationale": "Fungal infection causes thick, yellow nails with ragged edges, not an increased nail angle."}, {"text": "Anemia", "correct": false, "rationale": "Anemia can cause pale nail beds but does not change the nail angle."}, {"text": "Chronic low oxygen saturation", "correct": true, "rationale": "A nail angle over 160° is clubbing, which results from chronic low oxygen saturation related to heart or lung disease."}, {"text": "Dehydration", "correct": false, "rationale": "Dehydration affects skin turgor and mucous membranes, not the nail angle."}]},
{"id": "w7ih-q08", "cat": "basicsintegumentary", "type": "mc", "stem": "A nurse is assessing a mole using the ABCDE system. Which finding should the nurse report?", "options": [{"text": "Symmetric round shape", "correct": false, "rationale": "Asymmetry, not symmetry, is the warning sign."}, {"text": "Smooth, even border", "correct": false, "rationale": "Border irregularity, not a smooth border, is the warning sign."}, {"text": "Diameter of 8 mm", "correct": true, "rationale": "A diameter greater than 6 mm is a warning sign for skin cancer."}, {"text": "Uniform brown color", "correct": false, "rationale": "Color variation within one lesion is the warning sign; uniform color is expected."}]},
{"id": "w7ih-q09", "cat": "basicsintegumentary", "type": "mc", "stem": "A nurse presses on a reddened area over a client's coccyx and the redness does not fade. How should the nurse interpret this finding?", "options": [{"text": "Expected finding after bed rest", "correct": false, "rationale": "Redness that does not blanch is never expected; normal skin blanches with pressure."}, {"text": "The skin has been damaged by pressure", "correct": true, "rationale": "Nonblanchable erythema indicates the skin has been damaged by pressure."}, {"text": "The client is dehydrated", "correct": false, "rationale": "Dehydration is assessed with skin turgor, not blanching."}, {"text": "The client has jaundice", "correct": false, "rationale": "Jaundice is a yellow-orange color change, not redness."}]},
{"id": "w7ih-q10", "cat": "basicsintegumentary", "type": "sata", "stem": "A nurse is preparing to assess skin turgor in an adult client. Which sites can the nurse use? Select all that apply.", "options": [{"text": "Clavicle", "correct": true, "rationale": "Pinching a skin fold over the clavicle is an accepted turgor site."}, {"text": "Sternum", "correct": true, "rationale": "The sternum is an accepted turgor site."}, {"text": "Back of the hand", "correct": true, "rationale": "The back of the hand is an accepted turgor site."}, {"text": "Earlobe", "correct": false, "rationale": "The earlobe is not used to assess turgor."}, {"text": "Palm of the hand", "correct": false, "rationale": "The palm has thick skin and is not used to assess turgor."}]},
{"id": "w7ih-q11", "cat": "heent", "type": "mc", "stem": "A nurse is examining a client's thyroid gland. Which action should the nurse take?", "options": [{"text": "Palpate both lobes at the same time with firm pressure", "correct": false, "rationale": "The thyroid is palpated gently on both sides of the trachea; firm pressure is not used."}, {"text": "Have the client take a sip of water while palpating the gland", "correct": true, "rationale": "When the client swallows, the thyroid should move up with the trachea, which helps the nurse feel it."}, {"text": "Expect the thyroid to be visible on inspection", "correct": false, "rationale": "An average-size thyroid is not visible; visibility could indicate a thyroid disorder."}, {"text": "Auscultate with the diaphragm over a normal-size gland", "correct": false, "rationale": "Auscultation is done only if the thyroid is enlarged, and it uses the bell, not the diaphragm."}]},
{"id": "w7ih-q12", "cat": "heent", "type": "mc", "stem": "A nurse auscultates a bruit over a client's enlarged thyroid gland. Which condition does this finding suggest?", "options": [{"text": "Hypothyroidism", "correct": false, "rationale": "A bruit reflects increased blood flow, which is not typical of hypothyroidism."}, {"text": "Hyperthyroidism", "correct": true, "rationale": "A bruit indicates increased blood flow to the gland, possibly from hyperthyroidism."}, {"text": "Tracheal deviation", "correct": false, "rationale": "Tracheal deviation is found by palpating the trachea, not by hearing a bruit."}, {"text": "Lymph node enlargement", "correct": false, "rationale": "Enlarged lymph nodes are found by palpation, not auscultation."}]},
{"id": "w7ih-q13", "cat": "heent", "type": "dragdrop", "stem": "A nurse is performing an eye examination on an adult client. Drag the findings that are expected into the answer box.", "leftLabel": "Eye findings", "rightLabel": "Expected findings", "options": [{"text": "Pupils equal, round, and reactive to light and accommodation", "correct": true, "rationale": "PERRLA is the expected pupil finding."}, {"text": "Bulbar conjunctiva transparent", "correct": true, "rationale": "The bulbar conjunctiva is expected to be transparent; the palpebral conjunctiva is pink."}, {"text": "Eyelashes curve outward", "correct": true, "rationale": "Lashes curving outward from the lids is expected."}, {"text": "Artery-to-vein ratio of 2:3 with no nicking", "correct": true, "rationale": "A 2:3 artery-to-vein ratio without nicking is expected on the internal eye exam."}, {"text": "Symmetric red reflex", "correct": true, "rationale": "A red-tinted fundus seen in both eyes is expected."}, {"text": "Upper eyelid covering the pupil", "correct": false, "rationale": "An upper lid covering the pupil is ptosis, which is unexpected."}, {"text": "Asymmetric corneal light reflex", "correct": false, "rationale": "The light reflection should be symmetric on both corneas."}, {"text": "Partially illuminated iris", "correct": false, "rationale": "A partially illuminated iris indicates glaucoma."}, {"text": "Absent red reflex in one eye", "correct": false, "rationale": "An absent or asymmetric red reflex is unexpected."}]},
{"id": "w7ih-q14", "cat": "heent", "type": "mc", "stem": "A client asks what a visual acuity of 20/30 means. Which response by the nurse is correct?", "options": [{"text": "\"Your eyes see at 20 feet what visually unimpaired eyes see at 30 feet.\"", "correct": true, "rationale": "The first number is the distance from the chart; the second is the distance at which an unimpaired eye sees the same line."}, {"text": "\"Your eyes see at 30 feet what visually unimpaired eyes see at 20 feet.\"", "correct": false, "rationale": "This reverses the numbers. The first number is always the client's distance from the chart."}, {"text": "\"Your right eye sees clearly at 20 feet and your left eye at 30 feet.\"", "correct": false, "rationale": "Each eye has its own two-number result; the numbers are not one per eye."}, {"text": "\"You can read 20 of the 30 letters on the chart.\"", "correct": false, "rationale": "The numbers are distances in feet, not a count of letters."}]},
{"id": "w7ih-q15", "cat": "heent", "type": "mc", "stem": "A nurse is screening an adult client for presbyopia. How far from the client's face should the nurse hold the Rosenbaum chart?", "options": [{"text": "6 inches", "correct": false, "rationale": "The Rosenbaum chart is held 14 inches (35.5 cm) away; 6 inches is too close."}, {"text": "14 inches", "correct": true, "rationale": "The Rosenbaum chart is held 14 inches (35.5 cm) from the face to screen near vision."}, {"text": "2 feet", "correct": false, "rationale": "Two feet is the distance used for the visual fields test."}, {"text": "20 feet", "correct": false, "rationale": "Twenty feet is the distance used for the Snellen chart (distance vision)."}]},
{"id": "w7ih-q16", "cat": "heent", "type": "mc", "stem": "A nurse is preparing to inspect an adult client's ear canal with an otoscope. Which action should the nurse take?", "options": [{"text": "Pull the auricle down and back", "correct": false, "rationale": "Down and back is used for young children, not adults."}, {"text": "Pull the auricle up and back", "correct": true, "rationale": "Pulling the auricle up and back straightens an adult's ear canal."}, {"text": "Insert the speculum 2 to 2.5 cm into the canal", "correct": false, "rationale": "The speculum is inserted only 1 to 1.5 cm."}, {"text": "Rest the speculum against the canal wall to steady it", "correct": false, "rationale": "The canal is sensitive; the speculum should not touch it."}]},
{"id": "w7ih-q17", "cat": "heent", "type": "mc", "stem": "Which tympanic membrane finding should the nurse document as expected?", "options": [{"text": "Red and bulging", "correct": false, "rationale": "A red, bulging membrane with an obliterated cone of light suggests a middle ear infection."}, {"text": "Pearly gray with a cone of light", "correct": true, "rationale": "An intact, pearly gray membrane with a cone-shaped light reflex is expected."}, {"text": "Yellow with a visible perforation", "correct": false, "rationale": "A perforation (tear) is unexpected."}, {"text": "Dull with no visible landmarks", "correct": false, "rationale": "The umbo and manubrium are expected to be visible."}]},
{"id": "w7ih-q18", "cat": "heent", "type": "mc", "stem": "A nurse performs a Rinne test. Which result is expected?", "options": [{"text": "Bone conduction lasts twice as long as air conduction", "correct": false, "rationale": "This reverses the expected finding."}, {"text": "Air conduction lasts twice as long as bone conduction", "correct": true, "rationale": "The expected Rinne result is AC > BC in a 2:1 ratio."}, {"text": "Sound is heard equally in both ears", "correct": false, "rationale": "Equal sound in both ears is the expected Weber result, not the Rinne result."}, {"text": "Sound lateralizes to the better ear", "correct": false, "rationale": "Lateralization is assessed with the Weber test."}]},
{"id": "w7ih-q19", "cat": "heent", "type": "mc", "stem": "During a Weber test, a client hears the sound best in the left ear. The client reports hearing loss in the left ear. Which type of hearing loss does this finding suggest?", "options": [{"text": "Conductive hearing loss", "correct": true, "rationale": "With conductive loss, sound is heard best in the impaired ear."}, {"text": "Sensorineural hearing loss", "correct": false, "rationale": "With sensorineural loss, sound is heard best in the unaffected ear."}, {"text": "Presbycusis", "correct": false, "rationale": "Presbycusis is age-related high-frequency loss; the Weber result alone doesn't identify it."}, {"text": "No hearing loss", "correct": false, "rationale": "Without hearing loss, sound is heard equally in both ears."}]},
{"id": "w7ih-q20", "cat": "heent", "type": "mc", "stem": "An older adult client cannot repeat words during the whisper test. Which action should the nurse take before documenting impaired hearing?", "options": [{"text": "Repeat the test with the client facing the nurse", "correct": false, "rationale": "The client should not see the nurse's mouth during the whisper test."}, {"text": "Perform the Weber test only", "correct": false, "rationale": "Further testing may help, but cerumen should be ruled out first."}, {"text": "Inspect the ear canal with an otoscope", "correct": true, "rationale": "Cerumen impaction is a common cause of impaired hearing in older adults; check the canal before documenting hearing loss."}, {"text": "Refer the client for hearing aids", "correct": false, "rationale": "Referral comes after the cause is identified."}]},
{"id": "w7ih-q21", "cat": "heent", "type": "mc", "stem": "A nurse observes that a client's tonsils are touching the uvula. How should the nurse grade the tonsils?", "options": [{"text": "+1", "correct": false, "rationale": "+1 tonsils are barely visible."}, {"text": "+2", "correct": false, "rationale": "+2 tonsils extend halfway to the uvula."}, {"text": "+3", "correct": true, "rationale": "+3 tonsils are touching the uvula."}, {"text": "+4", "correct": false, "rationale": "+4 tonsils are touching each other."}]},
{"id": "w7ih-q22", "cat": "heent", "type": "sata", "stem": "A nurse is preparing to examine a client's ears, nose, mouth, and throat. Which equipment does the nurse need? Select all that apply.", "options": [{"text": "Otoscope", "correct": true, "rationale": "An otoscope is used to examine the ear canal and tympanic membrane."}, {"text": "Tuning fork", "correct": true, "rationale": "A tuning fork is used for the Rinne and Weber tests."}, {"text": "Tongue blade", "correct": true, "rationale": "A tongue blade is used to view the throat and test the gag reflex."}, {"text": "Gauze square", "correct": true, "rationale": "A gauze square is used to hold the tip of the tongue during the exam."}, {"text": "Ophthalmoscope", "correct": false, "rationale": "An ophthalmoscope is used for the internal eye exam, not the ears, nose, mouth, and throat."}, {"text": "Reflex hammer", "correct": false, "rationale": "A reflex hammer is used for deep tendon reflexes in the neurologic exam."}]},
{"id": "w7ih-q23", "cat": "heent", "type": "sata", "stem": "A nurse is performing a head and neck examination on an older adult client. Which age-related findings should the nurse expect? Select all that apply.", "options": [{"text": "Arcus senilis", "correct": true, "rationale": "A thin gray-white ring around the cornea is an expected age-related change."}, {"text": "Intolerance to glare", "correct": true, "rationale": "Older adults often become intolerant of glare and have trouble distinguishing colors."}, {"text": "Thickened tympanic membranes", "correct": true, "rationale": "The tympanic membranes thicken with age, and cerumen tends to accumulate."}, {"text": "Reddened gums", "correct": false, "rationale": "Gums become pale, not red, with aging."}, {"text": "Lowered vocal pitch", "correct": false, "rationale": "Vocal pitch rises with aging."}, {"text": "Increased sense of smell", "correct": false, "rationale": "The sense of smell decreases with aging."}]},
{"id": "w7ih-q24", "cat": "cranialnerves", "type": "dragdrop", "stem": "A nurse is reviewing cranial nerve function. Drag the cranial nerves that have only sensory function into the answer box.", "leftLabel": "Cranial nerves", "rightLabel": "Sensory only", "options": [{"text": "CN I (Olfactory)", "correct": true, "rationale": "The olfactory nerve is sensory only (smell)."}, {"text": "CN II (Optic)", "correct": true, "rationale": "The optic nerve is sensory only (visual acuity and fields)."}, {"text": "CN VIII (Auditory)", "correct": true, "rationale": "The auditory nerve is sensory only (hearing and balance)."}, {"text": "CN III (Oculomotor)", "correct": false, "rationale": "The oculomotor nerve is motor only."}, {"text": "CN V (Trigeminal)", "correct": false, "rationale": "The trigeminal nerve is both sensory and motor."}, {"text": "CN VII (Facial)", "correct": false, "rationale": "The facial nerve is both sensory and motor."}, {"text": "CN XI (Spinal accessory)", "correct": false, "rationale": "The spinal accessory nerve is motor only."}, {"text": "CN XII (Hypoglossal)", "correct": false, "rationale": "The hypoglossal nerve is motor only."}]},
{"id": "w7ih-q25", "cat": "cranialnerves", "type": "dragdrop", "stem": "Drag the cranial nerves that have only motor function into the answer box.", "leftLabel": "Cranial nerves", "rightLabel": "Motor only", "options": [{"text": "CN III (Oculomotor)", "correct": true, "rationale": "The oculomotor nerve is motor (eye movement, pupil constriction, eyelid elevation)."}, {"text": "CN IV (Trochlear)", "correct": true, "rationale": "The trochlear nerve is motor (eye movement)."}, {"text": "CN VI (Abducens)", "correct": true, "rationale": "The abducens nerve is motor (eye movement)."}, {"text": "CN XI (Spinal accessory)", "correct": true, "rationale": "The spinal accessory nerve is motor (shrugging shoulders, turning the head)."}, {"text": "CN XII (Hypoglossal)", "correct": true, "rationale": "The hypoglossal nerve is motor (tongue movement)."}, {"text": "CN II (Optic)", "correct": false, "rationale": "The optic nerve is sensory only."}, {"text": "CN V (Trigeminal)", "correct": false, "rationale": "The trigeminal nerve is both sensory and motor."}, {"text": "CN IX (Glossopharyngeal)", "correct": false, "rationale": "The glossopharyngeal nerve is both sensory and motor."}, {"text": "CN X (Vagus)", "correct": false, "rationale": "The vagus nerve is both sensory and motor."}]},
{"id": "w7ih-q26", "cat": "cranialnerves", "type": "mc", "stem": "A nurse is testing the motor function of cranial nerve V. Which instruction should the nurse give the client?", "options": [{"text": "\"Puff out your cheeks.\"", "correct": false, "rationale": "Puffing out the cheeks tests the motor function of CN VII (facial)."}, {"text": "\"Clench your teeth.\"", "correct": true, "rationale": "Clenching the teeth while the nurse palpates the temporal and masseter muscles tests the motor function of CN V (trigeminal)."}, {"text": "\"Stick out your tongue.\"", "correct": false, "rationale": "Sticking out the tongue tests CN XII (hypoglossal)."}, {"text": "\"Shrug your shoulders.\"", "correct": false, "rationale": "Shrugging the shoulders tests CN XI (spinal accessory)."}]},
{"id": "w7ih-q27", "cat": "cranialnerves", "type": "mc", "stem": "A nurse asks a client to smile, frown, raise their eyebrows, and close their eyes tightly. Which cranial nerve is the nurse testing?", "options": [{"text": "Trigeminal (CN V)", "correct": false, "rationale": "The trigeminal nerve controls facial sensation and jaw movement, not facial expression."}, {"text": "Facial (CN VII)", "correct": true, "rationale": "Symmetric facial expressions test the motor function of CN VII."}, {"text": "Oculomotor (CN III)", "correct": false, "rationale": "The oculomotor nerve controls eye movement, pupils, and eyelid elevation."}, {"text": "Hypoglossal (CN XII)", "correct": false, "rationale": "The hypoglossal nerve controls the tongue."}]},
{"id": "w7ih-q28", "cat": "cranialnerves", "type": "mc", "stem": "A client has difficulty swallowing. Which cranial nerve should the nurse identify as controlling swallowing?", "options": [{"text": "Glossopharyngeal (CN IX)", "correct": true, "rationale": "The glossopharyngeal nerve (with the vagus) controls swallowing and is tested with the gag reflex."}, {"text": "Trigeminal (CN V)", "correct": false, "rationale": "The trigeminal nerve controls facial sensation and chewing."}, {"text": "Trochlear (CN IV)", "correct": false, "rationale": "The trochlear nerve controls eye movement."}, {"text": "Hypoglossal (CN XII)", "correct": false, "rationale": "The hypoglossal nerve controls tongue movement, not the swallowing reflex."}]},
{"id": "w7ih-q29", "cat": "cranialnerves", "type": "mc", "stem": "A nurse places their hands on a client's shoulders and asks the client to shrug against resistance. Which cranial nerve is the nurse testing?", "options": [{"text": "Vagus (CN X)", "correct": false, "rationale": "The vagus nerve is tested with the gag reflex and soft palate movement."}, {"text": "Hypoglossal (CN XII)", "correct": false, "rationale": "The hypoglossal nerve is tested with tongue movement."}, {"text": "Spinal accessory (CN XI)", "correct": true, "rationale": "Shrugging the shoulders and turning the head against resistance test CN XI (trapezius and sternocleidomastoid)."}, {"text": "Facial (CN VII)", "correct": false, "rationale": "The facial nerve is tested with facial expressions."}]},
{"id": "w7ih-q30", "cat": "cranialnerves", "type": "mc", "stem": "A nurse is testing cranial nerve I. Why should the nurse avoid using an alcohol wipe?", "options": [{"text": "Alcohol dries the nasal mucosa", "correct": false, "rationale": "The concern is a misleading response, not drying of the mucosa."}, {"text": "Noxious odors stimulate the trigeminal nerve", "correct": true, "rationale": "Irritating odors stimulate CN V and can cause a misleading response; use a familiar, non-noxious scent such as mint or coffee."}, {"text": "Alcohol is too difficult to identify", "correct": false, "rationale": "Alcohol is easy to identify; the problem is that it stimulates CN V."}, {"text": "Alcohol can trigger the gag reflex", "correct": false, "rationale": "The gag reflex is stimulated at the back of the throat, not by smell."}]},
{"id": "w7ih-q31", "cat": "neuromentalstatus", "type": "mc", "stem": "A client responds to light shaking but is confused and slow to respond. Which level of consciousness should the nurse document?", "options": [{"text": "Lethargic", "correct": false, "rationale": "A lethargic client opens their eyes and responds but falls back asleep quickly."}, {"text": "Obtunded", "correct": true, "rationale": "An obtunded client responds to light shaking and may be confused and slow to respond."}, {"text": "Stuporous", "correct": false, "rationale": "A stuporous client needs painful stimuli for a brief response."}, {"text": "Comatose", "correct": false, "rationale": "A comatose client has no response to repeated painful stimuli."}]},
{"id": "w7ih-q32", "cat": "neuromentalstatus", "type": "mc", "stem": "A client's Glasgow Coma Scale score drops from 14 to 9 over 2 hours. How should the nurse interpret this change?", "options": [{"text": "Improving level of consciousness", "correct": false, "rationale": "On the GCS, higher scores are better; a drop means decline."}, {"text": "Declining level of consciousness", "correct": true, "rationale": "GCS ranges from 3 to 15, and a lower score indicates worsening consciousness."}, {"text": "No significant change", "correct": false, "rationale": "A 5-point drop is a significant change in consciousness."}, {"text": "Full consciousness", "correct": false, "rationale": "Only a score of 15 indicates full consciousness."}]},
{"id": "w7ih-q33", "cat": "neuromentalstatus", "type": "mc", "stem": "A nurse observes a client with neck and elbow extension and flexed wrists and fingers. How should the nurse document this posture?", "options": [{"text": "Decorticate posturing", "correct": false, "rationale": "Decorticate posturing is flexion and internal rotation of the arms and legs."}, {"text": "Decerebrate posturing", "correct": true, "rationale": "Decerebrate posturing is neck and elbow extension with flexed wrists and fingers."}, {"text": "Lethargy", "correct": false, "rationale": "Lethargy is a level of consciousness, not a posture."}, {"text": "Expected sleep position", "correct": false, "rationale": "These abnormal postures occur in clients who are comatose."}]},
{"id": "w7ih-q34", "cat": "neuromentalstatus", "type": "mc", "stem": "A nurse asks a client, \"What does 'a bird in the hand is worth two in the bush' mean?\" Which mental status component is the nurse assessing?", "options": [{"text": "Remote memory", "correct": false, "rationale": "Remote memory is tested with verifiable past facts, such as a birth date."}, {"text": "Judgment", "correct": false, "rationale": "Judgment is tested by asking how the client would solve a dilemma."}, {"text": "Abstract thinking", "correct": true, "rationale": "Interpreting a cliché tests abstract thinking, a higher-level thought process."}, {"text": "Calculation", "correct": false, "rationale": "Calculation is tested with serial 7s from 100."}]},
{"id": "w7ih-q35", "cat": "neuromentalstatus", "type": "mc", "stem": "A nurse traces a number on a client's palm while the client's eyes are closed and asks the client to identify it. Which sensory function is the nurse testing?", "options": [{"text": "Stereognosis", "correct": false, "rationale": "Stereognosis is identifying a familiar object placed in the hand."}, {"text": "Graphesthesia", "correct": true, "rationale": "Graphesthesia is identifying a number traced on the palm."}, {"text": "Two-point discrimination", "correct": false, "rationale": "Two-point discrimination uses open paper clips to find the smallest distance where two points are felt."}, {"text": "Position sense", "correct": false, "rationale": "Position sense is identifying whether a limb is moved up or down."}]},
{"id": "w7ih-q36", "cat": "neuromentalstatus", "type": "mc", "stem": "A nurse strikes the tendon just below a client's patella. Which response should the nurse expect?", "options": [{"text": "Plantar flexion of the foot", "correct": false, "rationale": "Plantar flexion is the expected Achilles reflex response."}, {"text": "Extension of the lower leg", "correct": true, "rationale": "The expected patellar reflex is extension of the lower leg."}, {"text": "Flexion of the elbow", "correct": false, "rationale": "Elbow flexion is the expected biceps reflex response."}, {"text": "Fanning of the toes", "correct": false, "rationale": "Fanning of the toes is an abnormal Babinski response."}]},
{"id": "w7ih-q37", "cat": "neuromentalstatus", "type": "mc", "stem": "A nurse documents a client's deep tendon reflexes as 4+. What does this finding indicate?", "options": [{"text": "Expected response", "correct": false, "rationale": "An expected reflex is graded 2+."}, {"text": "Diminished response", "correct": false, "rationale": "A diminished reflex is graded 1+."}, {"text": "Slightly brisker than average", "correct": false, "rationale": "A response brisker than average is graded 3+."}, {"text": "Hyperactive response with clonus", "correct": true, "rationale": "4+ is a very brisk, hyperactive response with clonus."}]},
{"id": "w7ih-q38", "cat": "neuromentalstatus", "type": "mc", "stem": "A nurse strokes the sole of an adult client's foot and observes fanning of the toes and dorsiflexion of the great toe. How should the nurse interpret this finding?", "options": [{"text": "Expected adult response", "correct": false, "rationale": "In adults, the expected response is no response or slight curling of the toes."}, {"text": "Abnormal finding associated with upper motor neuron disease", "correct": true, "rationale": "An abnormal Babinski (fanning toes, dorsiflexed great toe) is associated with upper motor neuron disease."}, {"text": "Sign of peripheral vascular disease", "correct": false, "rationale": "The Babinski reflex is a neurologic test, not a vascular one."}, {"text": "Normal response to a ticklish client", "correct": false, "rationale": "This pattern is abnormal in adults regardless of ticklishness."}]},
{"id": "w7ih-q39", "cat": "neuromentalstatus", "type": "sata", "stem": "A nurse is assessing a client's sensory function. Which actions should the nurse take? Select all that apply.", "options": [{"text": "Have the client close their eyes", "correct": true, "rationale": "Sensory tests are done with the client's eyes closed so they can't see the stimulus."}, {"text": "Vary the sharp and dull touches at random sites", "correct": true, "rationale": "Random sites, intervals, and sharp or dull ends prevent the client from guessing."}, {"text": "Move the cotton ball from proximal to distal areas", "correct": true, "rationale": "Light touch is tested from proximal to distal, comparing both sides."}, {"text": "Test all four extremities", "correct": true, "rationale": "Sensory function is tested on all four extremities and compared bilaterally."}, {"text": "Tell the client which end of the tongue blade is touching before each touch", "correct": false, "rationale": "Telling the client would invalidate the test; show both ends only before starting."}, {"text": "Test only the dominant side", "correct": false, "rationale": "Sides are compared to detect asymmetry."}]},
{"id": "w7ih-q40", "cat": "basicsintegumentary", "type": "mc", "stem": "A nurse is preparing to listen for a low-pitched murmur. How should the nurse use the stethoscope?", "options": [{"text": "Diaphragm with firm pressure", "correct": false, "rationale": "The diaphragm with firm pressure is used for high-pitched sounds such as S1, S2, and lung and bowel sounds."}, {"text": "Bell with light pressure, with the entire rim touching the skin", "correct": true, "rationale": "The bell picks up low-pitched sounds such as murmurs, bruits, S3, and S4; heavy pressure stretches the skin and blocks them."}, {"text": "Bell pressed firmly into the skin", "correct": false, "rationale": "Firm pressure with the bell turns it into a diaphragm and filters out low-pitched sounds."}, {"text": "Diaphragm placed over the client's gown", "correct": false, "rationale": "The stethoscope should always be placed directly on the skin."}]}
