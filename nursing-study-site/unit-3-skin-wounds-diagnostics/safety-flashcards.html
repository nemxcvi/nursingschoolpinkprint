[46, "communicationunexpectedevents", "Occurrence (incident) report", "Not punitive; tracks trends and root causes; lists people involved, witnesses, contributing problems and outcome"],

[56, "fallsinjuryprevention", "Universal fall precautions", "Nonskid footwear; bed low and locked; wheelchair brakes on; no clutter; good lighting; call light and belongings in reach; orient to the room and call light; client gives a return demonstration of the call light, and answer it promptly"],
[57, "fallsinjuryprevention", "Higher fall risk interventions", "Room near the nurses' station, color-coded wristband or sign, bed or chair alarm (alerts staff, doesn't prevent falls), video monitoring or sitter, regular toileting, gait belt"],

[60, "fallsinjuryprevention", "Bedside sitter", "Direct observation for high-risk clients; always used for suicidal ideation"],

[62, "fallsinjuryprevention", "Clients at high risk for injury", "Stroke, MS, Parkinson's, frailty, schizophrenia, substance use; vision, communication or cognitive disabilities (communication disability = 3 times more adverse events)"],
[63, "restraintsseizures", "Purpose of restraints", "Protect the client or others; last resort, for the shortest time possible"],
[64, "restraintsseizures", "Never use restraints for", "Staff convenience, punishment or short staffing"],

[69, "restraintsseizures", "Vest restraints", "Many facilities don't use them (strangulation and asphyxiation risk)"],
[70, "restraintsseizures", "Restraint order", "Written by the provider after a face-to-face assessment: reason, type, location, duration, behavior"],
[71, "restraintsseizures", "Restraint order time limit (adult)", "4 hours, renewable up to 24 consecutive hours; no PRN (as-needed) orders"],

[73, "restraintsseizures", "Restraints applied in an emergency", "Nurse may apply them; get the provider's order within 1 hour"],

[78, "restraintsseizures", "Death in restraints", "A sentinel event; must be reported"],

[81, "restraintsseizures", "Seizure precautions", "Suction, oxygen and oral airway at the bedside; padded side rails; baseline vitals and SpO2; IV access (ATI's safety chapter: a saline lock; ATI's injury-prevention lesson: two IV sites); remove tight clothing and jewelry"],
[82, "restraintsseizures", "Aura", "Warning sensation before a seizure; client alerts the nurse and removes dentures if possible"],
[83, "restraintsseizures", "During a seizure", "Stay and call for help; side-lying; protect the head; move objects away; loosen clothing; suction as needed; note the start time"],
[84, "restraintsseizures", "Never during a seizure", "Restrain the client, put anything in the mouth (oral airway only in status epilepticus), or leave to get help"],
[85, "restraintsseizures", "Seizure observations", "Start time, duration, body parts and sides involved, eye activity, incontinence, skin color"],
[86, "restraintsseizures", "Medication and labs during a seizure", "Benzodiazepine IV (or IM, intramuscular, if no IV) as prescribed; check bedside glucose"],
[87, "restraintsseizures", "After a seizure", "Check mental status, vitals and SpO2; check gag reflex and ability to follow directions before food or fluids; reorient, reassure, quiet room"],

[89, "environmentalemergencysafety", "RACE details", "Rescue clients in immediate danger; pull the alarm and report the location; close doors and windows, turn off oxygen, bag-valve-mask clients on life support; evacuate, putting out small fires only if trained and safe"],
[90, "environmentalemergencysafety", "Priority when you discover a fire", "Rescue the clients nearest the fire"],
[91, "environmentalemergencysafety", "PASS", "Pull the pin, Aim at the base, Squeeze the handle, Sweep side to side"],
[92, "environmentalemergencysafety", "Fire triangle", "Heat, oxygen, fuel; remove one and the fire stops"],
[93, "environmentalemergencysafety", "Evacuation", "Lateral (same floor) preferred over vertical; those closest to the fire first; close doors, cover clients with blankets, stay low, don't run"],

[95, "environmentalemergencysafety", "Unsafe electrical equipment", "Tag it, remove it, notify clinical engineering"],
[96, "environmentalemergencysafety", "Chemical exposure", "Routes: inhalation, skin or eyes, ingestion, injection. Remove the chemical, use eyewash or shower; prevent with PPE and ventilation"],
[97, "environmentalemergencysafety", "Safety data sheet (SDS)", "Chemical hazards, exposure prevention, first aid and cleanup; accessible to all staff"],
[98, "environmentalemergencysafety", "Radiation safety principles", "Reduce time, increase distance, use shielding (lead apron)"],
[99, "environmentalemergencysafety", "Before any radiation procedure", "Ask about possible pregnancy and last menstrual period; CT (computed tomography) gives more radiation than an x-ray"],
[100, "environmentalemergencysafety", "Radioactive implants or medications", "Wear PPE when handling the client's urine and blood"],
[101, "environmentalemergencysafety", "Alpha, beta, gamma radiation", "Alpha: least risk, doesn't pass clothing · Beta: middle, needs special clothing · Gamma: most serious, passes through tissue, needs lead"],
[102, "environmentalemergencysafety", "Radiation exposure", "Early signs: nausea, vomiting, diarrhea, sometimes hair loss and burns. Remove clothing, wash skin and hair; potassium iodide protects the thyroid"],
[103, "environmentalemergencysafety", "Biological or chemical mass casualty", "Many clients with similar symptoms suggests a biological event; full PPE if the agent is unknown; cut off and double-bag clothing; decontamination shower"],
[104, "environmentalemergencysafety", "Disaster preparedness", "CMS (Centers for Medicare & Medicaid Services) requires a plan, training at orientation and yearly, and drills; know your role and the chain of command"],
[105, "environmentalemergencysafety", "Active shooter", "Run, then hide, then fight; take any threat seriously and report it up the chain of command"],
[106, "homecommunitysafety", "Home safety assessment", "Risk assessment tool, history and physical, home hazard appraisal; often by home health nursing, PT (physical therapy) or OT (occupational therapy)"],
[107, "homecommunitysafety", "Adolescent safety teaching", "Smoking, vaping, alcohol, drugs, unprotected sex; driver's ed, seat belts, no distracted or impaired driving; sports gear; firearms; check water depth before diving; watch for depression"],
[108, "homecommunitysafety", "Top cause of death and injury in adults", "Motor vehicle crashes"],
[109, "homecommunitysafety", "Adult safety teaching", "Defensive, sober driving; smoke and CO (carbon monoxide) detectors; well-lit stairs; watch for depression; SPF (sun protection factor) 30 or higher"],
[110, "homecommunitysafety", "Older adult injury risks", "Falls (vision, hearing, nocturia, incontinence) and burns (reduced sensation); longer recovery from injuries"],
[111, "homecommunitysafety", "Bathroom safety", "Grab bars, nonskid mat, shower chair, raised toilet, electric razor (especially with anticoagulants), GFCI outlets"],
[112, "homecommunitysafety", "Home safety everywhere", "Bright lighting, no throw rugs, cords along walls, no wheeled or swivel chairs, handrails, tape on stair edges; kitchen items in reach, stove auto shut-off, pot handles turned in"],
[113, "homecommunitysafety", "Water heater temperature", "No higher than 120°F (49°C)"],
[114, "homecommunitysafety", "Home smoke alarms", "Every floor and outside sleeping areas; test monthly; change batteries every 6 months"],
[115, "homecommunitysafety", "Home fire escape", "Two exits per room; practice twice a year; damp cloth over mouth and nose and stay low in smoke; clothes on fire: stop, drop and roll"],
[116, "homecommunitysafety", "Home fire prevention", "One large appliance per outlet; space heaters 3 ft from anything flammable; cooking causes the most home fires"],
[117, "homecommunitysafety", "Home oxygen safety", "No smoking in the home even when it's off, signs at every door; flames, gas stoves and appliances 10 ft away; no oil-based lotions or aerosols; cotton bedding"],
[118, "homecommunitysafety", "Home oxygen fire", "Turn off the oxygen, leave the house, call 911"],
[119, "homecommunitysafety", "Carbon monoxide", "No color, smell or taste; headache, nausea, vomiting, weakness; prevent with CO detectors, ventilation and yearly appliance checks"],
[120, "homecommunitysafety", "Food safety", "E. coli, Listeria, Salmonella; refrigerator 40°F (4°C) or below; avoid unpasteurized dairy and raw eggs; high-risk: very old, immunocompromised, pregnant"],
[121, "homecommunitysafety", "Firearm safety", "Unloaded, locked, ammunition stored separately"],
[122, "firstaidemergencies", "Primary survey", "60 seconds or less: Airway (protect the C-spine), Breathing, Circulation, Disability (LOC, level of consciousness), Exposure; first aid comes after"],
[123, "firstaidemergencies", "Most important step of the primary survey", "Airway; nothing else works without it"],
[124, "firstaidemergencies", "Bleeding and impaled objects", "External bleeding: direct pressure. Impaled object: don't remove it; stabilize it"],
[125, "firstaidemergencies", "Fracture care", "Check pulses, movement, skin and swelling; splint; cover open areas with a sterile cloth; recheck below the injury"],
[126, "firstaidemergencies", "RICE (sprains)", "Rest, Ice, Compression, Elevation"],
[127, "firstaidemergencies", "Heat stroke", "Over 40°C (104°F): hot, dry skin, hypotension, fast HR (heart rate) and RR (respiratory rate), confusion, seizures. Cool fast (remove clothing, ice packs on major arteries, wet skin and fan); prevent shivering"],
[128, "firstaidemergencies", "Frostbite", "White, waxy skin with tissue injury (frostnip has none); rewarm in 37–39°C water; pain medication; tetanus"],
[129, "firstaidemergencies", "Burn first aid", "Remove the source, primary survey, cover the client, NPO, elevate extremities, fluids, tetanus"],
[130, "firstaidemergencies", "CPR (cardiopulmonary resuscitation) / BLS (basic life support)", "CAB: Compressions, Airway, Breathing. Check response and breathing (gasping = not breathing), call for help and an AED (automated external defibrillator), check pulse, start compressions"],
[131, "ergonomicspositioning", "Body mechanics", "Bend at the hips and knees, back straight, load close to your body, wide base of support, use large leg and arm muscles, tighten abdominals"],
[132, "ergonomicspositioning", "Never when moving a client", "Twist your spine; face the direction of movement"],
[133, "ergonomicspositioning", "Pushing and pulling", "Push: front foot forward. Pull: rear leg back, pull toward your center of gravity. Sliding, rolling and pushing take less effort than lifting"],
[134, "ergonomicspositioning", "Before moving a client", "Assess mobility and whether the client can bear weight, assist and cooperate"],
[135, "ergonomicspositioning", "Safest way to lift a client", "Lift equipment; many facilities have no-manual-lift or no-solo-lift policies"],
[136, "ergonomicspositioning", "Repositioning a client up in bed", "Two or more staff (a major cause of back injury)"],
[137, "ergonomicspositioning", "Posture tips", "Footrest when standing long periods; knees slightly above hips when sitting; break every 15–20 min from repetitive tasks"],
