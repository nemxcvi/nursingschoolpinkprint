var bank = [
{"id": "w7tc-q01", "cat": "breaststhoraxlungs", "type": "mc", "stem": "A nurse auscultates medium-pitched, blowing breath sounds with equal inspiration and expiration. Where should the nurse expect to hear these sounds?", "options": [{"text": "Over the trachea", "correct": false, "rationale": "Over the trachea, bronchial sounds are loud and high-pitched with expiration longer than inspiration."}, {"text": "Over the main bronchi", "correct": true, "rationale": "Bronchovesicular sounds are heard over the mainstem bronchi, anteriorly and posteriorly."}, {"text": "Over the peripheral lung bases", "correct": false, "rationale": "Vesicular sounds (soft, low-pitched, breezy) are expected over the periphery."}, {"text": "Over the right middle lobe in the axilla", "correct": false, "rationale": "Peripheral areas like the axilla have vesicular sounds."}]},
{"id": "w7tc-q02", "cat": "breaststhoraxlungs", "type": "sata", "stem": "A nurse is percussing and auscultating an adult client's thorax. Which findings should the nurse expect? Select all that apply.", "options": [{"text": "Resonance over the lung fields", "correct": true, "rationale": "Resonance, a low-pitched hollow sound, is the expected percussion sound over air-filled lungs."}, {"text": "Vesicular sounds over the peripheral lung fields", "correct": true, "rationale": "Soft, breezy, low-pitched vesicular sounds are expected over the periphery."}, {"text": "Symmetric tactile fremitus", "correct": true, "rationale": "Fremitus should be symmetric and strongest near the top."}, {"text": "AP diameter about half the transverse diameter", "correct": true, "rationale": "The expected AP diameter is one-third to one-half of the transverse diameter."}, {"text": "Crackles that don't clear with coughing", "correct": false, "rationale": "Crackles are adventitious sounds and unexpected."}, {"text": "Hyperresonance", "correct": false, "rationale": "Hyperresonance indicates trapped air (emphysema or pneumothorax) and is unexpected."}]},
{"id": "w7tc-q03", "cat": "breaststhoraxlungs", "type": "mc", "stem": "A nurse palpates increased tactile fremitus over a client's right lower lobe. Which condition should the nurse suspect?", "options": [{"text": "Pneumonia", "correct": true, "rationale": "Increased fremitus occurs when lung tissue is consolidated, as with pneumonia."}, {"text": "Pneumothorax", "correct": false, "rationale": "Pneumothorax causes decreased or absent fremitus."}, {"text": "Emphysema", "correct": false, "rationale": "Emphysema causes hyperresonance on percussion."}, {"text": "Expected finding", "correct": false, "rationale": "Fremitus should be symmetric; increased fremitus on one side is unexpected."}]},
{"id": "w7tc-q04", "cat": "breaststhoraxlungs", "type": "mc", "stem": "A nurse percusses hyperresonance over a client's left lung field. Which condition should the nurse suspect?", "options": [{"text": "Pneumonia", "correct": false, "rationale": "Pneumonia (fluid or consolidation) causes dullness."}, {"text": "Tumor", "correct": false, "rationale": "A solid mass causes dullness."}, {"text": "Pneumothorax", "correct": true, "rationale": "Hyperresonance indicates trapped air, as with pneumothorax or emphysema."}, {"text": "Pleural effusion", "correct": false, "rationale": "Fluid in the pleural space causes dullness."}]},
{"id": "w7tc-q05", "cat": "breaststhoraxlungs", "type": "mc", "stem": "A client who has asthma has continuous, high-pitched musical sounds that are louder on expiration. How should the nurse document this finding?", "options": [{"text": "Crackles", "correct": false, "rationale": "Crackles are wet popping sounds from air moving through fluid."}, {"text": "Wheezes", "correct": true, "rationale": "Wheezes are continuous musical sounds from air moving through constricted airways, as in asthma."}, {"text": "Stridor", "correct": false, "rationale": "Stridor is a high-pitched crowing sound from upper airway obstruction, heard without a stethoscope."}, {"text": "Pleural friction rub", "correct": false, "rationale": "A friction rub is a grating sound from inflamed pleura."}]},
{"id": "w7tc-q06", "cat": "breaststhoraxlungs", "type": "mc", "stem": "A nurse hears low-pitched rumbling sounds over a client's large airways. Which action should the nurse take next?", "options": [{"text": "Notify the rapid response team", "correct": false, "rationale": "Rhonchi alone are not an emergency; first see whether they clear."}, {"text": "Have the client take a deep breath and cough, then listen again", "correct": true, "rationale": "Rhonchi come from mucus in large airways and may clear with coughing."}, {"text": "Document the finding as crackles", "correct": false, "rationale": "Crackles are popping sounds; low-pitched rumbling is rhonchi."}, {"text": "Percuss the area for dullness", "correct": false, "rationale": "Percussion won't distinguish rhonchi; reassess after coughing."}]},
{"id": "w7tc-q07", "cat": "breaststhoraxlungs", "type": "mc", "stem": "Which adventitious sound should the nurse identify as the highest priority?", "options": [{"text": "Rhonchi", "correct": false, "rationale": "Rhonchi may clear with coughing and are usually not an immediate threat."}, {"text": "Fine crackles at the bases", "correct": false, "rationale": "Crackles need follow-up but are not an immediate airway threat."}, {"text": "Stridor", "correct": true, "rationale": "Stridor indicates upper airway obstruction and can be life-threatening."}, {"text": "Diminished sounds over increased adipose tissue", "correct": false, "rationale": "Diminished sounds from adipose tissue are a common variation."}]},
{"id": "w7tc-q08", "cat": "breaststhoraxlungs", "type": "mc", "stem": "A nurse is auscultating a client's posterior lung fields. Which instruction should the nurse give?", "options": [{"text": "\"Hold your breath while I listen.\"", "correct": false, "rationale": "The client should breathe deeply, not hold their breath."}, {"text": "\"Cross your arms in front of your chest.\"", "correct": true, "rationale": "Crossing the arms separates the scapulae and exposes more lung tissue."}, {"text": "\"Breathe through your nose normally.\"", "correct": false, "rationale": "Deep breaths through an open mouth make lung sounds easier to hear."}, {"text": "\"Count out loud while I listen.\"", "correct": false, "rationale": "The client should not talk during auscultation; counting \"99\" is used for fremitus."}]},
{"id": "w7tc-q09", "cat": "breaststhoraxlungs", "type": "dragdrop", "stem": "Drag the sounds that are adventitious (unexpected) into the answer box.", "leftLabel": "Lung sounds", "rightLabel": "Adventitious sounds", "options": [{"text": "Crackles", "correct": true, "rationale": "Crackles are popping sounds from air through fluid or collapsed alveoli."}, {"text": "Wheezes", "correct": true, "rationale": "Wheezes are musical sounds from narrowed airways."}, {"text": "Rhonchi", "correct": true, "rationale": "Rhonchi are low-pitched rumbling sounds from mucus in large airways."}, {"text": "Stridor", "correct": true, "rationale": "Stridor is a high-pitched crowing sound from upper airway obstruction."}, {"text": "Pleural friction rub", "correct": true, "rationale": "A friction rub is a grating sound from inflamed pleura."}, {"text": "Vesicular sounds over the periphery", "correct": false, "rationale": "Vesicular sounds are expected over the peripheral lung fields."}, {"text": "Bronchovesicular sounds over the main bronchi", "correct": false, "rationale": "Bronchovesicular sounds are expected over the main bronchi."}, {"text": "Bronchial sounds over the trachea", "correct": false, "rationale": "Bronchial sounds are expected over the trachea."}]},
{"id": "w7tc-q10", "cat": "breaststhoraxlungs", "type": "mc", "stem": "A client asks when to perform a monthly breast self-exam. Which response by the nurse is correct?", "options": [{"text": "\"On the first day of your period.\"", "correct": false, "rationale": "Breast tissue is fuller and more tender during menses."}, {"text": "\"Four to seven days after your period begins.\"", "correct": true, "rationale": "Breast tissue is least full and tender 4 to 7 days after menses begins (or right after it ends)."}, {"text": "\"The day before your period starts.\"", "correct": false, "rationale": "Breasts are often swollen and tender before menses."}, {"text": "\"Any day, as long as it's monthly.\"", "correct": false, "rationale": "Clients who menstruate should time the exam to their cycle; a set day is for pregnant or postmenopausal clients."}]},
{"id": "w7tc-q11", "cat": "breaststhoraxlungs", "type": "sata", "stem": "A nurse is examining a female client's breasts. Which findings should the nurse report as associated with breast cancer? Select all that apply.", "options": [{"text": "Skin that looks like the peel of an orange", "correct": true, "rationale": "Peau d'orange (dimpling from edema dilating hair follicles) is associated with breast cancer."}, {"text": "A nipple that recently became inverted", "correct": true, "rationale": "Recent nipple inversion can indicate an underlying mass."}, {"text": "Dimpling over a mass", "correct": true, "rationale": "Dimpling or retraction over a mass is associated with breast cancer."}, {"text": "Dilated veins on one breast only", "correct": true, "rationale": "Unilateral dilated veins are associated with breast cancer."}, {"text": "One breast slightly larger than the other", "correct": false, "rationale": "Slight asymmetry in size is a common, expected finding."}, {"text": "Oval-shaped areolas", "correct": false, "rationale": "Areolas can be round or oval."}]},
{"id": "w7tc-q12", "cat": "heartperipheralvascular", "type": "mc", "stem": "A nurse is auscultating a client's heart. Where is Erb's point?", "options": [{"text": "Right sternal border, 2nd intercostal space", "correct": false, "rationale": "This is the aortic area."}, {"text": "Left sternal border, 2nd intercostal space", "correct": false, "rationale": "This is the pulmonic area."}, {"text": "Left sternal border, 3rd intercostal space", "correct": true, "rationale": "Erb's point is at the left sternal border, 3rd intercostal space."}, {"text": "Left midclavicular line, 5th intercostal space", "correct": false, "rationale": "This is the apical/mitral area (PMI)."}]},
{"id": "w7tc-q13", "cat": "heartperipheralvascular", "type": "dragdrop", "stem": "Drag the cardiac auscultation sites located along the left sternal border into the answer box.", "leftLabel": "Auscultation sites", "rightLabel": "Left sternal border", "options": [{"text": "Pulmonic area", "correct": true, "rationale": "The pulmonic area is at the left sternal border, 2nd intercostal space."}, {"text": "Erb's point", "correct": true, "rationale": "Erb's point is at the left sternal border, 3rd intercostal space."}, {"text": "Tricuspid area", "correct": true, "rationale": "The tricuspid area is at the left sternal border, 4th intercostal space."}, {"text": "Aortic area", "correct": false, "rationale": "The aortic area is at the right sternal border, 2nd intercostal space."}, {"text": "Apical/mitral area", "correct": false, "rationale": "The apical/mitral area is at the left midclavicular line, 5th intercostal space."}]},
{"id": "w7tc-q14", "cat": "heartperipheralvascular", "type": "mc", "stem": "A nurse places the diaphragm of the stethoscope at the apex of the heart. Which heart sound is loudest at this site?", "options": [{"text": "S1, closure of the mitral and tricuspid valves", "correct": true, "rationale": "S1 marks the start of systole and is loudest at the apex."}, {"text": "S2, closure of the aortic and pulmonic valves", "correct": false, "rationale": "S2 is loudest at the base (aortic and pulmonic areas)."}, {"text": "S3 ventricular gallop", "correct": false, "rationale": "S3 is low-pitched and heard with the bell."}, {"text": "Carotid bruit", "correct": false, "rationale": "Bruits are heard over arteries with the bell, not at the cardiac apex."}]},
{"id": "w7tc-q15", "cat": "heartperipheralvascular", "type": "mc", "stem": "A nurse hears an extra heart sound right after S2 in a client who has heart failure. Which sound is this?", "options": [{"text": "S3 ventricular gallop", "correct": true, "rationale": "S3 follows S2 (\"Ken-tuck'-y\") and is associated with CHF."}, {"text": "S4 atrial gallop", "correct": false, "rationale": "S4 occurs just before S1 (\"Ten'-nes-see\")."}, {"text": "Systolic murmur", "correct": false, "rationale": "Systolic murmurs follow S1."}, {"text": "Split S1", "correct": false, "rationale": "A split S1 sounds like a stutter on the first heart sound."}]},
{"id": "w7tc-q16", "cat": "heartperipheralvascular", "type": "mc", "stem": "Which statement about S4 is correct?", "options": [{"text": "It occurs right after S2", "correct": false, "rationale": "An extra sound right after S2 is S3."}, {"text": "It occurs just before S1 and is associated with hypertension, CAD, and MI", "correct": true, "rationale": "S4 is an atrial gallop just before S1, reflecting a strong atrial contraction."}, {"text": "It is best heard with the diaphragm", "correct": false, "rationale": "S3 and S4 are low-pitched and best heard with the bell."}, {"text": "It is always an emergency", "correct": false, "rationale": "S4 can be an expected finding in older and athletic adults."}]},
{"id": "w7tc-q17", "cat": "heartperipheralvascular", "type": "mc", "stem": "A nurse hears a loud murmur and palpates a thrill. How should the nurse grade the murmur?", "options": [{"text": "Grade 2", "correct": false, "rationale": "Grade 2 is clearly audible but quiet, with no thrill."}, {"text": "Grade 3", "correct": false, "rationale": "Grade 3 is moderately loud, with no thrill."}, {"text": "Grade 4", "correct": true, "rationale": "Grade 4 is loud and associated with a thrill."}, {"text": "Grade 6", "correct": false, "rationale": "Grade 6 can be heard without touching the chest and has a visible thrill."}]},
{"id": "w7tc-q18", "cat": "heartperipheralvascular", "type": "mc", "stem": "A client has an irregular heart rhythm. Which action should the nurse take to check for a pulse deficit?", "options": [{"text": "Count the radial pulse for 30 seconds and multiply by 2", "correct": false, "rationale": "Irregular rhythms need a full-minute count, and a deficit compares two sites."}, {"text": "Have two nurses count the apical and radial pulses at the same time for 60 seconds", "correct": true, "rationale": "A difference of 2 or more beats indicates a pulse deficit."}, {"text": "Palpate both carotid arteries at the same time", "correct": false, "rationale": "Palpating both carotids at once can cause loss of consciousness."}, {"text": "Count the apical pulse, then the radial pulse", "correct": false, "rationale": "Pulses must be counted at the same time to compare accurately."}]},
{"id": "w7tc-q19", "cat": "heartperipheralvascular", "type": "mc", "stem": "A nurse observes jugular venous distention with the client's head elevated at 45°. Which condition should the nurse suspect?", "options": [{"text": "Left-sided heart failure", "correct": false, "rationale": "JVD reflects backup from the right atrium."}, {"text": "Right-sided heart failure", "correct": true, "rationale": "JVD occurs when blood backs up from the right atrium into the jugular veins, most commonly in right-sided heart failure."}, {"text": "Dehydration", "correct": false, "rationale": "Dehydration causes flat neck veins, not distention."}, {"text": "Expected finding", "correct": false, "rationale": "JVD at 45° is unexpected and should be reported."}]},
{"id": "w7tc-q20", "cat": "heartperipheralvascular", "type": "mc", "stem": "A nurse is palpating a client's carotid arteries. Which action should the nurse take?", "options": [{"text": "Palpate both carotid arteries at the same time to compare them", "correct": false, "rationale": "Occluding both can disrupt blood flow to the brain and cause loss of consciousness."}, {"text": "Palpate one carotid artery at a time", "correct": true, "rationale": "Palpate one side at a time to avoid vagal stimulation and decreased cerebral blood flow."}, {"text": "Use firm pressure to locate the pulse", "correct": false, "rationale": "Firm pressure can stimulate the vagus nerve and lower HR and BP."}, {"text": "Palpate lateral to the sternocleidomastoid", "correct": false, "rationale": "The carotid is medial to the sternocleidomastoid."}]},
{"id": "w7tc-q21", "cat": "heartperipheralvascular", "type": "mc", "stem": "A nurse palpates a weak, thready dorsalis pedis pulse. How should the nurse grade this pulse?", "options": [{"text": "0", "correct": false, "rationale": "0 means the pulse is absent."}, {"text": "1+", "correct": true, "rationale": "1+ is diminished, weak, and thready."}, {"text": "2+", "correct": false, "rationale": "2+ is a brisk, expected pulse."}, {"text": "3+", "correct": false, "rationale": "3+ is increased, full, and easy to palpate."}]},
{"id": "w7tc-q22", "cat": "heartperipheralvascular", "type": "mc", "stem": "A nurse blanches a client's nail bed and releases it. Which result indicates adequate peripheral circulation?", "options": [{"text": "Color returns in under 3 seconds", "correct": true, "rationale": "Brisk capillary refill under 3 seconds is expected."}, {"text": "Color returns in 5 seconds", "correct": false, "rationale": "Over 3 seconds indicates decreased perfusion."}, {"text": "The nail bed stays pale", "correct": false, "rationale": "No color return indicates poor perfusion."}, {"text": "The nail bed turns red and stays red", "correct": false, "rationale": "The expected finding is a brisk return to the client's baseline color."}]},
{"id": "w7tc-q23", "cat": "heartperipheralvascular", "type": "sata", "stem": "A nurse is inspecting the lower extremities of a client who has peripheral arterial disease. Which findings should the nurse expect? Select all that apply.", "options": [{"text": "Shiny, translucent skin", "correct": true, "rationale": "Arterial insufficiency causes thin, shiny, translucent skin."}, {"text": "Absent hair on the toes and feet", "correct": true, "rationale": "Arterial insufficiency causes hairless skin on the toes and feet."}, {"text": "Hair loss below the midcalf", "correct": true, "rationale": "Lack of hair below the midcalf is common with peripheral vascular disease."}, {"text": "Brown pigmentation around the ankles", "correct": false, "rationale": "Brown pigmentation is a sign of venous insufficiency."}, {"text": "Bilateral 3+ pitting edema", "correct": false, "rationale": "Bilateral edema suggests fluid volume excess or venous insufficiency."}]},
{"id": "w7tc-q24", "cat": "abdomen", "type": "dragdrop", "stem": "Drag the sites where the nurse should auscultate for bruits into the answer box.", "leftLabel": "Body sites", "rightLabel": "Bruit auscultation sites", "options": [{"text": "Carotid arteries", "correct": true, "rationale": "Listen over the carotid pulses with the bell."}, {"text": "Abdominal aorta", "correct": true, "rationale": "Listen just below the xiphoid process."}, {"text": "Renal arteries", "correct": true, "rationale": "Listen at the midclavicular lines above the umbilicus."}, {"text": "Iliac arteries", "correct": true, "rationale": "Listen at the midclavicular lines below the umbilicus."}, {"text": "Femoral arteries", "correct": true, "rationale": "Listen over the femoral pulses in the groin."}, {"text": "Radial arteries", "correct": false, "rationale": "Radial arteries are palpated for pulses, not auscultated for bruits."}, {"text": "Dorsalis pedis arteries", "correct": false, "rationale": "Dorsalis pedis arteries are palpated, not auscultated for bruits."}, {"text": "Brachial arteries", "correct": false, "rationale": "Brachial arteries are palpated for pulses, not auscultated for bruits."}]},
{"id": "w7tc-q25", "cat": "abdomen", "type": "mc", "stem": "A nurse is preparing to assess a client's abdomen. In which order should the nurse perform the techniques?", "options": [{"text": "Inspection, palpation, percussion, auscultation", "correct": false, "rationale": "Palpation and percussion before auscultation can alter bowel sounds."}, {"text": "Inspection, auscultation, percussion, palpation", "correct": true, "rationale": "Auscultate right after inspection because percussion and palpation can alter bowel sounds."}, {"text": "Auscultation, inspection, palpation, percussion", "correct": false, "rationale": "Inspection always comes first."}, {"text": "Palpation, inspection, auscultation, percussion", "correct": false, "rationale": "Touching the abdomen first can alter bowel sounds."}]},
{"id": "w7tc-q26", "cat": "abdomen", "type": "mc", "stem": "A nurse cannot hear bowel sounds in any quadrant. How long must the nurse listen before documenting absent bowel sounds?", "options": [{"text": "30 seconds", "correct": false, "rationale": "30 seconds is not long enough."}, {"text": "1 minute", "correct": false, "rationale": "1 minute is not long enough."}, {"text": "5 minutes", "correct": true, "rationale": "Bowel sounds are documented as absent only after a full 5 minutes with none heard."}, {"text": "10 minutes", "correct": false, "rationale": "5 minutes is the standard."}]},
{"id": "w7tc-q27", "cat": "abdomen", "type": "mc", "stem": "Which bowel sound finding should the nurse document as expected?", "options": [{"text": "High-pitched clicks and gurgles 5 to 35 times per minute", "correct": true, "rationale": "This is the expected finding."}, {"text": "Soft sounds fewer than 5 times per minute", "correct": false, "rationale": "Fewer than 5 per minute is hypoactive."}, {"text": "Loud, growling sounds heard without a stethoscope", "correct": false, "rationale": "Borborygmi indicate hyperperistalsis and are unexpected."}, {"text": "A swishing sound over the aorta", "correct": false, "rationale": "A vascular swishing sound (bruit) is unexpected and should be reported."}]},
{"id": "w7tc-q28", "cat": "abdomen", "type": "mc", "stem": "A nurse hears loud, growling sounds from a client's abdomen without a stethoscope. Which statement about this finding is correct?", "options": [{"text": "It is an expected finding", "correct": false, "rationale": "Borborygmi are an unexpected finding."}, {"text": "It indicates hyperperistalsis", "correct": true, "rationale": "Borborygmi are loud growling sounds from increased GI motility."}, {"text": "It indicates a bowel obstruction", "correct": false, "rationale": "Absent or hypoactive sounds are associated with obstruction."}, {"text": "It is a vascular sound", "correct": false, "rationale": "Vascular sounds are swishing bruits, not growling."}]},
{"id": "w7tc-q29", "cat": "abdomen", "type": "mc", "stem": "A client's abdomen protrudes mainly at midline, the skin is taut, and the flanks are unchanged. Which cause of distention should the nurse suspect?", "options": [{"text": "Fat", "correct": false, "rationale": "Fat causes rolls of adipose tissue along the sides, and the skin is not taut."}, {"text": "Fluid", "correct": false, "rationale": "Fluid causes the flanks to protrude, shifting to the dependent side when the client turns."}, {"text": "Flatus", "correct": true, "rationale": "Flatus causes a mainly midline protrusion with no flank involvement."}, {"text": "Hernia", "correct": false, "rationale": "A hernia is a protrusion through the abdominal wall, more visible when the client flexes the muscles."}]},
{"id": "w7tc-q30", "cat": "abdomen", "type": "mc", "stem": "A nurse percusses a client's abdomen. Which finding is expected over most of the abdomen?", "options": [{"text": "Tympany", "correct": true, "rationale": "Tympany, a drum-like sound from gas, is expected over most of the abdomen."}, {"text": "Dullness", "correct": false, "rationale": "Dullness is expected only over the liver, spleen, or a distended bladder."}, {"text": "Resonance", "correct": false, "rationale": "Resonance is the expected percussion sound over the lungs."}, {"text": "Hyperresonance", "correct": false, "rationale": "Hyperresonance indicates trapped air in the lungs."}]},
{"id": "w7tc-q31", "cat": "abdomen", "type": "mc", "stem": "A client's abdomen is rigid on palpation and no bowel sounds are heard. How should the nurse interpret these findings?", "options": [{"text": "Voluntary guarding from anxiety", "correct": false, "rationale": "Voluntary guarding relaxes when the client exhales; rigidity persists."}, {"text": "Possible peritoneal irritation that needs follow-up", "correct": true, "rationale": "A rigid abdomen, especially with hypoactive or absent bowel sounds, suggests peritoneal irritation."}, {"text": "Expected finding in older adults", "correct": false, "rationale": "Older adults have softer abdominal muscles, not rigidity."}, {"text": "A full bladder", "correct": false, "rationale": "A full bladder is palpable above the symphysis, not as generalized rigidity."}]},
{"id": "w7tc-q32", "cat": "abdomen", "type": "mc", "stem": "During light palpation, a client reports tenderness in the right lower quadrant. Which action should the nurse take?", "options": [{"text": "Palpate deeper to identify a mass", "correct": false, "rationale": "Deep palpation should never be done over tender areas."}, {"text": "Continue palpating all quadrants with firm pressure", "correct": false, "rationale": "Continuing could cause pain and injury."}, {"text": "Stop palpating and notify the provider", "correct": true, "rationale": "When tenderness is found, stop palpating and notify the provider."}, {"text": "Perform rebound tenderness testing in that quadrant", "correct": false, "rationale": "Rebound testing may be limited to advanced practitioners; stop and notify."}]},
{"id": "w7tc-q33", "cat": "abdomen", "type": "sata", "stem": "A nurse is assessing the abdomen of a thin adult client. Which findings should the nurse document as expected? Select all that apply.", "options": [{"text": "Tympany on percussion", "correct": true, "rationale": "Tympany is expected over most of the abdomen."}, {"text": "Soft, nontender abdomen", "correct": true, "rationale": "A soft, nontender abdomen with relaxed muscles is expected."}, {"text": "Silver striae", "correct": true, "rationale": "Silver stretch marks are an expected finding."}, {"text": "Pulsations at midline above the umbilicus", "correct": true, "rationale": "Aortic pulsations are expected in thin adults."}, {"text": "Dilated veins across the abdomen", "correct": false, "rationale": "Dilated veins may indicate liver disease, portal hypertension, or IVC obstruction."}, {"text": "Pain with fist percussion over the costovertebral angle", "correct": false, "rationale": "CVA tenderness suggests kidney inflammation."}]},
{"id": "w7tc-q34", "cat": "musculoskeletal", "type": "mc", "stem": "A client can move their arm against gravity but not against any resistance. How should the nurse grade this muscle strength?", "options": [{"text": "1", "correct": false, "rationale": "Grade 1 is a trace contraction with no limb movement."}, {"text": "2", "correct": false, "rationale": "Grade 2 is movement only with gravity eliminated."}, {"text": "3", "correct": true, "rationale": "Grade 3 is movement against gravity (about 50% strength)."}, {"text": "4", "correct": false, "rationale": "Grade 4 is movement against some resistance."}]},
{"id": "w7tc-q35", "cat": "musculoskeletal", "type": "mc", "stem": "A nurse observes an exaggerated convex curve of an older adult client's thoracic spine. How should the nurse document this finding?", "options": [{"text": "Lordosis", "correct": false, "rationale": "Lordosis is an exaggerated lumbar curve."}, {"text": "Scoliosis", "correct": false, "rationale": "Scoliosis is an exaggerated lateral curve."}, {"text": "Kyphosis", "correct": true, "rationale": "Kyphosis is an exaggerated thoracic curve, common in older adults with osteoporosis."}, {"text": "Expected double S curve", "correct": false, "rationale": "The thoracic spine is expected to be only slightly convex."}]},
{"id": "w7tc-q36", "cat": "musculoskeletal", "type": "mc", "stem": "A nurse is performing the Romberg test. Which finding is expected?", "options": [{"text": "The client walks heel to toe without losing balance", "correct": false, "rationale": "This is the expected finding for heel-to-toe walking."}, {"text": "The client stands with feet together and eyes closed with minimal sway for at least 5 seconds", "correct": true, "rationale": "Minimal sway is the expected Romberg result."}, {"text": "The client sways more than a few inches", "correct": false, "rationale": "Swaying more than a couple of inches means the nurse should stop the test and document difficulty with balance."}, {"text": "The client touches their nose with alternating fingers", "correct": false, "rationale": "This is the finger-to-nose coordination test."}]},
{"id": "w7tc-q37", "cat": "musculoskeletal", "type": "mc", "stem": "A nurse is assessing passive range of motion of a client's shoulder. Which action should the nurse take?", "options": [{"text": "Have the client repeat movements the nurse demonstrates", "correct": false, "rationale": "This describes active ROM."}, {"text": "Stop moving the joint at the point of pain or resistance", "correct": true, "rationale": "Never move a joint past the point of pain or resistance."}, {"text": "Move the joint slightly past resistance to improve flexibility", "correct": false, "rationale": "Moving past resistance can injure the client."}, {"text": "Test only the dominant shoulder", "correct": false, "rationale": "Joints are compared bilaterally."}]},
{"id": "w7tc-q38", "cat": "musculoskeletal", "type": "dragdrop", "stem": "Drag the movements that bring a body part toward the midline into the answer box.", "leftLabel": "ROM movements", "rightLabel": "Movement toward the midline", "options": [{"text": "Adduction", "correct": true, "rationale": "Adduction moves an extremity toward the midline."}, {"text": "Inversion", "correct": true, "rationale": "Inversion turns a body part toward the midline."}, {"text": "Abduction", "correct": false, "rationale": "Abduction moves an extremity away from the midline."}, {"text": "Eversion", "correct": false, "rationale": "Eversion turns a body part away from the midline."}, {"text": "Extension", "correct": false, "rationale": "Extension increases the angle between two bones."}, {"text": "External rotation", "correct": false, "rationale": "External rotation turns a joint outward."}]},
{"id": "w7tc-q39", "cat": "musculoskeletal", "type": "mc", "stem": "A nurse is performing the get-up-and-go test. How far should the client walk before turning back to the chair?", "options": [{"text": "1 m (3 ft)", "correct": false, "rationale": "The test uses 3 m (10 ft)."}, {"text": "3 m (10 ft)", "correct": true, "rationale": "The client rises without using the chair arms, walks 3 m (10 ft), turns, returns, and sits."}, {"text": "6 m (20 ft)", "correct": false, "rationale": "6 m (20 ft) is the Snellen chart distance."}, {"text": "Until the client becomes tired", "correct": false, "rationale": "The test uses a set distance and is timed."}]},
{"id": "w7tc-q40", "cat": "heartperipheralvascular", "type": "mc", "stem": "A nurse is inspecting a client's chest for the point of maximal impulse (PMI). Where should the nurse expect to find it?", "options": [{"text": "Right sternal border, 2nd intercostal space", "correct": false, "rationale": "This is the aortic auscultation area."}, {"text": "Left sternal border, 3rd intercostal space", "correct": false, "rationale": "This is Erb's point."}, {"text": "Left midclavicular line, 4th to 5th intercostal space", "correct": true, "rationale": "The PMI is the apical impulse, just medial to the left midclavicular line at the 4th–5th intercostal space, no larger than a nickel."}, {"text": "Just below the xiphoid process", "correct": false, "rationale": "This is where the abdominal aorta is auscultated for bruits."}]}
