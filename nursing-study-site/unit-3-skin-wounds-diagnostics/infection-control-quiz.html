<script>
var catLabels = {
  chainofinfection: "Chain of Infection",
  transmission: "Transmission",
  bodydefenses: "Body Defenses",
  inflammationstages: "Inflammation & Stages",
  diagnostictests: "Diagnostic Tests",

  haismdros: "HAIs & MDROs"
};
var bank = [
{"id": "w6-q01", "cat": "chainofinfection", "type": "mc", "stem": "A nurse is teaching a group of assistive personnel about the chain of infection. Which of the following is an example of a reservoir?", "options": [{"text": "Contaminated IV fluids", "correct": true, "rationale": "A reservoir is where an infectious agent lives, grows, and replicates. Inanimate reservoirs include IV fluids, medical equipment, food, water, and soil."}, {"text": "Staphylococcus aureus", "correct": false, "rationale": "This is the infectious agent itself, not the habitat where it lives and grows."}, {"text": "A client's cough", "correct": false, "rationale": "A cough is how a pathogen leaves the body, which makes it a portal of exit."}, {"text": "A surgical incision", "correct": false, "rationale": "A break in the skin gives a pathogen a way into the body, which makes it a portal of entry."}]},
{"id": "w6-q02", "cat": "chainofinfection", "type": "dragdrop", "stem": "A nurse is planning care to protect a client from infection. Which actions break the chain of infection at the susceptible host link? Move the correct actions to the answer box.", "leftLabel": "Nursing actions", "rightLabel": "Protects the susceptible host", "options": [{"text": "Administer the client's annual influenza vaccine", "correct": true, "rationale": "Immunizations increase the host's defenses and decrease susceptibility to infection."}, {"text": "Encourage meals with adequate protein and calories", "correct": true, "rationale": "Proper nutrition strengthens the host's line of defense against infection."}, {"text": "Monitor and help control the client's blood glucose", "correct": true, "rationale": "Blood sugar control is one of the ways to decrease host susceptibility."}, {"text": "Apply a dressing over a draining wound", "correct": false, "rationale": "Containing drainage breaks the chain at the portal of exit, not the susceptible host."}, {"text": "Send reusable instruments for sterilization", "correct": false, "rationale": "Sterilization destroys the infectious agent; it does not strengthen the host."}, {"text": "Clean the bedside table with a hospital-grade disinfectant", "correct": false, "rationale": "Cleaning surfaces removes an inanimate reservoir; it does not strengthen the host."}]},
{"id": "w6-q03", "cat": "chainofinfection", "type": "mc", "stem": "A nurse is caring for a client who has a large amount of drainage from an abdominal wound. Which action breaks the chain of infection at the portal of exit?", "options": [{"text": "Use a dressing to contain the drainage", "correct": true, "rationale": "Containing body fluids with drains or dressings keeps the pathogen from leaving the reservoir, which breaks the chain at the portal of exit."}, {"text": "Administer recommended immunizations", "correct": false, "rationale": "Immunizations break the chain at the susceptible host link."}, {"text": "Apply lotion to the client's dry skin", "correct": false, "rationale": "Moisturizing keeps the skin barrier intact, which helps prevent a portal of entry. It does not contain drainage leaving the body."}, {"text": "Sterilize the equipment used for wound care", "correct": false, "rationale": "Sterilization destroys the infectious agent; it does not address how the pathogen leaves the client."}]},
{"id": "w6-q04", "cat": "chainofinfection", "type": "mc", "stem": "A client has an indwelling urinary catheter. The nurse recognizes that the catheter represents which link in the chain of infection?", "options": [{"text": "Portal of entry", "correct": true, "rationale": "Invasive devices such as urinary catheters create a direct route for pathogens to travel into the body, in this case the bladder."}, {"text": "Infectious agent", "correct": false, "rationale": "The infectious agent is the organism (bacteria, virus, fungus, parasite, or prion), not the device."}, {"text": "Mode of transmission", "correct": false, "rationale": "Mode of transmission is how the pathogen moves from place to place, such as contact, droplet, or airborne."}, {"text": "Susceptible host", "correct": false, "rationale": "The client is the susceptible host. The catheter is the opening the pathogen uses to get in."}]},
{"id": "w6-q05", "cat": "chainofinfection", "type": "mc", "stem": "A nurse is reviewing several client records. Which clients have factors that increase their susceptibility to infection? Select all that apply.", "options": [{"text": "A client who takes a proton pump inhibitor daily", "correct": true, "rationale": "Gastric suppressants such as proton pump inhibitors are listed among medications that increase host susceptibility."}, {"text": "A client who is receiving radiation therapy", "correct": true, "rationale": "Radiation therapy increases susceptibility to infection."}, {"text": "A client who has a central venous catheter", "correct": true, "rationale": "Indwelling devices such as central venous catheters increase susceptibility by providing a portal of entry."}, {"text": "A client who takes a corticosteroid for asthma", "correct": true, "rationale": "Corticosteroids suppress the immune response and increase susceptibility."}, {"text": "A client who has received all recommended immunizations", "correct": false, "rationale": "Immunizations decrease susceptibility by strengthening the host's defenses."}, {"text": "A client who eats a balanced diet and sleeps well", "correct": false, "rationale": "Good nutrition and adequate sleep support immunity and decrease susceptibility."}]},
{"id": "w6-q06", "cat": "chainofinfection", "type": "mc", "stem": "A nasal swab shows MRSA in a client who has no manifestations of infection. The nurse should recognize that the client is", "options": [{"text": "colonized with the organism.", "correct": true, "rationale": "Colonization means the agent lives in the body, temporarily or permanently, without causing problems."}, {"text": "in the prodromal stage of infection.", "correct": false, "rationale": "The prodromal stage includes nonspecific manifestations such as fever and malaise. This client has none."}, {"text": "unable to transmit the organism to others.", "correct": false, "rationale": "A person can be a reservoir without showing disease and still pass the pathogen to new hosts."}, {"text": "immune to MRSA.", "correct": false, "rationale": "Having no manifestations does not mean the client is immune; the organism is present in the body."}]},
{"id": "w6-q07", "cat": "transmission", "type": "dragdrop", "stem": "A nurse is reviewing how pathogens spread on the unit. Which situations are examples of indirect contact transmission? Move the correct situations to the answer box.", "leftLabel": "Situations", "rightLabel": "Indirect contact transmission", "options": [{"text": "Wound drainage gets on a bed rail that staff then touch", "correct": true, "rationale": "Indirect contact occurs when a contaminated object sits between the infected person and the next person."}, {"text": "A nurse wears the same gloves while caring for two clients", "correct": true, "rationale": "Reusing PPE between clients carries the pathogen from one client to another through a contaminated item."}, {"text": "A shared blood pressure cuff is not disinfected between clients", "correct": true, "rationale": "Equipment shared between clients without proper cleaning transmits pathogens indirectly."}, {"text": "A client's blood splashes into an open cut on a nurse's hand", "correct": false, "rationale": "This is direct contact, because the pathogen moves straight from the infected person to another person."}, {"text": "A client sneezes and large droplets land in a visitor's mouth", "correct": false, "rationale": "This is droplet transmission into the mucosa of another host."}, {"text": "Many people become ill after eating the same contaminated produce", "correct": false, "rationale": "A common contaminated source that sickens many people is vehicle transmission."}]},
{"id": "w6-q08", "cat": "transmission", "type": "mc", "stem": "A nurse is caring for a client who has pertussis and is coughing frequently. The nurse should understand that droplets from the client can transmit infection to others within which distance?", "options": [{"text": "3 to 6 feet", "correct": true, "rationale": "Droplets released by coughing and sneezing can transmit infection to others within 3 to 6 feet."}, {"text": "Less than 1 foot", "correct": false, "rationale": "Droplets travel farther than this. Coughing and sneezing disperse them into the air around the client."}, {"text": "Throughout the unit, including outside the client's room", "correct": false, "rationale": "Particles that stay suspended and travel long distances describe airborne transmission, not droplet."}, {"text": "Only through touching the client", "correct": false, "rationale": "Spread through touch is contact transmission. Droplets travel through the air."}]},
{"id": "w6-q09", "cat": "transmission", "type": "mc", "stem": "Which client should the nurse place in an airborne infection isolation room?", "options": [{"text": "A client who has suspected pulmonary tuberculosis", "correct": true, "rationale": "TB is transmitted by the airborne route, so the client needs a private negative-pressure room."}, {"text": "A client who has influenza", "correct": false, "rationale": "Influenza requires droplet precautions. It can be airborne under certain conditions, but droplet precautions are adequate and a negative-pressure room is not required."}, {"text": "A client who has C. difficile", "correct": false, "rationale": "C. difficile requires contact precautions."}, {"text": "A client who has adenovirus", "correct": false, "rationale": "Adenovirus requires droplet precautions."}]},
{"id": "w6-q10", "cat": "bodydefenses", "type": "mc", "stem": "Which of the following are physical and chemical barriers that help protect the body from infection? Select all that apply.", "options": [{"text": "Intact skin", "correct": true, "rationale": "The skin is the body's largest organ and primary physical defense."}, {"text": "Stomach acid", "correct": true, "rationale": "The GI tract secretes acids and enzymes that destroy or neutralize some invaders."}, {"text": "Cilia in the respiratory tract", "correct": true, "rationale": "Cilia help keep particulates from entering the body."}, {"text": "Tears", "correct": true, "rationale": "Tears, along with sweat and WBCs, help remove waste from the body."}, {"text": "Antibodies", "correct": false, "rationale": "Antibodies are part of specific immunity."}, {"text": "Neutrophils", "correct": false, "rationale": "Neutrophils are phagocytes that are part of nonspecific immunity."}]},
{"id": "w6-q11", "cat": "bodydefenses", "type": "mc", "stem": "A client who is receiving oxygen through a nasal cannula reports that their nose feels dry. Which intervention should the nurse implement?", "options": [{"text": "Add humidification to the oxygen", "correct": true, "rationale": "Humidification keeps the mucous membranes moist. Dry membranes can crack and allow micro-organisms to enter."}, {"text": "Increase the oxygen flow rate", "correct": false, "rationale": "A higher flow would not relieve dryness and would require a prescription."}, {"text": "Remove the cannula for 1 hour each shift", "correct": false, "rationale": "Interrupting prescribed oxygen therapy is unsafe and does not address dryness."}, {"text": "Clean the nares with alcohol pads", "correct": false, "rationale": "Alcohol dries and irritates the mucous membranes, increasing the risk of cracking."}]},
{"id": "w6-q12", "cat": "bodydefenses", "type": "mc", "stem": "What is the role of phagocytes in nonspecific immunity?", "options": [{"text": "Eat and destroy micro-organisms", "correct": true, "rationale": "Phagocytes, such as neutrophils and macrophages, engulf and destroy micro-organisms."}, {"text": "Produce antibodies", "correct": false, "rationale": "Antibody production is part of specific immunity."}, {"text": "Act as a physical barrier", "correct": false, "rationale": "Physical barriers include the skin and mucous membranes, not phagocytes."}, {"text": "Increase host susceptibility", "correct": false, "rationale": "Phagocytes protect the body, which decreases susceptibility."}]},
{"id": "w6-q13", "cat": "bodydefenses", "type": "dragdrop", "stem": "Which of the following are part of nonspecific immunity? Move the correct items to the answer box.", "leftLabel": "Body defenses", "rightLabel": "Nonspecific immunity", "options": [{"text": "Neutrophils", "correct": true, "rationale": "Neutrophils are phagocytes released during the inflammatory response as part of nonspecific immunity."}, {"text": "Macrophages", "correct": true, "rationale": "Macrophages are phagocytes that make up nonspecific immunity along with neutrophils."}, {"text": "B cells", "correct": false, "rationale": "B cells are lymphocytes, which are part of specific immunity."}, {"text": "T cells", "correct": false, "rationale": "T cells are lymphocytes, which are part of specific immunity."}, {"text": "Antibodies", "correct": false, "rationale": "Antibodies (immunoglobulins) are part of specific immunity."}, {"text": "Intact skin", "correct": false, "rationale": "Intact skin is a physical barrier, a separate category of body defense."}]},
{"id": "w6-q14", "cat": "inflammationstages", "type": "mc", "stem": "A nurse is assessing a client's surgical incision on postoperative day 3. Which findings are manifestations of inflammation? Select all that apply.", "options": [{"text": "Skin around the incision is warm to the touch", "correct": true, "rationale": "Heat is one of the five cardinal signs of inflammation."}, {"text": "Redness along the incision line", "correct": true, "rationale": "Redness is one of the five cardinal signs of inflammation."}, {"text": "Swelling at the incision site", "correct": true, "rationale": "Swelling is one of the five cardinal signs of inflammation."}, {"text": "Client reports pain at the site", "correct": true, "rationale": "Pain is one of the five cardinal signs of inflammation."}, {"text": "Difficulty moving the affected area", "correct": true, "rationale": "Loss of function is one of the five cardinal signs of inflammation."}, {"text": "Pallor around the incision", "correct": false, "rationale": "Inflammation causes redness from increased blood flow, not pallor."}, {"text": "Skin cool to the touch", "correct": false, "rationale": "Inflammation causes heat at the site, not coolness."}]},
{"id": "w6-q15", "cat": "inflammationstages", "type": "dragdrop", "stem": "Which of the following are noninfectious triggers of the inflammatory response? Move the correct triggers to the answer box.", "leftLabel": "Triggers", "rightLabel": "Noninfectious triggers", "options": [{"text": "Burn", "correct": true, "rationale": "Burns are a physical noninfectious trigger."}, {"text": "Frostbite", "correct": true, "rationale": "Frostbite is a physical noninfectious trigger."}, {"text": "Alcohol", "correct": true, "rationale": "Alcohol is a chemical noninfectious trigger."}, {"text": "Damaged cells", "correct": true, "rationale": "Damaged cells are a biological noninfectious trigger."}, {"text": "Excitement", "correct": true, "rationale": "Excitement is a psychological noninfectious trigger."}, {"text": "Bacteria", "correct": false, "rationale": "Bacteria are an infectious trigger."}, {"text": "Viruses", "correct": false, "rationale": "Viruses are an infectious trigger."}, {"text": "Fungi", "correct": false, "rationale": "Fungi are other micro-organisms, which are infectious triggers."}]},
{"id": "w6-q16", "cat": "inflammationstages", "type": "mc", "stem": "A client who scraped their knee reports being unable to bend it because of swelling. The nurse documents this as which manifestation of inflammation?", "options": [{"text": "Loss of function", "correct": true, "rationale": "Being unable to use or move the area normally is loss of function, one of the five cardinal signs."}, {"text": "Heat", "correct": false, "rationale": "Heat is warmth radiating from the area, not difficulty moving it."}, {"text": "Redness", "correct": false, "rationale": "Redness is a color change at the site, not difficulty moving it."}, {"text": "Pain", "correct": false, "rationale": "Pain is a separate cardinal sign. The client's inability to bend the knee describes loss of function."}]},
{"id": "w6-q17", "cat": "inflammationstages", "type": "mc", "stem": "A client reports a fever, body aches, poor appetite, and fatigue for 1 day. No manifestations specific to a disease are present yet. The nurse identifies that the client is in which stage of infection?", "options": [{"text": "Prodromal", "correct": true, "rationale": "The prodromal stage brings initial nonspecific manifestations such as fever, aches, poor appetite, and malaise."}, {"text": "Incubation", "correct": false, "rationale": "During incubation the client has no manifestations yet."}, {"text": "Acute illness", "correct": false, "rationale": "In acute illness, manifestations specific to the disease become obvious."}, {"text": "Convalescence", "correct": false, "rationale": "Convalescence is the return to a previous or new balanced state of health."}]},
{"id": "w6-q18", "cat": "inflammationstages", "type": "mc", "stem": "A client was exposed to an infectious agent 2 days ago and has no manifestations. Which statement by the nurse is accurate?", "options": [{"text": "\"You may be in the incubation stage. Lab tests can sometimes detect changes before symptoms appear.\"", "correct": true, "rationale": "Incubation lasts from exposure until the first symptom. Changes may be detectable through lab or diagnostic tests before symptoms start."}, {"text": "\"Since you have no symptoms, you were not infected.\"", "correct": false, "rationale": "A client can be infected and in the incubation stage without symptoms."}, {"text": "\"You are in the period of decline.\"", "correct": false, "rationale": "Decline follows acute illness, when manifestations subside."}, {"text": "\"The incubation period always lasts exactly 2 weeks.\"", "correct": false, "rationale": "The incubation period differs for each agent and can last seconds, minutes, hours, days, or weeks."}]},
{"id": "w6-q19", "cat": "inflammationstages", "type": "mc", "stem": "A client's localized skin infection has spread into the bloodstream. Which treatment should the nurse anticipate?", "options": [{"text": "IV antibiotics with careful monitoring", "correct": true, "rationale": "A systemic infection starts locally and spreads through the bloodstream. It requires IV antibiotics and careful monitoring."}, {"text": "A topical antibiotic only", "correct": false, "rationale": "Topical antibiotics can treat local infections but are not enough for a systemic infection."}, {"text": "An oral antihistamine", "correct": false, "rationale": "Antihistamines block histamine to reduce swelling; they do not treat infection."}, {"text": "No treatment, because the infection will resolve on its own", "correct": false, "rationale": "A systemic infection affects the entire body and needs prompt treatment."}]},
{"id": "w6-q20", "cat": "diagnostictests", "type": "mc", "stem": "A client's WBC count is 16,000/mm³. The nurse interprets this finding as", "options": [{"text": "indicating inflammation or infection.", "correct": true, "rationale": "The expected WBC range is 5,000 to 10,000/mm³. An increased count indicates inflammation or infection."}, {"text": "within the expected range.", "correct": false, "rationale": "16,000/mm³ is above the expected range of 5,000 to 10,000/mm³."}, {"text": "indicating neutropenia.", "correct": false, "rationale": "Neutropenia is an abnormally low count, not a high one."}, {"text": "showing a decreased ability to fight infection.", "correct": false, "rationale": "A decreased ability to fight infection is shown by a WBC count below the expected range."}]},
{"id": "w6-q21", "cat": "handhygieneasepsis", "type": "mc", "stem": "In which situations should the nurse use soap and water instead of an alcohol-based hand rub? Select all that apply.", "options": [{"text": "The nurse's hands are visibly soiled", "correct": true, "rationale": "Alcohol-based hand rubs are not effective on visibly soiled hands. Soap and water remove dirt and debris."}, {"text": "After removing gloves when caring for a client who has C. difficile", "correct": true, "rationale": "Alcohol-based products do not remove spores. Wash with soap and water immediately after removing gloves."}, {"text": "Before entering the room of a client on droplet precautions", "correct": false, "rationale": "An alcohol-based hand rub is preferred when hands are not visibly soiled and spores are not involved."}, {"text": "After taking a client's blood pressure", "correct": false, "rationale": "With no visible soil and no spores, an alcohol-based hand rub is appropriate."}, {"text": "Before applying gloves to obtain a throat culture", "correct": false, "rationale": "Hand hygiene is required here, but an alcohol-based hand rub is acceptable when hands are not visibly soiled."}]},
{"id": "w6-q22", "cat": "handhygieneasepsis", "type": "mc", "stem": "A nurse is washing their hands with soap and water. For how long should the nurse rub the hands together?", "options": [{"text": "At least 20 seconds, about the time it takes to sing \"Happy Birthday\" twice", "correct": true, "rationale": "Scrubbing for at least 20 seconds creates enough friction to remove micro-organisms."}, {"text": "5 seconds", "correct": false, "rationale": "This is not enough time to remove micro-organisms from all hand surfaces."}, {"text": "Until the water runs warm", "correct": false, "rationale": "Water temperature should be adjusted before washing. It is not a measure of washing time."}, {"text": "2 minutes", "correct": false, "rationale": "This exceeds the recommended time for routine handwashing and can dry the skin."}]},
{"id": "w6-q23", "cat": "handhygieneasepsis", "type": "dragdrop", "stem": "A nurse is reviewing medical and surgical asepsis with staff. Which activities require surgical asepsis? Move the correct activities to the answer box.", "leftLabel": "Activities", "rightLabel": "Requires surgical asepsis", "options": [{"text": "Inserting an indwelling urinary catheter", "correct": true, "rationale": "Catheter insertion is an invasive procedure that requires sterile technique."}, {"text": "Assisting with central line insertion", "correct": true, "rationale": "Central line insertion requires maximal sterile barriers and aseptic technique."}, {"text": "Adding supplies to a sterile field", "correct": true, "rationale": "Items placed on a sterile field must remain sterile, which is surgical asepsis."}, {"text": "Performing hand hygiene before and after client care", "correct": false, "rationale": "Routine hand hygiene is medical asepsis (clean technique)."}, {"text": "Preparing oral medications in a clean area", "correct": false, "rationale": "Keeping medication preparation areas clean is medical asepsis."}, {"text": "Implementing isolation precautions", "correct": false, "rationale": "Isolation precautions are an example of medical asepsis."}]},
{"id": "w6-q24", "cat": "handhygieneasepsis", "type": "mc", "stem": "A nurse is opening a sterile package to set up a sterile field. Which flap should the nurse open first?", "options": [{"text": "The flap farthest from the nurse's body", "correct": true, "rationale": "Opening the far flap first prevents the nurse from reaching over the sterile field later."}, {"text": "The flap closest to the nurse's body", "correct": false, "rationale": "The closest flap is opened last. Opening it first would mean reaching over the field to open the others."}, {"text": "Either side flap", "correct": false, "rationale": "The side flaps are opened second, one at a time, after the far flap."}, {"text": "Whichever flap is easiest to reach", "correct": false, "rationale": "Sterile packages are opened in a set order (far, sides, near) to prevent contamination."}]},
{"id": "w6-q25", "cat": "handhygieneasepsis", "type": "mc", "stem": "Which process eliminates all micro-organisms, including bacterial spores?", "options": [{"text": "Sterilization", "correct": true, "rationale": "Sterilization eradicates all micro-organisms, including spores, through thermal, chemical, or radiation methods."}, {"text": "Low-level disinfection", "correct": false, "rationale": "Low-level disinfection destroys most vegetative bacteria, but some spores, fungi, and viruses may remain."}, {"text": "High-level disinfection", "correct": false, "rationale": "High-level disinfection eliminates almost all micro-organisms, but some spores remain."}, {"text": "Medical asepsis", "correct": false, "rationale": "Medical asepsis reduces the number of micro-organisms; it does not eliminate them."}]},
{"id": "w6-q26", "cat": "precautionsppe", "type": "dragdrop", "stem": "A nurse is preparing to administer oral medications to a client who is on contact precautions. Which PPE should the nurse don? Move the correct items to the answer box.", "leftLabel": "PPE", "rightLabel": "PPE to don", "options": [{"text": "Gown", "correct": true, "rationale": "Contact precautions require a gown at minimum when entering the room."}, {"text": "Gloves", "correct": true, "rationale": "Contact precautions require gloves at minimum when entering the room."}, {"text": "N95 respirator", "correct": false, "rationale": "N95 respirators are for airborne precautions."}, {"text": "Surgical mask", "correct": false, "rationale": "Surgical masks are for droplet precautions."}, {"text": "Goggles", "correct": false, "rationale": "Goggles are needed only when splashing to the eyes is expected."}, {"text": "Face shield", "correct": false, "rationale": "Face shields are needed only when splashing to the face is expected."}]},
{"id": "w6-q27", "cat": "precautionsppe", "type": "mc", "stem": "A client who has influenza and is on droplet precautions needs to be transported to the radiology department. Which action should the nurse take?", "options": [{"text": "Place a surgical mask on the client for transport", "correct": true, "rationale": "Clients on droplet precautions wear a mask when they leave their room to prevent spreading the infectious agent."}, {"text": "Place an N95 respirator on the client", "correct": false, "rationale": "N95 respirators are worn by staff for airborne precautions. A surgical mask is appropriate for the client."}, {"text": "Postpone the test until precautions are discontinued", "correct": false, "rationale": "Clients on precautions can leave the room for necessary care when they wear a mask."}, {"text": "Have the client wear a gown and gloves", "correct": false, "rationale": "A gown and gloves do not contain respiratory droplets. The client needs a mask."}]},
{"id": "w6-q28", "cat": "precautionsppe", "type": "mc", "stem": "A nurse is caring for a client who has suspected tuberculosis. Which actions should the nurse take? Select all that apply.", "options": [{"text": "Assign the client to an airborne infection isolation room", "correct": true, "rationale": "Clients on airborne precautions need a private negative-pressure room (AIIR)."}, {"text": "Keep the door to the room closed", "correct": true, "rationale": "The door of an airborne precaution room should remain closed."}, {"text": "Wear a fit-tested N95 respirator when entering the room", "correct": true, "rationale": "An N95 or higher respirator, specially fitted to the wearer, is required before entering."}, {"text": "Have the client wear a mask when leaving the room", "correct": true, "rationale": "Clients on airborne precautions wear a mask outside their room to prevent transmission."}, {"text": "Wear a surgical mask when providing care", "correct": false, "rationale": "A surgical mask is not enough for airborne particles. An N95 or higher respirator is required."}, {"text": "Leave the door open to monitor the client", "correct": false, "rationale": "An open door allows airborne particles to escape the negative-pressure room."}]},
{"id": "w6-q29", "cat": "precautionsppe", "type": "mc", "stem": "A nurse is removing PPE after caring for a client. Which item should the nurse remove first?", "options": [{"text": "Gloves", "correct": true, "rationale": "Gloves are the most contaminated item and are removed first, followed by goggles or face shield, gown, then mask."}, {"text": "Gown", "correct": false, "rationale": "The gown is removed after the gloves and the goggles or face shield."}, {"text": "Mask", "correct": false, "rationale": "The mask is removed last, by its ties or ear loops, before hand hygiene."}, {"text": "Goggles", "correct": false, "rationale": "Goggles are removed second, after the gloves."}]},
{"id": "w6-q30", "cat": "precautionsppe", "type": "mc", "stem": "A nurse is caring for a client who had an allogenic hematopoietic stem cell transplant 1 week ago. Which action is appropriate?", "options": [{"text": "Keep fresh and dried plants out of the client's room", "correct": true, "rationale": "Plants, fresh or dried, are typically prohibited in protective environments to reduce exposure to pathogens."}, {"text": "Place the client in a negative-pressure room", "correct": false, "rationale": "Protective isolation uses positive airflow with HEPA filtration to keep pathogens out. Negative pressure is for airborne precautions."}, {"text": "Encourage visits from family members who have cold symptoms", "correct": false, "rationale": "This client is immunocompromised and must be protected from exposure to infection."}, {"text": "Room the client with a client who has pneumonia", "correct": false, "rationale": "Rooming with an infected client would expose this immunocompromised client to pathogens."}]},
{"id": "w6-q31", "cat": "precautionsppe", "type": "mc", "stem": "A nurse is stuck with a needle that was just used on a client. Which action should the nurse take first?", "options": [{"text": "Wash the area with soap and water", "correct": true, "rationale": "Washing the exposed area with soap and water is the immediate first action after a needlestick."}, {"text": "Report the exposure to the charge nurse", "correct": false, "rationale": "The exposure must be reported immediately, but only after the area is washed."}, {"text": "Apply an antiseptic to the site", "correct": false, "rationale": "No research shows that antiseptics are more beneficial than soap and water."}, {"text": "Wait to see if the site becomes inflamed", "correct": false, "rationale": "Needlestick exposures need immediate action, reporting, and follow-up testing per protocol."}]},
{"id": "w6-q32", "cat": "haismdros", "type": "mc", "stem": "Which action should the nurse take to help prevent a catheter-associated urinary tract infection (CAUTI)?", "options": [{"text": "Advocate for removal of the catheter as soon as it is no longer needed", "correct": true, "rationale": "Avoiding unnecessary catheterization and removing the catheter early are key CAUTI prevention measures."}, {"text": "Place the drainage bag on the floor", "correct": false, "rationale": "When the tubing or bag touches a contaminated surface, pathogens can migrate into the bladder."}, {"text": "Insert a catheter routinely for all postoperative clients", "correct": false, "rationale": "Unnecessary catheterization increases infection risk."}, {"text": "Disconnect the tubing to empty the bag", "correct": false, "rationale": "Breaking the closed system contaminates it. The system must stay aseptic."}]},
{"id": "w6-q33", "cat": "haismdros", "type": "mc", "stem": "A client who has an MRSA infection asks the nurse what that means. Which statement by the nurse is accurate?", "options": [{"text": "\"It's a bacterium that is resistant to one or more classes of antimicrobials, which makes it challenging to treat.\"", "correct": true, "rationale": "MDROs such as MRSA resist one or more classes of antimicrobials and typically respond to only one or two medications."}, {"text": "\"It's a virus that responds to any antibiotic.\"", "correct": false, "rationale": "MRSA is a bacterium (Staphylococcus aureus), and it is resistant to certain antimicrobials."}, {"text": "\"It can only spread through the air.\"", "correct": false, "rationale": "MDROs are managed with contact precautions because they spread through direct and indirect contact."}, {"text": "\"No special precautions are needed.\"", "correct": false, "rationale": "Hand hygiene, gloves, and contact precautions are needed to prevent spreading MDROs to other clients."}]},
{"id": "w6-q34", "cat": "bodydefenses", "type": "mc", "stem": "A newborn receives antibodies from the mother. The nurse identifies this as which type of immunity?", "options": [{"text": "Passive immunity", "correct": true, "rationale": "Antibodies from an outside source, such as maternal antibodies, provide passive immunity. It is temporary and has no memory."}, {"text": "Active immunity", "correct": false, "rationale": "Active immunity develops when the body makes its own antibodies in response to an antigen."}, {"text": "Specific acquired immunity from vaccination", "correct": false, "rationale": "Vaccination stimulates the body to make its own antibodies, which is active immunity."}, {"text": "Permanent immunity", "correct": false, "rationale": "Passive immunity is temporary, not permanent."}]},
{"id": "w6-q35", "cat": "inflammationstages", "type": "mc", "stem": "An older adult client in a residential facility has a urinary tract infection. Which finding should the nurse recognize as an atypical indication of infection in this client?", "options": [{"text": "New onset of acute confusion", "correct": true, "rationale": "Older adults may show atypical signs such as confusion, agitation, or incontinence instead of typical findings."}, {"text": "Fever", "correct": false, "rationale": "Fever is a typical indication of infection."}, {"text": "Malaise", "correct": false, "rationale": "Malaise is a typical indication of infection."}, {"text": "Increased heart rate", "correct": false, "rationale": "Increased heart rate is a typical systemic finding."}]},
{"id": "w6-q36", "cat": "handhygieneasepsis", "type": "mc", "stem": "A nurse has prepared a sterile field. Which events contaminate the field? Select all that apply.", "options": [{"text": "Sterile normal saline soaks through the drape", "correct": true, "rationale": "Moisture wicks microbes from the nonsterile surface to the sterile surface."}, {"text": "The nurse turns their back on the field to speak to someone", "correct": true, "rationale": "Turning away means the nurse can't see whether the field was touched."}, {"text": "The procedure is delayed 1 hour", "correct": true, "rationale": "Prolonged exposure to air contaminates a sterile field."}, {"text": "The nurse holds a sterile item below waist level", "correct": true, "rationale": "Anything held below the waist is considered contaminated."}, {"text": "The client's hand brushes the outer 1-inch border", "correct": false, "rationale": "The 1-inch border is already considered nonsterile. Unless the client reached farther in, the field remains sterile."}, {"text": "The provider drops a sterile instrument onto the near side of the field", "correct": false, "rationale": "As long as no one reached over the field, it remains sterile."}]},
{"id": "w6-q37", "cat": "haismdros", "type": "mc", "stem": "Which action is the best way for the nurse to prevent health care-associated infections?", "options": [{"text": "Perform frequent and effective hand hygiene", "correct": true, "rationale": "Hand hygiene is the best way to prevent HAIs."}, {"text": "Administer prophylactic antibiotics to all clients", "correct": false, "rationale": "Overuse of antibiotics contributes to resistance and is not the best prevention."}, {"text": "Place all clients on contact precautions", "correct": false, "rationale": "Contact precautions are used for specific infections, not all clients."}, {"text": "Wear an N95 respirator for all care", "correct": false, "rationale": "N95s are for airborne precautions, not routine HAI prevention."}]},
{"id": "w6-q38", "cat": "diagnostictests", "type": "mc", "stem": "A provider prescribes an antibiotic and a wound culture for a client with a suspected infection. Which action should the nurse take first?", "options": [{"text": "Collect the specimen for culture and sensitivity", "correct": true, "rationale": "Cultures should be obtained before antibiotic therapy begins so results are accurate."}, {"text": "Administer the first dose of the antibiotic", "correct": false, "rationale": "Giving the antibiotic first can affect culture results."}, {"text": "Wait until the client develops a fever", "correct": false, "rationale": "Treatment and testing should not be delayed."}, {"text": "Obtain an antigen test instead", "correct": false, "rationale": "A culture and sensitivity identifies the organism and effective antibiotics."}]},
{"id": "w6-q39", "cat": "inflammationstages", "type": "mc", "stem": "A nurse is caring for a client who has active herpes zoster (shingles). Which action should the nurse take?", "options": [{"text": "Keep the client away from pregnant people who have not had chickenpox", "correct": true, "rationale": "The virus can spread through direct contact and cause chickenpox. Avoid exposing infants, pregnant people who haven't had chickenpox, and immunocompromised clients."}, {"text": "Discontinue isolation once the rash appears", "correct": false, "rationale": "Isolate the client until the vesicles have crusted over."}, {"text": "Administer the recombinant zoster vaccine to treat the rash", "correct": false, "rationale": "The vaccine prevents shingles but does not treat an active infection."}, {"text": "Apply warm compresses to the lesions", "correct": false, "rationale": "Cool water compresses or a cool bath are recommended."}]},
{"id": "w6-q40", "cat": "inflammationstages", "type": "dragdrop", "stem": "A nurse is caring for a client who has an infection. Which findings indicate the infection is systemic rather than localized? Move the correct findings to the answer box.", "leftLabel": "Findings", "rightLabel": "Systemic infection", "options": [{"text": "Fever", "correct": true, "rationale": "Fever is a systemic finding."}, {"text": "Increased heart and respiratory rates", "correct": true, "rationale": "Increased HR and RR are systemic responses to infection."}, {"text": "Malaise", "correct": true, "rationale": "Malaise affects the whole body and is a systemic finding."}, {"text": "Enlarged lymph nodes", "correct": true, "rationale": "Enlarged lymph nodes are listed among systemic infection findings."}, {"text": "Edema at the wound site", "correct": false, "rationale": "Edema limited to the site is a localized finding."}, {"text": "Tenderness at the wound site", "correct": false, "rationale": "Pain or tenderness at the site is a localized finding."}]}
];
