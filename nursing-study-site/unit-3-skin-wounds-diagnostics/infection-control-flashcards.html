<script>
var CATS = {
  chainofinfection: {label:"Chain of Infection", hue:"red"},
  transmission: {label:"Transmission", hue:"orange"},
  bodydefenses: {label:"Body Defenses", hue:"yellow"},
  inflammationstages: {label:"Inflammation &amp; Stages", hue:"green"},
  diagnostictests: {label:"Diagnostic Tests", hue:"aqua"},
  handhygieneasepsis: {label:"Hand Hygiene &amp; Asepsis", hue:"blue"},
  precautionsppe: {label:"Precautions &amp; PPE", hue:"violet"},
  haismdros: {label:"HAIs &amp; MDROs", hue:"magenta"}
};
var CARDS = [
[1, "chainofinfection", "Chain of infection", "Infectious agent → reservoir → portal of exit → mode of transmission → portal of entry → susceptible host. Breaking any link prevents infection"],
[2, "chainofinfection", "Types of pathogens", "Bacterium, virus, fungus, parasite or prion. Cellular (living): parasites, protozoa, fungi, bacteria. Acellular (nonliving): viruses, prions"],
[3, "chainofinfection", "Pathogen examples", "Bacteria: S. aureus, E. coli, M. tuberculosis. Viruses: HIV, hepatitis, herpes, SARS-CoV-2. Fungi: Candida, Aspergillus. Prions: CJD. Parasites: protozoa, helminths, flukes, arthropods"],
[4, "chainofinfection", "Reservoir", "Where the agent lives, grows and reproduces; animate or inanimate. A human reservoir can show no disease and still spread it. A fomite is an inanimate object that carries pathogens"],
[5, "chainofinfection", "Portals of exit and entry", "Exit: any body orifice, the skin, or blood and body fluids. Entry: any orifice, breaks in skin or mucous membranes, invasive lines and devices. They can be the same, depending on the organism"],
[6, "chainofinfection", "Susceptible host", "A host the agent can take hold in; not everyone exposed gets sick. Colonized = the agent lives in the body without causing problems"],
[7, "chainofinfection", "Factors that increase susceptibility", "Age; underlying disease (HIV/AIDS, malignancy, transplant); immunosuppressants, antirejection meds, antineoplastics, antimicrobials, corticosteroids, PPIs; surgery; radiation; indwelling devices"],
[8, "chainofinfection", "Breaking the chain at each link", "Agent: disinfect, sterilize, clean, antimicrobials. Reservoir: hand hygiene, preop skin prep, environmental cleaning. Portal of exit: contain fluids with drains or dressings, decrease secretions. Host: immunizations, nutrition, hygiene, blood sugar control"],
[9, "chainofinfection", "Virulence", "How efficient an agent is at making people ill; more virulent = more potent"],
[10, "transmission", "Modes of transmission", "Contact, droplet, airborne (the main 3), plus vehicle and vector-borne"],
[11, "transmission", "Direct vs indirect contact", "Direct: straight from the infected person to another. Indirect: through a contaminated object or person in between (S. aureus is notorious for indirect spread)"],
[12, "transmission", "Droplet transmission", "Droplets larger than 5 microns reach a host's mucosa within 3–6 ft (ATI also gives 3 ft and 6–10 ft in other places), from sneezing, coughing, talking, CPR, intubation. Influenza, pertussis, RSV, adenovirus, rhinovirus, norovirus, coronavirus, Mycoplasma pneumoniae"],
[13, "transmission", "Airborne transmission", "Particles smaller than 5 microns stay suspended, travel long distances and are inhaled. TB, measles (rubeola), varicella (chickenpox)"],
[14, "transmission", "Vehicle vs vector-borne", "Vehicle: one contaminated source spreads to many people. Vector: an animal carries the organism without being infected itself"],
[15, "transmission", "Respiratory hygiene / cough etiquette", "Cover the mouth and nose, tissues in a hands-free bin, mask when coughing or out of the room, stay at least 3 ft from others, hand hygiene"],
[16, "bodydefenses", "3 types of body defenses", "Physical and chemical barriers, nonspecific immunity, specific immunity"],
[17, "bodydefenses", "Skin", "Largest organ and primary physical defense; reduces water loss, protects against abrasion and microbes. Protect it with gentle cleansers, moisturizers, less tape, no irritants"],
[18, "bodydefenses", "Stratum corneum", "Skin's lipid layer; damaged by detergents, tape and chemicals; about half restored in 6 hr, fully in 5–6 days"],
[19, "bodydefenses", "Mucous membranes", "Secrete mucus; if they dry and crack, microbes enter. Keep moist; humidify oxygen"],
[20, "bodydefenses", "Other barriers", "Tears, sweat, WBCs, cilia, coughing, GI acids and enzymes, normal GI flora (antibiotics destroy it), longer male urethra, vaginal pH"],
[21, "bodydefenses", "Nonspecific (innate) immunity", "Neutrophils and macrophages act as phagocytes (eat and destroy microbes); responds immediately to any organism; no memory"],
[22, "bodydefenses", "Specific (acquired) immunity", "Antibodies (immunoglobulins) and B and T lymphocytes; acts when nonspecific defenses fail; remembers a specific invader. Antibodies bind the agent and activate WBCs and complement"],
[23, "bodydefenses", "Passive vs active immunity", "Passive: antibodies from an outside source; temporary, no memory. Active: the body makes its own after exposure; takes time but is permanent, with memory"],
[24, "bodydefenses", "Immunoglobulins", "IgA, IgD, IgE, IgG, IgM"],
[25, "inflammationstages", "Inflammatory response", "The body's defense against injury, foreign substances or infectious agents"],
[26, "inflammationstages", "4 steps of inflammation", "Pattern receptors recognize harmful stimuli → pathway activated → markers released → inflammatory cells recruited"],
[27, "inflammationstages", "Triggers of inflammation", "Infectious: viruses, bacteria, fungi. Noninfectious: physical (burns, frostbite, trauma, radiation), chemical (glucose, fatty acids, alcohol, toxins), biological (damaged cells), psychological (stress, depression, hostility)"],
[28, "inflammationstages", "5 cardinal signs of inflammation", "Heat, redness, swelling, pain, loss of function"],
[29, "inflammationstages", "Medications for inflammation", "Antihistamines block histamine from mast cells (prevent swelling); NSAIDs decrease painful inflammation"],
[30, "inflammationstages", "Acute vs chronic inflammation", "Acute: a one-time event (hit by a ball). Chronic: repeats (asthma, GERD) and can cause tissue destruction and cancer"],
[31, "inflammationstages", "Inflammatory response sequence", "Bacteria invade → histamine, kinins, prostaglandins → plasma enters the site → phagocytosis → pus"],
[32, "inflammationstages", "Stages of infection (in order)", "Incubation → prodromal → acute illness → decline → convalescence"],
[33, "inflammationstages", "Incubation and prodromal stages", "Incubation: exposure until the first symptom (labs may change first; seconds to weeks). Prodromal: nonspecific symptoms (fever, aches, poor appetite, malaise)"],
[34, "inflammationstages", "Acute illness, decline and convalescence", "Acute: specific signs obvious, infection severe. Decline: symptoms subside, strength returns. Convalescence: back to previous or a new balanced health; may have lasting effects"],
[35, "inflammationstages", "Local vs systemic infection", "Local: one area; topical or oral antibiotics. Systemic: spreads through the bloodstream; IV antibiotics and monitoring"],
[36, "inflammationstages", "Systemic infection findings", "Fever, increased HR and RR, malaise, fatigue, anorexia, nausea and vomiting, enlarged lymph nodes"],
[37, "inflammationstages", "Chills vs diaphoresis", "Chills (shivering) as a fever starts, pushing temperature up; diaphoresis (sweating) as a fever breaks, cooling the body"],
[38, "inflammationstages", "Infection in older adults", "May show only atypical signs (confusion, agitation, incontinence); may be advanced before it's recognized"],
[39, "inflammationstages", "Sepsis", "Systemic inflammatory response to a serious infection, usually bacterial; can cause organ failure and shock; confirmed with blood cultures. Risk: very young or old, weak immune system, severe trauma"],
[40, "inflammationstages", "Herpes zoster (shingles)", "Reactivated varicella dormant in nerve roots: painful, one-sided vesicular rash along a dermatome, often preceded by pain, itching or tingling"],
[41, "inflammationstages", "Shingles nursing care", "Isolate until vesicles crust; keep away from infants, nonimmune pregnant people and immunocompromised clients; cool compresses, calamine; acyclovir works best started early"],
[42, "inflammationstages", "Shingles vaccine and postherpetic neuralgia", "Two-dose recombinant vaccine prevents shingles and postherpetic neuralgia but doesn't treat it. Postherpetic neuralgia: pain over 3 months after the rash; common after 60; tricyclic antidepressants may help"],
[43, "diagnostictests", "Urinalysis and culture & sensitivity", "UTI symptoms → urinalysis; if WBCs are present, culture identifies the organism and sensitivity shows which antibiotics work. Obtain cultures before antibiotics"],
[44, "diagnostictests", "Chest x-ray", "Confirms atelectasis or pneumonia but can't tell the type (viral, bacterial, fungal)"],
[45, "diagnostictests", "Throat culture", "Swab only the tonsils, tonsillar pillars or posterior pharynx; don't touch lips, teeth, tongue, cheeks or uvula; put in the medium right away and label. Severely inflamed epiglottis: don't swab, notify the provider"],
[46, "diagnostictests", "WBC count", "5,000–10,000/mm³. Above 10,000 (leukocytosis) = inflammation or infection. Low (neutropenia) = less able to fight infection"],
[47, "diagnostictests", "WBC differential (most to least)", "Neutrophils > lymphocytes > monocytes > eosinophils > basophils; totals 100%"],
[48, "diagnostictests", "Neutrophils", "55–70%; first responders, eat bacteria (segs, polymorphonuclear leukocytes). Bands or stabs are immature neutrophils; a \"left shift\" means ongoing infection"],
[49, "diagnostictests", "Lymphocytes", "20–40%; fight chronic bacterial and acute viral infections; T and B cells"],
[50, "diagnostictests", "Monocytes", "2–8%; phagocytes that clean up tissue damage; produce interferon"],
[51, "diagnostictests", "Eosinophils", "1–4%; allergic reactions and parasitic infections"],
[52, "diagnostictests", "Basophils", "0.5–1%; release histamine, serotonin, heparin (mast cells)"],
[53, "diagnostictests", "CRP and procalcitonin (PCT)", "Nonspecific inflammation markers, not standardized (use the same lab each time); CRP under 1 is normal. NLR, PLR and SII are CBC-ratio markers of chronic inflammation"],
[54, "diagnostictests", "ESR", "Rises with inflammation or infection; expected 15–20 mm/hr, above 20 = active inflammation; varies by age and sex"],
[55, "diagnostictests", "Antibody, antigen and NAAT tests", "Antibody: past exposure, not current infection. Antigen: detects a specific pathogen. NAAT (nucleic acid amplification test): detects the pathogen's genetic material; highly sensitive"],
[56, "diagnostictests", "Auto-antibody screening and immunoglobulin electrophoresis", "Auto-antibodies: against the body's own cells (lupus, RA). Electrophoresis: measures specific immunoglobulins (IgG, IgA, IgM)"],
[57, "diagnostictests", "Gallium scan", "IV radioactive gallium collects where WBCs gather, showing inflammation sites"],
[58, "handhygieneasepsis", "ABHR (alcohol-based hand rub) vs soap and water", "ABHR unless hands are visibly soiled. Soap and water for visible soil and C. diff spores (gloves on, then wash after removing them; alcohol doesn't remove spores)"],
[59, "handhygieneasepsis", "Handwashing", "Soap, running water and friction for at least 20 seconds, Happy Birthday twice (slides: 15–30 seconds; instructors confirmed 20 seconds for exams)"],
[60, "handhygieneasepsis", "Hand sanitizer", "At least 60% alcohol; cover all surfaces and rub until dry, about 20–30 seconds"],
[61, "handhygieneasepsis", "When to perform hand hygiene", "Before and after client contact, after removing gloves, before procedures or sterile fields, before and after eating, after the restroom"],
[62, "handhygieneasepsis", "Nails", "Natural, unpolished, 0.25 in (0.6 cm) or shorter; no artificial or gel nails or chipped polish. The subungual area (under the nails) harbors the most microbes"],
[63, "handhygieneasepsis", "Handwashing key points", "Hands below elbows, warm water, 3–5 mL soap, firm circular motions, 1 in above the wrist, rinse fingertips down, pat dry fingertips to wrists, faucet off with a dry towel"],
[64, "handhygieneasepsis", "Medical vs surgical asepsis", "Medical (clean) reduces microbes: oral meds, NG tubes, hygiene. Surgical (sterile) means none present and prevents SSIs: parenteral meds, urinary catheter insertion, sterile dressings"],
[65, "handhygieneasepsis", "Latex allergy", "Check the client and team before any aseptic procedure; latex-free supplies if anyone is allergic"],
[66, "handhygieneasepsis", "Sterilization vs disinfection", "Sterilization kills everything, including spores (autoclave, chemical, radiation). Disinfection kills most: high-level leaves some spores (endoscopes); low-level is for surfaces, not visible blood. Clean off visible soil first"],
[67, "handhygieneasepsis", "Sterile field setup", "Waist-high flat surface near the client, 12–18 in from walls; check package integrity and the indicator; the outer 1 in border is contaminated"],
[68, "handhygieneasepsis", "Opening sterile packages", "Far flap → side flaps → near flap; never reach over the field. Open items used last first and place them farthest away"],
[69, "handhygieneasepsis", "Adding items to a sterile field", "Drop gently into the center from about 6 in (15 cm)"],
[70, "handhygieneasepsis", "Sterile field contamination", "Below the waist or above the chest, reaching over it, turning your back, coughing or talking over it, a wet package or drape, or leaving it exposed too long"],
[71, "handhygieneasepsis", "Pouring a sterile solution", "Cap face-up on a clean surface, label in your palm, pour off 1–2 mL first, don't touch the bottle to the site"],
[72, "handhygieneasepsis", "What sterile gloves can touch", "The other sterile glove, items on the field, inner wrappings of field items; not the 1 in border or the outside of the solution bottle"],
[73, "handhygieneasepsis", "Client coughing during a sterile procedure", "Have the client wear a mask"],
[74, "handhygieneasepsis", "Surgical hand scrub", "Cap, shoe covers, mask and eyewear first; remove jewelry, clean nails, hands above elbows, scrub to 2 in above the elbow"],
[75, "handhygieneasepsis", "Sterile gown and gloving", "Sterile area: sleeves from just above the cuff to 2 in above the elbow (axilla and back aren't sterile). Open gloving: no gown (catheter insertion). Closed: hands stay in the gown cuffs"],
[76, "precautionsppe", "Standard precautions", "For all clients: blood, body fluids, secretions, excretions (except sweat), nonintact skin, mucous membranes. Private room only if the client can't maintain hygiene"],
[77, "precautionsppe", "Contact precautions", "Gown and gloves on entry; private room or cohort 3 ft apart. Examples: herpes simplex, impetigo, scabies, shigella, MDROs, C. diff"],
[78, "precautionsppe", "Droplet precautions", "Surgical mask (gown and gloves if contact with secretions); private room or cohort 3 ft apart with curtain drawn; client masks outside the room. Hib, pertussis, mumps, rubella, strep, scarlet fever, meningococcal, plague, influenza"],
[79, "precautionsppe", "Airborne precautions", "Fit-tested N95; AIIR (negative pressure, 12 exchanges/hr new or 6 renovated, air out or through HEPA) with the door closed; client masks outside the room"],
[80, "precautionsppe", "Protective isolation", "Immunocompromised clients (allogenic HSCT, first 100 days): positive airflow, HEPA, 12+ exchanges/hr, no plants; client masks out of the room"],
[81, "precautionsppe", "Cohorting and enhanced barrier precautions", "Cohorting: same infection, same room (consult infection control). Enhanced barrier (nursing homes): gown and gloves for high-contact care to limit MDRO spread"],
[82, "precautionsppe", "Transporting a client on precautions", "Surgical mask for airborne or droplet infections; cover draining wounds"],
[83, "precautionsppe", "Psychosocial effects of isolation", "More depression and loneliness; explain why and provide sensory stimulation"],
[84, "precautionsppe", "Gloves", "Wear for possible contact with blood, body fluids, mucous membranes, nonintact skin or infectious material, and for contact precautions. Change if torn, between sites, before keyboards, between clients; never wash or reuse"],
[85, "precautionsppe", "PPE donning order", "Hand hygiene → gown → mask/respirator → goggles/face shield → gloves (over the gown cuffs)"],
[86, "precautionsppe", "PPE removal order", "Gloves → goggles/face shield → gown → mask → hand hygiene"],
[87, "precautionsppe", "Gown and clean parts of PPE", "Gown is single use; roll inside out and discard before leaving. Ties, earpieces and headband are clean; the front is contaminated"],
[88, "precautionsppe", "N95 fit check", "Inhale: it collapses. Exhale: no leaks. Must be fit-tested"],
[89, "precautionsppe", "Face shield vs goggles", "A crown-to-chin face shield protects best against splashes; eyeglasses aren't a substitute"],
[90, "precautionsppe", "Blood or body fluid exposure", "Wash skin with soap and water; irrigate eyes with water or NS; flush nose or mouth with water; report immediately"],
[91, "precautionsppe", "Needlestick prevention", "Engage the safety device, sharps box less than ¾ full, needleless systems; always report sticks"],
[92, "precautionsppe", "Soiled linens and medical waste", "Linens: bag at the point of care, don't shake or sort, gloves, double-bag if leaking. Waste: leak-resistant biohazard bag; sharps in a puncture-resistant container at the point of care"],
[93, "precautionsppe", "Recommended immunizations for health care workers", "Varicella, hep B, influenza, MMR, meningococcal, Tdap, COVID-19"],
[94, "haismdros", "HAI (health care–associated infection)", "Acquired in a health care facility; invasive devices create extra portals of entry. Best prevention: hand hygiene"],
[95, "haismdros", "4 major HAIs", "CLABSI, CAUTI, SSI, VAP"],
[96, "haismdros", "Most common HAI site", "Urinary tract (E. coli, S. aureus, enterococci)"],
[97, "haismdros", "Exogenous, endogenous and iatrogenic HAIs", "Exogenous: from outside the client. Endogenous: from the client's own altered flora. Iatrogenic: caused by a diagnostic or therapeutic procedure"],
[98, "haismdros", "Care bundle", "A set of evidence-based practices to prevent HAIs, starting with hand hygiene"],
[99, "haismdros", "CLABSI prevention", "Insertion: maximal sterile barriers, avoid the femoral site in obese clients, chlorhexidine >0.5% with alcohol. Dressings: gauze every 2 days, semipermeable every 7, sooner if wet, soiled or loose"],
[100, "haismdros", "Scrub the hub", "Chlorhexidine, iodophor, 70% alcohol or povidone-iodine, with friction"],
[101, "haismdros", "IV tubing changes", "Propofol every 6–12 hr; fat emulsions or blood every 24 hr; other continuous infusions every 4–7 days"],
[102, "haismdros", "CAUTI and VAP prevention", "CAUTI: avoid unneeded catheters, remove early, keep aseptic. VAP bundle: hand hygiene, positioning, fewer circuit changes, mouth care, nutrition"],
[103, "haismdros", "MDROs (multidrug-resistant organisms)", "MRSA, VRE, VRSA, VISA, ESBL-producing organisms, MDRSP; resist one or more antimicrobial classes and respond to only 1–2 drugs. Hand hygiene, gloves, contact precautions, antibiotic stewardship"],
[104, "haismdros", "MRSA and VRSA", "MRSA: treat with vancomycin or linezolid. VRSA: S. aureus resistant to vancomycin but sensitive to some other antibiotics"],
[105, "haismdros", "Antimicrobial teaching and effectiveness", "Finish the full course; avoid overuse. Working: less fever, more comfort, falling WBC count"],
[106, "haismdros", "Antipyretics", "Acetaminophen, ibuprofen, aspirin; monitor and trend temperature"],
[107, "haismdros", "Reportable diseases", "More than 60 diseases reported to public health so cases are treated, outbreaks tracked and prevention planned"],
[108, "haismdros", "Recommended vaccines", "Pneumococcal (PPSV) for at-risk adults; meningococcal for adolescents before communal living; COVID-19 for everyone 6 months and older; Hib for infants"]
];
initFlashcards(CATS, CARDS);
