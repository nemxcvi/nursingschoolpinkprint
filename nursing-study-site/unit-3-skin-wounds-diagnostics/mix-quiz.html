hypertension, CAD, and MI", "correct": true, "rationale": "S4 is an atrial gallop just before S1, reflecting a strong atrial contraction."}, {"text": "It is best heard with the diaphragm", "correct": false, "rationale": "S3 and S4 are low-pitched and best heard with the bell."}, {"text": "It is always an emergency", "correct": false, "rationale": "S4 can be an expected finding in older and athletic adults."}]}, {"id": "w7tc-q17", "cat": "thoraxcardioabdmsk", "type": "mc", "stem": "A nurse hears a loud murmur and palpates a thrill. How should the nurse grade the murmur?", "options": [{"text": "Grade 2", "correct": false, "rationale": "Grade 2 is clearly audible but quiet, with no thrill."}, {"text": "Grade 3", "correct": false, "rationale": "Grade 3 is moderately loud, with no thrill."}, {"text": "Grade 4", "correct": true, "rationale": "Grade 4 is loud and associated with a thrill."}, {"text": "Grade 6", "correct": false, "rationale": "Grade 6 can be heard without touching the chest and has a visible thrill."}]}, {"id": "w7tc-q18", "cat": "thoraxcardioabdmsk", "type": "mc", "stem": "A client has an irregular heart rhythm. Which action should the nurse take to check for a pulse deficit?", "options": [{"text": "Count the radial pulse for 30 seconds and multiply by 2", "correct": false, "rationale": "Irregular rhythms need a full-minute count, and a deficit compares two sites."}, {"text": "Have two nurses count the apical and radial pulses at the same time for 60 seconds", "correct": true, "rationale": "A difference of 2 or more beats indicates a pulse deficit."}, {"text": "Palpate both carotid arteries at the same time", "correct": false, "rationale": "Palpating both carotids at once can cause loss of consciousness."}, {"text": "Count the apical pulse, then the radial pulse", "correct": false, "rationale": "Pulses must be counted at the same time to compare accurately."}]}, {"id": "w7tc-q19", "cat": "thoraxcardioabdmsk", "type": "mc", "stem": "A nurse observes jugular venous distention with the client's head elevated at 45\u00b0. Which condition should the nurse suspect?", "options": [{"text": "Left-sided heart failure", "correct": false, "rationale": "JVD reflects backup from the right atrium."}, {"text": "Right-sided heart failure", "correct": true, "rationale": "JVD occurs when blood backs up from the right atrium into the jugular veins, most commonly in right-sided heart failure."}, {"text": "Dehydration", "correct": false, "rationale": "Dehydration causes flat neck veins, not distention."}, {"text": "Expected finding", "correct": false, "rationale": "JVD at 45\u00b0 is unexpected and should be reported."}]}, {"id": "w7tc-q20", "cat": "thoraxcardioabdmsk", "type": "mc", "stem": "A nurse is palpating a client's carotid arteries. Which action should the nurse take?", "options": [{"text": "Palpate both carotid arteries at the same time to compare them", "correct": false, "rationale": "Occluding both can disrupt blood flow to the brain and cause loss of consciousness."}, {"text": "Palpate one carotid artery at a time", "correct": true, "rationale": "Palpate one side at a time to avoid vagal stimulation and decreased cerebral blood flow."}, {"text": "Use firm pressure to locate the pulse", "correct": false, "rationale": "Firm pressure can stimulate the vagus nerve and lower HR and BP."}, {"text": "Palpate lateral to the sternocleidomastoid", "correct": false, "rationale": "The carotid is medial to the sternocleidomastoid."}]}, {"id": "w7tc-q21", "cat": "thoraxcardioabdmsk", "type": "mc", "stem": "A nurse palpates a weak, thready dorsalis pedis pulse. How should the nurse grade this pulse?", "options": [{"text": "0", "correct": false, "rationale": "0 means the pulse is absent."}, {"text": "1+", "correct": true, "rationale": "1+ is diminished, weak, and thready."}, {"text": "2+", "correct": false, "rationale": "2+ is a brisk, expected pulse."}, {"text": "3+", "correct": false, "rationale": "3+ is increased, full, and easy to palpate."}]}, {"id": "w7tc-q22", "cat": "thoraxcardioabdmsk", "type": "mc", "stem": "A nurse blanches a client's nail bed and releases it. Which result indicates adequate peripheral circulation?", "options": [{"text": "Color returns in under 3 seconds", "correct": true, "rationale": "Brisk capillary refill under 3 seconds is expected."}, {"text": "Color returns in 5 seconds", "correct": false, "rationale": "Over 3 seconds indicates decreased perfusion."}, {"text": "The nail bed stays pale", "correct": false, "rationale": "No color return indicates poor perfusion."}, {"text": "The nail bed turns red and stays red", "correct": false, "rationale": "The expected finding is a brisk return to the client's baseline color."}]}, {"id": "w7tc-q23", "cat": "thoraxcardioabdmsk", "type": "sata", "stem": "A nurse is inspecting the lower extremities of a client who has peripheral arterial disease. Which findings should the nurse expect? Select all that apply.", "options": [{"text": "Shiny, translucent skin", "correct": true, "rationale": "Arterial insufficiency causes thin, shiny, translucent skin."}, {"text": "Absent hair on the toes and feet", "correct": true, "rationale": "Arterial insufficiency causes hairless skin on the toes and feet."}, {"text": "Hair loss below the midcalf", "correct": true, "rationale": "Lack of hair below the midcalf is common with peripheral vascular disease."}, {"text": "Brown pigmentation around the ankles", "correct": false, "rationale": "Brown pigmentation is a sign of venous insufficiency."}, {"text": "Bilateral 3+ pitting edema", "correct": false, "rationale": "Bilateral edema suggests fluid volume excess or venous insufficiency."}]}, {"id": "w7tc-q24", "cat": "thoraxcardioabdmsk", "type": "dragdrop", "stem": "Drag the sites where the nurse should auscultate for bruits into the answer box.", "leftLabel": "Body sites", "rightLabel": "Bruit auscultation sites", "options": [{"text": "Carotid arteries", "correct": true, "rationale": "Listen over the carotid pulses with the bell."}, {"text": "Abdominal aorta", "correct": true, "rationale": "Listen just below the xiphoid process."}, {"text": "Renal arteries", "correct": true, "rationale": "Listen at the midclavicular lines above the umbilicus."}, {"text": "Iliac arteries", "correct": true, "rationale": "Listen at the midclavicular lines below the umbilicus."}, {"text": "Femoral arteries", "correct": true, "rationale": "Listen over the femoral pulses in the groin."}, {"text": "Radial arteries", "correct": false, "rationale": "Radial arteries are palpated for pulses, not auscultated for bruits."}, {"text": "Dorsalis pedis arteries", "correct": false, "rationale": "Dorsalis pedis arteries are palpated, not auscultated for bruits."}, {"text": "Brachial arteries", "correct": false, "rationale": "Brachial arteries are palpated for pulses, not auscultated for bruits."}]}, {"id": "w7tc-q25", "cat": "thoraxcardioabdmsk", "type": "mc", "stem": "A nurse is preparing to assess a client's abdomen. In which order should the nurse perform the techniques?", "options": [{"text": "Inspection, palpation, percussion, auscultation", "correct": false, "rationale": "Palpation and percussion before auscultation can alter bowel sounds."}, {"text": "Inspection, auscultation, percussion, palpation", "correct": true, "rationale": "Auscultate right after inspection because percussion and palpation can alter bowel sounds."}, {"text": "Auscultation, inspection, palpation, percussion", "correct": false, "rationale": "Inspection always comes first."}, {"text": "Palpation, inspection, auscultation, percussion", "correct": false, "rationale": "Touching the abdomen first can alter bowel sounds."}]}, {"id": "w7tc-q26", "cat": "thoraxcardioabdmsk", "type": "mc", "stem": "A nurse cannot hear bowel sounds in any quadrant. How long must the nurse listen before documenting absent bowel sounds?", "options": [{"text": "30 seconds", "correct": false, "rationale": "30 seconds is not long enough."}, {"text": "1 minute", "correct": false, "rationale": "1 minute is not long enough."}, {"text": "5 minutes", "correct": true, "rationale": "Bowel sounds are documented as absent only after a full 5 minutes with none heard."}, {"text": "10 minutes", "correct": false, "rationale": "5 minutes is the standard."}]}, {"id": "w7tc-q27", "cat": "thoraxcardioabdmsk", "type": "mc", "stem": "Which bowel sound finding should the nurse document as expected?", "options": [{"text": "High-pitched clicks and gurgles 5 to 35 times per minute", "correct": true, "rationale": "This is the expected finding."}, {"text": "Soft sounds fewer than 5 times per minute", "correct": false, "rationale": "Fewer than 5 per minute is hypoactive."}, {"text": "Loud, growling sounds heard without a stethoscope", "correct": false, "rationale": "Borborygmi indicate hyperperistalsis and are unexpected."}, {"text": "A swishing sound over the aorta", "correct": false, "rationale": "A vascular swishing sound (bruit) is unexpected and should be reported."}]}, {"id": "w7tc-q28", "cat": "thoraxcardioabdmsk", "type": "mc", "stem": "A nurse hears loud, growling sounds from a client's abdomen without a stethoscope. Which statement about this finding is correct?", "options": [{"text": "It is an expected finding", "correct": false, "rationale": "Borborygmi are an unexpected finding."}, {"text": "It indicates hyperperistalsis", "correct": true, "rationale": "Borborygmi are loud growling sounds from increased GI motility."}, {"text": "It indicates a bowel obstruction", "correct": false, "rationale": "Absent or hypoactive sounds are associated with obstruction."}, {"text": "It is a vascular sound", "correct": false, "rationale": "Vascular sounds are swishing bruits, not growling."}]}, {"id": "w7tc-q29", "cat": "thoraxcardioabdmsk", "type": "mc", "stem": "A client's abdomen protrudes mainly at midline, the skin is taut, and the flanks are unchanged. Which cause of distention should the nurse suspect?", "options": [{"text": "Fat", "correct": false, "rationale": "Fat causes rolls of adipose tissue along the sides, and the skin is not taut."}, {"text": "Fluid", "correct": false, "rationale": "Fluid causes the flanks to protrude, shifting to the dependent side when the client turns."}, {"text": "Flatus", "correct": true, "rationale": "Flatus causes a mainly midline protrusion with no flank involvement."}, {"text": "Hernia", "correct": false, "rationale": "A hernia is a protrusion through the abdominal wall, more visible when the client flexes the muscles."}]}, {"id": "w7tc-q30", "cat": "thoraxcardioabdmsk", "type": "mc", "stem": "A nurse percusses a client's abdomen. Which finding is expected over most of the abdomen?", "options": [{"text": "Tympany", "correct": true, "rationale": "Tympany, a drum-like sound from gas, is expected over most of the abdomen."}, {"text": "Dullness", "correct": false, "rationale": "Dullness is expected only over the liver, spleen, or a distended bladder."}, {"text": "Resonance", "correct": false, "rationale": "Resonance is the expected percussion sound over the lungs."}, {"text": "Hyperresonance", "correct": false, "rationale": "Hyperresonance indicates trapped air in the lungs."}]}, {"id": "w7tc-q31", "cat": "thoraxcardioabdmsk", "type": "mc", "stem": "A client's abdomen is rigid on palpation and no bowel sounds are heard. How should the nurse interpret these findings?", "options": [{"text": "Voluntary guarding from anxiety", "correct": false, "rationale": "Voluntary guarding relaxes when the client exhales; rigidity persists."}, {"text": "Possible peritoneal irritation that needs follow-up", "correct": true, "rationale": "A rigid abdomen, especially with hypoactive or absent bowel sounds, suggests peritoneal irritation."}, {"text": "Expected finding in older adults", "correct": false, "rationale": "Older adults have softer abdominal muscles, not rigidity."}, {"text": "A full bladder", "correct": false, "rationale": "A full bladder is palpable above the symphysis, not as generalized rigidity."}]}, {"id": "w7tc-q32", "cat": "thoraxcardioabdmsk", "type": "mc", "stem": "During light palpation, a client reports tenderness in the right lower quadrant. Which action should the nurse take?", "options": [{"text": "Palpate deeper to identify a mass", "correct": false, "rationale": "Deep palpation should never be done over tender areas."}, {"text": "Continue palpating all quadrants with firm pressure", "correct": false, "rationale": "Continuing could cause pain and injury."}, {"text": "Stop palpating and notify the provider", "correct": true, "rationale": "When tenderness is found, stop palpating and notify the provider."}, {"text": "Perform rebound tenderness testing in that quadrant", "correct": false, "rationale": "Rebound testing may be limited to advanced practitioners; stop and notify."}]}, {"id": "w7tc-q33", "cat": "thoraxcardioabdmsk", "type": "sata", "stem": "A nurse is assessing the abdomen of a thin adult client. Which findings should the nurse document as expected? Select all that apply.", "options": [{"text": "Tympany on percussion", "correct": true, "rationale": "Tympany is expected over most of the abdomen."}, {"text": "Soft, nontender abdomen", "correct": true, "rationale": "A soft, nontender abdomen with relaxed muscles is expected."}, {"text": "Silver striae", "correct": true, "rationale": "Silver stretch marks are an expected finding."}, {"text": "Pulsations at midline above the umbilicus", "correct": true, "rationale": "Aortic pulsations are expected in thin adults."}, {"text": "Dilated veins across the abdomen", "correct": false, "rationale": "Dilated veins may indicate liver disease, portal hypertension, or IVC obstruction."}, {"text": "Pain with fist percussion over the costovertebral angle", "correct": false, "rationale": "CVA tenderness suggests kidney inflammation."}]}, {"id": "w7tc-q34", "cat": "thoraxcardioabdmsk", "type": "mc", "stem": "A client can move their arm against gravity but not against any resistance. How should the nurse grade this muscle strength?", "options": [{"text": "1", "correct": false, "rationale": "Grade 1 is a trace contraction with no limb movement."}, {"text": "2", "correct": false, "rationale": "Grade 2 is movement only with gravity eliminated."}, {"text": "3", "correct": true, "rationale": "Grade 3 is movement against gravity (about 50% strength)."}, {"text": "4", "correct": false, "rationale": "Grade 4 is movement against some resistance."}]}, {"id": "w7tc-q35", "cat": "thoraxcardioabdmsk", "type": "mc", "stem": "A nurse observes an exaggerated convex curve of an older adult client's thoracic spine. How should the nurse document this finding?", "options": [{"text": "Lordosis", "correct": false, "rationale": "Lordosis is an exaggerated lumbar curve."}, {"text": "Scoliosis", "correct": false, "rationale": "Scoliosis is an exaggerated lateral curve."}, {"text": "Kyphosis", "correct": true, "rationale": "Kyphosis is an exaggerated thoracic curve, common in older adults with osteoporosis."}, {"text": "Expected double S curve", "correct": false, "rationale": "The thoracic spine is expected to be only slightly convex."}]}, {"id": "w7tc-q36", "cat": "thoraxcardioabdmsk", "type": "mc", "stem": "A nurse is performing the Romberg test. Which finding is expected?", "options": [{"text": "The client walks heel to toe without losing balance", "correct": false, "rationale": "This is the expected finding for heel-to-toe walking."}, {"text": "The client stands with feet together and eyes closed with minimal sway for at least 5 seconds", "correct": true, "rationale": "Minimal sway is the expected Romberg result."}, {"text": "The client sways more than a few inches", "correct": false, "rationale": "Swaying more than a couple of inches means the nurse should stop the test and document difficulty with balance."}, {"text": "The client touches their nose with alternating fingers", "correct": false, "rationale": "This is the finger-to-nose coordination test."}]}, {"id": "w7tc-q37", "cat": "thoraxcardioabdmsk", "type": "mc", "stem": "A nurse is assessing passive range of motion of a client's shoulder. Which action should the nurse take?", "options": [{"text": "Have the client repeat movements the nurse demonstrates", "correct": false, "rationale": "This describes active ROM."}, {"text": "Stop moving the joint at the point of pain or resistance", "correct": true, "rationale": "Never move a joint past the point of pain or resistance."}, {"text": "Move the joint slightly past resistance to improve flexibility", "correct": false, "rationale": "Moving past resistance can injure the client."}, {"text": "Test only the dominant shoulder", "correct": false, "rationale": "Joints are compared bilaterally."}]}, {"id": "w7tc-q38", "cat": "thoraxcardioabdmsk", "type": "dragdrop", "stem": "Drag the movements that bring a body part toward the midline into the answer box.", "leftLabel": "ROM movements", "rightLabel": "Movement toward the midline", "options": [{"text": "Adduction", "correct": true, "rationale": "Adduction moves an extremity toward the midline."}, {"text": "Inversion", "correct": true, "rationale": "Inversion turns a body part toward the midline."}, {"text": "Abduction", "correct": false, "rationale": "Abduction moves an extremity away from the midline."}, {"text": "Eversion", "correct": false, "rationale": "Eversion turns a body part away from the midline."}, {"text": "Extension", "correct": false, "rationale": "Extension increases the angle between two bones."}, {"text": "External rotation", "correct": false, "rationale": "External rotation turns a joint outward."}]}, {"id": "w7tc-q39", "cat": "thoraxcardioabdmsk", "type": "mc", "stem": "A nurse is performing the get-up-and-go test. How far should the client walk before turning back to the chair?", "options": [{"text": "1 m (3 ft)", "correct": false, "rationale": "The test uses 3 m (10 ft)."}, {"text": "3 m (10 ft)", "correct": true, "rationale": "The client rises without using the chair arms, walks 3 m (10 ft), turns, returns, and sits."}, {"text": "6 m (20 ft)", "correct": false, "rationale": "6 m (20 ft) is the Snellen chart distance."}, {"text": "Until the client becomes tired", "correct": false, "rationale": "The test uses a set distance and is timed."}]}, {"id": "w7tc-q40", "cat": "thoraxcardioabdmsk", "type": "mc", "stem": "A nurse is inspecting a client's chest for the point of maximal impulse (PMI). Where should the nurse expect to find it?", "options": [{"text": "Right sternal border, 2nd intercostal space", "correct": false, "rationale": "This is the aortic auscultation area."}, {"text": "Left sternal border, 3rd intercostal space", "correct": false, "rationale": "This is Erb's point."}, {"text": "Left midclavicular line, 4th to 5th intercostal space", "correct": true, "rationale": "The PMI is the apical impulse, just medial to the left midclavicular line at the 4th\u20135th intercostal space, no larger than a nickel."}, {"text": "Just below the xiphoid process", "correct": false, "rationale": "This is where the abdominal aorta is auscultated for bruits."}]}, {"id": "w7sf-q01", "cat": "safety", "type": "mc", "stem": "A nurse is preparing to give a client their medications. Which action should the nurse take to identify the client?", "options": [{"text": "Check the room number and the client's name on the door", "correct": false, "rationale": "Room numbers can change and should never be used as an identifier."}, {"text": "Ask the client to state their name and date of birth, then compare to the ID band", "correct": true, "rationale": "Two identifiers, asked open-ended and confirmed with the ID band or EMR, are required."}, {"text": "Ask, \"Are you Mr. Lee?\"", "correct": false, "rationale": "A yes/no question can get an incorrect \"yes\"; use open-ended questions."}, {"text": "Skip barcode scanning if the client is well known to the nurse", "correct": false, "rationale": "Barcode scanning should never be skipped."}]}, {"id": "w7sf-q02", "cat": "safety", "type": "mc", "stem": "A nurse receives a critical sodium level of 120 mEq/L for a client. How should the nurse communicate this result?", "options": [{"text": "Leave a detailed voicemail for the provider", "correct": false, "rationale": "Critical results are never given by voicemail."}, {"text": "Send a message through the EMR inbox at end of shift", "correct": false, "rationale": "Critical results must be reported promptly within the facility's time frame."}, {"text": "Call or tell the provider directly and document the notification", "correct": true, "rationale": "Critical results go directly to the provider in person or by phone, with written documentation of who reported and who received."}, {"text": "Wait for the provider's next rounds", "correct": false, "rationale": "Waiting delays treatment of a potentially life-threatening result."}]}, {"id": "w7sf-q03", "cat": "safety", "type": "mc", "stem": "A nurse on a busy ICU notices staff silencing monitor alarms without checking the clients. Which concept does this describe?", "options": [{"text": "Alarm fatigue", "correct": true, "rationale": "Frequent nuisance alarms desensitize staff, leading to slower or missed responses."}, {"text": "Near miss", "correct": false, "rationale": "A near miss is an error caught before it reaches the client."}, {"text": "Sentinel event", "correct": false, "rationale": "A sentinel event is a critical, unexpected event causing severe harm."}, {"text": "Workplace bullying", "correct": false, "rationale": "Bullying is repeated harassment, not desensitization to alarms."}]}, {"id": "w7sf-q04", "cat": "safety", "type": "dragdrop", "stem": "Drag the events that are sentinel events into the answer box.", "leftLabel": "Unexpected events", "rightLabel": "Sentinel events", "options": [{"text": "Surgery performed on the wrong body part", "correct": true, "rationale": "Wrong-site surgery is a critical, unexpected event causing severe harm."}, {"text": "Infant abduction", "correct": true, "rationale": "Infant abduction is a sentinel event."}, {"text": "Client suicide in the facility", "correct": true, "rationale": "Client suicide in the facility is a sentinel event."}, {"text": "Fall resulting in a hip fracture", "correct": true, "rationale": "A fall with serious injury is a sentinel event."}, {"text": "Wrong medication caught during reconciliation before it is given", "correct": false, "rationale": "An error caught before reaching the client is a near miss."}, {"text": "NPO client is served a tray and the procedure is delayed", "correct": false, "rationale": "An event that could have caused harm is a client safety event."}, {"text": "Client falls and sprains a wrist", "correct": false, "rationale": "Unexpected harm that is not severe is an adverse event."}, {"text": "Expected death from a terminal illness", "correct": false, "rationale": "Expected outcomes of illness are not sentinel events."}]}, {"id": "w7sf-q05", "cat": "safety", "type": "mc", "stem": "During medication reconciliation, a nurse notices a client who takes Celebrex at home has been prescribed Celexa. The nurse clarifies with the provider before any dose is given. How should this be classified?", "options": [{"text": "Near miss", "correct": true, "rationale": "The error was caught before it reached the client."}, {"text": "Adverse event", "correct": false, "rationale": "An adverse event means harm reached the client."}, {"text": "Sentinel event", "correct": false, "rationale": "A sentinel event causes death or severe harm."}, {"text": "Client safety event", "correct": false, "rationale": "A client safety event reaches the client with or without injury; this error was caught first."}]}, {"id": "w7sf-q06", "cat": "safety", "type": "mc", "stem": "A client falls in their room. After making sure the client is safe and notifying the nurse leader and provider, which action should the nurse take?", "options": [{"text": "Document the incident report in the client's progress notes", "correct": false, "rationale": "The occurrence report is a separate document."}, {"text": "Complete an occurrence report", "correct": true, "rationale": "Occurrence reports track events to prevent recurrence and are completed after the client is safe and leadership is notified."}, {"text": "Wait for risk management to decide if a report is needed", "correct": false, "rationale": "The nurse is responsible for reporting events per policy."}, {"text": "Avoid reporting so the staff member isn't punished", "correct": false, "rationale": "Occurrence reports are not punitive."}]}, {"id": "w7sf-q07", "cat": "safety", "type": "sata", "stem": "Which client situations should prompt the nurse to call the rapid response team? Select all that apply.", "options": [{"text": "Oxygen saturation stays low despite oxygen", "correct": true, "rationale": "Low SpO2 despite oxygenation efforts warrants the RRT."}, {"text": "New-onset seizure", "correct": true, "rationale": "A seizure warrants the RRT."}, {"text": "Chest pain not relieved by nitroglycerin", "correct": true, "rationale": "Unrelieved chest pain warrants the RRT."}, {"text": "Sudden change in mental status", "correct": true, "rationale": "A sudden mental status change warrants the RRT."}, {"text": "One elevated blood glucose reading", "correct": false, "rationale": "A single high glucose is assessed and reported to the provider, not an RRT call."}, {"text": "Client asks for pain medication", "correct": false, "rationale": "A routine request is handled by the nurse."}]}, {"id": "w7sf-q08", "cat": "safety", "type": "mc", "stem": "A nurse is calling a provider using ISBARR. What is the purpose of the \"read back\" step?", "options": [{"text": "Introduce yourself and your unit", "correct": false, "rationale": "That is the Identity step."}, {"text": "Share the client's history and medications", "correct": false, "rationale": "That is the Background step."}, {"text": "Repeat the provider's order to confirm it was understood correctly", "correct": true, "rationale": "Read back allows clarification of any miscommunication."}, {"text": "Recommend what the nurse wants to happen", "correct": false, "rationale": "That is the Recommendation step."}]}, {"id": "w7sf-q09", "cat": "safety", "type": "mc", "stem": "Which action is the single most important way to prevent hospital-associated infections?", "options": [{"text": "Giving prophylactic antibiotics", "correct": false, "rationale": "Antibiotic overuse contributes to MDROs."}, {"text": "Hand hygiene", "correct": true, "rationale": "Hand hygiene is the single most important step to prevent the spread of infection."}, {"text": "Placing every client in isolation", "correct": false, "rationale": "Isolation is used for specific infections, not every client."}, {"text": "Changing linens twice daily", "correct": false, "rationale": "Linen changes don't replace hand hygiene."}]}, {"id": "w7sf-q10", "cat": "safety", "type": "dragdrop", "stem": "A home health nurse is teaching an older adult about reducing home hazards. Drag the recommendations the nurse should include into the answer box.", "leftLabel": "Home safety tips", "rightLabel": "Recommended for older adults", "options": [{"text": "Install grab bars by the toilet and in the shower", "correct": true, "rationale": "Grab bars give a secure handhold and reduce falls."}, {"text": "Secure electrical cords along the edges of the floor", "correct": true, "rationale": "Securing cords along walls prevents tripping."}, {"text": "Paint the walls one color", "correct": true, "rationale": "One color reflects more light and improves visibility."}, {"text": "Use bright or motion-sensor lighting", "correct": true, "rationale": "Bright lighting helps clients with decreased vision."}, {"text": "Use an electric razor", "correct": true, "rationale": "An electric razor prevents cuts, especially for clients taking anticoagulants."}, {"text": "Keep throw rugs in high-traffic areas", "correct": false, "rationale": "Loose rugs are trip hazards and should be removed."}, {"text": "Use chairs with wheels on carpet", "correct": false, "rationale": "Wheeled or swivel chairs increase fall risk."}, {"text": "Set the water heater to 130\u00b0F", "correct": false, "rationale": "The water heater should be no higher than 120\u00b0F (49\u00b0C) to prevent scalding."}, {"text": "Install dim lighting in hallways", "correct": false, "rationale": "Dim lighting increases fall risk."}]}, {"id": "w7sf-q11", "cat": "safety", "type": "mc", "stem": "A nurse is reviewing a client's home and prescribed medications on admission. Which process is the nurse performing?", "options": [{"text": "Time-out", "correct": false, "rationale": "A time-out is a pause before a procedure."}, {"text": "Medication reconciliation", "correct": true, "rationale": "Medication reconciliation compares home medications with new prescriptions to find and resolve discrepancies."}, {"text": "Handoff report", "correct": false, "rationale": "Handoff transfers care between nurses."}, {"text": "Waived testing", "correct": false, "rationale": "Waived testing is simple point-of-care lab testing."}]}, {"id": "w7sf-q12", "cat": "safety", "type": "mc", "stem": "A client tells the nurse they have thoughts of suicide and a plan. Which action should the nurse take?", "options": [{"text": "Check on the client every 30 minutes", "correct": false, "rationale": "A client with active suicidal thoughts or a plan needs continuous observation."}, {"text": "Stay with the client and ensure continuous observation", "correct": true, "rationale": "Never leave a client with active suicidal thoughts or a plan alone."}, {"text": "Give the client privacy to process their feelings", "correct": false, "rationale": "Leaving the client alone is unsafe."}, {"text": "Remove items only if the client asks", "correct": false, "rationale": "Harmful items should be removed proactively using an environmental checklist."}]}, {"id": "w7sf-q13", "cat": "safety", "type": "mc", "stem": "A nurse is caring for a client who has a history of falls. Which action is the nurse's priority?", "options": [{"text": "Complete a fall-risk assessment", "correct": true, "rationale": "Assessment comes first and guides the individualized plan of care."}, {"text": "Educate the client and family about fall risks", "correct": false, "rationale": "Education is important but not the priority."}, {"text": "Remove hazards from the room", "correct": false, "rationale": "Removing hazards helps but follows assessment."}, {"text": "Make sure the client uses assistive aids", "correct": false, "rationale": "Aids help but are not the first action."}]}, {"id": "w7sf-q14", "cat": "safety", "type": "sata", "stem": "A nurse is reviewing universal fall precautions with new nurses. Which actions should the nurse include? Select all that apply.", "options": [{"text": "Provide nonskid footwear", "correct": true, "rationale": "Nonskid footwear provides traction."}, {"text": "Keep the bed in the low position with wheels locked", "correct": true, "rationale": "A low, locked bed reduces injury and prevents rolling during transfers."}, {"text": "Place the call light and belongings within reach", "correct": true, "rationale": "Items in reach prevent the client from reaching and falling."}, {"text": "Provide adequate lighting", "correct": true, "rationale": "Good lighting reduces trips and falls."}, {"text": "Raise all four side rails for an alert client", "correct": false, "rationale": "Full side rails for a client who gets up can lead to climbing over them and are considered a restraint."}, {"text": "Keep the bed in the high position when not giving care", "correct": false, "rationale": "A high bed increases injury if the client falls."}]}, {"id": "w7sf-q15", "cat": "safety", "type": "mc", "stem": "A client's Morse Fall Scale score is 50. How should the nurse interpret this score?", "options": [{"text": "Low fall risk", "correct": false, "rationale": "Low risk is 0 to 24."}, {"text": "Moderate fall risk", "correct": false, "rationale": "Moderate risk is 25 to 44."}, {"text": "High fall risk", "correct": true, "rationale": "A score of 45 or higher is high fall risk."}, {"text": "The score cannot be interpreted without a provider", "correct": false, "rationale": "Nurses interpret the Morse score to plan interventions."}]}, {"id": "w7sf-q16", "cat": "safety", "type": "mc", "stem": "A client who has orthostatic hypotension asks how to get out of bed safely. Which instruction should the nurse give?", "options": [{"text": "\"Stand up quickly so you don't get dizzy.\"", "correct": false, "rationale": "Rising quickly worsens orthostatic dizziness."}, {"text": "\"Sit on the side of the bed for a few seconds, then stand for a few seconds before walking.\"", "correct": true, "rationale": "Rising slowly in stages lets blood pressure adjust and reduces falls."}, {"text": "\"Only get up when no one is around to help.\"", "correct": false, "rationale": "Clients at risk should call for assistance."}, {"text": "\"Keep all four side rails up so you can pull yourself up.\"", "correct": false, "rationale": "Full side rails can lead to climbing and falls."}]}, {"id": "w7sf-q17", "cat": "safety", "type": "mc", "stem": "A confused client keeps trying to get out of bed, and the nurse raises all four side rails to keep the client in bed. How should this action be classified?", "options": [{"text": "A fall precaution only", "correct": false, "rationale": "Rails used to keep a client from exiting the bed are a restraint."}, {"text": "A restraint", "correct": true, "rationale": "Using all four side rails to restrict a client from leaving the bed is a barrier restraint."}, {"text": "A chemical restraint", "correct": false, "rationale": "Chemical restraints are medications."}, {"text": "Seclusion", "correct": false, "rationale": "Seclusion is placing a client alone in a locked room."}]}, {"id": "w7sf-q18", "cat": "safety", "type": "mc", "stem": "A provider prescribes a mechanical restraint to keep a client from pulling at an IV line. Which device is the least restrictive?", "options": [{"text": "Hand mitt", "correct": true, "rationale": "The hand mitt (a soft restraint) is the least restrictive mechanical restraint."}, {"text": "Soft wrist restraint", "correct": false, "rationale": "Wrist restraints are the next least restrictive after the mitt."}, {"text": "Vest restraint", "correct": false, "rationale": "Vest restraints are more restrictive and many facilities no longer use them due to strangulation risk."}, {"text": "Four-point restraints", "correct": false, "rationale": "Four-point restraints are the most restrictive."}]}, {"id": "w7sf-q19", "cat": "safety", "type": "sata", "stem": "A nurse is applying wrist restraints to a client. Which actions should the nurse take? Select all that apply.", "options": [{"text": "Pad bony prominences", "correct": true, "rationale": "Padding prevents skin breakdown under the restraint."}, {"text": "Make sure two fingers fit between the restraint and the wrist", "correct": true, "rationale": "This prevents impaired circulation while keeping the restraint secure."}, {"text": "Use a quick-release knot", "correct": true, "rationale": "A quick-release knot allows fast removal in an emergency."}, {"text": "Tie the restraint to the movable part of the bed frame", "correct": true, "rationale": "The bed frame moves with the bed, so the restraint doesn't tighten."}, {"text": "Tie the restraint to the side rail", "correct": false, "rationale": "Raising or lowering the rail can injure the client."}, {"text": "Apply the restraint as tightly as possible", "correct": false, "rationale": "Overly tight restraints impair circulation and cause skin injury."}]}, {"id": "w7sf-q20", "cat": "safety", "type": "mc", "stem": "A provider writes a restraint prescription for an adult client. Which statement about the prescription is correct?", "options": [{"text": "It can be written as PRN for agitation", "correct": false, "rationale": "PRN restraint prescriptions are not allowed."}, {"text": "It is limited to 4 hours and can be renewed up to 24 consecutive hours", "correct": true, "rationale": "Adult restraint prescriptions last 4 hours and are renewable up to 24 consecutive hours."}, {"text": "It lasts 24 hours without renewal", "correct": false, "rationale": "Prescriptions must be renewed; they are limited to 4 hours at a time."}, {"text": "The nurse can write it if the provider is unavailable", "correct": false, "rationale": "Only the provider writes the prescription, after a face-to-face assessment."}]}, {"id": "w7sf-q21", "cat": "safety", "type": "mc", "stem": "A nurse applies restraints in an emergency because a client is about to harm a staff member. Which action must follow?", "options": [{"text": "No order is needed for emergency restraints", "correct": false, "rationale": "An order is still required."}, {"text": "Obtain the provider's order within 1 hour", "correct": true, "rationale": "When restraints are applied in an emergency, the provider's order must be obtained within 1 hour."}, {"text": "Obtain the order within 24 hours", "correct": false, "rationale": "24 hours is the reevaluation interval, not the time frame for an emergency order."}, {"text": "Obtain the order at the next scheduled rounds", "correct": false, "rationale": "This delay is not acceptable."}]}, {"id": "w7sf-q22", "cat": "safety", "type": "mc", "stem": "During a restraint check, a nurse finds the client's hand cool and pale distal to a wrist restraint. Which action should the nurse take first?", "options": [{"text": "Remove the restraint immediately", "correct": true, "rationale": "With impaired circulation, remove the restraint first, then reassess and notify the provider."}, {"text": "Loosen the restraint by one finger-width", "correct": false, "rationale": "Impaired circulation requires immediate removal."}, {"text": "Document the finding and recheck in 2 hours", "correct": false, "rationale": "Delaying could cause tissue damage."}, {"text": "Reapply the restraint on the other wrist", "correct": false, "rationale": "Don't reapply without a provider order."}]}, {"id": "w7sf-q23", "cat": "safety", "type": "mc", "stem": "Which situation is an appropriate indication for a restraint after less restrictive measures have failed?", "options": [{"text": "The client has refused medications for 2 days", "correct": false, "rationale": "Refusing medications is the client's right and is not an indication."}, {"text": "The client has removed their indwelling urinary catheter twice", "correct": true, "rationale": "Removing needed medical devices is an indication for restraints once alternatives fail."}, {"text": "The client argues about discharge instructions", "correct": false, "rationale": "Disagreement is not an indication."}, {"text": "The staff is short-handed tonight", "correct": false, "rationale": "Restraints are never used for staff convenience or staffing shortages."}]}, {"id": "w7sf-q24", "cat": "safety", "type": "dragdrop", "stem": "Drag the interventions the nurse should try before using restraints into the answer box.", "leftLabel": "Interventions", "rightLabel": "Try before restraints", "options": [{"text": "Offer diversional activities", "correct": true, "rationale": "Diversion is a less restrictive alternative."}, {"text": "Move the client to a room near the nurses' station", "correct": true, "rationale": "Closer observation is a less restrictive alternative."}, {"text": "Encourage a family member or sitter at the bedside", "correct": true, "rationale": "Companionship is a less restrictive alternative."}, {"text": "Use a bed or chair alarm", "correct": true, "rationale": "Alarms alert staff when the client gets up."}, {"text": "Reorient the client", "correct": true, "rationale": "Reorientation can reduce unsafe behavior."}, {"text": "Apply soft wrist restraints", "correct": false, "rationale": "Restraints are the last resort."}, {"text": "Give a sedative to calm the client", "correct": false, "rationale": "Medication to control behavior is a chemical restraint."}, {"text": "Place the client in seclusion", "correct": false, "rationale": "Seclusion is an environmental restraint."}]}, {"id": "w7sf-q25", "cat": "safety", "type": "mc", "stem": "A client begins having a generalized seizure. Which action should the nurse take?", "options": [{"text": "Insert a tongue blade between the teeth", "correct": false, "rationale": "Nothing should be placed in the mouth; a tongue blade can cause injury and obstruction."}, {"text": "Hold the client's arms and legs still", "correct": false, "rationale": "Never restrain a client during a seizure."}, {"text": "Turn the client onto their side", "correct": true, "rationale": "Side-lying allows secretions to drain and helps keep the airway open."}, {"text": "Leave to get help from the nurses' station", "correct": false, "rationale": "Stay with the client and use the call light."}]}, {"id": "w7sf-q26", "cat": "safety", "type": "mc", "stem": "A client is recovering from a seizure. Which assessment should the nurse complete before offering food or fluids?", "options": [{"text": "Blood pressure", "correct": false, "rationale": "Vital signs are assessed, but they don't show swallowing safety."}, {"text": "Gag reflex and ability to follow directions", "correct": true, "rationale": "Checking the gag reflex and ability to follow directions protects against aspiration."}, {"text": "Pupil response", "correct": false, "rationale": "Pupil checks are part of the neuro assessment but don't show swallowing safety."}, {"text": "Anticonvulsant drug level", "correct": false, "rationale": "Drug levels may be ordered but don't determine safety to eat."}]}, {"id": "w7sf-q27", "cat": "safety", "type": "dragdrop", "stem": "A client with a seizure history is admitted. Drag the items that are part of seizure precautions into the answer box.", "leftLabel": "Supplies and actions", "rightLabel": "Seizure precautions", "options": [{"text": "Suction equipment at the bedside", "correct": true, "rationale": "Suction helps prevent aspiration of secretions."}, {"text": "Oxygen at the bedside", "correct": true, "rationale": "Oxygen is set up in case saturation drops."}, {"text": "Padded side rails", "correct": true, "rationale": "Padding prevents injury during a seizure."}, {"text": "IV access", "correct": true, "rationale": "IV access allows immediate medication administration."}, {"text": "Baseline vital signs and SpO2", "correct": true, "rationale": "A baseline helps the nurse detect changes."}, {"text": "Tongue blade taped to the headboard", "correct": false, "rationale": "Nothing is placed in the mouth during a seizure."}, {"text": "Wrist restraints at the bedside", "correct": false, "rationale": "Clients are never restrained during a seizure."}, {"text": "Tight-fitting clothing", "correct": false, "rationale": "Constrictive clothing and jewelry are removed."}]}, {"id": "w7sf-q28", "cat": "safety", "type": "mc", "stem": "A nurse sees smoke coming from a client's room. Which action is the nurse's priority?", "options": [{"text": "Move the clients nearest the fire to safety", "correct": true, "rationale": "Rescue is the first step of RACE."}, {"text": "Activate the fire alarm", "correct": false, "rationale": "Alarm is the second step."}, {"text": "Close all doors on the unit", "correct": false, "rationale": "Containing the fire comes after rescue and alarm."}, {"text": "Find a fire extinguisher", "correct": false, "rationale": "Extinguishing or evacuating comes last."}]}, {"id": "w7sf-q29", "cat": "safety", "type": "mc", "stem": "A nurse is using a fire extinguisher. Where should the nurse aim?", "options": [{"text": "At the top of the flames", "correct": false, "rationale": "Aiming high doesn't reach the fuel source."}, {"text": "At the base of the fire", "correct": true, "rationale": "PASS: Pull, Aim at the base, Squeeze, Sweep side to side."}, {"text": "At the center of the smoke", "correct": false, "rationale": "Smoke rises away from the fuel source."}, {"text": "At the nearest wall", "correct": false, "rationale": "Aim directly at the base of the fire."}]}, {"id": "w7sf-q30", "cat": "safety", "type": "mc", "stem": "A fire cannot be contained, and clients must be moved. Which type of evacuation is preferred?", "options": [{"text": "Lateral evacuation to a safe area on the same floor", "correct": true, "rationale": "Lateral (horizontal) evacuation is preferred."}, {"text": "Vertical evacuation to the ground floor", "correct": false, "rationale": "Vertical evacuation is used only when lateral isn't enough."}, {"text": "Using the elevators to move clients quickly", "correct": false, "rationale": "Elevators are not used during fires."}, {"text": "Leaving clients in their rooms with doors open", "correct": false, "rationale": "Doors should be closed, and clients in danger are moved."}]}, {"id": "w7sf-q31", "cat": "safety", "type": "mc", "stem": "An active shooter is reported in the hospital. Which action should the nurse take first if possible?", "options": [{"text": "Run away from the shooter", "correct": true, "rationale": "The priority is run, then hide, then fight."}, {"text": "Hide in a supply closet", "correct": false, "rationale": "Hiding is used if running isn't possible."}, {"text": "Confront the shooter", "correct": false, "rationale": "Fighting is the last resort."}, {"text": "Call the family of each client", "correct": false, "rationale": "Personal safety and escape come first."}]}, {"id": "w7sf-q32", "cat": "safety", "type": "mc", "stem": "A nurse is caring for a client with a radioactive implant. Which action reduces the nurse's radiation exposure?", "options": [{"text": "Stay at the bedside as long as possible to provide care", "correct": false, "rationale": "More time near the source increases the dose."}, {"text": "Increase distance from the client when not providing direct care", "correct": true, "rationale": "Time, distance, and shielding reduce radiation exposure."}, {"text": "Avoid wearing a lead apron so care is quicker", "correct": false, "rationale": "Shielding decreases the dose."}, {"text": "Handle the client's urine without gloves", "correct": false, "rationale": "Body fluids of clients with radioactive implants are handled with PPE."}]}, {"id": "w7sf-q33", "cat": "safety", "type": "mc", "stem": "Which type of radiation is the most serious and requires lead shielding?", "options": [{"text": "Alpha", "correct": false, "rationale": "Alpha radiation is the least risk and doesn't penetrate clothing."}, {"text": "Beta", "correct": false, "rationale": "Beta radiation is the middle level of risk."}, {"text": "Gamma", "correct": true, "rationale": "Gamma radiation penetrates clothing and body tissue and requires lead shielding."}, {"text": "Ultraviolet", "correct": false, "rationale": "Ultraviolet is not one of the three categories discussed."}]}, {"id": "w7sf-q34", "cat": "safety", "type": "mc", "stem": "Why is potassium iodide given after a radiation mass-casualty event?", "options": [{"text": "To treat skin burns", "correct": false, "rationale": "Potassium iodide doesn't treat burns."}, {"text": "To saturate the thyroid so it won't absorb radioactive iodine", "correct": true, "rationale": "Potassium iodide fills the thyroid, blocking uptake of radioactive iodine."}, {"text": "To remove radiation from clothing", "correct": false, "rationale": "Contaminated clothing is removed and discarded."}, {"text": "To prevent nausea and vomiting", "correct": false, "rationale": "It is not an antiemetic."}]}, {"id": "w7sf-q35", "cat": "safety", "type": "mc", "stem": "A client who uses home oxygen asks how far open flames should be kept away. Which response is correct?", "options": [{"text": "3 feet", "correct": false, "rationale": "3 feet is the distance for flammables from space heaters."}, {"text": "5 feet", "correct": false, "rationale": "The recommended distance is greater."}, {"text": "10 feet", "correct": true, "rationale": "Open flames, gas stoves, and electrical appliances should be at least 10 feet from where oxygen exits."}, {"text": "Distance doesn't matter if the oxygen is off", "correct": false, "rationale": "Oxygen in the home raises fire risk even when not in use."}]}, {"id": "w7sf-q36", "cat": "safety", "type": "mc", "stem": "A nurse is lifting a box of supplies from the floor. Which technique should the nurse use?", "options": [{"text": "Bend at the waist with knees straight", "correct": false, "rationale": "Bending at the waist strains the back."}, {"text": "Bend the hips and knees, keep the back straight, and hold the box close", "correct": true, "rationale": "Holding the load close to the center of gravity increases stability and reduces back strain."}, {"text": "Hold the box at arm's length", "correct": false, "rationale": "Arms extended away from the body increases injury risk."}, {"text": "Twist toward the shelf while lifting", "correct": false, "rationale": "Twisting while lifting increases injury risk."}]}, {"id": "w7sf-q37", "cat": "safety", "type": "mc", "stem": "A client reports headache, nausea, and weakness after running a gas heater in a closed room. Which condition should the nurse suspect?", "options": [{"text": "Carbon monoxide poisoning", "correct": true, "rationale": "CO causes nausea, vomiting, headache, weakness, and unconsciousness."}, {"text": "Food poisoning", "correct": false, "rationale": "Food poisoning is caused by bacteria in food, not fuel-burning devices."}, {"text": "Heat stroke", "correct": false, "rationale": "Heat stroke causes temperature over 40\u00b0C with hot, dry skin."}, {"text": "Altitude sickness", "correct": false, "rationale": "Altitude sickness occurs at high elevations."}]}, {"id": "w7sf-q38", "cat": "safety", "type": "mc", "stem": "A client's temperature is 40.5\u00b0C (104.9\u00b0F) after heat exposure. Which findings should the nurse expect?", "options": [{"text": "Bradycardia and bradypnea", "correct": false, "rationale": "Heat stroke causes tachycardia and tachypnea."}, {"text": "Hot, dry skin with hypotension and tachycardia", "correct": true, "rationale": "Heat stroke causes hot, dry skin (no sweating), hypotension, tachycardia, and tachypnea."}, {"text": "Cool, clammy skin", "correct": false, "rationale": "The client doesn't sweat; the skin is hot and dry."}, {"text": "Hypertension and profuse sweating", "correct": false, "rationale": "Heat stroke causes hypotension and no sweating."}]}, {"id": "w7sf-q39", "cat": "safety", "type": "mc", "stem": "A nurse is performing a primary survey on a client with a life-threatening injury. Which should the nurse assess first?", "options": [{"text": "Airway", "correct": true, "rationale": "The airway is the most important step; without a patent airway the other steps are futile."}, {"text": "Breathing", "correct": false, "rationale": "Breathing is assessed after the airway is established."}, {"text": "Circulation", "correct": false, "rationale": "Circulation is assessed after breathing."}, {"text": "Level of consciousness", "correct": false, "rationale": "LOC (Disability) comes after circulation."}]}, {"id": "w7sf-q40", "cat": "safety", "type": "mc", "stem": "A client receiving enteral tube feedings has dysphagia. Which position should the nurse use?", "options": [{"text": "Supine", "correct": false, "rationale": "Lying flat doesn't prevent regurgitation."}, {"text": "Semi-Fowler's (head of bed 30\u201345\u00b0)", "correct": true, "rationale": "Semi-Fowler's prevents regurgitation and aspiration in clients receiving tube feedings."}, {"text": "Trendelenburg", "correct": false, "rationale": "Head lower than feet promotes regurgitation."}, {"text": "Lateral semi-prone recumbent", "correct": false, "rationale": "This position promotes regurgitation."}]}];
