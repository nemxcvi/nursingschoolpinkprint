<script>
var catLabels = {"infectioncontrol": "Infection Control & Isolation", "specimencollection": "Specimen Collection", "tissueintegrity": "Tissue Integrity"};
var bank = [{"id": "w6-q01", "cat": "infectioncontrol", "type": "mc", "stem": "A nurse is teaching a group of assistive personnel about the chain of infection. Which of the following is an example of a reservoir?", "options": [{"text": "Contaminated IV fluids", "correct": true, "rationale": "A reservoir is where an infectious agent lives, grows, and replicates. Inanimate reservoirs include IV fluids, medical equipment, food, water, and soil."}, {"text": "Staphylococcus aureus", "correct": false, "rationale": "This is the infectious agent itself, not the habitat where it lives and grows."}, {"text": "A client's cough", "correct": false, "rationale": "A cough is how a pathogen leaves the body, which makes it a portal of exit."}, {"text": "A surgical incision", "correct": false, "rationale": "A break in the skin gives a pathogen a way into the body, which makes it a portal of entry."}]}, {"id": "w6-q02", "cat": "infectioncontrol", "type": "dragdrop", "stem": "A nurse is planning care to protect a client from infection. Which actions break the chain of infection at the susceptible host link? Move the correct actions to the answer box.", "leftLabel": "Nursing actions", "rightLabel": "Protects the susceptible host", "options": [{"text": "Administer the client's annual influenza vaccine", "correct": true, "rationale": "Immunizations increase the host's defenses and decrease susceptibility to infection."}, {"text": "Encourage meals with adequate protein and calories", "correct": true, "rationale": "Proper nutrition strengthens the host's line of defense against infection."}, {"text": "Monitor and help control the client's blood glucose", "correct": true, "rationale": "Blood sugar control is one of the ways to decrease host susceptibility."}, {"text": "Apply a dressing over a draining wound", "correct": false, "rationale": "Containing drainage breaks the chain at the portal of exit, not the susceptible host."}, {"text": "Send reusable instruments for sterilization", "correct": false, "rationale": "Sterilization destroys the infectious agent; it does not strengthen the host."}, {"text": "Clean the bedside table with a hospital-grade disinfectant", "correct": false, "rationale": "Cleaning surfaces removes an inanimate reservoir; it does not strengthen the host."}]}, {"id": "w6-q03", "cat": "infectioncontrol", "type": "mc", "stem": "A nurse is caring for a client who has a large amount of drainage from an abdominal wound. Which action breaks the chain of infection at the portal of exit?", "options": [{"text": "Use a dressing to contain the drainage", "correct": true, "rationale": "Containing body fluids with drains or dressings keeps the pathogen from leaving the reservoir, which breaks the chain at the portal of exit."}, {"text": "Administer recommended immunizations", "correct": false, "rationale": "Immunizations break the chain at the susceptible host link."}, {"text": "Apply lotion to the client's dry skin", "correct": false, "rationale": "Moisturizing keeps the skin barrier intact, which helps prevent a portal of entry. It does not contain drainage leaving the body."}, {"text": "Sterilize the equipment used for wound care", "correct": false, "rationale": "Sterilization destroys the infectious agent; it does not address how the pathogen leaves the client."}]}, {"id": "w6-q04", "cat": "infectioncontrol", "type": "mc", "stem": "A client has an indwelling urinary catheter. The nurse recognizes that the catheter represents which link in the chain of infection?", "options": [{"text": "Portal of entry", "correct": true, "rationale": "Invasive devices such as urinary catheters create a direct route for pathogens to travel into the body, in this case the bladder."}, {"text": "Infectious agent", "correct": false, "rationale": "The infectious agent is the organism (bacteria, virus, fungus, parasite, or prion), not the device."}, {"text": "Mode of transmission", "correct": false, "rationale": "Mode of transmission is how the pathogen moves from place to place, such as contact, droplet, or airborne."}, {"text": "Susceptible host", "correct": false, "rationale": "The client is the susceptible host. The catheter is the opening the pathogen uses to get in."}]}, {"id": "w6-q05", "cat": "infectioncontrol", "type": "mc", "stem": "A nurse is reviewing several client records. Which clients have factors that increase their susceptibility to infection? Select all that apply.", "options": [{"text": "A client who takes a proton pump inhibitor daily", "correct": true, "rationale": "Gastric suppressants such as proton pump inhibitors are listed among medications that increase host susceptibility."}, {"text": "A client who is receiving radiation therapy", "correct": true, "rationale": "Radiation therapy increases susceptibility to infection."}, {"text": "A client who has a central venous catheter", "correct": true, "rationale": "Indwelling devices such as central venous catheters increase susceptibility by providing a portal of entry."}, {"text": "A client who takes a corticosteroid for asthma", "correct": true, "rationale": "Corticosteroids suppress the immune response and increase susceptibility."}, {"text": "A client who has received all recommended immunizations", "correct": false, "rationale": "Immunizations decrease susceptibility by strengthening the host's defenses."}, {"text": "A client who eats a balanced diet and sleeps well", "correct": false, "rationale": "Good nutrition and adequate sleep support immunity and decrease susceptibility."}]}, {"id": "w6-q06", "cat": "infectioncontrol", "type": "mc", "stem": "A nasal swab shows MRSA in a client who has no manifestations of infection. The nurse should recognize that the client is", "options": [{"text": "colonized with the organism.", "correct": true, "rationale": "Colonization means the agent lives in the body, temporarily or permanently, without causing problems."}, {"text": "in the prodromal stage of infection.", "correct": false, "rationale": "The prodromal stage includes nonspecific manifestations such as fever and malaise. This client has none."}, {"text": "unable to transmit the organism to others.", "correct": false, "rationale": "A person can be a reservoir without showing disease and still pass the pathogen to new hosts."}, {"text": "immune to MRSA.", "correct": false, "rationale": "Having no manifestations does not mean the client is immune; the organism is present in the body."}]}, {"id": "w6-q07", "cat": "infectioncontrol", "type": "dragdrop", "stem": "A nurse is reviewing how pathogens spread on the unit. Which situations are examples of indirect contact transmission? Move the correct situations to the answer box.", "leftLabel": "Situations", "rightLabel": "Indirect contact transmission", "options": [{"text": "Wound drainage gets on a bed rail that staff then touch", "correct": true, "rationale": "Indirect contact occurs when a contaminated object sits between the infected person and the next person."}, {"text": "A nurse wears the same gloves while caring for two clients", "correct": true, "rationale": "Reusing PPE between clients carries the pathogen from one client to another through a contaminated item."}, {"text": "A shared blood pressure cuff is not disinfected between clients", "correct": true, "rationale": "Equipment shared between clients without proper cleaning transmits pathogens indirectly."}, {"text": "A client's blood splashes into an open cut on a nurse's hand", "correct": false, "rationale": "This is direct contact, because the pathogen moves straight from the infected person to another person."}, {"text": "A client sneezes and large droplets land in a visitor's mouth", "correct": false, "rationale": "This is droplet transmission into the mucosa of another host."}, {"text": "Many people become ill after eating the same contaminated produce", "correct": false, "rationale": "A common contaminated source that sickens many people is vehicle transmission."}]}, {"id": "w6-q08", "cat": "infectioncontrol", "type": "mc", "stem": "A nurse is caring for a client who has pertussis and is coughing frequently. The nurse should understand that droplets from the client can transmit infection to others within which distance?", "options": [{"text": "3 to 6 feet", "correct": true, "rationale": "Droplets released by coughing and sneezing can transmit infection to others within 3 to 6 feet."}, {"text": "Less than 1 foot", "correct": false, "rationale": "Droplets travel farther than this. Coughing and sneezing disperse them into the air around the client."}, {"text": "Throughout the unit, including outside the client's room", "correct": false, "rationale": "Particles that stay suspended and travel long distances describe airborne transmission, not droplet."}, {"text": "Only through touching the client", "correct": false, "rationale": "Spread through touch is contact transmission. Droplets travel through the air."}]}, {"id": "w6-q09", "cat": "infectioncontrol", "type": "mc", "stem": "Which client should the nurse place in an airborne infection isolation room?", "options": [{"text": "A client who has suspected pulmonary tuberculosis", "correct": true, "rationale": "TB is transmitted by the airborne route, so the client needs a private negative-pressure room."}, {"text": "A client who has influenza", "correct": false, "rationale": "Influenza requires droplet precautions. It can be airborne under certain conditions, but droplet precautions are adequate and a negative-pressure room is not required."}, {"text": "A client who has C. difficile", "correct": false, "rationale": "C. difficile requires contact precautions."}, {"text": "A client who has adenovirus", "correct": false, "rationale": "Adenovirus requires droplet precautions."}]}, {"id": "w6-q10", "cat": "infectioncontrol", "type": "mc", "stem": "Which of the following are physical and chemical barriers that help protect the body from infection? Select all that apply.", "options": [{"text": "Intact skin", "correct": true, "rationale": "The skin is the body's largest organ and primary physical defense."}, {"text": "Stomach acid", "correct": true, "rationale": "The GI tract secretes acids and enzymes that destroy or neutralize some invaders."}, {"text": "Cilia in the respiratory tract", "correct": true, "rationale": "Cilia help keep particulates from entering the body."}, {"text": "Tears", "correct": true, "rationale": "Tears, along with sweat and WBCs, help remove waste from the body."}, {"text": "Antibodies", "correct": false, "rationale": "Antibodies are part of specific immunity."}, {"text": "Neutrophils", "correct": false, "rationale": "Neutrophils are phagocytes that are part of nonspecific immunity."}]}, {"id": "w6-q11", "cat": "infectioncontrol", "type": "mc", "stem": "A client who is receiving oxygen through a nasal cannula reports that their nose feels dry. Which intervention should the nurse implement?", "options": [{"text": "Add humidification to the oxygen", "correct": true, "rationale": "Humidification keeps the mucous membranes moist. Dry membranes can crack and allow micro-organisms to enter."}, {"text": "Increase the oxygen flow rate", "correct": false, "rationale": "A higher flow would not relieve dryness and would require a prescription."}, {"text": "Remove the cannula for 1 hour each shift", "correct": false, "rationale": "Interrupting prescribed oxygen therapy is unsafe and does not address dryness."}, {"text": "Clean the nares with alcohol pads", "correct": false, "rationale": "Alcohol dries and irritates the mucous membranes, increasing the risk of cracking."}]}, {"id": "w6-q12", "cat": "infectioncontrol", "type": "mc", "stem": "What is the role of phagocytes in nonspecific immunity?", "options": [{"text": "Eat and destroy micro-organisms", "correct": true, "rationale": "Phagocytes, such as neutrophils and macrophages, engulf and destroy micro-organisms."}, {"text": "Produce antibodies", "correct": false, "rationale": "Antibody production is part of specific immunity."}, {"text": "Act as a physical barrier", "correct": false, "rationale": "Physical barriers include the skin and mucous membranes, not phagocytes."}, {"text": "Increase host susceptibility", "correct": false, "rationale": "Phagocytes protect the body, which decreases susceptibility."}]}, {"id": "w6-q13", "cat": "infectioncontrol", "type": "dragdrop", "stem": "Which of the following are part of nonspecific immunity? Move the correct items to the answer box.", "leftLabel": "Body defenses", "rightLabel": "Nonspecific immunity", "options": [{"text": "Neutrophils", "correct": true, "rationale": "Neutrophils are phagocytes released during the inflammatory response as part of nonspecific immunity."}, {"text": "Macrophages", "correct": true, "rationale": "Macrophages are phagocytes that make up nonspecific immunity along with neutrophils."}, {"text": "B cells", "correct": false, "rationale": "B cells are lymphocytes, which are part of specific immunity."}, {"text": "T cells", "correct": false, "rationale": "T cells are lymphocytes, which are part of specific immunity."}, {"text": "Antibodies", "correct": false, "rationale": "Antibodies (immunoglobulins) are part of specific immunity."}, {"text": "Intact skin", "correct": false, "rationale": "Intact skin is a physical barrier, a separate category of body defense."}]}, {"id": "w6-q14", "cat": "infectioncontrol", "type": "mc", "stem": "A nurse is assessing a client's surgical incision on postoperative day 3. Which findings are manifestations of inflammation? Select all that apply.", "options": [{"text": "Skin around the incision is warm to the touch", "correct": true, "rationale": "Heat is one of the five cardinal signs of inflammation."}, {"text": "Redness along the incision line", "correct": true, "rationale": "Redness is one of the five cardinal signs of inflammation."}, {"text": "Swelling at the incision site", "correct": true, "rationale": "Swelling is one of the five cardinal signs of inflammation."}, {"text": "Client reports pain at the site", "correct": true, "rationale": "Pain is one of the five cardinal signs of inflammation."}, {"text": "Difficulty moving the affected area", "correct": true, "rationale": "Loss of function is one of the five cardinal signs of inflammation."}, {"text": "Pallor around the incision", "correct": false, "rationale": "Inflammation causes redness from increased blood flow, not pallor."}, {"text": "Skin cool to the touch", "correct": false, "rationale": "Inflammation causes heat at the site, not coolness."}]}, {"id": "w6-q15", "cat": "infectioncontrol", "type": "dragdrop", "stem": "Which of the following are noninfectious triggers of the inflammatory response? Move the correct triggers to the answer box.", "leftLabel": "Triggers", "rightLabel": "Noninfectious triggers", "options": [{"text": "Burn", "correct": true, "rationale": "Burns are a physical noninfectious trigger."}, {"text": "Frostbite", "correct": true, "rationale": "Frostbite is a physical noninfectious trigger."}, {"text": "Alcohol", "correct": true, "rationale": "Alcohol is a chemical noninfectious trigger."}, {"text": "Damaged cells", "correct": true, "rationale": "Damaged cells are a biological noninfectious trigger."}, {"text": "Excitement", "correct": true, "rationale": "Excitement is a psychological noninfectious trigger."}, {"text": "Bacteria", "correct": false, "rationale": "Bacteria are an infectious trigger."}, {"text": "Viruses", "correct": false, "rationale": "Viruses are an infectious trigger."}, {"text": "Fungi", "correct": false, "rationale": "Fungi are other micro-organisms, which are infectious triggers."}]}, {"id": "w6-q16", "cat": "infectioncontrol", "type": "mc", "stem": "A client who scraped their knee reports being unable to bend it because of swelling. The nurse documents this as which manifestation of inflammation?", "options": [{"text": "Loss of function", "correct": true, "rationale": "Being unable to use or move the area normally is loss of function, one of the five cardinal signs."}, {"text": "Heat", "correct": false, "rationale": "Heat is warmth radiating from the area, not difficulty moving it."}, {"text": "Redness", "correct": false, "rationale": "Redness is a color change at the site, not difficulty moving it."}, {"text": "Pain", "correct": false, "rationale": "Pain is a separate cardinal sign. The client's inability to bend the knee describes loss of function."}]}, {"id": "w6-q17", "cat": "infectioncontrol", "type": "mc", "stem": "A client reports a fever, body aches, poor appetite, and fatigue for 1 day. No manifestations specific to a disease are present yet. The nurse identifies that the client is in which stage of infection?", "options": [{"text": "Prodromal", "correct": true, "rationale": "The prodromal stage brings initial nonspecific manifestations such as fever, aches, poor appetite, and malaise."}, {"text": "Incubation", "correct": false, "rationale": "During incubation the client has no manifestations yet."}, {"text": "Acute illness", "correct": false, "rationale": "In acute illness, manifestations specific to the disease become obvious."}, {"text": "Convalescence", "correct": false, "rationale": "Convalescence is the return to a previous or new balanced state of health."}]}, {"id": "w6-q18", "cat": "infectioncontrol", "type": "mc", "stem": "A client was exposed to an infectious agent 2 days ago and has no manifestations. Which statement by the nurse is accurate?", "options": [{"text": "\"You may be in the incubation stage. Lab tests can sometimes detect changes before symptoms appear.\"", "correct": true, "rationale": "Incubation lasts from exposure until the first symptom. Changes may be detectable through lab or diagnostic tests before symptoms start."}, {"text": "\"Since you have no symptoms, you were not infected.\"", "correct": false, "rationale": "A client can be infected and in the incubation stage without symptoms."}, {"text": "\"You are in the period of decline.\"", "correct": false, "rationale": "Decline follows acute illness, when manifestations subside."}, {"text": "\"The incubation period always lasts exactly 2 weeks.\"", "correct": false, "rationale": "The incubation period differs for each agent and can last seconds, minutes, hours, days, or weeks."}]}, {"id": "w6-q19", "cat": "infectioncontrol", "type": "mc", "stem": "A client's localized skin infection has spread into the bloodstream. Which treatment should the nurse anticipate?", "options": [{"text": "IV antibiotics with careful monitoring", "correct": true, "rationale": "A systemic infection starts locally and spreads through the bloodstream. It requires IV antibiotics and careful monitoring."}, {"text": "A topical antibiotic only", "correct": false, "rationale": "Topical antibiotics can treat local infections but are not enough for a systemic infection."}, {"text": "An oral antihistamine", "correct": false, "rationale": "Antihistamines block histamine to reduce swelling; they do not treat infection."}, {"text": "No treatment, because the infection will resolve on its own", "correct": false, "rationale": "A systemic infection affects the entire body and needs prompt treatment."}]}, {"id": "w6-q20", "cat": "infectioncontrol", "type": "mc", "stem": "A client's WBC count is 16,000/mm\u00b3. The nurse interprets this finding as", "options": [{"text": "indicating inflammation or infection.", "correct": true, "rationale": "The expected WBC range is 5,000 to 10,000/mm\u00b3. An increased count indicates inflammation or infection."}, {"text": "within the expected range.", "correct": false, "rationale": "16,000/mm\u00b3 is above the expected range of 5,000 to 10,000/mm\u00b3."}, {"text": "indicating neutropenia.", "correct": false, "rationale": "Neutropenia is an abnormally low count, not a high one."}, {"text": "showing a decreased ability to fight infection.", "correct": false, "rationale": "A decreased ability to fight infection is shown by a WBC count below the expected range."}]}, {"id": "w6-q21", "cat": "infectioncontrol", "type": "mc", "stem": "In which situations should the nurse use soap and water instead of an alcohol-based hand rub? Select all that apply.", "options": [{"text": "The nurse's hands are visibly soiled", "correct": true, "rationale": "Alcohol-based hand rubs are not effective on visibly soiled hands. Soap and water remove dirt and debris."}, {"text": "After removing gloves when caring for a client who has C. difficile", "correct": true, "rationale": "Alcohol-based products do not remove spores. Wash with soap and water immediately after removing gloves."}, {"text": "Before entering the room of a client on droplet precautions", "correct": false, "rationale": "An alcohol-based hand rub is preferred when hands are not visibly soiled and spores are not involved."}, {"text": "After taking a client's blood pressure", "correct": false, "rationale": "With no visible soil and no spores, an alcohol-based hand rub is appropriate."}, {"text": "Before applying gloves to obtain a throat culture", "correct": false, "rationale": "Hand hygiene is required here, but an alcohol-based hand rub is acceptable when hands are not visibly soiled."}]}, {"id": "w6-q22", "cat": "infectioncontrol", "type": "mc", "stem": "A nurse is washing their hands with soap and water. For how long should the nurse rub the hands together?", "options": [{"text": "At least 20 seconds, about the time it takes to sing \"Happy Birthday\" twice", "correct": true, "rationale": "Scrubbing for at least 20 seconds creates enough friction to remove micro-organisms."}, {"text": "5 seconds", "correct": false, "rationale": "This is not enough time to remove micro-organisms from all hand surfaces."}, {"text": "Until the water runs warm", "correct": false, "rationale": "Water temperature should be adjusted before washing. It is not a measure of washing time."}, {"text": "2 minutes", "correct": false, "rationale": "This exceeds the recommended time for routine handwashing and can dry the skin."}]}, {"id": "w6-q23", "cat": "infectioncontrol", "type": "dragdrop", "stem": "A nurse is reviewing medical and surgical asepsis with staff. Which activities require surgical asepsis? Move the correct activities to the answer box.", "leftLabel": "Activities", "rightLabel": "Requires surgical asepsis", "options": [{"text": "Inserting an indwelling urinary catheter", "correct": true, "rationale": "Catheter insertion is an invasive procedure that requires sterile technique."}, {"text": "Assisting with central line insertion", "correct": true, "rationale": "Central line insertion requires maximal sterile barriers and aseptic technique."}, {"text": "Adding supplies to a sterile field", "correct": true, "rationale": "Items placed on a sterile field must remain sterile, which is surgical asepsis."}, {"text": "Performing hand hygiene before and after client care", "correct": false, "rationale": "Routine hand hygiene is medical asepsis (clean technique)."}, {"text": "Preparing oral medications in a clean area", "correct": false, "rationale": "Keeping medication preparation areas clean is medical asepsis."}, {"text": "Implementing isolation precautions", "correct": false, "rationale": "Isolation precautions are an example of medical asepsis."}]}, {"id": "w6-q24", "cat": "infectioncontrol", "type": "mc", "stem": "A nurse is opening a sterile package to set up a sterile field. Which flap should the nurse open first?", "options": [{"text": "The flap farthest from the nurse's body", "correct": true, "rationale": "Opening the far flap first prevents the nurse from reaching over the sterile field later."}, {"text": "The flap closest to the nurse's body", "correct": false, "rationale": "The closest flap is opened last. Opening it first would mean reaching over the field to open the others."}, {"text": "Either side flap", "correct": false, "rationale": "The side flaps are opened second, one at a time, after the far flap."}, {"text": "Whichever flap is easiest to reach", "correct": false, "rationale": "Sterile packages are opened in a set order (far, sides, near) to prevent contamination."}]}, {"id": "w6-q25", "cat": "infectioncontrol", "type": "mc", "stem": "Which process eliminates all micro-organisms, including bacterial spores?", "options": [{"text": "Sterilization", "correct": true, "rationale": "Sterilization eradicates all micro-organisms, including spores, through thermal, chemical, or radiation methods."}, {"text": "Low-level disinfection", "correct": false, "rationale": "Low-level disinfection destroys most vegetative bacteria, but some spores, fungi, and viruses may remain."}, {"text": "High-level disinfection", "correct": false, "rationale": "High-level disinfection eliminates almost all micro-organisms, but some spores remain."}, {"text": "Medical asepsis", "correct": false, "rationale": "Medical asepsis reduces the number of micro-organisms; it does not eliminate them."}]}, {"id": "w6-q26", "cat": "infectioncontrol", "type": "dragdrop", "stem": "A nurse is preparing to administer oral medications to a client who is on contact precautions. Which PPE should the nurse don? Move the correct items to the answer box.", "leftLabel": "PPE", "rightLabel": "PPE to don", "options": [{"text": "Gown", "correct": true, "rationale": "Contact precautions require a gown at minimum when entering the room."}, {"text": "Gloves", "correct": true, "rationale": "Contact precautions require gloves at minimum when entering the room."}, {"text": "N95 respirator", "correct": false, "rationale": "N95 respirators are for airborne precautions."}, {"text": "Surgical mask", "correct": false, "rationale": "Surgical masks are for droplet precautions."}, {"text": "Goggles", "correct": false, "rationale": "Goggles are needed only when splashing to the eyes is expected."}, {"text": "Face shield", "correct": false, "rationale": "Face shields are needed only when splashing to the face is expected."}]}, {"id": "w6-q27", "cat": "infectioncontrol", "type": "mc", "stem": "A client who has influenza and is on droplet precautions needs to be transported to the radiology department. Which action should the nurse take?", "options": [{"text": "Place a surgical mask on the client for transport", "correct": true, "rationale": "Clients on droplet precautions wear a mask when they leave their room to prevent spreading the infectious agent."}, {"text": "Place an N95 respirator on the client", "correct": false, "rationale": "N95 respirators are worn by staff for airborne precautions. A surgical mask is appropriate for the client."}, {"text": "Postpone the test until precautions are discontinued", "correct": false, "rationale": "Clients on precautions can leave the room for necessary care when they wear a mask."}, {"text": "Have the client wear a gown and gloves", "correct": false, "rationale": "A gown and gloves do not contain respiratory droplets. The client needs a mask."}]}, {"id": "w6-q28", "cat": "infectioncontrol", "type": "mc", "stem": "A nurse is caring for a client who has suspected tuberculosis. Which actions should the nurse take? Select all that apply.", "options": [{"text": "Assign the client to an airborne infection isolation room", "correct": true, "rationale": "Clients on airborne precautions need a private negative-pressure room (AIIR)."}, {"text": "Keep the door to the room closed", "correct": true, "rationale": "The door of an airborne precaution room should remain closed."}, {"text": "Wear a fit-tested N95 respirator when entering the room", "correct": true, "rationale": "An N95 or higher respirator, specially fitted to the wearer, is required before entering."}, {"text": "Have the client wear a mask when leaving the room", "correct": true, "rationale": "Clients on airborne precautions wear a mask outside their room to prevent transmission."}, {"text": "Wear a surgical mask when providing care", "correct": false, "rationale": "A surgical mask is not enough for airborne particles. An N95 or higher respirator is required."}, {"text": "Leave the door open to monitor the client", "correct": false, "rationale": "An open door allows airborne particles to escape the negative-pressure room."}]}, {"id": "w6-q29", "cat": "infectioncontrol", "type": "mc", "stem": "A nurse is removing PPE after caring for a client. Which item should the nurse remove first?", "options": [{"text": "Gloves", "correct": true, "rationale": "Gloves are the most contaminated item and are removed first, followed by goggles or face shield, gown, then mask."}, {"text": "Gown", "correct": false, "rationale": "The gown is removed after the gloves and the goggles or face shield."}, {"text": "Mask", "correct": false, "rationale": "The mask is removed last, by its ties or ear loops, before hand hygiene."}, {"text": "Goggles", "correct": false, "rationale": "Goggles are removed second, after the gloves."}]}, {"id": "w6-q30", "cat": "infectioncontrol", "type": "mc", "stem": "A nurse is caring for a client who had an allogenic hematopoietic stem cell transplant 1 week ago. Which action is appropriate?", "options": [{"text": "Keep fresh and dried plants out of the client's room", "correct": true, "rationale": "Plants, fresh or dried, are typically prohibited in protective environments to reduce exposure to pathogens."}, {"text": "Place the client in a negative-pressure room", "correct": false, "rationale": "Protective isolation uses positive airflow with HEPA filtration to keep pathogens out. Negative pressure is for airborne precautions."}, {"text": "Encourage visits from family members who have cold symptoms", "correct": false, "rationale": "This client is immunocompromised and must be protected from exposure to infection."}, {"text": "Room the client with a client who has pneumonia", "correct": false, "rationale": "Rooming with an infected client would expose this immunocompromised client to pathogens."}]}, {"id": "w6-q31", "cat": "infectioncontrol", "type": "mc", "stem": "A nurse is stuck with a needle that was just used on a client. Which action should the nurse take first?", "options": [{"text": "Wash the area with soap and water", "correct": true, "rationale": "Washing the exposed area with soap and water is the immediate first action after a needlestick."}, {"text": "Report the exposure to the charge nurse", "correct": false, "rationale": "The exposure must be reported immediately, but only after the area is washed."}, {"text": "Apply an antiseptic to the site", "correct": false, "rationale": "No research shows that antiseptics are more beneficial than soap and water."}, {"text": "Wait to see if the site becomes inflamed", "correct": false, "rationale": "Needlestick exposures need immediate action, reporting, and follow-up testing per protocol."}]}, {"id": "w6-q32", "cat": "infectioncontrol", "type": "mc", "stem": "Which action should the nurse take to help prevent a catheter-associated urinary tract infection (CAUTI)?", "options": [{"text": "Advocate for removal of the catheter as soon as it is no longer needed", "correct": true, "rationale": "Avoiding unnecessary catheterization and removing the catheter early are key CAUTI prevention measures."}, {"text": "Place the drainage bag on the floor", "correct": false, "rationale": "When the tubing or bag touches a contaminated surface, pathogens can migrate into the bladder."}, {"text": "Insert a catheter routinely for all postoperative clients", "correct": false, "rationale": "Unnecessary catheterization increases infection risk."}, {"text": "Disconnect the tubing to empty the bag", "correct": false, "rationale": "Breaking the closed system contaminates it. The system must stay aseptic."}]}, {"id": "w6-q33", "cat": "infectioncontrol", "type": "mc", "stem": "A client who has an MRSA infection asks the nurse what that means. Which statement by the nurse is accurate?", "options": [{"text": "\"It's a bacterium that is resistant to one or more classes of antimicrobials, which makes it challenging to treat.\"", "correct": true, "rationale": "MDROs such as MRSA resist one or more classes of antimicrobials and typically respond to only one or two medications."}, {"text": "\"It's a virus that responds to any antibiotic.\"", "correct": false, "rationale": "MRSA is a bacterium (Staphylococcus aureus), and it is resistant to certain antimicrobials."}, {"text": "\"It can only spread through the air.\"", "correct": false, "rationale": "MDROs are managed with contact precautions because they spread through direct and indirect contact."}, {"text": "\"No special precautions are needed.\"", "correct": false, "rationale": "Hand hygiene, gloves, and contact precautions are needed to prevent spreading MDROs to other clients."}]}, {"id": "w6-q34", "cat": "infectioncontrol", "type": "mc", "stem": "A newborn receives antibodies from the mother. The nurse identifies this as which type of immunity?", "options": [{"text": "Passive immunity", "correct": true, "rationale": "Antibodies from an outside source, such as maternal antibodies, provide passive immunity. It is temporary and has no memory."}, {"text": "Active immunity", "correct": false, "rationale": "Active immunity develops when the body makes its own antibodies in response to an antigen."}, {"text": "Specific acquired immunity from vaccination", "correct": false, "rationale": "Vaccination stimulates the body to make its own antibodies, which is active immunity."}, {"text": "Permanent immunity", "correct": false, "rationale": "Passive immunity is temporary, not permanent."}]}, {"id": "w6-q35", "cat": "infectioncontrol", "type": "mc", "stem": "An older adult client in a residential facility has a urinary tract infection. Which finding should the nurse recognize as an atypical indication of infection in this client?", "options": [{"text": "New onset of acute confusion", "correct": true, "rationale": "Older adults may show atypical signs such as confusion, agitation, or incontinence instead of typical findings."}, {"text": "Fever", "correct": false, "rationale": "Fever is a typical indication of infection."}, {"text": "Malaise", "correct": false, "rationale": "Malaise is a typical indication of infection."}, {"text": "Increased heart rate", "correct": false, "rationale": "Increased heart rate is a typical systemic finding."}]}, {"id": "w6-q36", "cat": "infectioncontrol", "type": "mc", "stem": "A nurse has prepared a sterile field. Which events contaminate the field? Select all that apply.", "options": [{"text": "Sterile normal saline soaks through the drape", "correct": true, "rationale": "Moisture wicks microbes from the nonsterile surface to the sterile surface."}, {"text": "The nurse turns their back on the field to speak to someone", "correct": true, "rationale": "Turning away means the nurse can't see whether the field was touched."}, {"text": "The procedure is delayed 1 hour", "correct": true, "rationale": "Prolonged exposure to air contaminates a sterile field."}, {"text": "The nurse holds a sterile item below waist level", "correct": true, "rationale": "Anything held below the waist is considered contaminated."}, {"text": "The client's hand brushes the outer 1-inch border", "correct": false, "rationale": "The 1-inch border is already considered nonsterile. Unless the client reached farther in, the field remains sterile."}, {"text": "The provider drops a sterile instrument onto the near side of the field", "correct": false, "rationale": "As long as no one reached over the field, it remains sterile."}]}, {"id": "w6-q37", "cat": "infectioncontrol", "type": "mc", "stem": "Which action is the best way for the nurse to prevent health care-associated infections?", "options": [{"text": "Perform frequent and effective hand hygiene", "correct": true, "rationale": "Hand hygiene is the best way to prevent HAIs."}, {"text": "Administer prophylactic antibiotics to all clients", "correct": false, "rationale": "Overuse of antibiotics contributes to resistance and is not the best prevention."}, {"text": "Place all clients on contact precautions", "correct": false, "rationale": "Contact precautions are used for specific infections, not all clients."}, {"text": "Wear an N95 respirator for all care", "correct": false, "rationale": "N95s are for airborne precautions, not routine HAI prevention."}]}, {"id": "w6-q38", "cat": "infectioncontrol", "type": "mc", "stem": "A provider prescribes an antibiotic and a wound culture for a client with a suspected infection. Which action should the nurse take first?", "options": [{"text": "Collect the specimen for culture and sensitivity", "correct": true, "rationale": "Cultures should be obtained before antibiotic therapy begins so results are accurate."}, {"text": "Administer the first dose of the antibiotic", "correct": false, "rationale": "Giving the antibiotic first can affect culture results."}, {"text": "Wait until the client develops a fever", "correct": false, "rationale": "Treatment and testing should not be delayed."}, {"text": "Obtain an antigen test instead", "correct": false, "rationale": "A culture and sensitivity identifies the organism and effective antibiotics."}]}, {"id": "w6-q39", "cat": "infectioncontrol", "type": "mc", "stem": "A nurse is caring for a client who has active herpes zoster (shingles). Which action should the nurse take?", "options": [{"text": "Keep the client away from pregnant people who have not had chickenpox", "correct": true, "rationale": "The virus can spread through direct contact and cause chickenpox. Avoid exposing infants, pregnant people who haven't had chickenpox, and immunocompromised clients."}, {"text": "Discontinue isolation once the rash appears", "correct": false, "rationale": "Isolate the client until the vesicles have crusted over."}, {"text": "Administer the recombinant zoster vaccine to treat the rash", "correct": false, "rationale": "The vaccine prevents shingles but does not treat an active infection."}, {"text": "Apply warm compresses to the lesions", "correct": false, "rationale": "Cool water compresses or a cool bath are recommended."}]}, {"id": "w6-q40", "cat": "infectioncontrol", "type": "dragdrop", "stem": "A nurse is caring for a client who has an infection. Which findings indicate the infection is systemic rather than localized? Move the correct findings to the answer box.", "leftLabel": "Findings", "rightLabel": "Systemic infection", "options": [{"text": "Fever", "correct": true, "rationale": "Fever is a systemic finding."}, {"text": "Increased heart and respiratory rates", "correct": true, "rationale": "Increased HR and RR are systemic responses to infection."}, {"text": "Malaise", "correct": true, "rationale": "Malaise affects the whole body and is a systemic finding."}, {"text": "Enlarged lymph nodes", "correct": true, "rationale": "Enlarged lymph nodes are listed among systemic infection findings."}, {"text": "Edema at the wound site", "correct": false, "rationale": "Edema limited to the site is a localized finding."}, {"text": "Tenderness at the wound site", "correct": false, "rationale": "Pain or tenderness at the site is a localized finding."}]}, {"id": "w6sc-q01", "cat": "specimencollection", "type": "mc", "stem": "A nurse is planning care for a client who needs a fecal occult blood test. Which task can the nurse delegate to the UAP?", "options": [{"text": "Collecting the stool specimen", "correct": true, "rationale": "Collection of the occult blood specimen may be delegated to the UAP."}, {"text": "Performing the point-of-care occult blood test", "correct": false, "rationale": "Point-of-care testing for occult blood may not be delegated to the UAP."}, {"text": "Reading and interpreting the test results", "correct": false, "rationale": "Performing and reading the point-of-care test is not delegated."}, {"text": "Applying the developing solution to the card", "correct": false, "rationale": "Applying solution is part of point-of-care testing, which may not be delegated."}]}, {"id": "w6sc-q02", "cat": "specimencollection", "type": "dragdrop", "stem": "A nurse is delegating specimen collection tasks. Which tasks can the nurse delegate to the UAP? Move the correct tasks to the answer box.", "leftLabel": "Tasks", "rightLabel": "Can delegate to UAP", "options": [{"text": "Collecting a stool specimen for occult blood", "correct": true, "rationale": "Occult blood specimen collection may be delegated."}, {"text": "Collecting a clean-catch urine specimen", "correct": true, "rationale": "Urine specimen collection may be delegated to the UAP."}, {"text": "Capillary blood glucose testing for a stable client", "correct": true, "rationale": "In most cases, capillary glucose testing may be delegated to the UAP."}, {"text": "Performing the point-of-care occult blood test", "correct": false, "rationale": "Point-of-care occult blood testing may not be delegated."}, {"text": "Obtaining a throat culture", "correct": false, "rationale": "Throat cultures are not delegated to the UAP."}, {"text": "Obtaining a nasal swab", "correct": false, "rationale": "Nasal swabs are not delegated to the UAP."}]}, {"id": "w6sc-q03", "cat": "specimencollection", "type": "mc", "stem": "A nurse is performing a fingerstick for a capillary blood glucose. Where should the nurse place the lancet?", "options": [{"text": "On the side of the fingertip", "correct": true, "rationale": "The side of the finger is less painful than the central tip, which has a denser nerve supply."}, {"text": "On the central tip of the finger", "correct": false, "rationale": "The central tip has more nerves and is more painful."}, {"text": "On the knuckle", "correct": false, "rationale": "The knuckle is not a recommended capillary puncture site."}, {"text": "Directly over a visible vein", "correct": false, "rationale": "Capillary samples come from small vessels in the skin; veins are used for venipuncture."}]}, {"id": "w6sc-q04", "cat": "specimencollection", "type": "mc", "stem": "A client who is scheduled for a fecal occult blood test takes ibuprofen daily. How long before the test may NSAIDs need to be stopped?", "options": [{"text": "7 days", "correct": true, "rationale": "Aspirin, iron, NSAIDs, and anticoagulants can cause false results and are stopped 7 days before the test."}, {"text": "3 days", "correct": false, "rationale": "Three days applies to vitamin C and certain foods, not NSAIDs."}, {"text": "24 hours", "correct": false, "rationale": "This is not long enough for NSAIDs."}, {"text": "NSAIDs do not affect the test", "correct": false, "rationale": "NSAIDs may cause a false positive result."}]}, {"id": "w6sc-q05", "cat": "specimencollection", "type": "dragdrop", "stem": "A nurse is teaching a client about preparing for a fecal occult blood test. Which items can cause a false result? Move the correct items to the answer box.", "leftLabel": "Foods and medications", "rightLabel": "Can cause a false result", "options": [{"text": "Beets", "correct": true, "rationale": "Beets can cause a false result; avoid starting 3 days before."}, {"text": "Rare meat", "correct": true, "rationale": "Red or rare meat can cause a false result; avoid starting 3 days before."}, {"text": "Vitamin C", "correct": true, "rationale": "Vitamin C can cause a false result; stop 3 days before."}, {"text": "Iron supplements", "correct": true, "rationale": "Iron may cause a false positive; stop 7 days before."}, {"text": "Aspirin", "correct": true, "rationale": "Aspirin can cause a false result; stop 7 days before."}, {"text": "Anticoagulants", "correct": true, "rationale": "Anticoagulants may cause a false positive; stop 7 days before."}, {"text": "Water", "correct": false, "rationale": "Water does not affect occult blood results."}, {"text": "White rice", "correct": false, "rationale": "White rice is not listed as affecting occult blood results."}]}, {"id": "w6sc-q06", "cat": "specimencollection", "type": "mc", "stem": "A client's bedside glucometer reading is 420. Which action should the nurse take?", "options": [{"text": "Retest, and possibly send a blood sample to the lab", "correct": true, "rationale": "Readings above 400 or below 60 should be retested and possibly confirmed by the lab, because bedside meters are less accurate."}, {"text": "Document the result and take no further action", "correct": false, "rationale": "Unusually high readings need to be repeated to make sure the client is treated appropriately."}, {"text": "Assume the meter is broken and skip the reading", "correct": false, "rationale": "The result must be retested, not ignored."}, {"text": "Milk the finger to get a larger sample and recheck", "correct": false, "rationale": "Milking can lyse blood cells and alter the result."}]}, {"id": "w6sc-q07", "cat": "specimencollection", "type": "mc", "stem": "A nurse is performing a point-of-care fecal occult blood test. Which technique is correct?", "options": [{"text": "Apply two areas of stool, flip the card, add 2 drops of solution to each box, and read in 30 to 60 seconds", "correct": true, "rationale": "This is the expected technique, or follow the manufacturer's guidelines."}, {"text": "Apply one large area of stool and read immediately", "correct": false, "rationale": "Two separate areas of stool are applied, and the result is read after 30 to 60 seconds."}, {"text": "Add the solution to the front of the card where the stool was placed", "correct": false, "rationale": "The card is flipped over and the solution is added to the boxes on the other side."}, {"text": "Wait 10 minutes before reading the result", "correct": false, "rationale": "Results are read in 30 to 60 seconds or per manufacturer guidelines."}]}, {"id": "w6sc-q08", "cat": "specimencollection", "type": "mc", "stem": "A nurse is collecting a formed stool specimen. How much stool should the nurse collect?", "options": [{"text": "About 1 inch, or walnut-sized", "correct": true, "rationale": "A formed stool specimen should be about 1 inch, or the size of a walnut."}, {"text": "15 to 30 mL", "correct": false, "rationale": "15 to 30 mL is the amount for a liquid stool specimen."}, {"text": "The entire bowel movement", "correct": false, "rationale": "Only a walnut-sized portion is needed."}, {"text": "A smear on a cotton swab", "correct": false, "rationale": "A swab smear is not enough for a stool specimen."}]}, {"id": "w6sc-q09", "cat": "specimencollection", "type": "mc", "stem": "A client has liquid stools, and the provider orders a stool specimen. How much should the nurse collect?", "options": [{"text": "15 to 30 mL", "correct": true, "rationale": "A liquid stool specimen should be 15 to 30 mL."}, {"text": "5 mL", "correct": false, "rationale": "This is less than the amount needed for a liquid stool specimen."}, {"text": "100 mL", "correct": false, "rationale": "This is more than needed. The specimen should be 15 to 30 mL."}, {"text": "About 1 inch", "correct": false, "rationale": "1 inch, or walnut-sized, is the amount for formed stool."}]}, {"id": "w6sc-q10", "cat": "specimencollection", "type": "mc", "stem": "A nurse is collecting a stool specimen to test for C. difficile. Which action should the nurse take?", "options": [{"text": "Place the client on contact isolation until the results come back", "correct": true, "rationale": "Clients being tested for C. diff are placed on contact isolation until results are known."}, {"text": "Wait for a positive result before starting isolation", "correct": false, "rationale": "Isolation starts while the test is pending."}, {"text": "Place the client on airborne precautions", "correct": false, "rationale": "C. difficile requires contact precautions, not airborne."}, {"text": "Use an alcohol-based hand rub after removing gloves", "correct": false, "rationale": "C. diff spores require soap and water; alcohol-based products do not remove spores."}]}, {"id": "w6sc-q11", "cat": "specimencollection", "type": "mc", "stem": "A nurse is preparing to draw blood with a needle. Which needle has the largest opening?", "options": [{"text": "18-gauge", "correct": true, "rationale": "The larger the gauge number, the smaller the opening. An 18-gauge needle is larger than a 22-gauge."}, {"text": "20-gauge", "correct": false, "rationale": "A 20-gauge needle is smaller than an 18-gauge."}, {"text": "22-gauge", "correct": false, "rationale": "A 22-gauge needle is smaller than an 18-gauge."}, {"text": "25-gauge", "correct": false, "rationale": "A 25-gauge needle has the smallest opening of these choices."}]}, {"id": "w6sc-q12", "cat": "specimencollection", "type": "mc", "stem": "A provider orders stool for ova and parasites. How many specimens are usually collected?", "options": [{"text": "Three separate specimens", "correct": true, "rationale": "Three separate stool specimens are usually collected for ova and parasites."}, {"text": "One specimen", "correct": false, "rationale": "A single specimen may miss ova and parasites; three are usually collected."}, {"text": "Two specimens collected at once", "correct": false, "rationale": "Separate specimens are collected, usually three."}, {"text": "A 24-hour stool collection", "correct": false, "rationale": "Ova and parasites testing uses separate specimens, not a 24-hour collection."}]}, {"id": "w6sc-q13", "cat": "specimencollection", "type": "mc", "stem": "A nurse is teaching a female client how to collect a clean-catch urine specimen. Which instruction is correct?", "options": [{"text": "Separate the labia and clean from front to back", "correct": true, "rationale": "Cleaning front to back, with the labia separated, keeps rectal bacteria away from the urinary meatus."}, {"text": "Clean from back to front", "correct": false, "rationale": "Cleaning back to front moves bacteria toward the urinary meatus."}, {"text": "Use one towelette for the entire area", "correct": false, "rationale": "Use 2 to 3 towelettes, each one only once."}, {"text": "Collect the very first stream of urine", "correct": false, "rationale": "Start voiding into the toilet, stop, then collect the midstream portion."}]}, {"id": "w6sc-q14", "cat": "specimencollection", "type": "mc", "stem": "A client's urine dipstick shows a high specific gravity. The nurse recognizes this finding may indicate", "options": [{"text": "dehydration.", "correct": true, "rationale": "High specific gravity means concentrated urine, which can indicate dehydration. The expected range is 1.005 to 1.030."}, {"text": "a urinary tract infection.", "correct": false, "rationale": "Leukocytes and nitrites indicate infection."}, {"text": "liver disease.", "correct": false, "rationale": "Bilirubin and urobilinogen can indicate liver disease."}, {"text": "dilute urine.", "correct": false, "rationale": "Low specific gravity indicates dilute urine."}]}, {"id": "w6sc-q15", "cat": "specimencollection", "type": "mc", "stem": "A nurse needs a urine specimen from a client who has had an indwelling catheter for 3 days. Where should the nurse obtain the specimen?", "options": [{"text": "From the sampling port, using a syringe", "correct": true, "rationale": "Specimens are drawn from the sampling port after clamping the tubing and wiping the port with a disinfectant."}, {"text": "From the drainage bag", "correct": false, "rationale": "Urine from a bag already connected to the client is concentrated or contaminated. Bag urine is OK only when the catheter is first inserted."}, {"text": "By disconnecting the catheter from the tubing", "correct": false, "rationale": "Breaking the closed system increases the risk of infection."}, {"text": "From the end of the drainage tubing", "correct": false, "rationale": "The specimen should come from the sampling port, not the drainage tubing outlet."}]}, {"id": "w6sc-q16", "cat": "specimencollection", "type": "dragdrop", "stem": "A nurse is collecting a urine specimen from a client's indwelling catheter. Which actions are correct? Move the correct actions to the answer box.", "leftLabel": "Nursing actions", "rightLabel": "Correct actions", "options": [{"text": "Clamp the tubing 3 inches below the sampling port", "correct": true, "rationale": "Clamping lets urine collect above the port. Clamp no more than 30 minutes."}, {"text": "Wipe the sampling port with alcohol or another disinfectant", "correct": true, "rationale": "Disinfecting the port prevents contamination of the specimen."}, {"text": "Draw out at least 10 mL with a syringe", "correct": true, "rationale": "At least 10 mL is needed for the specimen."}, {"text": "Unclamp the tubing when finished", "correct": true, "rationale": "The catheter must be unclamped to allow urine to drain."}, {"text": "Clamp the tubing for 2 hours", "correct": false, "rationale": "Clamp no more than 30 minutes."}, {"text": "Pour urine from the drainage bag into the specimen cup", "correct": false, "rationale": "Never take urine from a drainage bag that has been connected to the client."}, {"text": "Disconnect the catheter from the tubing to collect urine", "correct": false, "rationale": "Disconnecting breaks the closed system and increases infection risk."}]}, {"id": "w6sc-q17", "cat": "specimencollection", "type": "mc", "stem": "A nurse is starting a 24-hour urine collection at 0800. Which action should the nurse take first?", "options": [{"text": "Have the client void, discard that urine, and note the start time", "correct": true, "rationale": "The first void is discarded because it was made before the collection period started."}, {"text": "Save the 0800 void as the first specimen", "correct": false, "rationale": "The first void is discarded, not saved."}, {"text": "Wait until the client's next meal to start", "correct": false, "rationale": "Collection begins when the client voids and the first specimen is discarded."}, {"text": "Insert an indwelling catheter for the collection", "correct": false, "rationale": "A catheter is not required for a 24-hour urine collection."}]}, {"id": "w6sc-q18", "cat": "specimencollection", "type": "mc", "stem": "A client cannot cough up enough sputum for a specimen. Which action should the nurse take first?", "options": [{"text": "Use chest physiotherapy to mobilize secretions", "correct": true, "rationale": "Chest physiotherapy is tried first. Suctioning and transtracheal aspiration are last resorts."}, {"text": "Perform transtracheal aspiration", "correct": false, "rationale": "This is a last resort after less invasive methods fail."}, {"text": "Collect saliva instead", "correct": false, "rationale": "Saliva contaminates a sputum specimen; it must come from the lungs."}, {"text": "Have the client rinse with mouthwash and try again", "correct": false, "rationale": "Mouthwash may contain antibacterial agents that affect results."}]}, {"id": "w6sc-q19", "cat": "specimencollection", "type": "mc", "stem": "A nurse is teaching a client how to collect a sputum specimen. Which instruction should the nurse include? Select all that apply.", "options": [{"text": "Collect the specimen in the morning", "correct": true, "rationale": "Morning is the best time to collect sputum."}, {"text": "Rinse your mouth with water before collecting", "correct": true, "rationale": "Rinsing removes contaminants from the mouth."}, {"text": "Take a few deep breaths, then cough", "correct": true, "rationale": "Deep breaths and a cough bring up sputum from the lungs rather than saliva."}, {"text": "Do not touch the inside of the cup", "correct": true, "rationale": "Touching the inside contaminates the specimen."}, {"text": "Rinse with mouthwash first", "correct": false, "rationale": "Mouthwash may contain antibacterial agents that affect results."}, {"text": "Spit saliva into the cup", "correct": false, "rationale": "The specimen must come from the lungs, not saliva."}]}, {"id": "w6sc-q20", "cat": "specimencollection", "type": "mc", "stem": "A provider orders sputum specimens for acid-fast bacilli (AFB). Which collection schedule is correct?", "options": [{"text": "Three consecutive specimens, 8 to 24 hours apart", "correct": true, "rationale": "AFB testing requires 3 consecutive specimens collected 8 to 24 hours apart."}, {"text": "One specimen collected in the morning", "correct": false, "rationale": "One specimen is not enough for AFB testing."}, {"text": "Three specimens collected within 1 hour", "correct": false, "rationale": "The specimens must be 8 to 24 hours apart."}, {"text": "Two specimens collected 48 hours apart", "correct": false, "rationale": "AFB requires 3 specimens, 8 to 24 hours apart."}]}, {"id": "w6sc-q21", "cat": "specimencollection", "type": "mc", "stem": "A nurse is obtaining a wound culture. Which action is correct?", "options": [{"text": "Clean the wound with 0.9% sodium chloride, then swab clean tissue in the center of the wound", "correct": true, "rationale": "The wound is cleaned first, and the specimen comes from the center of the wound, since the edges carry skin flora."}, {"text": "Swab the exudate on the old dressing", "correct": false, "rationale": "Exudate and old dressings contain contaminants and do not give an accurate culture."}, {"text": "Swab the skin surrounding the wound", "correct": false, "rationale": "Surrounding skin contains normal flora and would contaminate the culture."}, {"text": "Collect the culture after the first dose of antibiotic", "correct": false, "rationale": "Cultures should be collected before antibiotic therapy begins."}]}, {"id": "w6sc-q22", "cat": "specimencollection", "type": "mc", "stem": "A nurse is obtaining a nasal swab. Which technique is correct?", "options": [{"text": "Insert the swab 1.5 cm, rotate at least 4 times for 15 seconds, and repeat in the other naris with the same swab", "correct": true, "rationale": "The same swab is used in both nares."}, {"text": "Use a new swab for each naris", "correct": false, "rationale": "The same swab is used in both nares."}, {"text": "Insert the swab until resistance is felt deep in the nasopharynx", "correct": false, "rationale": "A nasal swab is inserted about 1.5 cm. Nasopharyngeal swabs are a different test."}, {"text": "Have the client tilt the head forward", "correct": false, "rationale": "The client tilts the head back."}]}, {"id": "w6sc-q23", "cat": "specimencollection", "type": "mc", "stem": "Which action should the nurse take before obtaining a nasal swab?", "options": [{"text": "Have the client blow their nose and check patency with a penlight", "correct": true, "rationale": "Blowing the nose clears secretions, and the nurse checks patency before inserting the swab."}, {"text": "Delegate the swab to the UAP", "correct": false, "rationale": "Nasal swabs should not be delegated to the UAP."}, {"text": "Moisten the swab with tap water", "correct": false, "rationale": "Tap water would contaminate the swab."}, {"text": "Use any available collection tube", "correct": false, "rationale": "The nurse must use the correct tube: viral vs bacterial, nasal vs nasopharyngeal."}]}, {"id": "w6sc-q24", "cat": "specimencollection", "type": "mc", "stem": "A client's fecal occult blood card is positive, and the client reports dark, tarry stools. The nurse recognizes this suggests bleeding from where?", "options": [{"text": "High in the GI tract", "correct": true, "rationale": "Bleeding high in the GI tract makes stool appear dark or tarry."}, {"text": "A hemorrhoid", "correct": false, "rationale": "Bleeding low in the GI tract, such as from a hemorrhoid, causes bright red streaks."}, {"text": "Menstrual bleeding", "correct": false, "rationale": "Menstrual blood appears bright red and can cause an inaccurate result."}, {"text": "The urinary tract", "correct": false, "rationale": "FOBT detects GI bleeding, not urinary bleeding."}]}, {"id": "w6sc-q25", "cat": "specimencollection", "type": "mc", "stem": "A client's capillary blood glucose result is 62. The nurse compares it to the expected fasting range. How should the nurse interpret this result?", "options": [{"text": "Below the expected range of 74 to 106", "correct": true, "rationale": "62 is below the expected reference range of 74 to 106."}, {"text": "Within the expected range", "correct": false, "rationale": "The expected range is 74 to 106; 62 is below it."}, {"text": "Above the expected range", "correct": false, "rationale": "62 is below, not above, the expected range."}, {"text": "Unable to interpret without a urine specimen", "correct": false, "rationale": "Capillary glucose is interpreted on its own against the reference range."}]}, {"id": "w6sc-q26", "cat": "specimencollection", "type": "mc", "stem": "A nurse is preparing to obtain a throat culture. How should the nurse position the client?", "options": [{"text": "Sitting upright", "correct": true, "rationale": "An upright position lets the nurse reach the oropharynx with good body mechanics and avoid touching the lips, teeth, or tongue."}, {"text": "Supine with the head flat", "correct": false, "rationale": "Lying flat makes the oropharynx harder to see and swab without contamination."}, {"text": "Side-lying", "correct": false, "rationale": "Side-lying does not give a clear view of the oropharynx."}, {"text": "Prone", "correct": false, "rationale": "Prone position prevents access to the mouth and throat."}]}, {"id": "w6sc-q27", "cat": "specimencollection", "type": "mc", "stem": "Before obtaining a throat culture, a nurse notes that the client's epiglottis is severely inflamed. Which action should the nurse take?", "options": [{"text": "Do not obtain the specimen and notify the provider", "correct": true, "rationale": "Irritating a severely inflamed epiglottis can cause edema and airway obstruction."}, {"text": "Swab the epiglottis gently to get the best sample", "correct": false, "rationale": "Swabbing the epiglottis can cause trauma or airway occlusion."}, {"text": "Obtain the specimen quickly to limit irritation", "correct": false, "rationale": "Speed does not remove the risk of airway obstruction."}, {"text": "Have the client gargle with mouthwash first", "correct": false, "rationale": "Mouthwash does not address the airway risk and could affect the specimen."}]}, {"id": "w6sc-q28", "cat": "specimencollection", "type": "mc", "stem": "While obtaining a throat culture, the nurse accidentally touches the swab to the client's tongue. Which action should the nurse take?", "options": [{"text": "Discard the swab and start again with a new sterile swab", "correct": true, "rationale": "Touching the tongue contaminates the specimen. The nurse withdraws, discards the swab, and begins again."}, {"text": "Continue swabbing the tonsils with the same swab", "correct": false, "rationale": "The swab is already contaminated, so the culture would be inaccurate."}, {"text": "Note the contact on the lab requisition and send it", "correct": false, "rationale": "A contaminated specimen should not be sent."}, {"text": "Rinse the swab with sterile saline and continue", "correct": false, "rationale": "Rinsing does not make a contaminated swab sterile."}]}, {"id": "w6sc-q29", "cat": "specimencollection", "type": "mc", "stem": "A nurse is obtaining a throat culture from a preschool-age child. Which action is appropriate?", "options": [{"text": "Have the guardian hold the child on their lap with a hand on the child's forehead", "correct": true, "rationale": "This stabilizes the head, which prevents contamination of the specimen and injury to the child."}, {"text": "Ask the guardian to wait outside the room", "correct": false, "rationale": "A guardian's presence reduces fear and promotes cooperation."}, {"text": "Delegate the swab to the UAP so the nurse can hold the child", "correct": false, "rationale": "Throat cultures should not be delegated to the UAP."}, {"text": "Swab while the child is lying flat and crying", "correct": false, "rationale": "Stabilizing the child's head upright is safer and prevents contamination."}]}, {"id": "w6sc-q30", "cat": "specimencollection", "type": "mc", "stem": "A nurse has removed a client's soiled wound dressing before obtaining a wound culture. Which action should the nurse take next?", "options": [{"text": "Remove gloves, perform hand hygiene, and apply clean gloves", "correct": true, "rationale": "Changing gloves and performing hand hygiene after removing a soiled dressing prevents contaminating the wound and the culture."}, {"text": "Swab the wound immediately with the same gloves on", "correct": false, "rationale": "The gloves are contaminated from the old dressing, and the wound has not yet been irrigated."}, {"text": "Swab the drainage on the removed dressing", "correct": false, "rationale": "Specimens are taken from clean wound tissue, not from an old dressing."}, {"text": "Apply the new dressing, then swab around its edges", "correct": false, "rationale": "The culture is collected from the irrigated wound before redressing."}]}, {"id": "w6sc-q31", "cat": "specimencollection", "type": "mc", "stem": "After placing a wound culture swab into its tube, which action should the nurse take?", "options": [{"text": "Secure the top and squeeze the bottom of the tube to activate the culture medium", "correct": true, "rationale": "Activating the medium keeps the specimen viable until the lab processes it. Follow manufacturer instructions."}, {"text": "Leave the cap loose so the specimen can breathe", "correct": false, "rationale": "The top must be secured to prevent contamination."}, {"text": "Refrigerate the tube until the end of the shift", "correct": false, "rationale": "The tube is labeled and sent to the lab in a biohazard bag."}, {"text": "Rinse the swab tip with saline before capping", "correct": false, "rationale": "Rinsing would wash away the specimen."}]}, {"id": "w6sc-q32", "cat": "specimencollection", "type": "mc", "stem": "Shortly after a wound culture is collected, the client's temperature is 104.4\u00b0F (40.2\u00b0C) and blood pressure is 84/50 mm Hg. Which action should the nurse take?", "options": [{"text": "Report the findings to the provider immediately", "correct": true, "rationale": "Fever above 104\u00b0F with hypotension suggests sepsis and must be reported right away."}, {"text": "Recheck the vital signs in 4 hours", "correct": false, "rationale": "These are manifestations of sepsis; waiting delays urgent care."}, {"text": "Document the findings as expected after wound care", "correct": false, "rationale": "High fever and hypotension are not expected findings."}, {"text": "Collect a second wound culture", "correct": false, "rationale": "The priority is reporting possible sepsis, not repeating the culture."}]}, {"id": "w6sc-q33", "cat": "specimencollection", "type": "dragdrop", "stem": "A nurse has finished collecting a wound culture. Which information should the nurse document? Move the correct items to the answer box.", "leftLabel": "Information", "rightLabel": "Document", "options": [{"text": "Date and time of collection", "correct": true, "rationale": "Date and time are required documentation for the specimen."}, {"text": "Collection method used", "correct": true, "rationale": "The method of collection is documented."}, {"text": "Description of the wound and drainage", "correct": true, "rationale": "Wound and drainage findings are documented."}, {"text": "Wound dressing change", "correct": true, "rationale": "The dressing change performed after collection is documented."}, {"text": "The lab technician's phone number", "correct": false, "rationale": "This is not part of wound culture documentation."}, {"text": "The room temperature", "correct": false, "rationale": "This is not part of wound culture documentation."}]}, {"id": "w6sc-q34", "cat": "specimencollection", "type": "mc", "stem": "A nurse taught a client how to collect a sputum specimen. Which statement by the client indicates understanding?", "options": [{"text": "\"I'll rinse my mouth with water, take a few deep breaths, and cough into the cup in the morning.\"", "correct": true, "rationale": "Morning collection, a water rinse, deep breathing, and coughing produce a specimen from the lungs."}, {"text": "\"I'll gargle with mouthwash first so the sample is clean.\"", "correct": false, "rationale": "Mouthwash may contain antibacterial agents that affect results."}, {"text": "\"I'll spit into the cup whenever I have extra saliva.\"", "correct": false, "rationale": "The specimen must come from the lungs, not saliva."}, {"text": "\"I'll wipe the inside of the cup with a tissue before using it.\"", "correct": false, "rationale": "Touching the inside of the cup contaminates it."}]}, {"id": "w6sc-q35", "cat": "specimencollection", "type": "mc", "stem": "A nurse taught a client about a 24-hour urine collection. Which statement by the client indicates understanding?", "options": [{"text": "\"I'll urinate and throw that away when we start, then save all my urine for the next 24 hours.\"", "correct": true, "rationale": "The first void is discarded and timing starts; all urine for the next 24 hours is saved."}, {"text": "\"I'll save the first urine of the morning as the start of the collection.\"", "correct": false, "rationale": "The first void is discarded, not saved."}, {"text": "\"I only need to save the urine I make during the day.\"", "correct": false, "rationale": "All urine for the full 24 hours is collected."}, {"text": "\"I don't need to urinate at the end of the 24 hours.\"", "correct": false, "rationale": "The client voids at the end to empty the bladder, and that urine is included."}]}, {"id": "w6sc-q36", "cat": "specimencollection", "type": "mc", "stem": "A nurse is preparing to admit a client who is suspected to have pulmonary tuberculosis and has a prescription for sputum AFB specimens. Which action should the nurse take first?", "options": [{"text": "Implement airborne precautions", "correct": true, "rationale": "Preventing airborne transmission of TB to others is the priority safety action."}, {"text": "Obtain the first sputum specimen", "correct": false, "rationale": "Specimens are needed to confirm the diagnosis, but protecting others from exposure comes first."}, {"text": "Teach the client to rinse with water before coughing", "correct": false, "rationale": "Teaching is important but is not the priority."}, {"text": "Schedule the remaining specimens 8 to 24 hours apart", "correct": false, "rationale": "Planning the collection is not the priority over preventing transmission."}]}, {"id": "w6sc-q37", "cat": "specimencollection", "type": "dragdrop", "stem": "A nurse is observing a UAP collect specimens. Which UAP actions require the nurse to intervene? Move the correct actions to the answer box.", "leftLabel": "UAP actions", "rightLabel": "Requires intervention", "options": [{"text": "Squeezing the client's finger to get more blood for a glucose test", "correct": true, "rationale": "Do not squeeze or milk the finger during capillary glucose testing."}, {"text": "Pouring urine from a catheter drainage bag into a specimen cup", "correct": true, "rationale": "Never take urine from a drainage bag connected to the client."}, {"text": "Including toilet tissue with the stool specimen", "correct": true, "rationale": "Stool specimens should not contain urine or toilet tissue."}, {"text": "Performing the point-of-care occult blood test", "correct": true, "rationale": "Point-of-care occult blood testing may not be delegated to the UAP."}, {"text": "Wiping away the first drop of blood before testing glucose", "correct": false, "rationale": "This is correct capillary glucose technique."}, {"text": "Collecting a walnut-sized formed stool specimen", "correct": false, "rationale": "This is the correct amount for a formed stool specimen."}]}, {"id": "w6sc-q38", "cat": "specimencollection", "type": "mc", "stem": "A nurse cleans the client's fingertip, punctures it, and applies the first drop of blood to the glucose strip. Which part of the procedure was incorrect?", "options": [{"text": "Applying the first drop of blood to the strip", "correct": true, "rationale": "The first drop should be wiped away before the sample is applied."}, {"text": "Cleaning the fingertip", "correct": false, "rationale": "Site cleansing is an expected step."}, {"text": "Puncturing the fingertip", "correct": false, "rationale": "Puncturing the selected site is an expected step."}, {"text": "Using a fingertip as the site", "correct": false, "rationale": "The fingertip is an acceptable site."}]}, {"id": "w6sc-q39", "cat": "specimencollection", "type": "mc", "stem": "A nurse starts a 24-hour urine collection at 0700 by having the client void into the collection container and saving it. What was the error?", "options": [{"text": "The first void should have been discarded", "correct": true, "rationale": "At the start of a 24-hour collection, the client voids, that urine is discarded, and the time starts."}, {"text": "The collection should start at midnight", "correct": false, "rationale": "The collection can begin at any time; the start time is noted."}, {"text": "The container should not be used until the end", "correct": false, "rationale": "Urine is added to the container throughout the 24 hours."}, {"text": "There was no error", "correct": false, "rationale": "Saving the first void adds urine made before the collection period."}]}, {"id": "w6sc-q40", "cat": "specimencollection", "type": "mc", "stem": "A nurse instructs a male client to clean from the shaft up toward the urinary meatus before a clean-catch specimen. What is wrong with this instruction?", "options": [{"text": "Cleaning should start at the meatus and move down the shaft", "correct": true, "rationale": "Cleaning in a circular motion from the meatus outward moves bacteria away from the urethral opening."}, {"text": "The foreskin should not be retracted", "correct": false, "rationale": "The foreskin is retracted to clean the meatus."}, {"text": "Only one towelette should be used for the whole area", "correct": false, "rationale": "Each towelette is used only once."}, {"text": "Male clients do not need to clean before a clean catch", "correct": false, "rationale": "Cleaning the perineal area at the meatus is required for both sexes."}]}, {"id": "w6ti-q01", "cat": "tissueintegrity", "type": "mc", "stem": "A nurse assesses a client's sacrum and finds intact skin with a localized area of redness that does not blanch when pressed. How should the nurse stage this pressure injury?", "options": [{"text": "Stage 1", "correct": true, "rationale": "Stage 1 is intact skin with localized nonblanchable erythema."}, {"text": "Stage 2", "correct": false, "rationale": "Stage 2 involves partial-thickness skin loss with exposed dermis or a blister. This skin is intact."}, {"text": "Deep tissue pressure injury", "correct": false, "rationale": "A DTPI has deep red, maroon, or purple discoloration, not simple redness."}, {"text": "Unstageable", "correct": false, "rationale": "Unstageable injuries have a wound bed hidden by slough or eschar."}]}, {"id": "w6ti-q02", "cat": "tissueintegrity", "type": "mc", "stem": "A client has a shallow open wound on the elbow with a moist, pink wound bed. No slough, fat, or deeper tissue is visible. How should the nurse stage this pressure injury?", "options": [{"text": "Stage 2", "correct": true, "rationale": "Stage 2 is partial-thickness skin loss with a moist pink or red wound bed and exposed dermis. Deeper tissues are not visible."}, {"text": "Stage 1", "correct": false, "rationale": "Stage 1 skin is intact. This wound is open."}, {"text": "Stage 3", "correct": false, "rationale": "Stage 3 is full-thickness skin loss with visible adipose tissue."}, {"text": "Stage 4", "correct": false, "rationale": "Stage 4 exposes bone, tendon, muscle, or other deep structures."}]}, {"id": "w6ti-q03", "cat": "tissueintegrity", "type": "mc", "stem": "A client has a pressure injury on the hip with full-thickness skin loss and visible adipose tissue. No bone, tendon, or muscle is visible. How should the nurse stage this injury?", "options": [{"text": "Stage 3", "correct": true, "rationale": "Stage 3 is full-thickness skin loss with visible adipose tissue. Fascia, muscle, tendon, and bone are not visible."}, {"text": "Stage 2", "correct": false, "rationale": "Stage 2 is partial-thickness loss. Adipose tissue is not visible."}, {"text": "Stage 4", "correct": false, "rationale": "Stage 4 requires exposed bone, tendon, muscle, ligament, cartilage, or fascia."}, {"text": "Unstageable", "correct": false, "rationale": "The wound bed is visible, so the injury can be staged."}]}, {"id": "w6ti-q04", "cat": "tissueintegrity", "type": "mc", "stem": "A nurse finds a sacral pressure injury in which bone is visible in the wound bed. How should the nurse stage this injury?", "options": [{"text": "Stage 4", "correct": true, "rationale": "Stage 4 is full-thickness skin and tissue loss with exposed bone, tendon, muscle, ligament, cartilage, or fascia."}, {"text": "Stage 3", "correct": false, "rationale": "Stage 3 shows adipose tissue but not bone or deeper structures."}, {"text": "Deep tissue pressure injury", "correct": false, "rationale": "A DTPI is a deep red, maroon, or purple discoloration, not an open wound with exposed bone."}, {"text": "Unstageable", "correct": false, "rationale": "The wound bed is visible, so the injury can be staged."}]}, {"id": "w6ti-q05", "cat": "tissueintegrity", "type": "mc", "stem": "A client's heel wound is completely covered with hard, black tissue, and the wound bed cannot be seen. How should the nurse classify this pressure injury?", "options": [{"text": "Unstageable", "correct": true, "rationale": "When slough or eschar hides the wound bed, the depth cannot be determined, so the injury is unstageable."}, {"text": "Stage 4", "correct": false, "rationale": "The depth can't be confirmed while eschar covers the bed. Once removed, it may be stage 3 or 4."}, {"text": "Stage 1", "correct": false, "rationale": "Stage 1 is intact skin with nonblanchable redness."}, {"text": "Deep tissue pressure injury", "correct": false, "rationale": "A DTPI is a deep red, maroon, or purple discoloration, not a wound covered with eschar."}]}, {"id": "w6ti-q06", "cat": "tiss
