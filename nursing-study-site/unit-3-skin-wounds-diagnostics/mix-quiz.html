's heel with persistent, nonblanchable maroon-purple discoloration. The client reports pain at the site. How should the nurse classify this finding?", "options": [{"text": "Deep tissue pressure injury", "correct": true, "rationale": "A DTPI presents as persistent, nonblanchable deep red, maroon, or purple discoloration of intact or broken skin."}, {"text": "Stage 1 pressure injury", "correct": false, "rationale": "Stage 1 is nonblanchable redness, not deep maroon or purple discoloration."}, {"text": "Stage 2 pressure injury", "correct": false, "rationale": "Stage 2 is partial-thickness skin loss. This skin is intact."}, {"text": "Ecchymosis", "correct": false, "rationale": "A bruise is not a pressure-related injury over a pressure point with persistent nonblanchable discoloration."}]}, {"id": "w6ti-q07", "cat": "tissueintegrity", "type": "dragdrop", "stem": "A nurse is staging a client's pressure injury. Which findings are consistent with a stage 3 pressure injury? Move the correct findings to the answer box.", "leftLabel": "Assessment findings", "rightLabel": "Stage 3 findings", "options": [{"text": "Full-thickness skin loss", "correct": true, "rationale": "Stage 3 is defined as full-thickness skin loss."}, {"text": "Visible adipose tissue", "correct": true, "rationale": "Adipose tissue is visible in a stage 3 pressure injury."}, {"text": "Rolled wound edges", "correct": true, "rationale": "Wound edges may be rolled (epibole) in stage 3."}, {"text": "Tunneling present", "correct": true, "rationale": "Undermining and tunneling may be present in stage 3."}, {"text": "Exposed bone", "correct": false, "rationale": "Exposed bone indicates a stage 4 pressure injury."}, {"text": "Intact skin with nonblanchable redness", "correct": false, "rationale": "Intact skin with nonblanchable redness is stage 1."}, {"text": "Ruptured serum-filled blister", "correct": false, "rationale": "A ruptured serum-filled blister is a stage 2 presentation."}]}, {"id": "w6ti-q08", "cat": "tissueintegrity", "type": "mc", "stem": "A nurse presses on a reddened area over a client's hip. The area turns white, then returns to red when the pressure is released. Which finding should the nurse document?", "options": [{"text": "Blanchable erythema", "correct": true, "rationale": "Redness that turns white with pressure and returns when released is blanchable erythema."}, {"text": "Stage 1 pressure injury", "correct": false, "rationale": "Stage 1 requires nonblanchable erythema. This area blanched."}, {"text": "Deep tissue pressure injury", "correct": false, "rationale": "A DTPI has persistent, nonblanchable deep red, maroon, or purple discoloration."}, {"text": "Stage 2 pressure injury", "correct": false, "rationale": "Stage 2 involves an open wound or blister. The skin here is intact."}]}, {"id": "w6ti-q09", "cat": "tissueintegrity", "type": "mc", "stem": "A client has a stable, dry, intact eschar on the heel. Which action should the nurse take?", "options": [{"text": "Leave the eschar in place and keep pressure off the heel", "correct": true, "rationale": "Secure eschar on the heel should not be softened or removed."}, {"text": "Apply a hydrogel to soften the eschar for removal", "correct": false, "rationale": "Stable heel eschar should not be softened."}, {"text": "Remove the eschar so the wound can be staged", "correct": false, "rationale": "Stable eschar on the heel should not be removed."}, {"text": "Document the wound as a stage 4 pressure injury", "correct": false, "rationale": "A wound covered with eschar is unstageable; its depth is unknown."}]}, {"id": "w6ti-q10", "cat": "tissueintegrity", "type": "dragdrop", "stem": "A nurse is reviewing a client's medical record. Which findings are risk factors for pressure injury development? Move the correct findings to the answer box.", "leftLabel": "Findings", "rightLabel": "Pressure injury risk factors", "options": [{"text": "Client is bedfast", "correct": true, "rationale": "Immobility is one of the greatest contributors to pressure injuries."}, {"text": "Decreased sensation in the lower extremities", "correct": true, "rationale": "Sensory loss keeps the client from feeling pressure-related discomfort."}, {"text": "Pedal pulses 1+ bilaterally", "correct": true, "rationale": "Diminished pulses suggest reduced perfusion, a risk factor."}, {"text": "Albumin 3.0 g/dL", "correct": true, "rationale": "Low albumin indicates malnutrition, which increases pressure injury risk."}, {"text": "Alert and oriented x3", "correct": false, "rationale": "This is an expected finding. A decreased level of consciousness is the risk factor."}, {"text": "Eats 100% of meals", "correct": false, "rationale": "Adequate nutrition lowers the risk of pressure injury."}]}, {"id": "w6ti-q11", "cat": "tissueintegrity", "type": "mc", "stem": "A nurse is caring for a client who is at risk for pressure injuries. Which interventions should the nurse include in the plan of care? Select all that apply.", "options": [{"text": "Reposition the client at least every 2 hours in bed", "correct": true, "rationale": "Clients in bed should be repositioned at least every 2 hours to relieve pressure."}, {"text": "Keep the head of the bed at 30 degrees or lower unless contraindicated", "correct": true, "rationale": "Keeping the head of the bed low reduces shear and sacral pressure."}, {"text": "Lift rather than pull the client up in bed", "correct": true, "rationale": "Pulling creates friction that damages the epidermis."}, {"text": "Have the client sit on a gel cushion when in a chair", "correct": true, "rationale": "Gel, air, or foam cushions redistribute weight away from the ischial areas."}, {"text": "Massage reddened bony prominences", "correct": false, "rationale": "Massaging bony prominences can damage deep tissues."}, {"text": "Apply cornstarch to the skin after bathing", "correct": false, "rationale": "Powder and cornstarch are abrasive and can be aspirated."}, {"text": "Reposition the client every 3 hours while in bed", "correct": false, "rationale": "Every 3 hours is not frequent enough. Reposition at least every 2 hours."}]}, {"id": "w6ti-q12", "cat": "tissueintegrity", "type": "mc", "stem": "A client keeps sliding down in bed while in high-Fowler's position. The nurse identifies that this movement places the client at risk for injury from which force?", "options": [{"text": "Shear", "correct": true, "rationale": "Shear occurs when deeper tissues are pulled down by gravity while the skin stays in contact with the bed, as when sliding down in high-Fowler's."}, {"text": "Moisture", "correct": false, "rationale": "Moisture causes maceration, not tissue layers pulling in opposite directions."}, {"text": "Pressure alone", "correct": false, "rationale": "Pressure is force directed into tissue. Sliding on an incline produces shear."}, {"text": "Immobility", "correct": false, "rationale": "Immobility is a risk factor, not a mechanical force."}]}, {"id": "w6ti-q13", "cat": "tissueintegrity", "type": "mc", "stem": "A nurse is teaching staff about the Braden Scale. Which statement should the nurse include?", "options": [{"text": "A lower total score means the client has a higher risk for skin breakdown.", "correct": true, "rationale": "Braden scores range from 6 to 23. The lower the score, the greater the risk."}, {"text": "A higher total score means the client has a higher risk for skin breakdown.", "correct": false, "rationale": "This is reversed. Lower scores indicate greater risk."}, {"text": "The scale measures the size of an existing pressure injury.", "correct": false, "rationale": "The Braden Scale assesses risk; it does not measure wounds."}, {"text": "The scale includes pain, temperature, and blood pressure.", "correct": false, "rationale": "The six categories are sensory perception, moisture, activity, mobility, nutrition, and friction and shear."}]}, {"id": "w6ti-q14", "cat": "tissueintegrity", "type": "mc", "stem": "A nurse is assessing a client who has a dark skin tone for a stage 1 pressure injury. Which actions should the nurse take? Select all that apply.", "options": [{"text": "Palpate the area for warmth or coolness compared to surrounding skin", "correct": true, "rationale": "Temperature changes may be the first indicator in darker-pigmented skin."}, {"text": "Feel for hardened or boggy tissue", "correct": true, "rationale": "Changes in tissue consistency, such as induration, can indicate injury."}, {"text": "Look for an area darker than the adjacent skin", "correct": true, "rationale": "In dark skin, injury often appears as an area darker than the surrounding skin."}, {"text": "Ask the client about pain or changes in sensation", "correct": true, "rationale": "Localized pain and altered sensation are important indicators."}, {"text": "Rely on whether the area blanches when pressed", "correct": false, "rationale": "Nonblanchable erythema is difficult to detect in dark skin, so the nurse must also palpate and use other cues."}]}, {"id": "w6ti-q15", "cat": "tissueintegrity", "type": "mc", "stem": "A nurse is assessing a client who has a dark skin tone for cyanosis. Which areas should the nurse inspect? Select all that apply.", "options": [{"text": "Oral mucosa", "correct": true, "rationale": "Mucous membranes are reliable places to detect color changes in dark skin."}, {"text": "Conjunctiva", "correct": true, "rationale": "The conjunctiva is one of the areas to check for cyanosis."}, {"text": "Palms and soles", "correct": true, "rationale": "Palms and soles have lighter pigmentation, making color changes easier to see."}, {"text": "Nail beds", "correct": true, "rationale": "Nail beds are a reliable site to assess for cyanosis."}, {"text": "Skin over the upper back", "correct": false, "rationale": "Pigmented skin over the back makes cyanosis difficult to see."}]}, {"id": "w6ti-q16", "cat": "tissueintegrity", "type": "mc", "stem": "A nurse is performing integumentary assessments on a group of clients. Which finding is the nurse's priority?", "options": [{"text": "Cyanosis", "correct": true, "rationale": "Cyanosis indicates hypoxia. Using the ABC approach, impaired oxygenation is the priority."}, {"text": "Jaundice", "correct": false, "rationale": "Jaundice indicates liver dysfunction or RBC destruction but is not the priority over impaired oxygenation."}, {"text": "Erythema", "correct": false, "rationale": "Erythema indicates inflammation or vasodilation and is not the priority over oxygenation."}, {"text": "Ecchymosis", "correct": false, "rationale": "A bruise is not the priority over impaired oxygenation."}]}, {"id": "w6ti-q17", "cat": "tissueintegrity", "type": "mc", "stem": "A nurse presses over a client's medial malleolus and notes a 4 mm indentation that takes 12 seconds to rebound. How should the nurse document this finding?", "options": [{"text": "2+ pitting edema", "correct": true, "rationale": "2+ (mild) edema is a 4 mm pit with a 10- to 15-second skin response."}, {"text": "1+ pitting edema", "correct": false, "rationale": "1+ (trace) is a 2 mm pit with a rapid response."}, {"text": "3+ pitting edema", "correct": false, "rationale": "3+ (moderate) is a 6 mm pit with a prolonged response."}, {"text": "4+ pitting edema", "correct": false, "rationale": "4+ (severe) is an 8 mm pit with a prolonged response."}]}, {"id": "w6ti-q18", "cat": "tissueintegrity", "type": "dragdrop", "stem": "A nurse is teaching a class about skin lesions. Which are primary skin lesions? Move the correct lesions to the answer box.", "leftLabel": "Skin lesions", "rightLabel": "Primary lesions", "options": [{"text": "Macule", "correct": true, "rationale": "A macule is a flat color change arising from healthy skin, such as a freckle."}, {"text": "Vesicle", "correct": true, "rationale": "A vesicle is a serous fluid-filled elevation arising from healthy skin, such as a blister."}, {"text": "Pustule", "correct": true, "rationale": "A pustule is a pus-filled elevation arising from healthy skin, such as acne."}, {"text": "Nodule", "correct": true, "rationale": "A nodule is a firm, deep lesion arising from healthy skin, such as a wart."}, {"text": "Crust", "correct": false, "rationale": "A crust (scab) is a secondary lesion formed from dried blood, serum, or pus."}, {"text": "Erosion", "correct": false, "rationale": "An erosion, such as a ruptured vesicle, is a secondary lesion."}, {"text": "Fissure", "correct": false, "rationale": "A fissure, such as in tinea pedis, is a secondary lesion."}]}, {"id": "w6ti-q19", "cat": "tissueintegrity", "type": "mc", "stem": "A nurse is assessing an older adult client's skin. Which finding should the nurse report as unexpected?", "options": [{"text": "Petechiae on the forearms", "correct": true, "rationale": "Petechiae are not an expected aging change and may indicate illness."}, {"text": "Thin, translucent skin", "correct": false, "rationale": "Thinning skin is an expected change with aging."}, {"text": "Decreased skin elasticity", "correct": false, "rationale": "Loss of elasticity is an expected change with aging."}, {"text": "Wrinkles", "correct": false, "rationale": "Increased wrinkling is an expected change with aging."}]}, {"id": "w6ti-q20", "cat": "tissueintegrity", "type": "mc", "stem": "A nurse is assessing an open wound with a yellow wound bed. Using the RYB color code, which action should the nurse anticipate?", "options": [{"text": "Clean the wound", "correct": true, "rationale": "Yellow indicates slough or purulent drainage, so the wound needs to be cleaned."}, {"text": "Cover the wound to protect it", "correct": false, "rationale": "Covering is the action for a red, healthy granulating wound."}, {"text": "Debride necrotic tissue", "correct": false, "rationale": "Debridement is the action for a black wound with eschar."}, {"text": "Leave the wound open to air", "correct": false, "rationale": "This is not part of the RYB code."}]}, {"id": "w6ti-q21", "cat": "tissueintegrity", "type": "mc", "stem": "A nurse notes thin, watery, pale pink drainage on a client's surgical dressing. How should the nurse document this drainage?", "options": [{"text": "Serosanguineous", "correct": true, "rationale": "Serosanguineous drainage contains serum and blood and appears watery and pale pink."}, {"text": "Serous", "correct": false, "rationale": "Serous drainage is clear or slightly yellow."}, {"text": "Sanguineous", "correct": false, "rationale": "Sanguineous drainage is thicker and reddish because it contains red blood cells."}, {"text": "Purulent", "correct": false, "rationale": "Purulent drainage is thick and yellow, tan, green, or brown."}]}, {"id": "w6ti-q22", "cat": "tissueintegrity", "type": "mc", "stem": "A nurse finds thick, green, foul-smelling drainage on a client's wound dressing. Which action should the nurse take?", "options": [{"text": "Report the finding to the provider", "correct": true, "rationale": "Purulent drainage indicates infection and should be reported to the provider."}, {"text": "Document it as an expected finding", "correct": false, "rationale": "Purulent drainage is not expected; it indicates infection."}, {"text": "Apply a transparent film dressing", "correct": false, "rationale": "Films are for superficial wounds with minimal exudate and do not address infection."}, {"text": "Continue to monitor at the next dressing change", "correct": false, "rationale": "Signs of infection need to be reported, not just monitored."}]}, {"id": "w6ti-q23", "cat": "tissueintegrity", "type": "mc", "stem": "A nurse is documenting the location of tunneling in a client's sacral wound using the clock method. Which statement about this method is accurate?", "options": [{"text": "12:00 points toward the client's head.", "correct": true, "rationale": "With the clock method, 12:00 is toward the head and 6:00 is toward the feet."}, {"text": "12:00 points toward the client's feet.", "correct": false, "rationale": "6:00 points toward the feet; 12:00 points toward the head."}, {"text": "12:00 is always the deepest part of the wound.", "correct": false, "rationale": "Clock positions describe location relative to the body, not depth."}, {"text": "The clock method replaces measuring length and width.", "correct": false, "rationale": "Length, width, and depth are still measured in centimeters."}]}, {"id": "w6ti-q24", "cat": "tissueintegrity", "type": "mc", "stem": "A nurse is assessing a client's sutured abdominal incision on postoperative day 8. Which finding is expected?", "options": [{"text": "Bright pink incision line with well-approximated edges", "correct": true, "rationale": "Incisions are red on days 1 to 4, bright pink on days 5 to 14, and pale pink from day 15 to 1 year."}, {"text": "Edema and drainage increasing since day 5", "correct": false, "rationale": "Edema and exudate should progressively decrease and resolve by postoperative day 5."}, {"text": "Separated wound edges with serosanguineous drainage", "correct": false, "rationale": "Separated edges suggest dehiscence, which is a complication."}, {"text": "Purulent drainage at the suture line", "correct": false, "rationale": "Purulent drainage indicates infection."}]}, {"id": "w6ti-q25", "cat": "tissueintegrity", "type": "mc", "stem": "A client has a surgical wound with a Penrose drain. Which statement about this drain is accurate?", "options": [{"text": "It is an open, passive drain, and drainage collects on gauze placed around it.", "correct": true, "rationale": "A Penrose drain uses gravity and has no collection chamber, so a gauze dressing around it absorbs the drainage."}, {"text": "It uses negative pressure from a compressed bulb.", "correct": false, "rationale": "Negative pressure from a bulb describes an active bulb suction drain."}, {"text": "Drainage collects in a closed bottle that is changed when half full.", "correct": false, "rationale": "This describes a large bottle drain, which is a closed system."}, {"text": "It is a closed system that is less likely to become contaminated.", "correct": false, "rationale": "A Penrose drain is open. Closed drains are less likely to become contaminated."}]}, {"id": "w6ti-q26", "cat": "tissueintegrity", "type": "dragdrop", "stem": "A nurse is caring for a client who has a surgical wound drain. Which findings should the nurse report to the provider? Move the correct findings to the answer box.", "leftLabel": "Findings", "rightLabel": "Report to the provider", "options": [{"text": "A sudden, significant increase in drainage", "correct": true, "rationale": "A significant increase or decrease in drainage should be reported."}, {"text": "Blood clots in the drainage", "correct": true, "rationale": "Clots should be reported to the provider."}, {"text": "The drain was accidentally pulled out", "correct": true, "rationale": "Accidental drain removal should be reported to the provider."}, {"text": "Purulent drainage and redness at the insertion site", "correct": true, "rationale": "Manifestations of infection should be reported."}, {"text": "Drainage changing from sanguineous to serosanguineous", "correct": false, "rationale": "This is the expected progression as the wound heals."}, {"text": "Mild tenderness at the site on the first postoperative day", "correct": false, "rationale": "Some tenderness and edema are expected for the first several days."}, {"text": "The bulb is half full", "correct": false, "rationale": "The nurse empties the bulb when it is more than half full; this does not need to be reported."}]}, {"id": "w6ti-q27", "cat": "tissueintegrity", "type": "mc", "stem": "A nurse has just emptied a client's bulb suction drain. Which action should the nurse take next?", "options": [{"text": "Squeeze the bulb flat and replace the plug", "correct": true, "rationale": "Recompressing the bulb before plugging the port reestablishes suction in the wound."}, {"text": "Replace the plug, then let the bulb expand fully", "correct": false, "rationale": "An expanded bulb has no suction. It must be compressed before replacing the plug."}, {"text": "Leave the plug open so the drain can air out", "correct": false, "rationale": "Leaving the port open breaks the closed system and suction."}, {"text": "Wait until the next shift to document the output", "correct": false, "rationale": "The nurse should document the date, time, color, and volume right after emptying."}]}, {"id": "w6ti-q28", "cat": "tissueintegrity", "type": "mc", "stem": "A nurse is selecting a dressing for a wound with a large amount of exudate. Which dressing is most appropriate?", "options": [{"text": "Alginate", "correct": true, "rationale": "Alginates are highly absorbent and recommended for moderate to highly exudative wounds."}, {"text": "Transparent film", "correct": false, "rationale": "Films absorb very little and are for superficial wounds with minimal exudate. Heavy drainage can leak and cause maceration."}, {"text": "Hydrogel", "correct": false, "rationale": "Hydrogels add moisture and are for dry wounds, not heavily draining ones."}, {"text": "Dry gauze only", "correct": false, "rationale": "Gauze absorbs some exudate but is not the best choice for heavy drainage."}]}, {"id": "w6ti-q29", "cat": "tissueintegrity", "type": "mc", "stem": "A nurse removes a hydrocolloid dressing and finds a yellow, gelatinous film with an odor on its underside. The wound edges are not red. Which action should the nurse take?", "options": [{"text": "Recognize this as an expected finding with hydrocolloid dressings", "correct": true, "rationale": "A foul-smelling yellow gel forms as bacteria are trapped under the dressing. The nurse should tell this apart from purulent drainage."}, {"text": "Report purulent drainage to the provider", "correct": false, "rationale": "This film is expected with hydrocolloids and is not, by itself, a sign of infection."}, {"text": "Switch to a transparent film dressing", "correct": false, "rationale": "There is no indication to change the dressing type."}, {"text": "Obtain a wound culture", "correct": false, "rationale": "There are no signs of infection to justify a culture."}]}, {"id": "w6ti-q30", "cat": "tissueintegrity", "type": "mc", "stem": "A client who was admitted for pneumonia has limited mobility and intact skin. Which dressing should the nurse plan to apply to help prevent a pressure injury?", "options": [{"text": "Foam dressing on the sacrum", "correct": true, "rationale": "A silicone foam dressing on the sacrum or heels within 24 hours of admission helps prevent hospital-acquired pressure injuries."}, {"text": "Alginate dressing on the sacrum", "correct": false, "rationale": "Alginates are for moderate to heavy exudate, not for prevention on intact skin."}, {"text": "Wet-to-dry dressing on the heels", "correct": false, "rationale": "Wet-to-dry dressings are used for debridement of open wounds."}, {"text": "Hydrogel on the sacrum", "correct": false, "rationale": "Hydrogels are used to add moisture to dry or necrotic wounds."}]}, {"id": "w6ti-q31", "cat": "tissueintegrity", "type": "mc", "stem": "A nurse is preparing to irrigate a client's wound. Which action is appropriate?", "options": [{"text": "Use a 30 to 60 mL syringe with a 19-gauge needle, held 1 inch above the wound", "correct": true, "rationale": "This setup provides about 8 psi, within the recommended 5 to 8 psi, from 2.5 cm (1 inch) above the wound."}, {"text": "Use hydrogen peroxide as the irrigation solution", "correct": false, "rationale": "Cytotoxic cleansers such as hydrogen peroxide damage tissue. Normal saline is typically used."}, {"text": "Touch the syringe tip to the wound bed", "correct": false, "rationale": "The tip is held above the wound to avoid contamination and trauma."}, {"text": "Stop after one flush regardless of the return", "correct": false, "rationale": "Irrigation is repeated until the solution flowing out of the wound is clear."}]}, {"id": "w6ti-q32", "cat": "tissueintegrity", "type": "mc", "stem": "A nurse is reviewing wound healing with newly licensed nurses. Which wound will heal by secondary intention?", "options": [{"text": "An open burn area", "correct": true, "rationale": "Wounds with tissue loss and widely separated edges, such as open burns and pressure injuries, are left open and heal by secondary intention."}, {"text": "A sutured surgical incision", "correct": false, "rationale": "Closed, approximated incisions heal by primary intention."}, {"text": "A laceration sealed with skin adhesive", "correct": false, "rationale": "Lacerations closed with adhesive heal by primary intention."}, {"text": "An abdominal wound left open until infection resolves, then sutured", "correct": false, "rationale": "A wound closed after a delay heals by tertiary intention (delayed primary closure)."}]}, {"id": "w6ti-q33", "cat": "tissueintegrity", "type": "dragdrop", "stem": "Which wounds heal by primary intention? Move the correct wounds to the answer box.", "leftLabel": "Wounds", "rightLabel": "Primary intention", "options": [{"text": "Sutured surgical incision", "correct": true, "rationale": "Clean incisions closed with sutures heal by primary intention."}, {"text": "Stapled surgical incision", "correct": true, "rationale": "Clean incisions closed with staples have approximated edges and heal by primary intention."}, {"text": "Clean laceration closed with skin adhesive", "correct": true, "rationale": "Clean lacerations closed with adhesive heal by primary intention."}, {"text": "Stage 3 pressure injury", "correct": false, "rationale": "Open pressure injuries have tissue loss and heal by secondary intention."}, {"text": "Open burn area", "correct": false, "rationale": "Open burns heal by secondary intention."}, {"text": "Abdominal wound sutured after being left open 7 days", "correct": false, "rationale": "Wounds closed after being left open heal by tertiary intention."}]}, {"id": "w6ti-q34", "cat": "tissueintegrity", "type": "mc", "stem": "A client's abdominal wound was left open for 7 days until an infection resolved and was then closed with sutures. Which type of wound healing does this describe?", "options": [{"text": "Tertiary intention", "correct": true, "rationale": "Tertiary intention (delayed primary closure) combines secondary and primary healing: the wound is left open 5 to 10 days, then closed."}, {"text": "Primary intention", "correct": false, "rationale": "Primary intention wounds are closed right away."}, {"text": "Secondary intention", "correct": false, "rationale": "Secondary intention wounds are left open to heal completely by granulation, not closed later."}, {"text": "Remodeling", "correct": false, "rationale": "Remodeling is a phase of wound healing, not a type of closure."}]}, {"id": "w6ti-q35", "cat": "tissueintegrity", "type": "mc", "stem": "A nurse observes red, granular tissue filling a client's wound 10 days after injury. Which phase of wound healing is the client in?", "options": [{"text": "Proliferative", "correct": true, "rationale": "The proliferative phase lasts from about day 3 to day 24. Granulation tissue and collagen form, and the edges begin to contract."}, {"text": "Inflammatory", "correct": false, "rationale": "The inflammatory (hemostatic) phase lasts 3 to 6 days and focuses on stopping bleeding and cleaning the wound."}, {"text": "Remodeling", "correct": false, "rationale": "Remodeling begins around day 21, when collagen is replaced with stronger collagen."}, {"text": "Hemostasis only", "correct": false, "rationale": "Hemostasis occurs right after injury, at the start of the inflammatory phase."}]}, {"id": "w6ti-q36", "cat": "tissueintegrity", "type": "dragdrop", "stem": "A nurse is caring for several postoperative clients. Which factors place a client at risk for delayed wound healing? Move the correct factors to the answer box.", "leftLabel": "Client factors", "rightLabel": "Delays wound healing", "options": [{"text": "Type 2 diabetes mellitus", "correct": true, "rationale": "Diabetes decreases peripheral perfusion and impairs sensation."}, {"text": "Long-term systemic corticosteroid use", "correct": true, "rationale": "Corticosteroids prevent the formation of collagen and fibroblasts."}, {"text": "Albumin 3.0 g/dL", "correct": true, "rationale": "Albumin below 3.5 g/dL reflects inadequate protein, which delays healing."}, {"text": "Smoking one pack per day", "correct": true, "rationale": "Smoking impairs oxygenation and clotting."}, {"text": "Two other open wounds", "correct": true, "rationale": "Multiple wounds compete for the nutrients needed to heal."}, {"text": "Follows a high-protein diet", "correct": false, "rationale": "Protein supports wound healing."}, {"text": "Hemoglobin 14 g/dL", "correct": false, "rationale": "This is not low. Low hemoglobin would impair oxygen delivery to the wound."}]}, {"id": "w6ti-q37", "cat": "tissueintegrity", "type": "mc", "stem": "A nurse is reviewing lab results for a client who has a pressure injury. Which finding increases the client's risk for delayed wound healing?", "options": [{"text": "Albumin 3.1 g/dL", "correct": true, "rationale": "Albumin below 3.5 g/dL indicates a protein deficit, increasing the risk of delayed healing and infection."}, {"text": "WBC 7,500/mm\u00b3", "correct": false, "rationale": "This is within the expected range of 5,000 to 10,000/mm\u00b3."}, {"text": "Hemoglobin 14 g/dL", "correct": false, "rationale": "This is not low. Adequate hemoglobin delivers oxygen to healing tissue."}, {"text": "Capillary glucose 98", "correct": false, "rationale": "This is within the expected range of 74 to 106."}]}, {"id": "w6ti-q38", "cat": "tissueintegrity", "type": "mc", "stem": "A client who had abdominal surgery 24 hours ago reports a pulling sensation in the incision. The nurse finds the wound separated with viscera protruding. Which actions should the nurse take? Select all that apply.", "options": [{"text": "Cover the area with sterile, saline-soaked dressings", "correct": true, "rationale": "Moist sterile dressings keep exposed organs from drying and decrease contamination."}, {"text": "Position the client supine with the hips and knees bent", "correct": true, "rationale": "This position minimizes pressure on the abdomen."}, {"text": "Stay with the client and call for help", "correct": true, "rationale": "Evisceration is an emergency. The nurse stays with the client and gets help so the provider is notified immediately."}, {"text": "Keep the client NPO", "correct": true, "rationale": "The client will likely return to surgery."}, {"text": "Gently push the organs back into the abdomen", "correct": false, "rationale": "The nurse should never try to reinsert organs; doing so risks trauma and perforation."}, {"text": "Apply an abdominal binder snugly", "correct": false, "rationale": "A binder can help prevent, not treat, evisceration."}, {"text": "Offer a warm drink to help the client relax", "correct": false, "rationale": "The client should be kept NPO in preparation for surgery."}]}, {"id": "w6ti-q39", "cat": "tissueintegrity", "type": "mc", "stem": "On postoperative day 6, a client's dressing shows a sudden increase in serosanguineous drainage. The client says they felt something \"give way\" while coughing. The nurse suspects which complication?", "options": [{"text": "Dehiscence", "correct": true, "rationale": "Dehiscence usually occurs 5 to 8 days after surgery and is often preceded by increased serosanguineous drainage and a popping or giving-way feeling with straining."}, {"text": "Hematoma", "correct": false, "rationale": "A hematoma is a localized collection of blood that looks like a red or blue bruise."}, {"text": "Wound infection", "correct": false, "rationale": "Infection presents with purulent drainage, redness, warmth, and fever."}, {"text": "Expected healing", "correct": false, "rationale": "Exudate should decrease and resolve by postoperative day 5, not suddenly increase."}]}, {"id": "w6ti-q40", "cat": "tissueintegrity", "type": "mc", "stem": "A nurse is monitoring a client who had surgery this morning. During which time frame is the client at greatest risk for hemorrhage?", "options": [{"text": "24 to 48 hours after surgery", "correct": true, "rationale": "The risk of hemorrhage is greatest 24 to 48 hours after injury or surgery."}, {"text": "5 to 8 days after surgery", "correct": false, "rationale": "This is the usual time frame for dehiscence."}, {"text": "2 to 11 days after surgery", "correct": false, "rationale": "This is the usual time frame for wound infection to appear."}, {"text": "After the sutures are removed", "correct": false, "rationale": "Hemorrhage risk is highest in the first 24 to 48 hours."}]}, {"id": "w7ih-q01", "cat": "integheentneuro", "type": "mc", "stem": "A nurse is performing an integumentary assessment on a group of clients. Which finding is the nurse's priority?", "options": [{"text": "Pallor of the conjunctivae", "correct": false, "rationale": "Pallor can reflect anemia or decreased blood flow and needs follow-up, but it does not point to an immediate airway or breathing problem."}, {"text": "Yellow sclera", "correct": false, "rationale": "Jaundice suggests liver dysfunction or RBC destruction. It matters, but it is not an immediate threat to oxygenation."}, {"text": "Bluish discoloration of the lips and nail beds", "correct": true, "rationale": "Cyanosis indicates hypoxia. Using the ABCs, impaired oxygenation is the priority finding."}, {"text": "Redness over the sacrum", "correct": false, "rationale": "Erythema signals inflammation or pressure and needs assessment, but it is lower priority than a sign of hypoxia."}]}, {"id": "w7ih-q02", "cat": "integheentneuro", "type": "mc", "stem": "A nurse is assessing a client's skin temperature. Which technique should the nurse use?", "options": [{"text": "Palpate with the fingertips", "correct": false, "rationale": "Fingertips are used to assess texture and moisture, not temperature."}, {"text": "Palpate with the palm of the hand", "correct": false, "rationale": "The palm is less sensitive to temperature changes than the back of the hand."}, {"text": "Palpate with the dorsal surface of the hand", "correct": true, "rationale": "The dorsal (back) surface of the hand is the most sensitive to temperature, so it is the only part used to assess skin temperature."}, {"text": "Use a tympanic thermometer on the area", "correct": false, "rationale": "A thermometer measures core body temperature, not localized skin temperature."}]}, {"id": "w7ih-q03", "cat": "integheentneuro", "type": "sata", "stem": "A nurse notes edema in a client's left lower leg only. Which conditions should the nurse recognize as possible causes of unilateral edema? Select all that apply.", "options": [{"text": "Deep vein thrombosis", "correct": true, "rationale": "Unilateral edema can indicate a DVT; measure the limb and look for erythema and tenderness."}, {"text": "Inflammation", "correct": true, "rationale": "Localized inflammation can cause swelling on one side."}, {"text": "Lymphedema", "correct": true, "rationale": "Impaired lymph drainage on one side causes unilateral edema."}, {"text": "Fluid volume excess", "correct": false, "rationale": "Fluid volume excess causes bilateral edema, not edema on one side."}, {"text": "Venous insufficiency", "correct": false, "rationale": "Venous insufficiency generally causes bilateral edema."}]}, {"id": "w7ih-q04", "cat": "integheentneuro", "type": "mc", "stem": "A nurse presses over a client's medial malleolus for 5 seconds and finds a 4 mm indentation that rebounds in about 12 seconds. How should the nurse document this finding?", "options": [{"text": "1+ edema", "correct": false, "rationale": "1+ edema is trace, about 2 mm, with a rapid skin response."}, {"text": "2+ edema", "correct": true, "rationale": "2+ edema is mild, about 4 mm, with a 10\u201315 second response."}, {"text": "3+ edema", "correct": false, "rationale": "3+ edema is moderate, about 6 mm, with a prolonged response."}, {"text": "4+ edema", "correct": false, "rationale": "4+ edema is severe, about 8 mm, with a prolonged response."}]}, {"id": "w7ih-q05", "cat": "integheentneuro", "type": "dragdrop", "stem": "A nurse is teaching a class about skin lesions. Drag the lesions that are primary lesions (arising from healthy skin) into the answer box.", "leftLabel": "Skin lesions", "rightLabel": "Primary lesions", "options": [{"text": "Macule", "correct": true, "rationale": "A macule is a flat color change that arises from healthy skin, making it a primary lesion."}, {"text": "Vesicle", "correct": true, "rationale": "A vesicle is a serous fluid-filled elevation arising from healthy skin; it is a primary lesion."}, {"text": "Pustule", "correct": true, "rationale": "A pustule is a pus-filled lesion arising from healthy skin; it is a primary lesion."}, {"text": "Wheal", "correct": true, "rationale": "A wheal (such as an insect bite) is an edematous primary lesion."}, {"text": "Nodule", "correct": true, "rationale": "A nodule (such as a wart) is a firm, deep primary lesion."}, {"text": "Crust", "correct": false, "rationale": "A crust (scab) is dried blood, serum, or pus from a previous lesion; it is a secondary lesion."}, {"text": "Scale", "correct": false, "rationale": "Scale is flaking skin that develops from a change in a primary lesion; it is secondary."}, {"text": "Erosion", "correct": false, "rationale": "An erosion (such as a ruptured vesicle) results from a change in a primary lesion; it is secondary."}, {"text": "Ulcer", "correct": false, "rationale": "An ulcer is loss of epidermis and dermis; it is a secondary lesion."}]}, {"id": "w7ih-q06", "cat": "integheentneuro", "type": "mc", "stem": "A nurse pinches a skin fold over a client's sternum and it stays raised for several seconds. Which condition does this finding indicate?", "options": [{"text": "Fluid volume excess", "correct": false, "rationale": "Fluid volume excess causes edema, not delayed skin recoil."}, {"text": "Dehydration", "correct": true, "rationale": "Tenting, a skin fold that stays raised, indicates poor turgor from dehydration and increases the risk of skin breakdown."}, {"text": "Expected finding", "correct": false, "rationale": "Well-hydrated skin returns to its original position within a few seconds."}, {"text": "Arterial insufficiency", "correct": false, "rationale": "Arterial insufficiency causes shiny, hairless skin, not tenting."}]}, {"id": "w7ih-q07", "cat": "integheentneuro", "type": "mc", "stem": "A nurse observes that a client's nail angle is greater than 160\u00b0. Which condition should the nurse suspect?", "options": [{"text": "Fungal infection", "correct": false, "rationale": "Fungal infection causes thick, yellow nails with ragged edges, not an increased nail angle."}, {"text": "Anemia", "correct": false, "rationale": "Anemia can cause pale nail beds but does not change the nail angle."}, {"text": "Chronic low oxygen saturation", "correct": true, "rationale": "A nail angle over 160\u00b0 is clubbing, which results from chronic low oxygen saturation related to heart or lung disease."}, {"text": "Dehydration", "correct": false, "rationale": "Dehydration affects skin turgor and mucous membranes, not the nail angle."}]}, {"id": "w7ih-q08", "cat": "integheentneuro", "type": "mc", "stem": "A nurse is assessing a mole using the ABCDE system. Which finding should the nurse report?", "options": [{"text": "Symmetric round shape", "correct": false, "rationale": "Asymmetry, not symmetry, is the warning sign."}, {"text": "Smooth, even border", "correct": false, "rationale": "Border irregularity, not a smooth border, is the warning sign."}, {"text": "Diameter of 8 mm", "correct": true, "rationale": "A diameter greater than 6 mm is a warning sign for skin cancer."}, {"text": "Uniform brown color", "correct": false, "rationale": "Color variation within one lesion is the warning sign; uniform color is expected."}]}, {"id": "w7ih-q09", "cat": "integheentneuro", "type": "mc", "stem": "A nurse presses on a reddened area over a client's coccyx and the redness does not fade. How should the nurse interpret this finding?", "options": [{"text": "Expected finding after bed rest", "correct": false, "rationale": "Redness that does not blanch is never expected; normal skin blanches with pressure."}, {"text": "The skin has been damaged by pressure", "correct": true, "rationale": "Nonblanchable erythema indicates the skin has been damaged by pressure."}, {"text": "The client is dehydrated", "correct": false, "rationale": "Dehydration is assessed with skin turgor, not blanching."}, {"text": "The client has jaundice", "correct": false, "rationale": "Jaundice is a yellow-orange color change, not redness."}]}, {"id": "w7ih-q10", "cat": "integheentneuro", "type": "sata", "stem": "A nurse is preparing to assess skin turgor in an adult client. Which sites can the nurse use? Select all that apply.", "options": [{"text": "Clavicle", "correct": true, "rationale": "Pinching a skin fold over the clavicle is an accepted turgor site."}, {"text": "Sternum", "correct": true, "rationale": "The sternum is an accepted turgor site."}, {"text": "Back of the hand", "correct": true, "rationale": "The back of the hand is an accepted turgor site."}, {"text": "Earlobe", "correct": false, "rationale": "The earlobe is not used to assess turgor."}, {"text": "Palm of the hand", "correct": false, "rationale": "The palm has thick skin and is not used to assess turgor."}]}, {"id": "w7ih-q11", "cat": "integheentneuro", "type": "mc", "stem": "A nurse is examining a client's thyroid gland. Which action should the nurse take?", "options": [{"text": "Palpate both lobes at the same time with firm pressure", "correct": false, "rationale": "The thyroid is palpated gently on both sides of the trachea; firm pressure is not used."}, {"text": "Have the client take a sip of water while palpating the gland", "correct": true, "rationale": "When the client swallows, the thyroid should move up with the trachea, which helps the nurse feel it."}, {"text": "Expect the thyroid to be visible on inspection", "correct": false, "rationale": "An average-size thyroid is not visible; visibility could indicate a thyroid disorder."}, {"text": "Auscultate with the diaphragm over a normal-size gland", "correct": false, "rationale": "Auscultation is done only if the thyroid is enlarged, and it uses the bell, not the diaphragm."}]}, {"id": "w7ih-q12", "cat": "integheentneuro", "type": "mc", "stem": "A nurse auscultates a bruit over a client's enlarged thyroid gland. Which condition does this finding suggest?", "options": [{"text": "Hypothyroidism", "correct": false, "rationale": "A bruit reflects increased blood flow, which is not typical of hypothyroidism."}, {"text": "Hyperthyroidism", "correct": true, "rationale": "A bruit indicates increased blood flow to the gland, possibly from hyperthyroidism."}, {"text": "Tracheal deviation", "correct": false, "rationale": "Tracheal deviation is found by palpating the trachea, not by hearing a bruit."}, {"text": "Lymph node enlargement", "correct": false, "rationale": "Enlarged lymph nodes are found by palpation, not auscultation."}]}, {"id": "w7ih-q13", "cat": "integheentneuro", "type": "dragdrop", "stem": "A nurse is performing an eye examination on an adult client. Drag the findings that are expected into the answer box.", "leftLabel": "Eye findings", "rightLabel": "Expected findings", "options": [{"text": "Pupils equal, round, and reactive to light and accommodation", "correct": true, "rationale": "PERRLA is the expected pupil finding."}, {"text": "Bulbar conjunctiva transparent", "correct": true, "rationale": "The bulbar conjunctiva is expected to be transparent; the palpebral conjunctiva is pink."}, {"text": "Eyelashes curve outward", "correct": true, "rationale": "Lashes curving outward from the lids is expected."}, {"text": "Artery-to-vein ratio of 2:3 with no nicking", "correct": true, "rationale": "A 2:3 artery-to-vein ratio without nicking is expected on the internal eye exam."}, {"text": "Symmetric red reflex", "correct": true, "rationale": "A red-tinted fundus seen in both eyes is expected."}, {"text": "Upper eyelid covering the pupil", "correct": false, "rationale": "An upper lid covering the pupil is ptosis, which is unexpected."}, {"text": "Asymmetric corneal light reflex", "correct": false, "rationale": "The light reflection should be symmetric on both corneas."}, {"text": "Partially illuminated iris", "correct": false, "rationale": "A partially illuminated iris indicates glaucoma."}, {"text": "Absent red reflex in one eye", "correct": false, "rationale": "An absent or asymmetric red reflex is unexpected."}]}, {"id": "w7ih-q14", "cat": "integheentneuro", "type": "mc", "stem": "A client asks what a visual acuity of 20/30 means. Which response by the nurse is correct?", "options": [{"text": "\"Your eyes see at 20 feet what visually unimpaired eyes see at 30 feet.\"", "correct": true, "rationale": "The first number is the distance from the chart; the second is the distance at which an unimpaired eye sees the same line."}, {"text": "\"Your eyes see at 30 feet what visually unimpaired eyes see at 20 feet.\"", "correct": false, "rationale": "This reverses the numbers. The first number is always the client's distance from the chart."}, {"text": "\"Your right eye sees clearly at 20 feet and your left eye at 30 feet.\"", "correct": false, "rationale": "Each eye has its own two-number result; the numbers are not one per eye."}, {"text": "\"You can read 20 of the 30 letters on the chart.\"", "correct": false, "rationale": "The numbers are distances in feet, not a count of letters."}]}, {"id": "w7ih-q15", "cat": "integheentneuro", "type": "mc", "stem": "A nurse is screening an adult client for presbyopia. How far from the client's face should the nurse hold the Rosenbaum chart?", "options": [{"text": "6 inches", "correct": false, "rationale": "The Rosenbaum chart is held 14 inches (35.5 cm) away; 6 inches is too close."}, {"text": "14 inches", "correct": true, "rationale": "The Rosenbaum chart is held 14 inches (35.5 cm) from the face to screen near vision."}, {"text": "2 feet", "correct": false, "rationale": "Two feet is the distance used for the visual fields test."}, {"text": "20 feet", "correct": false, "rationale": "Twenty feet is the distance used for the Snellen chart (distance vision)."}]}, {"id": "w7ih-q16", "cat": "integheentneuro", "type": "mc", "stem": "A nurse is preparing to inspect an adult client's ear canal with an otoscope. Which action should the nurse take?", "options": [{"text": "Pull the auricle down and back", "correct": false, "rationale": "Down and back is used for young children, not adults."}, {"text": "Pull the auricle up and back", "correct": true, "rationale": "Pulling the auricle up and back straightens an adult's ear canal."}, {"text": "Insert the speculum 2 to 2.5 cm into the canal", "correct": false, "rationale": "The speculum is inserted only 1 to 1.5 cm."}, {"text": "Rest the speculum against the canal wall to steady it", "correct": false, "rationale": "The canal is sensitive; the speculum should not touch it."}]}, {"id": "w7ih-q17", "cat": "integheentneuro", "type": "mc", "stem": "Which tympanic membrane finding should the nurse document as expected?", "options": [{"text": "Red and bulging", "correct": false, "rationale": "A red, bulging membrane with an obliterated cone of light suggests a middle ear infection."}, {"text": "Pearly gray with a cone of light", "correct": true, "rationale": "An intact, pearly gray membrane with a cone-shaped light reflex is expected."}, {"text": "Yellow with a visible perforation", "correct": false, "rationale": "A perforation (tear) is unexpected."}, {"text": "Dull with no visible landmarks", "correct": false, "rationale": "The umbo and manubrium are expected to be visible."}]}, {"id": "w7ih-q18", "cat": "integheentneuro", "type": "mc", "stem": "A nurse performs a Rinne test. Which result is expected?", "options": [{"text": "Bone conduction lasts twice as long as air conduction", "correct": false, "rationale": "This reverses the expected finding."}, {"text": "Air conduction lasts twice as long as bone conduction", "correct": true, "rationale": "The expected Rinne result is AC > BC in a 2:1 ratio."}, {"text": "Sound is heard equally in both ears", "correct": false, "rationale": "Equal sound in both ears is the expected Weber result, not the Rinne result."}, {"text": "Sound lateralizes to the better ear", "correct": false, "rationale": "Lateralization is assessed with the Weber test."}]}, {"id": "w7ih-q19", "cat": "integheentneuro", "type": "mc", "stem": "During a Weber test, a client hears the sound best in the left ear. The client reports hearing loss in the left ear. Which type of hearing loss does this finding suggest?", "options": [{"text": "Conductive hearing loss", "correct": true, "rationale": "With conductive loss, sound is heard best in the impaired ear."}, {"text": "Sensorineural hearing loss", "correct": false, "rationale": "With sensorineural loss, sound is heard best in the unaffected ear."}, {"text": "Presbycusis", "correct": false, "rationale": "Presbycusis is age-related high-frequency loss; the Weber result alone doesn't identify it."}, {"text": "No hearing loss", "correct": false, "rationale": "Without hearing loss, sound is heard equally in both ears."}]}, {"id": "w7ih-q20", "cat": "integheentneuro", "type": "mc", "stem": "An older adult client cannot repeat words during the whisper test. Which action should the nurse take before documenting impaired hearing?", "options": [{"text": "Repeat the test with the client facing the nurse", "correct": false, "rationale": "The client should not see the nurse's mouth during the whisper test."}, {"text": "Perform the Weber test only", "correct": false, "rationale": "Further testing may help, but cerumen should be ruled out first."}, {"text": "Inspect the ear canal with an otoscope", "correct": true, "rationale": "Cerumen impaction is a common cause of impaired hearing in older adults; check the canal before documenting hearing loss."}, {"text": "Refer the client for hearing aids", "correct": false, "rationale": "Referral comes after the cause is identified."}]}, {"id": "w7ih-q21", "cat": "integheentneuro", "type": "mc", "stem": "A nurse observes that a client's tonsils are touching the uvula. How should the nurse grade the tonsils?", "options": [{"text": "+1", "correct": false, "rationale": "+1 tonsils are barely visible."}, {"text": "+2", "correct": false, "rationale": "+2 tonsils extend halfway to the uvula."}, {"text": "+3", "correct": true, "rationale": "+3 tonsils are touching the uvula."}, {"text": "+4", "correct": false, "rationale": "+4 tonsils are touching each other."}]}, {"id": "w7ih-q22", "cat": "integheentneuro", "type": "sata", "stem": "A nurse is preparing to examine a client's ears, nose, mouth, and throat. Which equipment does the nurse need? Select all that apply.", "options": [{"text": "Otoscope", "correct": true, "rationale": "An otoscope is used to examine the ear canal and tympanic membrane."}, {"text": "Tuning fork", "correct": true, "rationale": "A tuning fork is used for the Rinne and Weber tests."}, {"text": "Tongue blade", "correct": true, "rationale": "A tongue blade is used to view the throat and test the gag reflex."}, {"text": "Gauze square", "correct": true, "rationale": "A gauze square is used to hold the tip of the tongue during the exam."}, {"text": "Ophthalmoscope", "correct": false, "rationale": "An ophthalmoscope is used for the internal eye exam, not the ears, nose, mouth, and throat."}, {"text": "Reflex hammer", "correct": false, "rationale": "A reflex hammer is used for deep tendon reflexes in the neurologic exam."}]}, {"id": "w7ih-q23", "cat": "integheentneuro", "type": "sata", "stem": "A nurse is performing a head and neck examination on an older adult client. Which age-related findings should the nurse expect? Select all that apply.", "options": [{"text": "Arcus senilis", "correct": true, "rationale": "A thin gray-white ring around the cornea is an expected age-related change."}, {"text": "Intolerance to glare", "correct": true, "rationale": "Older adults often become intolerant of glare and have trouble distinguishing colors."}, {"text": "Thickened tympanic membranes", "correct": true, "rationale": "The tympanic membranes thicken with age, and cerumen tends to accumulate."}, {"text": "Reddened gums", "correct": false, "rationale": "Gums become pale, not red, with aging."}, {"text": "Lowered vocal pitch", "correct": false, "rationale": "Vocal pitch rises with aging."}, {"text": "Increased sense of smell", "correct": false, "rationale": "The sense of smell decreases with aging."}]}, {"id": "w7ih-q24", "cat": "integheentneuro", "type": "dragdrop", "stem": "A nurse is reviewing cranial nerve function. Drag the cranial nerves that have only sensory function into the answer box.", "leftLabel": "Cranial nerves", "rightLabel": "Sensory only", "options": [{"text": "CN I (Olfactory)", "correct": true, "rationale": "The olfactory nerve is sensory only (smell)."}, {"text": "CN II (Optic)", "correct": true, "rationale": "The optic nerve is sensory only (visual acuity and fields)."}, {"text": "CN VIII (Auditory)", "correct": true, "rationale": "The auditory nerve is sensory only (hearing and balance)."}, {"text": "CN III (Oculomotor)", "correct": false, "rationale": "The oculomotor nerve is motor only."}, {"text": "CN V (Trigeminal)", "correct": false, "rationale": "The trigeminal nerve is both sensory and motor."}, {"text": "CN VII (Facial)", "correct": false, "rationale": "The facial nerve is both sensory and motor."}, {"text": "CN XI (Spinal accessory)", "correct": false, "rationale": "The spinal accessory nerve is motor only."}, {"text": "CN XII (Hypoglossal)", "correct": false, "rationale": "The hypoglossal nerve is motor only."}]}, {"id": "w7ih-q25", "cat": "integheentneuro", "type": "dragdrop", "stem": "Drag the cranial nerves that have only motor function into the answer box.", "leftLabel": "Cranial nerves", "rightLabel": "Motor only", "options": [{"text": "CN III (Oculomotor)", "correct": true, "rationale": "The oculomotor nerve is motor (eye movement, pupil constriction, eyelid elevation)."}, {"text": "CN IV (Trochlear)", "correct": true, "rationale": "The trochlear nerve is motor (eye movement)."}, {"text": "CN VI (Abducens)", "correct": true, "rationale": "The abducens nerve is motor (eye movement)."}, {"text": "CN XI (Spinal accessory)", "correct": true, "rationale": "The spinal accessory nerve is motor (shrugging shoulders, turning the head)."}, {"text": "CN XII (Hypoglossal)", "correct": true, "rationale": "The hypoglossal nerve is motor (tongue movement)."}, {"text": "CN II (Optic)", "correct": false, "rationale": "The optic nerve is sensory only."}, {"text": "CN V (Trigeminal)", "correct": false, "rationale": "The trigeminal nerve is both sensory and motor."}, {"text": "CN IX (Glossopharyngeal)", "correct": false, "rationale": "The glossopharyngeal nerve is both sensory and motor."}, {"text": "CN X (Vagus)", "correct": false, "rationale": "The vagus nerve is both sensory and motor."}]}, {"id": "w7ih-q26", "cat": "integheentneuro", "type": "mc", "stem": "A nurse is testing the motor function of cranial nerve V. Which instruction should the nurse give the client?", "options": [{"text": "\"Puff out your cheeks.\"", "correct": false, "rationale": "Puffing out the cheeks tests the motor function of CN VII (facial)."}, {"text": "\"Clench your teeth.\"", "correct": true, "rationale": "Clenching the teeth while the nurse palpates the temporal and masseter muscles tests the motor function of CN V (trigeminal)."}, {"text": "\"Stick out your tongue.\"", "correct": false, "rationale": "Sticking out the tongue tests CN XII (hypoglossal)."}, {"text": "\"Shrug your shoulders.\"", "correct": false, "rationale": "Shrugging the shoulders tests CN XI (spinal accessory)."}]}, {"id": "w7ih-q27", "cat": "integheentneuro", "type": "mc", "stem": "A nurse asks a client to smile, frown, raise their eyebrows, and close their eyes tightly. Which cranial nerve is the nurse testing?", "options": [{"text": "Trigeminal (CN V)", "correct": false, "rationale": "The trigeminal nerve controls facial sensation and jaw movement, not facial expression."}, {"text": "Facial (CN VII)", "correct": true, "rationale": "Symmetric facial expressions test the motor function of CN VII."}, {"text": "Oculomotor (CN III)", "correct": false, "rationale": "The oculomotor nerve controls eye movement, pupils, and eyelid elevation."}, {"text": "Hypoglossal (CN XII)", "correct": false, "rationale": "The hypoglossal nerve controls the tongue."}]}, {"id": "w7ih-q28", "cat": "integheentneuro", "type": "mc", "stem": "A client has difficulty swallowing. Which cranial nerve should the nurse identify as controlling swallowing?", "options": [{"text": "Glossopharyngeal (CN IX)", "correct": true, "rationale": "The glossopharyngeal nerve (with the vagus) controls swallowing and is tested with the gag reflex."}, {"text": "Trigeminal (CN V)", "correct": false, "rationale": "The trigeminal nerve controls facial sensation and chewing."}, {"text": "Trochlear (CN IV)", "correct": false, "rationale": "The trochlear nerve controls eye movement."}, {"text": "Hypoglossal (CN XII)", "correct": false, "rationale": "The hypoglossal nerve controls tongue movement, not the swallowing reflex."}]}, {"id": "w7ih-q29", "cat": "integheentneuro", "type": "mc", "stem": "A nurse places their hands on a client's shoulders and asks the client to shrug against resistance. Which cranial nerve is the nurse testing?", "options": [{"text": "Vagus (CN X)", "correct": false, "rationale": "The vagus nerve is tested with the gag reflex and soft palate movement."}, {"text": "Hypoglossal (CN XII)", "correct": false, "rationale": "The hypoglossal nerve is tested with tongue movement."}, {"text": "Spinal accessory (CN XI)", "correct": true, "rationale": "Shrugging the shoulders and turning the head against resistance test CN XI (trapezius and sternocleidomastoid)."}, {"text": "Facial (CN VII)", "correct": false, "rationale": "The facial nerve is tested with facial expressions."}]}, {"id": "w7ih-q30", "cat": "integheentneuro", "type": "mc", "stem": "A nurse is testing cranial nerve I. Why should the nurse avoid using an alcohol wipe?", "options": [{"text": "Alcohol dries the nasal mucosa", "correct": false, "rationale": "The concern is a misleading response, not drying of the mucosa."}, {"text": "Noxious odors stimulate the trigeminal nerve", "correct": true, "rationale": "Irritating odors stimulate CN V and can cause a misleading response; use a familiar, non-noxious scent such as mint or coffee."}, {"text": "Alcohol is too difficult to identify", "correct": false, "rationale": "Alcohol is easy to identify; the problem is that it stimulates CN V."}, {"text": "Alcohol can trigger the gag reflex", "correct": false, "rationale": "The gag reflex is stimulated at the back of the throat, not by smell."}]}, {"id": "w7ih-q31", "cat": "integheentneuro", "type": "mc", "stem": "A client responds to light shaking but is confused and slow to respond. Which level of consciousness should the nurse document?", "options": [{"text": "Lethargic", "correct": false, "rationale": "A lethargic client opens their eyes and responds but falls back asleep quickly."}, {"text": "Obtunded", "correct": true, "rationale": "An obtunded client responds to light shaking and may be confused and slow to respond."}, {"text": "Stuporous", "correct": false, "rationale": "A stuporous client needs painful stimuli for a brief response."}, {"text": "Comatose", "correct": false, "rationale": "A comatose client has no response to repeated painful stimuli."}]}, {"id": "w7ih-q32", "cat": "integheentneuro", "type": "mc", "stem": "A client's Glasgow Coma Scale score drops from 14 to 9 over 2 hours. How should the nurse interpret this change?", "options": [{"text": "Improving level of consciousness", "correct": false, "rationale": "On the GCS, higher scores are better; a drop means decline."}, {"text": "Declining level of consciousness", "correct": true, "rationale": "GCS ranges from 3 to 15, and a lower score indicates worsening consciousness."}, {"text": "No significant change", "correct": false, "rationale": "A 5-point drop is a significant change in consciousness."}, {"text": "Full consciousness", "correct": false, "rationale": "Only a score of 15 indicates full consciousness."}]}, {"id": "w7ih-q33", "cat": "integheentneuro", "type": "mc", "stem": "A nurse observes a client with neck and elbow extension and flexed wrists and fingers. How should the nurse document this posture?", "options": [{"text": "Decorticate posturing", "correct": false, "rationale": "Decorticate posturing is flexion and internal rotation of the arms and legs."}, {"text": "Decerebrate posturing", "correct": true, "rationale": "Decerebrate posturing is neck and elbow extension with flexed wrists and fingers."}, {"text": "Lethargy", "correct": false, "rationale": "Lethargy is a level of consciousness, not a posture."}, {"text": "Expected sleep position", "correct": false, "rationale": "These abnormal postures occur in clients who are comatose."}]}, {"id": "w7ih-q34", "cat": "integheentneuro", "type": "mc", "stem": "A nurse asks a client, \"What does 'a bird in the hand is worth two in the bush' mean?\" Which mental status component is the nurse assessing?", "options": [{"text": "Remote memory", "correct": false, "rationale": "Remote memory is tested with verifiable past facts, such as a birth date."}, {"text": "Judgment", "correct": false, "rationale": "Judgment is tested by asking how the client would solve a dilemma."}, {"text": "Abstract thinking", "correct": true, "rationale": "Interpreting a clich\u00e9 tests abstract thinking, a higher-level thought process."}, {"text": "Calculation", "correct": false, "rationale": "Calculation is tested with serial 7s from 100."}]}, {"id": "w7ih-q35", "cat": "integheentneuro", "type": "mc", "stem": "A nurse traces a number on a client's palm while the client's eyes are closed and asks the client to identify it. Which sensory function is the nurse testing?", "options": [{"text": "Stereognosis", "correct": false, "rationale": "Stereognosis is identifying a familiar object placed in the hand."}, {"text": "Graphesthesia", "correct": true, "rationale": "Graphesthesia is identifying a number traced on the palm."}, {"text": "Two-point discrimination", "correct": false, "rationale": "Two-point discrimination uses open paper clips to find the smallest distance where two points are felt."}, {"text": "Position sense", "correct": false, "rationale": "Position sense is identifying whether a limb is moved up or down."}]}, {"id": "w7ih-q36", "cat": "integheentneuro", "type": "mc", "stem": "A nurse strikes the tendon just below a client's patella. Which response should the nurse expect?", "options": [{"text": "Plantar flexion of the foot", "correct": false, "rationale": "Plantar flexion is the expected Achilles reflex response."}, {"text": "Extension of the lower leg", "correct": true, "rationale": "The expected patellar reflex is extension of the lower leg."}, {"text": "Flexion of the elbow", "correct": false, "rationale": "Elbow flexion is the expected biceps reflex response."}, {"text": "Fanning of the toes", "correct": false, "rationale": "Fanning of the toes is an abnormal Babinski response."}]}, {"id": "w7ih-q37", "cat": "integheentneuro", "type": "mc", "stem": "A nurse documents a client's deep tendon reflexes as 4+. What does this finding indicate?", "options": [{"text": "Expected response", "correct": false, "rationale": "An expected reflex is graded 2+."}, {"text": "Diminished response", "correct": false, "rationale": "A diminished reflex is graded 1+."}, {"text": "Slightly brisker than average", "correct": false, "rationale": "A response brisker than average is graded 3+."}, {"text": "Hyperactive response with clonus", "correct": true, "rationale": "4+ is a very brisk, hyperactive response with clonus."}]}, {"id": "w7ih-q38", "cat": "integheentneuro", "type": "mc", "stem": "A nurse strokes the sole of an adult client's foot and observes fanning of the toes and dorsiflexion of the great toe. How should the nurse interpret this finding?", "options": [{"text": "Expected adult response", "correct": false, "rationale": "In adults, the expected response is no response or slight curling of the toes."}, {"text": "Abnormal finding associated with upper motor neuron disease", "correct": true, "rationale": "An abnormal Babinski (fanning toes, dorsiflexed great toe) is associated with upper motor neuron disease."}, {"text": "Sign of peripheral vascular disease", "correct": false, "rationale": "The Babinski reflex is a neurologic test, not a vascular one."}, {"text": "Normal response to a ticklish client", "correct": false, "rationale": "This pattern is abnormal in adults regardless of ticklishness."}]}, {"id": "w7ih-q39", "cat": "integheentneuro", "type": "sata", "stem": "A nurse is assessing a client's sensory function. Which actions should the nurse take? Select all that apply.", "options": [{"text": "Have the client close their eyes", "correct": true, "rationale": "Sensory tests are done with the client's eyes closed so they can't see the stimulus."}, {"text": "Vary the sharp and dull touches at random sites", "correct": true, "rationale": "Random sites, intervals, and sharp or dull ends prevent the client from guessing."}, {"text": "Move the cotton ball from proximal to distal areas", "correct": true, "rationale": "Light touch is tested from proximal to distal, comparing both sides."}, {"text": "Test all four extremities", "correct": true, "rationale": "Sensory function is tested on all four extremities and compared bilaterally."}, {"text": "Tell the client which end of the tongue blade is touching before each touch", "correct": false, "rationale": "Telling the client would invalidate the test; show both ends only before starting."}, {"text": "Test only the dominant side", "correct": false, "rationale": "Sides are compared to detect asymmetry."}]}, {"id": "w7ih-q40", "cat": "integheentneuro", "type": "mc", "stem": "A nurse is preparing to listen for a low-pitched murmur. How should the nurse use the stethoscope?", "options": [{"text": "Diaphragm with firm pressure", "correct": false, "rationale": "The diaphragm with firm pressure is used for high-pitched sounds such as S1, S2, and lung and bowel sounds."}, {"text": "Bell with light pressure, with the entire rim touching the skin", "correct": true, "rationale": "The bell picks up low-pitched sounds such as murmurs, bruits, S3, and S4; heavy pressure stretches the skin and blocks them."}, {"text": "Bell pressed firmly into the skin", "correct": false, "rationale": "Firm pressure with the bell turns it into a diaphragm and filters out low-pitched sounds."}, {"text": "Diaphragm placed over the client's gown", "correct": false, "rationale": "The stethoscope should always be placed directly on the skin."}]}, {"id": "w7tc-q01", "cat": "thoraxcardioabdmsk", "type": "mc", "stem": "A nurse auscultates medium-pitched, blowing breath sounds with equal inspiration and expiration. Where should the nurse expect to hear these sounds?", "options": [{"text": "Over the trachea", "correct": false, "rationale": "Over the trachea, bronchial sounds are loud and high-pitched with expiration longer than inspiration."}, {"text": "Over the main bronchi", "correct": true, "rationale": "Bronchovesicular sounds are heard over the mainstem bronchi, anteriorly and posteriorly."}, {"text": "Over the peripheral lung bases", "correct": false, "rationale": "Vesicular sounds (soft, low-pitched, breezy) are expected over the periphery."}, {"text": "Over the right middle lobe in the axilla", "correct": false, "rationale": "Peripheral areas like the axilla have vesicular sounds."}]}, {"id": "w7tc-q02", "cat": "thoraxcardioabdmsk", "type": "sata", "stem": "A nurse is percussing and auscultating an adult client's thorax. Which findings should the nurse expect? Select all that apply.", "options": [{"text": "Resonance over the lung fields", "correct": true, "rationale": "Resonance, a low-pitched hollow sound, is the expected percussion sound over air-filled lungs."}, {"text": "Vesicular sounds over the peripheral lung fields", "correct": true, "rationale": "Soft, breezy, low-pitched vesicular sounds are expected over the periphery."}, {"text": "Symmetric tactile fremitus", "correct": true, "rationale": "Fremitus should be symmetric and strongest near the top."}, {"text": "AP diameter about half the transverse diameter", "correct": true, "rationale": "The expected AP diameter is one-third to one-half of the transverse diameter."}, {"text": "Crackles that don't clear with coughing", "correct": false, "rationale": "Crackles are adventitious sounds and unexpected."}, {"text": "Hyperresonance", "correct": false, "rationale": "Hyperresonance indicates trapped air (emphysema or pneumothorax) and is unexpected."}]}, {"id": "w7tc-q03", "cat": "thoraxcardioabdmsk", "type": "mc", "stem": "A nurse palpates increased tactile fremitus over a client's right lower lobe. Which condition should the nurse suspect?", "options": [{"text": "Pneumonia", "correct": true, "rationale": "Increased fremitus occurs when lung tissue is consolidated, as with pneumonia."}, {"text": "Pneumothorax", "correct": false, "rationale": "Pneumothorax causes decreased or absent fremitus."}, {"text": "Emphysema", "correct": false, "rationale": "Emphysema causes hyperresonance on percussion."}, {"text": "Expected finding", "correct": false, "rationale": "Fremitus should be symmetric; increased fremitus on one side is unexpected."}]}, {"id": "w7tc-q04", "cat": "thoraxcardioabdmsk", "type": "mc", "stem": "A nurse percusses hyperresonance over a client's left lung field. Which condition should the nurse suspect?", "options": [{"text": "Pneumonia", "correct": false, "rationale": "Pneumonia (fluid or consolidation) causes dullness."}, {"text": "Tumor", "correct": false, "rationale": "A solid mass causes dullness."}, {"text": "Pneumothorax", "correct": true, "rationale": "Hyperresonance indicates trapped air, as with pneumothorax or emphysema."}, {"text": "Pleural effusion", "correct": false, "rationale": "Fluid in the pleural space causes dullness."}]}, {"id": "w7tc-q05", "cat": "thoraxcardioabdmsk", "type": "mc", "stem": "A client who has asthma has continuous, high-pitched musical sounds that are louder on expiration. How should the nurse document this finding?", "options": [{"text": "Crackles", "correct": false, "rationale": "Crackles are wet popping sounds from air moving through fluid."}, {"text": "Wheezes", "correct": true, "rationale": "Wheezes are continuous musical sounds from air moving through constricted airways, as in asthma."}, {"text": "Stridor", "correct": false, "rationale": "Stridor is a high-pitched crowing sound from upper airway obstruction, heard without a stethoscope."}, {"text": "Pleural friction rub", "correct": false, "rationale": "A friction rub is a grating sound from inflamed pleura."}]}, {"id": "w7tc-q06", "cat": "thoraxcardioabdmsk", "type": "mc", "stem": "A nurse hears low-pitched rumbling sounds over a client's large airways. Which action should the nurse take next?", "options": [{"text": "Notify the rapid response team", "correct": false, "rationale": "Rhonchi alone are not an emergency; first see whether they clear."}, {"text": "Have the client take a deep breath and cough, then listen again", "correct": true, "rationale": "Rhonchi come from mucus in large airways and may clear with coughing."}, {"text": "Document the finding as crackles", "correct": false, "rationale": "Crackles are popping sounds; low-pitched rumbling is rhonchi."}, {"text": "Percuss the area for dullness", "correct": false, "rationale": "Percussion won't distinguish rhonchi; reassess after coughing."}]}, {"id": "w7tc-q07", "cat": "thoraxcardioabdmsk", "type": "mc", "stem": "Which adventitious sound should the nurse identify as the highest priority?", "options": [{"text": "Rhonchi", "correct": false, "rationale": "Rhonchi may clear with coughing and are usually not an immediate threat."}, {"text": "Fine crackles at the bases", "correct": false, "rationale": "Crackles need follow-up but are not an immediate airway threat."}, {"text": "Stridor", "correct": true, "rationale": "Stridor indicates upper airway obstruction and can be life-threatening."}, {"text": "Diminished sounds over increased adipose tissue", "correct": false, "rationale": "Diminished sounds from adipose tissue are a common variation."}]}, {"id": "w7tc-q08", "cat": "thoraxcardioabdmsk", "type": "mc", "stem": "A nurse is auscultating a client's posterior lung fields. Which instruction should the nurse give?", "options": [{"text": "\"Hold your breath while I listen.\"", "correct": false, "rationale": "The client should breathe deeply, not hold their breath."}, {"text": "\"Cross your arms in front of your chest.\"", "correct": true, "rationale": "Crossing the arms separates the scapulae and exposes more lung tissue."}, {"text": "\"Breathe through your nose normally.\"", "correct": false, "rationale": "Deep breaths through an open mouth make lung sounds easier to hear."}, {"text": "\"Count out loud while I listen.\"", "correct": false, "rationale": "The client should not talk during auscultation; counting \"99\" is used for fremitus."}]}, {"id": "w7tc-q09", "cat": "thoraxcardioabdmsk", "type": "dragdrop", "stem": "Drag the sounds that are adventitious (unexpected) into the answer box.", "leftLabel": "Lung sounds", "rightLabel": "Adventitious sounds", "options": [{"text": "Crackles", "correct": true, "rationale": "Crackles are popping sounds from air through fluid or collapsed alveoli."}, {"text": "Wheezes", "correct": true, "rationale": "Wheezes are musical sounds from narrowed airways."}, {"text": "Rhonchi", "correct": true, "rationale": "Rhonchi are low-pitched rumbling sounds from mucus in large airways."}, {"text": "Stridor", "correct": true, "rationale": "Stridor is a high-pitched crowing sound from upper airway obstruction."}, {"text": "Pleural friction rub", "correct": true, "rationale": "A friction rub is a grating sound from inflamed pleura."}, {"text": "Vesicular sounds over the periphery", "correct": false, "rationale": "Vesicular sounds are expected over the peripheral lung fields."}, {"text": "Bronchovesicular sounds over the main bronchi", "correct": false, "rationale": "Bronchovesicular sounds are expected over the main bronchi."}, {"text": "Bronchial sounds over the trachea", "correct": false, "rationale": "Bronchial sounds are expected over the trachea."}]}, {"id": "w7tc-q10", "cat": "thoraxcardioabdmsk", "type": "mc", "stem": "A client asks when to perform a monthly breast self-exam. Which response by the nurse is correct?", "options": [{"text": "\"On the first day of your period.\"", "correct": false, "rationale": "Breast tissue is fuller and more tender during menses."}, {"text": "\"Four to seven days after your period begins.\"", "correct": true, "rationale": "Breast tissue is least full and tender 4 to 7 days after menses begins (or right after it ends)."}, {"text": "\"The day before your period starts.\"", "correct": false, "rationale": "Breasts are often swollen and tender before menses."}, {"text": "\"Any day, as long as it's monthly.\"", "correct": false, "rationale": "Clients who menstruate should time the exam to their cycle; a set day is for pregnant or postmenopausal clients."}]}, {"id": "w7tc-q11", "cat": "thoraxcardioabdmsk", "type": "sata", "stem": "A nurse is examining a female client's breasts. Which findings should the nurse report as associated with breast cancer? Select all that apply.", "options": [{"text": "Skin that looks like the peel of an orange", "correct": true, "rationale": "Peau d'orange (dimpling from edema dilating hair follicles) is associated with breast cancer."}, {"text": "A nipple that recently became inverted", "correct": true, "rationale": "Recent nipple inversion can indicate an underlying mass."}, {"text": "Dimpling over a mass", "correct": true, "rationale": "Dimpling or retraction over a mass is associated with breast cancer."}, {"text": "Dilated veins on one breast only", "correct": true, "rationale": "Unilateral dilated veins are associated with breast cancer."}, {"text": "One breast slightly larger than the other", "correct": false, "rationale": "Slight asymmetry in size is a common, expected finding."}, {"text": "Oval-shaped areolas", "correct": false, "rationale": "Areolas can be round or oval."}]}, {"id": "w7tc-q12", "cat": "thoraxcardioabdmsk", "type": "mc", "stem": "A nurse is auscultating a client's heart. Where is Erb's point?", "options": [{"text": "Right sternal border, 2nd intercostal space", "correct": false, "rationale": "This is the aortic area."}, {"text": "Left sternal border, 2nd intercostal space", "correct": false, "rationale": "This is the pulmonic area."}, {"text": "Left sternal border, 3rd intercostal space", "correct": true, "rationale": "Erb's point is at the left sternal border, 3rd intercostal space."}, {"text": "Left midclavicular line, 5th intercostal space", "correct": false, "rationale": "This is the apical/mitral area (PMI)."}]}, {"id": "w7tc-q13", "cat": "thoraxcardioabdmsk", "type": "dragdrop", "stem": "Drag the cardiac auscultation sites located along the left sternal border into the answer box.", "leftLabel": "Auscultation sites", "rightLabel": "Left sternal border", "options": [{"text": "Pulmonic area", "correct": true, "rationale": "The pulmonic area is at the left sternal border, 2nd intercostal space."}, {"text": "Erb's point", "correct": true, "rationale": "Erb's point is at the left sternal border, 3rd intercostal space."}, {"text": "Tricuspid area", "correct": true, "rationale": "The tricuspid area is at the left sternal border, 4th intercostal space."}, {"text": "Aortic area", "correct": false, "rationale": "The aortic area is at the right sternal border, 2nd intercostal space."}, {"text": "Apical/mitral area", "correct": false, "rationale": "The apical/mitral area is at the left midclavicular line, 5th intercostal space."}]}, {"id": "w7tc-q14", "cat": "thoraxcardioabdmsk", "type": "mc", "stem": "A nurse places the diaphragm of the stethoscope at the apex of the heart. Which heart sound is loudest at this site?", "options": [{"text": "S1, closure of the mitral and tricuspid valves", "correct": true, "rationale": "S1 marks the start of systole and is loudest at the apex."}, {"text": "S2, closure of the aortic and pulmonic valves", "correct": false, "rationale": "S2 is loudest at the base (aortic and pulmonic areas)."}, {"text": "S3 ventricular gallop", "correct": false, "rationale": "S3 is low-pitched and heard with the bell."}, {"text": "Carotid bruit", "correct": false, "rationale": "Bruits are heard over arteries with the bell, not at the cardiac apex."}]}, {"id": "w7tc-q15", "cat": "thoraxcardioabdmsk", "type": "mc", "stem": "A nurse hears an extra heart sound right after S2 in a client who has heart failure. Which sound is this?", "options": [{"text": "S3 ventricular gallop", "correct": true, "rationale": "S3 follows S2 (\"Ken-tuck'-y\") and is associated with CHF."}, {"text": "S4 atrial gallop", "correct": false, "rationale": "S4 occurs just before S1 (\"Ten'-nes-see\")."}, {"text": "Systolic murmur", "correct": false, "rationale": "Systolic murmurs follow S1."}, {"text": "Split S1", "correct": false, "rationale": "A split S1 sounds like a stutter on the first heart sound."}]}, {"id": "w7tc-q16", "cat": "thoraxcardioabdmsk", "type": "mc", "stem": "Which statement about S4 is correct?", "options": [{"text": "It occurs right after S2", "correct": false, "rationale": "An extra sound right after S2 is S3."}, {"text": "It occurs just before S1 and is associated with
