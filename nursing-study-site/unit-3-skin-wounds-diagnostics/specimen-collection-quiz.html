var catLabels = {

};
var bank = [
{"id": "w6sc-q01", "cat": "stool", "type": "mc", "stem": "A nurse is planning care for a client who needs a fecal occult blood test. Which task can the nurse delegate to the UAP?", "options": [{"text": "Collecting the stool specimen", "correct": true, "rationale": "Collection of the occult blood specimen may be delegated to the UAP."}, {"text": "Performing the point-of-care occult blood test", "correct": false, "rationale": "Point-of-care testing for occult blood may not be delegated to the UAP."}, {"text": "Reading and interpreting the test results", "correct": false, "rationale": "Performing and reading the point-of-care test is not delegated."}, {"text": "Applying the developing solution to the card", "correct": false, "rationale": "Applying solution is part of point-of-care testing, which may not be delegated."}]},
{"id": "w6sc-q02", "cat": "culturesswabs", "type": "dragdrop", "stem": "A nurse is delegating specimen collection tasks. Which tasks can the nurse delegate to the UAP? Move the correct tasks to the answer box.", "leftLabel": "Tasks", "rightLabel": "Can delegate to UAP", "options": [{"text": "Collecting a stool specimen for occult blood", "correct": true, "rationale": "Occult blood specimen collection may be delegated."}, {"text": "Collecting a clean-catch urine specimen", "correct": true, "rationale": "Urine specimen collection may be delegated to the UAP."}, {"text": "Capillary blood glucose testing for a stable client", "correct": true, "rationale": "In most cases, capillary glucose testing may be delegated to the UAP."}, {"text": "Performing the point-of-care occult blood test", "correct": false, "rationale": "Point-of-care occult blood testing may not be delegated."}, {"text": "Obtaining a throat culture", "correct": false, "rationale": "Throat cultures are not delegated to the UAP."}, {"text": "Obtaining a nasal swab", "correct": false, "rationale": "Nasal swabs are not delegated to the UAP."}]},
{"id": "w6sc-q03", "cat": "bloodspecimens", "type": "mc", "stem": "A nurse is performing a fingerstick for a capillary blood glucose. Where should the nurse place the lancet?", "options": [{"text": "On the side of the fingertip", "correct": true, "rationale": "The side of the finger is less painful than the central tip, which has a denser nerve supply."}, {"text": "On the central tip of the finger", "correct": false, "rationale": "The central tip has more nerves and is more painful."}, {"text": "On the knuckle", "correct": false, "rationale": "The knuckle is not a recommended capillary puncture site."}, {"text": "Directly over a visible vein", "correct": false, "rationale": "Capillary samples come from small vessels in the skin; veins are used for venipuncture."}]},
{"id": "w6sc-q04", "cat": "stool", "type": "mc", "stem": "A client who is scheduled for a fecal occult blood test takes ibuprofen daily. How long before the test may NSAIDs need to be stopped?", "options": [{"text": "7 days", "correct": true, "rationale": "Aspirin, iron, NSAIDs, and anticoagulants can cause false results and are stopped 7 days before the test."}, {"text": "3 days", "correct": false, "rationale": "Three days applies to vitamin C and certain foods, not NSAIDs."}, {"text": "24 hours", "correct": false, "rationale": "This is not long enough for NSAIDs."}, {"text": "NSAIDs do not affect the test", "correct": false, "rationale": "NSAIDs may cause a false positive result."}]},
{"id": "w6sc-q05", "cat": "stool", "type": "dragdrop", "stem": "A nurse is teaching a client about preparing for a fecal occult blood test. Which items can cause a false result? Move the correct items to the answer box.", "leftLabel": "Foods and medications", "rightLabel": "Can cause a false result", "options": [{"text": "Beets", "correct": true, "rationale": "Beets can cause a false result; avoid starting 3 days before."}, {"text": "Rare meat", "correct": true, "rationale": "Red or rare meat can cause a false result; avoid starting 3 days before."}, {"text": "Vitamin C", "correct": true, "rationale": "Vitamin C can cause a false result; stop 3 days before."}, {"text": "Iron supplements", "correct": true, "rationale": "Iron may cause a false positive; stop 7 days before."}, {"text": "Aspirin", "correct": true, "rationale": "Aspirin can cause a false result; stop 7 days before."}, {"text": "Anticoagulants", "correct": true, "rationale": "Anticoagulants may cause a false positive; stop 7 days before."}, {"text": "Water", "correct": false, "rationale": "Water does not affect occult blood results."}, {"text": "White rice", "correct": false, "rationale": "White rice is not listed as affecting occult blood results."}]},
{"id": "w6sc-q06", "cat": "bloodspecimens", "type": "mc", "stem": "A client's bedside glucometer reading is 420. Which action should the nurse take?", "options": [{"text": "Retest, and possibly send a blood sample to the lab", "correct": true, "rationale": "Readings above 400 or below 60 should be retested and possibly confirmed by the lab, because bedside meters are less accurate."}, {"text": "Document the result and take no further action", "correct": false, "rationale": "Unusually high readings need to be repeated to make sure the client is treated appropriately."}, {"text": "Assume the meter is broken and skip the reading", "correct": false, "rationale": "The result must be retested, not ignored."}, {"text": "Milk the finger to get a larger sample and recheck", "correct": false, "rationale": "Milking can lyse blood cells and alter the result."}]},
{"id": "w6sc-q07", "cat": "stool", "type": "mc", "stem": "A nurse is performing a point-of-care fecal occult blood test. Which technique is correct?", "options": [{"text": "Apply two areas of stool, flip the card, add 2 drops of solution to each box, and read in 30 to 60 seconds", "correct": true, "rationale": "This is the expected technique, or follow the manufacturer's guidelines."}, {"text": "Apply one large area of stool and read immediately", "correct": false, "rationale": "Two separate areas of stool are applied, and the result is read after 30 to 60 seconds."}, {"text": "Add the solution to the front of the card where the stool was placed", "correct": false, "rationale": "The card is flipped over and the solution is added to the boxes on the other side."}, {"text": "Wait 10 minutes before reading the result", "correct": false, "rationale": "Results are read in 30 to 60 seconds or per manufacturer guidelines."}]},
{"id": "w6sc-q08", "cat": "stool", "type": "mc", "stem": "A nurse is collecting a formed stool specimen. How much stool should the nurse collect?", "options": [{"text": "About 1 inch, or walnut-sized", "correct": true, "rationale": "A formed stool specimen should be about 1 inch, or the size of a walnut."}, {"text": "15 to 30 mL", "correct": false, "rationale": "15 to 30 mL is the amount for a liquid stool specimen."}, {"text": "The entire bowel movement", "correct": false, "rationale": "Only a walnut-sized portion is needed."}, {"text": "A smear on a cotton swab", "correct": false, "rationale": "A swab smear is not enough for a stool specimen."}]},
{"id": "w6sc-q09", "cat": "stool", "type": "mc", "stem": "A client has liquid stools, and the provider orders a stool specimen. How much should the nurse collect?", "options": [{"text": "15 to 30 mL", "correct": true, "rationale": "A liquid stool specimen should be 15 to 30 mL."}, {"text": "5 mL", "correct": false, "rationale": "This is less than the amount needed for a liquid stool specimen."}, {"text": "100 mL", "correct": false, "rationale": "This is more than needed. The specimen should be 15 to 30 mL."}, {"text": "About 1 inch", "correct": false, "rationale": "1 inch, or walnut-sized, is the amount for formed stool."}]},
{"id": "w6sc-q10", "cat": "stool", "type": "mc", "stem": "A nurse is collecting a stool specimen to test for C. difficile. Which action should the nurse take?", "options": [{"text": "Place the client on contact isolation until the results come back", "correct": true, "rationale": "Clients being tested for C. diff are placed on contact isolation until results are known."}, {"text": "Wait for a positive result before starting isolation", "correct": false, "rationale": "Isolation starts while the test is pending."}, {"text": "Place the client on airborne precautions", "correct": false, "rationale": "C. difficile requires contact precautions, not airborne."}, {"text": "Use an alcohol-based hand rub after removing gloves", "correct": false, "rationale": "C. diff spores require soap and water; alcohol-based products do not remove spores."}]},
{"id": "w6sc-q11", "cat": "bloodspecimens", "type": "mc", "stem": "A nurse is preparing to draw blood with a needle. Which needle has the largest opening?", "options": [{"text": "18-gauge", "correct": true, "rationale": "The larger the gauge number, the smaller the opening. An 18-gauge needle is larger than a 22-gauge."}, {"text": "20-gauge", "correct": false, "rationale": "A 20-gauge needle is smaller than an 18-gauge."}, {"text": "22-gauge", "correct": false, "rationale": "A 22-gauge needle is smaller than an 18-gauge."}, {"text": "25-gauge", "correct": false, "rationale": "A 25-gauge needle has the smallest opening of these choices."}]},
{"id": "w6sc-q12", "cat": "stool", "type": "mc", "stem": "A provider orders stool for ova and parasites. How many specimens are usually collected?", "options": [{"text": "Three separate specimens", "correct": true, "rationale": "Three separate stool specimens are usually collected for ova and parasites."}, {"text": "One specimen", "correct": false, "rationale": "A single specimen may miss ova and parasites; three are usually collected."}, {"text": "Two specimens collected at once", "correct": false, "rationale": "Separate specimens are collected, usually three."}, {"text": "A 24-hour stool collection", "correct": false, "rationale": "Ova and parasites testing uses separate specimens, not a 24-hour collection."}]},
{"id": "w6sc-q13", "cat": "urine", "type": "mc", "stem": "A nurse is teaching a female client how to collect a clean-catch urine specimen. Which instruction is correct?", "options": [{"text": "Separate the labia and clean from front to back", "correct": true, "rationale": "Cleaning front to back, with the labia separated, keeps rectal bacteria away from the urinary meatus."}, {"text": "Clean from back to front", "correct": false, "rationale": "Cleaning back to front moves bacteria toward the urinary meatus."}, {"text": "Use one towelette for the entire area", "correct": false, "rationale": "Use 2 to 3 towelettes, each one only once."}, {"text": "Collect the very first stream of urine", "correct": false, "rationale": "Start voiding into the toilet, stop, then collect the midstream portion."}]},
{"id": "w6sc-q14", "cat": "urine", "type": "mc", "stem": "A client's urine dipstick shows a high specific gravity. The nurse recognizes this finding may indicate", "options": [{"text": "dehydration.", "correct": true, "rationale": "High specific gravity means concentrated urine, which can indicate dehydration. The expected range is 1.005 to 1.030."}, {"text": "a urinary tract infection.", "correct": false, "rationale": "Leukocytes and nitrites indicate infection."}, {"text": "liver disease.", "correct": false, "rationale": "Bilirubin and urobilinogen can indicate liver disease."}, {"text": "dilute urine.", "correct": false, "rationale": "Low specific gravity indicates dilute urine."}]},
{"id": "w6sc-q15", "cat": "urine", "type": "mc", "stem": "A nurse needs a urine specimen from a client who has had an indwelling catheter for 3 days. Where should the nurse obtain the specimen?", "options": [{"text": "From the sampling port, using a syringe", "correct": true, "rationale": "Specimens are drawn from the sampling port after clamping the tubing and wiping the port with a disinfectant."}, {"text": "From the drainage bag", "correct": false, "rationale": "Urine from a bag already connected to the client is concentrated or contaminated. Bag urine is OK only when the catheter is first inserted."}, {"text": "By disconnecting the catheter from the tubing", "correct": false, "rationale": "Breaking the closed system increases the risk of infection."}, {"text": "From the end of the drainage tubing", "correct": false, "rationale": "The specimen should come from the sampling port, not the drainage tubing outlet."}]},
{"id": "w6sc-q16", "cat": "urine", "type": "dragdrop", "stem": "A nurse is collecting a urine specimen from a client's indwelling catheter. Which actions are correct? Move the correct actions to the answer box.", "leftLabel": "Nursing actions", "rightLabel": "Correct actions", "options": [{"text": "Clamp the tubing 3 inches below the sampling port", "correct": true, "rationale": "Clamping lets urine collect above the port. Clamp no more than 30 minutes."}, {"text": "Wipe the sampling port with alcohol or another disinfectant", "correct": true, "rationale": "Disinfecting the port prevents contamination of the specimen."}, {"text": "Draw out at least 10 mL with a syringe", "correct": true, "rationale": "At least 10 mL is needed for the specimen."}, {"text": "Unclamp the tubing when finished", "correct": true, "rationale": "The catheter must be unclamped to allow urine to drain."}, {"text": "Clamp the tubing for 2 hours", "correct": false, "rationale": "Clamp no more than 30 minutes."}, {"text": "Pour urine from the drainage bag into the specimen cup", "correct": false, "rationale": "Never take urine from a drainage bag that has been connected to the client."}, {"text": "Disconnect the catheter from the tubing to collect urine", "correct": false, "rationale": "Disconnecting breaks the closed system and increases infection risk."}]},
{"id": "w6sc-q17", "cat": "urine", "type": "mc", "stem": "A nurse is starting a 24-hour urine collection at 0800. Which action should the nurse take first?", "options": [{"text": "Have the client void, discard that urine, and note the start time", "correct": true, "rationale": "The first void is discarded because it was made before the collection period started."}, {"text": "Save the 0800 void as the first specimen", "correct": false, "rationale": "The first void is discarded, not saved."}, {"text": "Wait until the client's next meal to start", "correct": false, "rationale": "Collection begins when the client voids and the first specimen is discarded."}, {"text": "Insert an indwelling catheter for the collection", "correct": false, "rationale": "A catheter is not required for a 24-hour urine collection."}]},
{"id": "w6sc-q18", "cat": "culturesswabs", "type": "mc", "stem": "A client cannot cough up enough sputum for a specimen. Which action should the nurse take first?", "options": [{"text": "Use chest physiotherapy to mobilize secretions", "correct": true, "rationale": "Chest physiotherapy is tried first. Suctioning and transtracheal aspiration are last resorts."}, {"text": "Perform transtracheal aspiration", "correct": false, "rationale": "This is a last resort after less invasive methods fail."}, {"text": "Collect saliva instead", "correct": false, "rationale": "Saliva contaminates a sputum specimen; it must come from the lungs."}, {"text": "Have the client rinse with mouthwash and try again", "correct": false, "rationale": "Mouthwash may contain antibacterial agents that affect results."}]},
{"id": "w6sc-q19", "cat": "culturesswabs", "type": "mc", "stem": "A nurse is teaching a client how to collect a sputum specimen. Which instruction should the nurse include? Select all that apply.", "options": [{"text": "Collect the specimen in the morning", "correct": true, "rationale": "Morning is the best time to collect sputum."}, {"text": "Rinse your mouth with water before collecting", "correct": true, "rationale": "Rinsing removes contaminants from the mouth."}, {"text": "Take a few deep breaths, then cough", "correct": true, "rationale": "Deep breaths and a cough bring up sputum from the lungs rather than saliva."}, {"text": "Do not touch the inside of the cup", "correct": true, "rationale": "Touching the inside contaminates the specimen."}, {"text": "Rinse with mouthwash first", "correct": false, "rationale": "Mouthwash may contain antibacterial agents that affect results."}, {"text": "Spit saliva into the cup", "correct": false, "rationale": "The specimen must come from the lungs, not saliva."}]},
{"id": "w6sc-q20", "cat": "culturesswabs", "type": "mc", "stem": "A provider orders sputum specimens for acid-fast bacilli (AFB). Which collection schedule is correct?", "options": [{"text": "Three consecutive specimens, 8 to 24 hours apart", "correct": true, "rationale": "AFB testing requires 3 consecutive specimens collected 8 to 24 hours apart."}, {"text": "One specimen collected in the morning", "correct": false, "rationale": "One specimen is not enough for AFB testing."}, {"text": "Three specimens collected within 1 hour", "correct": false, "rationale": "The specimens must be 8 to 24 hours apart."}, {"text": "Two specimens collected 48 hours apart", "correct": false, "rationale": "AFB requires 3 specimens, 8 to 24 hours apart."}]},
{"id": "w6sc-q21", "cat": "culturesswabs", "type": "mc", "stem": "A nurse is obtaining a wound culture. Which action is correct?", "options": [{"text": "Clean the wound with 0.9% sodium chloride, then swab clean tissue in the center of the wound", "correct": true, "rationale": "The wound is cleaned first, and the specimen comes from the center of the wound, since the edges carry skin flora."}, {"text": "Swab the exudate on the old dressing", "correct": false, "rationale": "Exudate and old dressings contain contaminants and do not give an accurate culture."}, {"text": "Swab the skin surrounding the wound", "correct": false, "rationale": "Surrounding skin contains normal flora and would contaminate the culture."}, {"text": "Collect the culture after the first dose of antibiotic", "correct": false, "rationale": "Cultures should be collected before antibiotic therapy begins."}]},
{"id": "w6sc-q22", "cat": "culturesswabs", "type": "mc", "stem": "A nurse is obtaining a nasal swab. Which technique is correct?", "options": [{"text": "Insert the swab 1.5 cm, rotate at least 4 times for 15 seconds, and repeat in the other naris with the same swab", "correct": true, "rationale": "The same swab is used in both nares."}, {"text": "Use a new swab for each naris", "correct": false, "rationale": "The same swab is used in both nares."}, {"text": "Insert the swab until resistance is felt deep in the nasopharynx", "correct": false, "rationale": "A nasal swab is inserted about 1.5 cm. Nasopharyngeal swabs are a different test."}, {"text": "Have the client tilt the head forward", "correct": false, "rationale": "The client tilts the head back."}]},
{"id": "w6sc-q23", "cat": "culturesswabs", "type": "mc", "stem": "Which action should the nurse take before obtaining a nasal swab?", "options": [{"text": "Have the client blow their nose and check patency with a penlight", "correct": true, "rationale": "Blowing the nose clears secretions, and the nurse checks patency before inserting the swab."}, {"text": "Delegate the swab to the UAP", "correct": false, "rationale": "Nasal swabs should not be delegated to the UAP."}, {"text": "Moisten the swab with tap water", "correct": false, "rationale": "Tap water would contaminate the swab."}, {"text": "Use any available collection tube", "correct": false, "rationale": "The nurse must use the correct tube: viral vs bacterial, nasal vs nasopharyngeal."}]},
{"id": "w6sc-q24", "cat": "stool", "type": "mc", "stem": "A client's fecal occult blood card is positive, and the client reports dark, tarry stools. The nurse recognizes this suggests bleeding from where?", "options": [{"text": "High in the GI tract", "correct": true, "rationale": "Bleeding high in the GI tract makes stool appear dark or tarry."}, {"text": "A hemorrhoid", "correct": false, "rationale": "Bleeding low in the GI tract, such as from a hemorrhoid, causes bright red streaks."}, {"text": "Menstrual bleeding", "correct": false, "rationale": "Menstrual blood appears bright red and can cause an inaccurate result."}, {"text": "The urinary tract", "correct": false, "rationale": "FOBT detects GI bleeding, not urinary bleeding."}]},
{"id": "w6sc-q25", "cat": "bloodspecimens", "type": "mc", "stem": "A client's capillary blood glucose result is 62. The nurse compares it to the expected fasting range. How should the nurse interpret this result?", "options": [{"text": "Below the expected range of 74 to 106", "correct": true, "rationale": "62 is below the expected reference range of 74 to 106."}, {"text": "Within the expected range", "correct": false, "rationale": "The expected range is 74 to 106; 62 is below it."}, {"text": "Above the expected range", "correct": false, "rationale": "62 is below, not above, the expected range."}, {"text": "Unable to interpret without a urine specimen", "correct": false, "rationale": "Capillary glucose is interpreted on its own against the reference range."}]},
{"id": "w6sc-q26", "cat": "culturesswabs", "type": "mc", "stem": "A nurse is preparing to obtain a throat culture. How should the nurse position the client?", "options": [{"text": "Sitting upright", "correct": true, "rationale": "An upright position lets the nurse reach the oropharynx with good body mechanics and avoid touching the lips, teeth, or tongue."}, {"text": "Supine with the head flat", "correct": false, "rationale": "Lying flat makes the oropharynx harder to see and swab without contamination."}, {"text": "Side-lying", "correct": false, "rationale": "Side-lying does not give a clear view of the oropharynx."}, {"text": "Prone", "correct": false, "rationale": "Prone position prevents access to the mouth and throat."}]},
{"id": "w6sc-q27", "cat": "culturesswabs", "type": "mc", "stem": "Before obtaining a throat culture, a nurse notes that the client's epiglottis is severely inflamed. Which action should the nurse take?", "options": [{"text": "Do not obtain the specimen and notify the provider", "correct": true, "rationale": "Irritating a severely inflamed epiglottis can cause edema and airway obstruction."}, {"text": "Swab the epiglottis gently to get the best sample", "correct": false, "rationale": "Swabbing the epiglottis can cause trauma or airway occlusion."}, {"text": "Obtain the specimen quickly to limit irritation", "correct": false, "rationale": "Speed does not remove the risk of airway obstruction."}, {"text": "Have the client gargle with mouthwash first", "correct": false, "rationale": "Mouthwash does not address the airway risk and could affect the specimen."}]},
{"id": "w6sc-q28", "cat": "culturesswabs", "type": "mc", "stem": "While obtaining a throat culture, the nurse accidentally touches the swab to the client's tongue. Which action should the nurse take?", "options": [{"text": "Discard the swab and start again with a new sterile swab", "correct": true, "rationale": "Touching the tongue contaminates the specimen. The nurse withdraws, discards the swab, and begins again."}, {"text": "Continue swabbing the tonsils with the same swab", "correct": false, "rationale": "The swab is already contaminated, so the culture would be inaccurate."}, {"text": "Note the contact on the lab requisition and send it", "correct": false, "rationale": "A contaminated specimen should not be sent."}, {"text": "Rinse the swab with sterile saline and continue", "correct": false, "rationale": "Rinsing does not make a contaminated swab sterile."}]},
{"id": "w6sc-q29", "cat": "culturesswabs", "type": "mc", "stem": "A nurse is obtaining a throat culture from a preschool-age child. Which action is appropriate?", "options": [{"text": "Have the guardian hold the child on their lap with a hand on the child's forehead", "correct": true, "rationale": "This stabilizes the head, which prevents contamination of the specimen and injury to the child."}, {"text": "Ask the guardian to wait outside the room", "correct": false, "rationale": "A guardian's presence reduces fear and promotes cooperation."}, {"text": "Delegate the swab to the UAP so the nurse can hold the child", "correct": false, "rationale": "Throat cultures should not be delegated to the UAP."}, {"text": "Swab while the child is lying flat and crying", "correct": false, "rationale": "Stabilizing the child's head upright is safer and prevents contamination."}]},
{"id": "w6sc-q30", "cat": "culturesswabs", "type": "mc", "stem": "A nurse has removed a client's soiled wound dressing before obtaining a wound culture. Which action should the nurse take next?", "options": [{"text": "Remove gloves, perform hand hygiene, and apply clean gloves", "correct": true, "rationale": "Changing gloves and performing hand hygiene after removing a soiled dressing prevents contaminating the wound and the culture."}, {"text": "Swab the wound immediately with the same gloves on", "correct": false, "rationale": "The gloves are contaminated from the old dressing, and the wound has not yet been irrigated."}, {"text": "Swab the drainage on the removed dressing", "correct": false, "rationale": "Specimens are taken from clean wound tissue, not from an old dressing."}, {"text": "Apply the new dressing, then swab around its edges", "correct": false, "rationale": "The culture is collected from the irrigated wound before redressing."}]},
{"id": "w6sc-q31", "cat": "culturesswabs", "type": "mc", "stem": "After placing a wound culture swab into its tube, which action should the nurse take?", "options": [{"text": "Secure the top and squeeze the bottom of the tube to activate the culture medium", "correct": true, "rationale": "Activating the medium keeps the specimen viable until the lab processes it. Follow manufacturer instructions."}, {"text": "Leave the cap loose so the specimen can breathe", "correct": false, "rationale": "The top must be secured to prevent contamination."}, {"text": "Refrigerate the tube until the end of the shift", "correct": false, "rationale": "The tube is labeled and sent to the lab in a biohazard bag."}, {"text": "Rinse the swab tip with saline before capping", "correct": false, "rationale": "Rinsing would wash away the specimen."}]},
{"id": "w6sc-q32", "cat": "culturesswabs", "type": "mc", "stem": "Shortly after a wound culture is collected, the client's temperature is 104.4°F (40.2°C) and blood pressure is 84/50 mm Hg. Which action should the nurse take?", "options": [{"text": "Report the findings to the provider immediately", "correct": true, "rationale": "Fever above 104°F with hypotension suggests sepsis and must be reported right away."}, {"text": "Recheck the vital signs in 4 hours", "correct": false, "rationale": "These are manifestations of sepsis; waiting delays urgent care."}, {"text": "Document the findings as expected after wound care", "correct": false, "rationale": "High fever and hypotension are not expected findings."}, {"text": "Collect a second wound culture", "correct": false, "rationale": "The priority is reporting possible sepsis, not repeating the culture."}]},
{"id": "w6sc-q33", "cat": "culturesswabs", "type": "dragdrop", "stem": "A nurse has finished collecting a wound culture. Which information should the nurse document? Move the correct items to the answer box.", "leftLabel": "Information", "rightLabel": "Document", "options": [{"text": "Date and time of collection", "correct": true, "rationale": "Date and time are required documentation for the specimen."}, {"text": "Collection method used", "correct": true, "rationale": "The method of collection is documented."}, {"text": "Description of the wound and drainage", "correct": true, "rationale": "Wound and drainage findings are documented."}, {"text": "Wound dressing change", "correct": true, "rationale": "The dressing change performed after collection is documented."}, {"text": "The lab technician's phone number", "correct": false, "rationale": "This is not part of wound culture documentation."}, {"text": "The room temperature", "correct": false, "rationale": "This is not part of wound culture documentation."}]},
{"id": "w6sc-q34", "cat": "culturesswabs", "type": "mc", "stem": "A nurse taught a client how to collect a sputum specimen. Which statement by the client indicates understanding?", "options": [{"text": "\"I'll rinse my mouth with water, take a few deep breaths, and cough into the cup in the morning.\"", "correct": true, "rationale": "Morning collection, a water rinse, deep breathing, and coughing produce a specimen from the lungs."}, {"text": "\"I'll gargle with mouthwash first so the sample is clean.\"", "correct": false, "rationale": "Mouthwash may contain antibacterial agents that affect results."}, {"text": "\"I'll spit into the cup whenever I have extra saliva.\"", "correct": false, "rationale": "The specimen must come from the lungs, not saliva."}, {"text": "\"I'll wipe the inside of the cup with a tissue before using it.\"", "correct": false, "rationale": "Touching the inside of the cup contaminates it."}]},
{"id": "w6sc-q35", "cat": "urine", "type": "mc", "stem": "A nurse taught a client about a 24-hour urine collection. Which statement by the client indicates understanding?", "options": [{"text": "\"I'll urinate and throw that away when we start, then save all my urine for the next 24 hours.\"", "correct": true, "rationale": "The first void is discarded and timing starts; all urine for the next 24 hours is saved."}, {"text": "\"I'll save the first urine of the morning as the start of the collection.\"", "correct": false, "rationale": "The first void is discarded, not saved."}, {"text": "\"I only need to save the urine I make during the day.\"", "correct": false, "rationale": "All urine for the full 24 hours is collected."}, {"text": "\"I don't need to urinate at the end of the 24 hours.\"", "correct": false, "rationale": "The client voids at the end to empty the bladder, and that urine is included."}]},
{"id": "w6sc-q36", "cat": "culturesswabs", "type": "mc", "stem": "A nurse is preparing to admit a client who is suspected to have pulmonary tuberculosis and has a prescription for sputum AFB specimens. Which action should the nurse take first?", "options": [{"text": "Implement airborne precautions", "correct": true, "rationale": "Preventing airborne transmission of TB to others is the priority safety action."}, {"text": "Obtain the first sputum specimen", "correct": false, "rationale": "Specimens are needed to confirm the diagnosis, but protecting others from exposure comes first."}, {"text": "Teach the client to rinse with water before coughing", "correct": false, "rationale": "Teaching is important but is not the priority."}, {"text": "Schedule the remaining specimens 8 to 24 hours apart", "correct": false, "rationale": "Planning the collection is not the priority over preventing transmission."}]},
{"id": "w6sc-q37", "cat": "culturesswabs", "type": "dragdrop", "stem": "A nurse is observing a UAP collect specimens. Which UAP actions require the nurse to intervene? Move the correct actions to the answer box.", "leftLabel": "UAP actions", "rightLabel": "Requires intervention", "options": [{"text": "Squeezing the client's finger to get more blood for a glucose test", "correct": true, "rationale": "Do not squeeze or milk the finger during capillary glucose testing."}, {"text": "Pouring urine from a catheter drainage bag into a specimen cup", "correct": true, "rationale": "Never take urine from a drainage bag connected to the client."}, {"text": "Including toilet tissue with the stool specimen", "correct": true, "rationale": "Stool specimens should not contain urine or toilet tissue."}, {"text": "Performing the point-of-care occult blood test", "correct": true, "rationale": "Point-of-care occult blood testing may not be delegated to the UAP."}, {"text": "Wiping away the first drop of blood before testing glucose", "correct": false, "rationale": "This is correct capillary glucose technique."}, {"text": "Collecting a walnut-sized formed stool specimen", "correct": false, "rationale": "This is the correct amount for a formed stool specimen."}]},
{"id": "w6sc-q38", "cat": "bloodspecimens", "type": "mc", "stem": "A nurse cleans the client's fingertip, punctures it, and applies the first drop of blood to the glucose strip. Which part of the procedure was incorrect?", "options": [{"text": "Applying the first drop of blood to the strip", "correct": true, "rationale": "The first drop should be wiped away before the sample is applied."}, {"text": "Cleaning the fingertip", "correct": false, "rationale": "Site cleansing is an expected step."}, {"text": "Puncturing the fingertip", "correct": false, "rationale": "Puncturing the selected site is an expected step."}, {"text": "Using a fingertip as the site", "correct": false, "rationale": "The fingertip is an acceptable site."}]},
{"id": "w6sc-q39", "cat": "urine", "type": "mc", "stem": "A nurse starts a 24-hour urine collection at 0700 by having the client void into the collection container and saving it. What was the error?", "options": [{"text": "The first void should have been discarded", "correct": true, "rationale": "At the start of a 24-hour collection, the client voids, that urine is discarded, and the time starts."}, {"text": "The collection should start at midnight", "correct": false, "rationale": "The collection can begin at any time; the start time is noted."}, {"text": "The container should not be used until the end", "correct": false, "rationale": "Urine is added to the container throughout the 24 hours."}, {"text": "There was no error", "correct": false, "rationale": "Saving the first void adds urine made before the collection period."}]},
{"id": "w6sc-q40", "cat": "urine", "type": "mc", "stem": "A nurse instructs a male client to clean from the shaft up toward the urinary meatus before a clean-catch specimen. What is wrong with this instruction?", "options": [{"text": "Cleaning should start at the meatus and move down the shaft", "correct": true, "rationale": "Cleaning in a circular motion from the meatus outward moves bacteria away from the urethral opening."}, {"text": "The foreskin should not be retracted", "correct": false, "rationale": "The foreskin is retracted to clean the meatus."}, {"text": "Only one towelette should be used for the whole area", "correct": false, "rationale": "Each towelette is used only once."}, {"text": "Male clients do not need to clean before a clean catch", "correct": false, "rationale": "Cleaning the perineal area at the meatus is required for both sexes."}]}
