<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" width="900" height="530" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" role="img" aria-label="Bed positions" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Bed positions</title>
