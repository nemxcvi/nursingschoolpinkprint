<text x="30" y="505" font-size="12" fill="#6E6472" text-anchor="start" font-weight="normal" font-style="normal">Semi-Fowler's: tube feedings and dysphagia. High-Fowler's: severe dyspnea, meals. Reverse Trendelenburg: reflux.</text>
