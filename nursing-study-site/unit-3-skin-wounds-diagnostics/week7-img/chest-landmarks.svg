<text x="30" y="462" font-size="12" fill="#6E6472" text-anchor="start" font-weight="normal" font-style="normal">Percuss and auscultate over the intercostal spaces, side to side. Right lung: 3 lobes (middle lobe via the axilla). Left lung: 2.</text>
