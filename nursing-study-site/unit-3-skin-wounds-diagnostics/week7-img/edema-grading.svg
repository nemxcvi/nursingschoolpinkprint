<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" width="860" height="320" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" role="img" aria-label="Pitting edema grading" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Pitting edema grading</title>
<rect width="860" height="320" fill="#FFFFFF"/>
<text x="30" y="40" font-size="20" fill="#2E2433" text-anchor="start" font-weight="bold" font-style="normal">Pitting edema grading</text>
<text x="30" y="62" font-size="13" fill="#6E6472" text-anchor="start" font-weight="normal" font-style="normal">Press at least 5 seconds over a bony prominence, then release.</text>
<path d="M30,140 L90,140 L100,158 L140,158 L150,140 L210,140 L210,250 L30,250 Z" fill="#F6EEE9" stroke="#2E2433" stroke-width="1.5"/>
<line x1="225" y1="140" x2="225" y2="158" stroke="#C2347A" stroke-width="2"/>
<line x1="219" y1="140" x2="231" y2="140" stroke="#C2347A" stroke-width="2"/>
<line x1="219" y1="158" x2="231" y2="158" stroke="#C2347A" stroke-width="2"/>
<text x="120" y="115" font-size="16" fill="#2E2433" text-anchor="middle" font-weight="bold" font-style="normal">1+ Trace</text>
<text x="120" y="280" font-size="14" fill="#C2347A" text-anchor="middle" font-weight="bold" font-style="normal">2 mm</text>
<text x="120" y="300" font-size="13" fill="#6E6472" text-anchor="middle" font-weight="normal" font-style="normal">Rapid response</text>
<path d="M235,140 L295,140 L305,176 L345,176 L355,140 L415,140 L415,250 L235,250 Z" fill="#F6EEE9" stroke="#2E2433" stroke-width="1.5"/>
<line x1="430" y1="140" x2="430" y2="176" stroke="#C2347A" stroke-width="2"/>
<line x1="424" y1="140" x2="436" y2="140" stroke="#C2347A" stroke-width="2"/>
<line x1="424" y1="176" x2="436" y2="176" stroke="#C2347A" stroke-width="2"/>
<text x="325" y="115" font-size="16" fill="#2E2433" text-anchor="middle" font-weight="bold" font-style="normal">2+ Mild</text>
<text x="325" y="280" font-size="14" fill="#C2347A" text-anchor="middle" font-weight="bold" font-style="normal">4 mm</text>
<text x="325" y="300" font-size="13" fill="#6E6472" text-anchor="middle" font-weight="normal" font-style="normal">10–15 sec</text>
<path d="M440,140 L500,140 L510,194 L550,194 L560,140 L620,140 L620,250 L440,250 Z" fill="#F6EEE9" stroke="#2E2433" stroke-width="1.5"/>
<line x1="635" y1="140" x2="635" y2="194" stroke="#C2347A" stroke-width="2"/>
<line x1="629" y1="140" x2="641" y2="140" stroke="#C2347A" stroke-width="2"/>
<line x1="629" y1="194" x2="641" y2="194" stroke="#C2347A" stroke-width="2"/>
<text x="530" y="115" font-size="16" fill="#2E2433" text-anchor="middle" font-weight="bold" font-style="normal">3+ Moderate</text>
<text x="530" y="280" font-size="14" fill="#C2347A" text-anchor="middle" font-weight="bold" font-style="normal">6 mm</text>
<text x="530" y="300" font-size="13" fill="#6E6472" text-anchor="middle" font-weight="normal" font-style="normal">Prolonged</text>
<path d="M645,140 L705,140 L715,212 L755,212 L765,140 L825,140 L825,250 L645,250 Z" fill="#F6EEE9" stroke="#2E2433" stroke-width="1.5"/>
<line x1="840" y1="140" x2="840" y2="212" stroke="#C2347A" stroke-width="2"/>
<line x1="834" y1="140" x2="846" y2="140" stroke="#C2347A" stroke-width="2"/>
<line x1="834" y1="212" x2="846" y2="212" stroke="#C2347A" stroke-width="2"/>
<text x="735" y="115" font-size="16" fill="#2E2433" text-anchor="middle" font-weight="bold" font-style="normal">4+ Severe</text>
<text x="735" y="280" font-size="14" fill="#C2347A" text-anchor="middle" font-weight="bold" font-style="normal">8 mm</text>
<text x="735" y="300" font-size="13" fill="#6E6472" text-anchor="middle" font-weight="normal" font-style="normal">Prolonged</text>
</svg>
