<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" role="img" aria-label="Cardiac auscultation sites" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Cardiac auscultation sites</title>
<rect width="900" height="520" fill="#FFFFFF"/>
<text x="30" y="40" font-size="20" fill="#2E2433" text-anchor="start" font-weight="bold" font-style="normal">Cardiac auscultation sites (APETM)</text>
<text x="30" y="64" font-size="14" fill="#6E6472" text-anchor="start" font-weight="normal" font-style="normal">"All Pigs Eat Too Much": Aortic, Pulmonic, Erb's point, Tricuspid, Mitral</text>
<rect x="358" y="110" width="44" height="300" fill="#F6EEE9" stroke="#2E2433" stroke-width="1.5"/>
<text x="380" y="100" font-size="12" fill="#6E6472" text-anchor="middle" font-weight="normal" font-style="normal">Sternum</text>
<line x1="130" y1="160" x2="358" y2="160" stroke="#D9D1DC" stroke-width="1.5"/>
<line x1="402" y1="160" x2="630" y2="160" stroke="#D9D1DC" stroke-width="1.5"/>
<text x="118" y="165" font-size="12" fill="#6E6472" text-anchor="end" font-weight="normal" font-style="normal">ICS 2</text>
<line x1="130" y1="220" x2="358" y2="220" stroke="#D9D1DC" stroke-width="1.5"/>
<line x1="402" y1="220" x2="630" y2="220" stroke="#D9D1DC" stroke-width="1.5"/>
<text x="118" y="225" font-size="12" fill="#6E6472" text-anchor="end" font-weight="normal" font-style="normal">ICS 3</text>
<line x1="130" y1="280" x2="358" y2="280" stroke="#D9D1DC" stroke-width="1.5"/>
<line x1="402" y1="280" x2="630" y2="280" stroke="#D9D1DC" stroke-width="1.5"/>
<text x="118" y="285" font-size="12" fill="#6E6472" text-anchor="end" font-weight="normal" font-style="normal">ICS 4</text>
<line x1="130" y1="340" x2="358" y2="340" stroke="#D9D1DC" stroke-width="1.5"/>
<line x1="402" y1="340" x2="630" y2="340" stroke="#D9D1DC" stroke-width="1.5"/>
<text x="118" y="345" font-size="12" fill="#6E6472" text-anchor="end" font-weight="normal" font-style="normal">ICS 5</text>
<line x1="540" y1="100" x2="540" y2="430" stroke="#6E6472" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="540" y="450" font-size="12" fill="#6E6472" text-anchor="middle" font-weight="normal" font-style="normal">Left midclavicular line</text>
<text x="200" y="470" font-size="13" fill="#6E6472" text-anchor="middle" font-weight="normal" font-style="italic">Client's right</text>
<text x="560" y="470" font-size="13" fill="#6E6472" text-anchor="middle" font-weight="normal" font-style="italic">Client's left</text>
<rect x="329.0" y="149.0" width="22" height="22" fill="#C2347A"/>
<text x="340" y="165" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-style="normal">A</text>
<line x1="332" y1="152" x2="310" y2="126" stroke="#C2347A" stroke-width="1"/>
<text x="310" y="102" font-size="14" fill="#2E2433" text-anchor="end" font-weight="bold" font-style="normal">Aortic</text>
<text x="310" y="118" font-size="12" fill="#6E6472" text-anchor="end" font-weight="normal" font-style="normal">2nd ICS, right sternal border</text>
<rect x="409.0" y="149.0" width="22" height="22" fill="#C2347A"/>
<text x="420" y="165" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-style="normal">P</text>
<line x1="434" y1="160" x2="640" y2="134" stroke="#C2347A" stroke-width="1"/>
<text x="646" y="132" font-size="14" fill="#2E2433" text-anchor="start" font-weight="bold" font-style="normal">Pulmonic</text>
<text x="646" y="148" font-size="11" fill="#6E6472" text-anchor="start" font-weight="normal" font-style="normal">2nd ICS, left sternal border</text>
<rect x="409.0" y="209.0" width="22" height="22" fill="#C2347A"/>
<text x="420" y="225" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-style="normal">E</text>
<line x1="434" y1="220" x2="640" y2="212" stroke="#C2347A" stroke-width="1"/>
<text x="646" y="210" font-size="14" fill="#2E2433" text-anchor="start" font-weight="bold" font-style="normal">Erb's point</text>
<text x="646" y="226" font-size="11" fill="#6E6472" text-anchor="start" font-weight="normal" font-style="normal">3rd ICS, left sternal border</text>
<rect x="409.0" y="269.0" width="22" height="22" fill="#C2347A"/>
<text x="420" y="285" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-style="normal">T</text>
<line x1="434" y1="280" x2="640" y2="290" stroke="#C2347A" stroke-width="1"/>
<text x="646" y="288" font-size="14" fill="#2E2433" text-anchor="start" font-weight="bold" font-style="normal">Tricuspid</text>
<text x="646" y="304" font-size="11" fill="#6E6472" text-anchor="start" font-weight="normal" font-style="normal">4th ICS, left sternal border</text>
<rect x="529.0" y="329.0" width="22" height="22" fill="#C2347A"/>
<text x="540" y="345" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-style="normal">M</text>
<line x1="554" y1="340" x2="640" y2="368" stroke="#C2347A" stroke-width="1"/>
<text x="646" y="366" font-size="14" fill="#2E2433" text-anchor="start" font-weight="bold" font-style="normal">Apical / mitral (PMI)</text>
<text x="646" y="382" font-size="11" fill="#6E6472" text-anchor="start" font-weight="normal" font-style="normal">5th ICS, left midclavicular line</text>
<text x="30" y="505" font-size="13" fill="#2E2433" text-anchor="start" font-weight="normal" font-style="normal">S1 (lub) is loudest at the apex; S2 (dub) is loudest at the base (aortic and pulmonic areas).</text>
</svg>
