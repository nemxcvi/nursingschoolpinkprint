<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" role="img" aria-label="Unexpected events" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Unexpected events</title>
<rect width="900" height="260" fill="#FFFFFF"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C2347A"/></marker></defs>
<text x="30" y="40" font-size="20" fill="#2E2433" text-anchor="start" font-weight="bold" font-style="normal">Unexpected events, from least to most severe</text>
<rect x="30" y="70" width="195" height="120" fill="#FFFFFF" stroke="#C2347A" stroke-width="1.5"/>
<text x="42" y="100" font-size="15" fill="#2E2433" text-anchor="start" font-weight="bold" font-style="normal">Near miss</text>
<text x="42" y="125" font-size="12" fill="#6E6472" text-anchor="start" font-weight="normal" font-style="normal">Error caught before it</text>
<text x="42" y="142" font-size="12" fill="#6E6472" text-anchor="start" font-weight="normal" font-style="normal">reached the client</text>
<line x1="227" y1="130" x2="243" y2="130" stroke="#C2347A" stroke-width="2" marker-end="url(#ah)"/>
<rect x="245" y="70" width="195" height="120" fill="#FDF1F6" stroke="#C2347A" stroke-width="1.5"/>
<text x="257" y="100" font-size="15" fill="#2E2433" text-anchor="start" font-weight="bold" font-style="normal">Client safety event</text>
<text x="257" y="125" font-size="12" fill="#6E6472" text-anchor="start" font-weight="normal" font-style="normal">Reached the client;</text>
<text x="257" y="142" font-size="12" fill="#6E6472" text-anchor="start" font-weight="normal" font-style="normal">could have caused harm</text>
<line x1="442" y1="130" x2="458" y2="130" stroke="#C2347A" stroke-width="2" marker-end="url(#ah)"/>
<rect x="460" y="70" width="195" height="120" fill="#F8D9E6" stroke="#C2347A" stroke-width="1.5"/>
<text x="472" y="100" font-size="15" fill="#2E2433" text-anchor="start" font-weight="bold" font-style="normal">Adverse event</text>
<text x="472" y="125" font-size="12" fill="#6E6472" text-anchor="start" font-weight="normal" font-style="normal">Unexpected harm to the</text>
<text x="472" y="142" font-size="12" fill="#6E6472" text-anchor="start" font-weight="normal" font-style="normal">client</text>
<line x1="657" y1="130" x2="673" y2="130" stroke="#C2347A" stroke-width="2" marker-end="url(#ah)"/>
<rect x="675" y="70" width="195" height="120" fill="#F1B9CF" stroke="#C2347A" stroke-width="1.5"/>
<text x="687" y="100" font-size="15" fill="#2E2433" text-anchor="start" font-weight="bold" font-style="normal">Sentinel event</text>
<text x="687" y="125" font-size="12" fill="#6E6472" text-anchor="start" font-weight="normal" font-style="normal">Death, permanent harm,</text>
<text x="687" y="142" font-size="12" fill="#6E6472" text-anchor="start" font-weight="normal" font-style="normal">or severe temporary</text>
<text x="687" y="159" font-size="12" fill="#6E6472" text-anchor="start" font-weight="normal" font-style="normal">harm</text>
<text x="30" y="225" font-size="12" fill="#6E6472" text-anchor="start" font-weight="normal" font-style="normal">All are reported with an occurrence report after the client is safe and leadership is notified. Reports are not punitive.</text>
</svg>
