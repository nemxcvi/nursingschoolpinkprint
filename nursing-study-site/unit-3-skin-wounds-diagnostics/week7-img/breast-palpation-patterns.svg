<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" role="img" aria-label="Breast palpation patterns" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Breast palpation patterns</title>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="30" y="40" font-size="20" fill="#2E2433" text-anchor="start" font-weight="bold" font-style="normal">Breast palpation patterns</text>
<text x="30" y="62" font-size="12" fill="#6E6472" text-anchor="start" font-weight="normal" font-style="normal">Pads of three middle fingers; cover sternum to posterior axillary line and clavicle to bra line, including the tail of Spence.</text>
<rect x="30" y="90" width="200" height="200" fill="#F6EEE9" stroke="#D9D1DC" stroke-width="1"/>
<text x="130" y="315" font-size="15" fill="#2E2433" text-anchor="middle" font-weight="bold" font-style="normal">Circular</text>
<circle cx="130" cy="190" r="85" fill="none" stroke="#C2347A" stroke-width="2"/>
<circle cx="130" cy="190" r="62" fill="none" stroke="#C2347A" stroke-width="2"/>
<circle cx="130" cy="190" r="40" fill="none" stroke="#C2347A" stroke-width="2"/>
<circle cx="130" cy="190" r="18" fill="none" stroke="#C2347A" stroke-width="2"/>
<rect x="270" y="90" width="200" height="200" fill="#F6EEE9" stroke="#D9D1DC" stroke-width="1"/>
<text x="370" y="315" font-size="15" fill="#2E2433" text-anchor="middle" font-weight="bold" font-style="normal">Wedge (spokes)</text>
<line x1="370" y1="190" x2="455.0" y2="190.0" stroke="#C2347A" stroke-width="2"/>
<line x1="370" y1="190" x2="430.10407640085657" y2="250.10407640085654" stroke="#C2347A" stroke-width="2"/>
<line x1="370" y1="190" x2="370.0" y2="275.0" stroke="#C2347A" stroke-width="2"/>
<line x1="370" y1="190" x2="309.8959235991435" y2="250.10407640085654" stroke="#C2347A" stroke-width="2"/>
<line x1="370" y1="190" x2="285.0" y2="190.0" stroke="#C2347A" stroke-width="2"/>
<line x1="370" y1="190" x2="309.89592359914343" y2="129.89592359914346" stroke="#C2347A" stroke-width="2"/>
<line x1="370" y1="190" x2="370.0" y2="105.0" stroke="#C2347A" stroke-width="2"/>
<line x1="370" y1="190" x2="430.1040764008565" y2="129.89592359914343" stroke="#C2347A" stroke-width="2"/>
<rect x="365.0" y="185.0" width="10" height="10" fill="#2E2433"/>
<rect x="510" y="90" width="200" height="200" fill="#F6EEE9" stroke="#D9D1DC" stroke-width="1"/>
