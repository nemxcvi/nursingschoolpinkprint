<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" width="760" height="170" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" role="img" aria-label="Morse Fall Scale risk levels" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Morse Fall Scale risk levels</title>
<rect width="760" height="170" fill="#FFFFFF"/>
<text x="30" y="40" font-size="20" fill="#2E2433" text-anchor="start" font-weight="bold" font-style="normal">Morse Fall Scale risk levels</text>
<rect x="30.0" y="70" width="250.0" height="50" fill="#E2F2F1" stroke="#23807F" stroke-width="1.5"/>
<text x="155.0" y="92" font-size="16" fill="#23807F" text-anchor="middle" font-weight="bold" font-style="normal">Low</text>
<text x="155.0" y="112" font-size="13" fill="#2E2433" text-anchor="middle" font-weight="normal" font-style="normal">0–24</text>
<rect x="280.0" y="70" width="200.0" height="50" fill="#FFF2D6" stroke="#9A6B00" stroke-width="1.5"/>
<text x="380.0" y="92" font-size="16" fill="#9A6B00" text-anchor="middle" font-weight="bold" font-style="normal">Moderate</text>
<text x="380.0" y="112" font-size="13" fill="#2E2433" text-anchor="middle" font-weight="normal" font-style="normal">25–44</text>
<rect x="480.0" y="70" width="250.0" height="50" fill="#FBE6F0" stroke="#C2347A" stroke-width="1.5"/>
<text x="605.0" y="92" font-size="16" fill="#C2347A" text-anchor="middle" font-weight="bold" font-style="normal">High</text>
<text x="605.0" y="112" font-size="13" fill="#2E2433" text-anchor="middle" font-weight="normal" font-style="normal">45 or higher</text>
<text x="30" y="150" font-size="12" fill="#6E6472" text-anchor="start" font-weight="normal" font-style="normal">Factors: history of falling, secondary diagnosis, ambulatory aid, IV access, gait, mental status.</text>
</svg>
