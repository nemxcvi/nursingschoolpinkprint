<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" role="img" aria-label="Six cardinal positions of gaze" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Six cardinal positions of gaze</title>
<rect width="680" height="380" fill="#FFFFFF"/>
<defs><marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B4C9A"/></marker></defs>
<text x="30" y="40" font-size="20" fill="#2E2433" text-anchor="start" font-weight="bold" font-style="normal">Six cardinal positions of gaze</text>
<text x="30" y="62" font-size="13" fill="#6E6472" text-anchor="start" font-weight="normal" font-style="normal">Client follows your finger in a wide "H" without moving their head (CN III, IV, VI).</text>
<line x1="170" y1="110" x2="170" y2="290" stroke="#D9D1DC" stroke-width="3"/>
<line x1="450" y1="110" x2="450" y2="290" stroke="#D9D1DC" stroke-width="3"/>
<line x1="170" y1="200" x2="450" y2="200" stroke="#D9D1DC" stroke-width="3"/>
<line x1="310" y1="200" x2="182" y2="120" stroke="#6B4C9A" stroke-width="1.6" marker-end="url(#av)"/>
<rect x="162.0" y="102.0" width="16" height="16" fill="#6B4C9A"/>
<line x1="310" y1="200" x2="182" y2="200" stroke="#6B4C9A" stroke-width="1.6" marker-end="url(#av)"/>
<rect x="162.0" y="192.0" width="16" height="16" fill="#6B4C9A"/>
<line x1="310" y1="200" x2="182" y2="280" stroke="#6B4C9A" stroke-width="1.6" marker-end="url(#av)"/>
<rect x="162.0" y="282.0" width="16" height="16" fill="#6B4C9A"/>
<line x1="310" y1="200" x2="438" y2="120" stroke="#6B4C9A" stroke-width="1.6" marker-end="url(#av)"/>
<rect x="442.0" y="102.0" width="16" height="16" fill="#6B4C9A"/>
<line x1="310" y1="200" x2="438" y2="200" stroke="#6B4C9A" stroke-width="1.6" marker-end="url(#av)"/>
<rect x="442.0" y="192.0" width="16" height="16" fill="#6B4C9A"/>
<line x1="310" y1="200" x2="438" y2="280" stroke="#6B4C9A" stroke-width="1.6" marker-end="url(#av)"/>
<rect x="442.0" y="282.0" width="16" height="16" fill="#6B4C9A"/>
<rect x="301.0" y="191.0" width="18" height="18" fill="#C2347A"/>
<text x="170" y="92" font-size="12" fill="#6E6472" text-anchor="middle" font-weight="normal" font-style="italic">Client's right</text>
<text x="450" y="92" font-size="12" fill="#6E6472" text-anchor="middle" font-weight="normal" font-style="italic">Client's left</text>
<text x="30" y="345" font-size="12" fill="#6E6472" text-anchor="start" font-weight="normal" font-style="normal">Start at midline and return to midline between directions. Expect smooth, full movement;</text>
<text x="30" y="362" font-size="12" fill="#6E6472" text-anchor="start" font-weight="normal" font-style="normal">a few beats of nystagmus in far lateral gaze is expected, but more is abnormal.</text>
</svg>
