<text x="30" y="538" font-size="13" fill="#2E2433" text-anchor="start" font-weight="bold" font-style="normal">Sensory only: I, II, VIII.  Motor only: III, IV, VI, XI, XII.  Both: V, VII, IX, X.</text>
