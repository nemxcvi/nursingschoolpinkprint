<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" width="820" height="480" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" role="img" aria-label="Spinal curves" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Spinal curves</title>
<rect width="820" height="480" fill="#FFFFFF"/>
<text x="30" y="40" font-size="20" fill="#2E2433" text-anchor="start" font-weight="bold" font-style="normal">Spinal curves (side view)</text>
<text x="30" y="62" font-size="13" fill="#6E6472" text-anchor="start" font-weight="normal" font-style="normal">Expected double S curve; inspect from the side and from behind.</text>
<path d="M170,90 C135,130 135,160 170,200 C215,240 215,280 170,310 C135,335 135,355 160,375 C190,395 205,405 200,420" fill="none" stroke="#2E2433" stroke-width="10" stroke-linecap="butt"/>
<text x="170" y="440" font-size="15" fill="#2E2433" text-anchor="middle" font-weight="bold" font-style="normal">Expected</text>
<text x="170" y="458" font-size="12" fill="#6E6472" text-anchor="middle" font-weight="normal" font-style="normal">double S curve</text>
<text x="240" y="145" font-size="13" fill="#2E2433" text-anchor="start" font-weight="normal" font-style="normal">Cervical: concave</text>
<text x="240" y="255" font-size="13" fill="#2E2433" text-anchor="start" font-weight="normal" font-style="normal">Thoracic: convex</text>
<text x="240" y="340" font-size="13" fill="#2E2433" text-anchor="start" font-weight="normal" font-style="normal">Lumbar: concave</text>
<text x="240" y="405" font-size="13" fill="#2E2433" text-anchor="start" font-weight="normal" font-style="normal">Sacral: convex</text>
<text x="80" y="90" font-size="12" fill="#6E6472" text-anchor="middle" font-weight="normal" font-style="italic">Front</text>
<text x="270" y="90" font-size="12" fill="#6E6472" text-anchor="middle" font-weight="normal" font-style="italic">Back</text>
<path d="M480,90 C450,130 460,160 490,190 C570,240 550,300 490,325 C455,345 460,365 475,380 C495,395 505,405 500,420" fill="none" stroke="#C2347A" stroke-width="10" stroke-linecap="butt"/>
<text x="480" y="440" font-size="15" fill="#2E2433" text-anchor="middle" font-weight="bold" font-style="normal">Kyphosis</text>
<text x="480" y="458" font-size="12" fill="#6E6472" text-anchor="middle" font-weight="normal" font-style="normal">exaggerated thoracic curve</text>
<text x="480" y="470" font-size="1" fill="#2E2433" text-anchor="start" font-weight="normal" font-style="normal"></text>
<path d="M700,90 C670,130 670,160 700,200 C740,240 730,270 700,295 C620,330 640,360 690,380 C720,395 730,405 725,420" fill="none" stroke="#6B4C9A" stroke-width="10" stroke-linecap="butt"/>
<text x="700" y="440" font-size="15" fill="#2E2433" text-anchor="middle" font-weight="bold" font-style="normal">Lordosis</text>
<text x="700" y="458" font-size="12" fill="#6E6472" text-anchor="middle" font-weight="normal" font-style="normal">exaggerated lumbar curve</text>
</svg>
