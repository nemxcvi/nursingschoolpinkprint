<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" role="img" aria-label="Tonsil grading" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Tonsil grading</title>
<rect width="860" height="300" fill="#FFFFFF"/>
<text x="30" y="40" font-size="20" fill="#2E2433" text-anchor="start" font-weight="bold" font-style="normal">Tonsil grading</text>
<rect x="30" y="70" width="180" height="150" fill="#5A2A3A" stroke="#2E2433" stroke-width="1.5"/>
<path d="M108,70 L132,70 L127,130 L113,130 Z" fill="#E8A0B4"/>
<rect x="30" y="90" width="10" height="110" fill="#E8A0B4" stroke="#E8A0B4" stroke-width="0"/>
<rect x="200" y="90" width="10" height="110" fill="#E8A0B4" stroke="#E8A0B4" stroke-width="0"/>
<text x="120" y="245" font-size="16" fill="#2E2433" text-anchor="middle" font-weight="bold" font-style="normal">+1</text>
<text x="120" y="265" font-size="13" fill="#6E6472" text-anchor="middle" font-weight="normal" font-style="normal">Barely visible</text>
<rect x="235" y="70" width="180" height="150" fill="#5A2A3A" stroke="#2E2433" stroke-width="1.5"/>
<path d="M313,70 L337,70 L332,130 L318,130 Z" fill="#E8A0B4"/>
<rect x="235" y="90" width="40" height="110" fill="#E8A0B4" stroke="#E8A0B4" stroke-width="0"/>
<rect x="375" y="90" width="40" height="110" fill="#E8A0B4" stroke="#E8A0B4" stroke-width="0"/>
<text x="325" y="245" font-size="16" fill="#2E2433" text-anchor="middle" font-weight="bold" font-style="normal">+2</text>
<text x="325" y="265" font-size="13" fill="#6E6472" text-anchor="middle" font-weight="normal" font-style="normal">Halfway to the uvula</text>
<rect x="440" y="70" width="180" height="150" fill="#5A2A3A" stroke="#2E2433" stroke-width="1.5"/>
<path d="M518,70 L542,70 L537,130 L523,130 Z" fill="#E8A0B4"/>
<rect x="440" y="90" width="80" height="110" fill="#E8A0B4" stroke="#E8A0B4" stroke-width="0"/>
<rect x="540" y="90" width="80" height="110" fill="#E8A0B4" stroke="#E8A0B4" stroke-width="0"/>
<text x="530" y="245" font-size="16" fill="#2E2433" text-anchor="middle" font-weight="bold" font-style="normal">+3</text>
<text x="530" y="265" font-size="13" fill="#6E6472" text-anchor="middle" font-weight="normal" font-style="normal">Touching the uvula</text>
<rect x="645" y="70" width="180" height="150" fill="#5A2A3A" stroke="#2E2433" stroke-width="1.5"/>
<path d="M723,70 L747,70 L742,130 L728,130 Z" fill="#E8A0B4"/>
<rect x="645" y="90" width="90" height="110" fill="#E8A0B4" stroke="#E8A0B4" stroke-width="0"/>
<rect x="735" y="90" width="90" height="110" fill="#E8A0B4" stroke="#E8A0B4" stroke-width="0"/>
<text x="735" y="245" font-size="16" fill="#2E2433" text-anchor="middle" font-weight="bold" font-style="normal">+4</text>
<text x="735" y="265" font-size="13" fill="#6E6472" text-anchor="middle" font-weight="normal" font-style="normal">Touching each other</text>
<text x="30" y="285" font-size="11" fill="#6E6472" text-anchor="start" font-weight="normal" font-style="normal">Center strip = uvula; side blocks = tonsils.</text>
</svg>
