<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" role="img" aria-label="RACE and PASS" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>RACE and PASS</title>
<rect width="900" height="400" fill="#FFFFFF"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C2347A"/></marker></defs>
<text x="30" y="40" font-size="20" fill="#2E2433" text-anchor="start" font-weight="bold" font-style="normal">Fire response</text>
<text x="30" y="70" font-size="15" fill="#2E2433" text-anchor="start" font-weight="bold" font-style="normal">RACE: if you discover a fire</text>
<rect x="30" y="85" width="190" height="95" fill="#FBE6F0" stroke="#C2347A" stroke-width="1.5"/>
<rect x="30" y="85" width="42" height="95" fill="#C2347A" stroke="#C2347A" stroke-width="0"/>
<text x="51" y="142" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-style="normal">R</text>
<text x="82" y="118" font-size="16" fill="#2E2433" text-anchor="start" font-weight="bold" font-style="normal">Rescue</text>
<text x="82" y="140" font-size="12" fill="#6E6472" text-anchor="start" font-weight="normal" font-style="normal">Move clients in</text>
<text x="82" y="156" font-size="12" fill="#6E6472" text-anchor="start" font-weight="normal" font-style="normal">immediate danger</text>
<line x1="222" y1="132" x2="242" y2="132" stroke="#C2347A" stroke-width="2" marker-end="url(#ah)"/>
<rect x="245" y="85" width="190" height="95" fill="#FFFFFF" stroke="#C2347A" stroke-width="1.5"/>
<rect x="245" y="85" width="42" height="95" fill="#C2347A" stroke="#C2347A" stroke-width="0"/>
<text x="266" y="142" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-style="normal">A</text>
<text x="297" y="118" font-size="16" fill="#2E2433" text-anchor="start" font-weight="bold" font-style="normal">Alarm</text>
<text x="297" y="140" font-size="12" fill="#6E6472" text-anchor="start" font-weight="normal" font-style="normal">Pull alarm,</text>
<text x="297" y="156" font-size="12" fill="#6E6472" text-anchor="start" font-weight="normal" font-style="normal">report location</text>
<line x1="437" y1="132" x2="457" y2="132" stroke="#C2347A" stroke-width="2" marker-end="url(#ah)"/>
<rect x="460" y="85" width="190" height="95" fill="#FFFFFF" stroke="#C2347A" stroke-width="1.5"/>
<rect x="460" y="85" width="42" height="95" fill="#C2347A" stroke="#C2347A" stroke-width="0"/>
<text x="481" y="142" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-style="normal">C</text>
<text x="512" y="118" font-size="16" fill="#2E2433" text-anchor="start" font-weight="bold" font-style="normal">Contain</text>
<text x="512" y="140" font-size="12" fill="#6E6472" text-anchor="start" font-weight="normal" font-style="normal">Close doors and</text>
<text x="512" y="156" font-size="12" fill="#6E6472" text-anchor="start" font-weight="normal" font-style="normal">windows, turn off O2</text>
<line x1="652" y1="132" x2="672" y2="132" stroke="#C2347A" stroke-width="2" marker-end="url(#ah)"/>
<rect x="675" y="85" width="190" height="95" fill="#FFFFFF" stroke="#C2347A" stroke-width="1.5"/>
<rect x="675" y="85" width="42" height="95" fill="#C2347A" stroke="#C2347A" stroke-width="0"/>
<text x="696" y="142" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-style="normal">E</text>
<text x="727" y="118" font-size="16" fill="#2E2433" text-anchor="start" font-weight="bold" font-style="normal">Evacuate</text>
<text x="727" y="140" font-size="12" fill="#6E6472" text-anchor="start" font-weight="normal" font-style="normal">Extinguish small</text>
<text x="727" y="156" font-size="12" fill="#6E6472" text-anchor="start" font-weight="normal" font-style="normal">fires only if trained</text>
<text x="30" y="230" font-size="15" fill="#2E2433" text-anchor="start" font-weight="bold" font-style="normal">PASS: using an extinguisher</text>
<rect x="30" y="245" width="190" height="95" fill="#FBE6F0" stroke="#C2347A" stroke-width="1.5"/>
<rect x="30" y="245" width="42" height="95" fill="#C2347A" stroke="#C2347A" stroke-width="0"/>
<text x="51" y="302" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-style="normal">P</text>
<text x="82" y="278" font-size="16" fill="#2E2433" text-anchor="start" font-weight="bold" font-style="normal">Pull</text>
<text x="82" y="300" font-size="12" fill="#6E6472" text-anchor="start" font-weight="normal" font-style="normal">the pin</text>
<text x="82" y="316" font-size="12" fill="#6E6472" text-anchor="start" font-weight="normal" font-style="normal"></text>
<line x1="222" y1="292" x2="242" y2="292" stroke="#C2347A" stroke-width="2" marker-end="url(#ah)"/>
<rect x="245" y="245" width="190" height="95" fill="#FFFFFF" stroke="#C2347A" stroke-width="1.5"/>
<rect x="245" y="245" width="42" height="95" fill="#C2347A" stroke="#C2347A" stroke-width="0"/>
<text x="266" y="302" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-style="normal">A</text>
<text x="297" y="278" font-size="16" fill="#2E2433" text-anchor="start" font-weight="bold" font-style="normal">Aim</text>
<text x="297" y="300" font-size="12" fill="#6E6472" text-anchor="start" font-weight="normal" font-style="normal">at the base of</text>
<text x="297" y="316" font-size="12" fill="#6E6472" text-anchor="start" font-weight="normal" font-style="normal">the fire</text>
<line x1="437" y1="292" x2="457" y2="292" stroke="#C2347A" stroke-width="2" marker-end="url(#ah)"/>
<rect x="460" y="245" width="190" height="95" fill="#FFFFFF" stroke="#C2347A" stroke-width="1.5"/>
<rect x="460" y="245" width="42" height="95" fill="#C2347A" stroke="#C2347A" stroke-width="0"/>
<text x="481" y="302" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-style="normal">S</text>
<text x="512" y="278" font-size="16" fill="#2E2433" text-anchor="start" font-weight="bold" font-style="normal">Squeeze</text>
<text x="512" y="300" font-size="12" fill="#6E6472" text-anchor="start" font-weight="normal" font-style="normal">the handle</text>
<text x="512" y="316" font-size="12" fill="#6E6472" text-anchor="start" font-weight="normal" font-style="normal"></text>
<line x1="652" y1="292" x2="672" y2="292" stroke="#C2347A" stroke-width="2" marker-end="url(#ah)"/>
<rect x="675" y="245" width="190" height="95" fill="#FFFFFF" stroke="#C2347A" stroke-width="1.5"/>
<rect x="675" y="245" width="42" height="95" fill="#C2347A" stroke="#C2347A" stroke-width="0"/>
<text x="696" y="302" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-style="normal">S</text>
<text x="727" y="278" font-size="16" fill="#2E2433" text-anchor="start" font-weight="bold" font-style="normal">Sweep</text>
<text x="727" y="300" font-size="12" fill="#6E6472" text-anchor="start" font-weight="normal" font-style="normal">side to side</text>
<text x="727" y="316" font-size="12" fill="#6E6472" text-anchor="start" font-weight="normal" font-style="normal"></text>
<text x="30" y="380" font-size="12" fill="#6E6472" text-anchor="start" font-weight="normal" font-style="italic">ATI lists RACE "E" as Extinguish. Priority on discovering a fire: rescue clients nearest the fire.</text>
</svg>
