var bank = [
{"id": "w7sf-q01", "cat": "nationalperformancegoalscultureofsafety", "type": "mc", "stem": "A nurse is preparing to give a client their medications. Which action should the nurse take to identify the client?", "options": [{"text": "Check the room number and the client's name on the door", "correct": false, "rationale": "Room numbers can change and should never be used as an identifier."}, {"text": "Ask the client to state their name and date of birth, then compare to the ID band", "correct": true, "rationale": "Two identifiers, asked open-ended and confirmed with the ID band or EMR, are required."}, {"text": "Ask, \"Are you Mr. Lee?\"", "correct": false, "rationale": "A yes/no question can get an incorrect \"yes\"; use open-ended questions."}, {"text": "Skip barcode scanning if the client is well known to the nurse", "correct": false, "rationale": "Barcode scanning should never be skipped."}]},
{"id": "w7sf-q02", "cat": "nationalperformancegoalscultureofsafety", "type": "mc", "stem": "A nurse receives a critical sodium level of 120 mEq/L for a client. How should the nurse communicate this result?", "options": [{"text": "Leave a detailed voicemail for the provider", "correct": false, "rationale": "Critical results are never given by voicemail."}, {"text": "Send a message through the EMR inbox at end of shift", "correct": false, "rationale": "Critical results must be reported promptly within the facility's time frame."}, {"text": "Call or tell the provider directly and document the notification", "correct": true, "rationale": "Critical results go directly to the provider in person or by phone, with written documentation of who reported and who received."}, {"text": "Wait for the provider's next rounds", "correct": false, "rationale": "Waiting delays treatment of a potentially life-threatening result."}]},
{"id": "w7sf-q03", "cat": "nationalperformancegoalscultureofsafety", "type": "mc", "stem": "A nurse on a busy ICU notices staff silencing monitor alarms without checking the clients. Which concept does this describe?", "options": [{"text": "Alarm fatigue", "correct": true, "rationale": "Frequent nuisance alarms desensitize staff, leading to slower or missed responses."}, {"text": "Near miss", "correct": false, "rationale": "A near miss is an error caught before it reaches the client."}, {"text": "Sentinel event", "correct": false, "rationale": "A sentinel event is a critical, unexpected event causing severe harm."}, {"text": "Workplace bullying", "correct": false, "rationale": "Bullying is repeated harassment, not desensitization to alarms."}]},
{"id": "w7sf-q04", "cat": "communicationunexpectedevents", "type": "dragdrop", "stem": "Drag the events that are sentinel events into the answer box.", "leftLabel": "Unexpected events", "rightLabel": "Sentinel events", "options": [{"text": "Surgery performed on the wrong body part", "correct": true, "rationale": "Wrong-site surgery is a critical, unexpected event causing severe harm."}, {"text": "Infant abduction", "correct": true, "rationale": "Infant abduction is a sentinel event."}, {"text": "Client suicide in the facility", "correct": true, "rationale": "Client suicide in the facility is a sentinel event."}, {"text": "Fall resulting in a hip fracture", "correct": true, "rationale": "A fall with serious injury is a sentinel event."}, {"text": "Wrong medication caught during reconciliation before it is given", "correct": false, "rationale": "An error caught before reaching the client is a near miss."}, {"text": "NPO client is served a tray and the procedure is delayed", "correct": false, "rationale": "An event that could have caused harm is a client safety event."}, {"text": "Client falls and sprains a wrist", "correct": false, "rationale": "Unexpected harm that is not severe is an adverse event."}, {"text": "Expected death from a terminal illness", "correct": false, "rationale": "Expected outcomes of illness are not sentinel events."}]},
{"id": "w7sf-q05", "cat": "communicationunexpectedevents", "type": "mc", "stem": "During medication reconciliation, a nurse notices a client who takes Celebrex at home has been prescribed Celexa. The nurse clarifies with the provider before any dose is given. How should this be classified?", "options": [{"text": "Near miss", "correct": true, "rationale": "The error was caught before it reached the client."}, {"text": "Adverse event", "correct": false, "rationale": "An adverse event means harm reached the client."}, {"text": "Sentinel event", "correct": false, "rationale": "A sentinel event causes death or severe harm."}, {"text": "Client safety event", "correct": false, "rationale": "A client safety event reaches the client with or without injury; this error was caught first."}]},
{"id": "w7sf-q06", "cat": "communicationunexpectedevents", "type": "mc", "stem": "A client falls in their room. After making sure the client is safe and notifying the nurse leader and provider, which action should the nurse take?", "options": [{"text": "Document the incident report in the client's progress notes", "correct": false, "rationale": "The occurrence report is a separate document."}, {"text": "Complete an occurrence report", "correct": true, "rationale": "Occurrence reports track events to prevent recurrence and are completed after the client is safe and leadership is notified."}, {"text": "Wait for risk management to decide if a report is needed", "correct": false, "rationale": "The nurse is responsible for reporting events per policy."}, {"text": "Avoid reporting so the staff member isn't punished", "correct": false, "rationale": "Occurrence reports are not punitive."}]},
{"id": "w7sf-q07", "cat": "communicationunexpectedevents", "type": "sata", "stem": "Which client situations should prompt the nurse to call the rapid response team? Select all that apply.", "options": [{"text": "Oxygen saturation stays low despite oxygen", "correct": true, "rationale": "Low SpO2 despite oxygenation efforts warrants the RRT."}, {"text": "New-onset seizure", "correct": true, "rationale": "A seizure warrants the RRT."}, {"text": "Chest pain not relieved by nitroglycerin", "correct": true, "rationale": "Unrelieved chest pain warrants the RRT."}, {"text": "Sudden change in mental status", "correct": true, "rationale": "A sudden mental status change warrants the RRT."}, {"text": "One elevated blood glucose reading", "correct": false, "rationale": "A single high glucose is assessed and reported to the provider, not an RRT call."}, {"text": "Client asks for pain medication", "correct": false, "rationale": "A routine request is handled by the nurse."}]},
{"id": "w7sf-q08", "cat": "communicationunexpectedevents", "type": "mc", "stem": "A nurse is calling a provider using ISBARR. What is the purpose of the \"read back\" step?", "options": [{"text": "Introduce yourself and your unit", "correct": false, "rationale": "That is the Identity step."}, {"text": "Share the client's history and medications", "correct": false, "rationale": "That is the Background step."}, {"text": "Repeat the provider's order to confirm it was understood correctly", "correct": true, "rationale": "Read back allows clarification of any miscommunication."}, {"text": "Recommend what the nurse wants to happen", "correct": false, "rationale": "That is the Recommendation step."}]},
{"id": "w7sf-q09", "cat": "nationalperformancegoalscultureofsafety", "type": "mc", "stem": "Which action is the single most important way to prevent hospital-associated infections?", "options": [{"text": "Giving prophylactic antibiotics", "correct": false, "rationale": "Antibiotic overuse contributes to MDROs."}, {"text": "Hand hygiene", "correct": true, "rationale": "Hand hygiene is the single most important step to prevent the spread of infection."}, {"text": "Placing every client in isolation", "correct": false, "rationale": "Isolation is used for specific infections, not every client."}, {"text": "Changing linens twice daily", "correct": false, "rationale": "Linen changes don't replace hand hygiene."}]},
{"id": "w7sf-q10", "cat": "homecommunitysafety", "type": "dragdrop", "stem": "A home health nurse is teaching an older adult about reducing home hazards. Drag the recommendations the nurse should include into the answer box.", "leftLabel": "Home safety tips", "rightLabel": "Recommended for older adults", "options": [{"text": "Install grab bars by the toilet and in the shower", "correct": true, "rationale": "Grab bars give a secure handhold and reduce falls."}, {"text": "Secure electrical cords along the edges of the floor", "correct": true, "rationale": "Securing cords along walls prevents tripping."}, {"text": "Paint the walls one color", "correct": true, "rationale": "One color reflects more light and improves visibility."}, {"text": "Use bright or motion-sensor lighting", "correct": true, "rationale": "Bright lighting helps clients with decreased vision."}, {"text": "Use an electric razor", "correct": true, "rationale": "An electric razor prevents cuts, especially for clients taking anticoagulants."}, {"text": "Keep throw rugs in high-traffic areas", "correct": false, "rationale": "Loose rugs are trip hazards and should be removed."}, {"text": "Use chairs with wheels on carpet", "correct": false, "rationale": "Wheeled or swivel chairs increase fall risk."}, {"text": "Set the water heater to 130°F", "correct": false, "rationale": "The water heater should be no higher than 120°F (49°C) to prevent scalding."}, {"text": "Install dim lighting in hallways", "correct": false, "rationale": "Dim lighting increases fall risk."}]},
{"id": "w7sf-q11", "cat": "nationalperformancegoalscultureofsafety", "type": "mc", "stem": "A nurse is reviewing a client's home and prescribed medications on admission. Which process is the nurse performing?", "options": [{"text": "Time-out", "correct": false, "rationale": "A time-out is a pause before a procedure."}, {"text": "Medication reconciliation", "correct": true, "rationale": "Medication reconciliation compares home medications with new prescriptions to find and resolve discrepancies."}, {"text": "Handoff report", "correct": false, "rationale": "Handoff transfers care between nurses."}, {"text": "Waived testing", "correct": false, "rationale": "Waived testing is simple point-of-care lab testing."}]},
{"id": "w7sf-q12", "cat": "nationalperformancegoalscultureofsafety", "type": "mc", "stem": "A client tells the nurse they have thoughts of suicide and a plan. Which action should the nurse take?", "options": [{"text": "Check on the client every 30 minutes", "correct": false, "rationale": "A client with active suicidal thoughts or a plan needs continuous observation."}, {"text": "Stay with the client and ensure continuous observation", "correct": true, "rationale": "Never leave a client with active suicidal thoughts or a plan alone."}, {"text": "Give the client privacy to process their feelings", "correct": false, "rationale": "Leaving the client alone is unsafe."}, {"text": "Remove items only if the client asks", "correct": false, "rationale": "Harmful items should be removed proactively using an environmental checklist."}]},
{"id": "w7sf-q13", "cat": "fallsinjuryprevention", "type": "mc", "stem": "A nurse is caring for a client who has a history of falls. Which action is the nurse's priority?", "options": [{"text": "Complete a fall-risk assessment", "correct": true, "rationale": "Assessment comes first and guides the individualized plan of care."}, {"text": "Educate the client and family about fall risks", "correct": false, "rationale": "Education is important but not the priority."}, {"text": "Remove hazards from the room", "correct": false, "rationale": "Removing hazards helps but follows assessment."}, {"text": "Make sure the client uses assistive aids", "correct": false, "rationale": "Aids help but are not the first action."}]},
{"id": "w7sf-q14", "cat": "fallsinjuryprevention", "type": "sata", "stem": "A nurse is reviewing universal fall precautions with new nurses. Which actions should the nurse include? Select all that apply.", "options": [{"text": "Provide nonskid footwear", "correct": true, "rationale": "Nonskid footwear provides traction."}, {"text": "Keep the bed in the low position with wheels locked", "correct": true, "rationale": "A low, locked bed reduces injury and prevents rolling during transfers."}, {"text": "Place the call light and belongings within reach", "correct": true, "rationale": "Items in reach prevent the client from reaching and falling."}, {"text": "Provide adequate lighting", "correct": true, "rationale": "Good lighting reduces trips and falls."}, {"text": "Raise all four side rails for an alert client", "correct": false, "rationale": "Full side rails for a client who gets up can lead to climbing over them and are considered a restraint."}, {"text": "Keep the bed in the high position when not giving care", "correct": false, "rationale": "A high bed increases injury if the client falls."}]},
{"id": "w7sf-q15", "cat": "fallsinjuryprevention", "type": "mc", "stem": "A client's Morse Fall Scale score is 50. How should the nurse interpret this score?", "options": [{"text": "Low fall risk", "correct": false, "rationale": "Low risk is 0 to 24."}, {"text": "Moderate fall risk", "correct": false, "rationale": "Moderate risk is 25 to 44."}, {"text": "High fall risk", "correct": true, "rationale": "A score of 45 or higher is high fall risk."}, {"text": "The score cannot be interpreted without a provider", "correct": false, "rationale": "Nurses interpret the Morse score to plan interventions."}]},
{"id": "w7sf-q16", "cat": "fallsinjuryprevention", "type": "mc", "stem": "A client who has orthostatic hypotension asks how to get out of bed safely. Which instruction should the nurse give?", "options": [{"text": "\"Stand up quickly so you don't get dizzy.\"", "correct": false, "rationale": "Rising quickly worsens orthostatic dizziness."}, {"text": "\"Sit on the side of the bed for a few seconds, then stand for a few seconds before walking.\"", "correct": true, "rationale": "Rising slowly in stages lets blood pressure adjust and reduces falls."}, {"text": "\"Only get up when no one is around to help.\"", "correct": false, "rationale": "Clients at risk should call for assistance."}, {"text": "\"Keep all four side rails up so you can pull yourself up.\"", "correct": false, "rationale": "Full side rails can lead to climbing and falls."}]},
{"id": "w7sf-q17", "cat": "restraintsseizures", "type": "mc", "stem": "A confused client keeps trying to get out of bed, and the nurse raises all four side rails to keep the client in bed. How should this action be classified?", "options": [{"text": "A fall precaution only", "correct": false, "rationale": "Rails used to keep a client from exiting the bed are a restraint."}, {"text": "A restraint", "correct": true, "rationale": "Using all four side rails to restrict a client from leaving the bed is a barrier restraint."}, {"text": "A chemical restraint", "correct": false, "rationale": "Chemical restraints are medications."}, {"text": "Seclusion", "correct": false, "rationale": "Seclusion is placing a client alone in a locked room."}]},
{"id": "w7sf-q18", "cat": "restraintsseizures", "type": "mc", "stem": "A provider prescribes a mechanical restraint to keep a client from pulling at an IV line. Which device is the least restrictive?", "options": [{"text": "Hand mitt", "correct": true, "rationale": "The hand mitt (a soft restraint) is the least restrictive mechanical restraint."}, {"text": "Soft wrist restraint", "correct": false, "rationale": "Wrist restraints are the next least restrictive after the mitt."}, {"text": "Vest restraint", "correct": false, "rationale": "Vest restraints are more restrictive and many facilities no longer use them due to strangulation risk."}, {"text": "Four-point restraints", "correct": false, "rationale": "Four-point restraints are the most restrictive."}]},
{"id": "w7sf-q19", "cat": "restraintsseizures", "type": "sata", "stem": "A nurse is applying wrist restraints to a client. Which actions should the nurse take? Select all that apply.", "options": [{"text": "Pad bony prominences", "correct": true, "rationale": "Padding prevents skin breakdown under the restraint."}, {"text": "Make sure two fingers fit between the restraint and the wrist", "correct": true, "rationale": "This prevents impaired circulation while keeping the restraint secure."}, {"text": "Use a quick-release knot", "correct": true, "rationale": "A quick-release knot allows fast removal in an emergency."}, {"text": "Tie the restraint to the movable part of the bed frame", "correct": true, "rationale": "The bed frame moves with the bed, so the restraint doesn't tighten."}, {"text": "Tie the restraint to the side rail", "correct": false, "rationale": "Raising or lowering the rail can injure the client."}, {"text": "Apply the restraint as tightly as possible", "correct": false, "rationale": "Overly tight restraints impair circulation and cause skin injury."}]},
{"id": "w7sf-q20", "cat": "restraintsseizures", "type": "mc", "stem": "A provider writes a restraint prescription for an adult client. Which statement about the prescription is correct?", "options": [{"text": "It can be written as PRN for agitation", "correct": false, "rationale": "PRN restraint prescriptions are not allowed."}, {"text": "It is limited to 4 hours and can be renewed up to 24 consecutive hours", "correct": true, "rationale": "Adult restraint prescriptions last 4 hours and are renewable up to 24 consecutive hours."}, {"text": "It lasts 24 hours without renewal", "correct": false, "rationale": "Prescriptions must be renewed; they are limited to 4 hours at a time."}, {"text": "The nurse can write it if the provider is unavailable", "correct": false, "rationale": "Only the provider writes the prescription, after a face-to-face assessment."}]},
{"id": "w7sf-q21", "cat": "restraintsseizures", "type": "mc", "stem": "A nurse applies restraints in an emergency because a client is about to harm a staff member. Which action must follow?", "options": [{"text": "No order is needed for emergency restraints", "correct": false, "rationale": "An order is still required."}, {"text": "Obtain the provider's order within 1 hour", "correct": true, "rationale": "When restraints are applied in an emergency, the provider's order must be obtained within 1 hour."}, {"text": "Obtain the order within 24 hours", "correct": false, "rationale": "24 hours is the reevaluation interval, not the time frame for an emergency order."}, {"text": "Obtain the order at the next scheduled rounds", "correct": false, "rationale": "This delay is not acceptable."}]},
{"id": "w7sf-q22", "cat": "restraintsseizures", "type": "mc", "stem": "During a restraint check, a nurse finds the client's hand cool and pale distal to a wrist restraint. Which action should the nurse take first?", "options": [{"text": "Remove the restraint immediately", "correct": true, "rationale": "With impaired circulation, remove the restraint first, then reassess and notify the provider."}, {"text": "Loosen the restraint by one finger-width", "correct": false, "rationale": "Impaired circulation requires immediate removal."}, {"text": "Document the finding and recheck in 2 hours", "correct": false, "rationale": "Delaying could cause tissue damage."}, {"text": "Reapply the restraint on the other wrist", "correct": false, "rationale": "Don't reapply without a provider order."}]},
{"id": "w7sf-q23", "cat": "restraintsseizures", "type": "mc", "stem": "Which situation is an appropriate indication for a restraint after less restrictive measures have failed?", "options": [{"text": "The client has refused medications for 2 days", "correct": false, "rationale": "Refusing medications is the client's right and is not an indication."}, {"text": "The client has removed their indwelling urinary catheter twice", "correct": true, "rationale": "Removing needed medical devices is an indication for restraints once alternatives fail."}, {"text": "The client argues about discharge instructions", "correct": false, "rationale": "Disagreement is not an indication."}, {"text": "The staff is short-handed tonight", "correct": false, "rationale": "Restraints are never used for staff convenience or staffing shortages."}]},
{"id": "w7sf-q24", "cat": "restraintsseizures", "type": "dragdrop", "stem": "Drag the interventions the nurse should try before using restraints into the answer box.", "leftLabel": "Interventions", "rightLabel": "Try before restraints", "options": [{"text": "Offer diversional activities", "correct": true, "rationale": "Diversion is a less restrictive alternative."}, {"text": "Move the client to a room near the nurses' station", "correct": true, "rationale": "Closer observation is a less restrictive alternative."}, {"text": "Encourage a family member or sitter at the bedside", "correct": true, "rationale": "Companionship is a less restrictive alternative."}, {"text": "Use a bed or chair alarm", "correct": true, "rationale": "Alarms alert staff when the client gets up."}, {"text": "Reorient the client", "correct": true, "rationale": "Reorientation can reduce unsafe behavior."}, {"text": "Apply soft wrist restraints", "correct": false, "rationale": "Restraints are the last resort."}, {"text": "Give a sedative to calm the client", "correct": false, "rationale": "Medication to control behavior is a chemical restraint."}, {"text": "Place the client in seclusion", "correct": false, "rationale": "Seclusion is an environmental restraint."}]},
{"id": "w7sf-q25", "cat": "restraintsseizures", "type": "mc", "stem": "A client begins having a generalized seizure. Which action should the nurse take?", "options": [{"text": "Insert a tongue blade between the teeth", "correct": false, "rationale": "Nothing should be placed in the mouth; a tongue blade can cause injury and obstruction."}, {"text": "Hold the client's arms and legs still", "correct": false, "rationale": "Never restrain a client during a seizure."}, {"text": "Turn the client onto their side", "correct": true, "rationale": "Side-lying allows secretions to drain and helps keep the airway open."}, {"text": "Leave to get help from the nurses' station", "correct": false, "rationale": "Stay with the client and use the call light."}]},
{"id": "w7sf-q26", "cat": "restraintsseizures", "type": "mc", "stem": "A client is recovering from a seizure. Which assessment should the nurse complete before offering food or fluids?", "options": [{"text": "Blood pressure", "correct": false, "rationale": "Vital signs are assessed, but they don't show swallowing safety."}, {"text": "Gag reflex and ability to follow directions", "correct": true, "rationale": "Checking the gag reflex and ability to follow directions protects against aspiration."}, {"text": "Pupil response", "correct": false, "rationale": "Pupil checks are part of the neuro assessment but don't show swallowing safety."}, {"text": "Anticonvulsant drug level", "correct": false, "rationale": "Drug levels may be ordered but don't determine safety to eat."}]},
{"id": "w7sf-q27", "cat": "restraintsseizures", "type": "dragdrop", "stem": "A client with a seizure history is admitted. Drag the items that are part of seizure precautions into the answer box.", "leftLabel": "Supplies and actions", "rightLabel": "Seizure precautions", "options": [{"text": "Suction equipment at the bedside", "correct": true, "rationale": "Suction helps prevent aspiration of secretions."}, {"text": "Oxygen at the bedside", "correct": true, "rationale": "Oxygen is set up in case saturation drops."}, {"text": "Padded side rails", "correct": true, "rationale": "Padding prevents injury during a seizure."}, {"text": "IV access", "correct": true, "rationale": "IV access allows immediate medication administration."}, {"text": "Baseline vital signs and SpO2", "correct": true, "rationale": "A baseline helps the nurse detect changes."}, {"text": "Tongue blade taped to the headboard", "correct": false, "rationale": "Nothing is placed in the mouth during a seizure."}, {"text": "Wrist restraints at the bedside", "correct": false, "rationale": "Clients are never restrained during a seizure."}, {"text": "Tight-fitting clothing", "correct": false, "rationale": "Constrictive clothing and jewelry are removed."}]},
{"id": "w7sf-q28", "cat": "environmentalemergencysafety", "type": "mc", "stem": "A nurse sees smoke coming from a client's room. Which action is the nurse's priority?", "options": [{"text": "Move the clients nearest the fire to safety", "correct": true, "rationale": "Rescue is the first step of RACE."}, {"text": "Activate the fire alarm", "correct": false, "rationale": "Alarm is the second step."}, {"text": "Close all doors on the unit", "correct": false, "rationale": "Containing the fire comes after rescue and alarm."}, {"text": "Find a fire extinguisher", "correct": false, "rationale": "Extinguishing or evacuating comes last."}]},
{"id": "w7sf-q29", "cat": "environmentalemergencysafety", "type": "mc", "stem": "A nurse is using a fire extinguisher. Where should the nurse aim?", "options": [{"text": "At the top of the flames", "correct": false, "rationale": "Aiming high doesn't reach the fuel source."}, {"text": "At the base of the fire", "correct": true, "rationale": "PASS: Pull, Aim at the base, Squeeze, Sweep side to side."}, {"text": "At the center of the smoke", "correct": false, "rationale": "Smoke rises away from the fuel source."}, {"text": "At the nearest wall", "correct": false, "rationale": "Aim directly at the base of the fire."}]},
{"id": "w7sf-q30", "cat": "environmentalemergencysafety", "type": "mc", "stem": "A fire cannot be contained, and clients must be moved. Which type of evacuation is preferred?", "options": [{"text": "Lateral evacuation to a safe area on the same floor", "correct": true, "rationale": "Lateral (horizontal) evacuation is preferred."}, {"text": "Vertical evacuation to the ground floor", "correct": false, "rationale": "Vertical evacuation is used only when lateral isn't enough."}, {"text": "Using the elevators to move clients quickly", "correct": false, "rationale": "Elevators are not used during fires."}, {"text": "Leaving clients in their rooms with doors open", "correct": false, "rationale": "Doors should be closed, and clients in danger are moved."}]},
{"id": "w7sf-q31", "cat": "environmentalemergencysafety", "type": "mc", "stem": "An active shooter is reported in the hospital. Which action should the nurse take first if possible?", "options": [{"text": "Run away from the shooter", "correct": true, "rationale": "The priority is run, then hide, then fight."}, {"text": "Hide in a supply closet", "correct": false, "rationale": "Hiding is used if running isn't possible."}, {"text": "Confront the shooter", "correct": false, "rationale": "Fighting is the last resort."}, {"text": "Call the family of each client", "correct": false, "rationale": "Personal safety and escape come first."}]},
{"id": "w7sf-q32", "cat": "environmentalemergencysafety", "type": "mc", "stem": "A nurse is caring for a client with a radioactive implant. Which action reduces the nurse's radiation exposure?", "options": [{"text": "Stay at the bedside as long as possible to provide care", "correct": false, "rationale": "More time near the source increases the dose."}, {"text": "Increase distance from the client when not providing direct care", "correct": true, "rationale": "Time, distance, and shielding reduce radiation exposure."}, {"text": "Avoid wearing a lead apron so care is quicker", "correct": false, "rationale": "Shielding decreases the dose."}, {"text": "Handle the client's urine without gloves", "correct": false, "rationale": "Body fluids of clients with radioactive implants are handled with PPE."}]},
{"id": "w7sf-q33", "cat": "environmentalemergencysafety", "type": "mc", "stem": "Which type of radiation is the most serious and requires lead shielding?", "options": [{"text": "Alpha", "correct": false, "rationale": "Alpha radiation is the least risk and doesn't penetrate clothing."}, {"text": "Beta", "correct": false, "rationale": "Beta radiation is the middle level of risk."}, {"text": "Gamma", "correct": true, "rationale": "Gamma radiation penetrates clothing and body tissue and requires lead shielding."}, {"text": "Ultraviolet", "correct": false, "rationale": "Ultraviolet is not one of the three categories discussed."}]},
{"id": "w7sf-q34", "cat": "environmentalemergencysafety", "type": "mc", "stem": "Why is potassium iodide given after a radiation mass-casualty event?", "options": [{"text": "To treat skin burns", "correct": false, "rationale": "Potassium iodide doesn't treat burns."}, {"text": "To saturate the thyroid so it won't absorb radioactive iodine", "correct": true, "rationale": "Potassium iodide fills the thyroid, blocking uptake of radioactive iodine."}, {"text": "To remove radiation from clothing", "correct": false, "rationale": "Contaminated clothing is removed and discarded."}, {"text": "To prevent nausea and vomiting", "correct": false, "rationale": "It is not an antiemetic."}]},
{"id": "w7sf-q35", "cat": "homecommunitysafety", "type": "mc", "stem": "A client who uses home oxygen asks how far open flames should be kept away. Which response is correct?", "options": [{"text": "3 feet", "correct": false, "rationale": "3 feet is the distance for flammables from space heaters."}, {"text": "5 feet", "correct": false, "rationale": "The recommended distance is greater."}, {"text": "10 feet", "correct": true, "rationale": "Open flames, gas stoves, and electrical appliances should be at least 10 feet from where oxygen exits."}, {"text": "Distance doesn't matter if the oxygen is off", "correct": false, "rationale": "Oxygen in the home raises fire risk even when not in use."}]},
{"id": "w7sf-q36", "cat": "ergonomicspositioning", "type": "mc", "stem": "A nurse is lifting a box of supplies from the floor. Which technique should the nurse use?", "options": [{"text": "Bend at the waist with knees straight", "correct": false, "rationale": "Bending at the waist strains the back."}, {"text": "Bend the hips and knees, keep the back straight, and hold the box close", "correct": true, "rationale": "Holding the load close to the center of gravity increases stability and reduces back strain."}, {"text": "Hold the box at arm's length", "correct": false, "rationale": "Arms extended away from the body increases injury risk."}, {"text": "Twist toward the shelf while lifting", "correct": false, "rationale": "Twisting while lifting increases injury risk."}]},
{"id": "w7sf-q37", "cat": "homecommunitysafety", "type": "mc", "stem": "A client reports headache, nausea, and weakness after running a gas heater in a closed room. Which condition should the nurse suspect?", "options": [{"text": "Carbon monoxide poisoning", "correct": true, "rationale": "CO causes nausea, vomiting, headache, weakness, and unconsciousness."}, {"text": "Food poisoning", "correct": false, "rationale": "Food poisoning is caused by bacteria in food, not fuel-burning devices."}, {"text": "Heat stroke", "correct": false, "rationale": "Heat stroke causes temperature over 40°C with hot, dry skin."}, {"text": "Altitude sickness", "correct": false, "rationale": "Altitude sickness occurs at high elevations."}]},
{"id": "w7sf-q38", "cat": "firstaidemergencies", "type": "mc", "stem": "A client's temperature is 40.5°C (104.9°F) after heat exposure. Which findings should the nurse expect?", "options": [{"text": "Bradycardia and bradypnea", "correct": false, "rationale": "Heat stroke causes tachycardia and tachypnea."}, {"text": "Hot, dry skin with hypotension and tachycardia", "correct": true, "rationale": "Heat stroke causes hot, dry skin (no sweating), hypotension, tachycardia, and tachypnea."}, {"text": "Cool, clammy skin", "correct": false, "rationale": "The client doesn't sweat; the skin is hot and dry."}, {"text": "Hypertension and profuse sweating", "correct": false, "rationale": "Heat stroke causes hypotension and no sweating."}]},
{"id": "w7sf-q39", "cat": "firstaidemergencies", "type": "mc", "stem": "A nurse is performing a primary survey on a client with a life-threatening injury. Which should the nurse assess first?", "options": [{"text": "Airway", "correct": true, "rationale": "The airway is the most important step; without a patent airway the other steps are futile."}, {"text": "Breathing", "correct": false, "rationale": "Breathing is assessed after the airway is established."}, {"text": "Circulation", "correct": false, "rationale": "Circulation is assessed after breathing."}, {"text": "Level of consciousness", "correct": false, "rationale": "LOC (Disability) comes after circulation."}]},
{"id": "w7sf-q40", "cat": "ergonomicspositioning", "type": "mc", "stem": "A client receiving enteral tube feedings has dysphagia. Which position should the nurse use?", "options": [{"text": "Supine", "correct": false, "rationale": "Lying flat doesn't prevent regurgitation."}, {"text": "Semi-Fowler's (head of bed 30–45°)", "correct": true, "rationale": "Semi-Fowler's prevents regurgitation and aspiration in clients receiving tube feedings."}, {"text": "Trendelenburg", "correct": false, "rationale": "Head lower than feet promotes regurgitation."}, {"text": "Lateral semi-prone recumbent", "correct": false, "rationale": "This position promotes regurgitation."}]}
