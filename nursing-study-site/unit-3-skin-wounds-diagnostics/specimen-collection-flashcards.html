<script>
var CATS = {
  stool: {label:"Stool", hue:"red"},
  urine: {label:"Urine", hue:"yellow"},
  culturesswabs: {label:"Cultures &amp; Swabs", hue:"green"},
  bloodspecimens: {label:"Blood Specimens", hue:"blue"}
};
var CARDS = [
[1, "stool", "Stool specimen amount", "Formed stool: 1 inch (walnut-sized). Liquid stool: 15–30 mL"],
[2, "stool", "Before collecting stool", "Have the client urinate first, then deposit stool in a dry, clean container. No urine, water, or toilet tissue in the sample. Transfer with a tongue blade"],
[3, "stool", "Stool for C. diff", "Place the client on contact isolation until results come back"],
[4, "stool", "Ova and parasites", "Collect three separate stool specimens. A preservative keeps parasites alive for testing"],
[5, "stool", "Stool from an infant", "Apply a urine collection bag, then collect urine-free stool from the diaper. For liquid stool, use a diaper liner"],
[6, "stool", "Fecal occult blood test (FOBT)", "Also called a guaiac test. Screens for colorectal cancer and detects GI bleeding (ulcers, polyps, inflammatory bowel disease)"],
[7, "stool", "FOBT: who and how often", "Recommended for clients over 50 before colonoscopy. Three home samples are more accurate than one office test"],
[8, "stool", "Occult blood: delegation", "The UAP may collect the specimen but may not do the point-of-care test"],
[9, "stool", "Occult blood: medications", "Aspirin, iron, NSAIDs, and anticoagulants can cause false results. Stop 7 days before"],
[10, "stool", "Occult blood: diet", "Avoid red or rare meat, poultry, fish, beets, radishes, melon, and some raw vegetables, starting 3 days before"],
[11, "stool", "Occult blood: vitamin C", "Can cause a false result. Stop 3 days before"],
[12, "stool", "Occult blood: other prep", "Don't collect during menstruation (wait at least 3 days after it ends) or hemorrhoid flares. No barium tests; avoid mineral oil and laxatives"],
[13, "stool", "Occult blood technique", "Two stool areas on one side, flip the card, 2 drops of solution on each box, read in 30–60 seconds (or per manufacturer)"],
[14, "stool", "Dark, tarry stool vs bright red streaks", "Dark and tarry = bleeding high in the GI tract. Bright red = bleeding low (hemorrhoids, menstrual blood), which may give an inaccurate result"],
[15, "stool", "FOBT limits", "Only for stool, not gastric contents. A positive result leads to more tests to find the bleeding"],
[16, "urine", "Urine specimen: delegation", "Collection may be delegated to the UAP"],
[17, "urine", "Urine volumes", "Culture: 10 mL. Urinalysis: 10–30 mL"],
[18, "urine", "Urine documentation", "Collection method, client tolerance, and the urine's color, clarity, and odor"],
[19, "urine", "Clean catch: female", "Separate the labia; clean left side, right side, then center, front to back, with a new wipe each time (2–3 wipes)"],
[20, "urine", "Clean catch: male", "Retract the foreskin; clean in a circular motion from the meatus outward, down the shaft"],
[21, "urine", "Clean catch: collection", "Start voiding into the toilet, stop, then void into the cup. The nurse doesn't need to observe unless necessary"],
[22, "urine", "Urine from children and infants", "Children: a sterile receptacle placed in the toilet. Infants: an adhesive collection bag. Never squeeze urine from a diaper"],
[23, "urine", "Urine from an indwelling catheter", "Clamp tubing 3 in below the port (no more than 30 min), wipe the port, draw at least 10 mL with a syringe, then unclamp"],
[24, "urine", "Urine from the drainage bag", "Never use urine from a bag already connected to the client; it's concentrated or contaminated. Bag urine is OK only when the catheter is first inserted"],
[25, "urine", "Straight cath specimen", "Surgical asepsis; let a small amount of urine drain first, then fill the specimen cup"],
[26, "urine", "24-hour urine", "Discard the first void and start the time. Collect all urine for 24 hr and have the client void at the end. Keep it on ice or refrigerated, per lab guidelines and preservatives"],
[27, "urine", "24-hour urine: missed void", "If the client discards a void, restart the timing. Never remove urine from the container for other tests"],
[28, "urine", "Timed urine uses", "Usually 24 hr (sometimes 2 or 12 hr); measures creatinine clearance, protein, or hormones"],
[29, "urine", "Urine pregnancy test", "First morning void; detects hCG. Document the last menstrual period"],
[30, "urine", "Urine reagent strip (dipstick)", "Screening only; abnormal findings must be confirmed by the lab"],
[31, "urine", "Urine pH and specific gravity", "pH 4.6–8.0. Specific gravity 1.005–1.030; high = concentrated urine (possible dehydration), low = dilute"],
[32, "urine", "Abnormal dipstick findings", "Leukocytes or nitrites: infection. Blood: infection or cancer. Ketones or glucose: diabetes. Bilirubin or urobilinogen: liver disease or RBC destruction"],
[33, "culturesswabs", "Wound culture technique", "Clean the wound with sterile water or NS, then swab clean tissue in the center of the wound, not the edges. Never swab pooled exudate. A sterile syringe can also be used"],
[34, "culturesswabs", "Wound culture and antibiotics", "Collect before broad-spectrum antibiotics. If the client is already on them, note it on the lab requisition"],
[35, "culturesswabs", "Gram stain", "Quick test of wound drainage that lets the provider treat sooner than waiting for culture results"],
[36, "culturesswabs", "Wound culture: report immediately", "Fever higher than 104°F (40°C) with hypotension, which suggests sepsis"],
[37, "culturesswabs", "Sputum specimen", "Morning, before eating or drinking. Blow nose and rinse mouth with water (no mouthwash), deep breaths, then cough. Don't touch inside the cup. Collect 1–2 teaspoons (5–10 mL)"],
[38, "culturesswabs", "Can't produce sputum", "Chest physiotherapy first. Suctioning and transtracheal aspiration are last resorts"],
[39, "culturesswabs", "Sputum lab tests", "Routine culture and sensitivity in a sterile container; AFB (TB) needs 3 serial samples; cytology needs a preservative and identifies lung cancer type"],
[40, "culturesswabs", "AFB sputum", "Three consecutive specimens, 8–24 hr apart"],
[41, "culturesswabs", "Throat culture: delegation", "Do not delegate to the UAP"],
[42, "culturesswabs", "Throat swab path", "Right tonsil → right arch → uvula → left arch → left tonsil. Avoid gums, tongue, and teeth"],
[43, "culturesswabs", "Gum specimen", "Lightly scrape the inside of the cheek with a sterile swab"],
[44, "culturesswabs", "Point-of-care swab tests", "Less accurate than lab tests; confirm positive results"],
[45, "culturesswabs", "Nasal swab: delegation", "Do not delegate to the UAP"],
[46, "culturesswabs", "Nasal swab technique", "Blow nose, check patency, tilt head back. Insert 1.5 cm and rotate at least 4 times for 15 seconds; repeat in the other naris with the same swab"],
[47, "culturesswabs", "Swab tube selection", "Use the correct tube: viral vs bacterial, nasal vs nasopharyngeal"],
[48, "bloodspecimens", "Capillary glucose: delegation", "Usually can be delegated to the UAP"],
[49, "bloodspecimens", "Expected fasting glucose", "74–106 mg/dL"],
[50, "bloodspecimens", "Glucose reading below 60 or above 400", "Retest, and possibly send a sample to the lab. Bedside meters are less accurate than lab testing"],
[51, "bloodspecimens", "Capillary puncture sites", "Fingers usually; palms, forearms, and earlobes are alternatives for clients with sore fingers"],
[52, "bloodspecimens", "Preparing a fingerstick site", "Clean with facility antiseptic or soap and water. Choose a vascular site; have the client warm their hands or dangle them to improve blood flow"],
[53, "bloodspecimens", "Capillary glucose technique", "Check timing in the order (AC &amp; HS vs q6h). Wipe away the first drop, then apply blood when the meter prompts"],
[54, "bloodspecimens", "Why not milk the finger?", "Milking can lyse (break) blood cells and alter results"],
[55, "bloodspecimens", "Where to place the lancet", "The side of the finger, not the central tip (the tip has more nerves)"],
[56, "bloodspecimens", "After a fingerstick", "Hold a tissue or cotton ball at the site; client applies pressure. Usually no bandage needed"],
[57, "bloodspecimens", "Glucometer test strips", "Store closed at room temperature, check the expiration date, match lot numbers. Poor storage can cause falsely high or low readings"],
[58, "bloodspecimens", "Venipuncture", "Also called phlebotomy: drawing blood from a vein with a needle, usually in the arm or hand"],
[59, "bloodspecimens", "Finding a vein", "Tourniquet above the site; client pumps the hand or grips a ball; stroke from distal to proximal (no vigorous rubbing). A transilluminator can help"],
[60, "bloodspecimens", "Before inserting the needle", "Remove the tourniquet once the site is chosen; clean with antiseptic and let it dry completely"],
[61, "bloodspecimens", "Butterfly needles", "Smaller and less painful (good for children and needle-averse clients), but can lyse cells for some tests"],
[62, "bloodspecimens", "Needle gauge", "Larger number = smaller opening", "18-gauge is larger than 22-gauge"],
[63, "bloodspecimens", "Collection tube cap colors", "Show which blood tests can be done from that tube"]
];
initFlashcards(CATS, CARDS);
</script>
