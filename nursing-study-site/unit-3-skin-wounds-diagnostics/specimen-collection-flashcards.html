<script>
var CATS = {
  stool: {label:"Stool", hue:"red"},
  urine: {label:"Urine", hue:"yellow"},
  culturesswabs: {label:"Cultures &amp; Swabs", hue:"green"},
  capillaryglucose: {label:"Capillary Glucose", hue:"blue"}
};
var CARDS = [
[1, "stool", "Stool specimen amount", "Formed stool: 1 inch (walnut-sized). Liquid stool: 15–30 mL"],
[2, "stool", "Stool specimen: avoid", "Urine and toilet tissue in the sample"],
[3, "stool", "Stool for C. diff", "Place the client on contact isolation until results come back"],
[4, "stool", "Ova and parasites", "Collect three separate stool specimens"],
[5, "stool", "Occult blood: delegation", "The UAP may collect the specimen but may not do the point-of-care test"],
[6, "stool", "Occult blood: medications", "NSAIDs, iron, and anticoagulants can cause a false positive. Stop 7 days before"],
[7, "stool", "Occult blood: diet", "Beets, rare meat, radishes, and melon can cause false results. Stop 3 days before"],
[8, "stool", "Occult blood: vitamin C", "Can cause a false result. Stop 3 days before"],
[9, "stool", "Occult blood: menstruation", "Test at least 3 days after the cycle ends"],
[10, "stool", "Occult blood technique", "Two stool areas on one side, flip the card, 2 drops of solution on each box, read in 30–60 seconds"],
[11, "urine", "Urine specimen: delegation", "Collection may be delegated to the UAP"],
[12, "urine", "Urine volumes", "Culture: 10 mL. Urinalysis: 10–30 mL"],
[13, "urine", "Clean catch: female", "Separate the labia; clean each side, then the center, front to back, with 2–3 towelettes"],
[14, "urine", "Clean catch: male", "Retract the foreskin; clean in a circular motion from the meatus down the shaft"],
[15, "urine", "Clean catch: collection", "Start voiding into the toilet, stop, then void into the cup"],
[16, "urine", "Urine from an indwelling catheter", "Clamp tubing 3 in below the port (no more than 30 min), wipe the port, draw at least 10 mL with a syringe, then unclamp"],
[17, "urine", "Urine from the drainage bag", "Never use urine from a bag already connected to the client. Bag urine is OK only at the time of first insertion"],
[18, "urine", "24-hour urine", "Discard the first void and start the time. Collect all urine for 24 hr, have the client void at the end, and refrigerate if required"],
[19, "culturesswabs", "Wound culture technique", "Clean the wound with NS, then rotate the swab on clean wound tissue. Avoid exudate"],
[20, "culturesswabs", "Wound culture: report immediately", "Fever higher than 104°F (40°C) with hypotension, which suggests sepsis"],
[21, "culturesswabs", "Sputum specimen", "Morning is best. Blow nose and rinse mouth with water (no mouthwash), deep breaths, then cough. Don't touch inside the cup. Collect 5–10 mL"],
[22, "culturesswabs", "AFB sputum", "Three consecutive specimens, 8–24 hr apart"],
[23, "culturesswabs", "Throat culture: delegation", "Do not delegate to the UAP"],
[24, "culturesswabs", "Nasal swab: delegation", "Do not delegate to the UAP"],
[25, "culturesswabs", "Nasal swab technique", "Blow nose, check patency, tilt head back. Insert 1.5 cm and rotate at least 4 times for 15 seconds; repeat in the other naris with the same swab"],
[26, "culturesswabs", "Swab tube selection", "Use the correct tube: viral vs bacterial, nasal vs nasopharyngeal"],
[27, "capillaryglucose", "Capillary glucose: delegation", "Usually can be delegated to the UAP"],
[28, "capillaryglucose", "Expected glucose range", "74–106"],
[29, "capillaryglucose", "Capillary glucose technique", "Check timing in the order (AC &amp; HS vs q6h). Don't squeeze or milk the finger. Wipe away the first drop, then apply blood when prompted"]
];
initFlashcards(CATS, CARDS);
