[99, "woundassessment", "Weighing dressings", "1 g = 1 mL of drainage"],

[138, "woundhealing", "How diabetes delays healing", "Decreases perfusion and sensation"],
[139, "woundhealing", "How corticosteroids delay healing", "Prevent collagen and fibroblast formation"],
