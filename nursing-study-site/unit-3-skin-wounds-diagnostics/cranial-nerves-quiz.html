{"id": "u3cn-q01", "cat": "smellvision", "type": "mc", "stem": "With the client's eyes closed and one nostril occluded, the nurse asks the client to identify the smell of coffee. Which cranial nerve is the nurse assessing?", "options": [{"text": "CN I, olfactory", "correct": true, "rationale": "Identifying a familiar scent with the eyes closed, one nostril at a time, tests CN I, the olfactory nerve, which carries the sense of smell."}, {"text": "CN II, optic", "correct": false, "rationale": "CN II carries vision and is tested with the Snellen chart, not with scents."}, {"text": "CN V, trigeminal", "correct": false, "rationale": "CN V carries facial sensation. Irritating odors like alcohol can stimulate it, but identifying a scent like coffee tests CN I."}, {"text": "CN IX, glossopharyngeal", "correct": false, "rationale": "CN IX carries taste on the back of the tongue and helps with swallowing; it does not carry smell."}]},
{"id": "u3cn-q02", "cat": "smellvision", "type": "mc", "stem": "Before asking the client to identify scents, what should the nurse do first?", "options": [{"text": "Check that each nostril is patent", "correct": true, "rationale": "A blocked nostril would keep the scent from reaching the olfactory nerve, so the nurse checks patency before testing CN I."}, {"text": "Hold an alcohol pad under the client's nose", "correct": false, "rationale": "Alcohol should not be used. It stimulates CN V and gives a false response."}, {"text": "Have the client smell with both nostrils open", "correct": false, "rationale": "Each nostril is tested separately, with the other one blocked, so a one-sided loss isn't missed."}, {"text": "Ask the client to keep both eyes open", "correct": false, "rationale": "The client's eyes are closed so they identify the scent by smell alone, not by seeing the item."}]},
{"id": "u3cn-q03", "cat": "smellvision", "type": "sata", "stem": "Which items are appropriate for testing CN I? Select all that apply.", "options": [{"text": "Coffee", "correct": true, "rationale": "Coffee is a familiar, non-irritating scent the client can identify."}, {"text": "Mint", "correct": true, "rationale": "Mint is a familiar, non-irritating scent the client can identify."}, {"text": "Toothpaste", "correct": true, "rationale": "Toothpaste is a familiar, non-irritating scent the client can identify."}, {"text": "An alcohol wipe", "correct": false, "rationale": "Alcohol stimulates CN V, the trigeminal nerve, and gives a false response, so it is not used to test smell."}, {"text": "A cotton swab", "correct": false, "rationale": "A cotton swab has no scent. It is used to test facial sensation for CN V."}]},
{"id": "u3cn-q04", "cat": "smellvision", "type": "mc", "stem": "Why should the nurse avoid using an alcohol wipe when testing the sense of smell?", "options": [{"text": "Alcohol stimulates CN V and gives a false response", "correct": true, "rationale": "Alcohol irritates the nasal lining, which stimulates the trigeminal nerve (CN V). The client may react even if CN I isn't working, giving a false result."}, {"text": "Alcohol has no detectable smell", "correct": false, "rationale": "Alcohol has a strong smell. The problem is that it also stimulates CN V."}, {"text": "Alcohol can damage the optic nerve", "correct": false, "rationale": "Smelling alcohol does not affect CN II, the optic nerve."}, {"text": "Alcohol must stay sterile for injections", "correct": false, "rationale": "Sterility isn't the reason. Alcohol is avoided because it stimulates CN V and gives a false response."}]},
{"id": "u3cn-q05", "cat": "smellvision", "type": "mc", "stem": "The nurse uses a Snellen chart during the neuro assessment. Which cranial nerve does this test?", "options": [{"text": "CN II, optic", "correct": true, "rationale": "The Snellen chart measures visual acuity, which is carried by CN II, the optic nerve."}, {"text": "CN III, oculomotor", "correct": false, "rationale": "CN III moves the eye and controls pupil response. It is tested with cardinal gaze and PERRLA, not visual acuity."}, {"text": "CN IV, trochlear", "correct": false, "rationale": "CN IV moves the eye and is tested with the six cardinal positions of gaze."}, {"text": "CN VI, abducens", "correct": false, "rationale": "CN VI moves the eye outward and is tested with the six cardinal positions of gaze."}]},
{"id": "u3cn-q06", "cat": "smellvision", "type": "mc", "stem": "A client's Snellen result is 20/30. How should the nurse interpret this?", "options": [{"text": "The client sees at 20 feet what a person with normal vision sees at 30 feet", "correct": true, "rationale": "The top number is the client's distance from the chart (20 feet). The bottom number is the distance at which a person with normal vision can read the same line."}, {"text": "The client sees at 30 feet what a person with normal vision sees at 20 feet", "correct": false, "rationale": "This reverses the numbers. The client always stands at 20 feet; the bottom number is where normal vision reads that line."}, {"text": "The client read 20 of 30 letters correctly", "correct": false, "rationale": "The numbers are distances in feet, not a count of letters."}, {"text": "The client's vision is better than normal", "correct": false, "rationale": "20/30 is slightly worse than 20/20, not better."}]},
{"id": "u3cn-q07", "cat": "smellvision", "type": "mc", "stem": "How far from the Snellen chart should the client stand?", "options": [{"text": "20 feet", "correct": true, "rationale": "The Snellen test is done at 20 feet, which is the top number in every result."}, {"text": "10 feet", "correct": false, "rationale": "Standing at 10 feet would make the result inaccurate. The standard distance is 20 feet."}, {"text": "14 inches", "correct": false, "rationale": "14 inches is closer to a near-vision reading distance. The Snellen chart is read from 20 feet."}, {"text": "30 feet", "correct": false, "rationale": "The standard Snellen distance is 20 feet."}]},
{"id": "u3cn-q08", "cat": "smellvision", "type": "mc", "stem": "A client who wears glasses is having visual acuity tested. Which does the nurse test first?", "options": [{"text": "Uncorrected vision, without the glasses", "correct": true, "rationale": "Uncorrected vision is tested first. Then each eye and both eyes together are tested."}, {"text": "Corrected vision, with the glasses on", "correct": false, "rationale": "Uncorrected vision is tested first, before the client puts on their glasses."}, {"text": "Both eyes together only", "correct": false, "rationale": "Each eye is tested separately as well as both together, so a problem in one eye isn't missed."}, {"text": "Near vision only", "correct": false, "rationale": "The Snellen chart tests distance vision from 20 feet."}]},
{"id": "u3cn-q09", "cat": "smellvision", "type": "mc", "stem": "A client cannot read English letters. How should the nurse test visual acuity?", "options": [{"text": "Use a picture chart or an E chart", "correct": true, "rationale": "A picture chart or E chart lets the client show what they see without reading English letters."}, {"text": "Skip the visual acuity test", "correct": false, "rationale": "CN II should still be assessed. A picture or E chart makes that possible."}, {"text": "Ask a family member to read the letters for the client", "correct": false, "rationale": "A family member reading the chart tests their vision, not the client's."}, {"text": "Test only the six cardinal positions of gaze", "correct": false, "rationale": "Cardinal gaze tests eye movement (CN III, IV, VI), not visual acuity (CN II)."}]},
{"id": "u3cn-q10", "cat": "eyemovement", "type": "dragdrop", "stem": "Drag the cranial nerves tested with the six cardinal positions of gaze into the answer box.", "leftLabel": "Cranial nerves", "rightLabel": "Tested by cardinal gaze", "options": [{"text": "CN III, oculomotor", "correct": true, "rationale": "CN III moves most of the eye muscles and is tested with the six cardinal positions of gaze."}, {"text": "CN IV, trochlear", "correct": true, "rationale": "CN IV moves the eye down and inward and is tested with the six cardinal positions of gaze."}, {"text": "CN VI, abducens", "correct": true, "rationale": "CN VI moves the eye outward and is tested with the six cardinal positions of gaze."}, {"text": "CN II, optic", "correct": false, "rationale": "CN II carries vision and is tested with the Snellen chart."}, {"text": "CN V, trigeminal", "correct": false, "rationale": "CN V is tested with light touch on the face."}, {"text": "CN VIII, vestibulocochlear", "correct": false, "rationale": "CN VIII carries hearing and is tested with the whisper, Rinne and Weber tests."}]},
{"id": "u3cn-q11", "cat": "eyemovement", "type": "mc", "stem": "Which instruction should the nurse give when testing the six cardinal positions of gaze?", "options": [{"text": "\"Follow my finger with your eyes without moving your head.\"", "correct": true, "rationale": "The client follows the nurse's finger or pen in a wide \"H\" while keeping the head still, so only the eye muscles move."}, {"text": "\"Turn your head to follow my finger.\"", "correct": false, "rationale": "Moving the head lets the client follow the finger without fully using the eye muscles, which hides weakness."}, {"text": "\"Close one eye and read the smallest line.\"", "correct": false, "rationale": "That describes a Snellen visual acuity test for CN II."}, {"text": "\"Look at the light while I shine it in your eye.\"", "correct": false, "rationale": "That describes checking pupil response for PERRLA."}]},
{"id": "u3cn-q12", "cat": "eyemovement", "type": "mc", "stem": "Which finding during the six cardinal positions of gaze is expected?", "options": [{"text": "Smooth, full eye movements with both eyes moving in parallel", "correct": true, "rationale": "Both eyes should move smoothly and together through every position."}, {"text": "One eyelid drooping as the client looks up", "correct": false, "rationale": "A drooping eyelid is ptosis, an abnormal finding."}, {"text": "The eyes moving in different directions", "correct": false, "rationale": "The eyes should move in parallel. Movement in different directions is abnormal."}, {"text": "The client turning the head to follow the finger", "correct": false, "rationale": "The head should stay still. Turning it means the test wasn't done correctly."}]},
{"id": "u3cn-q13", "cat": "eyemovement", "type": "sata", "stem": "Which eye findings are abnormal? Select all that apply.", "options": [{"text": "Loss of visual fields", "correct": true, "rationale": "Loss of visual fields is an abnormal finding."}, {"text": "Asymmetric light reflex", "correct": true, "rationale": "The light reflex should be symmetric. An asymmetric reflex is abnormal."}, {"text": "Ptosis", "correct": true, "rationale": "Ptosis, a drooping eyelid, is an abnormal finding."}, {"text": "Parallel eye movements", "correct": false, "rationale": "Parallel eye movements are expected."}, {"text": "Pupils constrict when looking at a near object", "correct": false, "rationale": "Constricting for near objects is expected accommodation."}]},
{"id": "u3cn-q14", "cat": "eyemovement", "type": "mc", "stem": "In PERRLA, what does the final \"A\" stand for?", "options": [{"text": "Accommodation", "correct": true, "rationale": "PERRLA means Pupils Equal, Round, Reactive to Light, and Accommodation."}, {"text": "Alert", "correct": false, "rationale": "Alertness is part of the general survey, not PERRLA."}, {"text": "Abducens", "correct": false, "rationale": "Abducens is CN VI. The A in PERRLA stands for accommodation."}, {"text": "Asymmetric", "correct": false, "rationale": "Pupils should be equal; asymmetry would be abnormal. The A stands for accommodation."}]},
{"id": "u3cn-q15", "cat": "eyemovement", "type": "mc", "stem": "The nurse tests accommodation. Which response is expected?", "options": [{"text": "Pupils constrict for a near object and dilate for a distant one", "correct": true, "rationale": "The pupils get smaller to focus up close and larger to focus far away."}, {"text": "Pupils dilate for a near object and constrict for a distant one", "correct": false, "rationale": "This is reversed. Pupils constrict for near objects and dilate for distant ones."}, {"text": "Pupils stay the same size at every distance", "correct": false, "rationale": "Pupils should change size as focus shifts between near and far."}, {"text": "Only one pupil changes size", "correct": false, "rationale": "Both pupils should respond equally."}]},
{"id": "u3cn-q16", "cat": "eyemovement", "type": "mc", "stem": "The nurse shines a penlight into each pupil to check PERRLA. Which cranial nerve controls the pupil's response?", "options": [{"text": "CN III, oculomotor", "correct": true, "rationale": "CN III controls pupil constriction, so it is checked during PERRLA."}, {"text": "CN IV, trochlear", "correct": false, "rationale": "CN IV moves the eye but does not control the pupil."}, {"text": "CN VI, abducens", "correct": false, "rationale": "CN VI moves the eye outward but does not control the pupil."}, {"text": "CN VII, facial", "correct": false, "rationale": "CN VII controls facial expression, not the pupils."}]},
{"id": "u3cn-q17", "cat": "facial", "type": "mc", "stem": "To test the sensory part of CN V, what should the nurse do?", "options": [{"text": "With the client's eyes closed, touch both sides of the forehead, cheeks and chin with a cotton swab", "correct": true, "rationale": "Light touch on all three areas of the face, both sides, with the eyes closed tests CN V sensation."}, {"text": "Ask the client to smile and raise the eyebrows", "correct": false, "rationale": "Smiling and raising the eyebrows tests CN VII, the facial nerve."}, {"text": "Ask the client to shrug the shoulders against resistance", "correct": false, "rationale": "Shrugging tests CN XI, the spinal accessory nerve."}, {"text": "Ask the client to stick out the tongue", "correct": false, "rationale": "Sticking out the tongue tests CN XII, the hypoglossal nerve."}]},
{"id": "u3cn-q18", "cat": "facial", "type": "mc", "stem": "When the client smiles, the right side of the mouth droops. Which cranial nerve should the nurse suspect is affected?", "options": [{"text": "CN VII, facial", "correct": true, "rationale": "CN VII controls facial expression. Smiling should be symmetric, so a one-sided droop points to CN VII."}, {"text": "CN V, trigeminal", "correct": false, "rationale": "CN V carries sensation from the face. It doesn't control facial expression."}, {"text": "CN XII, hypoglossal", "correct": false, "rationale": "CN XII moves the tongue, not the muscles of facial expression."}, {"text": "CN III, oculomotor", "correct": false, "rationale": "CN III raises the eyelid and moves the eye, but doesn't control the mouth."}]},
{"id": "u3cn-q19", "cat": "facial", "type": "mc", "stem": "During a CN V sensory test, the nurse touches the client's cheek with a cotton swab while the client watches. What should the nurse correct?", "options": [{"text": "The client's eyes should be closed", "correct": true, "rationale": "With the eyes open, the client can see the swab coming and respond to sight, not touch. Eyes stay closed."}, {"text": "A tongue blade should be used instead of a cotton swab", "correct": false, "rationale": "A cotton swab is the right tool for light touch. A tongue blade is used for the \"Ah\" test."}, {"text": "Only one side of the face should be tested", "correct": false, "rationale": "Both sides are tested so they can be compared."}, {"text": "The swab should be placed on the neck instead", "correct": false, "rationale": "CN V is tested on the forehead, cheeks and chin."}]},
{"id": "u3cn-q20", "cat": "facial", "type": "sata", "stem": "Which actions does the nurse ask the client to perform to assess CN VII? Select all that apply.", "options": [{"text": "Smile", "correct": true, "rationale": "Smiling shows symmetry of the facial muscles, controlled by CN VII."}, {"text": "Raise the eyebrows", "correct": true, "rationale": "Raising the eyebrows tests the upper facial muscles, controlled by CN VII."}, {"text": "Puff out the cheeks", "correct": true, "rationale": "Puffing the cheeks tests facial muscle strength, controlled by CN VII."}, {"text": "Frown", "correct": true, "rationale": "Frowning tests the facial muscles, controlled by CN VII."}, {"text": "Identify a familiar scent", "correct": false, "rationale": "Identifying a scent tests CN I."}, {"text": "Shrug the shoulders", "correct": false, "rationale": "Shrugging tests CN XI."}]},
{"id": "u3cn-q21", "cat": "facial", "type": "mc", "stem": "Taste on the front of the tongue, such as salt and sweet, is carried by which cranial nerve?", "options": [{"text": "CN VII, facial", "correct": true, "rationale": "CN VII carries taste from the front of the tongue (salt, sweet)."}, {"text": "CN IX, glossopharyngeal", "correct": false, "rationale": "CN IX carries taste from the back of the tongue (sour, bitter)."}, {"text": "CN XII, hypoglossal", "correct": false, "rationale": "CN XII moves the tongue but does not carry taste."}, {"text": "CN V, trigeminal", "correct": false, "rationale": "CN V carries facial sensation, not taste."}]},
{"id": "u3cn-q22", "cat": "facial", "type": "mc", "stem": "Taste on the back of the tongue, such as sour and bitter, is carried by which cranial nerve?", "options": [{"text": "CN IX, glossopharyngeal", "correct": true, "rationale": "CN IX carries taste from the back of the tongue (sour, bitter)."}, {"text": "CN VII, facial", "correct": false, "rationale": "CN VII carries taste from the front of the tongue (salt, sweet)."}, {"text": "CN X, vagus", "correct": false, "rationale": "CN X is tested with \"Ah\" and swallowing, but back-of-tongue taste is CN IX."}, {"text": "CN I, olfactory", "correct": false, "rationale": "CN I carries smell, not taste."}]},
{"id": "u3cn-q23", "cat": "facial", "type": "mc", "stem": "The nurse asks the client to puff out the cheeks. Which cranial nerve is being tested?", "options": [{"text": "CN VII, facial", "correct": true, "rationale": "Puffing the cheeks uses the facial muscles, which CN VII controls."}, {"text": "CN V, trigeminal", "correct": false, "rationale": "CN V carries facial sensation; it doesn't control facial expression."}, {"text": "CN XII, hypoglossal", "correct": false, "rationale": "CN XII is tested by moving the tongue."}, {"text": "CN X, vagus", "correct": false, "rationale": "CN X is tested with \"Ah\" and swallowing."}]},
{"id": "u3cn-q24", "cat": "hearing", "type": "mc", "stem": "How should the nurse perform the whisper test?", "options": [{"text": "Cover one ear, whisper words toward the other, and have the client repeat them; then switch ears", "correct": true, "rationale": "Each ear is tested separately with the other ear covered, and the client repeats what they heard."}, {"text": "Whisper with both ears uncovered and ask the client to nod", "correct": false, "rationale": "With both ears open, a hearing loss in one ear can be missed. The client also repeats the words rather than nodding."}, {"text": "Place a vibrating tuning fork on top of the head", "correct": false, "rationale": "That is the Weber test, a different CN VIII test."}, {"text": "Shout words from across the room", "correct": false, "rationale": "Shouting doesn't test hearing at a soft level. The test uses a whisper."}]},
{"id": "u3cn-q25", "cat": "hearing", "type": "dragdrop", "stem": "Drag the tests used to assess CN VIII into the answer box.", "leftLabel": "Assessment tests", "rightLabel": "Tests CN VIII", "options": [{"text": "Whisper test", "correct": true, "rationale": "The whisper test checks hearing, one ear at a time, for CN VIII."}, {"text": "Rinne test", "correct": true, "rationale": "The Rinne tuning-fork test compares air and bone conduction for CN VIII."}, {"text": "Weber test", "correct": true, "rationale": "The Weber tuning-fork test checks whether sound is heard equally in both ears for CN VIII."}, {"text": "Snellen chart", "correct": false, "rationale": "The Snellen chart tests vision, CN II."}, {"text": "Shoulder shrug against resistance", "correct": false, "rationale": "The shoulder shrug tests CN XI."}, {"text": "Saying \"Ah\" with a tongue blade", "correct": false, "rationale": "Saying \"Ah\" tests CN IX and X."}]},
{"id": "u3cn-q26", "cat": "hearing", "type": "mc", "stem": "Which Rinne test result is expected?", "options": [{"text": "Air conduction lasts about twice as long as bone conduction", "correct": true, "rationale": "Normally air conduction is heard about twice as long as bone conduction, a 2:1 ratio."}, {"text": "Bone conduction lasts about twice as long as air conduction", "correct": false, "rationale": "This is reversed. Air conduction should last longer."}, {"text": "Air and bone conduction last the same amount of time", "correct": false, "rationale": "Air conduction should last about twice as long as bone conduction."}, {"text": "Sound is heard equally in both ears", "correct": false, "rationale": "Hearing sound equally in both ears is the expected Weber result, not Rinne."}]},
{"id": "u3cn-q27", "cat": "hearing", "type": "mc", "stem": "Which Weber test result is expected?", "options": [{"text": "Sound is heard equally in both ears", "correct": true, "rationale": "With the tuning fork on top of the head, sound should be heard equally on both sides."}, {"text": "Sound is louder in the right ear", "correct": false, "rationale": "Sound louder in one ear suggests a hearing loss."}, {"text": "Sound is louder in the left ear", "correct": false, "rationale": "Sound louder in one ear suggests a hearing loss."}, {"text": "Air conduction lasts twice as long as bone conduction", "correct": false, "rationale": "That is the expected Rinne result, not Weber."}]},
{"id": "u3cn-q28", "cat": "hearing", "type": "mc", "stem": "A client has a conductive hearing loss in the left ear. During the Weber test, where will the client hear the sound best?", "options": [{"text": "In the left ear", "correct": true, "rationale": "With conductive loss, sound is heard best in the affected ear, here the left."}, {"text": "In the right ear", "correct": false, "rationale": "Sound is heard best in the unaffected ear with sensorineural loss, not conductive loss."}, {"text": "Equally in both ears", "correct": false, "rationale": "Equal sound is the normal result. With a conductive loss, sound lateralizes to the affected ear."}, {"text": "In neither ear", "correct": false, "rationale": "The client can still hear the tuning fork. It is louder in the affected ear."}]},
{"id": "u3cn-q29", "cat": "hearing", "type": "mc", "stem": "A client has a sensorineural hearing loss in the right ear. During the Weber test, where will the client hear the sound best?", "options": [{"text": "In the left ear", "correct": true, "rationale": "With sensorineural loss, sound is heard best in the unaffected ear, here the left."}, {"text": "In the right ear", "correct": false, "rationale": "Sound is heard best in the affected ear with conductive loss, not sensorineural loss."}, {"text": "Equally in both ears", "correct": false, "rationale": "Equal sound is the normal result. With a sensorineural loss, sound lateralizes to the unaffected ear."}, {"text": "Only when the fork is held beside the right ear", "correct": false, "rationale": "In the Weber test the fork sits on top of the head, and sound is heard best in the unaffected ear."}]},
{"id": "u3cn-q30", "cat": "throatshouldertongue", "type": "mc", "stem": "The nurse places a tongue blade on the client's tongue and asks the client to say \"Ah.\" What is the nurse watching for?", "options": [{"text": "The soft palate and uvula rising", "correct": true, "rationale": "When the client says \"Ah,\" the soft palate and uvula should rise. This tests CN IX and X."}, {"text": "The tongue moving side to side", "correct": false, "rationale": "Tongue movement tests CN XII and is checked by sticking out the tongue and pushing it against each cheek."}, {"text": "The pupils constricting", "correct": false, "rationale": "Pupil constriction is checked with a penlight during PERRLA."}, {"text": "The eyes following a finger", "correct": false, "rationale": "Following a finger tests the six cardinal positions of gaze (CN III, IV, VI)."}]},
{"id": "u3cn-q31", "cat": "throatshouldertongue", "type": "dragdrop", "stem": "Drag the cranial nerves assessed when the client says \"Ah\" and swallows into the answer box.", "leftLabel": "Cranial nerves", "rightLabel": "Tested by \"Ah\" and swallowing", "options": [{"text": "CN IX, glossopharyngeal", "correct": true, "rationale": "CN IX helps raise the soft palate and swallow, so it is tested with \"Ah\" and swallowing."}, {"text": "CN X, vagus", "correct": true, "rationale": "CN X helps raise the soft palate and uvula and swallow, so it is tested the same way as CN IX."}, {"text": "CN VII, facial", "correct": false, "rationale": "CN VII is tested with facial movements like smiling and raising the eyebrows."}, {"text": "CN XII, hypoglossal", "correct": false, "rationale": "CN XII is tested by sticking out the tongue and pushing it against each cheek."}, {"text": "CN XI, spinal accessory", "correct": false, "rationale": "CN XI is tested with a shoulder shrug and head turns against resistance."}, {"text": "CN V, trigeminal", "correct": false, "rationale": "CN V is tested with light touch on the face."}]},
{"id": "u3cn-q32", "cat": "throatshouldertongue", "type": "mc", "stem": "A client who had a seizure is now awake and asking for something to drink. What should the nurse check first?", "options": [{"text": "The gag reflex and the client's ability to follow directions", "correct": true, "rationale": "Before giving food or fluids after a seizure, the nurse checks the gag reflex and that the client can follow directions, to prevent aspiration."}, {"text": "Visual acuity with a Snellen chart", "correct": false, "rationale": "Vision doesn't affect safe swallowing. The gag reflex does."}, {"text": "The sense of smell", "correct": false, "rationale": "Smell doesn't affect safe swallowing. The gag reflex does."}, {"text": "Shoulder strength against resistance", "correct": false, "rationale": "Shoulder strength (CN XI) doesn't show whether the client can swallow safely."}]},
{"id": "u3cn-q33", "cat": "throatshouldertongue", "type": "mc", "stem": "The nurse asks the client to shrug the shoulders against resistance and turn the head side to side. Which cranial nerve is being tested?", "options": [{"text": "CN XI, spinal accessory", "correct": true, "rationale": "CN XI controls the shoulder and neck muscles used to shrug and turn the head."}, {"text": "CN X, vagus", "correct": false, "rationale": "CN X is tested with \"Ah\" and swallowing."}, {"text": "CN XII, hypoglossal", "correct": false, "rationale": "CN XII controls tongue movement."}, {"text": "CN VIII, vestibulocochlear", "correct": false, "rationale": "CN VIII carries hearing and balance."}]},
{"id": "u3cn-q34", "cat": "throatshouldertongue", "type": "mc", "stem": "The nurse asks the client to stick out the tongue and push it against the inside of each cheek. Which cranial nerve is being tested?", "options": [{"text": "CN XII, hypoglossal", "correct": true, "rationale": "CN XII controls tongue movement and strength."}, {"text": "CN IX, glossopharyngeal", "correct": false, "rationale": "CN IX carries taste from the back of the tongue and helps swallowing, but doesn't move the tongue."}, {"text": "CN VII, facial", "correct": false, "rationale": "CN VII controls facial expression and front-of-tongue taste, not tongue movement."}, {"text": "CN V, trigeminal", "correct": false, "rationale": "CN V controls facial sensation and the jaw muscles."}]},
{"id": "u3cn-q35", "cat": "typesnames", "type": "dragdrop", "stem": "Drag the cranial nerves that are sensory only into the answer box.", "leftLabel": "Cranial nerves", "rightLabel": "Sensory only", "options": [{"text": "CN I, olfactory", "correct": true, "rationale": "CN I is sensory only: smell."}, {"text": "CN II, optic", "correct": true, "rationale": "CN II is sensory only: sight."}, {"text": "CN VIII, vestibulocochlear", "correct": true, "rationale": "CN VIII is sensory only: hearing."}, {"text": "CN V, trigeminal", "correct": false, "rationale": "CN V is both: facial sensation and the chewing muscles."}, {"text": "CN III, oculomotor", "correct": false, "rationale": "CN III is motor only: eye movement and pupil constriction."}, {"text": "CN XI, spinal accessory", "correct": false, "rationale": "CN XI is motor only: shoulder shrug and head turns."}]},
{"id": "u3cn-q36", "cat": "typesnames", "type": "dragdrop", "stem": "Drag the cranial nerves that are both sensory and motor into the answer box.", "leftLabel": "Cranial nerves", "rightLabel": "Both sensory and motor", "options": [{"text": "CN V, trigeminal", "correct": true, "rationale": "CN V is both: facial sensation (sensory) and the jaw muscles (motor)."}, {"text": "CN VII, facial", "correct": true, "rationale": "CN VII is both: front-of-tongue taste (sensory) and facial expression (motor)."}, {"text": "CN IX, glossopharyngeal", "correct": true, "rationale": "CN IX is both: back-of-tongue taste (sensory) and swallowing (motor)."}, {"text": "CN X, vagus", "correct": true, "rationale": "CN X is both: tested with \"Ah\" and swallowing."}, {"text": "CN II, optic", "correct": false, "rationale": "CN II is sensory only: sight."}, {"text": "CN XII, hypoglossal", "correct": false, "rationale": "CN XII is motor only: tongue movement."}]},
{"id": "u3cn-q37", "cat": "typesnames", "type": "sata", "stem": "Which cranial nerves are motor only? Select all that apply.", "options": [{"text": "CN III, oculomotor", "correct": true, "rationale": "CN III is motor only: eye movement and pupil constriction."}, {"text": "CN IV, trochlear", "correct": true, "rationale": "CN IV is motor only: eye movement."}, {"text": "CN VI, abducens", "correct": true, "rationale": "CN VI is motor only: eye movement."}, {"text": "CN XI, spinal accessory", "correct": true, "rationale": "CN XI is motor only: shoulder shrug and head turns."}, {"text": "CN XII, hypoglossal", "correct": true, "rationale": "CN XII is motor only: tongue movement."}, {"text": "CN VIII, vestibulocochlear", "correct": false, "rationale": "CN VIII is sensory only: hearing."}, {"text": "CN VII, facial", "correct": false, "rationale": "CN VII is both sensory and motor."}]},
{"id": "u3cn-q38", "cat": "typesnames", "type": "mc", "stem": "In the mnemonic \"Oh Oh Oh To Touch And Feel Very Good Velvet, AH,\" which nerve does \"Touch\" stand for?", "options": [{"text": "CN V, trigeminal", "correct": true, "rationale": "\"Touch\" is the 5th word, so it stands for CN V, the trigeminal nerve."}, {"text": "CN IV, trochlear", "correct": false, "rationale": "\"To,\" the 4th word, stands for CN IV, trochlear."}, {"text": "CN VI, abducens", "correct": false, "rationale": "\"And,\" the 6th word, stands for CN VI, abducens."}, {"text": "CN VII, facial", "correct": false, "rationale": "\"Feel,\" the 7th word, stands for CN VII, facial."}]},
{"id": "u3cn-q39", "cat": "typesnames", "type": "mc", "stem": "Which cranial nerve is CN X?", "options": [{"text": "Vagus", "correct": true, "rationale": "CN X is the vagus nerve, \"Velvet\" in the mnemonic."}, {"text": "Glossopharyngeal", "correct": false, "rationale": "The glossopharyngeal nerve is CN IX, \"Good\" in the mnemonic."}, {"text": "Spinal accessory", "correct": false, "rationale": "The spinal accessory nerve is CN XI, the \"A\" in \"AH.\""}, {"text": "Hypoglossal", "correct": false, "rationale": "The hypoglossal nerve is CN XII, the \"H\" in \"AH.\""}]},
{"id": "u3cn-q40", "cat": "typesnames", "type": "sata", "stem": "The nurse is completing a cranial nerve assessment. Which pairings of test and nerve are correct? Select all that apply.", "options": [{"text": "Snellen chart: CN II", "correct": true, "rationale": "The Snellen chart tests visual acuity, CN II."}, {"text": "Cotton swab on the forehead, cheeks, and chin: CN V", "correct": true, "rationale": "Light touch on the face with the eyes closed tests CN V sensation."}, {"text": "Whisper test: CN VIII", "correct": true, "rationale": "The whisper test checks hearing, CN VIII."}, {"text": "Shoulder shrug: CN XII", "correct": false, "rationale": "The shoulder shrug tests CN XI. CN XII is tested with tongue movement."}, {"text": "Smiling and raising the eyebrows: CN V", "correct": false, "rationale": "Smiling and raising the eyebrows test CN VII. CN V is tested with light touch on the face."}, {"text": "Identifying a scent: CN II", "correct": false, "rationale": "Identifying a scent tests CN I. CN II is vision."}]}
