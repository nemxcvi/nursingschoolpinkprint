<script>

  facial: {label:"CN V &amp; VII: Face &amp; Taste", hue:"aqua"},
  hearing: {label:"CN VIII: Hearing", hue:"blue"},

  byexam: {label:"Nerves by Exam", hue:"orange"}
};
var CARDS = [
[1, "typesnames", "Cranial nerve mnemonic", "Oh Oh Oh To Touch And Feel Very Good Velvet, AH (I–XII in order)"],
[2, "typesnames", "Cranial nerve basics", "Numbered I–XII; can be sensory, motor, or both; located in the brain but affect various body parts"],
[3, "typesnames", "Sensory-only cranial nerves", "I, II, VIII"],
[4, "typesnames", "Motor-only cranial nerves", "III, IV, VI, XI, XII"],
[5, "typesnames", "Sensory and motor cranial nerves", "V, VII, IX, X"],
[6, "smellvision", "CN I: Olfactory", "Sensory (smell); client closes eyes, occludes one nostril, and identifies a familiar scent (mint, coffee, toothpaste); repeat on the other side"],
[7, "smellvision", "Why not use alcohol to test smell", "Noxious odors stimulate CN V (trigeminal) and cause a misleading response"],
[8, "smellvision", "CN II: Optic", "Sensory; visual acuity (Snellen) and visual fields"],
[9, "smellvision", "Snellen chart", "Distance vision (myopia); client stands 20 ft away; test uncorrected vision first, then with correction; each eye, then both; use the E or picture chart for clients who can't read"],
[10, "smellvision", "Visual fields test", "Face the client 2 ft away; each covers the opposite eye; bring fingers in from 4 directions; client should see them at the same time as the nurse"],
[11, "eyemovement", "CN III: Oculomotor", "Motor; extraocular movements and pupil reaction (PERRLA)"],
[12, "eyemovement", "CN III functions", "Pupil constriction and dilation, upper eyelid elevation, eye movement"],
[13, "eyemovement", "PERRLA", "Pupils Equal (3–7 mm), Round, Reactive to Light (direct and consensual), Accommodation"],
[14, "eyemovement", "Accommodation", "Pupils dilate for far objects, then converge and constrict for near objects"],
[15, "eyemovement", "CN IV: Trochlear", "Motor; extraocular movements"],
[16, "eyemovement", "CN VI: Abducens", "Motor; extraocular movements"],
[17, "eyemovement", "Test for CN III, IV, VI", "Six cardinal positions of gaze"],
[18, "eyemovement", "Six cardinal positions of gaze", "Client follows your finger through a wide \"H\" without moving their head; expect full, smooth movement; a few beats of nystagmus in far lateral gaze is expected, but more is abnormal"],
[19, "facial", "CN V: Trigeminal", "Both. Sensory: light touch on the face with cotton (eyes closed). Motor: clench teeth while palpating the jaw muscles and TMJ"],
[20, "facial", "CN V branches", "Three branches covering the forehead, cheeks, and chin"],
[21, "facial", "CN V motor test", "Clench and release the jaw while palpating the temporal and masseter muscles; bite on a tongue blade"],
[22, "facial", "CN VII: Facial", "Both. Motor: smile, frown, puff cheeks, raise eyebrows, close eyes tightly, show teeth. Sensory: taste (salt/sweet) on the front of the tongue"],
[23, "facial", "CN VII strength check", "Client closes eyes tightly while you try to open them"],
[24, "facial", "Nerves for taste", "CN VII (front two-thirds: salt/sweet) and CN IX (back third: sour/bitter)"],
[25, "hearing", "CN VIII: Auditory or Vestibulocochlear", "Sensory; hearing and balance; whisper test"],
[26, "hearing", "Whisper test", "Occlude one ear and whisper; client should hear from 1–2 ft away without seeing your mouth (CN VIII)"],
[27, "hearing", "Rinne test", "Tuning fork on the mastoid (bone conduction), then in front of the ear canal (air conduction); expect AC &gt; BC (2:1)"],
[28, "hearing", "Weber test", "Tuning fork on top of the head; expect sound equal in both ears (negative Weber)"],
[29, "hearing", "Weber with hearing loss", "Conductive loss: heard best in the impaired ear. Sensorineural loss: heard best in the unaffected ear"],
[30, "throatshouldertongue", "CN IX: Glossopharyngeal", "Both. Sensory: taste (sour/bitter) on the back third of the tongue. Motor: swallowing, speech, gag reflex"],
[31, "throatshouldertongue", "CN X: Vagus", "Both. Sensory: gag reflex. Motor: swallowing, speech quality; observe the soft palate while the client says \"AH\""],
[32, "throatshouldertongue", "CN IX and X expected findings", "Uvula rises midline when the client says \"ahhh\"; client swallows easily"],
[33, "throatshouldertongue", "Palate and uvula", "Hard palate whitish and concave; soft palate light pink; both the soft palate and the midline uvula move with vocalization"],
[34, "throatshouldertongue", "When to test the gag reflex", "When the client can't open their mouth and say \"aah\" (such as unconscious clients), to assess airway protection"],
[35, "throatshouldertongue", "Gag reflex", "CN IX and X; explain the procedure first, then stimulate the back of the throat with a tongue blade"],
[36, "throatshouldertongue", "Nerves for swallowing", "CN IX and CN X; test with the gag reflex"],
[37, "throatshouldertongue", "CN XI: Spinal accessory", "Motor; shrug shoulders and turn head against resistance"],
[38, "throatshouldertongue", "CN XI muscles", "Sternocleidomastoid (turn head against resistance) and trapezius (shrug against resistance)"],
[39, "throatshouldertongue", "CN XII: Hypoglossal", "Motor; tongue movement and strength; push tongue into each cheek against resistance"],
[40, "throatshouldertongue", "CN XII expected findings", "Tongue protrudes midline; client can push against the cheek and articulate \"light, tight, dynamite\""],
[41, "byexam", "Nerves tested in the head and neck exam", "V, VII, XI"],
[42, "byexam", "Nerves tested in the eye exam", "II, III, IV, VI (and V for the corneal reflex)"],
[43, "byexam", "Nerves tested in the ears, nose, mouth, and throat exam", "I, VII, VIII, IX, X, XII"]
];
