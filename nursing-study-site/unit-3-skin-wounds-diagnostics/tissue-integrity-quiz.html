var bank = [
{"id": "w6ti-q01", "cat": "pressureinjuries", "type": "mc", "stem": "A nurse assesses a client's sacrum and finds intact skin with a localized area of redness that does not blanch when pressed. How should the nurse stage this pressure injury?", "options": [{"text": "Stage 1", "correct": true, "rationale": "Stage 1 is intact skin with localized nonblanchable erythema."}, {"text": "Stage 2", "correct": false, "rationale": "Stage 2 involves partial-thickness skin loss with exposed dermis or a blister. This skin is intact."}, {"text": "Deep tissue pressure injury", "correct": false, "rationale": "A DTPI has deep red, maroon, or purple discoloration, not simple redness."}, {"text": "Unstageable", "correct": false, "rationale": "Unstageable injuries have a wound bed hidden by slough or eschar."}]},
{"id": "w6ti-q02", "cat": "pressureinjuries", "type": "mc", "stem": "A client has a shallow open wound on the elbow with a moist, pink wound bed. No slough, fat, or deeper tissue is visible. How should the nurse stage this pressure injury?", "options": [{"text": "Stage 2", "correct": true, "rationale": "Stage 2 is partial-thickness skin loss with a moist pink or red wound bed and exposed dermis. Deeper tissues are not visible."}, {"text": "Stage 1", "correct": false, "rationale": "Stage 1 skin is intact. This wound is open."}, {"text": "Stage 3", "correct": false, "rationale": "Stage 3 is full-thickness skin loss with visible adipose tissue."}, {"text": "Stage 4", "correct": false, "rationale": "Stage 4 exposes bone, tendon, muscle, or other deep structures."}]},
{"id": "w6ti-q03", "cat": "pressureinjuries", "type": "mc", "stem": "A client has a pressure injury on the hip with full-thickness skin loss and visible adipose tissue. No bone, tendon, or muscle is visible. How should the nurse stage this injury?", "options": [{"text": "Stage 3", "correct": true, "rationale": "Stage 3 is full-thickness skin loss with visible adipose tissue. Fascia, muscle, tendon, and bone are not visible."}, {"text": "Stage 2", "correct": false, "rationale": "Stage 2 is partial-thickness loss. Adipose tissue is not visible."}, {"text": "Stage 4", "correct": false, "rationale": "Stage 4 requires exposed bone, tendon, muscle, ligament, cartilage, or fascia."}, {"text": "Unstageable", "correct": false, "rationale": "The wound bed is visible, so the injury can be staged."}]},
{"id": "w6ti-q04", "cat": "pressureinjuries", "type": "mc", "stem": "A nurse finds a sacral pressure injury in which bone is visible in the wound bed. How should the nurse stage this injury?", "options": [{"text": "Stage 4", "correct": true, "rationale": "Stage 4 is full-thickness skin and tissue loss with exposed bone, tendon, muscle, ligament, cartilage, or fascia."}, {"text": "Stage 3", "correct": false, "rationale": "Stage 3 shows adipose tissue but not bone or deeper structures."}, {"text": "Deep tissue pressure injury", "correct": false, "rationale": "A DTPI is a deep red, maroon, or purple discoloration, not an open wound with exposed bone."}, {"text": "Unstageable", "correct": false, "rationale": "The wound bed is visible, so the injury can be staged."}]},
{"id": "w6ti-q05", "cat": "pressureinjuries", "type": "mc", "stem": "A client's heel wound is completely covered with hard, black tissue, and the wound bed cannot be seen. How should the nurse classify this pressure injury?", "options": [{"text": "Unstageable", "correct": true, "rationale": "When slough or eschar hides the wound bed, the depth cannot be determined, so the injury is unstageable."}, {"text": "Stage 4", "correct": false, "rationale": "The depth can't be confirmed while eschar covers the bed. Once removed, it may be stage 3 or 4."}, {"text": "Stage 1", "correct": false, "rationale": "Stage 1 is intact skin with nonblanchable redness."}, {"text": "Deep tissue pressure injury", "correct": false, "rationale": "A DTPI is a deep red, maroon, or purple discoloration, not a wound covered with eschar."}]},
{"id": "w6ti-q06", "cat": "pressureinjuries", "type": "mc", "stem": "A nurse finds an area of intact skin on a client's heel with persistent, nonblanchable maroon-purple discoloration. The client reports pain at the site. How should the nurse classify this finding?", "options": [{"text": "Deep tissue pressure injury", "correct": true, "rationale": "A DTPI presents as persistent, nonblanchable deep red, maroon, or purple discoloration of intact or broken skin."}, {"text": "Stage 1 pressure injury", "correct": false, "rationale": "Stage 1 is nonblanchable redness, not deep maroon or purple discoloration."}, {"text": "Stage 2 pressure injury", "correct": false, "rationale": "Stage 2 is partial-thickness skin loss. This skin is intact."}, {"text": "Ecchymosis", "correct": false, "rationale": "A bruise is not a pressure-related injury over a pressure point with persistent nonblanchable discoloration."}]},
{"id": "w6ti-q07", "cat": "pressureinjuries", "type": "dragdrop", "stem": "A nurse is staging a client's pressure injury. Which findings are consistent with a stage 3 pressure injury? Move the correct findings to the answer box.", "leftLabel": "Assessment findings", "rightLabel": "Stage 3 findings", "options": [{"text": "Full-thickness skin loss", "correct": true, "rationale": "Stage 3 is defined as full-thickness skin loss."}, {"text": "Visible adipose tissue", "correct": true, "rationale": "Adipose tissue is visible in a stage 3 pressure injury."}, {"text": "Rolled wound edges", "correct": true, "rationale": "Wound edges may be rolled (epibole) in stage 3."}, {"text": "Tunneling present", "correct": true, "rationale": "Undermining and tunneling may be present in stage 3."}, {"text": "Exposed bone", "correct": false, "rationale": "Exposed bone indicates a stage 4 pressure injury."}, {"text": "Intact skin with nonblanchable redness", "correct": false, "rationale": "Intact skin with nonblanchable redness is stage 1."}, {"text": "Ruptured serum-filled blister", "correct": false, "rationale": "A ruptured serum-filled blister is a stage 2 presentation."}]},
{"id": "w6ti-q08", "cat": "pressureinjuries", "type": "mc", "stem": "A nurse presses on a reddened area over a client's hip. The area turns white, then returns to red when the pressure is released. Which finding should the nurse document?", "options": [{"text": "Blanchable erythema", "correct": true, "rationale": "Redness that turns white with pressure and returns when released is blanchable erythema."}, {"text": "Stage 1 pressure injury", "correct": false, "rationale": "Stage 1 requires nonblanchable erythema. This area blanched."}, {"text": "Deep tissue pressure injury", "correct": false, "rationale": "A DTPI has persistent, nonblanchable deep red, maroon, or purple discoloration."}, {"text": "Stage 2 pressure injury", "correct": false, "rationale": "Stage 2 involves an open wound or blister. The skin here is intact."}]},
{"id": "w6ti-q09", "cat": "pressureinjuries", "type": "mc", "stem": "A client has a stable, dry, intact eschar on the heel. Which action should the nurse take?", "options": [{"text": "Leave the eschar in place and keep pressure off the heel", "correct": true, "rationale": "Secure eschar on the heel should not be softened or removed."}, {"text": "Apply a hydrogel to soften the eschar for removal", "correct": false, "rationale": "Stable heel eschar should not be softened."}, {"text": "Remove the eschar so the wound can be staged", "correct": false, "rationale": "Stable eschar on the heel should not be removed."}, {"text": "Document the wound as a stage 4 pressure injury", "correct": false, "rationale": "A wound covered with eschar is unstageable; its depth is unknown."}]},
{"id": "w6ti-q10", "cat": "pressureinjuries", "type": "dragdrop", "stem": "A nurse is reviewing a client's medical record. Which findings are risk factors for pressure injury development? Move the correct findings to the answer box.", "leftLabel": "Findings", "rightLabel": "Pressure injury risk factors", "options": [{"text": "Client is bedfast", "correct": true, "rationale": "Immobility is one of the greatest contributors to pressure injuries."}, {"text": "Decreased sensation in the lower extremities", "correct": true, "rationale": "Sensory loss keeps the client from feeling pressure-related discomfort."}, {"text": "Pedal pulses 1+ bilaterally", "correct": true, "rationale": "Diminished pulses suggest reduced perfusion, a risk factor."}, {"text": "Albumin 3.0 g/dL", "correct": true, "rationale": "Low albumin indicates malnutrition, which increases pressure injury risk."}, {"text": "Alert and oriented x3", "correct": false, "rationale": "This is an expected finding. A decreased level of consciousness is the risk factor."}, {"text": "Eats 100% of meals", "correct": false, "rationale": "Adequate nutrition lowers the risk of pressure injury."}]},
{"id": "w6ti-q11", "cat": "pressureinjuries", "type": "mc", "stem": "A nurse is caring for a client who is at risk for pressure injuries. Which interventions should the nurse include in the plan of care? Select all that apply.", "options": [{"text": "Reposition the client at least every 2 hours in bed", "correct": true, "rationale": "Clients in bed should be repositioned at least every 2 hours to relieve pressure."}, {"text": "Keep the head of the bed at 30 degrees or lower unless contraindicated", "correct": true, "rationale": "Keeping the head of the bed low reduces shear and sacral pressure."}, {"text": "Lift rather than pull the client up in bed", "correct": true, "rationale": "Pulling creates friction that damages the epidermis."}, {"text": "Have the client sit on a gel cushion when in a chair", "correct": true, "rationale": "Gel, air, or foam cushions redistribute weight away from the ischial areas."}, {"text": "Massage reddened bony prominences", "correct": false, "rationale": "Massaging bony prominences can damage deep tissues."}, {"text": "Apply cornstarch to the skin after bathing", "correct": false, "rationale": "Powder and cornstarch are abrasive and can be aspirated."}, {"text": "Reposition the client every 3 hours while in bed", "correct": false, "rationale": "Every 3 hours is not frequent enough. Reposition at least every 2 hours."}]},
{"id": "w6ti-q12", "cat": "pressureinjuries", "type": "mc", "stem": "A client keeps sliding down in bed while in high-Fowler's position. The nurse identifies that this movement places the client at risk for injury from which force?", "options": [{"text": "Shear", "correct": true, "rationale": "Shear occurs when deeper tissues are pulled down by gravity while the skin stays in contact with the bed, as when sliding down in high-Fowler's."}, {"text": "Moisture", "correct": false, "rationale": "Moisture causes maceration, not tissue layers pulling in opposite directions."}, {"text": "Pressure alone", "correct": false, "rationale": "Pressure is force directed into tissue. Sliding on an incline produces shear."}, {"text": "Immobility", "correct": false, "rationale": "Immobility is a risk factor, not a mechanical force."}]},
{"id": "w6ti-q13", "cat": "pressureinjuries", "type": "mc", "stem": "A nurse is teaching staff about the Braden Scale. Which statement should the nurse include?", "options": [{"text": "A lower total score means the client has a higher risk for skin breakdown.", "correct": true, "rationale": "Braden scores range from 6 to 23. The lower the score, the greater the risk."}, {"text": "A higher total score means the client has a higher risk for skin breakdown.", "correct": false, "rationale": "This is reversed. Lower scores indicate greater risk."}, {"text": "The scale measures the size of an existing pressure injury.", "correct": false, "rationale": "The Braden Scale assesses risk; it does not measure wounds."}, {"text": "The scale includes pain, temperature, and blood pressure.", "correct": false, "rationale": "The six categories are sensory perception, moisture, activity, mobility, nutrition, and friction and shear."}]},
{"id": "w6ti-q14", "cat": "skinassessment", "type": "mc", "stem": "A nurse is assessing a client who has a dark skin tone for a stage 1 pressure injury. Which actions should the nurse take? Select all that apply.", "options": [{"text": "Palpate the area for warmth or coolness compared to surrounding skin", "correct": true, "rationale": "Temperature changes may be the first indicator in darker-pigmented skin."}, {"text": "Feel for hardened or boggy tissue", "correct": true, "rationale": "Changes in tissue consistency, such as induration, can indicate injury."}, {"text": "Look for an area darker than the adjacent skin", "correct": true, "rationale": "In dark skin, injury often appears as an area darker than the surrounding skin."}, {"text": "Ask the client about pain or changes in sensation", "correct": true, "rationale": "Localized pain and altered sensation are important indicators."}, {"text": "Rely on whether the area blanches when pressed", "correct": false, "rationale": "Nonblanchable erythema is difficult to detect in dark skin, so the nurse must also palpate and use other cues."}]},
{"id": "w6ti-q15", "cat": "skinassessment", "type": "mc", "stem": "A nurse is assessing a client who has a dark skin tone for cyanosis. Which areas should the nurse inspect? Select all that apply.", "options": [{"text": "Oral mucosa", "correct": true, "rationale": "Mucous membranes are reliable places to detect color changes in dark skin."}, {"text": "Conjunctiva", "correct": true, "rationale": "The conjunctiva is one of the areas to check for cyanosis."}, {"text": "Palms and soles", "correct": true, "rationale": "Palms and soles have lighter pigmentation, making color changes easier to see."}, {"text": "Nail beds", "correct": true, "rationale": "Nail beds are a reliable site to assess for cyanosis."}, {"text": "Skin over the upper back", "correct": false, "rationale": "Pigmented skin over the back makes cyanosis difficult to see."}]},
{"id": "w6ti-q16", "cat": "skinassessment", "type": "mc", "stem": "A nurse is performing integumentary assessments on a group of clients. Which finding is the nurse's priority?", "options": [{"text": "Cyanosis", "correct": true, "rationale": "Cyanosis indicates hypoxia. Using the ABC approach, impaired oxygenation is the priority."}, {"text": "Jaundice", "correct": false, "rationale": "Jaundice indicates liver dysfunction or RBC destruction but is not the priority over impaired oxygenation."}, {"text": "Erythema", "correct": false, "rationale": "Erythema indicates inflammation or vasodilation and is not the priority over oxygenation."}, {"text": "Ecchymosis", "correct": false, "rationale": "A bruise is not the priority over impaired oxygenation."}]},
{"id": "w6ti-q17", "cat": "skinassessment", "type": "mc", "stem": "A nurse presses over a client's medial malleolus and notes a 4 mm indentation that takes 12 seconds to rebound. How should the nurse document this finding?", "options": [{"text": "2+ pitting edema", "correct": true, "rationale": "2+ (mild) edema is a 4 mm pit with a 10- to 15-second skin response."}, {"text": "1+ pitting edema", "correct": false, "rationale": "1+ (trace) is a 2 mm pit with a rapid response."}, {"text": "3+ pitting edema", "correct": false, "rationale": "3+ (moderate) is a 6 mm pit with a prolonged response."}, {"text": "4+ pitting edema", "correct": false, "rationale": "4+ (severe) is an 8 mm pit with a prolonged response."}]},
{"id": "w6ti-q18", "cat": "lesionsvascular", "type": "dragdrop", "stem": "A nurse is teaching a class about skin lesions. Which are primary skin lesions? Move the correct lesions to the answer box.", "leftLabel": "Skin lesions", "rightLabel": "Primary lesions", "options": [{"text": "Macule", "correct": true, "rationale": "A macule is a flat color change arising from healthy skin, such as a freckle."}, {"text": "Vesicle", "correct": true, "rationale": "A vesicle is a serous fluid-filled elevation arising from healthy skin, such as a blister."}, {"text": "Pustule", "correct": true, "rationale": "A pustule is a pus-filled elevation arising from healthy skin, such as acne."}, {"text": "Nodule", "correct": true, "rationale": "A nodule is a firm, deep lesion arising from healthy skin, such as a wart."}, {"text": "Crust", "correct": false, "rationale": "A crust (scab) is a secondary lesion formed from dried blood, serum, or pus."}, {"text": "Erosion", "correct": false, "rationale": "An erosion, such as a ruptured vesicle, is a secondary lesion."}, {"text": "Fissure", "correct": false, "rationale": "A fissure, such as in tinea pedis, is a secondary lesion."}]},
{"id": "w6ti-q19", "cat": "lesionsvascular", "type": "mc", "stem": "A nurse is assessing an older adult client's skin. Which finding should the nurse report as unexpected?", "options": [{"text": "Petechiae on the forearms", "correct": true, "rationale": "Petechiae are not an expected aging change and may indicate illness."}, {"text": "Thin, translucent skin", "correct": false, "rationale": "Thinning skin is an expected change with aging."}, {"text": "Decreased skin elasticity", "correct": false, "rationale": "Loss of elasticity is an expected change with aging."}, {"text": "Wrinkles", "correct": false, "rationale": "Increased wrinkling is an expected change with aging."}]},
{"id": "w6ti-q20", "cat": "woundassessment", "type": "mc", "stem": "A nurse is assessing an open wound with a yellow wound bed. Using the RYB color code, which action should the nurse anticipate?", "options": [{"text": "Clean the wound", "correct": true, "rationale": "Yellow indicates slough or purulent drainage, so the wound needs to be cleaned."}, {"text": "Cover the wound to protect it", "correct": false, "rationale": "Covering is the action for a red, healthy granulating wound."}, {"text": "Debride necrotic tissue", "correct": false, "rationale": "Debridement is the action for a black wound with eschar."}, {"text": "Leave the wound open to air", "correct": false, "rationale": "This is not part of the RYB code."}]},
{"id": "w6ti-q21", "cat": "woundassessment", "type": "mc", "stem": "A nurse notes thin, watery, pale pink drainage on a client's surgical dressing. How should the nurse document this drainage?", "options": [{"text": "Serosanguineous", "correct": true, "rationale": "Serosanguineous drainage contains serum and blood and appears watery and pale pink."}, {"text": "Serous", "correct": false, "rationale": "Serous drainage is clear or slightly yellow."}, {"text": "Sanguineous", "correct": false, "rationale": "Sanguineous drainage is thicker and reddish because it contains red blood cells."}, {"text": "Purulent", "correct": false, "rationale": "Purulent drainage is thick and yellow, tan, green, or brown."}]},
{"id": "w6ti-q22", "cat": "woundassessment", "type": "mc", "stem": "A nurse finds thick, green, foul-smelling drainage on a client's wound dressing. Which action should the nurse take?", "options": [{"text": "Report the finding to the provider", "correct": true, "rationale": "Purulent drainage indicates infection and should be reported to the provider."}, {"text": "Document it as an expected finding", "correct": false, "rationale": "Purulent drainage is not expected; it indicates infection."}, {"text": "Apply a transparent film dressing", "correct": false, "rationale": "Films are for superficial wounds with minimal exudate and do not address infection."}, {"text": "Continue to monitor at the next dressing change", "correct": false, "rationale": "Signs of infection need to be reported, not just monitored."}]},
{"id": "w6ti-q23", "cat": "woundassessment", "type": "mc", "stem": "A nurse is documenting the location of tunneling in a client's sacral wound using the clock method. Which statement about this method is accurate?", "options": [{"text": "12:00 points toward the client's head.", "correct": true, "rationale": "With the clock method, 12:00 is toward the head and 6:00 is toward the feet."}, {"text": "12:00 points toward the client's feet.", "correct": false, "rationale": "6:00 points toward the feet; 12:00 points toward the head."}, {"text": "12:00 is always the deepest part of the wound.", "correct": false, "rationale": "Clock positions describe location relative to the body, not depth."}, {"text": "The clock method replaces measuring length and width.", "correct": false, "rationale": "Length, width, and depth are still measured in centimeters."}]},
{"id": "w6ti-q24", "cat": "woundassessment", "type": "mc", "stem": "A nurse is assessing a client's sutured abdominal incision on postoperative day 8. Which finding is expected?", "options": [{"text": "Bright pink incision line with well-approximated edges", "correct": true, "rationale": "Incisions are red on days 1 to 4, bright pink on days 5 to 14, and pale pink from day 15 to 1 year."}, {"text": "Edema and drainage increasing since day 5", "correct": false, "rationale": "Edema and exudate should progressively decrease and resolve by postoperative day 5."}, {"text": "Separated wound edges with serosanguineous drainage", "correct": false, "rationale": "Separated edges suggest dehiscence, which is a complication."}, {"text": "Purulent drainage at the suture line", "correct": false, "rationale": "Purulent drainage indicates infection."}]},
{"id": "w6ti-q25", "cat": "dressingsclosuresdrains", "type": "mc", "stem": "A client has a surgical wound with a Penrose drain. Which statement about this drain is accurate?", "options": [{"text": "It is an open, passive drain, and drainage collects on gauze placed around it.", "correct": true, "rationale": "A Penrose drain uses gravity and has no collection chamber, so a gauze dressing around it absorbs the drainage."}, {"text": "It uses negative pressure from a compressed bulb.", "correct": false, "rationale": "Negative pressure from a bulb describes an active bulb suction drain."}, {"text": "Drainage collects in a closed bottle that is changed when half full.", "correct": false, "rationale": "This describes a large bottle drain, which is a closed system."}, {"text": "It is a closed system that is less likely to become contaminated.", "correct": false, "rationale": "A Penrose drain is open. Closed drains are less likely to become contaminated."}]},
{"id": "w6ti-q26", "cat": "dressingsclosuresdrains", "type": "dragdrop", "stem": "A nurse is caring for a client who has a surgical wound drain. Which findings should the nurse report to the provider? Move the correct findings to the answer box.", "leftLabel": "Findings", "rightLabel": "Report to the provider", "options": [{"text": "A sudden, significant increase in drainage", "correct": true, "rationale": "A significant increase or decrease in drainage should be reported."}, {"text": "Blood clots in the drainage", "correct": true, "rationale": "Clots should be reported to the provider."}, {"text": "The drain was accidentally pulled out", "correct": true, "rationale": "Accidental drain removal should be reported to the provider."}, {"text": "Purulent drainage and redness at the insertion site", "correct": true, "rationale": "Manifestations of infection should be reported."}, {"text": "Drainage changing from sanguineous to serosanguineous", "correct": false, "rationale": "This is the expected progression as the wound heals."}, {"text": "Mild tenderness at the site on the first postoperative day", "correct": false, "rationale": "Some tenderness and edema are expected for the first several days."}, {"text": "The bulb is half full", "correct": false, "rationale": "The nurse empties the bulb when it is more than half full; this does not need to be reported."}]},
{"id": "w6ti-q27", "cat": "dressingsclosuresdrains", "type": "mc", "stem": "A nurse has just emptied a client's bulb suction drain. Which action should the nurse take next?", "options": [{"text": "Squeeze the bulb flat and replace the plug", "correct": true, "rationale": "Recompressing the bulb before plugging the port reestablishes suction in the wound."}, {"text": "Replace the plug, then let the bulb expand fully", "correct": false, "rationale": "An expanded bulb has no suction. It must be compressed before replacing the plug."}, {"text": "Leave the plug open so the drain can air out", "correct": false, "rationale": "Leaving the port open breaks the closed system and suction."}, {"text": "Wait until the next shift to document the output", "correct": false, "rationale": "The nurse should document the date, time, color, and volume right after emptying."}]},
{"id": "w6ti-q28", "cat": "dressingsclosuresdrains", "type": "mc", "stem": "A nurse is selecting a dressing for a wound with a large amount of exudate. Which dressing is most appropriate?", "options": [{"text": "Alginate", "correct": true, "rationale": "Alginates are highly absorbent and recommended for moderate to highly exudative wounds."}, {"text": "Transparent film", "correct": false, "rationale": "Films absorb very little and are for superficial wounds with minimal exudate. Heavy drainage can leak and cause maceration."}, {"text": "Hydrogel", "correct": false, "rationale": "Hydrogels add moisture and are for dry wounds, not heavily draining ones."}, {"text": "Dry gauze only", "correct": false, "rationale": "Gauze absorbs some exudate but is not the best choice for heavy drainage."}]},
{"id": "w6ti-q29", "cat": "dressingsclosuresdrains", "type": "mc", "stem": "A nurse removes a hydrocolloid dressing and finds a yellow, gelatinous film with an odor on its underside. The wound edges are not red. Which action should the nurse take?", "options": [{"text": "Recognize this as an expected finding with hydrocolloid dressings", "correct": true, "rationale": "A foul-smelling yellow gel forms as bacteria are trapped under the dressing. The nurse should tell this apart from purulent drainage."}, {"text": "Report purulent drainage to the provider", "correct": false, "rationale": "This film is expected with hydrocolloids and is not, by itself, a sign of infection."}, {"text": "Switch to a transparent film dressing", "correct": false, "rationale": "There is no indication to change the dressing type."}, {"text": "Obtain a wound culture", "correct": false, "rationale": "There are no signs of infection to justify a culture."}]},
{"id": "w6ti-q30", "cat": "dressingsclosuresdrains", "type": "mc", "stem": "A client who was admitted for pneumonia has limited mobility and intact skin. Which dressing should the nurse plan to apply to help prevent a pressure injury?", "options": [{"text": "Foam dressing on the sacrum", "correct": true, "rationale": "A silicone foam dressing on the sacrum or heels within 24 hours of admission helps prevent hospital-acquired pressure injuries."}, {"text": "Alginate dressing on the sacrum", "correct": false, "rationale": "Alginates are for moderate to heavy exudate, not for prevention on intact skin."}, {"text": "Wet-to-dry dressing on the heels", "correct": false, "rationale": "Wet-to-dry dressings are used for debridement of open wounds."}, {"text": "Hydrogel on the sacrum", "correct": false, "rationale": "Hydrogels are used to add moisture to dry or necrotic wounds."}]},
{"id": "w6ti-q31", "cat": "dressingsclosuresdrains", "type": "mc", "stem": "A nurse is preparing to irrigate a client's wound. Which action is appropriate?", "options": [{"text": "Use a 30 to 60 mL syringe with a 19-gauge needle, held 1 inch above the wound", "correct": true, "rationale": "This setup provides about 8 psi, within the recommended 5 to 8 psi, from 2.5 cm (1 inch) above the wound."}, {"text": "Use hydrogen peroxide as the irrigation solution", "correct": false, "rationale": "Cytotoxic cleansers such as hydrogen peroxide damage tissue. Normal saline is typically used."}, {"text": "Touch the syringe tip to the wound bed", "correct": false, "rationale": "The tip is held above the wound to avoid contamination and trauma."}, {"text": "Stop after one flush regardless of the return", "correct": false, "rationale": "Irrigation is repeated until the solution flowing out of the wound is clear."}]},
{"id": "w6ti-q32", "cat": "woundhealing", "type": "mc", "stem": "A nurse is reviewing wound healing with newly licensed nurses. Which wound will heal by secondary intention?", "options": [{"text": "An open burn area", "correct": true, "rationale": "Wounds with tissue loss and widely separated edges, such as open burns and pressure injuries, are left open and heal by secondary intention."}, {"text": "A sutured surgical incision", "correct": false, "rationale": "Closed, approximated incisions heal by primary intention."}, {"text": "A laceration sealed with skin adhesive", "correct": false, "rationale": "Lacerations closed with adhesive heal by primary intention."}, {"text": "An abdominal wound left open until infection resolves, then sutured", "correct": false, "rationale": "A wound closed after a delay heals by tertiary intention (delayed primary closure)."}]},
{"id": "w6ti-q33", "cat": "woundhealing", "type": "dragdrop", "stem": "Which wounds heal by primary intention? Move the correct wounds to the answer box.", "leftLabel": "Wounds", "rightLabel": "Primary intention", "options": [{"text": "Sutured surgical incision", "correct": true, "rationale": "Clean incisions closed with sutures heal by primary intention."}, {"text": "Stapled surgical incision", "correct": true, "rationale": "Clean incisions closed with staples have approximated edges and heal by primary intention."}, {"text": "Clean laceration closed with skin adhesive", "correct": true, "rationale": "Clean lacerations closed with adhesive heal by primary intention."}, {"text": "Stage 3 pressure injury", "correct": false, "rationale": "Open pressure injuries have tissue loss and heal by secondary intention."}, {"text": "Open burn area", "correct": false, "rationale": "Open burns heal by secondary intention."}, {"text": "Abdominal wound sutured after being left open 7 days", "correct": false, "rationale": "Wounds closed after being left open heal by tertiary intention."}]},
{"id": "w6ti-q34", "cat": "woundhealing", "type": "mc", "stem": "A client's abdominal wound was left open for 7 days until an infection resolved and was then closed with sutures. Which type of wound healing does this describe?", "options": [{"text": "Tertiary intention", "correct": true, "rationale": "Tertiary intention (delayed primary closure) combines secondary and primary healing: the wound is left open 5 to 10 days, then closed."}, {"text": "Primary intention", "correct": false, "rationale": "Primary intention wounds are closed right away."}, {"text": "Secondary intention", "correct": false, "rationale": "Secondary intention wounds are left open to heal completely by granulation, not closed later."}, {"text": "Remodeling", "correct": false, "rationale": "Remodeling is a phase of wound healing, not a type of closure."}]},
{"id": "w6ti-q35", "cat": "woundhealing", "type": "mc", "stem": "A nurse observes red, granular tissue filling a client's wound 10 days after injury. Which phase of wound healing is the client in?", "options": [{"text": "Proliferative", "correct": true, "rationale": "The proliferative phase lasts from about day 3 to day 24. Granulation tissue and collagen form, and the edges begin to contract."}, {"text": "Inflammatory", "correct": false, "rationale": "The inflammatory (hemostatic) phase lasts 3 to 6 days and focuses on stopping bleeding and cleaning the wound."}, {"text": "Remodeling", "correct": false, "rationale": "Remodeling begins around day 21, when collagen is replaced with stronger collagen."}, {"text": "Hemostasis only", "correct": false, "rationale": "Hemostasis occurs right after injury, at the start of the inflammatory phase."}]},
{"id": "w6ti-q36", "cat": "woundhealing", "type": "dragdrop", "stem": "A nurse is caring for several postoperative clients. Which factors place a client at risk for delayed wound healing? Move the correct factors to the answer box.", "leftLabel": "Client factors", "rightLabel": "Delays wound healing", "options": [{"text": "Type 2 diabetes mellitus", "correct": true, "rationale": "Diabetes decreases peripheral perfusion and impairs sensation."}, {"text": "Long-term systemic corticosteroid use", "correct": true, "rationale": "Corticosteroids prevent the formation of collagen and fibroblasts."}, {"text": "Albumin 3.0 g/dL", "correct": true, "rationale": "Albumin below 3.5 g/dL reflects inadequate protein, which delays healing."}, {"text": "Smoking one pack per day", "correct": true, "rationale": "Smoking impairs oxygenation and clotting."}, {"text": "Two other open wounds", "correct": true, "rationale": "Multiple wounds compete for the nutrients needed to heal."}, {"text": "Follows a high-protein diet", "correct": false, "rationale": "Protein supports wound healing."}, {"text": "Hemoglobin 14 g/dL", "correct": false, "rationale": "This is not low. Low hemoglobin would impair oxygen delivery to the wound."}]},
{"id": "w6ti-q37", "cat": "woundhealing", "type": "mc", "stem": "A nurse is reviewing lab results for a client who has a pressure injury. Which finding increases the client's risk for delayed wound healing?", "options": [{"text": "Albumin 3.1 g/dL", "correct": true, "rationale": "Albumin below 3.5 g/dL indicates a protein deficit, increasing the risk of delayed healing and infection."}, {"text": "WBC 7,500/mm³", "correct": false, "rationale": "This is within the expected range of 5,000 to 10,000/mm³."}, {"text": "Hemoglobin 14 g/dL", "correct": false, "rationale": "This is not low. Adequate hemoglobin delivers oxygen to healing tissue."}, {"text": "Capillary glucose 98", "correct": false, "rationale": "This is within the expected range of 74 to 106."}]},
{"id": "w6ti-q38", "cat": "complications", "type": "mc", "stem": "A client who had abdominal surgery 24 hours ago reports a pulling sensation in the incision. The nurse finds the wound separated with viscera protruding. Which actions should the nurse take? Select all that apply.", "options": [{"text": "Cover the area with sterile, saline-soaked dressings", "correct": true, "rationale": "Moist sterile dressings keep exposed organs from drying and decrease contamination."}, {"text": "Position the client supine with the hips and knees bent", "correct": true, "rationale": "This position minimizes pressure on the abdomen."}, {"text": "Stay with the client and call for help", "correct": true, "rationale": "Evisceration is an emergency. The nurse stays with the client and gets help so the provider is notified immediately."}, {"text": "Keep the client NPO", "correct": true, "rationale": "The client will likely return to surgery."}, {"text": "Gently push the organs back into the abdomen", "correct": false, "rationale": "The nurse should never try to reinsert organs; doing so risks trauma and perforation."}, {"text": "Apply an abdominal binder snugly", "correct": false, "rationale": "A binder can help prevent, not treat, evisceration."}, {"text": "Offer a warm drink to help the client relax", "correct": false, "rationale": "The client should be kept NPO in preparation for surgery."}]},
{"id": "w6ti-q39", "cat": "complications", "type": "mc", "stem": "On postoperative day 6, a client's dressing shows a sudden increase in serosanguineous drainage. The client says they felt something \"give way\" while coughing. The nurse suspects which complication?", "options": [{"text": "Dehiscence", "correct": true, "rationale": "Dehiscence usually occurs 5 to 8 days after surgery and is often preceded by increased serosanguineous drainage and a popping or giving-way feeling with straining."}, {"text": "Hematoma", "correct": false, "rationale": "A hematoma is a localized collection of blood that looks like a red or blue bruise."}, {"text": "Wound infection", "correct": false, "rationale": "Infection presents with purulent drainage, redness, warmth, and fever."}, {"text": "Expected healing", "correct": false, "rationale": "Exudate should decrease and resolve by postoperative day 5, not suddenly increase."}]},
{"id": "w6ti-q40", "cat": "complications", "type": "mc", "stem": "A nurse is monitoring a client who had surgery this morning. During which time frame is the client at greatest risk for hemorrhage?", "options": [{"text": "24 to 48 hours after surgery", "correct": true, "rationale": "The risk of hemorrhage is greatest 24 to 48 hours after injury or surgery."}, {"text": "5 to 8 days after surgery", "correct": false, "rationale": "This is the usual time frame for dehiscence."}, {"text": "2 to 11 days after surgery", "correct": false, "rationale": "This is the usual time frame for wound infection to appear."}, {"text": "After the sutures are removed", "correct": false, "rationale": "Hemorrhage risk is highest in the first 24 to 48 hours."}]}
];
